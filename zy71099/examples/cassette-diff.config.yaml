ignoreOrder: true
ignoreFields:
  - response.body.id
  - response.body.created_at
  - response.body.updated_at
  - response.body.timestamp
  - response.body.*_id
  - response.body.*_at
  - request.body.id
  - request.body.created_at
  - request.query.timestamp
  - request.query.nonce
  - request.headers.x-request-id
  - request.headers.x-trace-id
maskingRules:
  - field: authorization
    type: header
    pattern: ^Bearer\s+.+$
    replacement: Bearer ***MASKED***
  - field: token
    type: body
    pattern: .+
    replacement: '***MASKED***'
  - field: password
    type: body
    pattern: .+
    replacement: '***MASKED***'
  - field: secret
    type: body
    pattern: .+
    replacement: '***MASKED***'
normalizeHeaders: true
normalizeJsonKeys: true
tolerance: 0.8
