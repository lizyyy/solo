spring:
  application:
    name: waste-storage-api
  datasource:
    url: jdbc:h2:file:./data/wastedb
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080

waste:
  storage:
    max-storage-days: 90
    allowed-categories:
      - HW08
      - HW09
      - HW12
      - HW17
      - HW34
      - HW49
