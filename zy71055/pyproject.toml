[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-submodule-drift"
version = "0.1.0"
description = "Git 子模块漂移检测 CLI 工具 - 检测子模块版本漂移、游离头、嵌套子模块问题"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Dev Team"}]
keywords = ["git", "submodule", "drift", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
git-submodule-drift = "git_submodule_drift.cli:main"
gsd = "git_submodule_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"git_submodule_drift" = ["templates/*"]
