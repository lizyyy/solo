[tool.poetry]
name = "data-fix-preview"
version = "0.1.0"
description = "数据修复预演命令行工具"
authors = ["Your Name <your@email.com>"]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.0"
pandas = "^2.0.0"
rich = "^13.0.0"
pydantic = "^2.0.0"
python-dateutil = "^2.8.0"
openpyxl = "^3.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
datafix = "data_fix.cli:main"
