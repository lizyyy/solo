<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>停车错峰共享匹配系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>🅿️ 停车错峰共享匹配系统</h1>
            <div class="user-info">
                当前用户：<span id="currentUser">城更项目经理 阿宁</span>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="points">点位列表</button>
            <button class="tab-btn" data-tab="boundary">边界复核</button>
            <button class="tab-btn" data-tab="workflow">工作流</button>
            <button class="tab-btn" data-tab="stats">统计</button>
            <button class="tab-btn" data-tab="rules">边界规则</button>
        </nav>

        <main>
            <section id="points-tab" class="tab-content active">
                <div class="toolbar">
                    <div class="filters">
                        <select id="filterBoundary">
                            <option value="">全部边界状态</option>
                            <option value="normal">正常</option>
                            <option value="boundary_pending">边界待复核</option>
                            <option value="boundary_confirmed">边界已确认</option>
                        </select>
                        <select id="filterStage">
                            <option value="">全部工作阶段</option>
                            <option value="photo_imported">照片已导入</option>
                            <option value="bus_card_supplemented">公交刷卡已补充</option>
                            <option value="map_exported">地图已导出</option>
                        </select>
                        <button onclick="loadPoints()">刷新</button>
                    </div>
                    <button onclick="showAddPointModal()" class="btn-primary">+ 新增点位</button>
                </div>

                <div id="pointsList" class="points-grid"></div>
            </section>

            <section id="boundary-tab" class="tab-content">
                <div class="boundary-header">
                    <h2>⚠️ 边界点位复核 <span class="badge" id="pendingCount">0</span></h2>
                    <p class="hint">点位落在两个街道边界上时，需人工确认归属，别急着归正常</p>
                </div>
                <div id="boundaryList"></div>
            </section>

            <section id="workflow-tab" class="tab-content">
                <h2>📋 三步工作流</h2>
                <div class="workflow-steps">
                    <div class="step" id="step1">
                        <div class="step-number">1</div>
                        <div class="step-title">路口照片导入</div>
                        <div class="step-desc">导入路口照片，系统自动去重</div>
                    </div>
                    <div class="step-arrow">→</div>
                    <div class="step" id="step2">
                        <div class="step-number">2</div>
                        <div class="step-title">补看公交刷卡时段</div>
                        <div class="step-desc">补充公交刷卡数据，保留原始备注</div>
                    </div>
                    <div class="step-arrow">→</div>
                    <div class="step" id="step3">
                        <div class="step-number">3</div>
                        <div class="step-title">地图导出更新</div>
                        <div class="step-desc">边界待复核点位需先确认再导出</div>
                    </div>
                </div>
                <div id="workflowContent"></div>
            </section>

            <section id="stats-tab" class="tab-content">
                <h2>📊 数据统计</h2>
                <div id="statsCards" class="stats-grid"></div>
            </section>

            <section id="rules-tab" class="tab-content">
                <h2>📖 边界规则说明</h2>
                <div id="rulesList"></div>
            </section>
        </main>

        <div id="pointDetailModal" class="modal">
            <div class="modal-content wide">
                <div class="modal-header">
                    <h3 id="detailTitle">点位详情</h3>
                    <button onclick="closeModal('pointDetailModal')" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="detail-tabs">
                        <button class="detail-tab active" data-detail="basic">基本信息</button>
                        <button class="detail-tab" data-detail="photos">路口照片</button>
                        <button class="detail-tab" data-detail="busCards">公交刷卡时段</button>
                        <button class="detail-tab" data-detail="versions">版本历史</button>
                        <button class="detail-tab" data-detail="chart">图表/3D展示</button>
                    </div>
                    <div id="detailContent"></div>
                </div>
            </div>
        </div>

        <div id="addPointModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>新增点位</h3>
                    <button onclick="closeModal('addPointModal')" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="addPointForm">
                        <div class="form-group">
                            <label>点位名称</label>
                            <input type="text" name="name" required>
                        </div>
                        <div class="form-group">
                            <label>纬度</label>
                            <input type="number" step="0.000001" name="lat" required>
                        </div>
                        <div class="form-group">
                            <label>经度</label>
                            <input type="number" step="0.000001" name="lng" required>
                        </div>
                        <div class="form-group">
                            <label>所属街道（多个用逗号分隔）</label>
                            <input type="text" name="streets" placeholder="如：和平街道,新华街道">
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <textarea name="notes" rows="3" placeholder="原始备注内容，不会被清洗"></textarea>
                        </div>
                        <button type="submit" class="btn-primary">创建点位</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="versionCompareModal" class="modal">
            <div class="modal-content wide">
                <div class="modal-header">
                    <h3>版本对比</h3>
                    <button onclick="closeModal('versionCompareModal')" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="versionCompareContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
