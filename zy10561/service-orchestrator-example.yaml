# Service Orchestrator Configuration Example

services:
  - name: mysql
    port: 3306
    dependencies: []
    start_command: "docker run --rm -e MYSQL_ALLOW_EMPTY_PASSWORD=yes mysql:8.0"
    stop_command: "docker stop mysql"
    wait_before_start: 0
    wait_after_start: 5
    health_check:
      type: tcp
      port: 3306
      timeout: 5
      interval: 2
      max_retries: 30
    env:
      MYSQL_ROOT_PASSWORD: "secret"
    working_dir: "."

  - name: redis
    port: 6379
    dependencies: []
    start_command: "docker run --rm redis:7-alpine"
    wait_after_start: 2
    health_check:
      type: tcp
      port: 6379
      timeout: 5
      interval: 2
      max_retries: 20

  - name: api-gateway
    port: 8080
    dependencies:
      - mysql
      - redis
    start_command: "node /app/api-gateway/server.js"
    wait_after_start: 3
    health_check:
      type: http
      endpoint: "http://localhost:8080/health"
      expected_status: 200
      timeout: 5
      interval: 2
      max_retries: 30
    env:
      NODE_ENV: "development"
      PORT: "8080"

  - name: web-app
    port: 3000
    dependencies:
      - api-gateway
    start_command: "npm start"
    working_dir: "./web-app"
    health_check:
      type: command
      command: "curl -f http://localhost:3000"
      timeout: 10
      interval: 3
      max_retries: 20

  - name: worker
    dependencies:
      - redis
    start_command: "python worker.py"
    health_check:
      type: none
