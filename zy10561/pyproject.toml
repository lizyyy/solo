[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "service-orchestrator"
version = "0.1.0"
authors = [
  { name="Developer", email="dev@example.com" }
]
description = "Service startup order CLI tool with dependency management"
requires-python = ">=3.9"
dependencies = [
  "click>=8.0",
  "pyyaml>=6.0",
  "requests>=2.28",
  "rich>=12.0",
  "networkx>=3.0",
]

[project.scripts]
service-orchestrator = "service_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
