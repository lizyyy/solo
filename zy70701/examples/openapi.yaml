openapi: 3.0.0
info:
  title: 用户服务 API
  version: 1.0.0
  description: 用户管理接口服务
paths:
  /api/users:
    get:
      summary: 获取用户列表
      responses:
        '200':
          description: 成功返回用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 响应码
                  message:
                    type: string
                    description: 响应消息
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: 总数
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: 用户ID
                            name:
                              type: string
                              description: 用户名
                            email:
                              type: string
                              format: email
                              description: 邮箱地址
                            age:
                              type: integer
                              description: 年龄
                            created_at:
                              type: string
                              format: date-time
                              description: 创建时间
                required:
                  - code
                  - data
  /api/users/{id}:
    get:
      summary: 获取单个用户
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功返回用户信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      age:
                        type: integer
                      created_at:
                        type: string
                        format: date-time
                required:
                  - code
                  - data
