[project]
name = "first-aid-cert"
version = "0.1.0"
description = "企业急救培训证书到期管理 CLI 工具"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
first-aid = "first_aid_cert.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["first_aid_cert*"]
