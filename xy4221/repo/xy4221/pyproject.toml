[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "power-checker"
version = "0.1.0"
description = "临电负载对账员 - 剧场临时电力负载对账工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pandas>=1.3",
    "numpy>=1.20",
    "python-dateutil>=2.8",
    "pydantic>=1.8",
]

[project.scripts]
power-checker = "power_checker.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
