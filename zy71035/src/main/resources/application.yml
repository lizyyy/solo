server:
  port: 8080

spring:
  application:
    name: ski-binding-rental
  datasource:
    url: jdbc:h2:mem:skirental;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

app:
  rental:
    binding-release-tolerance: 1.5
    self-check-enabled: true
