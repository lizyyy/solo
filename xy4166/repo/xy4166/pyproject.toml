[project]
name = "deco-reviewer"
version = "0.1.0"
description = "减压曲线复核员 - 潜水科学计算CLI工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "rich>=12.0",
    "pytest>=7.0",
]

[project.scripts]
deco-reviewer = "deco_reviewer.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
