[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-ticket-cli"
version = "0.1.0"
description = "赛事志愿者餐券核销 CLI 工具"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "rich>=13.0",
    "python-dateutil>=2.8",
]

[project.scripts]
meal-ticket = "meal_ticket.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meal_ticket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
