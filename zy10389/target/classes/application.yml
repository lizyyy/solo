server:
  port: 8080

spring:
  application:
    name: api-tag-validation
  datasource:
    url: jdbc:h2:mem:tag_validation_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

logging:
  level:
    com.observability.tagvalidation: DEBUG
    org.springframework.web: INFO
