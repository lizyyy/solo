[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freq-coordinator"
version = "0.1.0"
description = "山地越野赛频点值守编排员 - 通信保障智能编排工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "ics>=0.7",
    "rich>=12.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
freq-coord = "freq_coordinator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["freq_coordinator"]
