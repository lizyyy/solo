<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐人直播打赏分账 - 小看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        .btn-success { background: #10b981; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-4px); }
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .stat-card .label { color: #6b7280; font-size: 14px; }
        .stat-card.total .number { color: #667eea; }
        .stat-card.revenue .number { color: #10b981; }
        .stat-card.anomaly .number { color: #ef4444; }
        .stat-card.verified .number { color: #3b82f6; }
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }
        .chart-card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .chart-card h3 {
            margin-bottom: 20px;
            color: #1f2937;
            font-size: 18px;
        }
        .chart-container { position: relative; height: 300px; }
        .cube-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            perspective: 1000px;
        }
        .cube {
            width: 150px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 10s infinite linear;
        }
        @keyframes rotate {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }
        .cube-face {
            position: absolute;
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-align: center;
            padding: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            backface-visibility: visible;
        }
        .cube-face.front { background: rgba(102,126,234,0.8); transform: translateZ(75px); }
        .cube-face.back { background: rgba(118,75,162,0.8); transform: rotateY(180deg) translateZ(75px); }
        .cube-face.right { background: rgba(16,185,129,0.8); transform: rotateY(90deg) translateZ(75px); }
        .cube-face.left { background: rgba(239,68,68,0.8); transform: rotateY(-90deg) translateZ(75px); }
        .cube-face.top { background: rgba(245,158,11,0.8); transform: rotateX(90deg) translateZ(75px); }
        .cube-face.bottom { background: rgba(59,130,246,0.8); transform: rotateX(-90deg) translateZ(75px); }
        .section {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .section h3 {
            margin-bottom: 20px;
            color: #1f2937;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-reserved { background: #fee2e2; color: #dc2626; }
        .badge-verified { background: #d1fae5; color: #059669; }
        .badge-high { background: #fee2e2; color: #dc2626; }
        .badge-medium { background: #fef3c7; color: #d97706; }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th { background: #f9fafb; font-weight: 600; color: #374151; }
        tr:hover { background: #f9fafb; }
        .action-link {
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .modal-header h2 { color: #1f2937; }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
        }
        .detail-section {
            margin-bottom: 20px;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
        }
        .detail-section h4 {
            color: #374151;
            margin-bottom: 12px;
        }
        .detail-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .detail-label { color: #6b7280; }
        .detail-value { color: #1f2937; font-weight: 500; }
        .anomaly-box {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 4px;
        }
        .button-group { display: flex; gap: 12px; margin-top: 20px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 8px; color: #374151; font-weight: 500; }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        .input-group textarea { min-height: 80px; resize: vertical; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 音乐人直播打赏分账</h1>
            <div>
                <button class="btn btn-primary" onclick="initDemo()">初始化演示数据</button>
                <button class="btn btn-success" onclick="refreshData()">刷新数据</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card total">
                <div class="number" id="stat-total">0</div>
                <div class="label">票单总数</div>
            </div>
            <div class="stat-card revenue">
                <div class="number" id="stat-revenue">¥0</div>
                <div class="label">分账总金额</div>
            </div>
            <div class="stat-card anomaly">
                <div class="number" id="stat-anomaly">0</div>
                <div class="label">待处理异常</div>
            </div>
            <div class="stat-card verified">
                <div class="number" id="stat-verified">0</div>
                <div class="label">已核销</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>📊 音乐人收入分布</h3>
                <div class="chart-container">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>🎲 分账流程3D示意</h3>
                <div class="cube-container">
                    <div class="cube">
                        <div class="cube-face front">票务导入</div>
                        <div class="cube-face back">报告生成</div>
                        <div class="cube-face right">音频校验</div>
                        <div class="cube-face left">异常检测</div>
                        <div class="cube-face top">店长复核</div>
                        <div class="cube-face bottom">核销确认</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>🗺️ 授权城市分布</h3>
                <div class="chart-container">
                    <canvas id="cityChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>📈 核销状态分布</h3>
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>

        <div class="section">
            <h3>📝 课时核销单 <span class="badge badge-reserved" id="anomaly-count">0 条异常</span></h3>
            <table>
                <thead>
                    <tr>
                        <th>核销单号</th>
                        <th>音乐人</th>
                        <th>直播日期</th>
                        <th>应结金额</th>
                        <th>状态</th>
                        <th>下一步</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="verification-table">
                </tbody>
            </table>
        </div>

        <div class="section">
            <h3>⚠️ 异常记录</h3>
            <table>
                <thead>
                    <tr>
                        <th>异常ID</th>
                        <th>票单号</th>
                        <th>类型</th>
                        <th>严重程度</th>
                        <th>状态</th>
                        <th>描述</th>
                    </tr>
                </thead>
                <tbody id="anomaly-table">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>票单详情</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="detail-content"></div>
            <div class="button-group" id="action-buttons"></div>
        </div>
    </div>

    <script>
        let revenueChart, cityChart, statusChart;
        let currentData = null;
        let currentTicketId = null;

        async function initDemo() {
            const res = await fetch('/api/init-demo');
            const data = await res.json();
            if (data.success) {
                alert(`演示数据初始化成功！\n票单: ${data.data.tickets}\n音频备注: ${data.data.audioRemarks}\n核销单: ${data.data.verifications}\n异常: ${data.data.anomalies}`);
                refreshData();
            }
        }

        async function refreshData() {
            const res = await fetch('/api/dashboard');
            const data = await res.json();
            if (data.success) {
                currentData = data.data;
                updateStats(data.data.summary);
                updateCharts(data.data.charts);
                updateVerificationTable(data.data.verifications);
                updateAnomalyTable(data.data.anomalies);
            }
        }

        function updateStats(summary) {
            document.getElementById('stat-total').textContent = summary.totalTickets;
            document.getElementById('stat-revenue').textContent = '¥' + summary.totalRevenue.toFixed(2);
            document.getElementById('stat-anomaly').textContent = summary.anomalyCount;
            document.getElementById('stat-verified').textContent = summary.verifiedCount;
            document.getElementById('anomaly-count').textContent = summary.anomalyCount + ' 条异常';
        }

        function updateCharts(charts) {
            if (revenueChart) revenueChart.destroy();
            if (cityChart) cityChart.destroy();
            if (statusChart) statusChart.destroy();

            const revenueCtx = document.getElementById('revenueChart').getContext('2d');
            revenueChart = new Chart(revenueCtx, {
                type: 'bar',
                data: {
                    labels: charts.revenueByMusician.map(d => d.name),
                    datasets: [{
                        label: '分账金额(元)',
                        data: charts.revenueByMusician.map(d => d.value),
                        backgroundColor: [
                            'rgba(102,126,234,0.8)',
                            'rgba(118,75,162,0.8)',
                            'rgba(16,185,129,0.8)',
                            'rgba(245,158,11,0.8)',
                            'rgba(239,68,68,0.8)'
                        ],
                        borderRadius: 8
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const cityCtx = document.getElementById('cityChart').getContext('2d');
            cityChart = new Chart(cityCtx, {
                type: 'doughnut',
                data: {
                    labels: charts.cityDistribution.map(d => d.name),
                    datasets: [{
                        data: charts.cityDistribution.map(d => d.count),
                        backgroundColor: [
                            '#667eea', '#764ba2', '#10b981', '#f59e0b', '#ef4444',
                            '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'
                        ]
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const statusCtx = document.getElementById('statusChart').getContext('2d');
            statusChart = new Chart(statusCtx, {
                type: 'pie',
                data: {
                    labels: charts.statusDistribution.map(d => d.name),
                    datasets: [{
                        data: charts.statusDistribution.map(d => d.value),
                        backgroundColor: ['#f59e0b', '#ef4444', '#10b981']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function updateVerificationTable(verifications) {
            const tbody = document.getElementById('verification-table');
            tbody.innerHTML = verifications.map(v => `
                <tr>
                    <td>${v.verificationNo}</td>
                    <td>${v.musicianName}</td>
                    <td>${v.liveDate}</td>
                    <td>¥${v.finalRevenue.toFixed(2)}</td>
                    <td><span class="badge badge-${v.status}">${
                        v.status === 'pending' ? '待处理' : 
                        v.status === 'reserved' ? '已预留(异常)' : 
                        v.status === 'verified' ? '已核销' : v.status
                    }</span></td>
                    <td>${v.nextAction}</td>
                    <td><span class="action-link" onclick="showDetail('${v.ticketId}')">查看详情</span></td>
                </tr>
            `).join('');
        }

        function updateAnomalyTable(anomalies) {
            const tbody = document.getElementById('anomaly-table');
            tbody.innerHTML = anomalies.map(a => `
                <tr>
                    <td>${a.id}</td>
                    <td>${a.ticketId}</td>
                    <td>授权地区缺失</td>
                    <td><span class="badge badge-${a.severity}">${a.severity === 'high' ? '高' : a.severity}</span></td>
                    <td>${a.resolved ? '<span class="badge badge-verified">已解决</span>' : '<span class="badge badge-reserved">待处理</span>'}</td>
                    <td>${a.description.substring(0, 30)}...</td>
                </tr>
            `).join('');
        }

        async function showDetail(ticketId) {
            currentTicketId = ticketId;
            const res = await fetch(`/api/ticket/${ticketId}`);
            const data = await res.json();
            if (!data.success) { alert('加载失败'); return; }
            
            const { ticket, audioRemark, verification, anomalies } = data.data;
            
            let html = '';
            
            html += '<div class="detail-section">';
            html += '<h4>📄 票务导出表原始数据</h4>';
            html += `<div class="detail-row"><span class="detail-label">票单号:</span><span class="detail-value">${ticket.ticketId}</span></div>`;
            html += `<div class="detail-row"><span class="detail-label">音乐人:</span><span class="detail-value">${ticket.musicianName}</span></div>`;
            html += `<div class="detail-row"><span class="detail-label">直播日期:</span><span class="detail-value">${ticket.liveDate}</span></div>`;
            html += `<div class="detail-row"><span class="detail-label">打赏总额:</span><span class="detail-value">¥${ticket.totalTips.toFixed(2)}</span></div>`;
            html += `<div class="detail-row"><span class="detail-label">授权地区:</span><span class="detail-value">${ticket.authorizedCities.join('、')}</span></div>`;
            html += '</div>';
            
            if (audioRemark) {
                html += '<div class="detail-section">';
                html += '<h4>🎵 音频文件备注</h4>';
                html += `<div class="detail-row"><span class="detail-label">音频ID:</span><span class="detail-value">${audioRemark.audioFileId}</span></div>`;
                html += `<div class="detail-row"><span class="detail-label">实际授权地区:</span><span class="detail-value" style="color: ${audioRemark.actualAuthorizedCities.length > ticket.authorizedCities.length ? '#ef4444' : '#10b981'}">${audioRemark.actualAuthorizedCities.join('、')}</span></div>`;
                html += `<div class="detail-row"><span class="detail-label">备注:</span><span class="detail-value">${audioRemark.remark}</span></div>`;
                html += `<div class="detail-row"><span class="detail-label">更新人:</span><span class="detail-value">${audioRemark.updatedBy}</span></div>`;
                html += '</div>';
            }
            
            if (verification) {
                html += '<div class="detail-section">';
                html += '<h4>📝 课时核销单</h4>';
                html += `<div class="detail-row"><span class="detail-label">核销单号:</span><span class="detail-value">${verification.verificationNo}</span></div>`;
                html += `<div class="detail-row"><span class="detail-label">状态:</span><span class="detail-value">${
                    verification.status === 'reserved' ? '已预留(异常)' : 
                    verification.status === 'verified' ? '已核销' : '待处理'
                }</span></div>`;
                if (verification.reservedReason) {
                    html += `<div class="detail-row"><span class="detail-label">预留原因:</span><span class="detail-value" style="color:#ef4444">${verification.reservedReason}</span></div>`;
                }
                if (verification.missingMaterials && verification.missingMaterials.length > 0) {
                    html += `<div class="detail-row"><span class="detail-label">还缺材料:</span><span class="detail-value" style="color:#f59e0b">${verification.missingMaterials.join('；')}</span></div>`;
                }
                html += `<div class="detail-row"><span class="detail-label">下一步找:</span><span class="detail-value" style="color:#667eea">${verification.nextAction}</span></div>`;
                html += `<div class="detail-row"><span class="detail-label">操作说明:</span><span class="detail-value">${verification.actionNotes}</span></div>`;
                html += '</div>';
            }
            
            if (anomalies.length > 0) {
                html += '<h4>⚠️ 异常记录</h4>';
                anomalies.forEach(a => {
                    html += '<div class="anomaly-box">';
                    html += `<strong>类型:</strong> 授权地区缺失 | <strong>状态:</strong> ${a.resolved ? '已解决' : '待处理'}<br>`;
                    html += `<strong>描述:</strong> ${a.description}<br>`;
                    html += `<strong>原始值:</strong> <span style="color:#ef4444">${a.sourceData.originalValue}</span><br>`;
                    if (a.sourceData.expectedValue) {
                        html += `<strong>期望值:</strong> <span style="color:#10b981">${a.sourceData.expectedValue}</span>`;
                    }
                    html += '</div>';
                });
            }
            
            document.getElementById('detail-content').innerHTML = html;
            
            let buttonsHtml = '';
            if (verification && verification.status === 'reserved') {
                buttonsHtml += `
                    <button class="btn btn-warning" onclick="showEngineerForm()">📝 录音师小段补录</button>
                    <button class="btn btn-success" onclick="managerApprove()">✅ 店长复核通过</button>
                `;
            } else if (verification && verification.status === 'pending') {
                buttonsHtml += `<button class="btn btn-success" onclick="managerApprove()">✅ 店长复核通过</button>`;
            }
            buttonsHtml += `<button class="btn" style="background:#e5e7eb" onclick="closeModal()">关闭</button>`;
            
            document.getElementById('action-buttons').innerHTML = buttonsHtml;
            document.getElementById('detailModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
            currentTicketId = null;
        }

        function showEngineerForm() {
            const cities = prompt('请输入授权城市（用逗号分隔）：', '北京,上海,广州,深圳,杭州');
            if (cities === null) return;
            
            const remark = prompt('请输入备注：', '已核对所有授权地区，补全缺失城市');
            if (remark === null) return;
            
            engineerFix(cities.split(',').map(c => c.trim()), remark);
        }

        async function engineerFix(cities, remark) {
            const res = await fetch(`/api/engineer-fix/${currentTicketId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cities, remark })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                closeModal();
                refreshData();
            }
        }

        async function managerApprove() {
            const notes = prompt('请输入复核意见：', '数据无误，确认通过');
            if (notes === null) return;
            
            const res = await fetch(`/api/manager-review/${currentTicketId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'approve', notes })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                closeModal();
                refreshData();
            }
        }

        window.onload = () => {
            refreshData();
        };
    </script>
</body>
</html>
