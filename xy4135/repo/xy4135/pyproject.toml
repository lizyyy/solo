[project]
name = "juanzong-redactor"
version = "0.1.0"
description = "卷宗脱敏装订员 - 给律师助理用的本地证据材料脱敏归档工具"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "pypdf>=3.0.0",
    "Pillow>=9.0.0",
    "python-docx>=0.8.11",
    "python-dateutil>=2.8.0",
    "pandas>=1.3.0",
    "hashlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
juanzong = "juanzong_redactor.cli.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
