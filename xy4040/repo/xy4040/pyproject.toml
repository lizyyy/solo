[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-guardian"
version = "0.1.0"
description = "素材回卡守门员 - 纪录片外拍素材拷贝管理工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Media Guardian Team" }
]
keywords = ["media", "backup", "documentary", "sd-card", "copy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
  "Topic :: System :: Archiving :: Backup",
]

dependencies = [
  "click>=8.0.0",
  "rich>=12.0.0",
  "python-dateutil>=2.8.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
]

[project.scripts]
media-guardian = "media_guardian.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_guardian"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
