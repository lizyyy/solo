server:
  port: 8080

spring:
  application:
    name: api-transaction-inspection
  datasource:
    url: jdbc:h2:mem:inspection;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.api.inspection: DEBUG
    org.hibernate.SQL: DEBUG
