<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水培营养液校准器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #2c5530 0%, #3a7d44 100%);
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(44, 85, 48, 0.3);
        }
        
        header h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
        }
        
        header p {
            text-align: center;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .nav-tab {
            padding: 12px 24px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .nav-tab:hover {
            background: #e8f5e9;
            color: #2c5530;
        }
        
        .nav-tab.active {
            background: #2c5530;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .card-header h3 {
            font-size: 1.25rem;
            color: #2c5530;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #2c5530;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .tank-input-group {
            background: #f9fafb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #3a7d44;
        }
        
        .tank-input-group h4 {
            color: #2c5530;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #2c5530 0%, #3a7d44 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(44, 85, 48, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-info {
            background: #17a2b8;
            color: white;
        }
        
        .btn-info:hover {
            background: #138496;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .result-card {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .result-card.warning {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
        }
        
        .result-card.error {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .result-header h4 {
            font-size: 1.2rem;
            color: #1b5e20;
        }
        
        .risk-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-left: 10px;
        }
        
        .risk-badge.warning {
            background: #ff9800;
            color: white;
        }
        
        .risk-badge.error {
            background: #f44336;
            color: white;
        }
        
        .risk-badge.info {
            background: #2196f3;
            color: white;
        }
        
        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .param-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .param-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }
        
        .param-value {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c5530;
        }
        
        .param-value.high {
            color: #f44336;
        }
        
        .param-value.low {
            color: #ff9800;
        }
        
        .recommendations {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .recommendations h5 {
            color: #2c5530;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        
        .recommendation-list {
            list-style: none;
        }
        
        .recommendation-list li {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .recommendation-list li:last-child {
            border-bottom: none;
        }
        
        .recommendation-list .amount {
            font-weight: 600;
            color: #2c5530;
            background: #e8f5e9;
            padding: 4px 10px;
            border-radius: 4px;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
        
        .risk-alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        
        .risk-alert.warning {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
        }
        
        .risk-alert.error {
            background: #ffebee;
            border-left: 4px solid #f44336;
        }
        
        .risk-alert.info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        
        .risk-icon {
            font-size: 1.5rem;
        }
        
        .risk-content {
            flex: 1;
        }
        
        .risk-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .review-section {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .review-section h4 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .review-options {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .review-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 20px;
            background: white;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .review-option:hover {
            border-color: #2c5530;
        }
        
        .review-option.selected {
            background: #2c5530;
            color: white;
            border-color: #2c5530;
        }
        
        .review-option input {
            display: none;
        }
        
        .review-notes {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            resize: vertical;
        }
        
        .review-notes:focus {
            outline: none;
            border-color: #2c5530;
        }
        
        .export-section {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .tank-config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .tank-config-card {
            background: #f9fafb;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        
        .tank-config-card:hover {
            border-color: #2c5530;
        }
        
        .config-group {
            margin-bottom: 25px;
        }
        
        .config-group h4 {
            color: #2c5530;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e8f5e9;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .date-picker-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .date-picker-row label {
            font-weight: 500;
            white-space: nowrap;
        }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .history-table th,
        .history-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .history-table th {
            background: #f5f7fa;
            font-weight: 600;
            color: #2c5530;
        }
        
        .history-table tr:hover {
            background: #f9fafb;
        }
        
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-dot.normal { background: #4caf50; }
        .status-dot.warning { background: #ff9800; }
        .status-dot.error { background: #f44336; }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            header h1 {
                font-size: 1.5rem;
            }
            
            .nav-tabs {
                justify-content: center;
            }
            
            .nav-tab {
                padding: 10px 16px;
                font-size: 0.9rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .params-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .review-options {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌱 水培营养液校准器</h1>
            <p>智能计算补水、调酸碱、A/B 液添加建议，实时风险预警</p>
        </header>
        
        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="input">📝 数据录入</button>
            <button class="nav-tab" data-tab="results">📊 计算结果</button>
            <button class="nav-tab" data-tab="history">📜 历史记录</button>
            <button class="nav-tab" data-tab="config">⚙️ 系统设置</button>
        </div>
        
        <!-- 数据录入页面 -->
        <div id="tab-input" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <h3>今日数据录入</h3>
                    <div class="date-picker-row">
                        <label for="record-date">记录日期：</label>
                        <input type="date" id="record-date" class="form-control" style="width: auto;">
                    </div>
                </div>
                
                <div id="tank-inputs"></div>
                
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="calculateAll()">🔍 计算校准建议</button>
                    <button class="btn btn-secondary" onclick="resetInputs()">🔄 重置表单</button>
                </div>
            </div>
        </div>
        
        <!-- 计算结果页面 -->
        <div id="tab-results" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h3>校准计算结果</h3>
                    <div class="btn-group">
                        <button class="btn btn-info" onclick="switchTab('input')">← 返回修改</button>
                    </div>
                </div>
                
                <div id="results-container"></div>
                
                <div id="review-section" class="review-section" style="display: none;">
                    <h4>📋 复核确认</h4>
                    <div class="review-options">
                        <label class="review-option" data-value="approve">
                            <input type="radio" name="review-decision" value="approve">
                            ✅ 同意执行
                        </label>
                        <label class="review-option" data-value="adjust">
                            <input type="radio" name="review-decision" value="adjust">
                            ⚠️ 需要调整
                        </label>
                    </div>
                    <div class="form-group">
                        <label>复核备注：</label>
                        <textarea class="review-notes" id="review-notes" placeholder="请输入复核意见..."></textarea>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="saveReview()">💾 保存复核结论</button>
                    </div>
                </div>
                
                <div id="export-section" class="export-section" style="display: none;">
                    <button class="btn btn-info" onclick="exportMarkdown()">📄 导出 Markdown 操作单</button>
                    <button class="btn btn-primary" onclick="exportAudit()">📦 导出 JSON 审计包</button>
                </div>
            </div>
            
            <!-- 趋势图表 -->
            <div class="card">
                <div class="card-header">
                    <h3>📈 参数趋势分析</h3>
                    <select id="chart-tank-select" class="form-control" style="width: 200px;" onchange="updateChart()">
                        <option value="">选择水槽</option>
                    </select>
                </div>
                <div class="chart-container">
                    <canvas id="trend-chart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- 历史记录页面 -->
        <div id="tab-history" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h3>历史记录</h3>
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="loadHistory()">🔄 刷新</button>
                    </div>
                </div>
                <div id="history-container">
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <h3>暂无历史记录</h3>
                        <p>录入数据并保存后，记录将显示在这里</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 系统设置页面 -->
        <div id="tab-config" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h3>水槽配置</h3>
                    <button class="btn btn-primary" onclick="addTankConfig()">➕ 添加水槽</button>
                </div>
                <div id="tank-configs" class="tank-config-grid"></div>
                <div class="btn-group" style="margin-top: 20px;">
                    <button class="btn btn-success" onclick="saveTankConfigs()">💾 保存水槽配置</button>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>营养液配置</h3>
                </div>
                <div id="nutrient-config"></div>
                <div class="btn-group" style="margin-top: 20px;">
                    <button class="btn btn-success" onclick="saveNutrientConfig()">💾 保存营养液配置</button>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>风险预警设置</h3>
                </div>
                <div id="risk-config"></div>
                <div class="btn-group" style="margin-top: 20px;">
                    <button class="btn btn-success" onclick="saveRiskConfig()">💾 保存风险设置</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTanks = [];
        let currentConfig = {};
        let currentResults = [];
        let currentReview = null;
        let trendChart = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            await loadInitialData();
            setupNavigation();
            setupDatePicker();
            setupReviewOptions();
        });
        
        async function loadInitialData() {
            try {
                const [tanksRes, configRes, recordsRes] = await Promise.all([
                    fetch('/api/tanks'),
                    fetch('/api/config'),
                    fetch('/api/records')
                ]);
                
                currentTanks = await tanksRes.json();
                currentConfig = await configRes.json();
                
                renderTankInputs();
                renderTankConfigs();
                renderNutrientConfig();
                renderRiskConfig();
                updateChartTankSelect();
                
            } catch (error) {
                console.error('加载初始数据失败:', error);
                showError('加载数据失败，请刷新页面重试');
            }
        }
        
        function setupNavigation() {
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    switchTab(tab.dataset.tab);
                });
            });
        }
        
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.nav-tab');
            const contents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(t => t.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));
            
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            if (tabName === 'history') {
                loadHistory();
            }
            if (tabName === 'results' && currentResults.length === 0) {
                document.getElementById('results-container').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3>暂无计算结果</h3>
                        <p>请先在"数据录入"页面输入数据并计算</p>
                    </div>
                `;
            }
        }
        
        function setupDatePicker() {
            const dateInput = document.getElementById('record-date');
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
        }
        
        function setupReviewOptions() {
            const options = document.querySelectorAll('.review-option');
            options.forEach(option => {
                option.addEventListener('click', () => {
                    options.forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    const radio = option.querySelector('input');
                    radio.checked = true;
                });
            });
        }
        
        // 数据录入相关
        function renderTankInputs() {
            const container = document.getElementById('tank-inputs');
            
            if (currentTanks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏷️</div>
                        <h3>未配置水槽</h3>
                        <p>请先在"系统设置"页面配置水槽信息</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = currentTanks.map(tank => `
                <div class="tank-input-group" data-tank="${tank.id}">
                    <h4>${tank.name} (${tank.volume}L - ${tank.cropType})</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>EC 值 (mS/cm)</label>
                            <input type="number" step="0.1" min="0" class="form-control tank-ec" 
                                   data-tank="${tank.id}" placeholder="如: 1.5">
                        </div>
                        <div class="form-group">
                            <label>pH 值</label>
                            <input type="number" step="0.1" min="0" max="14" class="form-control tank-ph" 
                                   data-tank="${tank.id}" placeholder="如: 6.0">
                        </div>
                        <div class="form-group">
                            <label>水温 (°C)</label>
                            <input type="number" step="0.1" min="0" class="form-control tank-temp" 
                                   data-tank="${tank.id}" placeholder="如: 22">
                        </div>
                        <div class="form-group">
                            <label>液位 (%)</label>
                            <input type="number" step="1" min="0" max="100" class="form-control tank-level" 
                                   data-tank="${tank.id}" placeholder="如: 80">
                        </div>
                        <div class="form-group">
                            <label>作物阶段</label>
                            <select class="form-control tank-stage" data-tank="${tank.id}">
                                <option value="seedling">育苗期</option>
                                <option value="vegetative" selected>生长期</option>
                                <option value="flowering">开花期</option>
                                <option value="fruiting">结果期</option>
                            </select>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function resetInputs() {
            document.querySelectorAll('.tank-input-group input').forEach(input => {
                input.value = '';
            });
            document.querySelectorAll('.tank-input-group select').forEach(select => {
                select.value = 'vegetative';
            });
        }
        
        // 计算相关
        async function calculateAll() {
            const records = collectInputData();
            
            if (records.length === 0) {
                showError('请至少填写一个水槽的数据');
                return;
            }
            
            const date = document.getElementById('record-date').value;
            
            try {
                const response = await fetch('/api/calculate/batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ records, date })
                });

                renderResults();
                switchTab('results');
                
            } catch (error) {
                console.error('计算失败:', error);
                showError('计算失败，请重试');
            }

        function collectInputData() {
            const records = [];
            
            currentTanks.forEach(tank => {
                const ecInput = document.querySelector(`.tank-ec[data-tank="${tank.id}"]`);
                const phInput = document.querySelector(`.tank-ph[data-tank="${tank.id}"]`);
                const tempInput = document.querySelector(`.tank-temp[data-tank="${tank.id}"]`);
                const levelInput = document.querySelector(`.tank-level[data-tank="${tank.id}"]`);
                const stageSelect = document.querySelector(`.tank-stage[data-tank="${tank.id}"]`);
                
                if (ecInput.value && phInput.value && levelInput.value) {
                    records.push({
                        tankId: tank.id,
                        ec: parseFloat(ecInput.value),
                        ph: parseFloat(phInput.value),
                        temperature: tempInput.value ? parseFloat(tempInput.value) : 20,
                        level: parseFloat(levelInput.value),
                        cropStage: stageSelect.value
                    });
                }
            });
            
            return records;
        }
        
        async function saveRecords(records, date) {
            const recordsWithDate = records.map(r => ({
                ...r,
                timestamp: date ? new Date(date).toISOString() : new Date().toISOString()
            }));
            
            try {
                await fetch('/api/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(recordsWithDate)
                });
            } catch (error) {
                console.error('保存记录失败:', error);
            }
        }
        
        // 结果渲染

                const cardClass = hasErrors ? 'error' : hasWarnings ? 'warning' : '';
                
                const ecStatus = getStatusClass(rec.current.ec, rec.target.ec, 0.2);
                const phStatus = getPhStatusClass(rec.current.ph);
                
                return `
                    <div class="result-card ${cardClass}">
                        <div class="result-header">
                            <h4>${result.tankName}</h4>

                        </div>
                        
                        ${risks.length > 0 ? `
                            <div class="risk-alerts">
                                ${risks.map(risk => `

                                            <div class="risk-title">${getRiskTypeLabel(risk.type)}</div>
                                            <div>${risk.message}</div>
                                        </div>
                                    </div>

                        ` : ''}

                            <div class="param-item">
                                <div class="param-label">EC 值</div>
                                <div class="param-value ${ecStatus}">${rec.current.ec} <small>mS/cm</small></div>
                                <div class="param-label">目标: ${rec.target.ec}</div>
                            </div>
                            <div class="param-item">
                                <div class="param-label">pH 值</div>
                                <div class="param-value ${phStatus}">${rec.current.ph}</div>
                                <div class="param-label">目标: ${rec.target.ph}</div>
                            </div>
                            <div class="param-item">
                                <div class="param-label">水温</div>
                                <div class="param-value">${rec.current.temperature} <small>°C</small></div>
                            </div>

                                        <span>💧 补水</span>
                                        <span class="amount">${rec.recommendations.water} L</span>
                                    </li>

                                    <li>
                                        <span>🧪 添加 A 液</span>
                                        <span class="amount">${rec.recommendations.solutionA} ml</span>
                                    </li>
                                ` : ''}
                                ${rec.recommendations.solutionB > 0 ? `

                                        <span class="amount">${rec.recommendations.solutionB} ml</span>

                                ${rec.recommendations.acid > 0 ? `

        function getStatusClass(current, target, threshold) {
            const diff = current - target;
            if (Math.abs(diff) > threshold) {
                return diff > 0 ? 'high' : 'low';
            }
            return '';
        }
        
        function getPhStatusClass(ph) {
            const min = currentConfig.targetPH?.min || 5.5;
            const max = currentConfig.targetPH?.max || 6.5;
            if (ph < min) return 'low';
            if (ph > max) return 'high';
            return '';
        }
        
        function getStageLabel(stage) {
            const labels = {
                seedling: '育苗期',
                vegetative: '生长期',
                flowering: '开花期',
                fruiting: '结果期'
            };
            return labels[stage] || stage;
        }
        
        function getRiskTypeLabel(type) {
            const labels = {
                drift: '连续漂移',
                overdose: '过量投药',
                gap: '记录缺口',
                change_due: '换液提醒'
            };
            return labels[type] || type;
        }
        
        function getRiskIcon(severity) {
            const icons = {
                error: '🔴',
                warning: '🟡',
                info: '🔵'
            };
            return icons[severity] || '⚠️';
        }
        
        function hasAnyRecommendation(rec) {
            return rec.water > 0 || rec.solutionA > 0 || rec.solutionB > 0 || 
                   rec.acid > 0 || rec.base > 0;
        }

        // 历史记录
        async function loadHistory() {
            try {
                const [recordsRes, reviewsRes] = await Promise.all([
                    fetch('/api/records'),
                    fetch('/api/reviews')
                ]);
                
                const records = await recordsRes.json();
                const reviews = await reviewsRes.json();
                
                renderHistory(records, reviews);
            } catch (error) {
                console.error('加载历史失败:', error);
            }
        }
        
        function renderHistory(records, reviews) {
            const container = document.getElementById('history-container');
            
            if (records.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <h3>暂无历史记录</h3>
                        <p>录入数据并保存后，记录将显示在这里</p>
                    </div>
                `;
                return;
            }
            
            const groupedByDate = {};
            records.forEach(record => {
                const date = new Date(record.timestamp).toISOString().split('T')[0];
                if (!groupedByDate[date]) {
                    groupedByDate[date] = [];
                }
                groupedByDate[date].push(record);
            });
            
            container.innerHTML = `
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>水槽</th>
                            <th>EC</th>
                            <th>pH</th>
                            <th>水温</th>
                            <th>液位</th>
                            <th>作物阶段</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${Object.entries(groupedByDate)
                            .sort((a, b) => b[0].localeCompare(a[0]))
                            .map(([date, dateRecords]) => 
                                dateRecords.map(record => {
                                    const tank = currentTanks.find(t => t.id === record.tankId);
                                    const targetEC = currentConfig.targetEC?.[record.cropStage] || 1.8;
                                    const hasIssue = Math.abs(record.ec - targetEC) > 0.3 || 
                                                    record.ph < 5.5 || record.ph > 6.5;
                                    const statusClass = hasIssue ? 'warning' : 'normal';
                                    
                                    return `
                                        <tr>
                                            <td>${date}</td>
                                            <td>${tank?.name || record.tankId}</td>
                                            <td>${record.ec} mS/cm</td>
                                            <td>${record.ph}</td>
                                            <td>${record.temperature}°C</td>
                                            <td>${record.level}%</td>
                                            <td>${getStageLabel(record.cropStage)}</td>
                                            <td><span class="status-dot ${statusClass}"></span>${hasIssue ? '需关注' : '正常'}</td>
                                        </tr>
                                    `;
                                }).join('')
                            ).join('')}
                    </tbody>
                </table>
            `;
        }

        async function updateChart() {
            const tankId = document.getElementById('chart-tank-select').value;
            if (!tankId) return;
            
            try {
                const response = await fetch('/api/records');
                const records = await response.json();
                
                const tankRecords = records
                    .filter(r => r.tankId === tankId)
                    .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                
                renderTrendChart(tankRecords);
            } catch (error) {
                console.error('加载图表数据失败:', error);
            }
        }
        
        function renderTrendChart(records) {
            const ctx = document.getElementById('trend-chart').getContext('2d');
            
            if (trendChart) {
                trendChart.destroy();
            }
            
            if (records.length === 0) {
                return;
            }
            
            const labels = records.map(r => {
                const date = new Date(r.timestamp);
                return `${date.getMonth() + 1}/${date.getDate()}`;
            });
            
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'EC (mS/cm)',
                            data: records.map(r => r.ec),
                            borderColor: '#2c5530',
                            backgroundColor: 'rgba(44, 85, 48, 0.1)',
                            tension: 0.4,
                            yAxisID: 'y'
                        },
                        {
                            label: 'pH',
                            data: records.map(r => r.ph),
                            borderColor: '#ff9800',
                            backgroundColor: 'rgba(255, 152, 0, 0.1)',
                            tension: 0.4,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: 'EC (mS/cm)' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: 'pH' },
                            min: 4,
                            max: 8,
                            grid: { drawOnChartArea: false }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top'
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    }
                }
            });
        }
        
        // 工具函数
        function showSuccess(message) {
            alert('✅ ' + message);
        }
        
        function showError(message) {
            alert('❌ ' + message);
        }
    </script>
</body>
</html>
