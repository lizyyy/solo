[metadata]
name = field-sync
version = 0.1.0
description = 外业资料双向同步预演器
author = Field Sync Team
license = MIT

[options]
packages = find:
install_requires =
    click>=8.0.0
    pydantic>=2.0.0
    rich>=13.0.0
python_requires = >=3.8

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0

[options.entry_points]
console_scripts =
    field-sync = field_sync.cli:main
