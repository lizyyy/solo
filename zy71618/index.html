<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保险精算怪物塔 - 风险分层培训</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="game-header">
            <h1>🏰 保险精算怪物塔</h1>
            <div class="game-stats">
                <div class="stat-item">
                    <span class="stat-label">回合</span>
                    <span id="round-display" class="stat-value">1 / 10</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">保费收入</span>
                    <span id="premium-display" class="stat-value">¥0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">准备金</span>
                    <span id="reserve-display" class="stat-value">¥100,000</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">逃脱赔案</span>
                    <span id="escaped-display" class="stat-value">0 / 5</span>
                </div>
            </div>
            <div class="game-controls">
                <button id="btn-start" class="btn btn-primary">开始游戏</button>
                <button id="btn-pause" class="btn btn-secondary" disabled>暂停</button>
                <button id="btn-restart" class="btn btn-warning">重开</button>
                <button id="btn-report" class="btn btn-info" disabled>复盘报告</button>
            </div>
        </header>

        <main class="game-main">
            <aside class="sidebar left-sidebar">
                <h2>📋 保单卡库</h2>
                <div id="policy-cards" class="policy-cards">
                </div>
                <div class="selected-policy">
                    <h3>已选保单</h3>
                    <div id="selected-policy-info" class="selected-policy-info">
                        <p class="placeholder">点击上方保单卡选择</p>
                    </div>
                </div>
            </aside>

            <section class="game-area">
                <div id="game-board" class="game-board">
                    <div class="path-container">
                        <div id="path" class="path">
                        </div>
                    </div>
                    <div id="tower-slots" class="tower-slots">
                    </div>
                    <div id="monsters-layer" class="monsters-layer">
                    </div>
                </div>
                <div class="round-info">
                    <div id="round-status" class="round-status">准备阶段 - 请放置保单卡</div>
                    <button id="btn-next-wave" class="btn btn-success" disabled>▶ 开始本回合出怪</button>
                </div>
            </section>

            <aside class="sidebar right-sidebar">
                <h2>⚠️ 实时结算</h2>
                <div id="settlement-log" class="settlement-log">
                    <p class="placeholder">游戏开始后显示赔付结算记录</p>
                </div>
                <h2>❌ 操作提示</h2>
                <div id="error-messages" class="error-messages">
                    <p class="placeholder">操作错误会在这里显示详细原因</p>
                </div>
            </aside>
        </main>

        <div id="modal-overlay" class="modal-overlay hidden">
            <div id="modal" class="modal">
                <div class="modal-header">
                    <h2 id="modal-title">复盘报告</h2>
                    <button id="modal-close" class="modal-close">&times;</button>
                </div>
                <div id="modal-content" class="modal-content">
                </div>
                <div class="modal-footer">
                    <button id="modal-export" class="btn btn-primary">📥 导出报告</button>
                    <button id="modal-close-btn" class="btn btn-secondary">关闭</button>
                </div>
            </div>
        </div>

        <div id="replay-overlay" class="replay-overlay hidden">
            <div class="replay-container">
                <h2>🔍 错因回放</h2>
                <div id="replay-content" class="replay-content"></div>
                <div class="replay-controls">
                    <button id="replay-prev" class="btn btn-secondary">上一步</button>
                    <span id="replay-progress">0 / 0</span>
                    <button id="replay-next" class="btn btn-secondary">下一步</button>
                    <button id="replay-close" class="btn btn-primary">关闭回放</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/models.js"></script>
    <script src="js/errorTracker.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/report.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
