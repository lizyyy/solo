[project]
name = "purchase-diff-summary"
version = "0.1.0"
description = "采购到货记录到货差异汇总 CLI"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
purchase-diff = "purchase_diff.cli:cli"

[tool.black]
line-length = 100
target-version = ['py39']
