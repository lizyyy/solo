[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-audit-cli"
version = "0.1.0"
description = "质检抽样复核 CLI 工具 - 处理工厂抽检样本补录后的批次合格率和复检结论核对"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pandas>=1.3",
    "pyyaml>=6.0",
    "jinja2>=3.0",
]

[project.scripts]
qc-audit = "qc_audit.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
