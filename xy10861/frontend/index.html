<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环境变量差异台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px 40px;
            border-bottom: 1px solid #0f3460;
        }
        
        .header h1 {
            font-size: 28px;
            color: #e94560;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header h1::before {
            content: "⚙️";
        }
        
        .nav-tabs {
            display: flex;
            gap: 8px;
            padding: 0 40px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .nav-tab {
            padding: 16px 24px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        
        .nav-tab:hover {
            color: #e94560;
        }
        
        .nav-tab.active {
            color: #e94560;
            border-bottom-color: #e94560;
        }
        
        .container {
            padding: 24px 40px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .toolbar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            border-color: #e94560;
        }
        
        .filter-select {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #d63031 0%, #b71c1c 100%);
            color: white;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid #0f3460;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .card:hover {
            border-color: #e94560;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(233, 69, 96, 0.15);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge-protected {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
        }
        
        .badge-safe {
            background: rgba(0, 184, 148, 0.2);
            color: #00b894;
        }
        
        .badge-pending {
            background: rgba(253, 203, 110, 0.2);
            color: #fdcb6e;
        }
        
        .badge-approved {
            background: rgba(0, 184, 148, 0.2);
            color: #00b894;
        }
        
        .badge-rejected {
            background: rgba(214, 48, 49, 0.2);
            color: #d63031;
        }
        
        .badge-success {
            background: rgba(0, 184, 148, 0.2);
            color: #00b894;
        }
        
        .badge-failed {
            background: rgba(214, 48, 49, 0.2);
            color: #d63031;
        }
        
        .card-stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #888;
        }
        
        .card-actions {
            margin-top: 16px;
            display: flex;
            gap: 8px;
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #0f3460;
            border-radius: 12px;
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        td {
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }
        
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .var-key {
            font-family: 'Consolas', monospace;
            font-weight: 600;
            color: #74b9ff;
        }
        
        .var-value {
            font-family: 'Consolas', monospace;
            color: #00b894;
        }
        
        .sensitive .var-value {
            color: #fdcb6e;
        }
        
        .diff-item {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .diff-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .diff-key {
            font-family: 'Consolas', monospace;
            font-weight: 600;
            color: #e94560;
            font-size: 16px;
        }
        
        .diff-values {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .diff-env {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
        }
        
        .diff-env-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }
        
        .diff-env-value {
            font-family: 'Consolas', monospace;
            color: #00b894;
            word-break: break-all;
        }
        
        .diff-only .diff-env-value {
            color: #fdcb6e;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #e94560;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 13px;
            color: #888;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 16px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: #e94560;
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.success {
            background: rgba(0, 184, 148, 0.1);
            border: 1px solid #00b894;
            color: #00b894;
            display: block;
        }
        
        .alert.error {
            background: rgba(214, 48, 49, 0.1);
            border: 1px solid #d63031;
            color: #d63031;
            display: block;
        }
        
        .detail-section {
            margin-bottom: 20px;
        }
        
        .detail-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .detail-value {
            font-size: 14px;
            color: #e0e0e0;
        }
        
        .detail-value.code {
            font-family: 'Consolas', monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
        }
        
        .compare-selector {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .compare-vs {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #e94560;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(233, 69, 96, 0.2);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>环境变量差异台</h1>
    </div>
    
    <nav class="nav-tabs">
        <button class="nav-tab active" data-tab="environments">🏠 环境管理</button>
        <button class="nav-tab" data-tab="variables">🔑 变量列表</button>
        <button class="nav-tab" data-tab="diff">📊 差异对比</button>
        <button class="nav-tab" data-tab="changes">📋 变更申请</button>
        <button class="nav-tab" data-tab="sync">🔄 同步记录</button>
    </nav>
    
    <div class="container">
        <div id="alert" class="alert"></div>
        
        <div id="tab-environments" class="tab-content active">
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="env-search" placeholder="搜索环境名称...">
                </div>
                <button class="btn btn-primary" onclick="openCreateEnvModal()">+ 新建环境</button>
            </div>
            <div id="environments-list" class="cards-grid"></div>
        </div>
        
        <div id="tab-variables" class="tab-content">
            <div class="toolbar">
                <select id="var-env-select" class="filter-select">
                    <option value="">选择环境</option>
                </select>
                <div class="search-box">
                    <input type="text" id="var-search" placeholder="搜索变量名...">
                </div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="only-sensitive">
                    <label for="only-sensitive">仅敏感变量</label>
                </div>
                <button class="btn btn-primary" onclick="openCreateVarModal()">+ 新建变量</button>
            </div>
            <div class="table-container">
                <table id="variables-table">
                    <thead>
                        <tr>
                            <th>变量名</th>
                            <th>值</th>
                            <th>环境</th>
                            <th>描述</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="variables-tbody"></tbody>
                </table>
            </div>
        </div>
        
        <div id="tab-diff" class="tab-content">
            <div class="compare-selector">
                <select id="diff-env1" class="form-select">
                    <option value="">选择环境 1</option>
                </select>
                <div class="compare-vs">VS</div>
                <select id="diff-env2" class="form-select">
                    <option value="">选择环境 2</option>
                </select>
            </div>
            <div class="toolbar">
                <button class="btn btn-primary" onclick="compareEnvironments()">开始对比</button>
                <button class="btn btn-secondary" onclick="exportDiff('json')">导出 JSON</button>
                <button class="btn btn-secondary" onclick="exportDiff('csv')">导出 CSV</button>
            </div>
            <div id="diff-stats" class="stats-row" style="display: none;"></div>
            <div id="diff-results" class="table-container"></div>
        </div>
        
        <div id="tab-changes" class="tab-content">
            <div class="toolbar">
                <select id="cr-status-filter" class="filter-select">
                    <option value="">全部状态</option>
                    <option value="pending">待审批</option>
                    <option value="approved">已批准</option>
                    <option value="rejected">已拒绝</option>
                </select>
                <button class="btn btn-primary" onclick="openCreateCRModal()">+ 新建变更申请</button>
            </div>
            <div id="change-requests" class="cards-grid"></div>
        </div>
        
        <div id="tab-sync" class="tab-content">
            <div id="sync-records" class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>变量名</th>
                            <th>源环境</th>
                            <th>目标环境</th>
                            <th>原值</th>
                            <th>新值</th>
                            <th>操作人</th>
                            <th>状态</th>
                            <th>时间</th>
                        </tr>
                    </thead>
                    <tbody id="sync-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>
    
    <script>
        const API_BASE = '/api';
        let environments = [];
        let currentEnvId = null;
        let currentDiffResult = null;
        
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            setTimeout(() => {
                alert.className = 'alert';
            }, 3000);
        }
        
        async function fetchAPI(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || '请求失败');
                }
                return data;
            } catch (error) {
                showAlert(error.message, 'error');
                throw error;
            }
        }
        
        async function loadEnvironments() {
            const result = await fetchAPI('/environments');
            environments = result.data;
            renderEnvironments();
            updateEnvSelectors();
        }
        
        function renderEnvironments() {
            const container = document.getElementById('environments-list');
            const searchTerm = document.getElementById('env-search').value.toLowerCase();
            
            const filtered = environments.filter(env => 
                env.name.toLowerCase().includes(searchTerm)
            );
            
            container.innerHTML = filtered.map(env => `
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">${env.name}</h3>
                        ${env.is_protected ? '<span class="badge badge-protected">受保护</span>' : '<span class="badge badge-safe">普通</span>'}
                    </div>
                    <p style="color: #888; font-size: 13px; margin-bottom: 8px;">${env.description || '暂无描述'}</p>
                    <div class="card-stats">
                        <span>📦 ${env.variable_count} 个变量</span>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-secondary btn-small" onclick="viewVariables(${env.id})">查看变量</button>
                        <button class="btn btn-success btn-small" onclick="openCompareModal(${env.id})">对比</button>
                    </div>
                </div>
            `).join('');
        }
        
        function updateEnvSelectors() {
            const selects = ['var-env-select', 'diff-env1', 'diff-env2', 'cr-source-env', 'cr-target-env', 'var-env-select-create'];
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                if (select) {
                    const currentValue = select.value;
                    select.innerHTML = selectId.includes('var-') ? '<option value="">选择环境</option>' : '';
                    environments.forEach(env => {
                        const option = document.createElement('option');
                        option.value = env.id;
                        option.textContent = env.name;
                        select.appendChild(option);
                    });
                    if (currentValue && select.querySelector(`option[value="${currentValue}"]`)) {
                        select.value = currentValue;
                    }
                }
            });
        }
        
        async function loadVariables() {
            const envId = document.getElementById('var-env-select').value;
            if (!envId) return;
            
            const search = document.getElementById('var-search').value;
            const onlySensitive = document.getElementById('only-sensitive').checked;
            
            let url = `/environments/${envId}/variables`;
            const params = new URLSearchParams();
            if (search) params.append('search', search);
            if (onlySensitive) params.append('only_sensitive', 'true');
            if (params.toString()) url += '?' + params.toString();
            
            const result = await fetchAPI(url);
            renderVariables(result.data);
        }
        
        function renderVariables(variables) {
            const tbody = document.getElementById('variables-tbody');
            
            if (variables.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div>暂无变量数据</div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = variables.map(v => `
                <tr class="${v.is_sensitive ? 'sensitive' : ''}">
                    <td><span class="var-key">${v.key}</span></td>
                    <td><span class="var-value">${v.value}</span></td>
                    <td>${v.environment_name}</td>
                    <td>${v.description || '-'}</td>
                    <td>
                        <button class="btn btn-secondary btn-small" onclick="viewVariableDetail(${JSON.stringify(v).replace(/"/g, '&quot;')})">详情</button>
                        <button class="btn btn-success btn-small" onclick="openSyncModal('${v.key}', ${v.environment_id}, '${v.raw_value}')">同步</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function viewVariableDetail(variable) {
            const content = `
                <div class="modal-header">
                    <h2 class="modal-title">变量详情</h2>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="detail-section">
                    <div class="detail-label">变量名</div>
                    <div class="detail-value code">${variable.key}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">环境</div>
                    <div class="detail-value">${variable.environment_name}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">值</div>
                    <div class="detail-value code">${variable.raw_value}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">敏感</div>
                    <div class="detail-value">${variable.is_sensitive ? '是 🔒' : '否'}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">描述</div>
                    <div class="detail-value">${variable.description || '暂无描述'}</div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
                    <button class="btn btn-primary" onclick="openSyncModal('${variable.key}', ${variable.environment_id}, '${variable.raw_value}')">同步变量</button>
                </div>
            `;
            openModalContent(content);
        }
        
        async function compareEnvironments() {
            const env1Id = document.getElementById('diff-env1').value;
            const env2Id = document.getElementById('diff-env2').value;
            
            if (!env1Id || !env2Id) {

        function renderDiffResult(diff) {
            const statsContainer = document.getElementById('diff-stats');
            const resultsContainer = document.getElementById('diff-results');
            
            statsContainer.style.display = 'grid';
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${diff.summary.total_keys}</div>
                    <div class="stat-label">总变量数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: #e94560">${diff.summary.differences}</div>
                    <div class="stat-label">差异变量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: #00b894">${diff.summary.matches}</div>
                    <div class="stat-label">相同变量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: #fdcb6e">${diff.summary.only_in_env1 + diff.summary.only_in_env2}</div>
                    <div class="stat-label">独有变量</div>
                </div>
            `;
            
            let html = '';
            
            if (diff.differences.length > 0) {
                html += `<h3 style="padding: 20px; color: #e94560; border-bottom: 1px solid rgba(255,255,255,0.05);">🔴 值差异 (${diff.differences.length})</h3>`;
                diff.differences.forEach(item => {
                    html += `
                        <div class="diff-item">
                            <div class="diff-header">
                                <span class="diff-key">${item.key}</span>
                                <button class="btn btn-primary btn-small" onclick="openCRFromDiff('${item.key}', ${diff.env1_id}, '${item.env1_value.replace(/'/g, "\\'")}', ${diff.env2_id}, '${item.env2_value.replace(/'/g, "\\'")}')">申请变更</button>
                            </div>
                            <div class="diff-values">
                                <div class="diff-env">
                                    <div class="diff-env-label">${diff.env1_name}</div>
                                    <div class="diff-env-value">${item.env1_value}</div>
                                </div>
                                <div class="diff-env">
                                    <div class="diff-env-label">${diff.env2_name}</div>
                                    <div class="diff-env-value">${item.env2_value}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            
            if (diff.only_in_env1.length > 0) {
                html += `<h3 style="padding: 20px; color: #fdcb6e; border-bottom: 1px solid rgba(255,255,255,0.05);">🟡 仅在 ${diff.env1_name} (${diff.only_in_env1.length})</h3>`;
                diff.only_in_env1.forEach(item => {
                    html += `
                        <div class="diff-item diff-only">
                            <div class="diff-header">
                                <span class="diff-key">${item.key}</span>
                                <button class="btn btn-primary btn-small" onclick="openCRFromDiff('${item.key}', ${diff.env1_id}, '${item.value}', ${diff.env2_id}, '')">同步到 ${diff.env2_name}</button>
                            </div>
                            <div class="diff-env-value">${item.value}</div>
                        </div>
                    `;
                });
            }
            
            if (diff.only_in_env2.length > 0) {
                html += `<h3 style="padding: 20px; color: #fdcb6e; border-bottom: 1px solid rgba(255,255,255,0.05);">🟡 仅在 ${diff.env2_name} (${diff.only_in_env2.length})</h3>`;
                diff.only_in_env2.forEach(item => {
                    html += `
                        <div class="diff-item diff-only">
                            <div class="diff-header">
                                <span class="diff-key">${item.key}</span>
                                <button class="btn btn-primary btn-small" onclick="openCRFromDiff('${item.key}', ${diff.env2_id}, '${item.value}', ${diff.env1_id}, '')">同步到 ${diff.env1_name}</button>
                            </div>
                            <div class="diff-env-value">${item.value}</div>
                        </div>
                    `;
                });
            }
            
            if (diff.matches.length > 0) {
                html += `<h3 style="padding: 20px; color: #00b894; border-bottom: 1px solid rgba(255,255,255,0.05);">🟢 值相同 (${diff.matches.length})</h3>`;
                diff.matches.forEach(item => {
                    html += `
                        <div class="diff-item">
                            <span class="diff-key" style="color: #00b894">${item.key}</span>
                            <div class="diff-env-value" style="margin-top: 8px">${item.value}</div>
                        </div>
                    `;
                });
            }
            
            resultsContainer.innerHTML = html || '<div class="empty-state">请选择两个环境进行对比</div>';
        }

        });
        
        document.getElementById('env-search').addEventListener('input', renderEnvironments);
        document.getElementById('var-search').addEventListener('input', loadVariables);
        document.getElementById('var-env-select').addEventListener('change', loadVariables);
        document.getElementById('only-sensitive').addEventListener('change', loadVariables);
        document.getElementById('cr-status-filter').addEventListener('change', loadChangeRequests);
        
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        });
        
        loadEnvironments();
        loadChangeRequests();
        loadSyncRecords();
    </script>
</body>
</html>
