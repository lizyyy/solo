syntax = "proto3";

package examples.bad;

message Order {
  enum Status {
    STATUS_UNKNOWN = 0;
    STATUS_PENDING = 1;
    STATUS_PAID = 2;
    STATUS_SHIPPED = 2;
    STATUS_CANCELLED = 3;
  }

  string id = 1;
  Status status = 2;
}

enum Priority {
  reserved 2;
  reserved "PRIORITY_DEPRECATED";

  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_MEDIUM = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_DEPRECATED = 4;
}

enum Role {
  ROLE_UNKNOWN = 0;
  ROLE_USER = 1;
  ROLE_ADMIN = 2;
  ROLE_SUPER_ADMIN = 2;
}
