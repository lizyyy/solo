[tool.poetry]
name = "audit-sample-appeal-cli"
version = "0.1.0"
description = "审核样本目录误封申诉整理 CLI"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "audit_sample_appeal"}]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.0"
pillow = "^10.0.0"
