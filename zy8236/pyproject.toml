[project]
name = "smoke-cli"
version = "0.1.0"
description = "商场消防维保人员离线复核排烟联动 CLI 工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "pandas>=1.5",
    "python-dateutil>=2.8",
]

[project.scripts]
smoke-cli = "smoke_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smoke_cli"]
