[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-backup-checker"
version = "1.0.0"
authors = [
  { name="Engineering Team", email="eng@example.com" }
]
description = "SQLite备份一致性检查工具 - 验证数据库文件和WAL文件的完整性"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "click>=8.0",
  "rich>=12.0",
  "pyyaml>=6.0",
]

[project.scripts]
sqlite-backup-check = "sqlite_backup_checker.cli:main"
