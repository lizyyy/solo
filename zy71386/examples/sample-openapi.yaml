openapi: 3.0.0
info:
  title: 用户服务API
  version: 1.0.0
  description: 用户管理相关接口
paths:
  /users:
    get:
      summary: 获取用户列表
      tags:
        - 用户管理
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, pending]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
              type: object
              properties:
                code:
                  type: integer
                  example: 0
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
                total:
                  type: integer
                  example: 100
    post:
      summary: 创建用户
      tags:
        - 用户管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
              type: object
              properties:
                code:
                  type: integer
                data:
                    $ref: '#/components/schemas/User'
  /users/{id}:
    get:
      summary: 获取用户详情
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
              type: object
              properties:
                code:
                  type: integer
                data:
                  $ref: '#/components/schemas/User'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
    put:
      summary: 更新用户
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
              type: object
              properties:
                code:
                  type: integer
                data:
                    $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
        - status
        - createdAt
      properties:
        id:
          type: string
          description: 用户ID
        name:
          type: string
          description: 用户名
        email:
          type: string
          description: 邮箱
        status:
          type: string
          enum: [active, inactive, pending]
          description: 用户状态
        createdAt:
          type: string
          format: date-time
        avatarUrl:
          type: string
          nullable: true
          description: 头像URL
    CreateUserRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [active, inactive, pending]
          default: pending
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [active, inactive, pending]
