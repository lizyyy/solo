[project]
name = "bike-supply-cli"
version = "0.1.0"
description = "骑行俱乐部补给站排布 CLI 工具"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
bike-supply = "bike_supply_cli.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
