[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "branch-protection-audit"
version = "0.1.0"
authors = [
  { name="Branch Protection Audit Team" }
]
description = "分支保护例外恢复审计排查CLI工具"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-dateutil>=2.8",
    "rich>=13.0",
]

[project.scripts]
bpaudit = "branch_protection_audit.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
