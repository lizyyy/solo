<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>园林养护补苗巡检系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .header { background: #2c3e50; color: white; padding: 1rem; text-align: center; }
        .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
        .tabs { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .tab { padding: 0.5rem 1rem; background: #ddd; border: none; cursor: pointer; border-radius: 4px; }
        .tab.active { background: #3498db; color: white; }
        .tab-content { display: none; background: white; padding: 1rem; border-radius: 4px; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
        .btn { padding: 0.5rem 1rem; border: none; cursor: pointer; border-radius: 4px; margin-right: 0.5rem; }
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .filters { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 0.875rem; margin-bottom: 0.25rem; }
        .filter-group input, .filter-group select { padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; }
        .timeline { margin-top: 1rem; }
        .timeline-item { padding: 1rem; border-left: 3px solid #3498db; margin-bottom: 1rem; background: #f8f9fa; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -8px; top: 1rem; width: 13px; height: 13px; background: #3498db; border-radius: 50%; }
        .timeline-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .timeline-reason { font-weight: bold; color: #2c3e50; }
        .timeline-time { color: #7f8c8d; font-size: 0.875rem; }
        .timeline-details { color: #555; }
        .timeline-changed-by { color: #3498db; font-size: 0.875rem; }
        .history-item { padding: 0.5rem; background: #f8f9fa; margin-bottom: 0.5rem; border-radius: 4px; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 12px; font-size: 0.75rem; }
        .badge-pending { background: #f39c12; color: white; }
        .badge-processing { background: #3498db; color: white; }
        .badge-completed { background: #2ecc71; color: white; }
        .badge-pending-review { background: #9b59b6; color: white; }
        .badge-pending-manual { background: #e74c3c; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 4px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        .trend-card { background: white; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .trend-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        .stat-item { text-align: center; padding: 1rem; background: #f8f9fa; border-radius: 4px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #2c3e50; }
        .stat-label { color: #7f8c8d; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>园林养护补苗巡检系统</h1>
    </div>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('list')">巡检列表</button>
            <button class="tab" onclick="switchTab('import')">批量导入</button>
            <button class="tab" onclick="switchTab('trend')">养护趋势</button>
        </div>

        <div id="list" class="tab-content active">
            <div class="filters">
                <div class="filter-group">
                    <label>责任人</label>
                    <input type="text" id="filterPerson" placeholder="输入责任人">
                </div>
                <div class="filter-group">
                    <label>开始日期</label>
                    <input type="date" id="filterStartDate">
                </div>
                <div class="filter-group">
                    <label>结束日期</label>
                    <input type="date" id="filterEndDate">
                </div>
                <div class="filter-group">
                    <label>状态</label>
                    <select id="filterStatus">
                        <option value="">全部</option>
                        <option value="pending">待处理</option>
                        <option value="processing">处理中</option>
                        <option value="pending_review">待审核</option>
                        <option value="pending_manual">待人工处理</option>
                        <option value="completed">已完成</option>
                    </select>
                </div>
                <div class="filter-group" style="justify-content: flex-end;">
                    <button class="btn btn-primary" onclick="loadInspections()">查询</button>
                    <button class="btn btn-success" onclick="exportExcel()">导出Excel</button>
                    <button class="btn btn-warning" onclick="showCreateModal()">新建巡检</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>巡检编号</th>
                        <th>植物区域</th>
                        <th>病虫害等级</th>
                        <th>漏巡扣分</th>
                        <th>责任人</th>
                        <th>外包评分</th>
                        <th>补苗验收</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="inspectionList"></tbody>
            </table>
        </div>

        <div id="import" class="tab-content">
            <h3>批量导入</h3>
            <div style="margin: 1rem 0;">
                <button class="btn btn-primary" onclick="downloadTemplate()">下载导入模板</button>
            </div>
            <div class="form-group">
                <label>选择CSV文件</label>
                <input type="file" id="importFile" accept=".csv">
            </div>
            <button class="btn btn-success" onclick="importCSV()">开始导入</button>
            <div id="importResult" style="margin-top: 1rem;"></div>
        </div>

        <div id="trend" class="tab-content">
            <h3>养护趋势分析</h3>
            <div class="trend-stats" id="trendStats"></div>
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>总巡检数</th>
                        <th>已完成</th>
                        <th>平均评分</th>
                        <th>总扣分数</th>
                    </tr>
                </thead>
                <tbody id="trendList"></tbody>
            </table>
        </div>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新建巡检</h3>
                <button class="close-btn" onclick="closeModal('createModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>植物区域 *</label>
                <input type="text" id="createPlantArea" placeholder="例如：A区-乔木林">
            </div>
            <div class="form-group">
                <label>病虫害等级 *</label>
                <select id="createPestLevel">
                    <option value="无">无</option>
                    <option value="轻度">轻度</option>
                    <option value="中度">中度</option>
                    <option value="重度">重度</option>
                </select>
            </div>
            <div class="form-group">
                <label>漏巡扣分</label>
                <input type="number" id="createMissedPoints" value="0" min="0">
            </div>
            <div class="form-group">
                <label>责任人 *</label>
                <input type="text" id="createPerson" placeholder="输入责任人姓名">
            </div>
            <div class="form-group">
                <label>操作ID（幂等性）</label>
                <input type="text" id="createOperationId" placeholder="可选，防止重复提交">
            </div>
            <button class="btn btn-success" onclick="createInspection()">创建</button>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>巡检详情</h3>
                <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
            </div>
            <div id="detailContent"></div>
            <div style="margin-top: 1rem;">
                <h4>状态时间线</h4>
                <div class="timeline" id="timelineContent"></div>
            </div>
            <div style="margin-top: 1rem;">
                <h4>字段修改历史</h4>
                <div id="historyContent"></div>
            </div>
        </div>
    </div>

    <div id="advanceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>推进巡检</h3>
                <button class="close-btn" onclick="closeModal('advanceModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>状态</label>
                <select id="advanceStatus">
                    <option value="pending">待处理</option>
                    <option value="processing">处理中</option>
                    <option value="pending_review">待审核</option>
                    <option value="completed">已完成</option>
                </select>
            </div>
            <div class="form-group">
                <label>植物区域</label>
                <input type="text" id="advancePlantArea">
            </div>
            <div class="form-group">
                <label>病虫害等级</label>
                <select id="advancePestLevel">
                    <option value="">不修改</option>
                    <option value="无">无</option>
                    <option value="轻度">轻度</option>
                    <option value="中度">中度</option>
                    <option value="重度">重度</option>
                </select>
            </div>
            <div class="form-group">
                <label>漏巡扣分</label>
                <input type="number" id="advanceMissedPoints" min="0">
            </div>
            <div class="form-group">
                <label>外包评分</label>
                <input type="number" id="advanceOutsourcedScore" min="0" max="100">
            </div>
            <div class="form-group">
                <label>补苗验收状态</label>
                <select id="advanceAcceptance">
                    <option value="">不修改</option>
                    <option value="pending">待验收</option>
                    <option value="pass">通过</option>
                    <option value="failed">不通过</option>
                </select>
            </div>
            <div class="form-group">
                <label>变更原因 *</label>
                <input type="text" id="advanceReason" placeholder="请输入变更原因">
            </div>
            <div class="form-group">
                <label>变更详情</label>
                <textarea id="advanceDetails" rows="3" placeholder="可选，详细说明"></textarea>
            </div>
            <div class="form-group">
                <label>操作人 *</label>
                <input type="text" id="advanceChangedBy" placeholder="请输入操作人姓名">
            </div>
            <button class="btn btn-success" onclick="advanceInspection()">提交</button>
        </div>
    </div>

    <div id="correctModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>修正数据</h3>
                <button class="close-btn" onclick="closeModal('correctModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>植物区域</label>
                <input type="text" id="correctPlantArea">
            </div>
            <div class="form-group">
                <label>病虫害等级</label>
                <select id="correctPestLevel">
                    <option value="">不修改</option>
                    <option value="无">无</option>
                    <option value="轻度">轻度</option>
                    <option value="中度">中度</option>
                    <option value="重度">重度</option>
                </select>
            </div>
            <div class="form-group">
                <label>漏巡扣分</label>
                <input type="number" id="correctMissedPoints" min="0">
            </div>
            <div class="form-group">
                <label>外包评分</label>
                <input type="number" id="correctOutsourcedScore" min="0" max="100">
            </div>
            <div class="form-group">
                <label>修正原因 *</label>
                <input type="text" id="correctReason" placeholder="请输入修正原因">
            </div>
            <div class="form-group">
                <label>操作人 *</label>
                <input type="text" id="correctChangedBy" placeholder="请输入操作人姓名">
            </div>
            <button class="btn btn-warning" onclick="correctInspection()">提交修正</button>
        </div>
    </div>

    <script>
        let currentInspectionId = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if (tabId === 'trend') {
                loadTrend();
            }
        }

        async function loadInspections() {
            const params = new URLSearchParams({
                responsible_person: document.getElementById('filterPerson').value,
                start_date: document.getElementById('filterStartDate').value,
                end_date: document.getElementById('filterEndDate').value,
                status: document.getElementById('filterStatus').value
            });

            const res = await fetch(`/api/inspections?${params}`);
            const data = await res.json();
            
            const tbody = document.getElementById('inspectionList');
            tbody.innerHTML = data.data.map(item => `
                <tr>
                    <td>${item.inspection_no}</td>
                    <td>${item.plant_area}</td>
                    <td>${item.pest_level}</td>
                    <td>${item.missed_inspection_points}</td>
                    <td>${item.responsible_person}</td>
                    <td>${item.outsourced_score || '-'}</td>
                    <td>${item.seedling_acceptance_status || '-'}</td>
                    <td><span class="badge badge-${item.status}">${getStatusText(item.status)}</span></td>
                    <td>${new Date(item.created_at).toLocaleString()}</td>
                    <td>
                        <button class="btn btn-primary" onclick="viewDetail('${item.id}')">详情</button>
                        <button class="btn btn-success" onclick="showAdvanceModal('${item.id}')">推进</button>
                        <button class="btn btn-warning" onclick="showCorrectModal('${item.id}')">修正</button>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusText(status) {
            const map = {
                pending: '待处理',
                processing: '处理中',
                pending_review: '待审核',
                pending_manual: '待人工处理',
                completed: '已完成'
            };
            return map[status] || status;
        }

        async function viewDetail(id) {
            const [inspectionRes, timelineRes, historyRes] = await Promise.all([
                fetch(`/api/inspections/${id}`),
                fetch(`/api/inspections/${id}/timeline`),
                fetch(`/api/inspections/${id}/history`)
            ]);

            const inspection = (await inspectionRes.json()).data;
            const timeline = (await timelineRes.json()).data;
            const history = (await historyRes.json()).data;

            document.getElementById('detailContent').innerHTML = `
                <table>
                    <tr><th>巡检编号</th><td>${inspection.inspection_no}</td></tr>
                    <tr><th>植物区域</th><td>${inspection.plant_area} ${inspection.plant_area_before ? `<small style="color:#999;">(原: ${inspection.plant_area_before})</small>` : ''}</td></tr>
                    <tr><th>病虫害等级</th><td>${inspection.pest_level} ${inspection.pest_level_before ? `<small style="color:#999;">(原: ${inspection.pest_level_before})</small>` : ''}</td></tr>
                    <tr><th>漏巡扣分</th><td>${inspection.missed_inspection_points} ${inspection.missed_inspection_points_before !== null ? `<small style="color:#999;">(原: ${inspection.missed_inspection_points_before})</small>` : ''}</td></tr>
                    <tr><th>责任人</th><td>${inspection.responsible_person}</td></tr>
                    <tr><th>外包评分</th><td>${inspection.outsourced_score || '-'}</td></tr>
                    <tr><th>补苗验收</th><td>${inspection.seedling_acceptance_status || '-'}</td></tr>
                    <tr><th>状态</th><td><span class="badge badge-${inspection.status}">${getStatusText(inspection.status)}</span></td></tr>
                </table>
            `;

            document.getElementById('timelineContent').innerHTML = timeline.map(item => `
                <div class="timeline-item">
                    <div class="timeline-header">
                        <span class="timeline-reason">${item.change_reason}</span>
                        <span class="timeline-time">${new Date(item.created_at).toLocaleString()}</span>
                    </div>
                    <div class="timeline-changed-by">操作人: ${item.changed_by}</div>
                    ${item.status_from ? `<div>状态变更: ${getStatusText(item.status_from)} → ${getStatusText(item.status_to)}</div>` : ''}
                    ${item.change_details ? `<div class="timeline-details">${item.change_details}</div>` : ''}
                </div>
            `).join('');

            document.getElementById('historyContent').innerHTML = history.length ? history.map(item => `
                <div class="history-item">
                    <div><strong>${getFieldText(item.field_name)}</strong>: ${item.old_value || '-'} → ${item.new_value}</div>
                    <div style="font-size: 0.875rem; color: #7f8c8d;">
                        ${item.changed_by} · ${new Date(item.created_at).toLocaleString()}
                    </div>
                </div>
            `).join('') : '<p>暂无修改记录</p>';

            document.getElementById('detailModal').classList.add('active');
        }

        function getFieldText(field) {
            const map = {
                plant_area: '植物区域',
                pest_level: '病虫害等级',
                missed_inspection_points: '漏巡扣分',
                outsourced_score: '外包评分',
                seedling_acceptance_status: '补苗验收状态'
            };
            return map[field] || field;
        }

        function showCreateModal() {
            document.getElementById('createModal').classList.add('active');
        }

        async function createInspection() {
            const data = {
                plant_area: document.getElementById('createPlantArea').value,
                pest_level: document.getElementById('createPestLevel').value,
                missed_inspection_points: parseInt(document.getElementById('createMissedPoints').value),
                responsible_person: document.getElementById('createPerson').value,
                operation_id: document.getElementById('createOperationId').value || undefined
            };

            const res = await fetch('/api/inspections', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                closeModal('createModal');
                loadInspections();
                alert('创建成功');
            } else {
                const err = await res.json();
                alert(err.message);
            }
        }

        function showAdvanceModal(id) {
            currentInspectionId = id;
            document.getElementById('advanceModal').classList.add('active');
        }

        async function advanceInspection() {
            const data = {
                status: document.getElementById('advanceStatus').value,
                plant_area: document.getElementById('advancePlantArea').value || undefined,
                pest_level: document.getElementById('advancePestLevel').value || undefined,
                missed_inspection_points: document.getElementById('advanceMissedPoints').value ? parseInt(document.getElementById('advanceMissedPoints').value) : undefined,
                outsourced_score: document.getElementById('advanceOutsourcedScore').value ? parseInt(document.getElementById('advanceOutsourcedScore').value) : undefined,
                seedling_acceptance_status: document.getElementById('advanceAcceptance').value || undefined,
                change_reason: document.getElementById('advanceReason').value,
                change_details: document.getElementById('advanceDetails').value,
                changed_by: document.getElementById('advanceChangedBy').value
            };

            const res = await fetch(`/api/inspections/${currentInspectionId}/advance`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                const result = await res.json();
                closeModal('advanceModal');
                loadInspections();
                let msg = '提交成功';
                if (result.rulesTriggered && result.rulesTriggered.length > 0) {
                    msg += '\n触发规则：\n' + result.rulesTriggered.map(r => r.reason).join('\n');
                }
                alert(msg);
            }
        }

        function showCorrectModal(id) {
            currentInspectionId = id;
            document.getElementById('correctModal').classList.add('active');
        }

        async function correctInspection() {
            const corrections = {};
            if (document.getElementById('correctPlantArea').value) corrections.plant_area = document.getElementById('correctPlantArea').value;
            if (document.getElementById('correctPestLevel').value) corrections.pest_level = document.getElementById('correctPestLevel').value;
            if (document.getElementById('correctMissedPoints').value) corrections.missed_inspection_points = parseInt(document.getElementById('correctMissedPoints').value);
            if (document.getElementById('correctOutsourcedScore').value) corrections.outsourced_score = parseInt(document.getElementById('correctOutsourcedScore').value);

            const data = {
                corrections,
                reason: document.getElementById('correctReason').value,
                changed_by: document.getElementById('correctChangedBy').value
            };

            const res = await fetch(`/api/inspections/${currentInspectionId}/correct`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                closeModal('correctModal');
                loadInspections();
                alert('修正成功');
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function exportExcel() {
            const params = new URLSearchParams({
                responsible_person: document.getElementById('filterPerson').value,
                start_date: document.getElementById('filterStartDate').value,
                end_date: document.getElementById('filterEndDate').value,
                status: document.getElementById('filterStatus').value
            });
            window.open(`/api/export/excel?${params}`);
        }

        function downloadTemplate() {
            window.open('/api/import/template');
        }

        async function importCSV() {
            const fileInput = document.getElementById('importFile');
            if (!fileInput.files[0]) {
                alert('请选择文件');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const res = await fetch('/api/import/csv', {
                method: 'POST',
                body: formData
            });

            const result = await res.json();
            document.getElementById('importResult').innerHTML = `
                <p>导入完成：共 ${result.data.total} 条，成功 ${result.data.success} 条</p>
                ${result.data.errors.length ? `<p style="color: red;">错误：${result.data.errors.map(e => `第${e.row}行: ${e.message}`).join(', ')}</p>` : ''}
            `;
            loadInspections();
        }

        async function loadTrend() {
            const res = await fetch('/api/export/trend');
            const data = await res.json();

            const total = data.data.reduce((sum, d) => sum + d.total, 0);
            const completed = data.data.reduce((sum, d) => sum + d.completed, 0);
            const avgScore = data.data.filter(d => d.avg_score).reduce((sum, d) => sum + d.avg_score, 0) / data.data.filter(d => d.avg_score).length || 0;
            const totalPoints = data.data.reduce((sum, d) => sum + d.total_points, 0);

            document.getElementById('trendStats').innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${total}</div>
                    <div class="stat-label">总巡检数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${completed}</div>
                    <div class="stat-label">已完成</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${avgScore.toFixed(1)}</div>
                    <div class="stat-label">平均评分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${totalPoints}</div>
                    <div class="stat-label">总扣分数</div>
                </div>
            `;

            document.getElementById('trendList').innerHTML = data.data.map(item => `
                <tr>
                    <td>${item.date}</td>
                    <td>${item.total}</td>
                    <td>${item.completed}</td>
                    <td>${item.avg_score ? item.avg_score.toFixed(1) : '-'}</td>
                    <td>${item.total_points}</td>
                </tr>
            `).join('');
        }

        loadInspections();
    </script>
</body>
</html>
