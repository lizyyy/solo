{% extends "base.html" %}

{% block title %}创建项目{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('index') }}">首页</a></li>
                    <li class="breadcrumb-item active">创建项目</li>
                </ol>
            </nav>
            
            <div class="card">
                <div class="card-header">
                    <h5><i class="bi bi-plus-circle"></i> 创建新项目</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">项目名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   placeholder="例如：客户流失预测模型" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">项目描述</label>
                            <textarea class="form-control" id="description" name="description" 
                                      rows="3" placeholder="描述项目的目标、业务背景等..."></textarea>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> 创建项目
                            </button>
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                                取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
