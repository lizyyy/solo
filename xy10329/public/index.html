<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牙科种植材料追溯台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
            color: white;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.85;
            font-size: 14px;
        }
        
        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .tab {
            padding: 12px 24px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            color: #666;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: #e6f7ff;
            color: #1890ff;
        }
        
        .tab.active {
            background: #1890ff;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        
        .card h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e8e8e8;
        }
        
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #1890ff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #40a9ff;
        }
        
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        
        .btn-danger:hover {
            background: #ff7875;
        }
        
        .btn-success {
            background: #52c41a;
            color: white;
        }
        
        .btn-success:hover {
            background: #73d13d;
        }
        
        .btn-warning {
            background: #faad14;
            color: white;
        }
        
        .btn-warning:hover {
            background: #ffc53d;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e8e8e8;
        }
        
        th {
            background: #fafafa;
            font-weight: 600;
            color: #333;
        }
        
        tr:hover {
            background: #fafafa;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        
        .alert-error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
        
        .alert-warning {
            background: #fffbe6;
            border: 1px solid #ffe58f;
            color: #faad14;
        }
        
        .badge {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge-success {
            background: #f6ffed;
            color: #52c41a;
        }
        
        .badge-warning {
            background: #fffbe6;
            color: #faad14;
        }
        
        .badge-error {
            background: #fff2f0;
            color: #ff4d4f;
        }
        
        .badge-info {
            background: #e6f7ff;
            color: #1890ff;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-box input, .search-box select {
            padding: 10px 15px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            min-width: 200px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #1890ff;
        }
        
        .stat-card .label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h3 {
            font-size: 18px;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        
        .material-item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px;
            background: #fafafa;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        
        .trace-chain {
            border-left: 3px solid #1890ff;
            padding-left: 20px;
            margin: 15px 0;
        }
        
        .trace-node {
            background: #fafafa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            position: relative;
        }
        
        .trace-node::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 20px;
            width: 10px;
            height: 10px;
            background: #1890ff;
            border-radius: 50%;
        }
        
        .demo-banner {
            background: linear-gradient(135deg, #722ed1 0%, #531dab 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .demo-banner button {
            background: white;
            color: #722ed1;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .demo-banner button:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>牙科种植材料追溯台</h1>
        <p>管理植体、基台、骨粉等材料批号，完整追溯手术使用链路</p>
    </div>
    
    <div class="container">
        <div class="demo-banner" id="demoBanner">
            <span>🔬 本地演示模式 - 点击按钮初始化样例数据</span>
            <button onclick="initDemoData()">初始化样例数据</button>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('materials')">材料列表</button>
            <button class="tab" onclick="switchTab('surgery')">手术登记</button>
            <button class="tab" onclick="switchTab('recall')">召回查询</button>
            <button class="tab" onclick="switchTab('alerts')">库存预警</button>
            <button class="tab" onclick="switchTab('trace')">追溯导出</button>
        </div>
        
        <div id="materials" class="tab-content active">
            <div class="card">
                <h2>材料库存管理</h2>
                <div class="search-box">
                    <input type="text" id="materialSearch" placeholder="搜索批号、名称或制造商..." oninput="loadMaterials()">
                    <button class="btn btn-primary" onclick="openAddMaterialModal()">+ 添加材料</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>批号</th>
                            <th>材料名称</th>
                            <th>类型</th>
                            <th>制造商</th>
                            <th>过期日期</th>
                            <th>当前库存</th>
                            <th>最低库存</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="materialsTable"></tbody>
                </table>
            </div>
        </div>
        
        <div id="surgery" class="tab-content">
            <div class="card">
                <h2>手术登记</h2>
                <div class="alert alert-info" id="surgeryFormAlert" style="display:none;"></div>
                <div class="form-row">
                    <div class="form-group">
                        <label>选择手术预约</label>
                        <select id="surgeryAppointment">
                            <option value="">-- 请选择预约 --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>手术日期</label>
                        <input type="date" id="surgeryDate">
                    </div>
                </div>
                
                <h3 style="margin: 20px 0 10px;">使用材料</h3>
                <div id="materialsList"></div>
                <button class="btn btn-primary" style="margin-bottom:15px;" onclick="addMaterialRow()">+ 添加材料</button>
                <br>
                <button class="btn btn-success" onclick="submitSurgery()">登记手术</button>
            </div>
            
            <div class="card">
                <h2>已完成手术记录</h2>
                <table>
                    <thead>
                        <tr>
                            <th>手术编号</th>
                            <th>预约编号</th>
                            <th>患者</th>
                            <th>医生</th>
                            <th>手术日期</th>
                            <th>使用材料</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="surgeriesTable"></tbody>
                </table>
            </div>
        </div>
        
        <div id="recall" class="tab-content">
            <div class="card">
                <h2>材料召回查询</h2>
                <div class="search-box">
                    <input type="text" id="recallLot" placeholder="输入要查询的材料批号">
                    <button class="btn btn-warning" onclick="searchRecall()">查询影响患者</button>
                </div>
                <div id="recallResult"></div>
            </div>
        </div>
        
        <div id="alerts" class="tab-content">
            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="alertCount">0</div>
                    <div class="label">预警总数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="lowStockCount">0</div>
                    <div class="label">库存不足</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="expiredCount">0</div>
                    <div class="label">已过期</div>
                </div>
            </div>
            <div class="card">
                <h2>预警详情</h2>
                <div id="alertsList"></div>
            </div>
        </div>
        
        <div id="trace" class="tab-content">
            <div class="card">
                <h2>追溯查询与导出</h2>
                <div class="search-box">
                    <select id="traceType">
                        <option value="lot">按材料批号</option>
                        <option value="patient">按患者ID</option>
                    </select>
                    <input type="text" id="traceKeyword" placeholder="输入批号或患者ID">
                    <button class="btn btn-primary" onclick="searchTrace()">查询链路</button>
                    <button class="btn btn-success" onclick="exportTrace()">导出Excel</button>
                </div>
                <div id="traceResult"></div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="materialModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加新材料</h3>
                <button class="close-btn" onclick="closeModal('materialModal')">&times;</button>
            </div>
            <div class="alert" id="materialAlert" style="display:none;"></div>
            <div class="form-row">
                <div class="form-group">
                    <label>材料批号 *</label>
                    <input type="text" id="newMaterialLot" placeholder="如: IMPL-2024-001">
                </div>
                <div class="form-group">
                    <label>材料名称 *</label>
                    <input type="text" id="newMaterialName" placeholder="如: 诺贝尔Active植体">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>材料类型 *</label>
                    <select id="newMaterialType">
                        <option value="植体">植体</option>
                        <option value="基台">基台</option>
                        <option value="骨粉">骨粉</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>制造商</label>
                    <input type="text" id="newMaterialManufacturer" placeholder="如: Nobel Biocare">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>过期日期 *</label>
                    <input type="date" id="newMaterialExpiry">
                </div>
                <div class="form-group">
                    <label>初始库存 *</label>
                    <input type="number" id="newMaterialQuantity" value="50" min="0">
                </div>
            </div>
            <div class="form-group">
                <label>最低库存预警线</label>
                <input type="number" id="newMaterialMinStock" value="10" min="0">
            </div>
            <button class="btn btn-primary" onclick="submitMaterial()">添加</button>
        </div>
    </div>
    
    <script>
        const API = '/api';
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if (tabId === 'materials') loadMaterials();
            if (tabId === 'surgery') loadSurgeryData();
            if (tabId === 'alerts') loadAlerts();
        }
        
        function showAlert(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.style.display = 'flex';
            el.className = `alert alert-${type}`;
            el.textContent = message;
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }
        
        async function loadMaterials() {
            const res = await fetch(`${API}/materials`);
            const materials = await res.json();
            const search = document.getElementById('materialSearch').value.toLowerCase();
            const filtered = materials.filter(m => 
                m.lotNumber.toLowerCase().includes(search) ||
                m.name.toLowerCase().includes(search) ||
                m.manufacturer.toLowerCase().includes(search)
            );
            
            const tbody = document.getElementById('materialsTable');
            tbody.innerHTML = filtered.map(m => {
                let statusBadge = '<span class="badge badge-success">正常</span>';
                if (m.isExpired) statusBadge = '<span class="badge badge-error">已过期</span>';
                else if (m.isLowStock) statusBadge = '<span class="badge badge-warning">库存不足</span>';
                
                return `<tr>
                    <td><strong>${m.lotNumber}</strong></td>
                    <td>${m.name}</td>
                    <td><span class="badge badge-info">${m.type}</span></td>
                    <td>${m.manufacturer}</td>
                    <td>${m.expiryDate}</td>
                    <td style="color: ${m.quantity <= m.minStock ? '#ff4d4f' : '#52c41a'}">${m.quantity}</td>
                    <td>${m.minStock}</td>
                    <td>${statusBadge}</td>
                </tr>`;
            }).join('');
            
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#999;">暂无材料数据</td></tr>';
            }
        }
        
        function openAddMaterialModal() {
            document.getElementById('materialModal').classList.add('active');
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        async function submitMaterial() {
            const data = {
                lotNumber: document.getElementById('newMaterialLot').value,
                name: document.getElementById('newMaterialName').value,
                type: document.getElementById('newMaterialType').value,
                manufacturer: document.getElementById('newMaterialManufacturer').value,
                expiryDate: document.getElementById('newMaterialExpiry').value,
                quantity: document.getElementById('newMaterialQuantity').value,
                minStock: document.getElementById('newMaterialMinStock').value
            };
            
            if (!data.lotNumber || !data.name || !data.expiryDate) {
                showAlert('materialAlert', '请填写必填字段', 'error');
                return;
            }
            
            const res = await fetch(`${API}/materials`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (res.ok) {
                showAlert('materialAlert', '材料添加成功！', 'success');
                closeModal('materialModal');
                loadMaterials();
                loadAlerts();
            } else {
                const err = await res.json();
                showAlert('materialAlert', err.error, 'error');
            }
        }
        
        async function loadSurgeryData() {
            const [apptsRes, matsRes, surgeriesRes] = await Promise.all([
                fetch(`${API}/appointments`),
                fetch(`${API}/materials`),
                fetch(`${API}/surgeries`)
            ]);
            
            const appts = await apptsRes.json();
            const materials = await matsRes.json();
            const surgeries = await surgeriesRes.json();
            
            const pendingAppts = appts.filter(a => a.status === '待手术');
            const select = document.getElementById('surgeryAppointment');
            select.innerHTML = '<option value="">-- 请选择预约 --</option>' + 
                pendingAppts.map(a => `<option value="${a.id}">${a.appointmentNo} - ${a.patientName} (${a.doctorName})</option>`).join('');
            
            document.getElementById('surgeryDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('materialsList').innerHTML = '';
            addMaterialRow();
            
            const tbody = document.getElementById('surgeriesTable');
            tbody.innerHTML = surgeries.map(s => `
                <tr>
                    <td><strong>${s.surgeryNo}</strong></td>
                    <td>${s.appointmentNo}</td>
                    <td>${s.patientName}</td>
                    <td>${s.doctorName}</td>
                    <td>${s.surgeryDate}</td>
                    <td>${(s.materials || []).map(m => `${m.materialName}(${m.lotNumber})x${m.quantity}`).join(', ') || '-'}</td>
                    <td><button class="btn btn-danger" onclick="deleteSurgery('${s.id}')">删除</button></td>
                </tr>
            `).join('');
            
            if (surgeries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#999;">暂无手术记录</td></tr>';
            }
            
            window.availableMaterials = materials.filter(m => !m.isExpired);
        }
        
        function addMaterialRow() {
            const container = document.getElementById('materialsList');
            const materials = window.availableMaterials || [];
            
            const div = document.createElement('div');
            div.className = 'material-item';
            div.innerHTML = `
                <select style="flex:2;padding:10px;border:1px solid #d9d9d9;border-radius:6px;" class="material-select">
                    <option value="">-- 选择材料 --</option>
                    ${materials.map(m => `<option value="${m.lotNumber}" data-qty="${m.quantity}">${m.lotNumber} - ${m.name} (库存: ${m.quantity})</option>`).join('')}
                </select>
                <input type="number" class="material-qty" value="1" min="1" style="width:100px;padding:10px;border:1px solid #d9d9d9;border-radius:6px;" placeholder="数量">
                <button class="btn btn-danger" onclick="this.parentElement.remove()">移除</button>
            `;
            container.appendChild(div);
        }
        
        async function submitSurgery() {
            const appointmentId = document.getElementById('surgeryAppointment').value;
            const surgeryDate = document.getElementById('surgeryDate').value;
            
            if (!appointmentId) {
                showAlert('surgeryFormAlert', '请选择手术预约', 'error');
                return;
            }
            
            const materialItems = document.querySelectorAll('.material-item');
            const materials = [];
            for (const item of materialItems) {
                const select = item.querySelector('.material-select');
                const qty = item.querySelector('.material-qty');
                if (select.value && qty.value) {
                    materials.push({
                        lotNumber: select.value,
                        quantity: parseInt(qty.value)
                    });
                }
            }
            
            if (materials.length === 0) {
                showAlert('surgeryFormAlert', '请至少添加一种使用材料', 'error');
                return;
            }
            
            const res = await fetch(`${API}/surgeries`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointmentId, surgeryDate, materials })
            });
            
            if (res.ok) {
                showAlert('surgeryFormAlert', '手术登记成功！库存已自动扣减', 'success');
                loadSurgeryData();
                loadMaterials();
                loadAlerts();
            } else {
                const err = await res.json();
                showAlert('surgeryFormAlert', err.error, 'error');
            }
        }
        
        async function deleteSurgery(id) {
            if (!confirm('确定要删除此手术记录吗？')) return;
            
            const res = await fetch(`${API}/surgeries/${id}`, { method: 'DELETE' });
            if (res.ok) {
                loadSurgeryData();
            } else {
                const err = await res.json();
                alert(err.error);
            }
        }
        
        async function searchRecall() {
            const lotNumber = document.getElementById('recallLot').value;
            if (!lotNumber) return;
            
            const res = await fetch(`${API}/recall/${lotNumber}`);
            const result = document.getElementById('recallResult');
            
            if (!res.ok) {
                result.innerHTML = '<div class="alert alert-error">未找到该批号</div>';
                return;
            }
            
            const data = await res.json();
            result.innerHTML = `
                <div class="card" style="margin:0;">
                    <h3>批号信息</h3>
                    <p><strong>批号:</strong> ${data.material.lotNumber}</p>
                    <p><strong>材料名称:</strong> ${data.material.name}</p>
                    <p><strong>制造商:</strong> ${data.material.manufacturer}</p>
                    <p><strong>过期日期:</strong> ${data.material.expiryDate}</p>
                    <p><strong>当前库存:</strong> ${data.material.quantity}</p>
                    <hr style="margin:15px 0;">
                    <h3>影响患者 (${data.affectedCount} 人)</h3>
                    ${data.affectedPatients.length === 0 ? 
                        '<p style="color:#999;">该批号尚未使用，无影响患者</p>' :
                        '<table>' +
                        '<thead><tr><th>患者ID</th><th>患者姓名</th><th>电话</th><th>手术编号</th><th>手术日期</th><th>使用数量</th></tr></thead>' +
                        '<tbody>' + data.affectedPatients.map(p => `
                            <tr>
                                <td>${p.patient.patientId}</td>
                                <td>${p.patient.name}</td>
                                <td>${p.patient.phone}</td>
                                <td>${p.surgery.surgeryNo}</td>
                                <td>${p.surgery.surgeryDate}</td>
                                <td>${p.usage.quantity}</td>
                            </tr>
                        `).join('') + '</tbody></table>'
                    }
                </div>
            `;
        }
        
        async function loadAlerts() {
            const res = await fetch(`${API}/stock-alerts`);
            const alerts = await res.json();
            
            document.getElementById('alertCount').textContent = alerts.length;
            document.getElementById('lowStockCount').textContent = alerts.filter(a => a.type === 'lowStock').length;
            document.getElementById('expiredCount').textContent = alerts.filter(a => a.type === 'expired').length;
            
            const container = document.getElementById('alertsList');
            if (alerts.length === 0) {
                container.innerHTML = '<div class="alert alert-success">🎉 暂无预警，所有材料状态正常</div>';
            } else {
                container.innerHTML = alerts.map(a => `
                    <div class="alert alert-${a.type === 'expired' ? 'error' : 'warning'}">
                        <strong>${a.material.lotNumber}</strong> - ${a.material.name}<br>
                        ${a.message}
                    </div>
                `).join('');
            }
        }
        
        async function searchTrace() {
            const type = document.getElementById('traceType').value;
            const keyword = document.getElementById('traceKeyword').value;
            if (!keyword) return;
            
            const res = await fetch(`${API}/trace/${type}/${keyword}`);
            const result = document.getElementById('traceResult');
            
            if (!res.ok) {
                result.innerHTML = '<div class="alert alert-error">未找到相关数据</div>';
                return;
            }
            
            const data = await res.json();
            
            if (type === 'lot') {
                result.innerHTML = `
                    <div class="card" style="margin:0;">
                        <h3>追溯链路 - 批号: ${keyword}</h3>
                        <p><strong>材料:</strong> ${data.material.name} (${data.material.manufacturer})</p>
                        <hr style="margin:15px 0;">
                        <h4>使用记录</h4>
                        ${data.chain.length === 0 ? 
                            '<p style="color:#999;">该批号尚未使用</p>' :
                            data.chain.map(node => `
                                <div class="trace-chain">
                                    <div class="trace-node">
                                        <h4>🏥 手术: ${node.surgery.surgeryNo}</h4>
                                        <p><strong>日期:</strong> ${node.surgery.surgeryDate}</p>
                                        <p><strong>👨‍⚕️ 医生:</strong> ${node.doctor.name} (${node.doctor.department})</p>
                                        <p><strong>👤 患者:</strong> ${node.patient.name} (ID: ${node.patient.patientId})</p>
                                        <p><strong>使用数量:</strong> ${node.usage.quantity}</p>
                                        <p><strong>使用时间:</strong> ${node.usage.usedAt}</p>
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>
                `;
            } else {
                result.innerHTML = `
                    <div class="card" style="margin:0;">
                        <h3>追溯链路 - 患者: ${data.patient.name} (${data.patient.patientId})</h3>
                        <p><strong>电话:</strong> ${data.patient.phone} | <strong>性别:</strong> ${data.patient.gender} | <strong>年龄:</strong> ${data.patient.age}岁</p>
                        <hr style="margin:15px 0;">
                        <h4>手术记录</h4>
                        ${data.chain.length === 0 ? 
                            '<p style="color:#999;">该患者暂无手术记录</p>' :
                            data.chain.map(node => `
                                <div class="trace-chain">
                                    <div class="trace-node">
                                        <h4>🏥 手术: ${node.surgery.surgeryNo}</h4>
                                        <p><strong>日期:</strong> ${node.surgery.surgeryDate}</p>
                                        <p><strong>👨‍⚕️ 医生:</strong> ${node.doctor.name} (${node.doctor.department})</p>
                                        <p><strong>使用材料:</strong></p>
                                        <ul>
                                            ${node.materials.map(m => `<li>${m.name} (批号: ${m.lotNumber}) x ${m.quantity}</li>`).join('')}
                                        </ul>
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>
                `;
            }
        }
        
        function exportTrace() {
            const type = document.getElementById('traceType').value;
            const keyword = document.getElementById('traceKeyword').value;
            
            let url = `${API}/export/trace`;
            if (keyword) {
                url += `?type=${type}&keyword=${encodeURIComponent(keyword)}`;
            }
            
            window.location.href = url;
        }
        
        async function initDemoData() {
            const res = await fetch(`${API}/data/init`);
            const data = await res.json();
            if (data.success) {
                document.getElementById('demoBanner').style.display = 'none';
                loadMaterials();
                loadSurgeryData();
                loadAlerts();
                alert('样例数据已初始化！\n\n📋 包含内容：\n- 4种材料（含过期和库存不足的示例）\n- 3位患者\n- 2位医生\n- 2个手术预约\n- 1个已完成手术\n\n您可以开始体验所有功能了！');
            }
        }
        
        loadMaterials();
        loadSurgeryData();
        loadAlerts();
    </script>
</body>
</html>
