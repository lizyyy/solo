[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhr-validator"
version = "0.1.0"
description = "流星雨 ZHR 复核器 - 业余天文社观测记录整理工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "python-dateutil>=2.8",
    "zoneinfo",
    "rich>=13.0",
]

[project.scripts]
zhr = "zhr_validator.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["zhr_validator"]
