[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "port-inspector"
version = "0.1.0"
authors = [
  { name="Port Inspector Team", email="inspector@example.com" }
]
description = "端口占用巡检命令行工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "click>=8.0.0",
  "pydantic>=2.0.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "python-dateutil>=2.8.0",
]

[project.scripts]
port-inspector = "port_inspector.cli:main"
