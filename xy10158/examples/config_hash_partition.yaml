database:
  connection_string: "sqlite:///./examples/test_db.sqlite"
  schema: null

archive:
  source_table: "transactions"
  target_table: "transactions_archive"
  primary_key: "txn_id"
  batch_size: 500
  
  partition:
    type: "hash"
    column: "account_id"
    values: [0, 1, 2, 3]
  
  archive_condition: "status = 'SETTLED'"
  validate_columns:
    - "account_id"
    - "amount"
  exclude_columns: []

report:
  output_dir: "./archive_reports"
  format: "json"
  include_sql: true
  include_sample_data: true
  sample_limit: 10
