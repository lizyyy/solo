database:
  connection_string: "sqlite:///./examples/test_db.sqlite"
  schema: null

archive:
  source_table: "orders"
  target_table: "orders_archive"
  primary_key: "order_id"
  batch_size: 1000
  
  partition:
    type: "list"
    column: "status"
    values:
      - "COMPLETED"
      - "CANCELLED"
      - "REFUNDED"
  
  archive_condition: "order_date < '2023-01-01'"
  validate_columns:
    - "customer_id"
    - "total_amount"
  exclude_columns: []

report:
  output_dir: "./archive_reports"
  format: "json"
  include_sql: true
  include_sample_data: true
  sample_limit: 10
