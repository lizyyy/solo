[project]
name = "interview-scheduler"
version = "1.0.0"
description = "招聘面试排班 CLI 工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
interview-scheduler = "interview_scheduler.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["interview_scheduler*"]
