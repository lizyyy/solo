[project]
name = "filecopy-simulator"
version = "0.1.0"
description = "文件传输拷贝链路模拟工具 - 帮助后端新人理解大文件传输中的拷贝路径"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
filecopy = "filecopy_simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filecopy_simulator"]
