[project]
name = "silk-processing-tool"
version = "1.0.0"
description = "缫丝工艺计算工具 - 为小厂工艺员设计的本地科学计算工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "sqlalchemy>=1.4.0",
    "pydantic>=1.9.0",
    "rich>=10.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
]

[project.scripts]
silk-tool = "silk_processing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silk_processing"]
