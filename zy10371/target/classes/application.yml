server:
  port: 8080

spring:
  application:
    name: dual-confirmation-api
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  confirmation:
    default-expire-minutes: 1440
    high-risk-expire-minutes: 60
    required-confirmers: 2
