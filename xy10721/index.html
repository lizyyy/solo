<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误告警合并中心</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 2.2em;
            font-weight: bold;
        }
        .stat-card.total .value { color: #667eea; }
        .stat-card.merged .value { color: #10b981; }
        .stat-card.failed .value { color: #ef4444; }
        .stat-card.reviewed .value { color: #f59e0b; }
        .stat-card.affected .value { color: #8b5cf6; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .chart-container h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.4em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            color: #555;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a67d8;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            color: #555;
            font-weight: 600;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .badge-merged { background: #d1fae5; color: #065f46; }
        .badge-failed { background: #fee2e2; color: #991b1b; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-reviewed { background: #e0e7ff; color: #3730a3; }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: #e5e7eb;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        
        .review-card {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }
        .review-card h4 {
            color: #92400e;
            margin-bottom: 8px;
        }
        .review-card p {
            color: #78350f;
            margin: 5px 0;
        }
        
        .diff-highlight {
            animation: highlight 2s ease-in-out;
        }
        @keyframes highlight {
            0%, 100% { background: transparent; }
            50% { background: #fef08a; }
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔔 错误告警合并中心</h1>
        
        <div class="stats-grid">
            <div class="stat-card total">
                <h3>告警总数</h3>
                <div class="value" id="totalAlerts">0</div>
            </div>
            <div class="stat-card merged">
                <h3>已合并告警</h3>
                <div class="value" id="mergedAlerts">0</div>
            </div>
            <div class="stat-card failed">
                <h3>静默窗口失败</h3>
                <div class="value" id="silentFailed">0</div>
            </div>
            <div class="stat-card reviewed">
                <h3>已复盘</h3>
                <div class="value" id="reviewed">0</div>
            </div>
            <div class="stat-card affected">
                <h3>影响用户总数</h3>
                <div class="value" id="totalAffected">0</div>
            </div>
        </div>
        
        <div class="dashboard-grid">
            <div class="chart-container">
                <h2>📊 各指纹告警分布</h2>
                <canvas id="fingerprintChart"></canvas>
            </div>
            <div class="chart-container">
                <h2>👥 影响用户分布</h2>
                <canvas id="affectedChart"></canvas>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('fingerprints')">🔍 告警指纹</button>
            <button class="tab" onclick="switchTab('rules')">⚙️ 合并规则</button>
            <button class="tab" onclick="switchTab('alerts')">🚨 告警列表</button>
            <button class="tab" onclick="switchTab('reviews')">📝 复盘记录</button>
            <button class="tab" onclick="switchTab('demo')">🎯 演示场景</button>
        </div>
        
        <div id="fingerprints" class="tab-content active">
            <div class="section">
                <h2>录入告警指纹</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>指纹名称</label>
                        <input type="text" id="fpName" placeholder="例如：支付超时错误">
                    </div>
                    <div class="form-group">
                        <label>匹配模式</label>
                        <input type="text" id="fpPattern" placeholder="例如：Payment timeout">
                    </div>
                    <div class="form-group">
                        <label>所属模块</label>
                        <input type="text" id="fpModule" placeholder="例如：支付模块">
                    </div>
                    <div class="form-group">
                        <label>负责人</label>
                        <input type="text" id="fpOwner" placeholder="例如：张工">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addFingerprint()">添加指纹</button>
                
                <table>
                    <thead>
                        <tr>
                            <th>指纹名称</th>
                            <th>匹配模式</th>
                            <th>所属模块</th>
                            <th>负责人</th>
                            <th>创建时间</th>
                        </tr>
                    </thead>
                    <tbody id="fingerprintTable"></tbody>
                </table>
            </div>
        </div>
        
        <div id="rules" class="tab-content">
            <div class="section">
                <h2>配置合并规则</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>选择指纹</label>
                        <select id="ruleFingerprint"></select>
                    </div>
                    <div class="form-group">
                        <label>规则名称</label>
                        <input type="text" id="ruleName" placeholder="规则名称">
                    </div>
                    <div class="form-group">
                        <label>时间窗口（分钟）</label>
                        <input type="number" id="ruleWindow" value="10">
                    </div>
                    <div class="form-group">
                        <label>最大影响用户阈值</label>
                        <input type="number" id="ruleThreshold" value="20">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addMergeRule()">添加规则</button>
                <button class="btn btn-success" onclick="recalculateAll()" style="margin-left: 10px;">🔄 重新计算所有</button>
                
                <table>
                    <thead>
                        <tr>
                            <th>规则名称</th>
                            <th>关联指纹</th>
                            <th>时间窗口</th>
                            <th>用户阈值</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="ruleTable"></tbody>
                </table>
            </div>
        </div>
        
        <div id="alerts" class="tab-content">
            <div class="section">
                <h2>告警列表</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>选择指纹</label>
                        <select id="alertFingerprint"></select>
                    </div>
                    <div class="form-group">
                        <label>影响用户数</label>
                        <input type="number" id="alertAffected" value="10">
                    </div>
                    <div class="form-group">
                        <label>告警消息</label>
                        <input type="text" id="alertMessage" placeholder="告警详情">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addAlert()">添加告警</button>
                
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>指纹</th>
                            <th>影响用户</th>
                            <th>消息</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="alertTable"></tbody>
                </table>
            </div>
        </div>
        
        <div id="reviews" class="tab-content">
            <div class="section">
                <h2>复盘记录</h2>
                <div id="reviewList"></div>
            </div>
        </div>
        
        <div id="demo" class="tab-content">
            <div class="section">
                <h2>🎯 演示场景</h2>
                <p style="margin-bottom: 20px; color: #666;">选择一个演示场景，观察数据变化：</p>
                
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button class="btn btn-danger" onclick="demoDirtyData()">🔴 展示脏数据效果</button>
                    <button class="btn btn-warning" onclick="demoSilentWindowFail()">⚠️ 静默窗口失败修正路径</button>
                    <button class="btn btn-success" onclick="demoRecalculate()">🔄 影响用户变化重新计算</button>
                </div>
                
                <div id="demoArea" style="margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 8px; display: none;">
                    <h3 id="demoTitle"></h3>
                    <p id="demoDescription"></p>
                    <div id="demoContent"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <h3>📝 负责人复盘处理</h3>
            <input type="hidden" id="reviewAlertId">
            <input type="hidden" id="reviewFingerprintId">
            <div class="form-group">
                <label>处理人</label>
                <input type="text" id="reviewHandler" value="客服主管-陈经理">
            </div>
            <div class="form-group">
                <label>处理理由</label>
                <textarea id="reviewReason" rows="3" placeholder="说明静默窗口失败的原因..."></textarea>
            </div>
            <div class="form-group">
                <label>采取措施</label>
                <textarea id="reviewAction" rows="3" placeholder="描述已采取的行动..."></textarea>
            </div>
            <div class="form-group">
                <label>解决方案</label>
                <textarea id="reviewResolution" rows="3" placeholder="最终解决方案..."></textarea>
            </div>
            <div class="form-group">
                <label style="flex-direction: row; align-items: center; gap: 10px;">
                    <input type="checkbox" id="followUpRequired"> 需要跟进
                </label>
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="submitReview()">提交复盘</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let fingerprints = [];
        let alerts = [];
        let rules = [];
        let reviews = [];
        let fingerprintChart, affectedChart;

        async function init() {
            await loadAllData();
            initCharts();
        }

        async function loadAllData() {
            const [fpRes, alertRes, ruleRes, reviewRes, statsRes] = await Promise.all([
                fetch(`${API_BASE}/fingerprints`),
                fetch(`${API_BASE}/alerts`),
                fetch(`${API_BASE}/merge-rules`),
                fetch(`${API_BASE}/reviews`),
                fetch(`${API_BASE}/statistics`)
            ]);
            
            fingerprints = await fpRes.json();
            alerts = await alertRes.json();
            rules = await ruleRes.json();
            reviews = await reviewRes.json();
            const stats = await statsRes.json();
            
            updateStats(stats.summary);
            updateFingerprintSelects();
            renderFingerprintTable();
            renderRuleTable();
            renderAlertTable();
            renderReviews();
            updateCharts(stats.by_fingerprint);
        }

        function updateStats(summary) {
            document.getElementById('totalAlerts').textContent = summary.total_alerts;
            document.getElementById('mergedAlerts').textContent = summary.merged_alerts;
            document.getElementById('silentFailed').textContent = summary.silent_window_failed;
            document.getElementById('reviewed').textContent = summary.reviewed;
            document.getElementById('totalAffected').textContent = summary.total_affected_users;
        }

        function initCharts() {
            const ctx1 = document.getElementById('fingerprintChart').getContext('2d');
            const ctx2 = document.getElementById('affectedChart').getContext('2d');
            
            fingerprintChart = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: '告警数量',
                        data: [],
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });
            
            affectedChart = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [
                            'rgba(239, 68, 68, 0.8)',
                            'rgba(16, 185, 129, 0.8)',
                            'rgba(245, 158, 11, 0.8)'
                        ]
                    }]
                },
                options: {
                    responsive: true
                }
            });
        }

        function updateCharts(byFingerprint) {
            fingerprintChart.data.labels = byFingerprint.map(f => f.fingerprint_name);
            fingerprintChart.data.datasets[0].data = byFingerprint.map(f => f.alert_count);
            fingerprintChart.update();
            
            affectedChart.data.labels = byFingerprint.map(f => f.fingerprint_name);
            affectedChart.data.datasets[0].data = byFingerprint.map(f => f.total_affected_users);
            affectedChart.update();
        }

        function updateFingerprintSelects() {
            const selects = ['ruleFingerprint', 'alertFingerprint'];
            selects.forEach(id => {
                const select = document.getElementById(id);
                select.innerHTML = fingerprints.map(fp => 
                    `<option value="${fp.id}">${fp.name}</option>`
                ).join('');
            });
        }

        async function addFingerprint() {
            const fp = {
                name: document.getElementById('fpName').value,
                pattern: document.getElementById('fpPattern').value,
                module: document.getElementById('fpModule').value,
                owner: document.getElementById('fpOwner').value
            };
            
            await fetch(`${API_BASE}/fingerprints`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(fp)
            });
            await loadAllData();
        }

        async function addMergeRule() {
            const rule = {
                fingerprint_id: document.getElementById('ruleFingerprint').value,
                name: document.getElementById('ruleName').value,
                time_window_minutes: parseInt(document.getElementById('ruleWindow').value),
                max_affected_users: parseInt(document.getElementById('ruleThreshold').value),
                auto_merge: true,
                status: 'active'
            };
            
            await fetch(`${API_BASE}/merge-rules`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(rule)
            });
            await loadAllData();
        }

        async function addAlert() {
            const alert = {
                fingerprint_id: document.getElementById('alertFingerprint').value,
                affected_users: parseInt(document.getElementById('alertAffected').value),
                message: document.getElementById('alertMessage').value,
                merged: false,
                silent_window_failed: false,
                reviewed: false
            };
            
            await fetch(`${API_BASE}/alerts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(alert)
            });
            await loadAllData();
        }

        function renderFingerprintTable() {
            const tbody = document.getElementById('fingerprintTable');
            tbody.innerHTML = fingerprints.map(fp => `
                <tr>
                    <td>${fp.name}</td>
                    <td><code>${fp.pattern}</code></td>
                    <td>${fp.module}</td>
                    <td>${fp.owner}</td>
                    <td>${new Date(fp.created_at).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function renderRuleTable() {
            const tbody = document.getElementById('ruleTable');
            const fpMap = { ...Object.fromEntries(fingerprints.map(f => [f.id, f.name])) };
            tbody.innerHTML = rules.map(rule => `
                <tr>
                    <td>${rule.name}</td>
                    <td>${fpMap[rule.fingerprint_id] || rule.fingerprint_id}</td>
                    <td>${rule.time_window_minutes}分钟</td>
                    <td>${rule.max_affected_users}人</td>
                    <td><span class="badge ${rule.status === 'active' ? 'badge-merged' : 'badge-failed'}">${rule.status === 'active' ? '激活' : '需关注'}</span></td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="adjustRuleThreshold('${rule.id}', ${rule.max_affected_users + 10})">阈值+10</button>
                    </td>
                </tr>
            `).join('');
        }

        async function adjustRuleThreshold(ruleId, newThreshold) {
            const rule = rules.find(r => r.id === ruleId);
            if (rule) {
                await fetch(`${API_BASE}/merge-rules/${ruleId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ max_affected_users: newThreshold })
                });
                await loadAllData();
            }
        }

        function renderAlertTable() {
            const tbody = document.getElementById('alertTable');
            const fpMap = { ...Object.fromEntries(fingerprints.map(f => [f.id, f.name])) };
            tbody.innerHTML = alerts.map(alert => `
                <tr id="alert-row-${alert.id}">
                    <td>${alert.id.slice(-6)}</td>
                    <td>${fpMap[alert.fingerprint_id] || alert.fingerprint_id}</td>
                    <td>
                        <input type="number" value="${alert.affected_users}" 
                               onchange="updateAffectedUsers('${alert.id}', this.value)"
                               style="width: 80px; padding: 5px;">
                    </td>
                    <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis;">${alert.message}</td>
                    <td>
                        ${alert.silent_window_failed ? '<span class="badge badge-failed">静默失败</span>' : ''}
                        ${alert.merged ? '<span class="badge badge-merged">已合并</span>' : ''}
                        ${alert.reviewed ? '<span class="badge badge-reviewed">已复盘</span>' : ''}
                        ${!alert.merged && !alert.silent_window_failed && !alert.reviewed ? '<span class="badge badge-pending">待处理</span>' : ''}
                    </td>
                    <td>
                        ${alert.silent_window_failed && !alert.reviewed ? 
                            `<button class="btn btn-warning btn-sm" onclick="openReviewModal('${alert.id}', '${alert.fingerprint_id}')">📝 负责人介入</button>` : 
                            ''}
                    </td>
                </tr>
            `).join('');
        }

        async function updateAffectedUsers(alertId, newValue) {
            await fetch(`${API_BASE}/alerts/${alertId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ affected_users: parseInt(newValue) })
            });
            
            const row = document.getElementById(`alert-row-${alertId}`);
            if (row) {
                row.classList.add('diff-highlight');
                setTimeout(() => row.classList.remove('diff-highlight'), 2000);
            }
            
            await loadAllData();
        }

        function renderReviews() {
            const container = document.getElementById('reviewList');
            const fpMap = { ...Object.fromEntries(fingerprints.map(f => [f.id, f.name])) };
            container.innerHTML = reviews.map(review => `
                <div class="review-card">
                    <h4>🔍 复盘记录 - ${fpMap[review.fingerprint_id] || review.fingerprint_id}</h4>
                    <p><strong>处理人：</strong>${review.handler}</p>
                    <p><strong>处理理由：</strong>${review.reason}</p>
                    <p><strong>采取措施：</strong>${review.action_taken}</p>
                    <p><strong>解决方案：</strong>${review.resolution}</p>
                    <p><strong>处理时间：</strong>${new Date(review.reviewed_at).toLocaleString()}</p>
                    ${review.follow_up_required ? '<p><strong>⚠️ 需要后续跟进</strong></p>' : ''}
                </div>
            `).join('');
        }

        async function recalculateAll() {
            await fetch(`${API_BASE}/recalculate`, { method: 'POST' });
            await loadAllData();
            alert('重新计算完成！');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function openReviewModal(alertId, fingerprintId) {
            document.getElementById('reviewAlertId').value = alertId;
            document.getElementById('reviewFingerprintId').value = fingerprintId;
            document.getElementById('reviewModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('reviewModal').classList.remove('active');
        }

        async function submitReview() {
            const review = {
                alert_id: document.getElementById('reviewAlertId').value,
                fingerprint_id: document.getElementById('reviewFingerprintId').value,
                handler: document.getElementById('reviewHandler').value,
                reason: document.getElementById('reviewReason').value,
                action_taken: document.getElementById('reviewAction').value,
                resolution: document.getElementById('reviewResolution').value,
                follow_up_required: document.getElementById('followUpRequired').checked
            };
            
            await fetch(`${API_BASE}/reviews`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(review)
            });
            
            closeModal();
            await loadAllData();
        }

        function demoDirtyData() {
            document.getElementById('demoArea').style.display = 'block';
            document.getElementById('demoTitle').textContent = '🔴 脏数据效果演示';
            document.getElementById('demoDescription').textContent = '当前系统中包含以下\"脏数据\" - 超过阈值的告警：';
            
            const fpMap = { ...Object.fromEntries(fingerprints.map(f => [f.id, f.name])) };
            const ruleMap = { ...Object.fromEntries(rules.map(r => [r.fingerprint_id, r])) };
            
            const dirtyAlerts = alerts.filter(a => a.silent_window_failed);
            document.getElementById('demoContent').innerHTML = `
                <div style="background: #fee2e2; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <h4 style="color: #991b1b; margin-bottom: 10px;">⚠️ 超过阈值的告警（静默窗口失败）</h4>
                    ${dirtyAlerts.map(a => {
                        const rule = ruleMap[a.fingerprint_id];
                        const threshold = rule ? rule.max_affected_users : 'N/A';
                        return `
                            <div style="padding: 8px; background: white; margin: 5px 0; border-radius: 4px;">
                                <strong>${fpMap[a.fingerprint_id]}</strong> - 影响用户: <span style="color: #dc2626; font-weight: bold;">${a.affected_users}</span> 
                                (阈值: ${threshold}) → <span style="color: #dc2626;">静默窗口失败</span>
                            </div>
                        `;
                    }).join('')}
                </div>
                <p style="color: #666;">💡 提示：在\"告警列表\"标签页中修改影响用户数，观察状态变化！</p>
            `;
        }

        function demoSilentWindowFail() {
            document.getElementById('demoArea').style.display = 'block';
            document.getElementById('demoTitle').textContent = '⚠️ 静默窗口失败修正路径';
            document.getElementById('demoDescription').textContent = '完整的修正流程：静默失败 → 负责人介入 → 生成复盘记录';
            
            const unreviewedFail = alerts.find(a => a.silent_window_failed && !a.reviewed);
            const fpMap = { ...Object.fromEntries(fingerprints.map(f => [f.id, f.name])) };
            
            document.getElementById('demoContent').innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                    <div style="background: #fee2e2; padding: 15px; border-radius: 8px;">
                        <h4 style="color: #991b1b;">1. 静默失败</h4>
                        ${unreviewedFail ? `
                            <p><strong>${fpMap[unreviewedFail.fingerprint_id]}</strong></p>
                            <p>影响用户: ${unreviewedFail.affected_users}</p>
                            <p style="color: #dc2626; font-weight: bold;">状态: 静默窗口失败 ✗</p>
                        ` : '<p>暂无未处理的失败告警</p>'}
                    </div>
                    <div style="background: #fef3c7; padding: 15px; border-radius: 8px;">
                        <h4 style="color: #92400e;">2. 负责人介入</h4>
                        <p>客服主管介入分析</p>
                        <p>记录失败原因</p>
                        <p>制定解决方案</p>
                    </div>
                    <div style="background: #d1fae5; padding: 15px; border-radius: 8px;">
                        <h4 style="color: #065f46;">3. 生成复盘</h4>
                        <p>永久记录处理过程</p>
                        <p>便于后续审计跟进</p>
                        <p style="color: #059669; font-weight: bold;">已复盘: ${reviews.length} 条 ✓</p>
                    </div>
                </div>
                <p style="margin-top: 15px; color: #666;">💡 操作：切换到\"告警列表\"，点击\"负责人介入\"按钮体验完整流程！</p>
            `;
        }

        function demoRecalculate() {
            document.getElementById('demoArea').style.display = 'block';
            document.getElementById('demoTitle').textContent = '🔄 影响用户变化重新计算';
            document.getElementById('demoDescription').textContent = '当影响用户数变化时，系统自动重新计算合并状态：';
            
            const fpMap = { ...Object.fromEntries(fingerprints.map(f => [f.id, f.name])) };
            const ruleMap = { ...Object.fromEntries(rules.map(r => [r.fingerprint_id, r])) };
            
            document.getElementById('demoContent').innerHTML = `
                <div style="background: #e0e7ff; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <h4 style="color: #3730a3; margin-bottom: 10px;">📐 当前阈值规则</h4>
                    ${rules.map(r => `
                        <div style="padding: 8px; background: white; margin: 5px 0; border-radius: 4px;">
                            <strong>${fpMap[r.fingerprint_id]}</strong>: 阈值 = ${r.max_affected_users}人
                        </div>
                    `).join('')}
                </div>
                <div style="background: #f0fdf4; padding: 15px; border-radius: 8px;">
                    <h4 style="color: #166534; margin-bottom: 10px;">🔄 重新计算逻辑</h4>
                    <p>IF 影响用户数 > 阈值 → 标记为\"静默窗口失败\"，停止自动合并</p>
                    <p>IF 影响用户数 ≤ 阈值 → 恢复自动合并状态</p>
                    <p style="margin-top: 10px; color: #15803d; font-weight: bold;">✓ 修改用户数后状态自动更新，页面和接口数据保持一致</p>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
