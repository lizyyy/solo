[project]
name = "license-scanner"
version = "0.1.0"
description = "素材授权包巡检员 - 设计外包团队素材授权管理工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pypdf>=3.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
license-scanner = "license_scanner.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/license_scanner"]
