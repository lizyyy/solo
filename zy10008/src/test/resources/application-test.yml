server:
  port: 8081

spring:
  application:
    name: config-hot-update-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  redis:
    host: localhost
    port: 6379

config:
  hot-update:
    cache:
      enabled: false
    event-log:
      enabled: true
    push:
      max-retry-count: 3
      retry-backoff-milliseconds: 100

logging:
  level:
    com.example.config: DEBUG

app:
  instance-id: test-instance
