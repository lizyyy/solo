server:
  port: 8080

spring:
  application:
    name: config-hot-update

  datasource:
    url: jdbc:h2:mem:configdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

config:
  hot-update:
    cache:
      enabled: true
      local-cache-size: 1000
      local-cache-expire-seconds: 300
      redis-ttl-seconds: 600
    push:
      timeout-seconds: 30
      max-retry-count: 5
      retry-backoff-milliseconds: 1000
      concurrency: 10
    event-log:
      enabled: true
      keep-days: 30
    websocket:
      heartbeat-interval-seconds: 30
      disconnect-timeout-seconds: 60
    idempotent:
      enabled: true
      ttl-seconds: 600

logging:
  level:
    com.example.config: DEBUG
    org.springframework.web: INFO

app:
  instance-id: ${spring.application.name}-${random.uuid}
