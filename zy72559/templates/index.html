<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷启动相似用户扩展系统</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>冷启动相似用户扩展系统</h1>
            <p>评测切片管理 · 冲突检测 · 自检 · 异常样本复核</p>
        </div>

        <div class="card">
            <h2>导入评测切片</h2>
            <div class="step-indicator">
                <div class="step active">
                    <div class="step-number">1</div>
                    <div class="step-label">导入切片</div>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <div class="step-label">补看快照编号</div>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-label">异常样本页</div>
                </div>
            </div>

            <form id="importForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>评测切片ID *</label>
                        <input type="text" id="slice_id" placeholder="如: EVAL_20260601_001" required>
                    </div>
                    <div class="form-group">
                        <label>评测切片名称 *</label>
                        <input type="text" id="slice_name" placeholder="如: 618新客冷启动扩展" required>
                    </div>
                    <div class="form-group">
                        <label>种子用户数 *</label>
                        <input type="number" id="total_users" placeholder="如: 200" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>时间窗起始</label>
                        <input type="date" id="time_window_start">
                    </div>
                    <div class="form-group">
                        <label>时间窗截止</label>
                        <input type="date" id="time_window_end">
                    </div>
                    <div class="form-group">
                        <label>特征快照编号 (可选)</label>
                        <select id="feature_snapshot_id">
                            <option value="">-- 稍后补录 --</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>操作人</label>
                    <input type="text" id="operator" value="小孟">
                </div>
                <button type="submit" class="btn btn-primary">导入评测切片</button>
            </form>
        </div>

        <div class="card">
            <h2>评测切片列表</h2>
            <div id="sliceList">
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <p>暂无评测切片数据，先导入一个吧</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function loadSnapshots() {
            try {
                const res = await fetch(`${API_BASE}/snapshots`);
                const data = await res.json();
                const select = document.getElementById('feature_snapshot_id');
                data.data.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.snapshot_id;
                    opt.textContent = `${s.snapshot_id} - ${s.snapshot_name}`;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('加载快照列表失败', e);
            }
        }

        async function initSnapshots() {
            try {
                await fetch(`${API_BASE}/snapshots/init`, { method: 'POST' });
                loadSnapshots();
            } catch (e) {
                console.error('初始化快照失败', e);
            }
        }

        async function loadSlices() {
            try {
                const res = await fetch(`${API_BASE}/slices`);
                const data = await res.json();
                const container = document.getElementById('sliceList');
                
                if (data.data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <p>暂无评测切片数据，先导入一个吧</p>
                        </div>
                    `;
                    return;
                }

                let html = '<table><thead><tr><th>切片ID</th><th>名称</th><th>特征快照</th><th>状态</th><th>种子用户</th><th>导入人</th><th>导入时间</th><th>操作</th></tr></thead><tbody>';
                data.data.forEach(s => {
                    const statusMap = {
                        'pending': '待处理',
                        'imported': '已导入',
                        'snapshot_supplemented': '已补录快照',
                        'expand_completed': '扩展完成'
                    };
                    html += `
                        <tr>
                            <td>${s.slice_id}</td>
                            <td>${s.slice_name}</td>
                            <td>${s.feature_snapshot_id || '<span style="color:#e74c3c">未设置</span>'}</td>
                            <td><span class="status-badge status-${s.status}">${statusMap[s.status] || s.status}</span></td>
                            <td>${s.total_users}</td>
                            <td>${s.imported_by}</td>
                            <td>${new Date(s.import_time).toLocaleString('zh-CN')}</td>
                            <td><a href="/slice/${s.id}">查看详情</a></td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (e) {
                console.error('加载切片列表失败', e);
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        document.getElementById('importForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const params = new URLSearchParams({
                slice_id: document.getElementById('slice_id').value,
                slice_name: document.getElementById('slice_name').value,
                total_users: document.getElementById('total_users').value,
                operator: document.getElementById('operator').value,
            });
            
            const tws = document.getElementById('time_window_start').value;
            const twe = document.getElementById('time_window_end').value;
            const fsi = document.getElementById('feature_snapshot_id').value;
            
            if (tws) params.append('time_window_start', tws);
            if (twe) params.append('time_window_end', twe);
            if (fsi) params.append('feature_snapshot_id', fsi);

            try {
                const res = await fetch(`${API_BASE}/slices/import?${params}`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    showToast('导入成功！');
                    if (data.conflicts && data.conflicts.length > 0) {
                        showToast(`检测到 ${data.conflicts.length} 个冲突，请在详情页处理`, 'warning');
                    }
                    document.getElementById('importForm').reset();
                    document.getElementById('operator').value = '小孟';
                    loadSlices();
                } else {
                    showToast(data.detail || '导入失败', 'error');
                }
            } catch (e) {
                showToast('导入失败: ' + e.message, 'error');
            }
        });

        initSnapshots();
        loadSlices();
    </script>
</body>
</html>
