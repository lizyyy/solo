[metadata]
name = exhibit-transport-inspector
version = 0.1.0
description = 博物馆展品运输押运员用的本地自动化工具 - 展箱震动温湿度复核员

[options]
packages = find:
package_dir =
    =src
python_requires = >=3.9
install_requires =
    click>=8.0.0
    pydantic>=2.0.0
    pandas>=2.0.0
    rich>=13.0.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    exhibit-inspector = exhibit_inspector.cli.main:cli

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0
