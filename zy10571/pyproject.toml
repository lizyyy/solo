[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helm-diff-cli"
version = "0.1.0"
authors = [
  { name="Your Name", email="your.email@example.com" }
]
description = "Helm模板渲染差异检查CLI工具"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "click>=8.0",
  "pyyaml>=6.0",
  "deepdiff>=6.0",
  "jinja2>=3.0",
  "rich>=13.0",
  "python-dotenv>=1.0",
]

[project.scripts]
helm-diff = "helm_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
