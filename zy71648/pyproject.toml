[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "error-propagation"
version = "0.1.0"
description = "物理实验误差传播分析工具 - 支持误差传播计算、单位校验、步骤解释、图表导出和历史追踪"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "sympy>=1.9",
    "pint>=0.18",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "plotly>=5.3",
    "typer>=0.4",
    "rich>=10.12",
    "sqlalchemy>=1.4",
    "python-dateutil>=2.8",
]

[project.scripts]
errorprop = "error_propagation.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
