                            md += `- **最小安全距离**: ${risk.minimumGap || '-'} m\n`;
                            md += `- **描述**: ${risk.description}\n\n`;
                        });
                    }
                }
                
                md += `## 四、Cue列表\n\n`;
                if (cues?.cues?.length > 0) {
                    md += `| Cue ID | Cue名称 | 开始时间 | 过渡时间 | 结束时间 |\n`;
                    md += `|--------|---------|----------|----------|----------|\n`;
                    cues.cues.forEach(cue => {
                        const endTime = cue.start_time + cue.transition_time;
                        md += `| ${cue.cue_id} | ${cue.cue_name} | ${formatTime(cue.start_time)} | ${formatTime(cue.transition_time)} | ${formatTime(endTime)} |\n`;
                    });
                    md += '\n';
                }
                
                md += `---\n\n`;
                md += `*报告由 3D舞台吊杆防撞预演工具 生成*\n`;
                
                downloadFile(md, 'replay_report.md', 'text/markdown;charset=utf-8');
            }
        };
        
        // ==================== 事件绑定 ====================
        function bindEvents() {
            DOM.loadSampleBtn.addEventListener('click', async () => {
                const success = await DataParser.loadSampleData();
                if (success) {
                    DataValidator.validateAll();
                }
            });
            
            DOM.stageFile.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    const text = await DataParser.loadFile(file);
                    AppState.stageData = await DataParser.parseYAML(text);
                    DataParser.updateFileStatus('stage', true, file.name);
                    DataValidator.validateAll();
                } catch (error) {
                    DataParser.updateFileStatus('stage', false, file.name);
                    alert(`加载失败: ${error.message}`);
                }
            });
            
            DOM.fixturesFile.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    const text = await DataParser.loadFile(file);
                    AppState.fixturesData = await DataParser.parseCSV(text);
                    DataParser.updateFileStatus('fixtures', true, file.name);
                    DataValidator.validateAll();
                } catch (error) {
                    DataParser.updateFileStatus('fixtures', false, file.name);
                    alert(`加载失败: ${error.message}`);
                }
            });
            
            DOM.cueFile.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    const text = await DataParser.loadFile(file);
                    AppState.cueData = await DataParser.parseJSON(text);
                    DataParser.updateFileStatus('cue', true, file.name);
                    DataValidator.validateAll();
                } catch (error) {
                    DataParser.updateFileStatus('cue', false, file.name);
                    alert(`加载失败: ${error.message}`);
                }
            });
            
            document.querySelectorAll('.file-upload').forEach(upload => {
                upload.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    upload.classList.add('drag-over');
                });
                
                upload.addEventListener('dragleave', () => {
                    upload.classList.remove('drag-over');
                });
                
                upload.addEventListener('drop', (e) => {
                    e.preventDefault();
                    upload.classList.remove('drag-over');
                    
                    const file = e.dataTransfer.files[0];
                    if (!file) return;
                    
                    const type = upload.dataset.type;
                    const inputId = type === 'stage' ? 'stage-file' : 
                                   type === 'fixtures' ? 'fixtures-file' : 'cue-file';
                    const input = document.getElementById(inputId);
                    
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    input.files = dataTransfer.files;
                    input.dispatchEvent(new Event('change'));
                });
            });
            
            DOM.analyzeBtn.addEventListener('click', () => {
                showLoading('分析数据中...');
                
                setTimeout(() => {
                    try {
                        DataValidator.processAndNormalizeData();
                        
                        if (AppState.parsedData) {
                            SceneRenderer.createStage(AppState.parsedData.stage);
                            SceneRenderer.createFixtures(AppState.parsedData.fixtures);
                            
                            RiskDetector.detectAllRisks();
                            
                            updateCueList();
                            
                            enablePlaybackControls();
                            
                            DOM.exportIssuesBtn.disabled = false;
                            DOM.exportReportBtn.disabled = false;
                            
                            hideLoading();
                        }
                    } catch (error) {
                        hideLoading();
                        console.error('分析失败:', error);
                        alert(`分析失败: ${error.message}`);
                    }
                }, 100);
            });
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.dataset.tab;
                    
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    document.getElementById(`tab-${tabId}`).classList.add('active');
                });
            });
            
            DOM.playBtn.addEventListener('click', () => {
                if (!AppState.parsedData) return;
                
                if (AppState.isPlaying) {
                    AppState.isPlaying = false;
                    DOM.playBtn.classList.remove('active');
                } else {
                    if (AppState.currentTime >= AppState.totalDuration) {
                        AppState.currentTime = 0;
                    }
                    AppState.isPlaying = true;
                    AppState.lastFrameTime = performance.now();
                    DOM.playBtn.classList.add('active');
                }
            });
            
            DOM.pauseBtn.addEventListener('click', () => {
                AppState.isPlaying = false;
                DOM.playBtn.classList.remove('active');
            });
            
            DOM.resetBtn.addEventListener('click', () => {
                AppState.isPlaying = false;
                AppState.currentTime = 0;
                AppState.currentCueIndex = 0;
                DOM.playBtn.classList.remove('active');
                
                if (AppState.parsedData) {
                    SceneRenderer.updateSceneForTime(0);
                    SceneRenderer.updatePlaybackUI();
                }
            });
            
            DOM.stepBackBtn.addEventListener('click', () => {
                if (!AppState.parsedData) return;
                AppState.isPlaying = false;
                DOM.playBtn.classList.remove('active');
                
                AppState.currentTime = Math.max(0, AppState.currentTime - 1);
                SceneRenderer.updateSceneForTime(AppState.currentTime);
                SceneRenderer.updatePlaybackUI();
            });
            
            DOM.stepForwardBtn.addEventListener('click', () => {
                if (!AppState.parsedData) return;
                AppState.isPlaying = false;
                DOM.playBtn.classList.remove('active');
                
                AppState.currentTime = Math.min(AppState.totalDuration, AppState.currentTime + 1);
                SceneRenderer.updateSceneForTime(AppState.currentTime);
                SceneRenderer.updatePlaybackUI();
            });
            
            DOM.timeSlider.addEventListener('input', (e) => {
                if (!AppState.parsedData) return;
                
                const value = parseFloat(e.target.value);
                AppState.currentTime = (value / 100) * AppState.totalDuration;
                
                SceneRenderer.updateSceneForTime(AppState.currentTime);
                SceneRenderer.updatePlaybackUI();
            });
            
            document.getElementById('view-top').addEventListener('click', () => SceneRenderer.setView('top'));
            document.getElementById('view-front').addEventListener('click', () => SceneRenderer.setView('front'));
            document.getElementById('view-side').addEventListener('click', () => SceneRenderer.setView('side'));
            document.getElementById('view-free').addEventListener('click', () => SceneRenderer.setView('free'));
            
            DOM.exportIssuesBtn.addEventListener('click', () => Exporter.exportIssuesCSV());
            DOM.exportReportBtn.addEventListener('click', () => Exporter.exportReportMD());
        }
        
        function updateCueList() {
            if (!AppState.parsedData || !AppState.parsedData.cues) return;
            
            const cues = AppState.parsedData.cues.cues;
            
            if (cues.length === 0) {
                DOM.cueListItems.innerHTML = `<div class="no-risks">暂无Cue数据</div>`;
                return;
            }
            
            let html = '';
            cues.forEach((cue, index) => {
                const endTime = cue.start_time + cue.transition_time;
                html += `
                    <div class="cue-item" data-cue-index="${index}" data-cue-id="${cue.cue_id}">
                        <span>${cue.cue_id}: ${cue.cue_name}</span>
                        <span>${formatTime(cue.start_time)}</span>
                    </div>
                `;
            });
            
            DOM.cueListItems.innerHTML = html;
            
            DOM.cueListItems.querySelectorAll('.cue-item').forEach(item => {
                item.addEventListener('click', () => {
                    const cueIndex = parseInt(item.dataset.cueIndex);
                    const cue = cues[cueIndex];
                    
                    AppState.isPlaying = false;
                    DOM.playBtn.classList.remove('active');
                    
                    AppState.currentTime = cue.start_time;
                    AppState.currentCueIndex = cueIndex;
                    
                    SceneRenderer.updateSceneForTime(AppState.currentTime);
                    SceneRenderer.updatePlaybackUI();
                });
            });
        }
        
        function enablePlaybackControls() {
            DOM.playBtn.disabled = false;
            DOM.pauseBtn.disabled = false;
            DOM.resetBtn.disabled = false;
            DOM.stepBackBtn.disabled = false;
            DOM.stepForwardBtn.disabled = false;
            DOM.timeSlider.disabled = false;
        }
        
        // ==================== 初始化 ====================
        function init() {
            SceneRenderer.init();
            bindEvents();
            
            console.log('3D舞台吊杆防撞预演工具已初始化');
        }
        
        init();
    </script>
</body>
</html>
