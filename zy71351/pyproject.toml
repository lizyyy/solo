[project]
name = "print-edition-cli"
version = "1.0.0"
description = "版画编号防重CLI工具"
requires-python = ">=3.9"
dependencies = [
  "click>=8.1.0",
  "pydantic>=2.0.0",
  "tabulate>=0.9.0",
  "colorama>=0.4.6",
]

[project.scripts]
print-edition = "src.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
