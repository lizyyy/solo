<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区共享活动室预约系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }
    
    .header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    
    .header p {
      opacity: 0.9;
    }
    
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    
    .nav-tab {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    
    .nav-tab.active {
      background: white;
      color: #667eea;
      font-weight: 600;
    }
    
    .nav-tab:hover:not(.active) {
      background: rgba(255, 255, 255, 0.3);
    }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }
    
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .card-header h2 {
      font-size: 1.3rem;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .card-header h2 .icon {
      font-size: 1.5rem;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    
    .form-group label .required {
      color: #e74c3c;
      margin-left: 4px;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    
    .form-control:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-control.error {
      border-color: #e74c3c;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    
    .room-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }
    
    .room-card {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .room-card:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }
    
    .room-card.selected {
      border-color: #667eea;
      background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
    }
    
    .room-card h3 {
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 8px;
    }
    
    .room-card .capacity {
      font-size: 0.9rem;
      color: #666;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .room-card .description {
      font-size: 0.85rem;
      color: #888;
      margin-top: 8px;
    }
    
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-danger {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      padding: 8px 16px;
      font-size: 0.9rem;
    }
    
    .btn-danger:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      padding: 10px 20px;
      font-size: 0.9rem;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .alert {
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    
    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .alert-warning {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }
    
    .alert-info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    
    .error-message {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .reservation-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .reservation-item {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
    }
    
    .reservation-item:hover {
      border-color: #667eea;
    }
    
    .reservation-item.confirmed {
      border-left: 4px solid #27ae60;
    }
    
    .reservation-item.waitlisted {
      border-left: 4px solid #f39c12;
    }
    
    .reservation-item.cancelled {
      border-left: 4px solid #e74c3c;
      opacity: 0.7;
    }
    
    .reservation-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    
    .reservation-room {
      font-size: 1.1rem;
      font-weight: 600;
      color: #333;
    }
    
    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    
    .status-badge.confirmed {
      background: #d4edda;
      color: #155724;
    }
    
    .status-badge.waitlisted {
      background: #fff3cd;
      color: #856404;
    }
    
    .status-badge.cancelled {
      background: #f8d7da;
      color: #721c24;
    }
    
    .reservation-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      font-size: 0.9rem;
      color: #666;
    }
    
    .detail-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .reservation-actions {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    
    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }
    
    .empty-state h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #666;
    }
    
    .empty-state p {
      font-size: 0.95rem;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f0f0f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px 24px;
      border-radius: 8px;
      color: white;
      font-weight: 500;
      z-index: 1000;
      animation: slideIn 0.3s ease;
      max-width: 400px;
    }
    
    .toast.success {
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
    }
    
    .toast.error {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    }
    
    .toast.info {
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
    }
    
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    .filter-section {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .filter-item label {
      font-weight: 500;
      color: #666;
      margin-bottom: 0;
    }
    
    .filter-item select, .filter-item input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    
    .time-slot-visual {
      margin-top: 10px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    
    .time-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      position: relative;
      margin-top: 5px;
    }
    
    .time-bar-fill {
      position: absolute;
      height: 100%;
      border-radius: 4px;
    }
    
    .time-bar-fill.booked {
      background: #e74c3c;
    }
    
    .time-bar-fill.selected {
      background: #667eea;
    }
    
    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .room-selector {
        grid-template-columns: 1fr;
      }
      
      .reservation-details {
        grid-template-columns: 1fr;
      }
      
      .header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏠 社区共享活动室预约系统</h1>
      <p>轻松预约，便捷管理，让共享更简单</p>
    </div>
    
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="booking">📅 预约活动室</button>
      <button class="nav-tab" data-tab="my-reservations">📋 我的预约</button>
    </div>
    
    <div id="booking-tab" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h2><span class="icon">➕</span> 创建新预约</h2>
        </div>
        
        <div id="form-alert"></div>
        
        <form id="booking-form">
          <div class="form-group">
            <label>选择房间 <span class="required">*</span></label>
            <div class="room-selector" id="room-selector">
            </div>
            <input type="hidden" id="room-id" name="roomId">
            <div id="room-error" class="error-message" style="display: none;"></div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="date">选择日期 <span class="required">*</span></label>
              <input type="date" id="date" name="date" class="form-control">
              <div id="date-error" class="error-message" style="display: none;"></div>
            </div>
            
            <div class="form-group">
              <label for="start-time">开始时间 <span class="required">*</span></label>
              <select id="start-time" name="startTime" class="form-control">
                <option value="">请选择</option>
              </select>
              <div id="start-time-error" class="error-message" style="display: none;"></div>
            </div>
            
            <div class="form-group">
              <label for="end-time">结束时间 <span class="required">*</span></label>
              <select id="end-time" name="endTime" class="form-control">
                <option value="">请选择</option>
              </select>
              <div id="end-time-error" class="error-message" style="display: none;"></div>
            </div>
          </div>
          
          <div id="availability-info" style="display: none;"></div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="user-name">预约人姓名 <span class="required">*</span></label>
              <input type="text" id="user-name" name="userName" class="form-control" placeholder="请输入您的姓名">
              <div id="user-name-error" class="error-message" style="display: none;"></div>
            </div>
            
            <div class="form-group">
              <label for="user-phone">联系电话</label>
              <input type="tel" id="user-phone" name="userPhone" class="form-control" placeholder="请输入联系电话（选填）">
            </div>
            
            <div class="form-group">
              <label for="people-count">参与人数 <span class="required">*</span></label>
              <input type="number" id="people-count" name="peopleCount" class="form-control" min="1" placeholder="请输入人数">
              <div id="people-count-error" class="error-message" style="display: none;"></div>
              <div id="capacity-info" style="font-size: 0.85rem; color: #666; margin-top: 5px; display: none;"></div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="purpose">使用用途 <span class="required">*</span></label>
            <textarea id="purpose" name="purpose" class="form-control" rows="3" placeholder="请简要描述使用用途（如：社区会议、亲子活动、培训讲座等）"></textarea>
            <div id="purpose-error" class="error-message" style="display: none;"></div>
          </div>
          
          <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px;">
            <button type="button" class="btn btn-secondary" onclick="resetForm()">重置</button>
            <button type="submit" class="btn btn-primary" id="submit-btn">
              <span>确认预约</span>
            </button>
          </div>
        </form>
      </div>
    </div>
    
    <div id="my-reservations-tab" class="tab-content" style="display: none;">
      <div class="card">
        <div class="card-header">
          <h2><span class="icon">📋</span> 我的预约记录</h2>
          <button class="btn btn-secondary" onclick="loadMyReservations()">🔄 刷新</button>
        </div>
        
        <div class="filter-section">
          <div class="filter-item">
            <label>状态筛选:</label>
            <select id="status-filter" onchange="loadMyReservations()">
              <option value="">全部</option>
              <option value="confirmed">已确认</option>
              <option value="waitlisted">候补中</option>
              <option value="cancelled">已取消</option>
            </select>
          </div>
          <div class="filter-item">
            <label>日期筛选:</label>
            <input type="date" id="date-filter" onchange="loadMyReservations()">
          </div>
        </div>
        
        <div id="reservations-list">
          <div class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div id="toast-container"></div>
  
  <script>
    const API_BASE = '/api';
    let rooms = [];
    let selectedRoom = null;
    
    document.addEventListener('DOMContentLoaded', () => {
      initDateInput();
      initTimeSelects();
      loadRooms();
      setupTabNavigation();
      setupFormSubmission();
      setupAvailabilityCheck();
    });
    
    function initDateInput() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').min = today;
      document.getElementById('date').value = today;
      document.getElementById('date-filter').value = today;
    }
    
    function initTimeSelects() {
      const startTimeSelect = document.getElementById('start-time');
      const endTimeSelect = document.getElementById('end-time');
      
      for (let hour = 8; hour <= 20; hour++) {
        for (let minute = 0; minute < 60; minute += 30) {
          if (hour === 20 && minute > 0) break;
          const time = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
          startTimeSelect.innerHTML += `<option value="${time}">${time}</option>`;
        }
      }
      
      for (let hour = 8; hour <= 21; hour++) {
        for (let minute = 0; minute < 60; minute += 30) {
          if (hour === 21 && minute > 0) break;
          const time = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
          endTimeSelect.innerHTML += `<option value="${time}">${time}</option>`;
        }
      }
    }
    
    async function loadRooms() {
      try {
        const response = await fetch(`${API_BASE}/rooms`);
        const result = await response.json();
        
        if (result.success) {
          rooms = result.data;
          renderRoomSelector();
        } else {
          showToast('加载房间列表失败', 'error');
        }
      } catch (error) {
        console.error('加载房间失败:', error);
        showToast('网络错误，请稍后重试', 'error');
      }
    }
    
    function renderRoomSelector() {
      const container = document.getElementById('room-selector');
      container.innerHTML = '';
      
      rooms.forEach(room => {
        const card = document.createElement('div');
        card.className = 'room-card';
        card.dataset.roomId = room.id;
        card.innerHTML = `
          <h3>🏠 ${room.name}</h3>
          <div class="capacity">👥 容量: ${room.capacity} 人</div>
          <div class="description">${room.description || ''}</div>
        `;
        
        card.addEventListener('click', () => selectRoom(room, card));
        container.appendChild(card);
      });
    }
    
    function selectRoom(room, cardElement) {
      document.querySelectorAll('.room-card').forEach(c => c.classList.remove('selected'));
      cardElement.classList.add('selected');
      selectedRoom = room;
      document.getElementById('room-id').value = room.id;
      
      const capacityInfo = document.getElementById('capacity-info');
      capacityInfo.textContent = `该房间最大容量: ${room.capacity} 人`;
      capacityInfo.style.display = 'block';
      
      document.getElementById('people-count').max = room.capacity;
      
      clearError('room');
      checkAvailability();
    }
    
    function setupTabNavigation() {
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const tabId = tab.dataset.tab;
          
          document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          
          document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
          document.getElementById(`${tabId}-tab`).style.display = 'block';
          
          if (tabId === 'my-reservations') {
            loadMyReservations();
          }
        });
      });
    }
    
    function setupFormSubmission() {
      document.getElementById('booking-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        clearAllErrors();
        
        const formData = {
          roomId: document.getElementById('room-id').value,
          userName: document.getElementById('user-name').value.trim(),
          userPhone: document.getElementById('user-phone').value.trim(),
          date: document.getElementById('date').value,
          startTime: document.getElementById('start-time').value,
          endTime: document.getElementById('end-time').value,
          peopleCount: document.getElementById('people-count').value,
          purpose: document.getElementById('purpose').value.trim()
        };
        
        const hasErrors = validateForm(formData);
        if (hasErrors) return;
        
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin: 0;"></span> 提交中...';
        
        try {
          const response = await fetch(`${API_BASE}/reservations`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          
          const result = await response.json();
          
          if (result.success) {
            showToast(result.message, 'success');
            resetForm();
          } else {
            if (result.errors) {
              displayErrors(result.errors);
            } else {
              showToast(result.error || '预约失败', 'error');
            }
          }
        } catch (error) {
          console.error('提交预约失败:', error);
          showToast('网络错误，请稍后重试', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>确认预约</span>';
        }
      });
    }
    
    function validateForm(data) {
      let hasErrors = false;
      
      if (!data.roomId) {
        showError('room', '请选择房间');
        hasErrors = true;
      }
      
      if (!data.userName) {
        showError('user-name', '请输入预约人姓名');
        hasErrors = true;
      }
      
      if (!data.date) {
        showError('date', '请选择日期');
        hasErrors = true;
      }
      
      if (!data.startTime) {
        showError('start-time', '请选择开始时间');
        hasErrors = true;
      }
      
      if (!data.endTime) {
        showError('end-time', '请选择结束时间');
        hasErrors = true;
      }
      
      if (!data.peopleCount || data.peopleCount < 1) {
        showError('people-count', '请输入有效人数');
        hasErrors = true;
      } else if (selectedRoom && parseInt(data.peopleCount) > selectedRoom.capacity) {
        showError('people-count', `人数超出房间容量（最大 ${selectedRoom.capacity} 人）`);
        hasErrors = true;
      }
      
      if (!data.purpose) {
        showError('purpose', '请输入使用用途');
        hasErrors = true;
      }
      
      return hasErrors;
    }
    
    function setupAvailabilityCheck() {
      ['room-id', 'date', 'start-time', 'end-time'].forEach(id => {
        document.getElementById(id).addEventListener('change', checkAvailability);
      });
    }
    
    async function checkAvailability() {
      const roomId = document.getElementById('room-id').value;
      const date = document.getElementById('date').value;
      const startTime = document.getElementById('start-time').value;
      const endTime = document.getElementById('end-time').value;
      
      const infoDiv = document.getElementById('availability-info');
      
      if (!roomId || !date || !startTime || !endTime) {
        infoDiv.style.display = 'none';
        return;
      }
      
      try {
        const response = await fetch(
          `${API_BASE}/check-availability?roomId=${roomId}&date=${date}&startTime=${startTime}&endTime=${endTime}`
        );
        const result = await response.json();
        
        if (result.success) {
          if (result.data.available) {
            infoDiv.innerHTML = `
              <div class="alert alert-success">
                ✅ 该时段可用，可以预约！
              </div>
            `;
          } else {
            const conflicts = result.data.conflicts;
            let conflictHtml = conflicts.map(c => 
              `• ${c.user_name} (${c.start_time} - ${c.end_time})`
            ).join('<br>');
            
            infoDiv.innerHTML = `
              <div class="alert alert-warning">
                ⚠️ 该时段已被预约，您可以加入候补队列。<br>
                <small>已预约：<br>${conflictHtml}</small>
              </div>
            `;
          }
          infoDiv.style.display = 'block';
        }
      } catch (error) {
        console.error('检查可用性失败:', error);
      }
    }
    
    async function loadMyReservations() {
      const listContainer = document.getElementById('reservations-list');
      const statusFilter = document.getElementById('status-filter').value;
      const dateFilter = document.getElementById('date-filter').value;
      
      listContainer.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>
      `;
      
      try {
        let url = `${API_BASE}/reservations`;
        const params = [];
        if (statusFilter) params.push(`status=${statusFilter}`);
        if (dateFilter) params.push(`date=${dateFilter}`);
        if (params.length > 0) url += '?' + params.join('&');
        
        const response = await fetch(url);
        const result = await response.json();
        
        if (result.success) {
          renderReservations(result.data);
        } else {
          listContainer.innerHTML = `
            <div class="alert alert-error">
              ❌ 加载预约记录失败: ${result.error}
            </div>
          `;
        }
      } catch (error) {
        console.error('加载预约失败:', error);
        listContainer.innerHTML = `
          <div class="alert alert-error">
            ❌ 网络错误，请稍后重试
          </div>
        `;
      }
    }
    
    function renderReservations(reservations) {
      const listContainer = document.getElementById('reservations-list');
      
      if (reservations.length === 0) {
        listContainer.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <h3>暂无预约记录</h3>
            <p>快去预约一个活动室吧！</p>
          </div>
        `;
        return;
      }
      
      const statusLabels = {
        confirmed: '已确认',
        waitlisted: '候补中',
        cancelled: '已取消'
      };
      
      listContainer.innerHTML = '<div class="reservation-list">' + 
        reservations.map(r => `
          <div class="reservation-item ${r.status}">
            <div class="reservation-header">
              <div class="reservation-room">🏠 ${r.room_name}</div>
              <span class="status-badge ${r.status}">
                ${r.status === 'waitlisted' ? `第 ${r.waitlist_position} 位 - ${statusLabels[r.status]}` : statusLabels[r.status]}
              </span>
            </div>
            <div class="reservation-details">
              <div class="detail-item">📅 ${r.date}</div>
              <div class="detail-item">⏰ ${r.start_time} - ${r.end_time}</div>
              <div class="detail-item">👤 ${r.user_name}</div>
              <div class="detail-item">👥 ${r.people_count} 人</div>
            </div>
            <div style="margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 6px; font-size: 0.9rem;">
              <strong>用途:</strong> ${r.purpose}
            </div>
            ${r.status !== 'cancelled' ? `
              <div class="reservation-actions">
                <button class="btn btn-danger" onclick="cancelReservation(${r.id}, '${r.user_name}')">
                  取消预约
                </button>
              </div>
            ` : ''}
          </div>
        `).join('') + '</div>';
    }
    
    async function cancelReservation(id, userName) {
      const confirmed = confirm(`确定要取消 ${userName} 的预约吗？${
        confirmNoteForWaitlist()
      }`);
      
      if (!confirmed) return;
      
      try {
        const response = await fetch(`${API_BASE}/reservations/${id}/cancel`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator: 'user' })
        });
        
        const result = await response.json();
        
        if (result.success) {
          showToast(result.message, 'success');
          loadMyReservations();
        } else {
          showToast(result.error || '取消失败', 'error');
        }
      } catch (error) {
        console.error('取消预约失败:', error);
        showToast('网络错误，请稍后重试', 'error');
      }
    }
    
    function confirmNoteForWaitlist() {
      return '\n\n如果您取消已确认的预约，候补队列中的用户将自动递补。';
    }
    
    function showError(fieldId, message) {
      const errorDiv = document.getElementById(`${fieldId}-error`);
      const inputEl = document.getElementById(fieldId);
      
      if (errorDiv) {
        errorDiv.textContent = `⚠️ ${message}`;
        errorDiv.style.display = 'block';
      }
      
      if (inputEl) {
        inputEl.classList.add('error');
      }
    }
    
    function clearError(fieldId) {
      const errorDiv = document.getElementById(`${fieldId}-error`);
      const inputEl = document.getElementById(fieldId);
      
      if (errorDiv) {
        errorDiv.style.display = 'none';
      }
      
      if (inputEl) {
        inputEl.classList.remove('error');
      }
    }
    
    function clearAllErrors() {
      ['room', 'user-name', 'date', 'start-time', 'end-time', 'people-count', 'purpose'].forEach(clearError);
    }
    
    function displayErrors(errors) {
      const alertDiv = document.getElementById('form-alert');
      alertDiv.innerHTML = `
        <div class="alert alert-error">
          <strong>请修正以下错误：</strong><br>
          ${errors.map(e => `• ${e}`).join('<br>')}
        </div>
      `;
    }
    
    function resetForm() {
      document.getElementById('booking-form').reset();
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      document.querySelectorAll('.room-card').forEach(c => c.classList.remove('selected'));
      selectedRoom = null;
      document.getElementById('room-id').value = '';
      document.getElementById('capacity-info').style.display = 'none';
      document.getElementById('availability-info').style.display = 'none';
      clearAllErrors();
      document.getElementById('form-alert').innerHTML = '';
    }
    
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>
</body>
</html>
