<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员 - 社区共享活动室预约系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      color: white;
    }
    
    .header h1 {
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .header .back-link {
      color: #a8b4c3;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    
    .header .back-link:hover {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .nav-tab {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.1);
      color: #a8b4c3;
    }
    
    .nav-tab.active {
      background: #667eea;
      color: white;
      font-weight: 600;
    }
    
    .nav-tab:hover:not(.active) {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }
    
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .card-header h2 {
      font-size: 1.2rem;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .filter-section {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .filter-item label {
      font-weight: 500;
      color: #666;
      white-space: nowrap;
    }
    
    .filter-item select, .filter-item input {
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      min-width: 150px;
    }
    
    .filter-item select:focus, .filter-item input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-success {
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
      color: white;
    }
    
    .btn-success:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
    }
    
    .btn-danger {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    
    .btn-danger:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .timeline-container {
      overflow-x: auto;
    }
    
    .timeline {
      display: flex;
      min-width: 1000px;
    }
    
    .timeline-header {
      display: flex;
      min-width: 1000px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    
    .room-column {
      flex: 1;
      padding: 0 10px;
      min-width: 200px;
    }
    
    .room-column h3 {
      text-align: center;
      font-size: 1rem;
      color: #333;
      margin-bottom: 5px;
    }
    
    .room-column .capacity {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
    }
    
    .timeline-body {
      display: flex;
      min-width: 1000px;
      position: relative;
    }
    
    .time-column {
      width: 80px;
      flex-shrink: 0;
    }
    
    .time-slot {
      height: 60px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding-right: 10px;
      font-size: 0.85rem;
      color: #888;
      padding-top: 5px;
    }
    
    .room-timeline {
      flex: 1;
      position: relative;
      border-left: 1px solid #f0f0f0;
      min-height: 780px;
    }
    
    .room-timeline:last-child {
      border-right: 1px solid #f0f0f0;
    }
    
    .timeline-slot {
      height: 60px;
      border-bottom: 1px solid #f8f8f8;
    }
    
    .timeline-slot:nth-child(even) {
      background: #fafbfc;
    }
    
    .booking-block {
      position: absolute;
      left: 8px;
      right: 8px;
      border-radius: 8px;
      padding: 8px;
      color: white;
      font-size: 0.8rem;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10;
    }
    
    .booking-block:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      z-index: 20;
    }
    
    .booking-block.confirmed {
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
    }
    
    .booking-block.waitlisted {
      background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
    }
    
    .booking-block.cancelled {
      background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
      opacity: 0.6;
      text-decoration: line-through;
    }
    
    .booking-block .user {
      font-weight: 600;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .booking-block .time {
      font-size: 0.75rem;
      opacity: 0.9;
    }
    
    .booking-block .people {
      font-size: 0.7rem;
      opacity: 0.8;
      margin-top: 2px;
    }
    
    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #666;
    }
    
    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    
    .legend-color.confirmed {
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
    }
    
    .legend-color.waitlisted {
      background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
    }
    
    .legend-color.cancelled {
      background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    
    .stat-card.green {
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
    }
    
    .stat-card.orange {
      background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
    }
    
    .stat-card.red {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    }
    
    .stat-card .number {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 5px;
    }
    
    .stat-card .label {
      font-size: 0.95rem;
      opacity: 0.9;
    }
    
    .popular-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    
    .popular-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    .popular-item .info {
      display: flex;
      flex-direction: column;
    }
    
    .popular-item .name {
      font-weight: 600;
      color: #333;
    }
    
    .popular-item .count {
      font-size: 0.85rem;
      color: #888;
      margin-top: 3px;
    }
    
    .popular-item .badge {
      background: #667eea;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    
    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 15px;
      opacity: 0.5;
    }
    
    .empty-state h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #666;
    }
    
    .empty-state p {
      font-size: 0.9rem;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f0f0f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px 24px;
      border-radius: 8px;
      color: white;
      font-weight: 500;
      z-index: 1000;
      animation: slideIn 0.3s ease;
      max-width: 400px;
    }
    
    .toast.success {
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
    }
    
    .toast.error {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    }
    
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    
    .modal.active {
      opacity: 1;
      visibility: visible;
    }
    
    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }
    
    .modal.active .modal-content {
      transform: translateY(0);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .modal-header h3 {
      font-size: 1.2rem;
      color: #333;
    }
    
    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
      padding: 0;
      line-height: 1;
    }
    
    .modal-close:hover {
      color: #333;
    }
    
    .modal-body .detail-row {
      display: flex;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .modal-body .detail-row:last-child {
      border-bottom: none;
    }
    
    .modal-body .detail-label {
      width: 100px;
      font-weight: 600;
      color: #666;
      flex-shrink: 0;
    }
    
    .modal-body .detail-value {
      flex: 1;
      color: #333;
    }
    
    .modal-footer {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    
    .reservation-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    
    .reservation-table th,
    .reservation-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .reservation-table th {
      background: #f8f9fa;
      font-weight: 600;
      color: #333;
      font-size: 0.9rem;
    }
    
    .reservation-table td {
      font-size: 0.9rem;
      color: #666;
    }
    
    .reservation-table tr:hover td {
      background: #fafbfc;
    }
    
    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
    }
    
    .status-badge.confirmed {
      background: #d4edda;
      color: #155724;
    }
    
    .status-badge.waitlisted {
      background: #fff3cd;
      color: #856404;
    }
    
    .status-badge.cancelled {
      background: #f8d7da;
      color: #721c24;
    }
    
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
      
      .nav-tabs {
        overflow-x: auto;
        padding-bottom: 10px;
      }
      
      .filter-section {
        flex-direction: column;
        align-items: stretch;
      }
      
      .filter-item {
        flex-direction: column;
        align-items: stretch;
      }
      
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔧 管理员控制台</h1>
      <a href="/" class="back-link">← 返回用户预约页面</a>
    </div>
    
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="timeline">📅 时间轴视图</button>
      <button class="nav-tab" data-tab="reservations">📋 预约列表</button>
      <button class="nav-tab" data-tab="statistics">📊 统计分析</button>
    </div>
    
    <div id="timeline-tab" class="tab-content">
      <div class="card">
        <div class="filter-section">
          <div class="filter-item">
            <label>选择日期:</label>
            <input type="date" id="timeline-date">
          </div>
          <div class="filter-item">
            <label>筛选房间:</label>
            <select id="timeline-room">
              <option value="">全部房间</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="loadTimeline()">
            🔄 刷新
          </button>
        </div>
        
        <div class="legend">
          <div class="legend-item">
            <div class="legend-color confirmed"></div>
            <span>已确认</span>
          </div>
          <div class="legend-item">
            <div class="legend-color waitlisted"></div>
            <span>候补中</span>
          </div>
          <div class="legend-item">
            <div class="legend-color cancelled"></div>
            <span>已取消</span>
          </div>
        </div>
        
        <div id="timeline-content">
          <div class="loading">
            <div class="spinner"></div>
            <p>加载时间轴中...</p>
          </div>
        </div>
      </div>
    </div>
    
    <div id="reservations-tab" class="tab-content" style="display: none;">
      <div class="card">
        <div class="card-header">
          <h2>📋 预约列表</h2>
          <button class="btn btn-success" onclick="exportCSV()">
            📥 导出CSV报表
          </button>
        </div>
        
        <div class="filter-section">
          <div class="filter-item">
            <label>开始日期:</label>
            <input type="date" id="export-start-date">
          </div>
          <div class="filter-item">
            <label>结束日期:</label>
            <input type="date" id="export-end-date">
          </div>
          <div class="filter-item">
            <label>状态筛选:</label>
            <select id="list-status-filter">
              <option value="">全部</option>
              <option value="confirmed">已确认</option>
              <option value="waitlisted">候补中</option>
              <option value="cancelled">已取消</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="loadReservationsList()">
            🔄 刷新
          </button>
        </div>
        
        <div id="reservations-list-content">
          <div class="loading">
            <div class="spinner"></div>
            <p>加载预约列表中...</p>
          </div>
        </div>
      </div>
    </div>
    
    <div id="statistics-tab" class="tab-content" style="display: none;">
      <div class="card">
        <div class="card-header">
          <h2>📊 统计分析</h2>
        </div>
        
        <div class="filter-section">
          <div class="filter-item">
            <label>开始日期:</label>
            <input type="date" id="stats-start-date">
          </div>
          <div class="filter-item">
            <label>结束日期:</label>
            <input type="date" id="stats-end-date">
          </div>
          <button class="btn btn-primary" onclick="loadStatistics()">
            🔄 刷新
          </button>
        </div>
        
        <div id="statistics-content">
          <div class="loading">
            <div class="spinner"></div>
            <p>加载统计数据中...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>预约详情</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
      </div>
      <div class="modal-footer" id="modal-footer">
      </div>
    </div>
  </div>
  
  <div id="toast-container"></div>
  
  <script>
    const API_BASE = '/api';
    let rooms = [];
    let currentReservations = [];
    
    const statusLabels = {
      confirmed: '已确认',
      waitlisted: '候补中',
      cancelled: '已取消'
    };
    
    document.addEventListener('DOMContentLoaded', () => {
      initDates();
      loadRooms();
      setupTabNavigation();
      loadTimeline();
    });
    
    function initDates() {
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];
      
      document.getElementById('timeline-date').value = todayStr;
      
      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
      const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
      
      document.getElementById('export-start-date').value = firstDay.toISOString().split('T')[0];
      document.getElementById('export-end-date').value = lastDay.toISOString().split('T')[0];
      document.getElementById('stats-start-date').value = firstDay.toISOString().split('T')[0];
      document.getElementById('stats-end-date').value = lastDay.toISOString().split('T')[0];
    }
    
    async function loadRooms() {
      try {
        const response = await fetch(`${API_BASE}/rooms`);
        const result = await response.json();
        
        if (result.success) {
          rooms = result.data;
          
          const roomSelect = document.getElementById('timeline-room');
          roomSelect.innerHTML = '<option value="">全部房间</option>' +
            rooms.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
        }
      } catch (error) {
        console.error('加载房间失败:', error);
        showToast('加载房间列表失败', 'error');
      }
    }
    
    function setupTabNavigation() {
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const tabId = tab.dataset.tab;
          
          document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          
          document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
          document.getElementById(`${tabId}-tab`).style.display = 'block';
          
          if (tabId === 'reservations') {
            loadReservationsList();
          } else if (tabId === 'statistics') {
            loadStatistics();
          }
        });
      });
    }
    
    async function loadTimeline() {
      const content = document.getElementById('timeline-content');
      const date = document.getElementById('timeline-date').value;
      const roomId = document.getElementById('timeline-room').value;
      
      content.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>加载时间轴中...</p>
        </div>
      `;
      
      try {
        let url = `${API_BASE}/reservations?date=${date}`;
        if (roomId) url += `&roomId=${roomId}`;
        
        const response = await fetch(url);
        const result = await response.json();
        
        if (result.success) {
          currentReservations = result.data;
          renderTimeline(result.data, roomId);
        } else {
          content.innerHTML = `
            <div class="empty-state">
              <div class="icon">❌</div>
              <h3>加载失败</h3>
              <p>${result.error}</p>
            </div>
          `;
        }
      } catch (error) {
        console.error('加载时间轴失败:', error);
        content.innerHTML = `
          <div class="empty-state">
            <div class="icon">❌</div>
            <h3>网络错误</h3>
            <p>请稍后重试</p>
          </div>
        `;
      }
    }
    
    function renderTimeline(reservations, selectedRoomId) {
      const content = document.getElementById('timeline-content');
      
      let displayRooms = rooms;
      if (selectedRoomId) {
        displayRooms = rooms.filter(r => r.id == selectedRoomId);
      }
      
      if (displayRooms.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="icon">🏠</div>
            <h3>暂无房间</h3>
            <p>请先添加房间数据</p>
          </div>
        `;
        return;
      }
      
      const timeSlots = [];
      for (let hour = 8; hour <= 21; hour++) {
        for (let minute = 0; minute < 60; minute += 30) {
          if (hour === 21 && minute > 0) break;
          timeSlots.push(`${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`);
        }
      }
      
      let html = `
        <div class="timeline-container">
          <div class="timeline-header">
            <div class="room-column" style="width: 80px; flex-shrink: 0;"></div>
            ${displayRooms.map(room => `
              <div class="room-column">
                <h3>${room.name}</h3>
                <div class="capacity">容量: ${room.capacity}人</div>
              </div>
            `).join('')}
          </div>
          
          <div class="timeline-body">
            <div class="time-column">
              ${timeSlots.map(time => `
                <div class="time-slot">${time}</div>
              `).join('')}
            </div>
            
            ${displayRooms.map(room => {
              const roomReservations = reservations.filter(r => r.room_id === room.id);
              return `
                <div class="room-timeline">
                  ${timeSlots.map(() => `<div class="timeline-slot"></div>`).join('')}
                  ${roomReservations.map(r => renderBookingBlock(r)).join('')}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
      
      content.innerHTML = html;
    }
    
    function renderBookingBlock(reservation) {
      const startMin = timeToMinutes(reservation.start_time);
      const endMin = timeToMinutes(reservation.end_time);
      
      const dayStart = 8 * 60;
      const totalMinutes = 13 * 60;
      
      const topPercent = ((startMin - dayStart) / totalMinutes) * 100;
      const heightPercent = ((endMin - startMin) / totalMinutes) * 100;
      
      const statusClass = reservation.status;
      const waitlistInfo = reservation.status === 'waitlisted' 
        ? `<div class="people">候补: 第${reservation.waitlist_position}位</div>` 
        : `<div class="people">${reservation.people_count}人</div>`;
      
      return `
        <div class="booking-block ${statusClass}" 
             style="top: ${topPercent}%; height: ${heightPercent}%;"
             onclick="showReservationDetail(${reservation.id})">
          <div class="user">${reservation.user_name}</div>
          <div class="time">${reservation.start_time} - ${reservation.end_time}</div>
          ${waitlistInfo}
        </div>
      `;
    }
    
    function timeToMinutes(time) {
      const [hours, minutes] = time.split(':').map(Number);
      return hours * 60 + minutes;
    }
    
    async function showReservationDetail(id) {
      const reservation = currentReservations.find(r => r.id === id);
      if (!reservation) {
        try {
          const response = await fetch(`${API_BASE}/reservations/${id}`);
          const result = await response.json();
          if (result.success) {
            renderReservationDetail(result.data);
          }
        } catch (error) {
          console.error('获取预约详情失败:', error);
        }
      } else {
        renderReservationDetail(reservation);
      }
    }
    
    function renderReservationDetail(r) {
      const modal = document.getElementById('modal');
      const body = document.getElementById('modal-body');
      const footer = document.getElementById('modal-footer');
      
      body.innerHTML = `
        <div class="detail-row">
          <div class="detail-label">预约ID</div>
          <div class="detail-value">#${r.id}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">房间</div>
          <div class="detail-value">${r.room_name}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">预约人</div>
          <div class="detail-value">${r.user_name}${r.user_phone ? ` (${r.user_phone})` : ''}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">日期</div>
          <div class="detail-value">${r.date}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">时间</div>
          <div class="detail-value">${r.start_time} - ${r.end_time}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">人数</div>
          <div class="detail-value">${r.people_count} 人</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">用途</div>
          <div class="detail-value">${r.purpose}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">状态</div>
          <div class="detail-value">
            <span class="status-badge ${r.status}">
              ${r.status === 'waitlisted' 
                ? `第${r.waitlist_position}位 - ${statusLabels[r.status]}` 
                : statusLabels[r.status]}
            </span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-label">创建时间</div>
          <div class="detail-value">${r.created_at}</div>
        </div>
      `;
      
      footer.innerHTML = r.status !== 'cancelled' ? `
        <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
        <button class="btn btn-danger" onclick="cancelReservation(${r.id})">取消预约</button>
      ` : `
        <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
      `;
      
      modal.classList.add('active');
    }
    
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
    
    async function cancelReservation(id) {
      const confirmed = confirm('确定要取消这个预约吗？\n\n如果是已确认的预约，候补队列中的用户将自动递补。');
      
      if (!confirmed) return;
      
      try {
        const response = await fetch(`${API_BASE}/reservations/${id}/cancel`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator: 'admin' })
        });
        
        const result = await response.json();
        
        if (result.success) {
          showToast(result.message, 'success');
          closeModal();
          loadTimeline();
        } else {
          showToast(result.error || '取消失败', 'error');
        }
      } catch (error) {
        console.error('取消预约失败:', error);
        showToast('网络错误，请稍后重试', 'error');
      }
    }
    
    async function loadReservationsList() {
      const content = document.getElementById('reservations-list-content');
      const statusFilter = document.getElementById('list-status-filter').value;
      
      content.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>加载预约列表中...</p>
        </div>
      `;
      
      try {
        let url = `${API_BASE}/reservations`;
        const params = [];
        if (statusFilter) params.push(`status=${statusFilter}`);
        if (params.length > 0) url += '?' + params.join('&');
        
        const response = await fetch(url);
        const result = await response.json();
        
        if (result.success) {
          currentReservations = result.data;
          renderReservationsList(result.data);
        } else {
          content.innerHTML = `
            <div class="empty-state">
              <div class="icon">❌</div>
              <h3>加载失败</h3>
              <p>${result.error}</p>
            </div>
          `;
        }
      } catch (error) {
        console.error('加载预约列表失败:', error);
        content.innerHTML = `
          <div class="empty-state">
            <div class="icon">❌</div>
            <h3>网络错误</h3>
            <p>请稍后重试</p>
          </div>
        `;
      }
    }
    
    function renderReservationsList(reservations) {
      const content = document.getElementById('reservations-list-content');
      
      if (reservations.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <h3>暂无预约记录</h3>
            <p>当前筛选条件下没有预约记录</p>
          </div>
        `;
        return;
      }
      
      content.innerHTML = `
        <table class="reservation-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>房间</th>
              <th>预约人</th>
              <th>日期</th>
              <th>时间</th>
              <th>人数</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${reservations.map(r => `
              <tr>
                <td>#${r.id}</td>
                <td>${r.room_name}</td>
                <td>${r.user_name}</td>
                <td>${r.date}</td>
                <td>${r.start_time} - ${r.end_time}</td>
                <td>${r.people_count}人</td>
                <td>
                  <span class="status-badge ${r.status}">
                    ${r.status === 'waitlisted' 
                      ? `第${r.waitlist_position}位` 
                      : statusLabels[r.status]}
                  </span>
                </td>
                <td>
                  <button class="btn btn-secondary" style="padding: 5px 10px; font-size: 0.8rem;" 
                          onclick="showReservationDetail(${r.id})">
                    详情
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
    
    async function exportCSV() {
      const startDate = document.getElementById('export-start-date').value;
      const endDate = document.getElementById('export-end-date').value;
      
      if (!startDate || !endDate) {
        showToast('请选择导出日期范围', 'error');
        return;
      }
      
      try {
        const url = `${API_BASE}/export/csv?startDate=${startDate}&endDate=${endDate}`;
        window.open(url, '_blank');
        showToast('CSV导出已开始', 'success');
      } catch (error) {
        console.error('导出CSV失败:', error);
        showToast('导出失败，请稍后重试', 'error');
      }
    }
    
    async function loadStatistics() {
      const content = document.getElementById('statistics-content');
      const startDate = document.getElementById('stats-start-date').value;
      const endDate = document.getElementById('stats-end-date').value;
      
      content.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>加载统计数据中...</p>
        </div>
      `;
      
      try {
        const response = await fetch(`${API_BASE}/statistics?startDate=${startDate}&endDate=${endDate}`);
        const result = await response.json();
        
        if (result.success) {
          renderStatistics(result.data);
        } else {
          content.innerHTML = `
            <div class="empty-state">
              <div class="icon">❌</div>
              <h3>加载失败</h3>
              <p>${result.error}</p>
            </div>
          `;
        }
      } catch (error) {
        console.error('加载统计数据失败:', error);
        content.innerHTML = `
          <div class="empty-state">
            <div class="icon">❌</div>
            <h3>网络错误</h3>
            <p>请稍后重试</p>
          </div>
        `;
      }
    }
    
    function renderStatistics(stats) {
      const content = document.getElementById('statistics-content');
      
      let popularRoomsHtml = '';
      if (stats.popularRooms && stats.popularRooms.length > 0) {
        popularRoomsHtml = `
          <div class="card" style="margin-top: 20px; padding: 0; background: transparent; box-shadow: none;">
            <div class="card-header" style="background: white; border-radius: 16px 16px 0 0; margin-bottom: 0;">
              <h2>🏠 热门房间排行</h2>
            </div>
            <div class="popular-list" style="background: white; padding: 20px; border-radius: 0 0 16px 16px;">
              ${stats.popularRooms.map((room, index) => `
                <div class="popular-item" style="border-left-color: ${index === 0 ? '#f39c12' : '#667eea'}">
                  <div class="info">
                    <div class="name">${index + 1}. ${room.name}</div>
                    <div class="count">${room.reservation_count} 次预约</div>
                  </div>
                  <div class="badge">${room.reservation_count}次</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      
      let popularHoursHtml = '';
      if (stats.popularHours && stats.popularHours.length > 0) {
        popularHoursHtml = `
          <div class="card" style="margin-top: 20px; padding: 0; background: transparent; box-shadow: none;">
            <div class="card-header" style="background: white; border-radius: 16px 16px 0 0; margin-bottom: 0;">
              <h2>⏰ 热门时段排行</h2>
            </div>
            <div class="popular-list" style="background: white; padding: 20px; border-radius: 0 0 16px 16px;">
              ${stats.popularHours.slice(0, 5).map((hour, index) => `
                <div class="popular-item" style="border-left-color: ${index === 0 ? '#f39c12' : '#667eea'}">
                  <div class="info">
                    <div class="name">${index + 1}. ${hour.hour}:00 - ${parseInt(hour.hour) + 1}:00</div>
                    <div class="count">${hour.reservation_count} 次预约</div>
                  </div>
                  <div class="badge">${hour.reservation_count}次</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      
      content.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="number">${stats.totalReservations || 0}</div>
            <div class="label">总预约数</div>
          </div>
          <div class="stat-card green">
            <div class="number">${stats.confirmedReservations || 0}</div>
            <div class="label">已确认</div>
          </div>
          <div class="stat-card orange">
            <div class="number">${stats.waitlistCount || 0}</div>
            <div class="label">候补中</div>
          </div>
          <div class="stat-card red">
            <div class="number">${stats.cancelledReservations || 0}</div>
            <div class="label">已取消</div>
          </div>
        </div>
        
        ${popularRoomsHtml}
        ${popularHoursHtml}
      `;
    }
    
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
    
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') {
        closeModal();
      }
    });
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
      }
    });
  </script>
</body>
</html>
