spring:
  application:
    name: batch-approval-coordinator
  datasource:
    url: jdbc:h2:mem:approvaldb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080

approval:
  batch:
    max-size: 100
    default-chunk-size: 10
    retry:
      max-attempts: 3
      delay-ms: 1000

logging:
  level:
    com.approval.coordinator: DEBUG
    org.springframework.web: INFO
