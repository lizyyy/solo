openapi: 3.0.0
info:
  title: 会员服务
  version: 2.0.0
  description: 会员管理服务 API - 警告变更

paths:
  /members:
    get:
      operationId: getMembers
      summary: 获取会员列表
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: level
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'

    post:
      operationId: createMember
      summary: 创建会员
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

  /members/{memberId}:
    get:
      operationId: getMemberById
      summary: 获取会员详情
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '404':
          description: 会员不存在

components:
  schemas:
    Member:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        level:
          type: string
          enum: [bronze, silver, gold, platinum, diamond]
        points:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - level

    CreateMemberRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
      required:
        - name
        - email
        - phone
