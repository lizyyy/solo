openapi: 3.0.0
info:
  title: 库存服务
  version: 2.0.0
  description: 库存管理服务 API - 阻断变更

paths:
  /inventory:
    get:
      operationId: getInventory
      summary: 获取库存列表
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: string
        - name: warehouseId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  productId:
                    type: string
                  stock:
                    type: integer
                  status:
                    type: string
                    enum: [in_stock, low_stock, out_of_stock]

  /inventory/{productId}:
    get:
      operationId: getInventoryByProduct
      summary: 获取商品库存
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '404':
          description: 库存不存在

components:
  schemas:
    InventoryItem:
      type: object
      properties:
        productId:
          type: string
        stock:
          type: integer
        status:
          type: string
          enum: [in_stock, low_stock, out_of_stock]
        available:
          type: boolean
      required:
        - productId
        - stock
        - status

    AdjustInventoryRequest:
      type: object
      properties:
        quantity:
          type: integer
        reason:
          type: string
        operator:
          type: string
      required:
        - quantity
        - reason
