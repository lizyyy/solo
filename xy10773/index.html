<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA离线同步调试系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .toolbar {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #1890ff;
            color: white;
        }
        .btn-primary:hover {
            background: #40a9ff;
        }
        .btn-success {
            background: #52c41a;
            color: white;
        }
        .btn-success:hover {
            background: #73d13d;
        }
        .btn-warning {
            background: #faad14;
            color: white;
        }
        .btn-warning:hover {
            background: #ffc53d;
        }
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        .btn-danger:hover {
            background: #ff7875;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            color: #666;
        }
        tr:hover {
            background: #fafafa;
        }
        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }
        .status-pending {
            background: #fff7e6;
            color: #fa8c16;
        }
        .status-failed {
            background: #fff1f0;
            color: #ff4d4f;
        }
        .status-resolved {
            background: #f6ffed;
            color: #52c41a;
        }
        .status-valid {
            background: #e6f7ff;
            color: #1890ff;
        }
        .status-stale {
            background: #fff0f6;
            color: #eb2f96;
        }
        .hint {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .hint-warning {
            background: #fff7e6;
            border-left: 3px solid #fa8c16;
        }
        .hint-info {
            background: #e6f7ff;
            border-left: 3px solid #1890ff;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background: white;
            margin: 100px auto;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
        }
        .modal-content h3 {
            margin-bottom: 15px;
        }
        .modal-content textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .badge {
            background: #ff4d4f;
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 5px;
        }
        .action-btn {
            padding: 4px 8px;
            font-size: 12px;
            margin-right: 4px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PWA离线同步调试系统</h1>
        
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="搜索离线队列...">
            <button class="btn btn-primary" onclick="searchQueue()">搜索</button>
            <button class="btn btn-success" onclick="openImportModal()">批量导入</button>
            <button class="btn btn-warning" onclick="validateQueue()">校验队列</button>
            <button class="btn btn-success" onclick="exportLogs()">导出日志</button>
            <button class="btn btn-danger" onclick="testBlockedOperation()">测试规则阻挡</button>
            <button class="btn btn-primary" onclick="initData()">初始化数据</button>
        </div>

        <div id="userHints" class="card full-width">
            <h2>用户提示 <span class="badge" id="hintCount">0</span></h2>
            <div id="hintsList"></div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>离线队列</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>类型</th>
                            <th>负责人</th>
                            <th>状态</th>
                            <th>重试次数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="queueTable"></tbody>
                </table>
            </div>

            <div class="card">
                <h2>同步冲突</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>类型</th>
                            <th>负责人</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="conflictsTable"></tbody>
                </table>
            </div>

            <div class="card">
                <h2>重试策略</h2>
                <table>
                    <thead>
                        <tr>
                            <th>队列ID</th>
                            <th>重试次数</th>
                            <th>失败原因</th>
                            <th>下次重试</th>
                        </tr>
                    </thead>
                    <tbody id="strategiesTable"></tbody>
                </table>
            </div>

            <div class="card">
                <h2>缓存资源</h2>
                <table>
                    <thead>
                        <tr>
                            <th>URL</th>
                            <th>大小</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="cacheTable"></tbody>
                </table>
            </div>
        </div>

        <div class="card full-width">
            <h2>同步日志</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>类型</th>
                        <th>负责人</th>
                        <th>冲突ID</th>
                        <th>解决方式</th>
                        <th>时间</th>
                    </tr>
                </thead>
                <tbody id="logsTable"></tbody>
            </table>
        </div>
    </div>

    <div id="importModal" class="modal">
        <div class="modal-content">
            <h3>批量导入离线队列</h3>
            <textarea id="importData" placeholder='[{"type": "user_update", "data": "...", "owner": "前端A"}]'></textarea>
            <div class="modal-buttons">
                <button class="btn" onclick="closeImportModal()">取消</button>
                <button class="btn btn-primary" onclick="importQueue()">导入</button>
            </div>
        </div>
    </div>

    <div id="retryModal" class="modal">
        <div class="modal-content">
            <h3>重试操作</h3>
            <input type="hidden" id="retryQueueId">
            <textarea id="retryReason" placeholder="请输入失败原因..."></textarea>
            <div class="modal-buttons">
                <button class="btn" onclick="closeRetryModal()">取消</button>
                <button class="btn btn-primary" onclick="doRetry()">确认重试</button>
            </div>
        </div>
    </div>

    <div id="resolveModal" class="modal">
        <div class="modal-content">
            <h3>解决冲突</h3>
            <input type="hidden" id="resolveConflictId">
            <p>请选择解决方式：</p>
            <div style="margin: 15px 0;">
                <label><input type="radio" name="resolution" value="server" checked> 以服务器为准</label><br>
                <label><input type="radio" name="resolution" value="client"> 以客户端为准</label><br>
                <label><input type="radio" name="resolution" value="merge"> 合并数据</label>
            </div>
            <p>负责人：<input type="text" id="resolveOwner" placeholder="请输入负责人"></p>
            <div class="modal-buttons">
                <button class="btn" onclick="closeResolveModal()">取消</button>
                <button class="btn btn-primary" onclick="doResolve()">确认解决</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';

        async function fetchData(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}/api/${endpoint}`, options);
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                alert('请求失败: ' + error.message);
            }
        }

        async function loadAllData() {
            const data = await fetchData('data');
            if (data) {
                renderQueue(data.offline_queue);
                renderConflicts(data.sync_conflicts);
                renderStrategies(data.retry_strategies);
                renderCache(data.cache_resources);
                renderLogs(data.sync_logs);
                renderHints(data.user_hints);
            }
        }

        function renderQueue(queue) {
            const tbody = document.getElementById('queueTable');
            tbody.innerHTML = queue.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.type}</td>
                    <td>${item.owner || '-'}</td>
                    <td><span class="status status-${item.status}">${item.status}</span></td>
                    <td>${item.retry_count || 0}</td>
                    <td>
                        <button class="btn btn-warning action-btn" onclick="openRetryModal(${item.id})">重试</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderConflicts(conflicts) {
            const tbody = document.getElementById('conflictsTable');
            tbody.innerHTML = conflicts.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.type}</td>
                    <td>${item.owner || '-'}</td>
                    <td><span class="status status-${item.status}">${item.status}</span></td>
                    <td>
                        ${item.status === 'pending' ? `<button class="btn btn-success action-btn" onclick="openResolveModal(${item.id})">解决</button>` : '-'}
                    </td>
                </tr>
            `).join('');
        }

        function renderStrategies(strategies) {
            const tbody = document.getElementById('strategiesTable');
            tbody.innerHTML = strategies.map(item => `
                <tr>
                    <td>${item.queue_id}</td>
                    <td>${item.retry_count}</td>
                    <td>${item.failure_reason || '-'}</td>
                    <td>${new Date(item.next_retry_at).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function renderCache(resources) {
            const tbody = document.getElementById('cacheTable');
            tbody.innerHTML = resources.map(item => `
                <tr>
                    <td>${item.url}</td>
                    <td>${(item.size / 1024).toFixed(1)} KB</td>
                    <td><span class="status status-${item.status}">${item.status}</span></td>
                </tr>
            `).join('');
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('logsTable');
            tbody.innerHTML = logs.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.type}</td>
                    <td>${item.owner || '-'}</td>
                    <td>${item.conflict_id || '-'}</td>
                    <td>${item.resolution || '-'}</td>
                    <td>${new Date(item.timestamp).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function renderHints(hints) {
            const container = document.getElementById('hintsList');
            const count = hints.filter(h => !h.read).length;
            document.getElementById('hintCount').textContent = count;
            document.getElementById('hintCount').style.display = count > 0 ? 'inline' : 'none';
            
            container.innerHTML = hints.map(hint => `
                <div class="hint hint-${hint.type}">
                    ${hint.message}
                    <small style="float: right;">${new Date(hint.created_at).toLocaleString()}</small>
                </div>
            `).join('');
        }

        async function searchQueue() {
            const search = document.getElementById('searchInput').value;
            const data = await fetchData(`offline-queue?search=${encodeURIComponent(search)}`);
            if (data) {
                renderQueue(data);
            }
        }

        async function validateQueue() {
            const result = await fetchData('validate-queue', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids: [] })
            });
            if (result && result.success) {
                alert(`已校验 ${result.validated_ids.length} 个项目`);
                loadAllData();
            }
        }

        function openImportModal() {
            document.getElementById('importModal').style.display = 'block';
        }

        function closeImportModal() {
            document.getElementById('importModal').style.display = 'none';
        }

        async function importQueue() {
            const data = document.getElementById('importData').value;
            try {
                const items = JSON.parse(data);
                const result = await fetchData('offline-queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(items)
                });
                if (result && result.success) {
                    alert(`成功导入 ${result.count} 个项目`);
                    closeImportModal();
                    loadAllData();
                }
            } catch (e) {
                alert('JSON格式错误: ' + e.message);
            }
        }

        function openRetryModal(queueId) {
            document.getElementById('retryQueueId').value = queueId;
            document.getElementById('retryReason').value = '';
            document.getElementById('retryModal').style.display = 'block';
        }

        function closeRetryModal() {
            document.getElementById('retryModal').style.display = 'none';
        }

        async function doRetry() {
            const queueId = parseInt(document.getElementById('retryQueueId').value);
            const reason = document.getElementById('retryReason').value;
            
            const result = await fetchData('retry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ queue_id: queueId, reason: reason })
            });
            
            if (result && result.success) {
                alert('重试已记录');
                closeRetryModal();
                loadAllData();
            }
        }

        function openResolveModal(conflictId) {
            document.getElementById('resolveConflictId').value = conflictId;
            document.getElementById('resolveOwner').value = '';
            document.getElementById('resolveModal').style.display = 'block';
        }

        function closeResolveModal() {
            document.getElementById('resolveModal').style.display = 'none';
        }

        async function doResolve() {
            const conflictId = parseInt(document.getElementById('resolveConflictId').value);
            const resolution = document.querySelector('input[name="resolution"]:checked').value;
            const owner = document.getElementById('resolveOwner').value || 'unknown';
            
            const result = await fetchData(`sync-conflicts/${conflictId}/resolve`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ resolution: resolution, owner: owner })
            });
            
            if (result && result.success) {
                alert('冲突已解决');
                closeResolveModal();
                loadAllData();
            }
        }

        function exportLogs() {
            window.location.href = `${API_BASE}/api/sync-logs/export`;
        }

        async function testBlockedOperation() {
            const result = await fetchData('blocked-operation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rule: '敏感操作频率限制' })
            });
            if (result && result.blocked) {
                alert(`操作被阻挡: ${result.reason}`);
            }
        }

        async function initData() {
            if (confirm('确定要初始化数据吗？这将覆盖现有数据。')) {
                const result = await fetchData('init', { method: 'POST' });
                if (result && result.success) {
                    alert('数据初始化成功');
                    loadAllData();
                }
            }
        }

        document.addEventListener('DOMContentLoaded', loadAllData);
    </script>
</body>
</html>
