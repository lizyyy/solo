      name: "objPool"
      location: "main.go:15"
  events:
    - primitive_name: "objPool"
      primitive_type: "Pool"
      event_type: "Get"
      goroutine_id: 1
      timestamp: "2024-01-01T10:00:00Z"
      location: "main.go:25"
      details: "Get object from pool"
    - primitive_name: "objPool"
      primitive_type: "Pool"
      event_type: "Put"
      goroutine_id: 1
      timestamp: "2024-01-01T10:00:01Z"
      location: "main.go:30"
      details: "Put object back to pool without reset"
  expectations:
    - issue_type: "pool_misuse"
      should_exist: true
      description: "应检测到 Pool 误用风险"

- name: "once_init_case"
  description: "案例6：Once 初始化失败缓存 - 初始化函数可能失败"
  primitives:
    - type: "Once"
      name: "once"
      location: "main.go:12"
  expectations:
    - issue_type: "once_init_failed_cache"
      should_exist: true
      description: "应检测到 Once 初始化可能失败但无法重试的风险"

- name: "race_condition_case"
  description: "案例7：竞争条件 - 并发访问共享数据但没有同步"
  primitives: []
  events:
    - primitive_name: "sharedData"
      primitive_type: "Mutex"
      event_type: "Read"
      goroutine_id: 1
      timestamp: "2024-01-01T10:00:00Z"
      location: "main.go:25"
      details: "Read without lock"
    - primitive_name: "sharedData"
      primitive_type: "Mutex"
      event_type: "Write"
      goroutine_id: 2
      timestamp: "2024-01-01T10:00:00Z"
      location: "main.go:35"
      details: "Write without lock (same time as read)"
  expectations:
    - issue_type: "race_condition"
      should_exist: true
      description: "应检测到竞争条件风险"
