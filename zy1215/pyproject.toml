[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perf-trainer"
version = "0.1.0"
description = "Linux 性能排障练习工具 - 帮助新同事掌握 Linux 性能分析技能"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Team", email = "team@example.com" },
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "rich>=12.0.0",
    "pydantic>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
]

[project.scripts]
perf-trainer = "perf_trainer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["perf_trainer"]
