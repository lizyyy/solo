<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎷 爵士即兴段落标注 - 小看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f0eb;
    color: #3a2e25;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #2d1b0e 0%, #4a3020 100%);
    color: #f5e6d3;
    padding: 24px 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header h1 { font-size: 24px; font-weight: 600; }
  .header p { font-size: 14px; opacity: 0.8; margin-top: 4px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 2px solid #d4c4b0; }
  .tab {
    padding: 12px 20px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    font-size: 15px;
    color: #6b5a48;
    transition: all 0.2s;
  }
  .tab.active { color: #2d1b0e; border-bottom-color: #c17f4a; font-weight: 600; }
  .tab:hover { color: #2d1b0e; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(61, 40, 20, 0.08);
    border-left: 4px solid #c17f4a;
  }
  .stat-card.red { border-left-color: #d9534f; }
  .stat-card.green { border-left-color: #5cb85c; }
  .stat-card.yellow { border-left-color: #f0ad4e; }
  .stat-card.magenta { border-left-color: #a857a8; }
  .stat-label { font-size: 13px; color: #8a7a68; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; color: #2d1b0e; }
  .chart-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 768px) { .chart-row { grid-template-columns: 1fr; } }
  .chart-card {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(61, 40, 20, 0.08);
  }
  .chart-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #2d1b0e; }
  .bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 160px; padding: 10px 0; }
  .bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .bar {
    width: 100%;
    background: linear-gradient(to top, #c17f4a, #dba36d);
    border-radius: 4px 4px 0 0;
    transition: all 0.3s;
    min-height: 4px;
  }
  .bar.red { background: linear-gradient(to top, #d9534f, #e87e7b); }
  .bar.green { background: linear-gradient(to top, #5cb85c, #7ec97e); }
  .bar.yellow { background: linear-gradient(to top, #f0ad4e, #f5c679); }
  .bar-label { font-size: 12px; color: #6b5a48; margin-top: 8px; text-align: center; }
  .bar-value { font-size: 14px; font-weight: 600; color: #2d1b0e; margin-bottom: 4px; }
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 8px 16px;
    border: 1px solid #d4c4b0;
    border-radius: 20px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    color: #6b5a48;
    transition: all 0.2s;
  }
  .filter-btn.active { background: #2d1b0e; color: #f5e6d3; border-color: #2d1b0e; }
  .filter-btn:hover { border-color: #c17f4a; color: #2d1b0e; }
  .annotation-list { display: flex; flex-direction: column; gap: 12px; }
  .annotation-card {
    background: #fff;
    border-radius: 10px;
    padding: 18px 20px;
    box-shadow: 0 2px 6px rgba(61, 40, 20, 0.08);
    cursor: pointer;
    transition: all 0.2s;
    border-left: 4px solid #ccc;
  }
  .annotation-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(61, 40, 20, 0.12); }
  .annotation-card.flagged { border-left-color: #d9534f; background: #fef6f6; }
  .annotation-card.confirmed { border-left-color: #5cb85c; }
  .annotation-card.pending { border-left-color: #f0ad4e; }
  .annotation-card.needs_info { border-left-color: #a857a8; }
  .anno-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .anno-names { }
  .anno-live { font-size: 16px; font-weight: 600; color: #2d1b0e; }
  .anno-copy { font-size: 14px; color: #8a7a68; margin-top: 2px; }
  .anno-status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 500;
  }
  .status-flagged { background: #fde2e2; color: #c9302c; }
  .status-confirmed { background: #e2f0e2; color: #3d8b3d; }
  .status-pending { background: #fcf0d9; color: #c09135; }
  .status-needs_info { background: #f0e0f0; color: #8a4a8a; }
  .anno-reason { font-size: 14px; color: #6b5a48; line-height: 1.5; }
  .anno-next { margin-top: 10px; font-size: 13px; color: #c17f4a; font-weight: 500; }
  .conflict-badge {
    display: inline-block;
    background: #d9534f;
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(45, 27, 14, 0.6);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid #e8ddd0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h2 { font-size: 18px; color: #2d1b0e; }
  .close-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #8a7a68;
    padding: 0 4px;
  }
  .close-btn:hover { color: #2d1b0e; }
  .modal-body { padding: 24px; }
  .detail-section { margin-bottom: 20px; }
  .detail-section h3 {
    font-size: 15px;
    font-weight: 600;
    color: #2d1b0e;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #f0e6d9;
  }
  .detail-item {
    display: flex;
    padding: 8px 0;
    font-size: 14px;
  }
  .detail-label { width: 100px; color: #8a7a68; flex-shrink: 0; }
  .detail-value { color: #2d1b0e; flex: 1; }
  .detail-value.red { color: #d9534f; font-weight: 500; }
  .source-card {
    background: #faf6f1;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid #e8ddd0;
  }
  .source-title { font-size: 14px; font-weight: 600; color: #2d1b0e; margin-bottom: 8px; }
  .source-meta { font-size: 12px; color: #8a7a68; margin-bottom: 6px; }
  .source-text { font-size: 14px; color: #3a2e25; line-height: 1.5; }
  .source-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
    background: #e0d0b8;
    color: #6b5a48;
  }
  .source-tag.license { background: #d9e8d9; color: #3d8b3d; }
  .source-tag.note { background: #d9e2f0; color: #3d6b8b; }
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .review-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .review-btn.confirm { background: #5cb85c; color: #fff; }
  .review-btn.confirm:hover { background: #4cae4c; }
  .review-btn.need-info { background: #f0ad4e; color: #fff; }
  .review-btn.need-info:hover { background: #ec971f; }
  .review-btn.different { background: #d9534f; color: #fff; }
  .review-btn.different:hover { background: #c9302c; }
  .report-section { margin-bottom: 24px; }
  .report-section h2 {
    font-size: 18px;
    font-weight: 600;
    color: #2d1b0e;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid #f0e6d9;
  }
  .report-note {
    background: #faf6f1;
    border-left: 4px solid #c17f4a;
    padding: 14px 18px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 10px;
    font-size: 14px;
    color: #3a2e25;
    line-height: 1.6;
  }
  .flagged-item {
    background: #fef6f6;
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .flagged-title { font-size: 16px; font-weight: 600; color: #c9302c; margin-bottom: 8px; }
  .flagged-item p { font-size: 14px; color: #3a2e25; margin: 6px 0; }
  .flagged-item .missing { color: #d9534f; font-weight: 500; }
  .action-pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    background: #e8ddd0;
    color: #6b5a48;
  }
  .action-pill.teacher { background: #f0e2d0; color: #b37436; }
  .action-pill.amei { background: #e8d8e8; color: #8a4a8a; }
  .action-pill.ready { background: #d9e8d9; color: #3d8b3d; }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #8a7a68;
  }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: #6b5a48; }
  .empty-state p { font-size: 14px; }
  .seed-btn {
    margin-top: 16px;
    padding: 10px 20px;
    background: #c17f4a;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .seed-btn:hover { background: #a86a38; }
</style>
</head>
<body>
<div class="header">
  <h1>🎷 爵士即兴段落标注</h1>
  <p>巡演统筹阿梅和音乐老师的交接小助手</p>
</div>
<div class="container">
  <div class="tabs">
    <div class="tab active" data-tab="dashboard">小看板</div>
    <div class="tab" data-tab="list">标注列表</div>
    <div class="tab" data-tab="report">店长周报</div>
  </div>

  <div id="tab-dashboard" class="tab-content active">
    <div id="dashboard-empty" class="empty-state" style="display:none">
      <h3>还没有数据</h3>
      <p>先导入授权期限页和调音师留言吧</p>
      <button class="seed-btn" onclick="loadSeedData()">载入示例数据，走一遍流程</button>
    </div>
    <div id="dashboard-content">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">总曲目数</div><div class="stat-value" id="stat-total">0</div></div>
        <div class="stat-card green"><div class="stat-label">已确认可用</div><div class="stat-value" id="stat-confirmed">0</div></div>
        <div class="stat-card yellow"><div class="stat-label">待复核</div><div class="stat-value" id="stat-pending">0</div></div>
        <div class="stat-card red"><div class="stat-label">标红待处理</div><div class="stat-value" id="stat-flagged">0</div></div>
        <div class="stat-card magenta"><div class="stat-label">缺材料</div><div class="stat-value" id="stat-needs">0</div></div>
        <div class="stat-card red"><div class="stat-label">⚠️ 曲名冲突</div><div class="stat-value" id="stat-conflict">0</div></div>
      </div>
      <div class="chart-row">
        <div class="chart-card">
          <div class="chart-title">📈 标注状态分布</div>
          <div class="bar-chart" id="chart-status"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">🎯 下一步分工</div>
          <div class="bar-chart" id="chart-action"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="tab-list" class="tab-content">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="flagged">标红的</button>
      <button class="filter-btn" data-filter="pending">待复核</button>
      <button class="filter-btn" data-filter="needs_more_info">缺材料</button>
      <button class="filter-btn" data-filter="confirmed">已确认</button>
    </div>
    <div class="annotation-list" id="annotation-list"></div>
  </div>

  <div id="tab-report" class="tab-content">
    <div id="report-content"></div>
  </div>
</div>

<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>🔍 标注详情</h2>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const STATUS_LABEL = {
  pending_review: '待复核',
  needs_more_info: '缺材料',
  confirmed: '已确认',
  flagged: '标红待处理',
};
const ACTION_LABEL = {
  ask_music_teacher: '找音乐老师',
  ask_amei: '找巡演统筹阿梅',
  wait_license: '等授权',
  ok_ready: '没问题了',
};

let currentFilter = 'all';
let currentAnnotations = [];

async function fetchAPI(path, options) {
  const res = await fetch(path, options);
  return res.json();
}

async function loadDashboard() {
  const report = await fetchAPI('/api/report/weekly');
  const s = report.data.summary;
  document.getElementById('stat-total').textContent = s.total;
  document.getElementById('stat-confirmed').textContent = s.confirmed;
  document.getElementById('stat-pending').textContent = s.pending;
  document.getElementById('stat-flagged').textContent = s.flagged;
  document.getElementById('stat-needs').textContent = s.needsInfo;
  document.getElementById('stat-conflict').textContent = s.hasNameConflict;

  const maxStatus = Math.max(s.confirmed, s.pending, s.flagged, s.needsInfo, 1);
  const statusChart = document.getElementById('chart-status');
  statusChart.innerHTML = '';
  [
    { label: '已确认', value: s.confirmed, cls: 'green' },
    { label: '待复核', value: s.pending, cls: 'yellow' },
    { label: '标红', value: s.flagged, cls: 'red' },
    { label: '缺材料', value: s.needsInfo, cls: '' },
  ].forEach(item => {
    const height = (item.value / maxStatus) * 120 + 20;
    statusChart.innerHTML += `
      <div class="bar-item">
        <div class="bar-value">${item.value}</div>
        <div class="bar ${item.cls}" style="height:${height}px"></div>
        <div class="bar-label">${item.label}</div>
      </div>
    `;
  });

  const bd = s.nextActionBreakdown;
  const maxAction = Math.max(bd.askMusicTeacher, bd.askAmei, bd.ready, 1);
  const actionChart = document.getElementById('chart-action');
  actionChart.innerHTML = '';
  [
    { label: '找音乐老师', value: bd.askMusicTeacher, cls: 'yellow' },
    { label: '找阿梅补材料', value: bd.askAmei, cls: '' },
    { label: '已搞定', value: bd.ready, cls: 'green' },
  ].forEach(item => {
    const height = (item.value / maxAction) * 120 + 20;
    actionChart.innerHTML += `
      <div class="bar-item">
        <div class="bar-value">${item.value}</div>
        <div class="bar ${item.cls}" style="height:${height}px"></div>
        <div class="bar-label">${item.label}</div>
      </div>
    `;
  });

  if (s.total === 0) {
    document.getElementById('dashboard-empty').style.display = 'block';
    document.getElementById('dashboard-content').style.display = 'none';
  } else {
    document.getElementById('dashboard-empty').style.display = 'none';
    document.getElementById('dashboard-content').style.display = 'block';
  }
}

async function loadAnnotations() {
  const res = await fetchAPI('/api/annotations' + (currentFilter !== 'all' ? '?status=' + currentFilter : ''));
  currentAnnotations = res.data;
  const list = document.getElementById('annotation-list');
  if (currentAnnotations.length === 0) {
    list.innerHTML = '<div class="empty-state"><h3>没有符合条件的标注</h3><p>换个筛选条件试试？</p></div>';
    return;
  }
  list.innerHTML = currentAnnotations.map(a => {
    const statusCls = a.status.replace('_', ' ');
    const conflictBadge = a.hasNameConflict ? '<span class="conflict-badge">⚠️ 曲名冲突</span>' : '';
    return `
      <div class="annotation-card ${a.status}" onclick="openDetail('${a.id}')">
        <div class="anno-header">
          <div class="anno-names">
            <div class="anno-live">${a.liveName || '(未填现场名)'}</div>
            <div class="anno-copy">版权: ${a.copyrightName || '(未填)'}</div>
          </div>
          <span class="anno-status status-${a.status}">${STATUS_LABEL[a.status]}${conflictBadge}</span>
        </div>
        <div class="anno-reason">${a.reason || '（无备注）'}</div>
        <div class="anno-next">👉 下一步: ${ACTION_LABEL[a.nextAction]}</div>
      </div>
    `;
  }).join('');
}

async function loadReport() {
  const report = await fetchAPI('/api/report/weekly');
  const r = report.data;
  const s = r.summary;
  const el = document.getElementById('report-content');

  let html = `
    <div class="report-section">
      <h2>📊 本周概览</h2>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">总曲目数</div><div class="stat-value">${s.total}</div></div>
        <div class="stat-card green"><div class="stat-label">已确认可用</div><div class="stat-value">${s.confirmed}</div></div>
        <div class="stat-card yellow"><div class="stat-label">待复核</div><div class="stat-value">${s.pending}</div></div>
        <div class="stat-card red"><div class="stat-label">标红待处理</div><div class="stat-value">${s.flagged}</div></div>
        <div class="stat-card magenta"><div class="stat-label">缺材料</div><div class="stat-value">${s.needsInfo}</div></div>
        <div class="stat-card red"><div class="stat-label">曲名冲突</div><div class="stat-value">${s.hasNameConflict}</div></div>
      </div>
    </div>
    <div class="report-section">
      <h2>🎯 下一步分工</h2>
      <div class="report-note">找音乐老师确认: <strong>${s.nextActionBreakdown.askMusicTeacher}</strong> 条</div>
      <div class="report-note">找巡演统筹阿梅补材料: <strong>${s.nextActionBreakdown.askAmei}</strong> 条</div>
      <div class="report-note">已搞定: <strong>${s.nextActionBreakdown.ready}</strong> 条</div>
    </div>
  `;

  if (r.flaggedItems.length > 0) {
    html += '<div class="report-section"><h2>🚨 需要特别注意的曲目</h2>';
    html += '<div class="report-note">这些同一首歌有现场名和版权名，先别急着归正常，留给音乐老师听一下。</div>';
    for (const item of r.flaggedItems) {
      const actionCls = item.nextAction === 'ask_music_teacher' ? 'teacher' :
                        item.nextAction === 'ask_amei' ? 'amei' : 'ready';
      html += `
        <div class="flagged-item" onclick="openDetail('${item.annotationId}')" style="cursor:pointer">
          <div class="flagged-title">⚠️ ${item.liveName} / ${item.copyrightName}</div>
          <p><strong>留下原因:</strong> ${item.reason}</p>
          <p class="missing"><strong>还缺材料:</strong> ${item.missingMaterials.join('、')}</p>
          <p><strong>下一步:</strong> <span class="action-pill ${actionCls}">${ACTION_LABEL[item.nextAction]}</span></p>
          ${item.licenses.length > 0 ? '<p><strong>关联授权:</strong> ' + item.licenses.map(l => l.owner + '（至' + l.validTo + '）').join('、') + '</p>' : ''}
        </div>
      `;
    }
    html += '</div>';
  }

  html += '<div class="report-section"><h2>💡 备注</h2>';
  for (const note of r.notes) {
    html += `<div class="report-note">${note}</div>`;
  }
  html += '</div>';

  el.innerHTML = html;
}

async function openDetail(id) {
  const res = await fetchAPI('/api/annotations/' + id);
  const { annotation, song, licenses, engineerNotes } = res.data;

  let html = `
    <div class="detail-section">
      <h3>📝 基本信息</h3>
      <div class="detail-item"><div class="detail-label">状态</div><div class="detail-value">${STATUS_LABEL[annotation.status]}</div></div>
      <div class="detail-item"><div class="detail-label">现场名</div><div class="detail-value">${song.liveName || '(未填)'}</div></div>
      <div class="detail-item"><div class="detail-label">版权名</div><div class="detail-value">${song.copyrightName || '(未填)'}</div></div>
      ${annotation.hasNameConflict ? '<div class="detail-item"><div class="detail-label">曲名冲突</div><div class="detail-value red">⚠️ 现场名 ≠ 版权名，留给音乐老师复核</div></div>' : ''}
      <div class="detail-item"><div class="detail-label">留下原因</div><div class="detail-value">${annotation.reason || '(无)'}</div></div>
      <div class="detail-item"><div class="detail-label">缺材料</div><div class="detail-value">${annotation.missingMaterials.length > 0 ? annotation.missingMaterials.join('、') : '不缺'}</div></div>
      <div class="detail-item"><div class="detail-label">下一步</div><div class="detail-value">${ACTION_LABEL[annotation.nextAction]}</div></div>
      <div class="detail-item"><div class="detail-label">复核人</div><div class="detail-value">${annotation.reviewedBy || '(还没人复核)'}</div></div>
    </div>
  `;

  html += '<div class="detail-section"><h3>📄 关联的授权期限页</h3>';
  if (licenses.length === 0) {
    html += '<div class="source-text" style="color:#8a7a68">(还没有关联授权)</div>';
  }
  for (const lic of licenses) {
    html += `
      <div class="source-card">
        <div class="source-title"><span class="source-tag license">授权页</span> ${lic.copyrightName}</div>
        <div class="source-meta">版权方: ${lic.copyrightOwner} | 地区: ${lic.territory}</div>
        <div class="source-text">有效期: ${lic.validFrom} ~ ${lic.validTo}</div>
      </div>
    `;
  }
  html += '</div>';

  html += '<div class="detail-section"><h3>🎛️ 调音师留言</h3>';
  if (engineerNotes.length === 0) {
    html += '<div class="source-text" style="color:#8a7a68">(还没有调音师留言)</div>';
  }
  for (const note of engineerNotes) {
    html += `
      <div class="source-card">
        <div class="source-title"><span class="source-tag note">调音师留言</span> ${note.liveName}</div>
        <div class="source-meta">调音师: ${note.engineerName} | 场地: ${note.venue} | 日期: ${note.date}</div>
        <div class="source-text">${note.noteText}</div>
      </div>
    `;
  }
  html += '</div>';

  if (annotation.hasNameConflict || annotation.status === 'flagged' || annotation.status === 'pending_review') {
    html += `
      <div class="detail-section">
        <h3>🎵 音乐老师复核</h3>
        <div class="report-note" style="margin-bottom:12px">这首有曲名冲突，先别急着归正常，请听完确认后再操作。</div>
        <div class="review-actions">
          <button class="review-btn confirm" onclick="doReview('${id}', 'confirm_same_song')">✅ 确认是同一首歌</button>
          <button class="review-btn need-info" onclick="doReview('${id}', 'need_more_info')">❓ 还需要更多信息</button>
          <button class="review-btn different" onclick="doReview('${id}', 'different_songs')">❌ 是两首不同的歌</button>
        </div>
      </div>
    `;
  }

  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('detail-modal').classList.add('active');
}

async function doReview(id, decision) {
  await fetchAPI('/api/annotations/' + id + '/review', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ reviewer: '音乐老师（Web）', decision }),
  });
  closeModal();
  refreshAll();
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('active');
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + tabName + '"]').classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');
  if (tabName === 'dashboard') loadDashboard();
  if (tabName === 'list') loadAnnotations();
  if (tabName === 'report') loadReport();
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn[data-filter="' + filter + '"]').classList.add('active');
  loadAnnotations();
}

async function loadSeedData() {
  const licenses = [
    { copyrightName: 'Autumn Leaves', copyrightOwner: 'Warner Chappell', validFrom: '2026-01-01', validTo: '2026-12-31', territory: '中国大陆' },
    { copyrightName: 'Take Five', copyrightOwner: 'Sony/ATV', validFrom: '2026-01-01', validTo: '2026-06-30', territory: '中国大陆' },
    { copyrightName: 'So What', copyrightOwner: 'Sony/ATV', validFrom: '2026-01-01', validTo: '2026-12-31', territory: '中国大陆' },
  ];
  await fetchAPI('/api/import/licenses', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(licenses),
  });
  const notes = [
    { liveName: '秋叶', copyrightName: 'Autumn Leaves', engineerName: '老王', noteText: '这首有3分钟即兴solo段，萨克斯，观众反应很好', venue: 'Blue Note Beijing', date: '2026-05-10' },
    { liveName: 'Take Five', engineerName: '老张', noteText: '5/4拍那段即兴很稳，鼓和钢琴配合好', venue: 'Jazz Club Shanghai', date: '2026-05-15' },
    { liveName: '那又怎样', copyrightName: 'So What', engineerName: '老李', noteText: '钢琴手即兴了8分钟，大家都疯了', venue: 'Jazz Club Shanghai', date: '2026-05-15' },
  ];
  await fetchAPI('/api/import/notes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(notes),
  });
  refreshAll();
}

function refreshAll() {
  loadDashboard();
  loadAnnotations();
  loadReport();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});
document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => setFilter(b.dataset.filter));
});
document.getElementById('detail-modal').addEventListener('click', (e) => {
  if (e.target.id === 'detail-modal') closeModal();
});

refreshAll();
</script>
</body>
</html>
