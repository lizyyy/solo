version: '3.8'

services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
      - "127.0.0.1:8443:443"
    environment:
      - DB_HOST=localhost
      - DB_PORT=5432

  db:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
