<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>叉车盲区回放沙盘</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      overflow: hidden;
    }
    
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    .header {
      background: #16213e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }
    
    .header h1 {
      font-size: 1.5rem;
      color: #e94560;
    }
    
    .header-actions {
      display: flex;
      gap: 10px;
    }
    
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #e94560;
      color: white;
    }
    
    .btn-primary:hover {
      background: #d63850;
    }
    
    .btn-secondary {
      background: #0f3460;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #1a4a7a;
    }
    
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    .sidebar {
      width: 320px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .sidebar-tabs {
      display: flex;
      background: #0f3460;
    }
    
    .sidebar-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #8892b0;
      font-size: 13px;
    }
    
    .sidebar-tab.active {
      background: #16213e;
      color: white;
    }
    
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    
    .sidebar-panel {
      display: none;
    }
    
    .sidebar-panel.active {
      display: block;
    }
    
    .import-section {
      margin-bottom: 20px;
    }
    
    .import-section h3 {
      margin-bottom: 10px;
      font-size: 14px;
      color: #ccd6f6;
    }
    
    .import-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      background: #0f3460;
      border: 1px dashed #4a5568;
      border-radius: 4px;
      color: #8892b0;
      cursor: pointer;
      text-align: center;
    }
    
    .import-btn:hover {
      border-color: #e94560;
      color: white;
    }
    
    .file-status {
      font-size: 12px;
      color: #4ade80;
      margin-top: 5px;
    }
    
    .event-item {
      background: #0f3460;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      border-left: 3px solid #e94560;
      transition: all 0.2s;
    }
    
    .event-item:hover {
      background: #1a4a7a;
    }
    
    .event-item.selected {
      background: #1a4a7a;
      border-left-color: #4ade80;
    }
    
    .event-type {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .event-type.blind-spot { color: #f59e0b; }
    .event-type.overspeed { color: #ef4444; }
    .event-type.no-entry { color: #8b5cf6; }
    .event-type.near-miss { color: #f97316; }
    
    .event-time {
      font-size: 11px;
      color: #8892b0;
    }
    
    .event-details {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #1a4a7a;
      font-size: 12px;
      color: #ccd6f6;
    }
    
    .event-details dt {
      margin-top: 8px;
      color: #8892b0;
    }
    
    .event-details dd {
      margin-left: 0;
      margin-top: 3px;
    }
    
    .review-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #1a4a7a;
    }
    
    .review-section h4 {
      margin-bottom: 10px;
      font-size: 13px;
    }
    
    .review-textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 4px;
      color: white;
      resize: vertical;
      font-family: inherit;
      font-size: 13px;
    }
    
    .review-textarea:focus {
      outline: none;
      border-color: #e94560;
    }
    
    .review-status {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    .status-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #1a4a7a;
      background: transparent;
      color: #8892b0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .status-btn.selected {
      background: #e94560;
      border-color: #e94560;
      color: white;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: #0f3460;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #e94560;
    }
    
    .stat-label {
      font-size: 12px;
      color: #8892b0;
      margin-top: 5px;
    }
    
    .canvas-container {
      flex: 1;
      position: relative;
      background: #0a0a1a;
    }
    
    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .canvas-overlay {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(22, 33, 62, 0.9);
      padding: 15px;
      border-radius: 8px;
      font-size: 13px;
      min-width: 180px;
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .info-label {
      color: #8892b0;
    }
    
    .info-value {
      color: #ccd6f6;
      font-weight: bold;
    }
    
    .timeline-container {
      background: #16213e;
      border-top: 1px solid #0f3460;
      padding: 15px 20px;
    }
    
    .timeline-controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }
    
    .play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #e94560;
      color: white;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .play-btn:hover {
      background: #d63850;
    }
    
    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .speed-control label {
      font-size: 13px;
      color: #8892b0;
    }
    
    .speed-control select {
      background: #0f3460;
      color: white;
      border: 1px solid #1a4a7a;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
    }
    
    .time-display {
      margin-left: auto;
      font-family: monospace;
      font-size: 14px;
      color: #ccd6f6;
    }
    
    .timeline-bar {
      position: relative;
      height: 40px;
      background: #0f3460;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .timeline-progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: rgba(233, 69, 96, 0.3);
      pointer-events: none;
    }
    
    .timeline-cursor {
      position: absolute;
      top: -5px;
      width: 2px;
      height: calc(100% + 10px);
      background: #e94560;
      transform: translateX(-50%);
      pointer-events: none;
    }
    
    .timeline-cursor::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background: #e94560;
      border-radius: 50%;
    }
    
    .event-marker {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }
    
    .event-marker.blind-spot { background: #f59e0b; }
    .event-marker.overspeed { background: #ef4444; }
    .event-marker.no-entry { background: #8b5cf6; }
    .event-marker.near-miss { background: #f97316; }
    
    .legend {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      font-size: 12px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #8892b0;
    }
    
    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #8892b0;
    }
    
    .empty-state h3 {
      margin-bottom: 10px;
      color: #ccd6f6;
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal {
      background: #16213e;
      border-radius: 8px;
      padding: 25px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal h2 {
      margin-bottom: 20px;
      color: #e94560;
    }
    
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }
    
    .evidence-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    
    .evidence-img {
      background: #0f3460;
      height: 120px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8892b0;
      font-size: 12px;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>🚜 叉车盲区回放沙盘</h1>
      <div class="header-actions">
        <button class="btn btn-secondary" id="load-sample-btn">加载示例数据</button>
        <button class="btn btn-secondary" id="export-md-btn">导出报告</button>
        <button class="btn btn-secondary" id="export-csv-btn">导出风险清单</button>
        <button class="btn btn-primary" id="export-json-btn">导出审计包</button>
      </div>
    </header>
    
    <div class="main-container">
      <aside class="sidebar">
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" data-tab="import">数据导入</button>
          <button class="sidebar-tab" data-tab="events">事件列表</button>
          <button class="sidebar-tab" data-tab="stats">统计概览</button>
        </div>
        
        <div class="sidebar-content">
          <div class="sidebar-panel active" id="import-panel">
            <div class="empty-state" id="import-empty">
              <h3>📁 导入数据</h3>
              <p>请导入以下数据文件开始复盘</p>
            </div>
            
            <div class="import-section">
              <h3>货架布局 (JSON)</h3>
              <label class="import-btn">
                选择 shelves.json 文件
                <input type="file" id="shelves-file" accept=".json" class="hidden">
              </label>
              <div class="file-status" id="shelves-status"></div>
            </div>
            
            <div class="import-section">
              <h3>叉车轨迹 (CSV)</h3>
              <label class="import-btn">
                选择 forklift_gps.csv 文件
                <input type="file" id="forklift-file" accept=".csv" class="hidden">
              </label>
              <div class="file-status" id="forklift-status"></div>
            </div>
            
            <div class="import-section">
              <h3>近失事件 (JSON)</h3>
              <label class="import-btn">
                选择 near_miss.json 文件
                <input type="file" id="near-miss-file" accept=".json" class="hidden">
              </label>
              <div class="file-status" id="near-miss-status"></div>
            </div>
            
            <div class="import-section">
              <h3>摄像头标注 (JSON)</h3>
              <label class="import-btn">
                选择 camera_annotations.json 文件
                <input type="file" id="camera-file" accept=".json" class="hidden">
              </label>
              <div class="file-status" id="camera-status"></div>
            </div>
          </div>
          
          <div class="sidebar-panel" id="events-panel">
            <div class="empty-state" id="events-empty">
              <h3>⏳ 等待数据</h3>
              <p>导入数据后，事件列表将显示在此处</p>
            </div>
            <div id="events-list"></div>
          </div>
          
          <div class="sidebar-panel" id="stats-panel">
            <div class="empty-state" id="stats-empty">
              <h3>📊 等待数据</h3>
              <p>导入数据后，统计信息将显示在此处</p>
            </div>
            <div id="stats-content" class="hidden">
              <div class="stats-grid">
                <div class="stat-card">
                  <div class="stat-value" id="stat-total">0</div>
                  <div class="stat-label">总事件数</div>
                </div>
                <div class="stat-card">
                  <div class="stat-value" id="stat-blind-spot">0</div>
                  <div class="stat-label">盲区交汇</div>
                </div>
                <div class="stat-card">
                  <div class="stat-value" id="stat-overspeed">0</div>
                  <div class="stat-label">超速事件</div>
                </div>
                <div class="stat-card">
                  <div class="stat-value" id="stat-no-entry">0</div>
                  <div class="stat-label">禁行区穿越</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>
      
      <div class="canvas-container">
        <canvas id="three-canvas"></canvas>
        <div class="canvas-overlay" id="forklift-info">
          <div class="info-item">
            <span class="info-label">叉车编号:</span>
            <span class="info-value" id="info-forklift-id">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">当前速度:</span>
            <span class="info-value" id="info-speed">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">运行方向:</span>
            <span class="info-value" id="info-direction">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">距离盲区:</span>
            <span class="info-value" id="info-blind-spot">-</span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="timeline-container">
      <div class="timeline-controls">
        <button class="play-btn" id="play-btn">▶</button>
        <div class="speed-control">
          <label>播放速度:</label>
          <select id="speed-select">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
          </select>
        </div>
        <div class="time-display">
          <span id="current-time">00:00:00</span> / <span id="total-time">00:00:00</span>
        </div>
      </div>
      <div class="timeline-bar" id="timeline-bar">
        <div class="timeline-progress" id="timeline-progress"></div>
        <div class="timeline-cursor" id="timeline-cursor"></div>
      </div>
      <div class="legend">
        <div class="legend-item">
          <span class="legend-color" style="background: #f59e0b;"></span>
          <span>盲区交汇</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #ef4444;"></span>
          <span>超速</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #8b5cf6;"></span>
          <span>禁行区穿越</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #f97316;"></span>
          <span>近失事件</span>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="evidence-modal">
    <div class="modal">
      <h2>📸 事件证据详情</h2>
      <div id="evidence-content"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="close-modal-btn">关闭</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
