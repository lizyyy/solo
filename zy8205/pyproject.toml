[project]
name = "cleanroom-verifier"
version = "0.1.0"
description = "洁净厂房压差级联和换气配置复核工具"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Cleanroom Ops Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
cleanroom-verifier = "cleanroom_verifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cleanroom_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
