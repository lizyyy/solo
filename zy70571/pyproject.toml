[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logfmt-cli"
version = "0.1.0"
authors = [{ name="Your Name", email="your@email.com" }]
description = "Logfmt structured parser CLI for mixed log files"
requires-python = ">=3.8"
dependencies = [
  "click>=8.0",
]

[project.scripts]
logfmt = "logfmt_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
