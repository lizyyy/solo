server {
    listen 80;
    server_name localhost;

    location = /health {
        proxy_pass http://health-service;
    }

    location ~ ^/api/v\d+/users {
        proxy_pass http://user-service;
    }

    location /api/v1/orders {
        proxy_pass http://order-service;
    }

    location / {
        proxy_pass http://default-service;
    }
}
