[project]
name = "route-checker"
version = "0.1.0"
description = "API网关路由体检CLI工具"
requires-python = ">=3.8"
authors = [
  { name = "Route Checker Team" }
]
dependencies = [
  "click>=8.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "jinja2>=3.0",
]

[project.scripts]
route-checker = "route_checker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
