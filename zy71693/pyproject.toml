[tool.poetry]
name = "flight-overbooking-optimizer"
version = "1.0.0"
description = "航班超售补偿优化系统 - 航空收益管理工具"
authors = ["Revenue Analytics Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.0.0"
numpy = "^1.24.0"
scipy = "^1.10.0"
click = "^8.1.0"
rich = "^13.0.0"
pydantic = "^2.0.0"
python-dateutil = "^2.8.0"
tabulate = "^0.9.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
