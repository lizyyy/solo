{% extends "base.html" %}

{% block content %}
<h1 style="margin-bottom: 24px;">新建租赁</h1>

<div class="card" style="max-width: 800px;">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>学生 *</label>
                <select name="student_id" required>
                    <option value="">请选择学生</option>
                    {% for student in students %}
                    <option value="{{ student.id }}">{{ student.name }} ({{ student.student_id or '无学号' }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>设备 *</label>
                <select name="equipment_id" required>
                    <option value="">请选择设备</option>
                    {% for eq in equipment %}
                    <option value="{{ eq.id }}">{{ eq.name }} - {{ eq.serial_number }} (押金: ¥{{ eq.deposit_amount }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>租赁日期 *</label>
                <input type="date" name="rent_date" required>
            </div>
            <div class="form-group">
                <label>应还日期</label>
                <input type="date" name="due_date">
            </div>
        </div>
        
        <div class="form-group">
            <label>已交押金</label>
            <input type="number" name="deposit_paid" step="0.01" value="0">
        </div>
        
        <div class="form-group">
            <label>备注</label>
            <textarea name="notes" rows="3" placeholder="备注信息..."></textarea>
        </div>
        
        <div style="display: flex; gap: 8px; justify-content: flex-end;">
            <a href="{{ url_for('rentals') }}" class="btn">取消</a>
            <button type="submit" class="btn btn-primary">创建租赁单</button>
        </div>
    </form>
</div>
{% endblock %}
