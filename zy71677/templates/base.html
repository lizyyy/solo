<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐器租赁押金追踪系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .nav { background: #2c3e50; padding: 0 20px; display: flex; align-items: center; height: 56px; }
        .nav a { color: white; text-decoration: none; padding: 18px 16px; font-size: 14px; }
        .nav a:hover, .nav a.active { background: #34495e; }
        .nav .logo { font-weight: bold; font-size: 18px; padding-right: 30px; }
        .container { max-width: 1400px; margin: 24px auto; padding: 0 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 24px; }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #2c3e50; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-card .number { font-size: 32px; font-weight: bold; color: #3498db; }
        .stat-card .label { font-size: 14px; color: #7f8c8d; margin-top: 4px; }
        .stat-card.warning .number { color: #e67e22; }
        .stat-card.error .number { color: #e74c3c; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; font-size: 13px; color: #555; }
        tr:hover { background: #f8f9fa; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-overdue { background: #f8d7da; color: #721c24; }
        .badge-completed { background: #d1ecf1; color: #0c5460; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-error { background: #f8d7da; color: #721c24; }
        .badge-info { background: #d4edda; color: #155724; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #e67e22; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .filter-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .alert { padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .detail-item { padding: 12px; background: #f8f9fa; border-radius: 4px; }
        .detail-item .label { font-size: 12px; color: #7f8c8d; margin-bottom: 4px; }
        .detail-item .value { font-size: 16px; font-weight: 500; }
        .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab { padding: 12px 24px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { border-bottom-color: #3498db; color: #3498db; font-weight: 600; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .upload-area { border: 2px dashed #ddd; padding: 40px; text-align: center; border-radius: 8px; cursor: pointer; }
        .upload-area:hover { border-color: #3498db; background: #f8f9fa; }
        .anomaly-item { padding: 16px; border-left: 4px solid #ddd; margin-bottom: 12px; background: #fafafa; }
        .anomaly-item.error { border-left-color: #e74c3c; }
        .anomaly-item.warning { border-left-color: #f39c12; }
        .anomaly-item.info { border-left-color: #3498db; }
        .anomaly-item .desc { margin-bottom: 8px; }
        .anomaly-item .action { font-size: 13px; color: #666; background: #fff; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="{{ url_for('index') }}" class="logo">🎸 乐器租赁管理</a>
        <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>首页</a>
        <a href="{{ url_for('rentals') }}" {% if request.endpoint == 'rentals' %}class="active"{% endif %}>租赁记录</a>
        <a href="{{ url_for('new_rental') }}" {% if request.endpoint == 'new_rental' %}class="active"{% endif %}>新建租赁</a>
        <a href="{{ url_for('students') }}" {% if request.endpoint == 'students' %}class="active"{% endif %}>学生管理</a>
        <a href="{{ url_for('equipment_list') }}" {% if request.endpoint == 'equipment_list' %}class="active"{% endif %}>设备管理</a>
        <a href="{{ url_for('anomalies') }}" {% if request.endpoint == 'anomalies' %}class="active"{% endif %}>异常检测
            {% set pending_anomalies = namespace(count=0) %}
            {% if 'pending_anomalies' not in stats %}
            {% endif %}
        </a>
        <a href="{{ url_for('reminders') }}" {% if request.endpoint == 'reminders' %}class="active"{% endif %}>提醒中心</a>
        <a href="{{ url_for('import_page') }}" {% if request.endpoint == 'import_page' %}class="active"{% endif %}>数据导入</a>
        <a href="{{ url_for('export_page') }}" {% if request.endpoint == 'export_page' %}class="active"{% endif %}>报表导出</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        function showAlert(message, type='info') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            document.querySelector('.container').insertBefore(alert, document.querySelector('.container').firstChild);
            setTimeout(() => alert.remove(), 5000);
        }
        
        function confirmAction(message) {
            return confirm(message);
        }
    </script>
</body>
</html>
