<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小区团购预售订单管理系统</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#/" onclick="navigateTo('dashboard')">
        <i class="bi bi-cart-check"></i> 小区团购预售管理
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#/dashboard" onclick="navigateTo('dashboard')">
              <i class="bi bi-speedometer2"></i> 仪表盘
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/products" onclick="navigateTo('products')">
              <i class="bi bi-box-seam"></i> 商品维护
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/orders" onclick="navigateTo('orders')">
              <i class="bi bi-receipt"></i> 订单管理
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/replacements" onclick="navigateTo('replacements')">
              <i class="bi bi-arrow-left-right"></i> 缺货替换
              <span class="badge bg-danger ms-1" id="pending-badge" style="display:none;">0</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/shipping" onclick="navigateTo('shipping')">
              <i class="bi bi-truck"></i> 发货清单
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/users" onclick="navigateTo('users')">
              <i class="bi bi-people"></i> 用户状态
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container" id="app-content">
  </div>

  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="productModalTitle">添加商品</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="productForm">
            <input type="hidden" id="product-id">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">商品名称 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="product-name" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">分类</label>
                <select class="form-select" id="product-category">
                  <option value="">请选择分类</option>
                  <option value="水果">水果</option>
                  <option value="蔬菜">蔬菜</option>
                  <option value="肉类">肉类</option>
                  <option value="海鲜">海鲜</option>
                  <option value="禽蛋">禽蛋</option>
                  <option value="粮油">粮油</option>
                  <option value="其他">其他</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">单价 <span class="text-danger">*</span></label>
                <input type="number" step="0.01" min="0" class="form-control" id="product-price" required>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">单位 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="product-unit" placeholder="如：斤/盒/袋" required>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">库存数量</label>
                <input type="number" min="0" class="form-control" id="product-stock" value="0">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">商品描述</label>
              <textarea class="form-control" id="product-description" rows="2"></textarea>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="product-available" checked>
              <label class="form-check-label" for="product-available">
                商品可用
              </label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" onclick="saveProduct()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderModalTitle">新建订单</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="orderForm">
            <input type="hidden" id="order-id">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">用户名 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="order-username" required>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">联系电话</label>
                <input type="tel" class="form-control" id="order-phone">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">取货时间 <span class="text-danger">*</span></label>
                <select class="form-select" id="order-pickup" required>
                  <option value="">请选择取货时间</option>
                </select>
              </div>
            </div>
            
            <div class="card mb-3">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span>订单项</span>
                <button type="button" class="btn btn-sm btn-primary" onclick="addOrderItem()">
                  <i class="bi bi-plus"></i> 添加商品
                </button>
              </div>
              <div class="card-body">
                <table class="table table-sm" id="order-items-table">
                  <thead>
                    <tr>
                      <th>商品</th>
                      <th>单价</th>
                      <th>数量</th>
                      <th>小计</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="order-items-body">
                  </tbody>
                  <tfoot>
                    <tr class="table-light">
                      <td colspan="3" class="text-end fw-bold">总计：</td>
                      <td class="fw-bold text-primary" id="order-total">¥0.00</td>
                      <td></td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">备注</label>
              <textarea class="form-control" id="order-notes" rows="2"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" onclick="saveOrder()">保存订单</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="replacementModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">标记缺货并创建替换</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="replacementForm">
            <input type="hidden" id="rep-order-item-id">
            <input type="hidden" id="rep-original-product-id">
            <input type="hidden" id="rep-original-product-name">
            <input type="hidden" id="rep-original-price">
            
            <div class="alert alert-warning">
              <i class="bi bi-exclamation-triangle"></i>
              <strong>原商品缺货：</strong>
              <span id="rep-original-info"></span>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">选择替换商品</label>
                <select class="form-select" id="rep-suggested-product" onchange="updatePriceDifference()">
                  <option value="">请选择替换商品（可选）</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">差价</label>
                <div class="input-group">
                  <span class="input-group-text">¥</span>
                  <input type="number" step="0.01" class="form-control" id="rep-price-difference" readonly>
                </div>
                <div class="form-text">正数表示用户需要补差价，负数表示退还差价</div>
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">备注说明</label>
              <textarea class="form-control" id="rep-notes" rows="2" placeholder="给用户的说明，如：草莓临时缺货，推荐替换为..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-warning" onclick="createReplacement()">确认标记缺货</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
