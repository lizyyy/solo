[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-write-consistency"
version = "0.1.0"
description = "双写一致性校验 CLI 工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "tabulate>=0.9.0",
]

[project.scripts]
dual-write-check = "dual_write_consistency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
