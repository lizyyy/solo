appliance_installation_check:
  rules:
    photo_blur:
      enabled: true
      threshold: 100
      description: "照片模糊度检测阈值，值越小越严格"
      error_message: "照片模糊度不达标"
    
    signature_missing:
      enabled: true
      required_fields:
        - customer_signature
        - technician_signature
      description: "签名缺失检查字段"
      error_message: "缺少必要签名"

  output:
    format: "json"
    include_success_details: true
    retry_output_dir: "./output"
    summary_filename: "check_summary.json"
    
  error_handling:
    continue_on_failure: true
    max_retries: 3
    log_level: "INFO"

  business_rules:
    min_photo_count: 3
    required_photo_types:
      - "before_installation"
      - "after_installation"
      - "signature_photo"
    max_file_size_mb: 10
