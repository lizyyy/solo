shards:
  - id: 0
    name: shard-0
    host: shard-0.example.com
    port: 3306
    database: ecommerce_shard0
    weight: 1
  - id: 1
    name: shard-1
    host: shard-1.example.com
    port: 3306
    database: ecommerce_shard1
    weight: 1
  - id: 2
    name: shard-2
    host: shard-2.example.com
    port: 3306
    database: ecommerce_shard2
    weight: 1
  - id: 3
    name: shard-3
    host: shard-3.example.com
    port: 3306
    database: ecommerce_shard3
    weight: 1

tables:
  - table: users
    shardKey: user_id
    shardCount: 4
    algorithm: hash
  - table: orders
    shardKey: user_id
    shardCount: 4
    algorithm: hash
  - table: order_items
    shardKey: order_id
    shardCount: 4
    algorithm: modulo

routingRules:
  - pattern: "SELECT.*FROM users WHERE user_id = ?"
    shardIds: [0, 1, 2, 3]
    priority: 10
  - pattern: "INSERT INTO users"
    shardIds: [0, 1, 2, 3]
    priority: 5
  - pattern: "SELECT.*FROM orders WHERE user_id = ?"
    shardIds: [0, 1, 2, 3]
    priority: 10
