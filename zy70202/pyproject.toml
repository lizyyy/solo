[project]
name = "call-sheet-cli"
version = "0.1.0"
description = "剧组通告单变更管理CLI工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=10.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
call-sheet = "call_sheet_cli.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
