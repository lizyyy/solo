<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>盾构刀盘报告复核系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.15.0/dist/reset.css" />
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
  .export-card { padding: 24px; background: #fff; }
  .export-card .header { border-bottom: 2px solid #1890ff; padding-bottom: 16px; margin-bottom: 16px; }
  .export-card .risk-tag { display: inline-block; padding: 4px 12px; border-radius: 4px; font-weight: bold; margin-left: 8px; }
  .export-card .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  .export-card .summary-item { padding: 12px; background: #fafafa; border-radius: 4px; }
  .export-card .section-title { font-size: 16px; font-weight: bold; color: #1890ff; border-left: 4px solid #1890ff; padding-left: 8px; margin: 20px 0 12px 0; }
  .ant-drawer-body { padding: 0; }
  .ant-tabs { padding: 16px; }
  .ic { font-style: normal; margin-right: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/antd@5.15.0/dist/antd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>

<script>
const { useState, useEffect, useMemo } = React;
const {
  Layout, Menu, Button, Table, Tag, Space, Input, Select, DatePicker, Modal, Form, InputNumber,
  message, Drawer, Tabs, Timeline, Card, Descriptions, Tooltip, Divider, Popover, Alert, Empty, ConfigProvider, theme
} = antd;
const { Header, Content, Sider } = Layout;
const { Option } = Select;
const { RangePicker } = DatePicker;
const { TextArea } = Input;

const STATUS_OPTIONS = ['待复核', '复核中', '有风险', '已通过', '需补录', '已驳回'];
const RISK_COLORS = { '高': 'red', '中': 'orange', '低': 'green' };
const STATUS_COLORS = { '待复核': 'default', '复核中': 'processing', '有风险': 'warning', '已通过': 'success', '需补录': 'warning', '已驳回': 'error' };
const ARRIVAL_STATUS_OPTIONS = ['待确认', '未到货', '已发货', '已到货', '到货晚于停机窗口'];
const ARRIVAL_COLORS = { '待确认': 'default', '未到货': 'warning', '已发货': 'processing', '已到货': 'success', '到货晚于停机窗口': 'error' };

const api = axios.create({ baseURL: '/api', timeout: 15000 });
api.interceptors.response.use(r => r.data, err => { console.error('API Err:', err); return { code: -1, message: err.message }; });

const H = React.createElement;
const emptyTip = t => H(Empty, { description: t, style: { padding: '40px 0' } });

function ExportCard({ data, traceId }) {
  const { report, parts, replacements, snapshots, filters } = data || { report: {}, parts: [], replacements: [], snapshots: [] };
  const riskParts = (parts || []).filter(p => p.arrival_status === '到货晚于停机窗口');
  const pendingParts = (parts || []).filter(p => ['待确认', '未到货'].includes(p.arrival_status));

  return H('div', { id: 'export-card', className: 'export-card', style: { width: 900, margin: '0 auto', background: '#fff' } },
    H('div', { className: 'header', style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' } },
      H('div', null,
        H('h1', { style: { margin: 0, fontSize: 22, color: '#0a3d91' } }, '🛡 盾构刀盘报告复核说明'),
        H('div', { style: { marginTop: 8, color: '#666' } },
          '报告编号：', H('strong', { style: { color: '#0a3d91' } }, report.report_no),
          '  |  追溯号：', H('strong', { style: { color: '#d4380d' } }, traceId)
        )
      ),
      H('div', null,
        H(Tag, { color: STATUS_COLORS[report.current_status], style: { fontSize: 14, padding: '4px 12px' } }, report.current_status),
        H('span', { className: 'risk-tag', style: { background: RISK_COLORS[report.risk_level], color: '#fff' } }, '风险 ' + report.risk_level)
      )
    ),
    H(Descriptions, { column: 2, bordered: true, size: 'small', style: { marginTop: 16 } },
      H(Descriptions.Item, { label: '项目名称' }, report.project_name),
      H(Descriptions.Item, { label: '盾构机号' }, report.shield_no),
      H(Descriptions.Item, { label: '刀盘编号' }, report.cutter_disc_no || '-'),
      H(Descriptions.Item, { label: '复核人' }, report.reviewer),
      H(Descriptions.Item, { label: '停机窗口', span: 2 }, (report.shutdown_window_start || '-') + ' ~ ' + (report.shutdown_window_end || '-'))
    ),
    H('div', { className: 'section-title' }, '📋 复核结论'),
    H('div', { style: { padding: 12, background: '#f6ffed', border: '1px solid #b7eb8f', borderRadius: 4, lineHeight: 1.8 } },
      H('strong', null, '结论：'), report.current_conclusion || '（无）',
      snapshots && snapshots[0] && snapshots[0].change_reason &&
        H('div', { style: { marginTop: 8, color: '#555', fontSize: 13 } },
          H('strong', null, '改判原因：'), snapshots[0].change_reason
        )
    ),
    H('div', { className: 'section-title' }, '📊 风险摘要'),
    H('div', { className: 'summary-grid' },
      H('div', { className: 'summary-item' },
        H('div', { style: { color: '#888', fontSize: 12 } }, '备件总数'),
        H('div', { style: { fontSize: 22, fontWeight: 'bold' } }, parts.length, H('span', { style: { fontSize: 13, color: '#888' } }, '项'))
      ),
      H('div', { className: 'summary-item', style: { background: '#fff7e6' } },
        H('div', { style: { color: '#888', fontSize: 12 } }, '待确认/未到货'),
        H('div', { style: { fontSize: 22, fontWeight: 'bold', color: '#fa8c16' } }, pendingParts.length, H('span', { style: { fontSize: 13 } }, '项'))
      ),
      H('div', { className: 'summary-item', style: { background: '#fff1f0' } },
        H('div', { style: { color: '#888', fontSize: 12 } }, '⚠️ 到货晚于窗口'),
        H('div', { style: { fontSize: 22, fontWeight: 'bold', color: '#ff4d4f' } }, riskParts.length, H('span', { style: { fontSize: 13 } }, '项'))
      ),
      H('div', { className: 'summary-item', style: { background: '#e6f7ff' } },
        H('div', { style: { color: '#888', fontSize: 12 } }, '🔄 型号替换记录'),
        H('div', { style: { fontSize: 22, fontWeight: 'bold', color: '#1890ff' } }, replacements.length, H('span', { style: { fontSize: 13 } }, '次'))
      )
    ),
    H('div', { className: 'section-title' }, '📦 关键备件清单'),
    H('table', { style: { width: '100%', borderCollapse: 'collapse', fontSize: 13 }, border: '1', cellPadding: '6' },
      H('thead', { style: { background: '#f0f5ff' } },
        H('tr', null, ['#', '备件名称', '型号规格', '数量', '到货状态', '预计到货', '来源批次'].map(h => H('th', { key: h }, h)))
      ),
      H('tbody', null, parts.map((p, i) =>
        H('tr', { key: i, style: p.arrival_status === '到货晚于停机窗口' ? { background: '#fff1f0' } : {} },
          H('td', { align: 'center' }, p.source_line_no || i + 1),
          H('td', null, p.part_name),
          H('td', null, p.model_spec),
          H('td', { align: 'center' }, p.quantity),
          H('td', null, p.arrival_status),
          H('td', null, p.estimated_arrival || '-'),
          H('td', null, '批次' + p.batch_no + ' v' + p.version)
        )
      ))
    ),
    replacements.length > 0 && [
      H('div', { key: 't', className: 'section-title' }, '🔁 型号替换说明'),
      ...replacements.map((r, i) =>
        H('div', { key: i, style: { padding: 10, marginBottom: 8, background: '#fffbe6', border: '1px solid #ffe58f', borderRadius: 4, fontSize: 13 } },
          H('div', null, H('strong', null, '替换 #' + (i + 1) + '：'),
            H('span', { style: { textDecoration: 'line-through', color: '#999' } }, r.original_model),
            ' → ', H('span', { style: { color: '#d4380d', fontWeight: 'bold' } }, r.new_model)
          ),
          H('div', { style: { marginTop: 4, color: '#555' } }, '来源行号：' + (r.affected_line_nos || '无') + '  |  影响范围：' + (r.affected_scope || '待评估')),
          H('div', { style: { marginTop: 4, color: '#555' } }, '原因：' + (r.replacement_reason || '-'))
        )
      )
    ],
    H('div', { style: { marginTop: 24, borderTop: '1px dashed #ccc', paddingTop: 12, fontSize: 12, color: '#888', display: 'flex', justifyContent: 'space-between' } },
      H('div', null, '导出时间：' + new Date().toLocaleString('zh-CN') + ' | 操作人：阿敏（维保主管）'),
      H('div', null, '筛选条件：' + (filters ? JSON.stringify(filters).replace(/"/g, '') : '（无）'))
    )
  );
}

function App() {
  const [reports, setReports] = useState([]);
  const [loading, setLoading] = useState(false);
  const [selectedReport, setSelectedReport] = useState(null);
  const [detailData, setDetailData] = useState(null);
  const [filters, setFilters] = useState({ status: '全部', risk_level: '全部', keyword: '' });
  const [detailDrawer, setDetailDrawer] = useState(false);
  const [reviewModal, setReviewModal] = useState(false);
  const [partsModal, setPartsModal] = useState(false);
  const [replaceModal, setReplaceModal] = useState(false);
  const [exportModal, setExportModal] = useState(false);
  const [traceRestoreModal, setTraceRestoreModal] = useState(false);
  const [traceInput, setTraceInput] = useState('');
  const [lastTraceId, setLastTraceId] = useState('');
  const [exportList, setExportList] = useState([]);
  const [partsForm] = Form.useForm();
  const [reviewForm] = Form.useForm();
  const [replaceForm] = Form.useForm();
  const [createReportForm] = Form.useForm();
  const [createReportModal, setCreateReportModal] = useState(false);
  const [newParts, setNewParts] = useState([{ part_name: '', model_spec: '', quantity: 1, arrival_status: '待确认', estimated_arrival: '' }]);

  useEffect(() => { loadReports(); loadExports(); }, []);

  function loadReports() {
    setLoading(true);
    api.get('/reports', { params: filters }).then(r => { if (r.code === 0) setReports(r.data); else message.error(r.message); }).finally(() => setLoading(false));
  }
  function loadExports() { api.get('/exports').then(r => { if (r.code === 0) setExportList(r.data); }); }
  function loadDetail(id) {
    api.get('/reports/' + id).then(r => {
      if (r.code === 0) {
        setDetailData(r.data);
        setSelectedReport(r.data.report);
        setDetailDrawer(true);
      } else message.error(r.message);
    });
  }
  function handleReviewSubmit() {
    reviewForm.validateFields().then(values => {
      api.post('/reports/' + selectedReport.id + '/review', values).then(r => {
        if (r.code === 0) {
          message.success(r.data.message);
          setReviewModal(false); reviewForm.resetFields();
          loadDetail(selectedReport.id); loadReports();
        } else message.error(r.message);
      });
    });
  }
  function handlePartsSubmit() {
    const submitted = newParts.map(p => ({ ...p, _action: p.id ? 'update' : 'create' })).filter(p => p.part_name || p.id);
    if (submitted.length === 0) return message.warning('请至少填写一条备件');
    const values = partsForm.getFieldsValue();
    api.post('/reports/' + selectedReport.id + '/parts', { parts: submitted, batchRemark: values && values.batchRemark }).then(r => {
      if (r.code === 0) {
        message.success(r.data.message);
        setPartsModal(false); partsForm.resetFields();
        setNewParts([{ part_name: '', model_spec: '', quantity: 1, arrival_status: '待确认', estimated_arrival: '' }]);
        loadDetail(selectedReport.id); loadReports();
      } else message.error(r.message);
    });
  }
  function handleReplaceSubmit() {
    replaceForm.validateFields().then(values => {
      api.post('/reports/' + selectedReport.id + '/model-replace', values).then(r => {
        if (r.code === 0) {
          message.success(r.data.message);
          setReplaceModal(false); replaceForm.resetFields();
          loadDetail(selectedReport.id); loadReports();
        } else message.error(r.message);
      });
    });
  }
  function handleCreateReport() {
    createReportForm.validateFields().then(values => {
      api.post('/reports', values).then(r => {
        if (r.code === 0) {
          message.success('报告已创建');
          setCreateReportModal(false); createReportForm.resetFields();
          loadReports();
          setTimeout(() => loadDetail(r.data.id), 300);
        } else message.error(r.message);
      });
    });
  }
  async function handleExport() {
    const exportFilters = { ...filters, report_id: selectedReport ? selectedReport.id : null };
    const r = await api.post('/exports', { report_id: selectedReport ? selectedReport.id : null, filter_conditions: exportFilters, export_type: '复核说明截图', remark: '人工导出' });
    if (r.code !== 0) return message.error('保存导出记录失败');
    const traceId = r.data.trace_id;
    setLastTraceId(traceId);
    loadExports();
    await new Promise(res => setTimeout(res, 200));
    const card = document.getElementById('export-card');
    if (!card) return;
    try {
      message.loading({ content: '正在生成截图...', key: 'exp', duration: 0 });
      const canvas = await html2canvas(card, { scale: 2, useCORS: true, backgroundColor: '#fff' });
      const link = document.createElement('a');
      link.download = '刀盘复核说明_' + (selectedReport ? selectedReport.report_no : '汇总') + '_' + traceId + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      message.success({ content: '截图已导出，追溯号：' + traceId, key: 'exp' });
    } catch (e) {
      message.error({ content: '截图生成失败', key: 'exp' });
      console.error(e);
    }
  }
  function handleRestoreTrace() {
    if (!traceInput.trim()) return message.warning('请输入追溯号');
    api.get('/exports/' + traceInput.trim()).then(r => {
      if (r.code !== 0) return message.error(r.message || '追溯号不存在');
      const fc = r.data.filter_conditions || {};
      setFilters({ status: fc.status || '全部', risk_level: fc.risk_level || '全部', keyword: fc.keyword || '' });
      if (fc.report_id) loadDetail(fc.report_id);
      else loadReports();
      message.success('已还原 ' + r.data.exported_at + ' 导出时的筛选条件');
      setTraceRestoreModal(false); setTraceInput('');
    });
  }
  function updatePart(i, k, v) {
    const arr = [...newParts];
    arr[i] = { ...arr[i], [k]: v };
    setNewParts(arr);
  }

  const reportColumns = [
    { title: '报告编号', dataIndex: 'report_no', width: 150, fixed: 'left', render: (t, row) =>
      H('a', { onClick: () => loadDetail(row.id) }, H('strong', null, t)) },
    { title: '项目名称', dataIndex: 'project_name', width: 200 },
    { title: '盾构机号', dataIndex: 'shield_no', width: 100 },
    { title: '刀盘编号', dataIndex: 'cutter_disc_no', width: 110 },
    { title: '停机窗口', width: 240, render: (_, r) =>
      H('span', { style: { fontSize: 12 } }, r.shutdown_window_start, H('br'), '~ ' + r.shutdown_window_end) },
    { title: '风险等级', dataIndex: 'risk_level', width: 90, render: v => H(Tag, { color: RISK_COLORS[v] }, '风险' + v) },
    { title: '当前状态', dataIndex: 'current_status', width: 100, render: v => H(Tag, { color: STATUS_COLORS[v] }, v) },
    { title: '复核人', dataIndex: 'reviewer', width: 130 },
    { title: '更新时间', dataIndex: 'updated_at', width: 160 },
    { title: '操作', width: 170, fixed: 'right', render: (_, r) =>
      H(Space, null,
        H(Button, { size: 'small', onClick: () => loadDetail(r.id) }, '👁 查看'),
        H(Button, { size: 'small', type: 'primary', onClick: () => { setSelectedReport(r); loadDetail(r.id); setTimeout(() => setReviewModal(true), 400); } }, '✍️ 改判')
      )
    }
  ];

  const partsUpdateCols = [
    { title: '备件名称', dataIndex: 'part_name', render: (v, r, i) =>
      H(Input, { value: v, onChange: e => updatePart(i, 'part_name', e.target.value), placeholder: '必填' }) },
    { title: '型号规格', dataIndex: 'model_spec', render: (v, r, i) =>
      H(Input, { value: v, onChange: e => updatePart(i, 'model_spec', e.target.value), placeholder: '必填' }) },
    { title: '数量', dataIndex: 'quantity', width: 80, render: (v, r, i) =>
      H(InputNumber, { min: 1, value: v, onChange: n => updatePart(i, 'quantity', n), style: { width: '100%' } }) },
    { title: '到货状态', dataIndex: 'arrival_status', width: 150, render: (v, r, i) =>
      H(Select, { value: v, onChange: n => updatePart(i, 'arrival_status', n) },
        ARRIVAL_STATUS_OPTIONS.map(a => H(Option, { key: a, value: a }, a))) },
    { title: '预计到货', dataIndex: 'estimated_arrival', width: 140, render: (v, r, i) =>
      H(Input, { value: v, onChange: e => updatePart(i, 'estimated_arrival', e.target.value), placeholder: 'YYYY-MM-DD' }) },
    { title: '来源行号', dataIndex: 'source_line_no', width: 90, render: (v, r, i) =>
      H(InputNumber, { min: 1, value: v, onChange: n => updatePart(i, 'source_line_no', n), placeholder: '行号', style: { width: '100%' } }) },
    { title: '', width: 60, render: (_, r, i) =>
      H(Button, { size: 'small', danger: true, onClick: () => setNewParts(newParts.filter((_, j) => j !== i)) }, '删') }
  ];

  return H(ConfigProvider, {
    theme: { algorithm: theme.defaultAlgorithm, token: { colorPrimary: '#0a3d91' } }
  },
    H(Layout, { style: { minHeight: '100vh' } },
        H(Header, { style: { background: '#0a3d91', padding: '0 24px', display: 'flex', alignItems: 'center' } },
          H('span', { style: { fontSize: 24, color: '#fff' } }, '🛡'),
          H('span', { style: { color: '#fff', fontSize: 18, fontWeight: 'bold', marginLeft: 12 } }, '盾构刀盘报告复核系统'),
          H('span', { style: { color: '#91caff', marginLeft: 12, fontSize: 12 } }, '维保主管 · 阿敏工作台'),
          H('div', { style: { marginLeft: 'auto' } },
            H(Space, null,
              H(Button, { onClick: () => setTraceRestoreModal(true) }, '🔗 按追溯号还原'),
              H(Button, { type: 'primary', onClick: () => { if (!selectedReport) message.warning('请先选择一份报告'); else setExportModal(true); } }, '📤 导出复核说明'),
              H(Button, { onClick: () => { createReportForm.resetFields(); setCreateReportModal(true); } }, '➕ 新建报告')
            )
          )
        ),
        H(Layout, null,
          H(Sider, { width: 250, style: { background: '#fff', borderRight: '1px solid #e8e8e8' } },
            H('div', { style: { padding: 16, borderBottom: '1px solid #e8e8e8' } },
              H('div', { style: { color: '#888', fontSize: 12 } }, '最近导出追溯号'),
              H('div', { style: { marginTop: 8, color: '#d4380d', fontFamily: 'monospace', fontSize: 13, wordBreak: 'break-all' } }, lastTraceId || '（尚未导出）')
            ),
            H(Menu, { mode: 'inline', defaultSelectedKeys: ['list'], style: { border: 'none' } },
              H(Menu.Item, { key: 'list' }, '📋 报告列表'),
              H(Menu.Item, { key: 'history' },
                H(Space, { direction: 'vertical', size: 0, align: 'start' },
                  '🕓 审计历史',
                  H('span', { style: { fontSize: 11, color: '#999', paddingLeft: 4 } }, '每次改判留痕可查')
                )
              ),
              H(Menu.Item, { key: 'export' }, '📤 导出记录（' + exportList.length + '）')
            ),
            H('div', { style: { padding: 16, fontSize: 12, color: '#888', lineHeight: 1.8, position: 'absolute', bottom: 0, width: '100%', background: '#fafafa', boxSizing: 'border-box' } },
              H('div', null, H('strong', null, '📌 核心机制')),
              H('div', null, '✓ 备件版本化，不覆盖旧数据'),
              H('div', null, '✓ 每次改判写入审计表'),
              H('div', null, '✓ 结论变更自动快照'),
              H('div', null, '✓ 导出带追溯号，可还原')
            )
          ),
          H(Layout, { style: { padding: 16 } },
            H(Content, null,
              H(Card, { size: 'small', style: { marginBottom: 12 } },
                H(Space, { wrap: true },
                  H(Input, { allowClear: true, placeholder: '🔍 报告号/项目/盾构机号',
                    style: { width: 260 }, value: filters.keyword,
                    onChange: e => setFilters({ ...filters, keyword: e.target.value }), onPressEnter: loadReports }),
                  H(Select, { style: { width: 140 }, value: filters.status, onChange: v => setFilters({ ...filters, status: v }) },
                    ['全部', ...STATUS_OPTIONS].map(s => H(Option, { key: s, value: s }, '状态：' + s))),
                  H(Select, { style: { width: 120 }, value: filters.risk_level, onChange: v => setFilters({ ...filters, risk_level: v }) },
                    ['全部', '高', '中', '低'].map(s => H(Option, { key: s, value: s }, s === '全部' ? '风险全部' : '风险' + s))),
                  H(Button, { type: 'primary', onClick: loadReports }, '🔍 筛选'),
                  H(Button, { onClick: () => { setFilters({ status: '全部', risk_level: '全部', keyword: '' }); setTimeout(loadReports, 0); } }, '🔄 重置'),
                  H(Alert, { type: 'info', showIcon: true,
                    style: { border: 'none', padding: '0 8px', background: 'transparent' },
                    message: H('span', { style: { fontSize: 12 } }, '当前筛选条件会随导出一起保存，使用追溯号可一键还原') })
                )

            H('p', null, '任何时候把追溯号贴入下方，即可', H('strong', { style: { color: '#1890ff' } }, '一键还原到当时看到的同一批记录'), '。'),
            H('p', { style: { color: '#888' } }, '适用场景：沟通群里发了截图 → 对方要追溯号 → 贴回来立刻回到同样视图')
          ) }),
          H(Input, { size: 'large', value: traceInput, onChange: e => setTraceInput(e.target.value),
            placeholder: '粘贴追溯号，如：EXP-LY2ABC12DEF', allowClear: true, onPressEnter: handleRestoreTrace
          }),
          exportList.length > 0 && H('div', { style: { marginTop: 12 } },
            H('div', { style: { fontSize: 12, color: '#888', marginBottom: 4 } }, '或从最近导出中点击：'),
            H('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 6 } },
              ...exportList.slice(0, 8).map(e => H(Tag, { key: e.id,
                style: { cursor: 'pointer', padding: '4px 10px', fontSize: 12 }, color: 'blue',
                onClick: () => setTraceInput(e.trace_id)
              }, e.trace_id + H('span', { style: { color: '#999', marginLeft: 4, fontSize: 10 } }, (e.exported_at || '').substring(5, 16))))
            )
          )
        ),

        H(Modal, {
          title: '➕ 新建报告', open: createReportModal, onCancel: () => setCreateReportModal(false),
          onOk: handleCreateReport, okText: '创建报告', width: 520
        },
          H(Form, { form: createReportForm, layout: 'vertical' },
            H('div', { style: { display: 'flex', gap: 12 } },
              H(Form.Item, { label: '报告编号', name: 'report_no', rules: [{ required: true }], style: { flex: 1 } },
                H(Input, { placeholder: 'DP-FH-2026-003' })),
              H(Form.Item, { label: '刀盘编号', name: 'cutter_disc_no', style: { flex: 1 } },
                H(Input, { placeholder: '刀盘#0xx' }))
            ),
            H('div', { style: { display: 'flex', gap: 12 } },
              H(Form.Item, { label: '项目名称', name: 'project_name', rules: [{ required: true }], style: { flex: 1 } },
                H(Input, { placeholder: 'XX地铁X号线...' })),
              H(Form.Item, { label: '盾构机号', name: 'shield_no', rules: [{ required: true }], style: { flex: 1 } },
                H(Input, { placeholder: 'S-xxx' }))
            ),
            H('div', { style: { display: 'flex', gap: 12 } },
              H(Form.Item, { label: '停机窗口开始', name: 'shutdown_window_start', style: { flex: 1 } },
                H(Input, { placeholder: 'YYYY-MM-DD HH:mm' })),
              H(Form.Item, { label: '停机窗口结束', name: 'shutdown_window_end', style: { flex: 1 } },
                H(Input, { placeholder: 'YYYY-MM-DD HH:mm' }))
            ),
            H(Form.Item, { label: '备注', name: 'remark' },
              H(TextArea, { rows: 2, placeholder: '选填' }))
          )
        )
      )
    )
  ;
}

ReactDOM.createRoot(document.getElementById('root')).render(H(App));
</script>
</body>
</html>
