<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮力密度课堂器</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🌊 浮力密度课堂器</h1>
            <div class="header-actions">
                <button id="btn-review" class="btn btn-secondary">📋 复盘历史</button>
                <button id="btn-export" class="btn btn-secondary">📷 截图导出</button>
                <button id="btn-save-report" class="btn btn-primary">💾 保存报告</button>
            </div>
        </header>

        <main class="main-content">
            <aside class="left-panel">
                <div class="panel-section">
                    <h2>📦 材料库</h2>
                    <p class="hint">拖拽物体到水槽中进行实验</p>
                    <div id="material-library" class="material-library"></div>
                </div>

                <div class="panel-section">
                    <h2>🔬 数据录入</h2>
                    <div class="form-group">
                        <label>物体名称</label>
                        <input type="text" id="input-name" placeholder="如：铁块">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>体积 (cm³)</label>
                            <input type="number" id="input-volume" placeholder="必填" step="any">
                        </div>
                        <div class="form-group">
                            <label>质量 (g)</label>
                            <input type="number" id="input-mass" placeholder="必填" step="any">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>液体密度 (g/cm³)</label>
                            <input type="number" id="input-liquid-density" value="1.0" step="any">
                        </div>
                        <div class="form-group">
                            <label>排水量 (cm³)</label>
                            <input type="number" id="input-displacement" placeholder="可选，留空自动计算" step="any">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>操作者</label>
                        <input type="text" id="input-operator" placeholder="学生姓名">
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <textarea id="input-notes" rows="2" placeholder="实验记录..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button id="btn-add-material" class="btn btn-primary">➕ 添加到材料库</button>
                        <button id="btn-clear-form" class="btn btn-secondary">清空</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h2>⚠️ 数据校验</h2>
                    <div id="validation-result" class="validation-result">
                        <p class="hint">输入数据后自动校验</p>
                    </div>
                </div>
            </aside>

            <section class="center-panel">
                <div class="tank-container">
                    <div class="tank-info">
                        <div class="info-item">
                            <span class="label">液体密度</span>
                            <span id="info-liquid-density" class="value">1.0 g/cm³</span>
                        </div>
                        <div class="info-item">
                            <span class="label">当前水深</span>
                            <span id="info-water-level" class="value">50 cm</span>
                        </div>
                        <div class="info-item">
                            <span class="label">初始水位</span>
                            <span id="info-initial-level" class="value">50 cm</span>
                        </div>
                    </div>
                    <div id="tank" class="tank">
                        <div class="tank-water" id="tank-water">
                            <div class="water-surface"></div>
                        </div>
                        <div class="tank-scale">
                            <span style="top: 0%">100</span>
                            <span style="top: 25%">75</span>
                            <span style="top: 50%">50</span>
                            <span style="top: 75%">25</span>
                            <span style="top: 100%">0</span>
                        </div>
                        <div class="tank-objects" id="tank-objects"></div>
                        <div class="tank-label">水槽</div>
                    </div>
                </div>

                <div class="experiment-actions">
                    <button id="btn-clear-tank" class="btn btn-danger">🗑️ 清空水槽</button>
                    <button id="btn-undo" class="btn btn-secondary">↩️ 撤回上次</button>
                    <button id="btn-submit" class="btn btn-success">✅ 提交实验记录</button>
                </div>

                <div class="current-object-info" id="current-object-info">
                    <p class="hint">将物体拖入水槽查看详细数据</p>
                </div>
            </section>

            <aside class="right-panel">
                <div class="panel-section">
                    <h2>📊 密度-浮力关系图</h2>
                    <div class="chart-container">
                        <canvas id="density-chart"></canvas>
                    </div>
                </div>

                <div class="panel-section">
                    <h2>📈 实验记录</h2>
                    <div class="record-tabs">
                        <button class="tab-btn active" data-tab="normal">正常 (<span id="count-normal">0</span>)</button>
                        <button class="tab-btn" data-tab="anomaly">异常 (<span id="count-anomaly">0</span>)</button>
                        <button class="tab-btn" data-tab="all">全部 (<span id="count-all">0</span>)</button>
                    </div>
                    <div id="records-list" class="records-list"></div>
                </div>
            </aside>
        </main>
    </div>

    <!-- 复盘模态框 -->
    <div id="review-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 历史实验复盘</h2>
                <button class="modal-close" id="close-review">&times;</button>
            </div>
            <div class="modal-body">
                <div id="review-list" class="review-list"></div>
            </div>
        </div>
    </div>

    <!-- 异常详情模态框 -->
    <div id="anomaly-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚠️ 异常记录详情</h2>
                <button class="modal-close" id="close-anomaly">&times;</button>
            </div>
            <div class="modal-body">
                <div id="anomaly-detail"></div>
            </div>
        </div>
    </div>

    <!-- 报告预览模态框 -->
    <div id="report-modal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>📄 实验报告预览</h2>
                <button class="modal-close" id="close-report">&times;</button>
            </div>
            <div class="modal-body">
                <div id="report-content" class="report-content"></div>
            </div>
            <div class="modal-footer">
                <button id="btn-download-report" class="btn btn-primary">📥 下载报告</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <script src="js/physics.js?v=2"></script>
    <script src="js/storage.js?v=2"></script>
    <script src="js/chart.js?v=2"></script>
    <script src="js/report.js?v=2"></script>
    <script src="js/interaction.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
