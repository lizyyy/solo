openapi: 3.0.0
info:
  title: 测试 API
  description: 用于测试错误体一致性的示例 API
  version: 1.0.0
paths:
  /users:
    get:
      summary: 获取用户列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: 请求错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 错误信息
                  code:
                    type: string
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 错误信息
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      summary: 创建用户
      responses:
        '201':
          description: 创建成功
        '400':
          description: 请求错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: string
        '409':
          description: 冲突
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
        '500':
          description: 服务器错误
  /users/{id}:
    get:
      summary: 获取单个用户
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  timestamp:
                    type: string
    delete:
      summary: 删除用户
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 删除成功
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
  /orders:
    post:
      summary: 创建订单
      responses:
        '201':
          description: 创建成功
        '400':
          description: 请求错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                  field:
                    type: string
        '402':
          description: 支付要求
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
