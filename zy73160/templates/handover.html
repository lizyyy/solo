<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接班指引 - 矩阵分解批量验算</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>接班指引</h1>
            <nav class="nav">
                <a href="/" class="nav-link">返回系统</a>
            </nav>
        </header>

        <main class="main">
            <div class="handover-container">
                <div class="handover-section">
                    <h2>📍 样例在哪</h2>
                    <div class="card-grid" id="samples-grid">
                        <div class="loading">加载中...</div>
                    </div>
                    <a href="/#/problems" class="btn btn-primary">查看全部题目 →</a>
                </div>

                <div class="handover-section">
                    <h2>⚠️ 异常在哪</h2>
                    <div class="card-grid" id="anomalies-grid">
                        <div class="loading">加载中...</div>
                    </div>
                    <a href="/#/anomalies" class="btn btn-warning">处理异常记录 →</a>
                </div>

                <div class="handover-section">
                    <h2>📊 上次任务结果</h2>
                    <div id="last-task-card">
                        <div class="loading">加载中...</div>
                    </div>
                    <div class="btn-group">
                        <a href="/#/tasks" class="btn btn-primary">查看任务列表 →</a>
                        <button id="btn-export-last" class="btn btn-success">导出结果</button>
                    </div>
                </div>

                <div class="handover-section">
                    <h2>💾 结果怎么导出</h2>
                    <div class="info-card">
                        <div class="info-item">
                            <span class="info-label">API 地址</span>
                            <code class="info-value">GET /api/export/{task_id}</code>
                        </div>
                        <div class="info-item">
                            <span class="info-label">当前参数版本</span>
                            <code id="params-version" class="info-value">--</code>
                        </div>
                        <div class="info-item">
                            <span class="info-label">导出格式</span>
                            <span class="info-value">JSON（含所有验算结果和人工改判记录）</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Markdown 报告</span>
                            <span class="info-value">任务完成后自动生成，可在任务详情中查看</span>
                        </div>
                    </div>
                </div>

                <div class="handover-section">
                    <h2>🔗 快速入口</h2>
                    <div class="quick-links">
                        <a href="/#/problems" class="quick-link">
                            <div class="quick-link-icon">📋</div>
                            <div class="quick-link-text">题目清单</div>
                        </a>
                        <a href="/#/anomalies" class="quick-link">
                            <div class="quick-link-icon">⚠️</div>
                            <div class="quick-link-text">异常记录</div>
                        </a>
                        <a href="/#/tasks" class="quick-link">
                            <div class="quick-link-icon">📊</div>
                            <div class="quick-link-text">验算任务</div>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '';

        async function loadHandoverInfo() {
            try {
                const resp = await fetch(API_BASE + '/api/handover/info');
                const data = await resp.json();
                renderSamples(data.samples);
                renderAnomalies(data.anomalies);
                renderLastTask(data.last_task);
                document.getElementById('params-version').textContent = data.params_version;

                window.lastTaskId = data.last_task ? data.last_task.id : null;
            } catch (e) {
                console.error('加载失败:', e);
            }
        }

        function renderSamples(samples) {
            const grid = document.getElementById('samples-grid');
            if (!samples || samples.length === 0) {
                grid.innerHTML = '<div class="empty">暂无样例数据</div>';
                return;
            }
            grid.innerHTML = samples.map(s => `
                <div class="card">
                    <div class="card-header">
                        <span class="badge badge-info">${s.problem_id}</span>
                        <span class="badge ${getStatusBadge(s.status)}">${getStatusText(s.status)}</span>
                    </div>
                    <h3>${s.title}</h3>
                    <p>历史版本: ${s.version_count} 个</p>
                    <a href="/#/problems" class="card-link">查看详情 →</a>
                </div>
            `).join('');
        }

        function renderAnomalies(anomalies) {
            const grid = document.getElementById('anomalies-grid');
            if (!anomalies || anomalies.length === 0) {
                grid.innerHTML = '<div class="empty">✅ 暂无未解决异常</div>';
                return;
            }
            grid.innerHTML = anomalies.slice(0, 3).map(a => `
                <div class="card card-danger">
                    <div class="card-header">
                        <span class="badge badge-danger">${a.anomaly_type}</span>
                    </div>
                    <h3>${a.problem_id} - ${a.title}</h3>
                    <p>${a.description}</p>
                    <small>检测于 ${new Date(a.detected_at).toLocaleString()}</small>
                </div>
            `).join('');
        }

        function renderLastTask(task) {
            const card = document.getElementById('last-task-card');
            if (!task) {
                card.innerHTML = '<div class="empty">暂无已完成任务</div>';
                return;
            }
            const s = task.summary || {};
            card.innerHTML = `
                <div class="info-card">
                    <div class="info-item">
                        <span class="info-label">任务名称</span>
                        <span class="info-value">${task.name}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">任务ID</span>
                        <span class="info-value">${task.task_id}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">参数版本</span>
                        <span class="info-value">${task.params_version}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">完成时间</span>
                        <span class="info-value">${new Date(task.completed_at).toLocaleString()}</span>
                    </div>
                    <div class="stats-grid">
                        <div class="stat">
                            <div class="stat-value">${s.total || 0}</div>
                            <div class="stat-label">总题目</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value stat-pass">${s.passed || 0}</div>
                            <div class="stat-label">通过</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value stat-anomaly">${s.anomalies || 0}</div>
                            <div class="stat-label">异常</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value stat-pending">${s.pending_manual || 0}</div>
                            <div class="stat-label">待人工</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getStatusBadge(status) {
            const map = {
                'pending': 'badge-secondary',
                'single_covered': 'badge-warning',
                'double_covered': 'badge-success'
            };
            return map[status] || 'badge-secondary';
        }

        function getStatusText(status) {
            const map = {
                'pending': '待处理',
                'single_covered': '单答案覆盖',
                'double_covered': '双答案覆盖'
            };
            return map[status] || status;
        }

        document.getElementById('btn-export-last')?.addEventListener('click', function() {
            if (window.lastTaskId) {
                window.open(`/api/export/${window.lastTaskId}`, '_blank');
            } else {
                alert('暂无已完成任务可导出');
            }
        });

        loadHandoverInfo();
    </script>
</body>
</html>
