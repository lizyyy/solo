spring:
  application:
    name: multi-tenant-rotation-api
  datasource:
    url: jdbc:h2:mem:rotationdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.encryption.rotation: DEBUG
