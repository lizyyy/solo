[project]
name = "continuity-inspector"
version = "1.0.0"
description = "镜头连续性巡检员 - 短剧后期统筹自动化工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
continuity-inspector = "continuity_inspector.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuity_inspector"]
