<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月子中心母婴耗材管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 40px; }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .nav { display: flex; gap: 10px; padding: 20px 40px; background: white; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
        .nav button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; background: #f0f2f5; transition: all 0.3s; font-size: 14px; }
        .nav button.active { background: #667eea; color: white; }
        .nav button:hover { background: #e0e0e0; }
        .nav button.active:hover { background: #5a6fd6; }
        .container { padding: 30px 40px; }
        .page { display: none; }
        .page.active { display: block; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h2 { font-size: 22px; color: #333; }
        .btn-primary { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; background: #667eea; color: white; font-size: 14px; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-success { background: #52c41a; color: white; }
        .btn-danger { background: #ff4d4f; color: white; }
        .btn-small { padding: 6px 12px; font-size: 12px; }
        
        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .room-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .room-card.occupied { border-left: 4px solid #52c41a; }
        .room-card.empty { border-left: 4px solid #d9d9d9; opacity: 0.9; }
        .room-number { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .room-type { color: #666; font-size: 14px; margin-bottom: 12px; }
        .baby-info { background: #f6ffed; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .baby-name { font-weight: 600; color: #389e0d; }
        .room-actions { display: flex; gap: 8px; }
        .room-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
        
        .table-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #fafafa; font-weight: 600; color: #333; }
        tr:hover { background: #fafafa; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-block; }
        .status-pending { background: #fff7e6; color: #fa8c16; }
        .status-approved { background: #f6ffed; color: #52c41a; }
        .status-rejected { background: #fff1f0; color: #f5222d; }
        .type-package { background: #e6f7ff; color: #1890ff; }
        .type-extra { background: #fff0f6; color: #eb2f96; }
        
        .warning-card { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .warning-card h3 { margin-bottom: 10px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        .inventory-card { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .inventory-card.low-stock { border: 2px solid #ff4d4f; }
        .inv-name { font-weight: 600; margin-bottom: 8px; }
        .inv-category { color: #888; font-size: 12px; margin-bottom: 12px; }
        .inv-stock { display: flex; justify-content: space-between; align-items: center; }
        .stock-number { font-size: 20px; font-weight: bold; color: #52c41a; }
        .stock-number.low { color: #ff4d4f; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
        .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .btn-cancel { background: #f0f0f0; }
        
        .bill-card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .bill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #f0f0f0; }
        .bill-total { font-size: 28px; font-weight: bold; color: #667eea; }
        .bill-breakdown { margin: 16px 0; }
        .bill-row { display: flex; justify-content: space-between; padding: 8px 0; }
        .bill-row.package { color: #1890ff; }
        .bill-row.extra { color: #eb2f96; }
        
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; margin-bottom: 8px; }
        .stat-label { color: #666; font-size: 14px; }
        .stat-1 .stat-number { color: #667eea; }
        .stat-2 .stat-number { color: #52c41a; }
        .stat-3 .stat-number { color: #fa8c16; }
        .stat-4 .stat-number { color: #f5222d; }

        .action-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 4px; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 8px; color: white; z-index: 2000; display: none; max-width: 400px; }
        .toast.success { background: #52c41a; }
        .toast.error { background: #f5222d; }
        .toast.active { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .empty-state { background: white; padding: 60px 20px; border-radius: 12px; text-align: center; color: #999; }
        .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
        
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 4px; }
        .tag-blue { background: #e6f7ff; color: #1890ff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👶 月子中心母婴耗材管理系统</h1>
        <p>房间管理 · 耗材领用 · 补领审批 · 退房结算</p>
    </div>
    
    <div class="nav">
        <button class="active" onclick="showPage('rooms')">🏠 房间视图</button>
        <button onclick="showPage('consumptions')">📋 领用流水</button>
        <button onclick="showPage('inventory')">📦 库存管理</button>
        <button onclick="showPage('packages')">🎁 套餐管理</button>
        <button onclick="showPage('babies')">👶 宝宝管理</button>
        <button onclick="showPage('bills')">💰 账单管理</button>
    </div>
    
    <div class="container">
        <div id="rooms" class="page active">
            <div class="page-header">
                <h2>房间状态</h2>
                <button class="btn-primary" onclick="openRoomModal()">+ 新增房间</button>
            </div>
            <div class="stats-bar">
                <div class="stat-card stat-1">
                    <div class="stat-number" id="total-rooms">0</div>
                    <div class="stat-label">总房间数</div>
                </div>
                <div class="stat-card stat-2">
                    <div class="stat-number" id="occupied-rooms">0</div>
                    <div class="stat-label">已入住</div>
                </div>
                <div class="stat-card stat-3">
                    <div class="stat-number" id="pending-approvals">0</div>
                    <div class="stat-label">待审批</div>
                </div>
                <div class="stat-card stat-4">
                    <div class="stat-number" id="low-stock-items">0</div>
                    <div class="stat-label">库存预警</div>
                </div>
            </div>
            <div class="room-grid" id="room-list"></div>
        </div>
        
        <div id="consumptions" class="page">
            <div class="page-header">
                <h2>领用流水记录</h2>
                <button class="btn-primary" onclick="openConsumptionModal()">+ 新增领用</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>房间</th>
                            <th>宝宝</th>
                            <th>耗材</th>
                            <th>数量</th>
                            <th>类型</th>
                            <th>补领</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="consumption-list"></tbody>
                </table>
            </div>
        </div>
        
        <div id="inventory" class="page">
            <div class="page-header">
                <h2>库存管理</h2>
                <button class="btn-primary" onclick="openInventoryModal()">+ 新增耗材</button>
            </div>
            <div id="warning-section"></div>
            <h3 style="margin: 20px 0 16px;">全部库存</h3>
            <div class="inventory-grid" id="inventory-list"></div>
        </div>
        
        <div id="packages" class="page">
            <div class="page-header">
                <h2>护理套餐管理</h2>
                <button class="btn-primary" onclick="openPackageModal()">+ 新增套餐</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>套餐名称</th>
                            <th>描述</th>
                            <th>价格</th>
                            <th>周期</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="package-list"></tbody>
                </table>
            </div>
        </div>
        
        <div id="babies" class="page">
            <div class="page-header">
                <h2>宝宝管理</h2>
                <button class="btn-primary" onclick="openBabyModal()">+ 新增入住</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>性别</th>
                            <th>出生日期</th>
                            <th>房间</th>
                            <th>套餐</th>
                            <th>入住日期</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="baby-list"></tbody>
                </table>
            </div>
        </div>
        
        <div id="bills" class="page">
            <div class="page-header">
                <h2>退房账单</h2>
            </div>
            <div id="bill-list"></div>
        </div>
    </div>
    
    <div class="modal" id="room-modal">
        <div class="modal-content">
            <div class="modal-title" id="room-modal-title">新增房间</div>
            <input type="hidden" id="edit-room-id">
            <div class="form-group">
                <label>房间号</label>
                <input type="text" id="room-number" placeholder="如：201">
            </div>
            <div class="form-group">
                <label>房间类型</label>
                <select id="room-type">
                    <option value="标准间">标准间</option>
                    <option value="VIP套房">VIP套房</option>
                    <option value="豪华套房">豪华套房</option>
                </select>
            </div>
            <div class="form-group">
                <label>状态</label>
                <select id="room-status">
                    <option value="empty">空房</option>
                    <option value="occupied">已入住</option>
                    <option value="maintenance">维护中</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('room-modal')">取消</button>
                <button class="btn-primary" onclick="saveRoom()">保存</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="consumption-modal">
        <div class="modal-content">
            <div class="modal-title">新增耗材领用</div>
            <div class="form-group">
                <label>选择宝宝</label>
                <select id="select-baby"></select>
            </div>
            <div class="form-group">
                <label>选择耗材</label>
                <select id="select-inventory"></select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>领用数量</label>
                    <input type="number" id="input-quantity" value="1" min="1">
                </div>
                <div class="form-group">
                    <label>领用类型</label>
                    <select id="select-type">
                        <option value="package">套餐内</option>
                        <option value="extra">套餐外（额外收费）</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>是否补领</label>
                    <select id="select-supplement">
                        <option value="0">否（直接扣库存）</option>
                        <option value="1">是（需审批）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>操作人</label>
                    <input type="text" id="input-operator" placeholder="护士长姓名">
                </div>
            </div>
            <div class="form-group">
                <label>请求编号（防重复）</label>
                <input type="text" id="input-request-id" placeholder="如：REQ-007">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('consumption-modal')">取消</button>
                <button class="btn-primary" onclick="submitConsumption()">确认提交</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="inventory-modal">
        <div class="modal-content">
            <div class="modal-title" id="inventory-modal-title">新增耗材</div>
            <input type="hidden" id="edit-inventory-id">
            <div class="form-group">
                <label>耗材名称</label>
                <input type="text" id="inv-name" placeholder="如：婴幼儿配方奶粉">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>分类</label>
                    <select id="inv-category">
                        <option value="食品">食品</option>
                        <option value="日用品">日用品</option>
                        <option value="护理品">护理品</option>
                        <option value="产妇用品">产妇用品</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>单位</label>
                    <input type="text" id="inv-unit" placeholder="如：罐、包、支">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>单价（元）</label>
                    <input type="number" id="inv-price" step="0.01">
                </div>
                <div class="form-group">
                    <label>库存数量</label>
                    <input type="number" id="inv-stock" value="0">
                </div>
            </div>
            <div class="form-group">
                <label>预警阈值</label>
                <input type="number" id="inv-warning" value="10">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('inventory-modal')">取消</button>
                <button class="btn-primary" onclick="saveInventory()">保存</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="package-modal">
        <div class="modal-content">
            <div class="modal-title" id="package-modal-title">新增套餐</div>
            <input type="hidden" id="edit-package-id">
            <div class="form-group">
                <label>套餐名称</label>
                <input type="text" id="pkg-name" placeholder="如：基础护理套餐">
            </div>
            <div class="form-group">
                <label>套餐描述</label>
                <textarea id="pkg-desc" rows="3" placeholder="套餐包含内容..."></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>价格（元）</label>
                    <input type="number" id="pkg-price" step="0.01">
                </div>
                <div class="form-group">
                    <label>周期（天）</label>
                    <input type="number" id="pkg-duration" value="28">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('package-modal')">取消</button>
                <button class="btn-primary" onclick="savePackage()">保存</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="baby-modal">
        <div class="modal-content">
            <div class="modal-title" id="baby-modal-title">宝宝入住登记</div>
            <input type="hidden" id="edit-baby-id">
            <div class="form-group">
                <label>宝宝姓名</label>
                <input type="text" id="baby-name" placeholder="请输入姓名">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>性别</label>
                    <select id="baby-gender">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>出生日期</label>
                    <input type="date" id="baby-birth">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>分配房间</label>
                    <select id="baby-room"></select>
                </div>
                <div class="form-group">
                    <label>选择套餐</label>
                    <select id="baby-package"></select>
                </div>
            </div>
            <div class="form-group">
                <label>入住日期</label>
                <input type="date" id="baby-checkin">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('baby-modal')">取消</button>
                <button class="btn-primary" onclick="saveBaby()">保存</button>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        let rooms = [];
        let babies = [];
        let inventory = [];
        let packages = [];
        let consumptions = [];
        let bills = [];
        
        async function loadData() {
            const [r, b, i, p, c, bl] = await Promise.all([
                fetch('/api/rooms').then(res => res.json()),
                fetch('/api/babies').then(res => res.json()),
                fetch('/api/inventory').then(res => res.json()),
                fetch('/api/packages').then(res => res.json()),
                fetch('/api/consumptions').then(res => res.json()),
                fetch('/api/bills').then(res => res.json())
            ]);
            rooms = r;
            babies = b;
            inventory = i;
            packages = p;
            consumptions = c;
            bills = bl;
            
            renderRooms();
            renderConsumptions();
            renderInventory();
            renderPackages();
            renderBabies();
            renderBills();
            renderStats();
        }
        
        function renderStats() {
            document.getElementById('total-rooms').textContent = rooms.length;
            document.getElementById('occupied-rooms').textContent = rooms.filter(r => r.status === 'occupied').length;
            document.getElementById('pending-approvals').textContent = consumptions.filter(c => c.approval_status === 'pending').length;
            document.getElementById('low-stock-items').textContent = inventory.filter(i => i.stock_quantity <= i.warning_threshold).length;
        }
        
        function renderRooms() {
            const container = document.getElementById('room-list');
            container.innerHTML = rooms.map(room => {
                const baby = babies.find(b => b.room_id === room.id && b.status === 'in_house');
                const pkg = baby ? packages.find(p => p.id === baby.package_id) : null;
                return `
                <div class="room-card ${room.status}">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div>
                            <div class="room-number">${room.room_number}</div>
                            <div class="room-type">${room.room_type} <span class="tag tag-blue">${room.status === 'occupied' ? '已入住' : room.status === 'empty' ? '空房' : '维护中'}</span></div>
                        </div>
                        <button class="action-btn" onclick="editRoom('${room.id}')">✏️</button>
                    </div>
                    ${baby ? `
                        <div class="baby-info">
                            <div class="baby-name">👶 ${baby.name}</div>
                            <div style="font-size: 12px; margin-top: 4px;">
                                ${pkg?.name || ''}
                            </div>
                            <div style="font-size: 11px; color: #666; margin-top: 4px;">
                                入住：${baby.checkin_date}
                            </div>
                        </div>
                        <div class="room-actions">
                            <button class="btn-primary" onclick="openRoomConsumption('${room.id}')">领用耗材</button>
                            <button class="btn-success" onclick="checkoutBaby('${baby.id}')">退房结算</button>
                        </div>
                    ` : '<div style="color: #999; font-size: 14px; margin-top: 20px;">空房</div>'}
                </div>
            `}).join('');
        }
        
        function renderConsumptions() {
            const container = document.getElementById('consumption-list');
            if (consumptions.length === 0) {
                container.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 40px; color: #999;">暂无领用记录</td></tr>';
                return;
            }
            container.innerHTML = consumptions.map(c => `
                <tr>
                    <td>${new Date(c.created_at).toLocaleString()}</td>
                    <td>${c.room_number || '-'}</td>
                    <td>${c.baby_name || '-'}</td>
                    <td>${c.item_name}</td>
                    <td>${c.quantity}${c.unit}</td>
                    <td><span class="status-badge type-${c.type}">${c.type === 'package' ? '套餐内' : '套餐外'}</span></td>
                    <td>${c.is_supplement ? '是' : '否'}</td>
                    <td><span class="status-badge status-${c.approval_status}">${c.approval_status === 'pending' ? '待审批' : c.approval_status === 'approved' ? '已通过' : '已拒绝'}</span></td>
                    <td>
                        ${c.approval_status === 'pending' ? `
                            <button class="action-btn btn-success" onclick="approveConsumption('${c.id}')">通过</button>
                            <button class="action-btn btn-danger" onclick="rejectConsumption('${c.id}')">拒绝</button>
                        ` : '-'}
                    </td>
                </tr>
            `).join('');
        }
        
        function renderInventory() {
            const warnings = inventory.filter(i => i.stock_quantity <= i.warning_threshold);
            const warningSection = document.getElementById('warning-section');
            
            if (warnings.length > 0) {
                warningSection.innerHTML = `
                    <div class="warning-card">
                        <h3>⚠️ 库存预警（${warnings.length}项）</h3>
                        <p>以下耗材库存不足，请及时补货：${warnings.map(w => w.name).join('、')}</p>
                    </div>
                `;
            } else {
                warningSection.innerHTML = `
                    <div style="background: #f6ffed; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                        <h3>✅ 库存正常</h3>
                        <p>所有耗材库存充足</p>
                    </div>
                `;
            }
            
            const container = document.getElementById('inventory-list');
            container.innerHTML = inventory.map(item => {
                const isLow = item.stock_quantity <= item.warning_threshold;
                return `
                    <div class="inventory-card ${isLow ? 'low-stock' : ''}">
                        <div style="display: flex; justify-content: space-between; align-items: start;">
                            <div class="inv-name">${item.name}</div>
                            <button class="action-btn" onclick="editInventory('${item.id}')">✏️</button>
                        </div>
                        <div class="inv-category">${item.category} · ${item.unit} · ¥${item.unit_price}/${item.unit}</div>
                        <div class="inv-stock">
                            <span>库存</span>
                            <span class="stock-number ${isLow ? 'low' : ''}">${item.stock_quantity}${item.unit}</span>
                        </div>
                        <div style="margin-top: 8px; font-size: 12px; color: #666;">
                            预警线: ${item.warning_threshold}${item.unit}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderPackages() {
            const container = document.getElementById('package-list');
            if (packages.length === 0) {
                container.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: #999;">暂无套餐</td></tr>';
                return;
            }
            container.innerHTML = packages.map(p => `
                <tr>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.description || '-'}</td>
                    <td>¥${p.price.toFixed(2)}</td>
                    <td>${p.duration_days}天</td>
                    <td>
                        <button class="action-btn" onclick="editPackage('${p.id}')">编辑</button>
                        <button class="action-btn btn-danger" onclick="deletePackage('${p.id}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function renderBabies() {
            const container = document.getElementById('baby-list');
            if (babies.length === 0) {
                container.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #999;">暂无宝宝信息</td></tr>';
                return;
            }
            container.innerHTML = babies.map(baby => {
                const room = rooms.find(r => r.id === baby.room_id);
                const pkg = packages.find(p => p.id === baby.package_id);
                return `
                <tr>
                    <td><strong>${baby.name}</strong></td>
                    <td>${baby.gender || '-'}</td>
                    <td>${baby.birth_date || '-'}</td>
                    <td>${room?.room_number || '-'}</td>
                    <td>${pkg?.name || '-'}</td>
                    <td>${baby.checkin_date || '-'}</td>
                    <td><span class="status-badge ${baby.status === 'in_house' ? 'status-approved' : 'status-rejected'}">${baby.status === 'in_house' ? '入住中' : '已退房'}</span></td>
                    <td>
                        ${baby.status === 'in_house' ? `
                            <button class="action-btn" onclick="editBaby('${baby.id}')">编辑</button>
                            <button class="action-btn btn-success" onclick="checkoutBaby('${baby.id}')">退房</button>
                        ` : '-'}
                    </td>
                </tr>
            `}).join('');
        }
        
        function renderBills() {
            const container = document.getElementById('bill-list');
            if (bills.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📄</div><div>暂无账单记录</div></div>';
                return;
            }
            container.innerHTML = bills.map(bill => {
                const baby = babies.find(b => b.id === bill.baby_id);
                const room = rooms.find(r => r.id === bill.room_id);
                return `
                <div class="bill-card">
                    <div class="bill-header">
                        <div>
                            <h3>${baby?.name || '-'} - ${room?.room_number || ''}房</h3>
                            <div style="color: #666; font-size: 14px; margin-top: 4px;">退房时间: ${new Date(bill.checkout_date).toLocaleString()}</div>
                        </div>
                        <div class="bill-total">¥${bill.total_amount.toFixed(2)}</div>
                    </div>
                    <div class="bill-breakdown">
                        <div class="bill-row package">
                            <span>套餐费用</span>
                            <span>¥${bill.package_price.toFixed(2)}</span>
                        </div>
                        <div class="bill-row extra">
                            <span>额外耗材费用</span>
                            <span>¥${bill.extra_consumption_total.toFixed(2)}</span>
                        </div>
                    </div>
                    <button class="btn-primary" style="width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 16px;" onclick="exportBill('${bill.id}')">📄 导出账单明细</button>
                </div>
            `}).join('');
        }
        
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(page).classList.add('active');
            event.target.classList.add('active');
        }
        
        function openRoomModal() {
            document.getElementById('room-modal-title').textContent = '新增房间';
            document.getElementById('edit-room-id').value = '';
            document.getElementById('room-number').value = '';
            document.getElementById('room-type').value = '标准间';
            document.getElementById('room-status').value = 'empty';
            document.getElementById('room-modal').classList.add('active');
        }
        
        function editRoom(id) {
            const room = rooms.find(r => r.id === id);
            if (!room) return;
            document.getElementById('room-modal-title').textContent = '编辑房间';
            document.getElementById('edit-room-id').value = id;
            document.getElementById('room-number').value = room.room_number;
            document.getElementById('room-type').value = room.room_type;
            document.getElementById('room-status').value = room.status;
            document.getElementById('room-modal').classList.add('active');
        }
        
        async function saveRoom() {
            const id = document.getElementById('edit-room-id').value;
            const data = {
                room_number: document.getElementById('room-number').value,
                room_type: document.getElementById('room-type').value,
                status: document.getElementById('room-status').value
            };
            
            if (!data.room_number) {
                showToast('请输入房间号', 'error');
                return;
            }
            
            const url = id ? `/api/rooms/${id}` : '/api/rooms';
            const method = id ? 'PUT' : 'POST';
            
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (res.ok) {
                showToast(id ? '房间更新成功' : '房间创建成功', 'success');
                closeModal('room-modal');
                loadData();
            } else {
                const result = await res.json();
                showToast(result.error || '操作失败', 'error');
            }
        }
        
        function openConsumptionModal() {
            const modal = document.getElementById('consumption-modal');
            const selectBaby = document.getElementById('select-baby');
            const selectInv = document.getElementById('select-inventory');
            
            selectBaby.innerHTML = babies.filter(b => b.status === 'in_house').map(b => {
                const room = rooms.find(r => r.id === b.room_id);
                return `<option value="${b.id}">${b.name} - ${room?.room_number || ''}房</option>`;
            }).join('');
            
            selectInv.innerHTML = inventory.map(i => 
                `<option value="${i.id}">${i.name} (库存:${i.stock_quantity}${i.unit}, ¥${i.unit_price}/${i.unit})</option>`
            ).join('');
            
            document.getElementById('input-request-id').value = 'REQ-' + Date.now().toString().slice(-6);
            document.getElementById('input-quantity').value = 1;
            modal.classList.add('active');
        }
        
        function openRoomConsumption(roomId) {
            openConsumptionModal();
            const baby = babies.find(b => b.room_id === roomId && b.status === 'in_house');
            if (baby) {
                document.getElementById('select-baby').value = baby.id;
            }
        }
        
        async function submitConsumption() {
            const data = {
                baby_id: document.getElementById('select-baby').value,
                inventory_id: document.getElementById('select-inventory').value,
                quantity: parseInt(document.getElementById('input-quantity').value),
                type: document.getElementById('select-type').value,
                is_supplement: parseInt(document.getElementById('select-supplement').value),
                request_id: document.getElementById('input-request-id').value,
                created_by: document.getElementById('input-operator').value || '系统'
            };
            
            if (data.quantity < 1) {
                showToast('领用数量必须大于0', 'error');
                return;
            }
            
            const res = await fetch('/api/consumptions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            const result = await res.json();
            if (res.ok) {
                showToast('领用记录创建成功', 'success');
                closeModal('consumption-modal');
                loadData();
            } else {
                showToast(result.error || '创建失败', 'error');
            }
        }
        
        async function approveConsumption(id) {
            const res = await fetch(`/api/consumptions/${id}/approve`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approved_by: '管理员' })
            });
            
            if (res.ok) {
                showToast('审批通过', 'success');
                loadData();
            } else {
                const result = await res.json();
                showToast(result.error || '审批失败', 'error');
            }
        }
        
        async function rejectConsumption(id) {
            if (!confirm('确定拒绝该申请吗？')) return;
            const res = await fetch(`/api/consumptions/${id}/reject`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approved_by: '管理员' })
            });
            
            if (res.ok) {
                showToast('已拒绝', 'success');
                loadData();
            } else {
                showToast('操作失败', 'error');
            }
        }
        
        function openInventoryModal() {
            document.getElementById('inventory-modal-title').textContent = '新增耗材';
            document.getElementById('edit-inventory-id').value = '';
            document.getElementById('inv-name').value = '';
            document.getElementById('inv-category').value = '日用品';
            document.getElementById('inv-unit').value = '';
            document.getElementById('inv-price').value = '';
            document.getElementById('inv-stock').value = '0';
            document.getElementById('inv-warning').value = '10';
            document.getElementById('inventory-modal').classList.add('active');
        }
        
        function editInventory(id) {
            const item = inventory.find(i => i.id === id);
            if (!item) return;
            document.getElementById('inventory-modal-title').textContent = '编辑耗材';
            document.getElementById('edit-inventory-id').value = id;
            document.getElementById('inv-name').value = item.name;
            document.getElementById('inv-category').value = item.category;
            document.getElementById('inv-unit').value = item.unit;
            document.getElementById('inv-price').value = item.unit_price;
            document.getElementById('inv-stock').value = item.stock_quantity;
            document.getElementById('inv-warning').value = item.warning_threshold;
            document.getElementById('inventory-modal').classList.add('active');
        }
        
        async function saveInventory() {
            const id = document.getElementById('edit-inventory-id').value;
            const data = {
                name: document.getElementById('inv-name').value,
                category: document.getElementById('inv-category').value,
                unit: document.getElementById('inv-unit').value,
                unit_price: parseFloat(document.getElementById('inv-price').value),
                stock_quantity: parseInt(document.getElementById('inv-stock').value),
                warning_threshold: parseInt(document.getElementById('inv-warning').value)
            };
            
            if (!data.name || !data.unit || isNaN(data.unit_price)) {
                showToast('请填写完整信息', 'error');
                return;
            }
            
            const url = id ? `/api/inventory/${id}` : '/api/inventory';
            const method = id ? 'PUT' : 'POST';
            
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (res.ok) {
                showToast(id ? '耗材更新成功' : '耗材创建成功', 'success');
                closeModal('inventory-modal');
                loadData();
            } else {
                const result = await res.json();
                showToast(result.error || '操作失败', 'error');
            }
        }
        
        function openPackageModal() {
            document.getElementById('package-modal-title').textContent = '新增套餐';
            document.getElementById('edit-package-id').value = '';
            document.getElementById('pkg-name').value = '';
            document.getElementById('pkg-desc').value = '';
            document.getElementById('pkg-price').value = '';
            document.getElementById('pkg-duration').value = '28';
            document.getElementById('package-modal').classList.add('active');
        }
        
        function editPackage(id) {
            const pkg = packages.find(p => p.id === id);
            if (!pkg) return;
            document.getElementById('package-modal-title').textContent = '编辑套餐';
            document.getElementById('edit-package-id').value = id;
            document.getElementById('pkg-name').value = pkg.name;
            document.getElementById('pkg-desc').value = pkg.description || '';
            document.getElementById('pkg-price').value = pkg.price;
            document.getElementById('pkg-duration').value = pkg.duration_days;
            document.getElementById('package-modal').classList.add('active');
        }
        
        async function savePackage() {
            const id = document.getElementById('edit-package-id').value;
            const data = {
                name: document.getElementById('pkg-name').value,
                description: document.getElementById('pkg-desc').value,
                price: parseFloat(document.getElementById('pkg-price').value),
                duration_days: parseInt(document.getElementById('pkg-duration').value)
            };
            
            if (!data.name || isNaN(data.price) || isNaN(data.duration_days)) {
                showToast('请填写完整信息', 'error');
                return;
            }
            
            const url = id ? `/api/packages/${id}` : '/api/packages';
            const method = id ? 'PUT' : 'POST';
            
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (res.ok) {
                showToast(id ? '套餐更新成功' : '套餐创建成功', 'success');
                closeModal('package-modal');
                loadData();
            } else {
                const result = await res.json();
                showToast(result.error || '操作失败', 'error');
            }
        }
        
        async function deletePackage(id) {
            if (!confirm('确定删除该套餐吗？')) return;
            const res = await fetch(`/api/packages/${id}`, { method: 'DELETE' });
            if (res.ok) {
                showToast('套餐删除成功', 'success');
                loadData();
            } else {
                const result = await res.json();
                showToast(result.error || '删除失败', 'error');
            }
        }
        
        function openBabyModal() {
            document.getElementById('baby-modal-title').textContent = '宝宝入住登记';
            document.getElementById('edit-baby-id').value = '';
            document.getElementById('baby-name').value = '';
            document.getElementById('baby-gender').value = '男';
            document.getElementById('baby-birth').value = '';
            document.getElementById('baby-checkin').value = new Date().toISOString().split('T')[0];
            
            document.getElementById('baby-room').innerHTML = rooms.filter(r => r.status === 'empty').map(r => 
                `<option value="${r.id}">${r.room_number} - ${r.room_type}</option>`
            ).join('');
            
            document.getElementById('baby-package').innerHTML = packages.map(p => 
                `<option value="${p.id}">${p.name} (¥${p.price})</option>`
            ).join('');
            
            document.getElementById('baby-modal').classList.add('active');
        }
        
        function editBaby(id) {
            const baby = babies.find(b => b.id === id);
            if (!baby) return;
            document.getElementById('baby-modal-title').textContent = '编辑宝宝信息';
            document.getElementById('edit-baby-id').value = id;
            document.getElementById('baby-name').value = baby.name;
            document.getElementById('baby-gender').value = baby.gender || '男';
            document.getElementById('baby-birth').value = baby.birth_date || '';
            document.getElementById('baby-checkin').value = baby.checkin_date || '';
            
            document.getElementById('baby-room').innerHTML = rooms.filter(r => r.status === 'empty' || r.id === baby.room_id).map(r => 
                `<option value="${r.id}" ${r.id === baby.room_id ? 'selected' : ''}>${r.room_number} - ${r.room_type}</option>`
            ).join('');
            
            document.getElementById('baby-package').innerHTML = packages.map(p => 
                `<option value="${p.id}" ${p.id === baby.package_id ? 'selected' : ''}>${p.name} (¥${p.price})</option>`
            ).join('');
            
            document.getElementById('baby-modal').classList.add('active');
        }
        
        async function saveBaby() {
            const id = document.getElementById('edit-baby-id').value;
            
            if (id) {
                const data = {
                    name: document.getElementById('baby-name').value,
                    gender: document.getElementById('baby-gender').value,
                    birth_date: document.getElementById('baby-birth').value,
                    package_id: document.getElementById('baby-package').value
                };
                
                if (!data.name) {
                    showToast('请输入宝宝姓名', 'error');
                    return;
                }
                
                const res = await fetch(`/api/babies/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    showToast('宝宝信息更新成功', 'success');
                    closeModal('baby-modal');
                    loadData();
                } else {
                    const result = await res.json();
                    showToast(result.error || '操作失败', 'error');
                }
            } else {
                const data = {
                    name: document.getElementById('baby-name').value,
                    gender: document.getElementById('baby-gender').value,
                    birth_date: document.getElementById('baby-birth').value,
                    room_id: document.getElementById('baby-room').value,
                    checkin_date: document.getElementById('baby-checkin').value,
                    package_id: document.getElementById('baby-package').value
                };
                
                if (!data.name || !data.room_id) {
                    showToast('请填写完整信息', 'error');
                    return;
                }
                
                const res = await fetch('/api/babies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    showToast('宝宝入住成功', 'success');
                    closeModal('baby-modal');
                    loadData();
                } else {
                    const result = await res.json();
                    showToast(result.error || '操作失败', 'error');
                }
            }
        }
        
        async function checkoutBaby(babyId) {
            const baby = babies.find(b => b.id === babyId);
            if (!baby) return;
            
            const hasPending = consumptions.some(c => c.baby_id === babyId && c.approval_status === 'pending');
            if (hasPending) {
                showToast('存在待审批的补领记录，请先处理', 'error');
                return;
            }
            
            if (!confirm(`确认为 ${baby.name} 办理退房结算吗？`)) return;
            
            const res = await fetch(`/api/babies/${babyId}/checkout`, { method: 'POST' });
            
            if (res.ok) {
                showToast('退房成功，账单已生成', 'success');
                loadData();
            } else {
                const result = await res.json();
                showToast(result.error || '退房失败', 'error');
            }
        }
        
        async function exportBill(billId) {
            const bill = await fetch(`/api/bills/${billId}`).then(res => res.json());
            const baby = babies.find(b => b.id === bill.baby_id);
            const room = rooms.find(r => r.id === bill.room_id);
            
            let content = `
╔════════════════════════════════════════╗
║          月子中心消费账单                 ║
╚════════════════════════════════════════╝

宝宝姓名: ${baby?.name || '-'}
房间号: ${room?.room_number || '-'}
退房时间: ${new Date(bill.checkout_date).toLocaleString()}

──────────────────────────────────────────
  套餐费用: ¥${bill.package_price.toFixed(2).padStart(30)}
  额外耗材费用: ¥${bill.extra_consumption_total.toFixed(2).padStart(28)}
──────────────────────────────────────────
  总计: ¥${bill.total_amount.toFixed(2).padStart(34)}
══════════════════════════════════════════

消费明细:
`;
            bill.items.forEach(item => {
                content += `\n  ${item.item_name.padEnd(15)} x ${item.quantity}${item.unit.padEnd(3)} (${item.type === 'package' ? '套餐内' : '套餐外'})  ¥${item.total_price.toFixed(2)}`;
            });
            
            content += `

══════════════════════════════════════════
感谢您的入住，祝您身体健康！
生成时间: ${new Date().toLocaleString()}
`;
            
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `账单_${baby?.name || 'unknown'}_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            showToast('账单已导出', 'success');
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} active`;
            setTimeout(() => toast.classList.remove('active'), 3000);
        }
        
        loadData();
    </script>
</body>
</html>
