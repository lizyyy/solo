<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月子中心母婴耗材管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 40px; }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .nav { display: flex; gap: 10px; padding: 20px 40px; background: white; border-bottom: 1px solid #e0e0e0; }
        .nav button { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; background: #f0f2f5; transition: all 0.3s; }
        .nav button.active { background: #667eea; color: white; }
        .nav button:hover { background: #e0e0e0; }
        .nav button.active:hover { background: #5a6fd6; }
        .container { padding: 30px 40px; }
        .page { display: none; }
        .page.active { display: block; }
        
        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .room-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .room-card.occupied { border-left: 4px solid #52c41a; }
        .room-card.empty { border-left: 4px solid #d9d9d9; opacity: 0.7; }
        .room-number { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .room-type { color: #666; font-size: 14px; margin-bottom: 12px; }
        .baby-info { background: #f6ffed; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .baby-name { font-weight: 600; color: #389e0d; }
        .room-actions { display: flex; gap: 8px; }
        .room-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #52c41a; color: white; }
        
        .table-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #fafafa; font-weight: 600; color: #333; }
        tr:hover { background: #fafafa; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-pending { background: #fff7e6; color: #fa8c16; }
        .status-approved { background: #f6ffed; color: #52c41a; }
        .status-rejected { background: #fff1f0; color: #f5222d; }
        .type-package { background: #e6f7ff; color: #1890ff; }
        .type-extra { background: #fff0f6; color: #eb2f96; }
        
        .warning-card { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .warning-card h3 { margin-bottom: 10px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        .inventory-card { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .inventory-card.low-stock { border: 2px solid #ff4d4f; }
        .inv-name { font-weight: 600; margin-bottom: 8px; }
        .inv-category { color: #888; font-size: 12px; margin-bottom: 12px; }
        .inv-stock { display: flex; justify-content: space-between; align-items: center; }
        .stock-number { font-size: 20px; font-weight: bold; color: #52c41a; }
        .stock-number.low { color: #ff4d4f; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
        .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .btn-cancel { background: #f0f0f0; }
        
        .bill-card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .bill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #f0f0f0; }
        .bill-total { font-size: 28px; font-weight: bold; color: #667eea; }
        .bill-breakdown { margin: 16px 0; }
        .bill-row { display: flex; justify-content: space-between; padding: 8px 0; }
        .bill-row.package { color: #1890ff; }
        .bill-row.extra { color: #eb2f96; }
        
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; margin-bottom: 8px; }
        .stat-label { color: #666; font-size: 14px; }
        .stat-1 .stat-number { color: #667eea; }
        .stat-2 .stat-number { color: #52c41a; }
        .stat-3 .stat-number { color: #fa8c16; }
        .stat-4 .stat-number { color: #f5222d; }

        .action-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 4px; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 8px; color: white; z-index: 2000; display: none; }
        .toast.success { background: #52c41a; }
        .toast.error { background: #f5222d; }
        .toast.active { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>👶 月子中心母婴耗材管理系统</h1>
        <p>房间管理 · 耗材领用 · 补领审批 · 退房结算</p>
    </div>
    
    <div class="nav">
        <button class="active" onclick="showPage('rooms')">🏠 房间视图</button>
        <button onclick="showPage('consumptions')">📋 领用流水</button>
        <button onclick="showPage('inventory')">📦 库存预警</button>
        <button onclick="showPage('bills')">💰 账单管理</button>
    </div>
    
    <div class="container">
        <div id="rooms" class="page active">
            <div class="stats-bar">
                <div class="stat-card stat-1">
                    <div class="stat-number" id="total-rooms">0</div>
                    <div class="stat-label">总房间数</div>
                </div>
                <div class="stat-card stat-2">
                    <div class="stat-number" id="occupied-rooms">0</div>
                    <div class="stat-label">已入住</div>
                </div>
                <div class="stat-card stat-3">
                    <div class="stat-number" id="pending-approvals">0</div>
                    <div class="stat-label">待审批</div>
                </div>
                <div class="stat-card stat-4">
                    <div class="stat-number" id="low-stock-items">0</div>
                    <div class="stat-label">库存预警</div>
                </div>
            </div>
            <h2 style="margin-bottom: 20px;">房间状态</h2>
            <div class="room-grid" id="room-list"></div>
        </div>
        
        <div id="consumptions" class="page">
            <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                <h2>领用流水记录</h2>
                <button class="btn-primary" style="padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer;" onclick="openConsumptionModal()">+ 新增领用</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>房间</th>
                            <th>宝宝</th>
                            <th>耗材</th>
                            <th>数量</th>
                            <th>类型</th>
                            <th>补领</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="consumption-list"></tbody>
                </table>
            </div>
        </div>
        
        <div id="inventory" class="page">
            <h2 style="margin-bottom: 20px;">库存预警中心</h2>
            <div id="warning-section"></div>
            <h3 style="margin: 20px 0 16px;">全部库存</h3>
            <div class="inventory-grid" id="inventory-list"></div>
        </div>
        
        <div id="bills" class="page">
            <h2 style="margin-bottom: 20px;">退房账单</h2>
            <div id="bill-list"></div>
        </div>
    </div>
    
    <div class="modal" id="consumption-modal">
        <div class="modal-content">
            <div class="modal-title">新增耗材领用</div>
            <div class="form-group">
                <label>选择宝宝</label>
                <select id="select-baby"></select>
            </div>
            <div class="form-group">
                <label>选择耗材</label>
                <select id="select-inventory"></select>
            </div>
            <div class="form-group">
                <label>领用数量</label>
                <input type="number" id="input-quantity" value="1" min="1">
            </div>
            <div class="form-group">
                <label>领用类型</label>
                <select id="select-type">
                    <option value="package">套餐内</option>
                    <option value="extra">套餐外（额外收费）</option>
                </select>
            </div>
            <div class="form-group">
                <label>是否补领</label>
                <select id="select-supplement">
                    <option value="0">否（直接扣库存）</option>
                    <option value="1">是（需审批）</option>
                </select>
            </div>
            <div class="form-group">
                <label>请求编号（防重复）</label>
                <input type="text" id="input-request-id" placeholder="如：REQ-007">
            </div>
            <div class="form-group">
                <label>操作人</label>
                <input type="text" id="input-operator" placeholder="护士长姓名">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('consumption-modal')">取消</button>
                <button class="btn-primary" onclick="submitConsumption()">确认提交</button>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        let rooms = [];
        let babies = [];
        let inventory = [];
        let consumptions = [];
        let bills = [];
        
        async function loadData() {
            const [r, b, i, c, bl] = await Promise.all([
                fetch('/api/rooms').then(res => res.json()),
                fetch('/api/babies').then(res => res.json()),
                fetch('/api/inventory').then(res => res.json()),
                fetch('/api/consumptions').then(res => res.json()),
                fetch('/api/bills').then(res => res.json())
            ]);
            rooms = r;
            babies = b;
            inventory = i;
            consumptions = c;
            bills = bl;
            
            renderRooms();
            renderConsumptions();
            renderInventory();
            renderBills();
            renderStats();
        }
        
        function renderStats() {
            document.getElementById('total-rooms').textContent = rooms.length;
            document.getElementById('occupied-rooms').textContent = rooms.filter(r => r.status === 'occupied').length;
            document.getElementById('pending-approvals').textContent = consumptions.filter(c => c.approval_status === 'pending').length;
            document.getElementById('low-stock-items').textContent = inventory.filter(i => i.stock_quantity <= i.warning_threshold).length;
        }
        
        function renderRooms() {
            const container = document.getElementById('room-list');
            container.innerHTML = rooms.map(room => `
                <div class="room-card ${room.status}">
                    <div class="room-number">${room.room_number}</div>
                    <div class="room-type">${room.room_type}</div>
                    ${room.baby_name ? `
                        <div class="baby-info">
                            <div class="baby-name">👶 ${room.baby_name}</div>
                            <div style="font-size: 12px; margin-top: 4px;">
                                ${babies.find(b => b.room_id === room.id)?.package_name || ''}
                            </div>
                        </div>
                        <div class="room-actions">
                            <button class="btn-primary" onclick="openRoomConsumption('${room.id}')">领用耗材</button>
                            <button class="btn-success" onclick="checkoutBaby('${room.id}')">退房结算</button>
                        </div>
                    ` : '<div style="color: #999; font-size: 14px;">空房</div>'}
                </div>
            `).join('');
        }
        
        function renderConsumptions() {
            const container = document.getElementById('consumption-list');
            container.innerHTML = consumptions.map(c => `
                <tr>
                    <td>${new Date(c.created_at).toLocaleString()}</td>
                    <td>${c.room_number}</td>
                    <td>${c.baby_name}</td>
                    <td>${c.item_name}</td>
                    <td>${c.quantity}${c.unit}</td>
                    <td><span class="status-badge type-${c.type}">${c.type === 'package' ? '套餐内' : '套餐外'}</span></td>
                    <td>${c.is_supplement ? '是' : '否'}</td>
                    <td><span class="status-badge status-${c.approval_status}">${c.approval_status === 'pending' ? '待审批' : c.approval_status === 'approved' ? '已通过' : '已拒绝'}</span></td>
                    <td>
                        ${c.approval_status === 'pending' ? `
                            <button class="action-btn btn-success" onclick="approveConsumption('${c.id}')">通过</button>
                            <button class="action-btn" style="background: #ff4d4f; color: white;" onclick="rejectConsumption('${c.id}')">拒绝</button>
                        ` : '-'}
                    </td>
                </tr>
            `).join('');
        }
        
        function renderInventory() {
            const warnings = inventory.filter(i => i.stock_quantity <= i.warning_threshold);
            const warningSection = document.getElementById('warning-section');
            
            if (warnings.length > 0) {
                warningSection.innerHTML = `
                    <div class="warning-card">
                        <h3>⚠️ 库存预警（${warnings.length}项）</h3>
                        <p>以下耗材库存不足，请及时补货：${warnings.map(w => w.name).join('、')}</p>
                    </div>
                `;
            } else {
                warningSection.innerHTML = `
                    <div style="background: #f6ffed; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                        <h3>✅ 库存正常</h3>
                        <p>所有耗材库存充足</p>
                    </div>
                `;
            }
            
            const container = document.getElementById('inventory-list');
            container.innerHTML = inventory.map(item => {
                const isLow = item.stock_quantity <= item.warning_threshold;
                return `
                    <div class="inventory-card ${isLow ? 'low-stock' : ''}">
                        <div class="inv-name">${item.name}</div>
                        <div class="inv-category">${item.category} · ${item.unit}</div>
                        <div class="inv-stock">
                            <span>库存</span>
                            <span class="stock-number ${isLow ? 'low' : ''}">${item.stock_quantity}${item.unit}</span>
                        </div>
                        <div style="margin-top: 8px; font-size: 12px; color: #666;">
                            单价: ¥${item.unit_price} | 预警线: ${item.warning_threshold}${item.unit}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderBills() {
            const container = document.getElementById('bill-list');
            container.innerHTML = bills.length === 0 ? '<div style="background: white; padding: 40px; text-align: center; border-radius: 12px; color: #999;">暂无账单记录</div>' : bills.map(bill => `
                <div class="bill-card">
                    <div class="bill-header">
                        <div>
                            <h3>${bill.baby_name} - ${bill.room_number}房</h3>
                            <div style="color: #666; font-size: 14px; margin-top: 4px;">退房时间: ${new Date(bill.checkout_date).toLocaleString()}</div>
                        </div>
                        <div class="bill-total">¥${bill.total_amount.toFixed(2)}</div>
                    </div>
                    <div class="bill-breakdown">
                        <div class="bill-row package">
                            <span>套餐费用</span>
                            <span>¥${bill.package_price.toFixed(2)}</span>
                        </div>
                        <div class="bill-row extra">
                            <span>额外耗材费用</span>
                            <span>¥${bill.extra_consumption_total.toFixed(2)}</span>
                        </div>
                    </div>
                    <button class="btn-primary" style="width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 16px;" onclick="exportBill('${bill.id}')">📄 导出账单明细</button>
                </div>
            `).join('');
        }
        
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(page).classList.add('active');
            event.target.classList.add('active');
        }
        
        function openConsumptionModal() {
            const modal = document.getElementById('consumption-modal');
            const selectBaby = document.getElementById('select-baby');
            const selectInv = document.getElementById('select-inventory');
            
            selectBaby.innerHTML = babies.filter(b => b.status === 'in_house').map(b => 
                `<option value="${b.id}">${b.name} - ${b.room_number}房</option>`
            ).join('');
            
            selectInv.innerHTML = inventory.map(i => 
                `<option value="${i.id}">${i.name} (库存:${i.stock_quantity}${i.unit}, ¥${i.unit_price}/${i.unit})</option>`
            ).join('');
            
            document.getElementById('input-request-id').value = 'REQ-' + String(Date.now()).slice(-6);
            modal.classList.add('active');
        }
        
        function openRoomConsumption(roomId) {
            openConsumptionModal();
            const baby = babies.find(b => b.room_id === roomId);
            if (baby) {
                document.getElementById('select-baby').value = baby.id;
            }
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        async function submitConsumption() {
            const data = {
                baby_id: document.getElementById('select-baby').value,
                inventory_id: document.getElementById('select-inventory').value,
                quantity: parseInt(document.getElementById('input-quantity').value),
                type: document.getElementById('select-type').value,
                is_supplement: parseInt(document.getElementById('select-supplement').value),
                request_id: document.getElementById('input-request-id').value,
                created_by: document.getElementById('input-operator').value || '系统'
            };
            
            const res = await fetch('/api/consumptions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            const result = await res.json();
            if (res.ok) {
                showToast('领用记录创建成功', 'success');
                closeModal('consumption-modal');
                loadData();
            } else {
                showToast(result.error || '创建失败', 'error');
            }
        }
        
        async function approveConsumption(id) {
            const res = await fetch(`/api/consumptions/${id}/approve`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approved_by: '管理员' })
            });
            
            if (res.ok) {
                showToast('审批通过', 'success');
                loadData();
            } else {
                const result = await res.json();
                showToast(result.error || '审批失败', 'error');
            }
        }
        
        async function rejectConsumption(id) {
            const res = await fetch(`/api/consumptions/${id}/reject`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approved_by: '管理员' })
            });
            
            if (res.ok) {
                showToast('已拒绝', 'success');
                loadData();
            } else {
                showToast('操作失败', 'error');
            }
        }
        
        async function checkoutBaby(roomId) {
            const baby = babies.find(b => b.room_id === roomId);
            if (!baby) return;
            
            const hasPending = consumptions.some(c => c.baby_id === baby.id && c.approval_status === 'pending');
            if (hasPending) {
                showToast('存在待审批的补领记录，请先处理', 'error');
                return;
            }
            
            if (!confirm(`确认为 ${baby.name} 办理退房结算？`)) return;
            
            const res = await fetch(`/api/babies/${baby.id}/checkout`, { method: 'POST' });
            
            if (res.ok) {
                showToast('退房成功，账单已生成', 'success');
                loadData();
            } else {
                const result = await res.json();
                showToast(result.error || '退房失败', 'error');
            }
        }
        
        async function exportBill(billId) {
            const bill = await fetch(`/api/bills/${billId}`).then(res => res.json());
            
            let content = `
月子中心消费账单
================
宝宝姓名: ${bill.baby_name}
房间号: ${bill.room_number}
退房时间: ${new Date(bill.checkout_date).toLocaleString()}

套餐费用: ¥${bill.package_price.toFixed(2)}
额外耗材费用: ¥${bill.extra_consumption_total.toFixed(2)}
================
总计: ¥${bill.total_amount.toFixed(2)}

消费明细:
`;
            bill.items.forEach(item => {
                content += `\n${item.item_name} x ${item.quantity}${item.unit} (${item.type === 'package' ? '套餐内' : '套餐外'}) - ¥${item.total_price.toFixed(2)}`;
            });
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `账单_${bill.baby_name}_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            showToast('账单已导出', 'success');
        }
        
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} active`;
            setTimeout(() => toast.classList.remove('active'), 3000);
        }
        
        loadData();
    </script>
</body>
</html>
