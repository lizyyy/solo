[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-cache-audit"
version = "0.1.0"
description = "Dockerfile层缓存审计CLI工具 - 分析缓存失效原因并生成审计报告"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
]

[project.scripts]
docker-cache-audit = "docker_cache_audit.cli:main"
