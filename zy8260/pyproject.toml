[project]
name = "evidence-redactor"
version = "1.0.0"
description = "电子证据材料脱敏打包工具 - 法院书记员专用"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
evidence-redactor = "evidence_redactor.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_redactor"]
