# 严格模式配置 - 用于对比规则变更
deduplication:
  overlap:
    enabled: true
    time_overlap_threshold: 2
    content_similarity_threshold: 0.95
    merge_strategy: keep_longest

  model_duplicate:
    enabled: true
    time_window: 60
    confidence_diff_threshold: 0.05

  false_positive_recovery:
    enabled: false
    fp_marker_field: "is_false_positive"
    keep_fp_with_marker: false

output:
  format: json
  preserve_evidence_chain: false
  include_source_info: false

fields:
  alert_id: "alert_id"
  stream_id: "stream_id"
  violation_type: "violation_type"
  start_time: "start_time"
  end_time: "end_time"
  model_name: "model_name"
  confidence: "confidence"
  content_summary: "content_summary"
  evidence_url: "evidence_url"
  violation_level: "violation_level"
