server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: evidence-chain-tracker
  datasource:
    url: jdbc:h2:mem:evidencedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.evidence: DEBUG
    org.springframework.web: INFO

swagger:
  enabled: true
