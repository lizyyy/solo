[tool.poetry]
name = "yaml-secret-scanner"
version = "0.1.0"
description = "YAML密钥泄漏检测CLI工具"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
pyyaml = "^6.0"
click = "^8.1"
rich = "^13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
yaml-scan = "yaml_secret_scanner.cli:main"
