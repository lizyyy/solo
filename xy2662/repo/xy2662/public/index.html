<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机维修工单管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">📱 手机维修工单管理系统</h1>
                <div class="header-actions">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="搜索客户姓名、电话、设备型号..." class="search-input">
                        <button class="btn btn-secondary" id="searchBtn">搜索</button>
                    </div>
                    <button class="btn btn-secondary" id="exportBtn">导出 CSV</button>
                    <label class="btn btn-secondary">
                        导入 CSV
                        <input type="file" id="importFile" accept=".csv" style="display: none;">
                    </label>
                    <button class="btn btn-primary" id="newOrderBtn">新建工单</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="kanban-board" id="kanbanBoard">
                <div class="kanban-column" data-status="pending">
                    <div class="column-header">
                        <span class="column-title">待检测</span>
                        <span class="column-count" id="pending-count">0</span>
                    </div>
                    <div class="column-cards" id="pending-cards"></div>
                </div>

                <div class="kanban-column" data-status="quoting">
                    <div class="column-header">
                        <span class="column-title">报价中</span>
                        <span class="column-count" id="quoting-count">0</span>
                    </div>
                    <div class="column-cards" id="quoting-cards"></div>
                </div>

                <div class="kanban-column" data-status="repairing">
                    <div class="column-header">
                        <span class="column-title">维修中</span>
                        <span class="column-count" id="repairing-count">0</span>
                    </div>
                    <div class="column-cards" id="repairing-cards"></div>
                </div>

                <div class="kanban-column" data-status="ready">
                    <div class="column-header">
                        <span class="column-title">待取机</span>
                        <span class="column-count" id="ready-count">0</span>
                    </div>
                    <div class="column-cards" id="ready-cards"></div>
                </div>

                <div class="kanban-column" data-status="completed">
                    <div class="column-header">
                        <span class="column-title">已完成</span>
                        <span class="column-count" id="completed-count">0</span>
                    </div>
                    <div class="column-cards" id="completed-cards"></div>
                </div>

                <div class="kanban-column" data-status="cancelled">
                    <div class="column-header">
                        <span class="column-title">已取消</span>
                        <span class="column-count" id="cancelled-count">0</span>
                    </div>
                    <div class="column-cards" id="cancelled-cards"></div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="orderModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">新建工单</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="orderForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="customerName" class="required">客户姓名</label>
                            <input type="text" id="customerName" name="customer_name" required>
                        </div>
                        <div class="form-group">
                            <label for="phone" class="required">联系电话</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="deviceModel" class="required">设备型号</label>
                            <input type="text" id="deviceModel" name="device_model" required>
                        </div>
                        <div class="form-group">
                            <label for="quoteAmount">报价金额</label>
                            <input type="number" id="quoteAmount" name="quote_amount" min="0" step="0.01">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="faultDescription" class="required">故障描述</label>
                        <textarea id="faultDescription" name="fault_description" rows="3" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="repairParts">维修配件</label>
                        <textarea id="repairParts" name="repair_parts" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="expectedPickupTime">预计取机时间</label>
                        <input type="datetime-local" id="expectedPickupTime" name="expected_pickup_time">
                    </div>

                    <div class="form-group">
                        <label for="notes">备注</label>
                        <textarea id="notes" name="notes" rows="2"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal modal-large">
            <div class="modal-header">
                <h2 class="modal-title" id="detailModalTitle">工单详情</h2>
                <button class="modal-close" id="closeDetailModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-content" id="detailContent">
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
