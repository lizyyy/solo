[project]
name = "toml-validator"
version = "0.1.0"
description = "TOML 配置校验 CLI 工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "tomlkit>=0.12",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "rich>=13.0",
]

[project.scripts]
toml-validator = "toml_validator.cli:main"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
