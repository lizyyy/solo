<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}码头岸桥作业半径{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #333; }
        .navbar { background: #1a3a5c; color: white; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar h1 { font-size: 18px; font-weight: 600; }
        .navbar nav a { color: rgba(255,255,255,0.85); text-decoration: none; margin-left: 24px; font-size: 14px; transition: color 0.2s; }
        .navbar nav a:hover { color: white; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .card h2 { font-size: 16px; margin-bottom: 16px; color: #1a3a5c; border-bottom: 2px solid #e8edf3; padding-bottom: 8px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-item { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); text-align: center; }
        .stat-item .number { font-size: 32px; font-weight: 700; color: #1a3a5c; }
        .stat-item .label { font-size: 13px; color: #666; margin-top: 4px; }
        .stat-item.warning .number { color: #d48806; }
        .stat-item.danger .number { color: #cf1322; }
        .stat-item.success .number { color: #389e0d; }
        .stat-item.info .number { color: #0958d9; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #fafafa; font-weight: 600; color: #555; }
        tr:hover { background: #f8faff; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .badge-normal { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
        .badge-z_reversed { background: #fffbe6; color: #d48806; border: 1px solid #ffe58f; }
        .badge-updated { background: #e6f7ff; color: #0958d9; border: 1px solid #91caff; }
        .badge-pending { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .btn { display: inline-block; padding: 6px 16px; border: 1px solid #1a3a5c; background: #1a3a5c; color: white; border-radius: 4px; font-size: 14px; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .btn:hover { background: #2a5a8c; }
        .btn-outline { background: white; color: #1a3a5c; }
        .btn-outline:hover { background: #f0f5ff; }
        .btn-danger { background: #cf1322; border-color: #cf1322; }
        .btn-danger:hover { background: #a8071a; }
        .btn-warning { background: #d48806; border-color: #d48806; }
        .btn-warning:hover { background: #ad6800; }
        .btn-success { background: #389e0d; border-color: #389e0d; }
        .btn-success:hover { background: #237804; }
        .btn-sm { padding: 3px 10px; font-size: 12px; }
        .flash-messages { margin-bottom: 16px; }
        .flash-messages .alert { padding: 10px 16px; border-radius: 4px; margin-bottom: 8px; font-size: 14px; }
        .alert-success { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
        .alert-error { background: #fff1f0; border: 1px solid #ffa39e; color: #cf1322; }
        form { display: inline; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 14px; color: #555; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #1a3a5c; box-shadow: 0 0 0 2px rgba(26,58,92,0.1); }
        .actions { margin: 16px 0; display: flex; gap: 8px; flex-wrap: wrap; }
        .comparison-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
        .comparison-card { background: #fafafa; border-radius: 8px; padding: 16px; border: 2px solid #e8edf3; }
        .comparison-card h3 { font-size: 14px; color: #1a3a5c; margin-bottom: 12px; }
        .comparison-card .detail { font-size: 13px; color: #666; margin-bottom: 4px; }
        .note-box { background: #fffbe6; border-left: 4px solid #d48806; padding: 12px 16px; margin: 12px 0; border-radius: 0 4px 4px 0; font-size: 14px; }
        .origin-box { background: #e6f7ff; border-left: 4px solid #0958d9; padding: 12px 16px; margin: 12px 0; border-radius: 0 4px 4px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏗️ 码头岸桥作业半径</h1>
        <nav>
            <a href="/">看板</a>
            <a href="/radius">安全半径表</a>
            <a href="/origin-notes">坐标原点说明</a>
            <a href="/playback">路径回放</a>
            <a href="/operations">操作记录</a>
        </nav>
    </div>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
