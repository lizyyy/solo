[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dmx-patch-validator"
version = "1.0.0"
description = "DMX地址补丁校验员 - 小剧场灯光师必备工具"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
dmx-validator = "dmx_patch_validator.cli:main"
