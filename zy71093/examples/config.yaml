defaults: &defaults
  adapter: postgres
  host: localhost
  port: 5432
  pool:
    min: 2
    max: 10
  timeout: 30000

logging: &logging
  level: info
  format: json
  timestamp: true

development:
  <<: *defaults
  database: app_dev
  logging:
    <<: *logging
    level: debug

test:
  <<: *defaults
  database: app_test
  pool:
    min: 1
    max: 5

production:
  <<: *defaults
  host: prod.example.com
  database: app_prod
  logging:
    <<: *logging
    level: warn
  timeout: 60000

features:
  auth: true
  caching: false
  rate_limit: 1000
