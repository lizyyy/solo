[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "checkin-cli"
version = "1.0.0"
description = "赛事检录资格替补递补材料校验排查CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pandas>=1.5",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "pydantic>=2.0",
]

[project.scripts]
checkin-cli = "checkin_cli.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
