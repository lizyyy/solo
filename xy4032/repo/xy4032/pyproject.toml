[project]
name = "plate-planner"
version = "0.1.0"
description = "96孔板稀释排版管家 - 生物实验室样品稀释和孔板排布工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
plate-planner = "plate_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plate_planner"]
