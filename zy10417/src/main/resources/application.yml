server:
  port: 8080

spring:
  application:
    name: log-retention-freeze

  datasource:
    url: jdbc:h2:file:./data/logretention;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.audit.logretention: DEBUG
    org.hibernate.SQL: DEBUG