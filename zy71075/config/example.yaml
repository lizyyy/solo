# FFmpeg 转码计划配置文件示例
# 支持 YAML 和 JSON 格式

# 自定义目标规格（会与默认规格合并）
targetProfiles:
  # 自定义 1080p 高码率配置
  '1080p-high':
    name: '1080p-high'
    width: 1920
    height: 1080
    videoCodec: 'h264'
    audioCodec: 'aac'
    defaultBitrate: 8000000
    minBitrate: 5000000
    maxBitrate: 12000000
    audioBitrate: 256000
    audioChannels: 2
  
  # 自定义 720p 低码率配置
  '720p-low':
    name: '720p-low'
    width: 1280
    height: 720
    videoCodec: 'h264'
    audioCodec: 'aac'
    defaultBitrate: 1500000
    minBitrate: 800000
    maxBitrate: 2500000
    audioBitrate: 96000
    audioChannels: 2

# 自定义码率规则（会追加到默认规则）
bitrateRules:
  - id: 'custom_animation'
    name: '动画内容优化'
    conditions:
      # 可通过文件名匹配（需要在 CLI 中实现文件名条件匹配）
      # filenameContains: 'animation'
      frameRateMax: 30
    multiplier: 0.85
    priority: 15
  
  - id: 'custom_hdr'
    name: 'HDR 内容'
    conditions:
      # HDR 检测条件示例
      # isHDR: true
      resolutionMin: 2160
    multiplier: 1.3
    priority: 12
  
  - id: 'custom_social_media'
    name: '社交媒体优化'
    conditions:
      resolutionMax: 1080
    multiplier: 0.9
    priority: 8
    absoluteBitrate: 2000000
