[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncio-diagnose"
version = "0.1.0"
description = "A command-line tool for diagnosing Python asyncio issues: stuck coroutines, task leaks, and ineffective cancellations"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=12.0",
]

[project.scripts]
asyncio-diagnose = "asyncio_diagnose.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["asyncio_diagnose*"]
