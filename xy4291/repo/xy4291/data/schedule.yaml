# 夜班分诊风暴 - 床位和医生排班配置
# 日期: 2026-05-03 夜班 (00:00-08:00)

zones:
  # 抢救区 (1级 - 紧急生命危险)
  emergency:
    beds: 5
    doctors: 2
    nurses: 4
    description: "抢救区 - 用于处理紧急生命危险情况"

  # 留观区 (2级 - 需要进一步观察治疗)
  observation:
    beds: 10
    doctors: 3
    nurses: 6
    description: "留观区 - 用于需要进一步观察和治疗的病人"

  # 转诊区 (3级 - 需要转往其他科室)
  transfer:
    beds: 5
    doctors: 1
    nurses: 2
    description: "转诊区 - 用于需要转往其他专科科室的病人"

  # 等待区 (4级 - 病情稳定，可以等待)
  waiting:
    beds: 20
    doctors: 1
    nurses: 3
    description: "等待区 - 用于病情稳定、可以等待的病人"

