<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物料借还追踪系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 导航栏 -->
    <nav class="navbar">
      <h1>📦 物料借还追踪</h1>
      <div class="nav-links">
        <button id="btn-dashboard" class="nav-btn active">仪表盘</button>
        <button id="btn-items" class="nav-btn">物料管理</button>
        <button id="btn-history" class="nav-btn">操作历史</button>
      </div>
    </nav>

    <!-- 主要内容区 -->
    <main class="main-content">
      <!-- 仪表盘页面 -->
      <section id="page-dashboard" class="page">
        <div class="page-header">
          <h2>当前占用情况</h2>
          <div class="filter-bar">
            <select id="filter-project">
              <option value="">所有项目</option>
            </select>
            <select id="filter-status">
              <option value="">所有状态</option>
              <option value="borrowed">借出中</option>
              <option value="overdue">已逾期</option>
              <option value="returned">已归还</option>
            </select>
          </div>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-cards">
          <div class="stat-card">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">物料总数</span>
          </div>
          <div class="stat-card borrowed">
            <span class="stat-value" id="stat-borrowed">0</span>
            <span class="stat-label">借出中</span>
          </div>
          <div class="stat-card overdue">
            <span class="stat-value" id="stat-overdue">0</span>
            <span class="stat-label">已逾期</span>
          </div>
          <div class="stat-card available">
            <span class="stat-value" id="stat-available">0</span>
            <span class="stat-label">可借用</span>
          </div>
        </div>

        <!-- 当前借出记录 -->
        <div class="card">
          <div class="card-header">
            <h3>当前借出记录</h3>
            <div class="card-actions">
              <button id="btn-export" class="btn btn-secondary">导出CSV</button>
              <button id="btn-new-borrow" class="btn btn-primary">登记借出</button>
            </div>
          </div>
          <div class="table-container">
            <table id="table-borrows">
              <thead>
                <tr>
                  <th>物料名称</th>
                  <th>项目</th>
                  <th>借用人</th>
                  <th>借出时间</th>
                  <th>预计归还</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="empty-borrows" class="empty-state hidden">
            <p>暂无借出记录</p>
          </div>
        </div>
      </section>

      <!-- 物料管理页面 -->
      <section id="page-items" class="page hidden">
        <div class="page-header">
          <h2>物料管理</h2>
          <div class="page-actions">
            <input type="file" id="import-csv" accept=".csv" class="hidden">
            <button id="btn-import" class="btn btn-secondary">导入CSV</button>
            <button id="btn-new-item" class="btn btn-primary">添加物料</button>
          </div>
        </div>
        
        <!-- 物料列表 -->
        <div class="card">
          <div class="table-container">
            <table id="table-items">
              <thead>
                <tr>
                  <th>物料名称</th>
                  <th>分类</th>
                  <th>总库存</th>
                  <th>可用数量</th>
                  <th>借出数量</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="empty-items" class="empty-state">
            <p>暂无物料数据</p>
            <p class="hint">点击"添加物料"或"导入CSV"开始录入</p>
          </div>
        </div>
      </section>

      <!-- 操作历史页面 -->
      <section id="page-history" class="page hidden">
        <div class="page-header">
          <h2>操作历史流水</h2>
          <div class="filter-bar">
            <select id="filter-history-type">
              <option value="">所有操作</option>
              <option value="borrow">借出</option>
              <option value="return">归还</option>
              <option value="item_create">新增物料</option>
              <option value="item_update">编辑物料</option>
              <option value="item_delete">删除物料</option>
            </select>
            <button id="btn-clear-history" class="btn btn-danger btn-sm">清空历史</button>
          </div>
        </div>
        
        <!-- 历史记录列表 -->
        <div class="card">
          <div class="history-list" id="history-list">
            <!-- 历史记录将动态插入 -->
          </div>
          <div id="empty-history" class="empty-state hidden">
            <p>暂无操作历史</p>
          </div>
        </div>
      </section>
    </main>

    <!-- 模态框：添加/编辑物料 -->
    <div id="modal-item" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-item-title">添加物料</h3>
          <button class="modal-close" id="close-item-modal">&times;</button>
        </div>
        <form id="form-item">
          <div class="form-group">
            <label for="item-name">物料名称 *</label>
            <input type="text" id="item-name" required>
          </div>
          <div class="form-group">
            <label for="item-category">分类</label>
            <select id="item-category">
              <option value="">未分类</option>
              <option value="道具">道具</option>
              <option value="灯光">灯光</option>
              <option value="录音">录音</option>
              <option value="摄影">摄影</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label for="item-quantity">库存数量 *</label>
            <input type="number" id="item-quantity" min="0" value="0" required>
          </div>
          <div class="form-group">
            <label for="item-description">描述</label>
            <textarea id="item-description" rows="3"></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancel-item">取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 模态框：登记借出 -->
    <div id="modal-borrow" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>登记借出</h3>
          <button class="modal-close" id="close-borrow-modal">&times;</button>
        </div>
        <form id="form-borrow">
          <div class="form-group">
            <label for="borrow-item">选择物料 *</label>
            <select id="borrow-item" required>
              <option value="">请选择物料</option>
            </select>
          </div>
          <div class="form-group">
            <label for="borrow-quantity">借出数量 *</label>
            <input type="number" id="borrow-quantity" min="1" value="1" required>
            <span class="form-hint" id="borrow-available-hint"></span>
          </div>
          <div class="form-group">
            <label for="borrow-project">所属项目 *</label>
            <input type="text" id="borrow-project" required placeholder="例如：产品宣传片拍摄">
          </div>
          <div class="form-group">
            <label for="borrow-person">借用人 *</label>
            <input type="text" id="borrow-person" required placeholder="借用人姓名">
          </div>
          <div class="form-group">
            <label for="borrow-expected-return">预计归还时间 *</label>
            <input type="date" id="borrow-expected-return" required>
          </div>
          <div class="form-group">
            <label for="borrow-notes">备注</label>
            <textarea id="borrow-notes" rows="2"></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancel-borrow">取消</button>
            <button type="submit" class="btn btn-primary">确认借出</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 模态框：确认归还 -->
    <div id="modal-return" class="modal hidden">
      <div class="modal-content modal-sm">
        <div class="modal-header">
          <h3>确认归还</h3>
          <button class="modal-close" id="close-return-modal">&times;</button>
        </div>
        <div id="return-info" class="return-info">
          <!-- 归还信息将动态插入 -->
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancel-return">取消</button>
          <button type="button" class="btn btn-success" id="confirm-return">确认归还</button>
        </div>
      </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/models.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/state.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
