[project]
name = "price-gate-cli"
version = "0.1.0"
description = "价格规则发布门禁 CLI 工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
price-gate = "price_gate.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["price_gate", "price_gate.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
