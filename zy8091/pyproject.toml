[project]
name = "safety-valve-review"
version = "1.0.0"
description = "压力容器安全阀校验批次复核工具"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.7",
]

[project.scripts]
valve-review = "safety_valve.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]