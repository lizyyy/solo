- name: standard_58mm
  width: 58mm
  header:
    - type: text
      content: "{{ store.name }}"
      align: center
      bold: true
    - type: text
      content: "{{ store.address }}"
      align: center
    - type: text
      content: "电话: {{ store.phone }}"
      align: center
    - type: separator
    - type: text
      content: "日期: {{ date }} 时间: {{ time }}"
    - type: text
      content: "交易号: {{ id }}"
    - type: text
      content: "收银员: {{ cashier }}"
    - type: separator
  items:
    columns:
      - key: name
        label: 商品
        width: 18
        align: left
      - key: quantity
        label: 数量
        width: 4
        align: right
      - key: price
        label: 单价
        width: 6
        align: right
      - key: subtotal
        label: 小计
        width: 6
        align: right
    separator: true
  footer:
    - type: separator
    - type: text
      content: "小计: {{ subtotal }}"
      align: right
    - type: text
      content: "优惠: -{{ discount | default: 0 }}"
      align: right
    - type: text
      content: "税费: {{ tax | default: 0 }}"
      align: right
    - type: separator
    - type: text
      content: "总计: {{ total }}"
      align: right
      bold: true
    - type: separator
    - type: text
      content: "支付方式: {{ payment.method }}"
    - type: text
      content: "支付金额: {{ payment.amount }}"
    - type: text
      content: "找零: {{ payment.change | default: 0 }}"
      align: right
    - type: space
      lines: 2
    - type: text
      content: "谢谢惠顾，欢迎下次光临！"
      align: center
    - type: space
      lines: 1
    - type: qrcode
      value: "https://example.com/receipt/{{ id }}"
    - type: space
      lines: 1
    - type: barcode
      value: "{{ id }}"
      height: 80
  commands:
    cut: true
    openDrawer: true
    beep: false

- name: standard_80mm
  width: 80mm
  header:
    - type: text
      content: "{{ store.name }}"
      align: center
      bold: true
      size: double
    - type: space
      lines: 1
    - type: text
      content: "{{ store.address }}"
      align: center
    - type: text
      content: "联系电话: {{ store.phone }}"
      align: center
    - type: separator
      content: "="
    - type: text
      content: "日期: {{ date }}    时间: {{ time }}    交易号: {{ id }}"
    - type: text
      content: "收银员: {{ cashier }}"
    - type: separator
  items:
    columns:
      - key: name
        label: 商品名称
        width: 28
        align: left
      - key: quantity
        label: 数量
        width: 6
        align: right
      - key: price
        label: 单价
        width: 8
        align: right
      - key: subtotal
        label: 小计
        width: 8
        align: right
    separator: true
  footer:
    - type: separator
      content: "-"
    - type: text
      content: "商品小计: {{ subtotal }}"
      align: right
    - type: text
      content: "优惠折扣: -{{ discount | default: 0.00 }}"
      align: right
    - type: text
      content: "税费: {{ tax | default: 0.00 }}"
      align: right
    - type: separator
      content: "="
    - type: text
      content: "应收金额: {{ total }}"
      align: right
      bold: true
    - type: separator
      content: "-"
    - type: text
      content: "支付方式: {{ payment.method }}"
    - type: text
      content: "实收金额: {{ payment.amount }}"
    - type: text
      content: "找零: {{ payment.change | default: 0.00 }}"
      align: right
    - type: space
      lines: 2
    - type: text
      content: "温馨提示：请妥善保管好您的购物凭证"
      align: center
    - type: text
      content: "如有质量问题，请凭此小票退换货"
      align: center
    - type: space
      lines: 1
    - type: qrcode
      value: "https://example.com/receipt/{{ id }}"
    - type: space
      lines: 1
    - type: barcode
      value: "{{ id }}"
      height: 100
  commands:
    cut: true
    openDrawer: true
    beep: true

- name: test_with_problems
  width: 58mm
  header:
    - type: text
      content: "这是一个非常非常长的标题，肯定会超出58mm小票的宽度限制，因为58mm小票只有32个字符的宽度，而中文字符每个占2个宽度"
      align: center
    - type: text
      content: "{{ store.name }}"
      align: center
    - type: separator
  items:
    columns:
      - key: name
        label: 商品名称
        width: 25
        align: left
      - key: quantity
        label: 数量
        width: 5
        align: right
      - key: price
        label: 单价
        width: 8
        align: right
      - key: subtotal
        label: 小计金额
        width: 8
        align: right
    separator: true
  footer:
    - type: separator
    - type: text
      content: "总计: {{ total }}"
      align: right
    - type: qrcode
      value: "test_qrcode"
    - type: barcode
      value: "test_barcode"
  commands:
    cut: true
    openDrawer: true