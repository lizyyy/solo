[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offline-replay-tool"
version = "0.1.0"
description = "离线补账包回放器 - 智能售货柜运维工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "pytest>=7.0.0",
]

[project.scripts]
replay-tool = "offline_replay_tool.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/offline_replay_tool"]
