{% extends "base.html" %}
{% block title %}计算详情 - {{ calc_id }}{% endblock %}
{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">管道水锤压力试算</a>
    </div>
</nav>
<div class="container mt-4">
    <h2 class="mb-4">计算详情 #{{ calc_id }}</h2>
    {% if has_override_without_reason %}
    <div class="warning-banner mb-4">
        <strong>警告：</strong>发现人工改系数但未填写原因，需设备工程师复核。
    </div>
    {% endif %}
    <a href="{{ url_for('calc_replay', calc_id=calc_id) }}" class="btn btn-primary">参数回放页</a>
</div>
{% endblock %}
