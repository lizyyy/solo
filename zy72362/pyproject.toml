[project]
name = "water-hammer-calc"
version = "0.1.0"
description = "管道水锤压力试算系统 — 整合设备铭牌参数与维修群截图，支持参数溯源、改系数据标记与复核工作流"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "click>=8.1",
    "rich>=13.7",
    "plotly>=5.18",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
whcalc = "water_hammer_calc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
