<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外墙检修排班工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- 头部导航 -->
    <header class="header">
      <h1>🏢 外墙检修排班工具</h1>
      <div class="header-actions">
        <span id="currentDate"></span>
        <button id="refreshBtn" class="btn btn-secondary">🔄 刷新</button>
        <button id="importSampleBtn" class="btn btn-primary">📥 导入示例数据</button>
      </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="main-content">
      <!-- 左侧面板：数据管理 -->
      <aside class="left-panel">
        <div class="panel-section">
          <h3>📊 数据管理</h3>
          <div class="data-tabs">
            <button class="tab-btn active" data-tab="gondolas">吊篮</button>
            <button class="tab-btn" data-tab="workers">工人</button>
            <button class="tab-btn" data-tab="facades">立面</button>
            <button class="tab-btn" data-tab="wind">风速</button>
            <button class="tab-btn" data-tab="noise">禁噪</button>
          </div>
          <div id="dataContent" class="data-content">
            <!-- 动态加载数据内容 -->
          </div>
        </div>
      </aside>

      <!-- 中间面板：楼体可视化 -->
      <section class="center-panel">
        <div class="panel-section">
          <h3>🏗️ 楼体立面</h3>
          <div class="building-visualization">
            <div class="building-container">
              <div class="building">
                <div class="facade north">
                  <div class="facade-label">北</div>
                  <div class="facade-zones" id="northZones"></div>
                </div>
                <div class="facade east">
                  <div class="facade-label">东</div>
                  <div class="facade-zones" id="eastZones"></div>
                </div>
                <div class="facade south">
                  <div class="facade-label">南</div>
                  <div class="facade-zones" id="southZones"></div>
                </div>
                <div class="facade west">
                  <div class="facade-label">西</div>
                  <div class="facade-zones" id="westZones"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="legend">
            <div class="legend-item">
              <div class="legend-color feasible"></div>
              <span>可开工</span>
            </div>
            <div class="legend-item">
              <div class="legend-color not-feasible"></div>
              <span>不可开工</span>
            </div>
            <div class="legend-item">
              <div class="legend-color warning"></div>
              <span>有风险</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 右侧面板：排班结果 -->
      <aside class="right-panel">
        <div class="panel-section">
          <h3>📋 今日排班</h3>
          <div class="schedule-summary">
            <div class="summary-card">
              <div class="summary-value" id="totalFacades">0</div>
              <div class="summary-label">总立面数</div>
            </div>
            <div class="summary-card feasible">
              <div class="summary-value" id="feasibleCount">0</div>
              <div class="summary-label">可开工</div>
            </div>
            <div class="summary-card not-feasible">
              <div class="summary-value" id="notFeasibleCount">0</div>
              <div class="summary-label">不可开工</div>
            </div>
          </div>
          <div id="scheduleList" class="schedule-list">
            <!-- 动态加载排班列表 -->
          </div>
        </div>
      </aside>
    </main>

    <!-- 底部操作栏 -->
    <footer class="footer">
      <div class="footer-actions">
        <button id="saveScheduleBtn" class="btn btn-success">💾 保存排班</button>
        <button id="exportMarkdownBtn" class="btn btn-info">📄 导出 Markdown</button>
        <button id="exportJsonBtn" class="btn btn-warning">📊 导出 JSON</button>
        <button id="viewHistoryBtn" class="btn btn-secondary">📅 历史记录</button>
      </div>
    </footer>
  </div>

  <!-- 详情模态框 -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">立面详情</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- 动态加载详情内容 -->
      </div>
      <div class="modal-footer">
        <div class="review-section">
          <h4>人工复核备注</h4>
          <textarea id="reviewText" placeholder="请输入复核意见..."></textarea>
          <div class="review-actions">
            <select id="reviewDecision">
              <option value="approved">同意开工</option>
              <option value="delayed">建议延后</option>
              <option value="rejected">禁止开工</option>
            </select>
            <button id="saveReviewBtn" class="btn btn-primary">保存复核</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 历史记录模态框 -->
  <div id="historyModal" class="modal">
    <div class="modal-content large">
      <div class="modal-header">
        <h2>历史排班记录</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="historyBody">
        <!-- 动态加载历史记录 -->
      </div>
    </div>
  </div>

  <!-- 通知提示 -->
  <div id="notification" class="notification">
    <span id="notificationMessage"></span>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
