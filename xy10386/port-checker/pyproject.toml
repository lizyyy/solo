[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "port-checker"
version = "0.1.0"
description = "研发环境端口占用巡检 CLI"
requires-python = ">=3.8"
dependencies = ["pyyaml"]

[project.scripts]
port-checker = "port_checker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
