<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区共享工具柜</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 24px;
    }
    .header-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: #45a049;
    }
    .btn-secondary {
      background-color: #2196F3;
      color: white;
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: #1976D2;
    }
    .btn-warning {
      background-color: #ff9800;
      color: white;
    }
    .btn-warning:hover:not(:disabled) {
      background-color: #f57c00;
    }
    .btn-danger {
      background-color: #f44336;
      color: white;
    }
    .btn-danger:hover:not(:disabled) {
      background-color: #d32f2f;
    }
    .btn-info {
      background-color: #9c27b0;
      color: white;
    }
    .btn-info:hover:not(:disabled) {
      background-color: #7b1fa2;
    }
    .main-content {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
    }
    .tools-section {
      background: white;
      border-radius: 10px;
      padding: 20px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .refresh-btn {
      font-size: 12px;
      padding: 5px 10px;
    }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
    }
    .tool-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      transition: box-shadow 0.2s;
    }
    .tool-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .tool-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .tool-name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-AVAILABLE {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .status-RESERVED {
      background-color: #fff3e0;
      color: #ef6c00;
    }
    .status-BORROWED {
      background-color: #e3f2fd;
      color: #1565c0;
    }
    .status-UNDER_REPAIR {
      background-color: #ffebee;
      color: #c62828;
    }
    .tool-info {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }
    .tool-info-item {
      margin-bottom: 4px;
    }
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .action-btn {
      font-size: 12px;
      padding: 6px 12px;
      position: relative;
    }
    .action-btn:disabled {
      position: relative;
    }
    .action-btn:disabled::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .action-btn:disabled:hover::after {
      opacity: 1;
    }
    .logs-section {
      background: white;
      border-radius: 10px;
      padding: 20px;
    }
    .logs-list {
      max-height: 600px;
      overflow-y: auto;
    }
    .log-item {
      padding: 10px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }
    .log-item:last-child {
      border-bottom: none;
    }
    .log-time {
      color: #999;
      font-size: 11px;
      margin-bottom: 3px;
    }
    .log-content {
      color: #333;
    }
    .log-success {
      border-left: 3px solid #4CAF50;
    }
    .log-error {
      border-left: 3px solid #f44336;
    }
    .user-selector {
      margin-bottom: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
    }
    .user-selector label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }
    .user-selector select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: white;
      padding: 25px;
      border-radius: 10px;
      min-width: 350px;
      max-width: 500px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .modal-body {
      margin-bottom: 20px;
    }
    .modal-body textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      resize: vertical;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2000;
    }
    .toast {
      background: #333;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease;
    }
    .toast.success {
      background: #4CAF50;
    }
    .toast.error {
      background: #f44336;
    }
    .toast.warning {
      background: #ff9800;
    }
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #666;
    }
    .sync-indicator .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CAF50;
    }
    .sync-indicator .dot.syncing {
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .stats-bar {
      display: flex;
      gap: 20px;
      padding: 10px 0;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }
    .stat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>🛠️ 社区共享工具柜</h1>
        <div class="sync-indicator">
          <span class="dot" id="syncDot"></span>
          <span id="syncStatus">数据已同步</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-info" onclick="exportCSV()">📊 导出今日记录</button>
        <button class="btn btn-secondary refresh-btn" onclick="refreshAll()">🔄 刷新数据</button>
      </div>
    </div>

    <div class="user-selector">
      <label for="currentUser">当前操作人 (模拟志愿者登录):</label>
      <select id="currentUser">
        <option value="">请选择操作人</option>
      </select>
    </div>

    <div class="main-content">
      <div class="tools-section">
        <div class="section-title">
          <span>工具列表</span>
          <div class="stats-bar" id="statsBar"></div>
        </div>
        <div class="tools-grid" id="toolsGrid"></div>
      </div>

      <div class="logs-section">
        <div class="section-title">
          <span>最近操作流水</span>
          <button class="btn btn-secondary refresh-btn" onclick="refreshLogs()">刷新</button>
        </div>
        <div class="logs-list" id="logsList"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="repairModal">
    <div class="modal">
      <h3 class="modal-title">报修工具</h3>
      <div class="modal-body">
        <p style="margin-bottom: 10px; color: #666;">请描述故障原因：</p>
        <textarea id="repairDescription" placeholder="例如：电池没电了、螺丝刀头损坏..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeRepairModal()">取消</button>
        <button class="btn btn-warning" onclick="confirmRepair()">确认报修</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API_BASE = '';
    let currentUserId = null;
    let tools = [];
    let users = [];
    let logs = [];
    let currentRepairToolId = null;
    let actionInProgress = false;
    let refreshInterval = null;

    const STATUS_LABELS = {
      'AVAILABLE': '可用',
      'RESERVED': '已预约',
      'BORROWED': '已借出',
      'UNDER_REPAIR': '维修中'
    };

    const ACTION_LABELS = {
      'RESERVE': '预约',
      'CANCEL_RESERVATION': '取消预约',
      'BORROW': '借出',
      'RETURN': '归还',
      'REPORT_REPAIR': '报修',
      'COMPLETE_REPAIR': '完成维修'
    };

    async function fetchAPI(endpoint, options = {}) {
      const url = `${API_BASE}${endpoint}`;
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...options.headers
        }
      });
      return response.json();
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    function updateSyncStatus(status, syncing = false) {
      const dot = document.getElementById('syncDot');
      const statusText = document.getElementById('syncStatus');
      statusText.textContent = status;
      
      if (syncing) {
        dot.classList.add('syncing');
      } else {
        dot.classList.remove('syncing');
      }
    }

    async function loadUsers() {
      try {
        const result = await fetchAPI('/api/users');
        if (result.success) {
          users = result.data;
          renderUserSelector();
        }
      } catch (error) {
        console.error('加载用户失败:', error);
        showToast('加载用户列表失败', 'error');
      }
    }

    function renderUserSelector() {
      const select = document.getElementById('currentUser');
      select.innerHTML = '<option value="">请选择操作人</option>';
      
      users.forEach(user => {
        const option = document.createElement('option');
        option.value = user.id;
        option.textContent = `${user.name} (${user.phone || '无电话'})`;
        select.appendChild(option);
      });

      select.addEventListener('change', (e) => {
        currentUserId = e.target.value ? parseInt(e.target.value) : null;
        renderTools();
      });
    }

    async function loadTools() {
      try {
        updateSyncStatus('正在同步...', true);
        const result = await fetchAPI('/api/tools');
        if (result.success) {
          tools = result.data;
          renderTools();
          renderStats();
        }
        updateSyncStatus('数据已同步', false);
      } catch (error) {
        console.error('加载工具失败:', error);
        updateSyncStatus('同步失败', false);
      }
    }

    function renderStats() {
      const statsBar = document.getElementById('statsBar');
      const counts = {
        AVAILABLE: 0,
        RESERVED: 0,
        BORROWED: 0,
        UNDER_REPAIR: 0
      };

      tools.forEach(tool => {
        if (counts[tool.status] !== undefined) {
          counts[tool.status]++;
        }
      });

      statsBar.innerHTML = `
        <div class="stat-item">
          <span class="stat-dot" style="background: #4CAF50;"></span>
          <span>可用: ${counts.AVAILABLE}</span>
        </div>
        <div class="stat-item">
          <span class="stat-dot" style="background: #ff9800;"></span>
          <span>已预约: ${counts.RESERVED}</span>
        </div>
        <div class="stat-item">
          <span class="stat-dot" style="background: #2196F3;"></span>
          <span>已借出: ${counts.BORROWED}</span>
        </div>
        <div class="stat-item">
          <span class="stat-dot" style="background: #f44336;"></span>
          <span>维修中: ${counts.UNDER_REPAIR}</span>
        </div>
      `;
    }

    function renderTools() {
      const grid = document.getElementById('toolsGrid');
      
      if (tools.length === 0) {
        grid.innerHTML = '<p style="color: #999; text-align: center; padding: 40px;">暂无工具数据</p>';
        return;
      }

      grid.innerHTML = tools.map(tool => {
        const extraInfo = [];
        
        if (tool.reservation) {
          extraInfo.push(`预约人: ${tool.reservation.user_name}`);
        }
        if (tool.borrow) {
          extraInfo.push(`借用人: ${tool.borrow.user_name}`);
        }
        if (tool.repair) {
          extraInfo.push(`报修人: ${tool.repair.reporter_name}`);
          if (tool.repair.description) {
            extraInfo.push(`故障: ${tool.repair.description}`);
          }
        }

        const actions = [];
        
        if (tool.actions.RESERVE) {
          actions.push(createActionButton(tool, 'RESERVE', 'btn-primary'));
        }
        
        if (tool.actions.CANCEL_RESERVATION) {
          actions.push(createActionButton(tool, 'CANCEL_RESERVATION', 'btn-secondary'));
        }
        
        if (tool.actions.BORROW) {
          actions.push(createActionButton(tool, 'BORROW', 'btn-primary'));
        }
        
        if (tool.actions.RETURN) {
          actions.push(createActionButton(tool, 'RETURN', 'btn-secondary'));
        }
        
        if (tool.actions.REPORT_REPAIR) {
          actions.push(createActionButton(tool, 'REPORT_REPAIR', 'btn-danger'));
        }
        
        if (tool.actions.COMPLETE_REPAIR) {
          actions.push(createActionButton(tool, 'COMPLETE_REPAIR', 'btn-warning'));
        }

        return `
          <div class="tool-card" data-tool-id="${tool.id}">
            <div class="tool-header">
              <span class="tool-name">${tool.name}</span>
              <span class="status-badge status-${tool.status}">${STATUS_LABELS[tool.status] || tool.status}</span>
            </div>
            ${extraInfo.length > 0 ? `
              <div class="tool-info">
                ${extraInfo.map(info => `<div class="tool-info-item">${info}</div>`).join('')}
              </div>
            ` : ''}
            <div class="action-buttons">
              ${actions.join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function createActionButton(tool, action, btnClass) {
      const actionInfo = tool.actions[action];
      const isDisabled = !actionInfo.enabled || !currentUserId;
      const tooltip = actionInfo.reason || (!currentUserId ? '请先选择操作人' : '');
      
      return `
        <button 
          class="btn ${btnClass} action-btn"
          data-tool-id="${tool.id}"
          data-action="${action}"
          ${isDisabled ? 'disabled' : ''}
          data-tooltip="${tooltip}"
          onclick="handleAction(${tool.id}, '${action}')"
        >
          ${ACTION_LABELS[action]}
        </button>
      `;
    }

    async function handleAction(toolId, action) {
      if (actionInProgress) {
        showToast('请等待当前操作完成', 'warning');
        return;
      }

      if (!currentUserId) {
        showToast('请先选择操作人', 'warning');
        return;
      }

      if (action === 'REPORT_REPAIR') {
        currentRepairToolId = toolId;
        document.getElementById('repairModal').classList.add('active');
        document.getElementById('repairDescription').value = '';
        document.getElementById('repairDescription').focus();
        return;
      }

      await executeAction(toolId, action);
    }

    async function executeAction(toolId, action, description = null) {
      actionInProgress = true;
      updateSyncStatus('正在执行操作...', true);

      try {
        const response = await fetch(`${API_BASE}/api/tools/${toolId}/action`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, userId: currentUserId, description })
        });

        const result = await response.json();

        if (result.success) {
          showToast(result.message || '操作成功', 'success');
          await loadTools();
          await loadLogs();
        } else {
          showToast(result.error || '操作失败', 'error');
          
          if (result.currentTool) {
            const index = tools.findIndex(t => t.id === result.currentTool.id);
            if (index !== -1) {
              const { enrichToolWithDetails } = await import('./toolService.js').catch(() => ({}));
              tools[index] = result.currentTool;
              renderTools();
              renderStats();
            }
          }
          
          await loadTools();
          await loadLogs();
        }
      } catch (error) {
        console.error('操作失败:', error);
        showToast('网络错误，请稍后重试', 'error');
      } finally {
        actionInProgress = false;
        updateSyncStatus('数据已同步', false);
      }
    }

    function closeRepairModal() {
      document.getElementById('repairModal').classList.remove('active');
      currentRepairToolId = null;
    }

    async function confirmRepair() {
      const description = document.getElementById('repairDescription').value.trim();
      if (!description) {
        showToast('请填写故障描述', 'warning');
        return;
      }
      
      closeRepairModal();
      await executeAction(currentRepairToolId, 'REPORT_REPAIR', description);
    }

    async function loadLogs() {
      try {
        const result = await fetchAPI('/api/logs?limit=50');
        if (result.success) {
          logs = result.data;
          renderLogs();
        }
      } catch (error) {
        console.error('加载日志失败:', error);
      }
    }

    function renderLogs() {
      const list = document.getElementById('logsList');
      
      if (logs.length === 0) {
        list.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">暂无操作记录</p>';
        return;
      }

      list.innerHTML = logs.map(log => {
        const isError = log.message && log.message.includes('失败');
        return `
          <div class="log-item ${isError ? 'log-error' : 'log-success'}">
            <div class="log-time">${log.created_at} - ${log.user_name || '系统'}</div>
            <div class="log-content">
              <strong>${log.tool_name}</strong>: ${log.message || `${ACTION_LABELS[log.action] || log.action}`}
              ${log.old_status && log.new_status ? `(${STATUS_LABELS[log.old_status]} → ${STATUS_LABELS[log.new_status]})` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function refreshAll() {
      await Promise.all([loadTools(), loadLogs()]);
      showToast('数据已刷新', 'success');
    }

    async function refreshLogs() {
      await loadLogs();
      showToast('日志已刷新', 'success');
    }

    async function exportCSV() {
      try {
        window.location.href = `${API_BASE}/api/export/today`;
        showToast('正在导出...', 'info');
      } catch (error) {
        showToast('导出失败', 'error');
      }
    }

    async function init() {
      await Promise.all([loadUsers(), loadTools(), loadLogs()]);
      
      refreshInterval = setInterval(async () => {
        if (!actionInProgress) {
          await loadTools();
        }
      }, 5000);

      showToast('欢迎使用社区共享工具柜！请先选择操作人', 'info');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeRepairModal();
      }
    });

    document.getElementById('repairModal').addEventListener('click', (e) => {
      if (e.target.id === 'repairModal') {
        closeRepairModal();
      }
    });

    window.addEventListener('beforeunload', () => {
      if (refreshInterval) {
        clearInterval(refreshInterval);
      }
    });

    init();
  </script>
</body>
</html>
