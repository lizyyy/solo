[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weldscan-audit"
version = "0.1.0"
description = "Ultrasonic weld inspection result audit tool for steel structures"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "jinja2>=3.0",
  "pandas>=2.0",
  "numpy>=1.20",
]

[project.scripts]
weldscan-audit = "weldscan_audit.cli:main"

[tool.hatch.version]
source = "file"
path = "weldscan_audit/_version.py"
