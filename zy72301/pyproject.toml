[project]
name = "bayesian-sensitivity"
version = "0.1.0"
description = "贝叶斯先验敏感性试算：合并问卷原始行与边界值说明，生成可读误差说明，支持复核审计"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "typer>=0.9",
    "rich>=13.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
bayesian-sensitivity = "bayesian_sensitivity.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
