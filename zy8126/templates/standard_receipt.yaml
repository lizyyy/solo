name: standard_receipt
version: "1.0.0"
description: 标准 POS 小票模板
printerProfile: thermal_58mm

variables:
  - store_name
  - store_address
  - store_phone
  - cashier_name
  - transaction_id

elements:
  - type: text
    content: "欢迎光临"
    align: center
    bold: true
    doubleWidth: true

  - type: space
    lines: 1

  - type: text
    content: "示例便利店"
    align: center

  - type: text
    content: "北京市朝阳区建国路88号"
    align: center

  - type: text
    content: "电话: 010-12345678"
    align: center

  - type: line
    content: "-"

  - type: text
    content: "收银台: 01"
    align: left

  - type: text
    content: "收银员: 张三"
    align: left

  - type: text
    content: "日期: 2024-01-15 14:30:00"
    align: left

  - type: text
    content: "交易号: TXN001"
    align: left

  - type: line
    content: "="

  - type: table
    columns:
      - key: name
        width: 16
        align: left
      - key: qty
        width: 4
        align: right
      - key: price
        width: 6
        align: right
      - key: total
        width: 6
        align: right

  - type: line
    content: "-"

  - type: text
    content: "小计:                     159.80"
    align: right

  - type: text
    content: "税额:                      19.18"
    align: right

  - type: text
    content: "折扣:                      10.00"
    align: right

  - type: line
    content: "-"

  - type: text
    content: "总计:                     168.98"
    align: right
    bold: true
    doubleWidth: true

  - type: space
    lines: 1

  - type: text
    content: "支付方式: 微信支付"
    align: left

  - type: text
    content: "支付金额:                 200.00"
    align: right

  - type: text
    content: "找零:                      31.02"
    align: right

  - type: space
    lines: 2

  - type: barcode
    barcodeType: CODE128
    barcodeData: TXN00120240115

  - type: space
    lines: 1

  - type: text
    content: "感谢您的光临！"
    align: center

  - type: text
    content: "营业时间: 08:00 - 22:00"
    align: center

  - type: space
    lines: 2
