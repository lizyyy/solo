<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教研讲义管理工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>教研讲义管理工具</h1>
            <div class="header-actions">
                <button id="btn-import" class="btn btn-primary">导入讲义</button>
                <button id="btn-export" class="btn btn-secondary">导出数据</button>
                <button id="btn-check-all" class="btn btn-secondary">批量切线检查</button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="filter-section">
                    <h3>筛选条件</h3>
                    
                    <div class="filter-group">
                        <label>难度标签</label>
                        <select id="filter-difficulty">
                            <option value="all">全部</option>
                            <option value="missing">未设置</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>讲义状态</label>
                        <select id="filter-status">
                            <option value="all">全部</option>
                            <option value="active">正常</option>
                            <option value="withdrawn">已撤回</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>切线检查</label>
                        <select id="filter-check">
                            <option value="all">全部</option>
                            <option value="passed">通过</option>
                            <option value="failed">未通过</option>
                            <option value="pending">未检查</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>重复记录</label>
                        <select id="filter-duplicate">
                            <option value="all">全部</option>
                            <option value="yes">有重复</option>
                            <option value="no">无重复</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>缺少难度</label>
                        <select id="filter-missing-diff">
                            <option value="all">全部</option>
                            <option value="yes">缺少</option>
                            <option value="no">已设置</option>
                        </select>
                    </div>
                    
                    <button id="btn-apply-filter" class="btn btn-primary btn-block">应用筛选</button>
                    <button id="btn-reset-filter" class="btn btn-secondary btn-block">重置</button>
                </div>
                
                <div class="stats-section">
                    <h3>统计概览</h3>
                    <div class="stat-item">
                        <span class="stat-label">总计讲义</span>
                        <span id="stat-total" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">缺少难度</span>
                        <span id="stat-missing" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">存在重复</span>
                        <span id="stat-duplicate" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">检查未通过</span>
                        <span id="stat-failed" class="stat-value">0</span>
                    </div>
                </div>
            </aside>

            <main class="content">
                <div class="lecture-list" id="lecture-list">
                </div>
            </main>

            <aside class="detail-panel" id="detail-panel">
                <div class="detail-header">
                    <h2 id="detail-title">选择讲义查看详情</h2>
                    <button id="btn-close-detail" class="btn-close">&times;</button>
                </div>
                <div class="detail-content" id="detail-content">
                </div>
            </aside>
        </div>
    </div>

    <div class="modal" id="import-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>导入讲义</h3>
                <button class="btn-close" onclick="closeModal('import-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="import-form">
                    <div class="form-group">
                        <label>讲义标题 *</label>
                        <input type="text" id="import-title" required>
                    </div>
                    <div class="form-group">
                        <label>讲义截图</label>
                        <input type="file" id="import-screenshot" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>难度标签</label>
                        <select id="import-difficulty">
                            <option value="">（不设置）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>初始讲评内容</label>
                        <textarea id="import-commentary" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label>讲评教师</label>
                        <input type="text" id="import-teacher">
                    </div>
                </form>
                <div id="import-warnings" class="warnings"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('import-modal')">取消</button>
                <button class="btn btn-primary" id="btn-submit-import">导入</button>
            </div>
        </div>
    </div>

    <div class="modal" id="commentary-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加讲评记录</h3>
                <button class="btn-close" onclick="closeModal('commentary-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="commentary-form">
                    <div class="form-group">
                        <label>讲评内容 *</label>
                        <textarea id="commentary-content" rows="6" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>讲评教师</label>
                        <input type="text" id="commentary-teacher">
                    </div>
                </form>
                <div id="commentary-warnings" class="warnings"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('commentary-modal')">取消</button>
                <button class="btn btn-primary" id="btn-submit-commentary">添加</button>
            </div>
        </div>
    </div>

    <div class="modal" id="withdraw-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>撤回调讲</h3>
                <button class="btn-close" onclick="closeModal('withdraw-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>撤回理由 *</label>
                    <textarea id="withdraw-reason" rows="4" required></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('withdraw-modal')">取消</button>
                <button class="btn btn-danger" id="btn-submit-withdraw">确认撤回</button>
            </div>
        </div>
    </div>

    <div class="modal" id="revise-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>修正讲义</h3>
                <button class="btn-close" onclick="closeModal('revise-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="revise-form">
                    <div class="form-group">
                        <label>修正理由 *</label>
                        <input type="text" id="revise-reason" required>
                    </div>
                    <div class="form-group">
                        <label>新标题（不修改留空）</label>
                        <input type="text" id="revise-title">
                    </div>
                    <div class="form-group">
                        <label>新难度标签（不修改留空）</label>
                        <select id="revise-difficulty">
                            <option value="">（不修改）</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('revise-modal')">取消</button>
                <button class="btn btn-primary" id="btn-submit-revise">确认修正</button>
            </div>
        </div>
    </div>

    <div class="modal" id="export-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>导出数据</h3>
                <button class="btn-close" onclick="closeModal('export-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>导出格式</label>
                    <select id="export-format">
                        <option value="excel">Excel (.xlsx)</option>
                        <option value="csv">CSV (.csv)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="export-use-filter" checked>
                        使用当前筛选条件
                    </label>
                </div>
                <div id="export-result" class="export-result"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('export-modal')">取消</button>
                <button class="btn btn-primary" id="btn-submit-export">导出</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
