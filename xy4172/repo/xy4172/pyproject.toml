[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-lfs-migrator"
version = "0.1.0"
authors = [
  { name = "Git LFS Migration Team" }
]
description = "Git LFS 迁移预检员 - 给开源仓库维护者用的本地命令行工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "click>=8.0",
  "rich>=12.0",
  "pydantic>=2.0",
  "python-gitlab>=3.0",
]

[project.scripts]
git-lfs-migrator = "git_lfs_migrator.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["git_lfs_migrator*"]
