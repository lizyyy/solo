[project]
name = "delivery-inspector"
version = "0.1.0"
description = "本地交付验收巡检器 - 解析 README 命令并与实际配置核对"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0.0",
    "pyyaml>=6.0",
    "tomli>=2.0.1; python_version<'3.11'",
    "jsonschema>=4.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
delivery-inspector = "inspector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspector"]
