[project]
name = "toxicology-qc"
version = "0.1.0"
description = "法医毒物实验室质谱批次复核工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "click>=8.0",
]

[project.scripts]
toxicology-qc = "src.toxicology_qc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
