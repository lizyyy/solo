[project]
name = "specimen-tracker"
version = "1.0.0"
description = "标本流转防错台 - 医院病理科冰冻切片值班员工具"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
    "pytest>=7.4.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specimen_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
