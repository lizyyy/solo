[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-whitelist-inspection"
version = "0.1.0"
description = "网关配置快照白名单过期巡检 CLI"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "jinja2>=3.0",
]

[project.scripts]
gateway-whitelist-inspection = "gateway_whitelist_inspection.cli:main"
