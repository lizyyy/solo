<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物流面单代理API - 批次详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-badge { font-size: 0.75rem; }
        .card-header { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a href="/" class="navbar-brand mb-0 h1 text-decoration-none">物流面单代理API</a>
            <span class="navbar-text">批次详情</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">批次信息</h5>
                <span id="batchStatus"></span>
            </div>
            <div class="card-body" id="batchInfo">
                <div class="text-center py-3">加载中...</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">批次记录</h5>
                <button class="btn btn-sm btn-outline-primary" onclick="loadBatch()">刷新</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm table-hover mb-0">
                        <thead>
                            <tr>
                                <th>记录号</th>
                                <th>订单号</th>
                                <th>物流单号</th>
                                <th>收件人</th>
                                <th>状态</th>
                                <th>状态说明</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTable">
                            <tr><td colspan="8" class="text-center py-3">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api/v1';
        const batchId = {{ batch_id }};

        function getStatusBadge(status) {
            const badges = {
                'pending': 'bg-secondary',
                'processing': 'bg-info',
                'completed': 'bg-success',
                'partial_failed': 'bg-warning',
                'failed': 'bg-danger',
                'created': 'bg-secondary',
                'generating': 'bg-info',
                'generated': 'bg-primary',
                'printing': 'bg-info',
                'printed': 'bg-success',
                'exception': 'bg-warning',
                'cancelled': 'bg-dark'
            };
            const labels = {
                'pending': '待处理',
                'processing': '处理中',
                'completed': '已完成',
                'partial_failed': '部分失败',
                'failed': '失败',
                'created': '已创建',
                'generating': '生成中',
                'generated': '已生成',
                'printing': '打印中',
                'printed': '已打印',
                'exception': '异常',
                'cancelled': '已取消'
            };
            return `<span class="badge ${badges[status] || 'bg-secondary'} status-badge">${labels[status] || status}</span>`;
        }

        async function loadBatch() {
            try {
                const res = await fetch(`${API_BASE}/batches/${batchId}`);
                const batch = await res.json();

                document.getElementById('batchStatus').innerHTML = getStatusBadge(batch.status);

                document.getElementById('batchInfo').innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <table class="table table-sm">
                                <tr><th style="width: 30%">批次号</th><td>${batch.batch_no}</td></tr>
                                <tr><th>批次状态</th><td>${getStatusBadge(batch.status)}</td></tr>
                                <tr><th>仓库ID</th><td>${batch.warehouse_id}</td></tr>
                                <tr><th>渠道ID</th><td>${batch.channel_id}</td></tr>
                                <tr><th>模板ID</th><td>${batch.template_id || '-'}</td></tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <table class="table table-sm">
                                <tr><th style="width: 30%">记录总数</th><td>${batch.total_count}</td></tr>
                                <tr><th>成功数量</th><td><span class="text-success">${batch.success_count}</span></td></tr>
                                <tr><th>失败数量</th><td><span class="text-danger">${batch.failed_count}</span></td></tr>
                                <tr><th>创建时间</th><td>${new Date(batch.created_at).toLocaleString()}</td></tr>
                                <tr><th>完成时间</th><td>${batch.completed_at ? new Date(batch.completed_at).toLocaleString() : '-'}</td></tr>
                            </table>
                        </div>
                    </div>
                    ${batch.status === 'pending' ? `
                        <div class="text-center mt-3">
                            <button class="btn btn-success" onclick="processBatch()">处理批次</button>
                        </div>
                    ` : ''}
                `;

                const records = batch.records.sort((a, b) => a.id - b.id);
                if (records.length > 0) {
                    document.getElementById('recordsTable').innerHTML = records.map(r => `
                        <tr>
                            <td><a href="/record/${r.id}" class="text-decoration-none">${r.record_no}</a></td>
                            <td>${r.order_no || '-'}</td>
                            <td>${r.tracking_no || '-'}</td>
                            <td>${r.receiver_name || '-'}</td>
                            <td>${getStatusBadge(r.status)}</td>
                            <td><small>${r.status_reason || '-'}</small></td>
                            <td>${new Date(r.created_at).toLocaleString()}</td>
                            <td>
                                <a href="/record/${r.id}" class="btn btn-sm btn-outline-primary">详情</a>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    document.getElementById('recordsTable').innerHTML = '<tr><td colspan="8" class="text-center py-3">暂无记录</td></tr>';
                }
            } catch (e) {
                console.error('加载批次失败', e);
            }
        }

        async function processBatch() {
            try {
                const res = await fetch(`${API_BASE}/batches/${batchId}/process`, { method: 'POST' });
                if (res.ok) {
                    alert('批次处理完成！');
                    loadBatch();
                }
            } catch (e) {
                alert('处理批次失败: ' + e.message);
            }
        }

        loadBatch();
    </script>
</body>
</html>
