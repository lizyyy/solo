maxTokens: 8192

hardConstraints:
  mustInclude:
    - systemPrompt
    - userLastMessage
    - budgetConstraints
  
  mustNotExceed:
    conversations: 4000
    docs: 2000
    toolResults: 1500

priorityRules:
  budget: 100
  systemPrompt: 95
  recentMessages: 90
  userMessages: 85
  toolResults: 75
  docs: 60
  oldMessages: 30

summarizationRules:
  enabled: true
  minTokensForSummary: 1000
  summaryRatio: 0.3

riskThresholds:
  highRisk:
    lostSystemMessage: true
    lostRatio: 0.5
    criticalDataLost: true
  
  mediumRisk:
    lostRatio: 0.3

strategies:
  - name: 严格预算模式
    maxTokens: 2048
    priorityRules:
      budget: 100
      systemPrompt: 95
      recentMessages: 90
      userMessages: 80
      toolResults: 50
      docs: 30
      oldMessages: 10
  
  - name: 平衡模式
    maxTokens: 4096
    priorityRules:
      budget: 100
      systemPrompt: 90
      recentMessages: 85
      userMessages: 80
      toolResults: 70
      docs: 60
      oldMessages: 40
  
  - name: 扩展模式
    maxTokens: 16384
    priorityRules:
      budget: 100
      systemPrompt: 95
      recentMessages: 90
      userMessages: 85
      toolResults: 80
      docs: 75
      oldMessages: 60
