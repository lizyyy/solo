[project]
name = "log-mask-replay"
version = "0.1.0"
description = "日志脱敏回放盒 - 安全运营人员的日志脱敏、验证、回放和审计工具"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "cryptography>=41.0",
    "faker>=19.0",
    "rich>=13.0",
]

[project.scripts]
log-mask-replay = "log_mask_replay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["log_mask_replay"]
