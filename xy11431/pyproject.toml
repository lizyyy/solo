[project]
name = "lab-consumables-inspector"
version = "0.1.0"
description = "学校实验室耗材多源导入巡检CLI工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pandas>=1.5.0",
    "openpyxl>=3.0.0",
    "SQLAlchemy>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
lab-inspect = "lab_inspector.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
