server:
  port: 8080

spring:
  application:
    name: reefer-plugin-api
  datasource:
    url: jdbc:h2:mem:reeferdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.port.reefer: DEBUG
    org.hibernate.SQL: DEBUG
