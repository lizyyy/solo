[package]
name = "permguard"
version = "0.1.0"
edition = "2021"
description = "目录权限模板CLI - 扫描、对比、修复目录权限"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
walkdir = "2.5"
users = "0.11"
nix = { version = "0.29", features = ["user"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
thiserror = "1.0"
anyhow = "1.0"
libc = "0.2"

[[bin]]
name = "permguard"
path = "src/main.rs"
