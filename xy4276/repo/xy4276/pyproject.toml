[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln-analyzer"
version = "0.1.0"
authors = [
  { name="Ceramic Studio", email="studio@example.com" }
]
description = "窑炉烧成曲线复盘器 - 用于陶艺工作室的烧成曲线分析和复盘工具"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
]

[project.scripts]
kiln-analyzer = "kiln_analyzer.cli.main:main"
