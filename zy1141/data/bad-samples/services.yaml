services:
  - name: user-service
    version: 2.1.0
    description: 用户服务
    language: go
    contract_version: 2.1.0
    tags:
      - core
    endpoints:
      - method: POST
        path: /api/v1/users
        summary: 注册新用户
        operation_id: createUser
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - username
                - email
                - password
                - phone
              properties:
                username:
                  type: string
                  min_length: 6
                  max_length: 20
                email:
                  type: string
                  format: email
                password:
                  type: string
                  min_length: 12
                phone:
                  type: string
        responses:
          - status_code: "201"
            description: 用户创建成功

  - name: order-service
    version: 1.3.2
    description: 订单服务
    language: go
    contract_version: 1.3.0
    tags:
      - core
    endpoints:
      - method: POST
        path: /api/v1/orders
        summary: 创建订单
        operation_id: createOrder
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - user_id
                - items
                - address
              properties:
                user_id:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                address:
                  type: string
        responses:
          - status_code: "201"
            description: 订单创建成功
      - method: GET
        path: /api/v1/orders/{id}
        summary: 获取订单详情
        operation_id: getOrder
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
        responses:
          - status_code: "200"
            description: 订单详情

  - name: product-service
    version: 3.0.1
    description: 商品服务
    language: go
    contract_version: 3.0.0
    tags:
      - core
    endpoints:
      - method: GET
        path: /api/v1/products/{id}
        summary: 获取商品详情
        operation_id: getProduct
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
        responses:
          - status_code: "200"
            description: 商品详情
      - method: POST
        path: /api/v1/inventory/update
        summary: 更新库存
        operation_id: updateInventory
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - product_id
                - delta
              properties:
                product_id:
                  type: string
                delta:
                  type: integer
        responses:
          - status_code: "200"
            description: 库存更新成功
      - method: GET
        path: /api/v1/legacy/deprecated
        summary: 已废弃接口
        operation_id: legacyEndpoint
        deprecated: true
        parameters:
          - name: id
            in: query
            required: true
            schema:
              type: string
        responses:
          - status_code: "200"
            description: 响应

  - name: payment-service
    version: 2.0.0
    description: 支付服务
    language: java
    contract_version: 2.0.0
    tags:
      - core
    endpoints:
      - method: POST
        path: /api/v1/payments
        summary: 创建支付
        operation_id: createPayment
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - order_id
                - amount
              properties:
                order_id:
                  type: string
                amount:
                  type: number
                  minimum: 0.01
        responses:
          - status_code: "201"
            description: 支付创建成功

  - name: notification-service
    version: 1.1.0
    description: 通知服务
    language: python
    contract_version: 1.1.0
    tags:
      - support
    endpoints:
      - method: POST
        path: /api/v1/notifications/sms
        summary: 发送短信
        operation_id: sendSMS
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - phone
                - template_code
              properties:
                phone:
                  type: string
                template_code:
                  type: string
        responses:
          - status_code: "200"
            description: 发送成功

  - name: config-service
    version: 1.0.0
    description: 配置服务
    language: go
    contract_version: 1.0.0
    tags:
      - infrastructure
    endpoints:
      - method: GET
        path: /api/v1/config/{key}
        summary: 获取配置
        operation_id: getConfig
        parameters:
          - name: key
            in: path
            required: true
            schema:
              type: string
        responses:
          - status_code: "200"
            description: 配置值

  - name: cache-service
    version: 1.0.0
    description: 缓存服务
    language: go
    contract_version: 1.0.0
    tags:
      - infrastructure
    endpoints:
      - method: GET
        path: /api/v1/cache/{key}
        summary: 获取缓存
        operation_id: getCache
        parameters:
          - name: key
            in: path
            required: true
            schema:
              type: string
        responses:
          - status_code: "200"
            description: 缓存值
      - method: POST
        path: /api/v1/cache/{key}
        summary: 设置缓存
        operation_id: setCache
        parameters:
          - name: key
            in: path
            required: true
            schema:
              type: string
          - name: request
            in: body
            required: true
            schema:
              type: object
              properties:
                value:
                  type: string
                ttl:
                  type: integer
        responses:
          - status_code: "200"
            description: 设置成功
