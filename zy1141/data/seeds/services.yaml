services:
  - name: user-service
    version: 2.1.0
    description: 用户服务 - 处理用户注册、登录、个人信息管理
    language: go
    repository: git@github.com:example/user-service.git
    openapi_spec: openapi/user-service.yaml
    contract_version: 2.1.0
    tags:
      - core
      - authentication
    endpoints:
      - method: POST
        path: /api/v1/users
        summary: 注册新用户
        operation_id: createUser
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  min_length: 3
                  max_length: 50
                email:
                  type: string
                  format: email
                password:
                  type: string
                  min_length: 8
        responses:
          - status_code: "201"
            description: 用户创建成功
      - method: POST
        path: /api/v1/users/login
        summary: 用户登录
        operation_id: loginUser
        deprecated: false
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
        responses:
          - status_code: "200"
            description: 登录成功
      - method: GET
        path: /api/v1/users/{id}
        summary: 获取用户信息
        operation_id: getUser
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
        responses:
          - status_code: "200"
            description: 用户信息
      - method: PUT
        path: /api/v1/users/{id}
        summary: 更新用户信息
        operation_id: updateUser
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
          - name: request
            in: body
            required: true
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
        responses:
          - status_code: "200"
            description: 更新成功

  - name: order-service
    version: 1.3.2
    description: 订单服务 - 处理订单创建、支付、查询
    language: go
    repository: git@github.com:example/order-service.git
    openapi_spec: openapi/order-service.yaml
    contract_version: 1.3.0
    tags:
      - core
      - transaction
    endpoints:
      - method: POST
        path: /api/v1/orders
        summary: 创建订单
        operation_id: createOrder
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - user_id
                - items
              properties:
                user_id:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
        responses:
          - status_code: "201"
            description: 订单创建成功
      - method: GET
        path: /api/v1/orders/{id}
        summary: 获取订单详情
        operation_id: getOrder
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
        responses:
          - status_code: "200"
            description: 订单详情
      - method: GET
        path: /api/v1/orders
        summary: 查询订单列表
        operation_id: listOrders
        deprecated: false
        parameters:
          - name: user_id
            in: query
            required: false
            schema:
              type: string
          - name: status
            in: query
            required: false
            schema:
              type: string
              enum:
                - pending
                - paid
                - shipped
                - delivered
                - cancelled
        responses:
          - status_code: "200"
            description: 订单列表
      - method: POST
        path: /api/v1/orders/{id}/pay
        summary: 支付订单
        operation_id: payOrder
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - payment_method
              properties:
                payment_method:
                  type: string
                  enum:
                    - wechat
                    - alipay
                    - credit_card
        responses:
          - status_code: "200"
            description: 支付成功

  - name: product-service
    version: 3.0.1
    description: 商品服务 - 商品管理、库存、价格
    language: go
    repository: git@github.com:example/product-service.git
    openapi_spec: openapi/product-service.yaml
    contract_version: 3.0.0
    tags:
      - core
    endpoints:
      - method: GET
        path: /api/v1/products/{id}
        summary: 获取商品详情
        operation_id: getProduct
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
        responses:
          - status_code: "200"
            description: 商品详情
      - method: GET
        path: /api/v1/products
        summary: 搜索商品
        operation_id: searchProducts
        parameters:
          - name: keyword
            in: query
            required: false
            schema:
              type: string
          - name: category
            in: query
            required: false
            schema:
              type: string
          - name: page
            in: query
            required: false
            schema:
              type: integer
              minimum: 1
          - name: size
            in: query
            required: false
            schema:
              type: integer
              minimum: 1
              maximum: 100
        responses:
          - status_code: "200"
            description: 商品列表
      - method: POST
        path: /api/v1/products
        summary: 创建商品
        operation_id: createProduct
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - name
                - price
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  minimum: 0
                stock:
                  type: integer
                  minimum: 0
        responses:
          - status_code: "201"
            description: 商品创建成功
      - method: PATCH
        path: /api/v1/products/{id}/stock
        summary: 更新库存
        operation_id: updateStock
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - delta
              properties:
                delta:
                  type: integer
        responses:
          - status_code: "200"
            description: 库存更新成功

  - name: payment-service
    version: 2.0.0
    description: 支付服务 - 处理支付、退款、对账
    language: java
    repository: git@github.com:example/payment-service.git
    openapi_spec: openapi/payment-service.yaml
    contract_version: 2.0.0
    tags:
      - core
      - transaction
    endpoints:
      - method: POST
        path: /api/v1/payments
        summary: 创建支付
        operation_id: createPayment
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - order_id
                - amount
                - method
              properties:
                order_id:
                  type: string
                amount:
                  type: number
                  minimum: 0.01
                method:
                  type: string
                  enum:
                    - wechat
                    - alipay
                    - credit_card
        responses:
          - status_code: "201"
            description: 支付创建成功
      - method: GET
        path: /api/v1/payments/{id}
        summary: 查询支付状态
        operation_id: getPayment
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
        responses:
          - status_code: "200"
            description: 支付详情
      - method: POST
        path: /api/v1/payments/{id}/refund
        summary: 申请退款
        operation_id: refundPayment
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
          - name: request
            in: body
            required: true
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 0.01
                reason:
                  type: string
        responses:
          - status_code: "200"
            description: 退款申请成功

  - name: notification-service
    version: 1.1.0
    description: 通知服务 - 发送短信、邮件、推送
    language: python
    repository: git@github.com:example/notification-service.git
    openapi_spec: openapi/notification-service.yaml
    contract_version: 1.1.0
    tags:
      - support
    endpoints:
      - method: POST
        path: /api/v1/notifications/sms
        summary: 发送短信
        operation_id: sendSMS
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - phone
                - template_code
              properties:
                phone:
                  type: string
                template_code:
                  type: string
                params:
                  type: object
        responses:
          - status_code: "200"
            description: 发送成功
      - method: POST
        path: /api/v1/notifications/email
        summary: 发送邮件
        operation_id: sendEmail
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - to
                - subject
                - template_code
              properties:
                to:
                  type: string
                subject:
                  type: string
                template_code:
                  type: string
                params:
                  type: object
        responses:
          - status_code: "200"
            description: 发送成功
      - method: POST
        path: /api/v1/notifications/push
        summary: 发送推送
        operation_id: sendPush
        parameters:
          - name: request
            in: body
            required: true
            schema:
              type: object
              required:
                - user_id
                - title
              properties:
                user_id:
                  type: string
                title:
                  type: string
                body:
                  type: string
                data:
                  type: object
        responses:
          - status_code: "200"
            description: 发送成功

  - name: analytics-service
    version: 1.0.0
    description: 数据分析服务 - 报表、统计、BI
    language: python
    repository: git@github.com:example/analytics-service.git
    openapi_spec: openapi/analytics-service.yaml
    contract_version: 1.0.0
    tags:
      - analytics
    endpoints:
      - method: GET
        path: /api/v1/reports/sales
        summary: 销售报表
        operation_id: getSalesReport
        parameters:
          - name: start_date
            in: query
            required: true
            schema:
              type: string
              format: date
          - name: end_date
            in: query
            required: true
            schema:
              type: string
              format: date
          - name: group_by
            in: query
            required: false
            schema:
              type: string
              enum:
                - day
                - week
                - month
        responses:
          - status_code: "200"
            description: 销售报表数据
      - method: GET
        path: /api/v1/metrics/orders
        summary: 订单指标
        operation_id: getOrderMetrics
        parameters:
          - name: time_range
            in: query
            required: false
            schema:
              type: string
              enum:
                - today
                - yesterday
                - last_7_days
                - last_30_days
        responses:
          - status_code: "200"
            description: 订单指标数据
