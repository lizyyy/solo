<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时在线状态审计系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #00d4ff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #0f3460; }
        .card h2 { color: #e94560; margin-bottom: 15px; font-size: 18px; }
        .full-width { grid-column: 1 / -1; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s; margin: 5px; }
        .btn-primary { background: #00d4ff; color: #1a1a2e; }
        .btn-success { background: #00ff88; color: #1a1a2e; }
        .btn-warning { background: #ffaa00; color: #1a1a2e; }
        .btn-danger { background: #e94560; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .input-group { margin: 10px 0; }
        .input-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .input-group input, .input-group select { width: 100%; padding: 10px; background: #0f3460; border: 1px solid #1a1a2e; border-radius: 6px; color: white; }
        .table-container { overflow-x: auto; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #0f3460; }
        th { background: #0f3460; color: #00d4ff; position: sticky; top: 0; }
        tr:hover { background: rgba(0, 212, 255, 0.1); }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-high { background: #e94560; }
        .badge-medium { background: #ffaa00; color: #1a1a2e; }
        .badge-low { background: #00ff88; color: #1a1a2e; }
        .badge-pending { background: #ffaa00; color: #1a1a2e; }
        .badge-resolved { background: #00ff88; color: #1a1a2e; }
        .badge-connected { background: #00ff88; color: #1a1a2e; }
        .badge-disconnected { background: #e94560; }
        .status-display { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 15px; }
        .status-item { text-align: center; padding: 15px; background: #0f3460; border-radius: 8px; min-width: 100px; }
        .status-item .number { font-size: 28px; font-weight: bold; color: #00d4ff; }
        .status-item .label { font-size: 12px; color: #aaa; }
        .history-timeline { max-height: 300px; overflow-y: auto; }
        .timeline-item { padding: 10px; border-left: 3px solid #00d4ff; margin: 10px 0; padding-left: 15px; background: rgba(0, 212, 255, 0.05); }
        .timeline-time { font-size: 11px; color: #888; }
        .timeline-action { font-weight: 600; color: #00d4ff; }
        .log-panel { max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 11px; }
        .log-item { padding: 5px; border-bottom: 1px solid #0f3460; }
        .log-success { color: #00ff88; }
        .log-error { color: #e94560; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab { padding: 8px 16px; background: #0f3460; border: none; color: #aaa; cursor: pointer; border-radius: 6px 6px 0 0; }
        .tab.active { background: #16213e; color: #00d4ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 实时在线状态审计系统</h1>
        
        <div class="grid">
            <div class="card">
                <h2>📊 状态概览</h2>
                <div class="status-display">
                    <div class="status-item">
                        <div class="number" id="onlineCount">0</div>
                        <div class="label">在线用户</div>
                    </div>
                    <div class="status-item">
                        <div class="number" id="sessionCount">0</div>
                        <div class="label">连接会话</div>
                    </div>
                    <div class="status-item">
                        <div class="number" id="anomalyCount">0</div>
                        <div class="label">待处理异常</div>
                    </div>
                    <div class="status-item">
                        <div class="number" id="heartbeatCount">0</div>
                        <div class="label">心跳总数</div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="refreshAll()">🔄 刷新状态</button>
                <button class="btn btn-warning" onclick="checkDisconnections()">⚠️ 检测断线</button>
            </div>

            <div class="card">
                <h2>🎮 连接控制</h2>
                <div class="input-group">
                    <label>用户ID</label>
                    <input type="text" id="userId" value="user_001">
                </div>
                <div class="input-group">
                    <label>房间ID</label>
                    <input type="text" id="roomId" value="room_doc_123">
                </div>
                <div class="input-group">
                    <label>设备类型</label>
                    <select id="deviceType">
                        <option value="web">Web浏览器</option>
                        <option value="mobile">移动端</option>
                        <option value="desktop">桌面客户端</option>
                    </select>
                </div>
                <button class="btn btn-success" onclick="connect()">🔗 连接</button>
                <button class="btn btn-primary" onclick="sendHeartbeat()">💓 发送心跳</button>
                <button class="btn btn-danger" onclick="disconnect()">⏹️ 断开连接</button>
            </div>

            <div class="card full-width">
                <h2>🚨 异常队列</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>类型</th>
                                <th>严重程度</th>
                                <th>用户/房间</th>
                                <th>描述</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="anomalyTable"></tbody>
                    </table>
                </div>
            </div>

            <div class="card full-width">
                <h2>📋 连接会话</h2>
                <div class="input-group" style="display: inline-block; width: 200px; margin-right: 10px;">
                    <label>筛选状态</label>
                    <select id="sessionFilter" onchange="loadSessions()">
                        <option value="">全部</option>
                        <option value="connected">已连接</option>
                        <option value="disconnected">已断开</option>
                        <option value="merged">已合并</option>
                    </select>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>会话ID</th>
                                <th>用户</th>
                                <th>房间</th>
                                <th>状态</th>
                                <th>连接时间</th>
                                <th>断开原因</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="sessionTable"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2>📜 历史轨迹</h2>
                <div class="input-group">
                    <label>选择会话查看历史</label>
                    <select id="historySessionId" onchange="loadHistory()">
                        <option value="">请选择会话</option>
                    </select>
                </div>
                <div class="history-timeline" id="historyTimeline">
                    <p style="color: #888;">选择会话查看详细历史轨迹</p>
                </div>
            </div>

            <div class="card">
                <h2>📸 在线快照</h2>
                <div class="input-group">
                    <label>房间ID</label>
                    <input type="text" id="snapshotRoomId" value="room_doc_123">
                </div>
                <button class="btn btn-primary" onclick="loadSnapshots()">查看快照</button>
                <div class="table-container" style="margin-top: 15px;">
                    <table>
                        <thead>
                            <tr>
                                <th>快照时间</th>
                                <th>在线人数</th>
                            </tr>
                        </thead>
                        <tbody id="snapshotTable"></tbody>
                    </table>
                </div>
            </div>

            <div class="card full-width">
                <h2>📤 审计导出</h2>
                <div style="display: flex; gap: 15px; align-items: end; flex-wrap: wrap;">
                    <div class="input-group" style="width: 180px;">
                        <label>房间ID (可选)</label>
                        <input type="text" id="exportRoomId">
                    </div>
                    <div class="input-group" style="width: 180px;">
                        <label>用户ID (可选)</label>
                        <input type="text" id="exportUserId">
                    </div>
                    <button class="btn btn-success" onclick="exportAudit()">📥 导出审计数据</button>
                </div>
            </div>

            <div class="card full-width">
                <h2>📝 审计日志</h2>
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('audit')">审计日志</button>
                    <button class="tab" onclick="switchTab('api')">API响应</button>
                </div>
                <div id="auditTab" class="tab-content active">
                    <div class="log-panel" id="auditLogPanel"></div>
                </div>
                <div id="apiTab" class="tab-content">
                    <div class="log-panel" id="apiLogPanel"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
