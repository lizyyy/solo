<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>民办幼儿园缴费减免台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .nav-item.active {
      background-color: #3b82f6;
      color: white;
    }
    .modal-overlay {
      background-color: rgba(0, 0, 0, 0.5);
    }
    .status-pending { color: #dc2626; }
    .status-partial { color: #f59e0b; }
    .status-paid { color: #16a34a; }
    .bg-pending { background-color: #fef2f2; }
    .bg-partial { background-color: #fffbeb; }
    .bg-paid { background-color: #f0fdf4; }
    .border-pending { border-color: #fecaca; }
    .border-partial { border-color: #fde68a; }
    .border-paid { border-color: #bbf7d0; }
    .formula-box {
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      line-height: 1.8;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="app">
    <header class="bg-blue-600 text-white shadow-lg">
      <div class="container mx-auto px-4 py-4">
        <h1 class="text-2xl font-bold">🏫 民办幼儿园缴费减免台</h1>
        <p class="text-blue-200 text-sm mt-1">学生档案 · 班级管理 · 账单核算 · 缴费减免</p>
      </div>
    </header>

    <div class="container mx-auto px-4 py-6 flex gap-6">
      <nav class="w-56 flex-shrink-0">
        <div class="bg-white rounded-lg shadow p-2 space-y-1">
          <button onclick="showSection('dashboard')" class="nav-item active w-full text-left px-4 py-2 rounded hover:bg-gray-100">
            📊 数据概览
          </button>
          <button onclick="showSection('bills')" class="nav-item w-full text-left px-4 py-2 rounded hover:bg-gray-100">
            📋 账单列表
          </button>
          <button onclick="showSection('students')" class="nav-item w-full text-left px-4 py-2 rounded hover:bg-gray-100">
            👶 学生管理
          </button>
          <button onclick="showSection('classes')" class="nav-item w-full text-left px-4 py-2 rounded hover:bg-gray-100">
            🏠 班级管理
          </button>
          <button onclick="showSection('payments')" class="nav-item w-full text-left px-4 py-2 rounded hover:bg-gray-100">
            💰 付款记录
          </button>
          <button onclick="showSection('arrears')" class="nav-item w-full text-left px-4 py-2 rounded hover:bg-gray-100">
            ⚠️ 欠费提醒
          </button>
          <button onclick="showSection('leaves')" class="nav-item w-full text-left px-4 py-2 rounded hover:bg-gray-100">
            📅 请假记录
          </button>
          <button onclick="showSection('approvals')" class="nav-item w-full text-left px-4 py-2 rounded hover:bg-gray-100">
            ✅ 减免审批
          </button>
        </div>
      </nav>

      <main class="flex-1">
        <section id="dashboard" class="section">
          <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-bold">📊 数据概览</h2>
              <div class="flex gap-2">
                <select id="dashboardYear" class="border rounded px-3 py-2" onchange="loadDashboard()">
                </select>
                <select id="dashboardMonth" class="border rounded px-3 py-2" onchange="loadDashboard()">
                </select>
              </div>
            </div>
            <div id="dashboardContent"></div>
          </div>

          <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-bold mb-4">🧪 示例场景演示</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
              <button onclick="demoScenario('normal')" class="bg-green-100 hover:bg-green-200 border-2 border-green-300 rounded-lg p-4 text-left">
                <div class="text-2xl mb-2">✅</div>
                <div class="font-bold text-green-700">正常缴费</div>
                <div class="text-sm text-green-600">完整月份，无请假</div>
              </button>
              <button onclick="demoScenario('leave')" class="bg-yellow-100 hover:bg-yellow-200 border-2 border-yellow-300 rounded-lg p-4 text-left">
                <div class="text-2xl mb-2">🏖️</div>
                <div class="font-bold text-yellow-700">请假减免</div>
                <div class="text-sm text-yellow-600">请假天数减免餐费</div>
              </button>
              <button onclick="demoScenario('transfer')" class="bg-blue-100 hover:bg-blue-200 border-2 border-blue-300 rounded-lg p-4 text-left">
                <div class="text-2xl mb-2">🚪</div>
                <div class="font-bold text-blue-700">月中插班</div>
                <div class="text-sm text-blue-600">按实际天数收费</div>
              </button>
              <button onclick="demoScenario('withdraw')" class="bg-red-100 hover:bg-red-200 border-2 border-red-300 rounded-lg p-4 text-left">
                <div class="text-2xl mb-2">👋</div>
                <div class="font-bold text-red-700">退园退款</div>
                <div class="text-sm text-red-600">月中退园按天结算</div>
              </button>
            </div>
          </div>
        </section>

        <section id="bills" class="section hidden">
          <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-bold">📋 账单列表</h2>
              <div class="flex gap-2">
                <select id="billsYear" class="border rounded px-3 py-2" onchange="loadBills()"></select>
                <select id="billsMonth" class="border rounded px-3 py-2" onchange="loadBills()"></select>
                <select id="billsStatus" class="border rounded px-3 py-2" onchange="loadBills()">
                  <option value="">全部状态</option>
                  <option value="pending">待缴费</option>
                  <option value="partial">部分缴费</option>
                  <option value="paid">已结清</option>
                </select>
                <select id="billsClass" class="border rounded px-3 py-2" onchange="loadBills()">
                  <option value="">全部班级</option>
                </select>
                <button onclick="generateBills()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                  🔄 生成账单
                </button>
                <button onclick="exportBills()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
                  📥 导出Excel
                </button>
              </div>
            </div>
            <div id="billsContent"></div>
          </div>
        </section>

        <section id="students" class="section hidden">
          <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-bold">👶 学生管理</h2>
              <div class="flex gap-2">
                <select id="studentsClass" class="border rounded px-3 py-2" onchange="loadStudents()">
                  <option value="">全部班级</option>
                </select>
                <select id="studentsStatus" class="border rounded px-3 py-2" onchange="loadStudents()">
                  <option value="">全部状态</option>
                  <option value="active">在读</option>
                  <option value="withdrawn">已退园</option>
                </select>
                <button onclick="showAddStudentModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                  ➕ 添加学生
                </button>
              </div>
            </div>
            <div id="studentsContent"></div>
          </div>
        </section>

        <section id="classes" class="section hidden">
          <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-bold">🏠 班级管理</h2>
              <button onclick="showAddClassModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                ➕ 添加班级
              </button>
            </div>
            <div id="classesContent"></div>
          </div>
        </section>

        <section id="payments" class="section hidden">
          <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-bold mb-6">💰 付款记录</h2>
            <div id="paymentsContent"></div>
          </div>
        </section>

        <section id="arrears" class="section hidden">
          <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-bold">⚠️ 欠费提醒</h2>
              <div class="flex gap-2">
                <select id="arrearsYear" class="border rounded px-3 py-2" onchange="loadArrears()"></select>
                <select id="arrearsMonth" class="border rounded px-3 py-2" onchange="loadArrears()"></select>
              </div>
            </div>
            <div id="arrearsContent"></div>
          </div>
        </section>

        <section id="leaves" class="section hidden">
          <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-bold">📅 请假记录</h2>
              <button onclick="showAddLeaveModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                ➕ 请假登记
              </button>
            </div>
            <div id="leavesContent"></div>
          </div>
        </section>

        <section id="approvals" class="section hidden">
          <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-bold">✅ 减免审批</h2>
              <div class="flex gap-2">
                <select id="approvalsStatus" class="border rounded px-3 py-2" onchange="loadApprovals()">
                  <option value="">全部</option>
                  <option value="pending">待审批</option>
                  <option value="approved">已通过</option>
                  <option value="rejected">已拒绝</option>
                </select>
                <button onclick="showAddApprovalModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                  ➕ 申请减免
                </button>
              </div>
            </div>
            <div id="approvalsContent"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="modalContainer"></div>

  <script src="/app.js"></script>
</body>
</html>
