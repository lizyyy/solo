[tool.poetry]
name = "dead-config-scanner"
version = "0.1.0"
description = "死配置扫描命令行工具 - 检测失效链接和废弃配置"
authors = ["Your Name"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.0"
requests = "^2.31.0"
pydantic = "^2.0"
python-dotenv = "^1.0"
rich = "^13.0"
sqlalchemy = "^2.0"
aiohttp = "^3.9"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dcs = "dead_config_scanner.cli:cli"
