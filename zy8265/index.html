<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博物馆夜间文物搬运</title>
  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
  <div class="game-container" id="game-container">
    <div class="header">
      <h1>🏛️ 博物馆夜间文物搬运</h1>
      <p>指挥搬运员将文物箱推到临时库房，避开危险区域！</p>
    </div>

    <div class="game-info">
      <div class="level-info">
        <div class="level-name" id="level-name">第一关：入门展厅</div>
        <div class="level-desc" id="level-desc">简单关卡，熟悉操作</div>
      </div>
      <div class="score-info">
        <div class="score-label">当前分数</div>
        <div class="score-value" id="score-value">1000</div>
      </div>
    </div>

    <div class="game-board">
      <div class="grid-container" id="grid-container">
      </div>
    </div>

    <div class="controls">
      <h3>🎮 操作说明</h3>
      <div class="key-hints">
        <div class="key-hint">
          <span class="key">↑</span>
          <span class="key-label">或 W - 上移</span>
        </div>
        <div class="key-hint">
          <span class="key">↓</span>
          <span class="key-label">或 S - 下移</span>
        </div>
        <div class="key-hint">
          <span class="key">←</span>
          <span class="key-label">或 A - 左移</span>
        </div>
        <div class="key-hint">
          <span class="key">→</span>
          <span class="key-label">或 D - 右移</span>
        </div>
        <div class="key-hint">
          <span class="key">R</span>
          <span class="key-label">重新开始当前关卡</span>
        </div>
      </div>
      <div class="buttons">
        <button class="btn btn-primary" id="restart-btn">🔄 重新开始</button>
      </div>
    </div>

    <div class="legend">
      <div class="legend-items">
        <div class="legend-item">
          <div class="legend-color" style="background: #2d2d44; border: 1px solid rgba(255,255,255,0.1);"></div>
          <span class="legend-label">普通地板</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #1a1a2e; border: 2px solid #333;"></div>
          <span class="legend-label">墙壁</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #1e3a5f; border: 2px solid #2196F3;"></div>
          <span class="legend-label">💧 湿度超标区 (违规)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #3d1f1f; border: 2px solid #f44336;"></div>
          <span class="legend-label">🚨 巡检路线 (违规)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #1f3d1f; border: 2px solid #4CAF50;"></div>
          <span class="legend-label">📦 临时库房 (目标)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #3d3d1f; border: 2px solid #FFC107;"></div>
          <span class="legend-label">🛗 电梯 (限重)</span>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="game-over-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">🎉 关卡完成！</h2>
      </div>
      
      <div class="grade-display">
        <div class="grade-badge" id="grade-badge">S</div>
        <div class="grade-label" id="grade-label">完美</div>
      </div>

      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-item-label">最终得分</div>
          <div class="summary-item-value" id="summary-score">1000</div>
        </div>
        <div class="summary-item">
          <div class="summary-item-label">移动次数</div>
          <div class="summary-item-value" id="summary-moves">0</div>
        </div>
        <div class="summary-item">
          <div class="summary-item-label">推箱次数</div>
          <div class="summary-item-value" id="summary-pushes">0</div>
        </div>
        <div class="summary-item">
          <div class="summary-item-label">完成进度</div>
          <div class="summary-item-value" id="summary-boxes">0/0</div>
        </div>
      </div>

      <div class="violations-section">
        <h3>📋 违规记录</h3>
        <div class="violations-list" id="violations-list">
        </div>
      </div>

      <div class="modal-buttons">
        <button class="btn btn-primary" id="modal-restart-btn">🔄 重新开始</button>
        <button class="btn btn-primary" id="modal-next-level-btn">➡️ 下一关</button>
        <button class="btn btn-secondary" id="modal-new-game-btn">🏠 返回第一关</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
