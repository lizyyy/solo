[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trail-checker"
version = "0.1.0"
description = "越野跑赛事数据校验CLI工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
trail-checker = "trail_checker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["trail_checker"]

[tool.ruff]
line-length = 100
target-version = "py39"
