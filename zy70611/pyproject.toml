[tool.poetry]
name = "washer-troubleshooter"
version = "0.1.0"
description = "洗衣机启动失败支付核验退款结论排查CLI工具"
authors = ["Your Name <your@email.com>"]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.0"
pydantic = "^2.0"
python-dateutil = "^2.8"
tabulate = "^0.9"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
washer-ts = "washer_ts.cli:main"
