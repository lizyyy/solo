[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sample-tagger"
version = "0.1.0"
description = "采样音色标签器 - 自动标注鼓、贝斯、环境声和可疑噪声"
requires-python = ">=3.10"
dependencies = [
  "click>=8.0.0",
  "numpy>=1.24.0",
  "librosa>=0.10.0",
  "pydub>=0.25.0",
  "soundfile>=0.12.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "tqdm>=4.65.0",
]

[project.scripts]
sample-tagger = "sample_tagger.cli:cli"

[tool.hatch.version]
path = "sample_tagger/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
