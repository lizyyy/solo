[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "four-flow-verifier"
version = "0.1.0"
description = "财务共享中心四流一致性复核工具"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.scripts]
four-flow = "four_flow_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["."]
