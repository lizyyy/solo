<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声波迷宫救援队 - 物理实验平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>🔊 声波迷宫救援队</h1>
            <div class="header-stats">
                <span id="turn-display">回合: 1</span>
                <span id="score-display">分数: 0</span>
                <span id="risk-display" class="risk-low">风险: 低</span>
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar left-sidebar">
                <div class="panel">
                    <h3>📦 资源</h3>
                    <div class="resource-item">
                        <span class="resource-label">声波脉冲</span>
                        <div class="resource-bar">
                            <div id="sound-pulses-bar" class="resource-fill sound"></div>
                        </div>
                        <span id="sound-pulses-value">5 / 10</span>
                    </div>
                    <div class="resource-item">
                        <span class="resource-label">能量</span>
                        <div class="resource-bar">
                            <div id="energy-bar" class="resource-fill energy"></div>
                        </div>
                        <span id="energy-value">100 / 100</span>
                    </div>
                    <div class="resource-item">
                        <span class="resource-label">时间单位</span>
                        <div class="resource-bar">
                            <div id="time-units-bar" class="resource-fill time"></div>
                        </div>
                        <span id="time-units-value">60 / 60</span>
                    </div>
                </div>

                <div class="panel">
                    <h3>🎮 操作</h3>
                    <div class="action-buttons">
                        <button id="btn-move-up" class="action-btn move-btn">↑ 上移</button>
                        <div class="move-row">
                            <button id="btn-move-left" class="action-btn move-btn">← 左移</button>
                            <button id="btn-sound-pulse" class="action-btn sound-btn">🔊 发声波</button>
                            <button id="btn-move-right" class="action-btn move-btn">右移 →</button>
                        </div>
                        <button id="btn-move-down" class="action-btn move-btn">↓ 下移</button>
                    </div>
                    <div class="sound-controls">
                        <label>发射角度: <span id="angle-value">0°</span></label>
                        <input type="range" id="angle-slider" min="0" max="360" value="0" step="15">
                        <label>脉冲强度: <span id="intensity-value">100%</span></label>
                        <input type="range" id="intensity-slider" min="20" max="100" value="100" step="10">
                    </div>
                </div>

                <div class="panel">
                    <h3>📥 数据输入</h3>
                    <button id="btn-import-json" class="action-btn import-btn">导入JSON数据</button>
                    <button id="btn-add-walls" class="action-btn">添加墙体</button>
                    <button id="btn-add-sound-source" class="action-btn">添加声源</button>
                    <button id="btn-add-target" class="action-btn">添加救援目标</button>
                    <input type="file" id="file-input" accept=".json" style="display: none;">
                </div>
            </aside>

            <main class="game-area">
                <div class="canvas-container">
                    <canvas id="game-canvas" width="600" height="600"></canvas>
                    <div id="echo-overlay" class="echo-overlay hidden">
                        <div class="echo-content">
                            <h3>回声分析</h3>
                            <div id="echo-results"></div>
                            <button id="btn-close-echo" class="action-btn">关闭</button>
                        </div>
                    </div>
                    <div id="error-overlay" class="error-overlay hidden">
                        <div class="error-content">
                            <h3>⚠️ 检测到错误</h3>
                            <div id="error-list"></div>
                            <div class="error-actions">
                                <button id="btn-confirm-errors" class="action-btn confirm-btn">确认并继续</button>
                                <button id="btn-cancel-action" class="action-btn cancel-btn">取消操作</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="status-bar">
                    <span id="status-message">欢迎来到声波迷宫！使用声波探测障碍物位置，救出被困队友。</span>
                </div>
            </main>

            <aside class="sidebar right-sidebar">
                <div class="panel">
                    <h3>📝 变更记录</h3>
                    <div id="change-log" class="change-log">
                        <p class="empty-log">暂无变更记录</p>
                    </div>
                </div>

                <div class="panel">
                    <h3>🔍 错误检测</h3>
                    <div id="detected-errors" class="error-log">
                        <p class="empty-log">未检测到错误</p>
                    </div>
                </div>

                <div class="panel">
                    <h3>🎬 回放</h3>
                    <button id="btn-show-history" class="action-btn">查看历史</button>
                    <button id="btn-replay-fail" class="action-btn">失败回放</button>
                </div>

                <div class="panel">
                    <h3>📊 实验报告</h3>
                    <button id="btn-export-report" class="action-btn export-btn">导出实验报告</button>
                    <button id="btn-export-json" class="action-btn">导出JSON</button>
                </div>
            </aside>
        </div>

        <div id="history-modal" class="modal hidden">
            <div class="modal-content">
                <h2>📜 游戏历史</h2>
                <div id="history-list" class="history-list"></div>
                <button id="btn-close-history" class="action-btn">关闭</button>
            </div>
        </div>

        <div id="replay-modal" class="modal hidden">
            <div class="modal-content large">
                <h2>🎬 失败回放</h2>
                <canvas id="replay-canvas" width="600" height="400"></canvas>
                <div class="replay-controls">
                    <button id="btn-replay-play" class="action-btn">▶️ 播放</button>
                    <button id="btn-replay-pause" class="action-btn">⏸️ 暂停</button>
                    <button id="btn-replay-reset" class="action-btn">🔄 重置</button>
                    <span id="replay-status">就绪</span>
                </div>
                <button id="btn-close-replay" class="action-btn">关闭</button>
            </div>
        </div>

        <div id="import-modal" class="modal hidden">
            <div class="modal-content">
                <h2>📥 数据导入</h2>
                <div id="import-result"></div>
                <div id="import-actions" class="hidden">
                    <button id="btn-import-confirm" class="action-btn confirm-btn">确认导入</button>
                    <button id="btn-import-cancel" class="action-btn cancel-btn">取消</button>
                </div>
            </div>
        </div>

        <div id="input-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="input-modal-title">添加数据</h2>
                <div id="input-modal-form"></div>
                <div class="modal-actions">
                    <button id="btn-input-confirm" class="action-btn confirm-btn">确认</button>
                    <button id="btn-input-cancel" class="action-btn cancel-btn">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
