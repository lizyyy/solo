[project]
name = "gcode-guardian"
version = "0.1.0"
description = "刀路干运行守门员 - G-code干运行检查工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
gcode-guardian = "gcode_guardian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcode_guardian"]
