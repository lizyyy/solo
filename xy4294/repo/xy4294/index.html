<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷链仓库3D货架巡检可视化器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            padding: 15px 20px;
            border-bottom: 2px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.5rem;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            border: 1px solid #e94560;
            color: #fff;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
            border: none;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: linear-gradient(180deg, #16213e 0%, #1a1a2e 100%);
            border-right: 2px solid #0f3460;
            padding: 15px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #0f3460;
        }

        .sidebar-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 1rem;
            color: #e94560;
            margin-bottom: 12px;
            padding-bottom: 5px;
            border-bottom: 1px solid #0f3460;
        }

        .filter-group {
            margin-bottom: 10px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #0f3460;
            background-color: #1a1a2e;
            color: #fff;
            font-size: 0.9rem;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 5px rgba(233, 69, 96, 0.3);
        }

        .view-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        .canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .timeline-container {
            background: linear-gradient(180deg, #16213e 0%, #1a1a2e 100%);
            border-top: 2px solid #0f3460;
            padding: 15px 20px;
            flex-shrink: 0;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .timeline-title {
            font-size: 0.95rem;
            color: #e94560;
        }

        .timeline-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .timeline-btn {
            background: none;
            border: 1px solid #0f3460;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .timeline-btn:hover {
            background: #e94560;
            border-color: #e94560;
        }

        .timeline-btn.active {
            background: #e94560;
            border-color: #e94560;
        }

        .timeline-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #0f3460;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .timeline-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .time-indicator {
            text-align: center;
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 8px;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.9);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 15px;
            z-index: 20;
            pointer-events: auto;
        }

        .legend-title {
            font-size: 0.9rem;
            color: #e94560;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            margin-right: 8px;
            border: 1px solid #0f3460;
        }

        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.9);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 15px;
            z-index: 20;
            max-width: 300px;
            display: none;
            pointer-events: auto;
        }

        .info-panel.visible {
            display: block;
        }

        .info-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #0f3460;
        }

        .info-panel-title {
            font-size: 1rem;
            color: #e94560;
        }

        .info-panel-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 5px;
        }

        .info-panel-close:hover {
            color: #e94560;
        }

        .info-item {
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .info-item-label {
            color: #aaa;
            margin-right: 5px;
        }

        .info-item-value {
            color: #fff;
        }

        .risk-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
            margin-left: 5px;
        }

        .risk-high {
            background: rgba(233, 69, 96, 0.3);
            color: #e94560;
            border: 1px solid #e94560;
        }

        .risk-medium {
            background: rgba(255, 193, 7, 0.3);
            color: #ffc107;
            border: 1px solid #ffc107;
        }

        .risk-low {
            background: rgba(25, 135, 84, 0.3);
            color: #198754;
            border: 1px solid #198754;
        }

        .mark-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #0f3460;
        }

        .mark-section label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .mark-section select,
        .mark-section textarea {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #0f3460;
            background-color: #1a1a2e;
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .mark-section textarea {
            height: 60px;
            resize: vertical;
        }

        .stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.9);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 15px;
            z-index: 20;
            min-width: 200px;
            pointer-events: auto;
        }

        .stats-title {
            font-size: 0.9rem;
            color: #e94560;
            margin-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .stat-label {
            color: #aaa;
        }

        .stat-value {
            color: #fff;
            font-weight: bold;
        }

        .stat-value.high {
            color: #e94560;
        }

        .stat-value.medium {
            color: #ffc107;
        }

        .stat-value.low {
            color: #198754;
        }

        .export-dropdown {
            position: relative;
        }

        .export-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 5px;
            padding: 5px 0;
            min-width: 150px;
            display: none;
            z-index: 100;
        }

        .export-menu.visible {
            display: block;
        }

        .export-menu-item {
            padding: 8px 15px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .export-menu-item:hover {
            background: #e94560;
        }

        .load-data-btn {
            position: relative;
        }

        .load-data-btn input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-overlay.visible {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #0f3460;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 12px 20px;
            color: #fff;
            font-size: 0.95rem;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .message-toast.visible {
            opacity: 1;
        }

        .message-toast.success {
            border-color: #198754;
        }

        .message-toast.error {
            border-color: #e94560;
        }

        .message-toast.info {
            border-color: #0dcaf0;
        }
    </style>
</head>
<body>
    <header>
        <h1>❄️ 冷链仓库3D货架巡检可视化器</h1>
        <div class="header-controls">
            <button class="btn load-data-btn" id="load-data-btn">
                📂 加载数据
                <input type="file" id="file-input" accept=".json,.csv,.jsonl" multiple>
            </button>
            <button class="btn" id="load-sample-btn">📊 加载示例数据</button>
            <div class="export-dropdown">
                <button class="btn" id="export-btn">📤 导出报告</button>
                <div class="export-menu" id="export-menu">
                    <div class="export-menu-item" data-format="markdown">Markdown 报告</div>
                    <div class="export-menu-item" data-format="csv">CSV 报告</div>
                    <div class="export-menu-item" data-format="json">JSON 报告</div>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3 class="section-title">🔍 筛选条件</h3>
                <div class="filter-group">
                    <label>风险等级</label>
                    <select id="risk-filter">
                        <option value="all">全部</option>
                        <option value="high">高风险</option>
                        <option value="medium">中风险</option>
                        <option value="low">低风险</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>风险类型</label>
                    <select id="risk-type-filter">
                        <option value="all">全部</option>
                        <option value="temperature">温度异常</option>
                        <option value="missed">漏检区域</option>
                        <option value="expiring">临期货品</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>货架区域</label>
                    <select id="area-filter">
                        <option value="all">全部区域</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>货品SKU</label>
                    <input type="text" id="sku-filter" placeholder="输入SKU筛选...">
                </div>
            </div>

            <div class="sidebar-section">
                <h3 class="section-title">⚙️ 显示设置</h3>
                <div class="filter-group">
                    <label>温度热图</label>
                    <select id="heatmap-toggle">
                        <option value="show">显示</option>
                        <option value="hide">隐藏</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>叉车轨迹</label>
                    <select id="path-toggle">
                        <option value="show">显示</option>
                        <option value="hide">隐藏</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>货架透明度</label>
                    <input type="range" id="opacity-slider" min="30" max="100" value="100">
                </div>
            </div>

            <div class="sidebar-section">
                <h3 class="section-title">🎮 操作说明</h3>
                <div class="info-item">
                    <span class="info-item-label">鼠标左键:</span>
                    <span class="info-item-value">旋转视图</span>
                </div>
                <div class="info-item">
                    <span class="info-item-label">鼠标滚轮:</span>
                    <span class="info-item-value">缩放视图</span>
                </div>
                <div class="info-item">
                    <span class="info-item-label">鼠标右键:</span>
                    <span class="info-item-value">平移视图</span>
                </div>
                <div class="info-item">
                    <span class="info-item-label">点击货位:</span>
                    <span class="info-item-value">查看详情</span>
                </div>
            </div>
        </aside>

        <main class="view-area">
            <div id="canvas-container">
                <div class="canvas-overlay"></div>
                
                <div class="loading-overlay" id="loading-overlay">
                    <div class="loading-spinner"></div>
                </div>

                <div class="stats-panel" id="stats-panel">
                    <h4 class="stats-title">📊 风险统计</h4>
                    <div class="stat-item">
                        <span class="stat-label">高风险:</span>
                        <span class="stat-value high" id="high-risk-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">中风险:</span>
                        <span class="stat-value medium" id="medium-risk-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">低风险:</span>
                        <span class="stat-value low" id="low-risk-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">温度异常:</span>
                        <span class="stat-value" id="temp-anomaly-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">漏检区域:</span>
                        <span class="stat-value" id="missed-area-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">临期货品:</span>
                        <span class="stat-value" id="expiring-count">0</span>
                    </div>
                </div>

                <div class="legend" id="legend">
                    <h4 class="legend-title">🌡️ 温度图例</h4>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #e94560;"></div>
                        <span>高温 (> -12°C)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffc107;"></div>
                        <span>偏高 (-15 ~ -12°C)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #198754;"></div>
                        <span>正常 (-18 ~ -15°C)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #0dcaf0;"></div>
                        <span>偏低 (< -18°C)</span>
                    </div>
                </div>

                <div class="info-panel" id="info-panel">
                    <div class="info-panel-header">
                        <h4 class="info-panel-title" id="info-title">货位详情</h4>
                        <button class="info-panel-close" id="info-close">×</button>
                    </div>
                    <div id="info-content">
                        <!-- 动态内容 -->
                    </div>
                    <div class="mark-section">
                        <label>标记处理状态</label>
                        <select id="mark-status">
                            <option value="pending">待处理</option>
                            <option value="processing">处理中</option>
                            <option value="resolved">已解决</option>
                            <option value="ignored">忽略</option>
                        </select>
                        <label>处理备注</label>
                        <textarea id="mark-notes" placeholder="输入处理备注..."></textarea>
                        <button class="btn btn-primary" id="mark-submit">✓ 保存标记</button>
                    </div>
                </div>
            </div>

            <div class="timeline-container">
                <div class="timeline-header">
                    <div class="timeline-title">⏱️ 时间轴控制</div>
                    <div class="timeline-controls">
                        <button class="timeline-btn" id="play-prev" title="上一帧">⏮</button>
                        <button class="timeline-btn" id="play-btn" title="播放/暂停">▶</button>
                        <button class="timeline-btn" id="play-next" title="下一帧">⏭</button>
                        <select id="play-speed">
                            <option value="0.5">0.5x</option>
                            <option value="1" selected>1x</option>
                            <option value="2">2x</option>
                            <option value="5">5x</option>
                        </select>
                    </div>
                </div>
                <input type="range" class="timeline-slider" id="timeline-slider" min="0" max="100" value="0">
                <div class="time-indicator" id="time-indicator">时间: 00:00:00</div>
            </div>
        </main>
    </div>

    <div class="message-toast" id="message-toast"></div>

    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- 模块文件 -->
    <script src="js/dataParser.js"></script>
    <script src="js/riskRules.js"></script>
    <script src="js/stateManager.js"></script>
    <script src="js/renderer3D.js"></script>
    <script src="js/exporter.js"></script>
    
    <!-- 测试模块 -->
    <script src="js/testRunner.js"></script>
    
    <!-- 主应用 -->
    <script src="js/app.js"></script>
</body>
</html>
