[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-checker"
version = "0.1.0"
description = "投标文件完整性检查CLI工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
bid-checker = "bid_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
