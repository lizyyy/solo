[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jenkins-snapshot"
version = "1.0.0"
description = "Jenkins 参数快照 CLI - 离线保留每次构建输入和产物"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "DevOps Team" }
]
dependencies = [
  "click>=8.0",
  "rich>=13.0",
  "python-dateutil>=2.8",
  "pydantic>=2.0",
]

[project.scripts]
jenkins-snapshot = "jenkins_snapshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "black>=23.0",
  "mypy>=1.0",
]
