<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手机维修工单管理系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <h1>📱 手机维修工单管理</h1>
      </div>
      <div class="header-right">
        <button class="btn btn-primary" onclick="showCreateModal()">+ 新建工单</button>
        <button class="btn btn-secondary" onclick="showCsvModal()">📊 数据导入导出</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索客户姓名、手机号、设备型号或工单号..." 
               oninput="searchTickets()">
      </div>
      <div class="filter-box">
        <select id="statusFilter" onchange="applyFilters()">
          <option value="">全部状态</option>
          <option value="待检测">待检测</option>
          <option value="报价中">报价中</option>
          <option value="维修中">维修中</option>
          <option value="待取机">待取机</option>
          <option value="已完成">已完成</option>
          <option value="已取消">已取消</option>
        </select>
        <input type="date" id="startDate" onchange="applyFilters()" placeholder="开始日期">
        <input type="date" id="endDate" onchange="applyFilters()" placeholder="结束日期">
        <button class="btn btn-outline" onclick="clearFilters()">清除筛选</button>
      </div>
    </div>

    <div class="stats-bar" id="statsBar"></div>

    <div class="kanban" id="kanban"></div>
  </div>

  <div class="modal" id="ticketModal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2 id="modalTitle">工单详情</h2>
        <button class="modal-close" onclick="closeModal('ticketModal')">&times;</button>
      </div>
      <div class="modal-body" id="ticketModalBody"></div>
    </div>
  </div>

  <div class="modal" id="createModal">
    <div class="modal-content modal-medium">
      <div class="modal-header">
        <h2>新建工单</h2>
        <button class="modal-close" onclick="closeModal('createModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="createForm" onsubmit="createTicket(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>客户姓名 <span class="required">*</span></label>
              <input type="text" name="customer_name" required>
            </div>
            <div class="form-group">
              <label>手机号 <span class="required">*</span></label>
              <input type="tel" name="customer_phone" required pattern="^1[3-9]\d{9}$">
            </div>
            <div class="form-group">
              <label>设备型号 <span class="required">*</span></label>
              <input type="text" name="device_model" required>
            </div>
            <div class="form-group">
              <label>报价金额 (元)</label>
              <input type="number" name="quote_amount" min="0" step="0.01" value="0">
            </div>
            <div class="form-group full-width">
              <label>故障描述 <span class="required">*</span></label>
              <textarea name="fault_description" rows="2" required></textarea>
            </div>
            <div class="form-group full-width">
              <label>维修配件</label>
              <textarea name="repair_parts" rows="2" placeholder="如：原装屏幕、电池等"></textarea>
            </div>
            <div class="form-group">
              <label>预计取机时间</label>
              <input type="datetime-local" name="expected_pickup_time">
            </div>
            <div class="form-group full-width">
              <label>备注</label>
              <textarea name="notes" rows="2" placeholder="其他说明"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="closeModal('createModal')">取消</button>
            <button type="submit" class="btn btn-primary">创建工单</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal" id="editModal">
    <div class="modal-content modal-medium">
      <div class="modal-header">
        <h2>编辑工单</h2>
        <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="editForm" onsubmit="updateTicket(event)">
          <input type="hidden" name="ticket_id" id="editTicketId">
          <div class="form-grid">
            <div class="form-group">
              <label>客户姓名 <span class="required">*</span></label>
              <input type="text" name="customer_name" id="editCustomerName" required>
            </div>
            <div class="form-group">
              <label>手机号 <span class="required">*</span></label>
              <input type="tel" name="customer_phone" id="editCustomerPhone" required pattern="^1[3-9]\d{9}$">
            </div>
            <div class="form-group">
              <label>设备型号 <span class="required">*</span></label>
              <input type="text" name="device_model" id="editDeviceModel" required>
            </div>
            <div class="form-group">
              <label>报价金额 (元)</label>
              <input type="number" name="quote_amount" id="editQuoteAmount" min="0" step="0.01">
            </div>
            <div class="form-group full-width">
              <label>故障描述 <span class="required">*</span></label>
              <textarea name="fault_description" id="editFaultDescription" rows="2" required></textarea>
            </div>
            <div class="form-group full-width">
              <label>维修配件</label>
              <textarea name="repair_parts" id="editRepairParts" rows="2"></textarea>
            </div>
            <div class="form-group">
              <label>预计取机时间</label>
              <input type="datetime-local" name="expected_pickup_time" id="editExpectedPickup">
            </div>
            <div class="form-group full-width">
              <label>备注</label>
              <textarea name="notes" id="editNotes" rows="2"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="closeModal('editModal')">取消</button>
            <button type="submit" class="btn btn-primary">保存修改</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal" id="csvModal">
    <div class="modal-content modal-medium">
      <div class="modal-header">
        <h2>数据导入导出</h2>
        <button class="modal-close" onclick="closeModal('csvModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="csv-section">
          <h3>📤 导出数据</h3>
          <p class="text-muted">将当前筛选条件下的工单数导出为 CSV 文件，方便对账或备份。</p>
          <button class="btn btn-primary" onclick="exportCsv()">导出所有工单</button>
          <a href="/api/csv/template" class="btn btn-outline" style="margin-left: 8px;">下载导入模板</a>
        </div>
        <div class="csv-section">
          <h3>📥 导入数据</h3>
          <p class="text-muted">从 CSV 文件导入旧数据。请先下载模板，按格式填写后上传。</p>
          <div class="import-box">
            <input type="file" id="csvFile" accept=".csv" onchange="importCsv()">
            <label for="csvFile" class="btn btn-secondary">选择 CSV 文件</label>
            <span id="csvFileName" class="file-name"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
</body>
</html>
