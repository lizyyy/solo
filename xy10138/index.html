<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓库机器人拣货游戏</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <div class="game-container">
    <header>
      <h1>仓库机器人拣货游戏</h1>
      <div class="game-info">
        <div class="info-item">
          <span class="label">时间:</span>
          <span id="time" class="value">120s</span>
        </div>
        <div class="info-item">
          <span class="label">得分:</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="info-item">
          <span class="label">状态:</span>
          <span id="game-state" class="value">准备开始</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="game-area">
        <canvas id="game-canvas" width="720" height="600"></canvas>
        <div id="message" class="message"></div>
      </div>

      <div class="control-panel">
        <div class="panel-section">
          <h3>游戏规则</h3>
          <ul class="rules">
            <li>🎯 目标：在时间内拾取所有货物</li>
            <li>✅ 成功取货：+100分</li>
            <li>❌ 重复取货：-50分</li>
            <li>❌ 取空位置：-20分</li>
            <li>💥 机器人碰撞：-100分</li>
            <li>👣 每次移动：-1分</li>
          </ul>
        </div>

        <div class="panel-section">
          <h3>游戏控制</h3>
          <div class="button-group">
            <button id="btn-start" class="btn btn-primary">开始游戏</button>
            <button id="btn-pause" class="btn btn-warning" disabled>暂停</button>
            <button id="btn-resume" class="btn btn-success" disabled>继续</button>
            <button id="btn-restart" class="btn btn-danger">重新开始</button>
          </div>
        </div>

        <div class="panel-section">
          <h3>选择机器人</h3>
          <div class="robot-selector">
            <button class="robot-btn" data-robot="1" style="background: #FF6B6B;">机器人 1</button>
            <button class="robot-btn" data-robot="2" style="background: #4ECDC4;">机器人 2</button>
            <button class="robot-btn" data-robot="3" style="background: #45B7D1;">机器人 3</button>
          </div>
        </div>

        <div class="panel-section">
          <h3>移动控制</h3>
          <div class="move-controls">
            <button id="btn-up" class="move-btn">↑</button>
            <div class="move-row">
              <button id="btn-left" class="move-btn">←</button>
              <button id="btn-pickup" class="move-btn btn-pickup">拾取</button>
              <button id="btn-right" class="move-btn">→</button>
            </div>
            <button id="btn-down" class="move-btn">↓</button>
          </div>
          <p class="hint">使用方向键或WASD移动，空格键拾取</p>
        </div>

        <div class="panel-section">
          <h3>计分明细</h3>
          <div id="score-details" class="score-details">
            <p class="empty-text">游戏开始后显示计分明细</p>
          </div>
        </div>

        <div class="panel-section">
          <h3>游戏回放</h3>
          <div class="button-group">
            <button id="btn-replay" class="btn btn-info" disabled>开始回放</button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>提示：规划好机器人路线，避免碰撞和重复取货！</p>
    </footer>
  </div>

  <script src="src/js/constants.js"></script>
  <script src="src/js/game-logger.js"></script>
  <script src="src/js/game-engine.js"></script>
  <script src="src/js/game-ui.js"></script>
  <script src="src/js/main.js"></script>
</body>
</html>
