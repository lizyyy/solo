openapi: "3.0.3"
info:
  title: 用户管理 API
  version: "1.0.0"
  description: 用户管理系统的 REST API 接口
servers:
  - url: https://api.example.com/v1

paths:
  /users:
    get:
      summary: 获取用户列表
      description: 分页获取用户列表
      operationId: listUsers
      parameters:
        - name: page
          in: query
          description: 页码
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: 每页数量
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          description: 用户状态筛选
          schema:
            type: string
            enum: [active, inactive, pending]
      responses:
        "200":
          description: 成功返回用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: 请求参数错误
        "401":
          description: 未授权

    post:
      summary: 创建用户
      description: 创建一个新用户
      operationId: createUser
      requestBody:
        description: 用户信息
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: 用户创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: 请求参数错误

  /users/{userId}:
    get:
      summary: 获取用户详情
      description: 根据用户 ID 获取用户详细信息
      operationId: getUser
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string
      responses:
        "200":
          description: 成功返回用户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: 用户不存在

    put:
      summary: 更新用户
      description: 更新用户信息
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string
      requestBody:
        description: 用户更新信息
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: 用户更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: 用户不存在

    delete:
      summary: 删除用户
      description: 删除指定用户
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string
      responses:
        "204":
          description: 用户删除成功
        "404":
          description: 用户不存在

  /users/{userId}/orders:
    get:
      summary: 获取用户订单
      description: 获取指定用户的订单列表
      operationId: getUserOrders
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string
        - name: status
          in: query
          description: 订单状态
          schema:
            type: string
            enum: [pending, paid, shipped, delivered, cancelled]
      responses:
        "200":
          description: 成功返回订单列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"

components:
  schemas:
    User:
      type: object
      description: 用户信息
      properties:
        id:
          type: string
          description: 用户唯一标识
        email:
          type: string
          format: email
          description: 邮箱地址
        name:
          type: string
          description: 用户名
        age:
          type: integer
          description: 年龄
        status:
          type: string
          enum: [active, inactive, pending]
          description: 用户状态
        createdAt:
          type: string
          format: date-time
          description: 创建时间
      required:
        - id
        - email
        - name
        - status

    CreateUserRequest:
      type: object
      description: 创建用户请求
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址
        name:
          type: string
          description: 用户名
        age:
          type: integer
          description: 年龄
        status:
          type: string
          enum: [active, inactive, pending]
          description: 用户状态
          default: pending
      required:
        - email
        - name

    UpdateUserRequest:
      type: object
      description: 更新用户请求
      properties:
        name:
          type: string
          description: 用户名
        age:
          type: integer
          description: 年龄
        status:
          type: string
          enum: [active, inactive, pending]
          description: 用户状态

    Pagination:
      type: object
      description: 分页信息
      properties:
        page:
          type: integer
          description: 当前页码
        limit:
          type: integer
          description: 每页数量
        total:
          type: integer
          description: 总记录数
        totalPages:
          type: integer
          description: 总页数

    Order:
      type: object
      description: 订单信息
      properties:
        id:
          type: string
          description: 订单 ID
        userId:
          type: string
          description: 用户 ID
        status:
          type: string
          enum: [pending, paid, shipped, delivered, cancelled]
          description: 订单状态
        amount:
          type: number
          description: 订单金额
        createdAt:
          type: string
          format: date-time
          description: 创建时间
      required:
        - id
        - userId
        - status
        - amount
