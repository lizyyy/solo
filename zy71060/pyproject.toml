[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-checksum-cli"
version = "1.0.0"
description = "对象存储校验清单 CLI - 校验分片、checksum 和区域副本一致性"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "OSS Checksum Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
]

[project.scripts]
oss-check = "oss_checksum_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
