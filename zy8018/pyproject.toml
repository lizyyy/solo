[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-replay-debugger"
dynamic = ["version"]
description = "MCP 工具调用录制与重放调试器"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "debugger", "replay", "testing"]
authors = [
  { name = "Developer" }
]
dependencies = [
  "click>=8.0.0",
  "pyyaml>=6.0",
  "jsonschema>=4.0.0",
  "rich>=13.0.0",
]

[project.scripts]
mcp-replay = "mcp_replay_debugger.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
]

[tool.hatch.version]
path = "mcp_replay_debugger/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
