[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-room-charge-cli"
version = "1.0.0"
description = "会议室爽约扣费CLI工具"
requires-python = ">=3.8"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.1",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
mr-charge = "meeting_room_charge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meeting_room_charge*"]
