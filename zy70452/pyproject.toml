[tool.poetry]
name = "slice-validator"
version = "0.1.0"
description = "大文件切片校验工具 - 灰度物流拦截数据校验"
authors = ["Data Engineering Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.0"
pydantic = "^2.0.0"
rich = "^13.0.0"
pandas = "^2.0.0"
pyarrow = "^14.0.0"
xxhash = "^3.0.0"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
