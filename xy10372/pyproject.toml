[tool.poetry]
name = "factory-downtime-cli"
version = "0.1.0"
description = "工厂换模停机统计CLI工具"
authors = ["Trae"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
click = "^8.1.0"
rich = "^13.0.0"
pandas = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
fdt = "factory_downtime_cli.cli:main"
