server:
  port: 8080

spring:
  application:
    name: device-command-confirmation-api
  
  datasource:
    url: jdbc:h2:file:./data/devicedb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.devicecommand: DEBUG
    org.hibernate.SQL: DEBUG
