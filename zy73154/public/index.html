<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海洋牧场报告汇总</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>🌊 海洋牧场报告汇总</h1>
    <div class="header-info">
      <span id="versionCount">版本: 0</span>
      <span id="latestVersion">最新版本: 无</span>
    </div>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3>📥 导入数据</h3>
        <div class="import-buttons">
          <button id="btnImportLab" class="btn btn-primary">导入实验室结果表</button>
          <button id="btnImportBoundary" class="btn btn-secondary">导入边界样本</button>
          <button id="btnImportVerbal" class="btn btn-tertiary">添加口头说明</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>🔄 操作</h3>
        <div class="action-buttons">
          <button id="btnRerun" class="btn btn-warning">补录后重跑</button>
          <button id="btnExport" class="btn btn-success">导出数据</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>📊 数据概览</h3>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">总记录数</span>
            <span class="stat-value" id="statTotal">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">站点数</span>
            <span class="stat-value" id="statStations">0</span>
          </div>
          <div class="stat-card stat-warning">
            <span class="stat-label">离群值</span>
            <span class="stat-value" id="statOutliers">0</span>
          </div>
          <div class="stat-card stat-pending">
            <span class="stat-label">待确认</span>
            <span class="stat-value" id="statPending">0</span>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>🔍 筛选</h3>
        <div class="filter-form">
          <div class="filter-item">
            <label>站点编号</label>
            <input type="text" id="filterStation" placeholder="输入站点编号">
          </div>
          <div class="filter-item">
            <label>状态</label>
            <select id="filterStatus">
              <option value="">全部</option>
              <option value="normal">正常</option>
              <option value="pending">待确认</option>
            </select>
          </div>
          <div class="filter-item">
            <label>离群值</label>
            <select id="filterOutlier">
              <option value="">全部</option>
              <option value="true">仅离群</option>
              <option value="false">非离群</option>
            </select>
          </div>
          <button id="btnApplyFilter" class="btn btn-primary btn-sm">应用筛选</button>
          <button id="btnResetFilter" class="btn btn-secondary btn-sm">重置</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>📜 版本历史</h3>
        <div id="versionList" class="version-list">
          <p class="empty-text">暂无版本</p>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="records">📋 数据记录</button>
        <button class="tab-btn" data-tab="map">📍 空间位置</button>
        <button class="tab-btn" data-tab="pending">⚠️ 待确认</button>
        <button class="tab-btn" data-tab="outliers">🔔 离群值</button>
        <button class="tab-btn" data-tab="boundary">🔲 边界样本</button>
        <button class="tab-btn" data-tab="notes">📝 口头说明</button>
      </div>

      <div class="tab-content">
        <div id="tab-records" class="tab-panel active">
          <div class="panel-header">
          <h2>实验室结果表</h2>
          <span class="record-count" id="recordCount">共 0 条记录</span>
        </div>
          <div class="table-container">
            <table class="data-table" id="recordsTable">
              <thead>
                <tr>
                  <th>站点编号</th>
                  <th>采样时间</th>
                  <th>水温</th>
                  <th>盐度</th>
                  <th>溶解氧</th>
                  <th>pH</th>
                  <th>叶绿素</th>
                  <th>浊度</th>
                  <th>潮位</th>
                  <th>状态</th>
                  <th>来源</th>
                </tr>
              </thead>
              <tbody id="recordsBody">
                <tr><td colspan="11" class="empty-cell">暂无数据</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div id="tab-map" class="tab-panel">
          <div class="panel-header">
            <h2>空间位置分布</h2>
          </div>
          <div class="map-container" id="mapContainer">
            <div class="map-placeholder">
              <p>加载中...</p>
            </div>
          </div>
        </div>

        <div id="tab-pending" class="tab-panel">
          <div class="panel-header">
            <h2>待确认记录</h2>
            <span class="record-count" id="pendingCount">共 0 条</span>
          </div>
          <div id="pendingList" class="pending-list">
            <p class="empty-text">暂无待确认记录</p>
          </div>
        </div>

        <div id="tab-outliers" class="tab-panel">
          <div class="panel-header">
            <h2>离群值（类噪声，保留但标记）</h2>
            <span class="record-count" id="outlierCount">共 0 条</span>
          </div>
          <div id="outlierList" class="outlier-list">
            <p class="empty-text">暂无离群值</p>
          </div>
        </div>

        <div id="tab-boundary" class="tab-panel">
          <div class="panel-header">
            <h2>边界样本</h2>
            <span class="record-count" id="boundaryCount">共 0 条</span>
          </div>
          <div id="boundaryList" class="boundary-list">
            <p class="empty-text">暂无边界样本</p>
          </div>
        </div>

        <div id="tab-notes" class="tab-panel">
          <div class="panel-header">
            <h2>口头说明</h2>
            <span class="record-count" id="noteCount">共 0 条</span>
          </div>
          <div id="noteList" class="note-list">
            <p class="empty-text">暂无口头说明</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">标题</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modalCancel">取消</button>
        <button class="btn btn-primary" id="modalConfirm">确定</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
