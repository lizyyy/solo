[project]
name = "semantic-cluster-naming"
version = "0.1.0"
description = "语义向量聚类命名系统 - 带自检和审计追踪的可复现聚类平台"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
scn = "semantic_cluster_naming.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
