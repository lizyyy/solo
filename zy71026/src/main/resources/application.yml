spring:
  application:
    name: kiln-queue-api
  datasource:
    url: jdbc:h2:file:./data/kilnqueue;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    com.pottery.kilnqueue: DEBUG
    org.hibernate.SQL: DEBUG
