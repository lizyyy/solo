<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法务合同盖章台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f5f7fa; color: #333; }
    .app { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3); }
    .header h1 { font-size: 28px; margin-bottom: 5px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .nav { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .nav button { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.3s; background: white; border: 1px solid #e0e0e0; }
    .nav button:hover { background: #f0f4ff; border-color: #667eea; color: #667eea; }
    .nav button.active { background: #667eea; color: white; border-color: #667eea; }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); margin-bottom: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card-header h2 { font-size: 20px; color: #1a1a2e; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover { background: #5a6fd6; }
    .btn-success { background: #4caf50; color: white; }
    .btn-success:hover { background: #45a049; }
    .btn-warning { background: #ff9800; color: white; }
    .btn-warning:hover { background: #f57c00; }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #e53935; }
    .btn-secondary { background: #78909c; color: white; }
    .btn-secondary:hover { background: #607d8b; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .table th, .table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e8e8e8; }
    .table th { background: #f8f9fa; font-weight: 600; color: #555; font-size: 13px; }
    .table tbody tr:hover { background: #fafbfd; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .badge-draft { background: #e3f2fd; color: #1976d2; }
    .badge-pending { background: #fff3e0; color: #f57c00; }
    .badge-approved { background: #e8f5e9; color: #388e3c; }
    .badge-rejected { background: #ffebee; color: #d32f2f; }
    .badge-obsolete { background: #f5f5f5; color: #757575; }
    .badge-stamped { background: #e3f2fd; color: #1565c0; }
    .badge-shipped { background: #fff8e1; color: #f57c00; }
    .badge-received { background: #e8f5e9; color: #388e3c; }
    .badge-archived { background: #e8eaf6; color: #5c6bc0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
    .stat-label { font-size: 13px; color: #888; margin-bottom: 5px; }
    .stat-value { font-size: 28px; font-weight: 700; color: #1a1a2e; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 12px; width: 90%; max-width: 800px; max-height: 90vh; overflow: auto; padding: 30px; position: relative; }
    .modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #888; }
    .modal-close:hover { color: #333; }
    .modal h3 { margin-bottom: 20px; font-size: 20px; color: #1a1a2e; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: #555; font-size: 14px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .alert { padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .alert-success { background: #e8f5e9; color: #388e3c; border: 1px solid #a5d6a7; }
    .alert-error { background: #ffebee; color: #d32f2f; border: 1px solid #ef9a9a; }
    .alert-info { background: #e3f2fd; color: #1976d2; border: 1px solid #90caf9; }
    .detail-row { display: grid; grid-template-columns: 120px 1fr; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .detail-label { color: #888; font-size: 14px; }
    .detail-value { color: #333; font-weight: 500; }
    .tabs { display: flex; border-bottom: 2px solid #e8e8e8; margin-bottom: 20px; }
    .tab { padding: 12px 24px; cursor: pointer; font-weight: 500; color: #666; border-bottom: 2px solid transparent; transition: all 0.3s; }
    .tab:hover { color: #667eea; }
    .tab.active { color: #667eea; border-bottom-color: #667eea; }
    .version-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .version-box { border: 1px solid #e8e8e8; border-radius: 8px; padding: 15px; }
    .version-box h4 { margin-bottom: 10px; color: #1a1a2e; }
    .version-content { white-space: pre-wrap; font-family: monospace; font-size: 13px; color: #555; background: #fafafa; padding: 15px; border-radius: 6px; line-height: 1.6; }
    .manager-group { margin-bottom: 25px; }
    .manager-header { background: #f0f4ff; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .manager-header h4 { color: #667eea; }
    .gap-count { background: #667eea; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .hidden { display: none; }
    .action-btns { display: flex; gap: 5px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>📋 法务合同盖章台</h1>
      <p>合同全生命周期管理：维护、审批、用印、寄送、归档</p>
    </div>

    <div class="nav">
      <button class="active" data-page="dashboard">首页概览</button>
      <button data-page="contracts">合同管理</button>
      <button data-page="pending">待盖章列表</button>
      <button data-page="history">用印历史</button>
      <button data-page="deliveries">寄送状态</button>
      <button data-page="gaps">归档缺口</button>
    </div>

    <div id="content"></div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const API = '/api';
    let currentPage = 'dashboard';
    let legalManagers = [];
    let contracts = [];
    let versions = {};

    async function fetchData(url) {
      const res = await fetch(url);
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: '请求失败' }));
        throw new Error(err.error || '请求失败');
      }
      return res.json();
    }

    async function postData(url, data) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: '请求失败' }));
        throw new Error(err.error || '请求失败');
      }
      return res.json();
    }

    async function putData(url, data) {
      const res = await fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: data ? JSON.stringify(data) : undefined
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: '请求失败' }));
        throw new Error(err.error || '请求失败');
      }
      return res.json();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return d.toLocaleString('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function showModal(title, content) {
      document.getElementById('modal-body').innerHTML = `
        <h3>${title}</h3>
        ${content}
      `;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function showToast(message, type = 'success') {
      const div = document.createElement('div');
      div.className = `alert alert-${type}`;
      div.style.position = 'fixed';
      div.style.top = '20px';
      div.style.right = '20px';
      div.style.zIndex = '9999';
      div.style.animation = 'slideIn 0.3s';
      div.textContent = message;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 3000);
    }

    function getStatusBadge(status) {
      const badgeMap = {
        '草稿': 'badge-draft',
        '待审批': 'badge-pending',
        '已审批': 'badge-approved',
        '已驳回': 'badge-rejected',
        '已作废': 'badge-obsolete',
        '待盖章': 'badge-pending',
        '已盖章': 'badge-stamped',
        '待寄送': 'badge-pending',
        '已寄送': 'badge-shipped',
        '已签收': 'badge-received',
        '待归档': 'badge-pending',
        '已归档': 'badge-archived'
      };
      const cls = badgeMap[status] || 'badge-pending';
      return `<span class="badge ${cls}">${status}</span>`;
    }

    async function loadDashboard() {
      const [allContracts, pending, stamps, deliveries, gaps, archives] = await Promise.all([
        fetchData(`${API}/contracts`),
        fetchData(`${API}/stamp-requests/pending`),
        fetchData(`${API}/stamp-history`),
        fetchData(`${API}/deliveries`),
        fetchData(`${API}/archive-gaps`),
        fetchData(`${API}/archives`)
      ]);

      const html = `
        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">合同总数</div>
            <div class="stat-value">${allContracts.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">待盖章</div>
            <div class="stat-value" style="color: #f57c00;">${pending.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">已盖章</div>
            <div class="stat-value" style="color: #388e3c;">${stamps.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">寄送中</div>
            <div class="stat-value" style="color: #1565c0;">${deliveries.filter(d => d.status === '已寄送').length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">归档缺口</div>
            <div class="stat-value" style="color: #d32f2f;">${gaps.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">已归档</div>
            <div class="stat-value" style="color: #5c6bc0;">${archives.length}</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>📝 功能演示说明</h2>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
            <div style="background: #e8f5e9; padding: 20px; border-radius: 10px;">
              <h4 style="color: #388e3c; margin-bottom: 10px;">✅ 正常盖章流程</h4>
              <p style="font-size: 14px; color: #555; line-height: 1.8;">
                合同：软件销售合同 (XS-2024-001)<br>
                版本：v1.0 → 审批通过 → 用印申请 → 盖章确认 → 寄送 → 归档<br>
                <small style="color: #777;">样例数据已完成完整流程</small>
              </p>
            </div>
            <div style="background: #fff3e0; padding: 20px; border-radius: 10px;">
              <h4 style="color: #f57c00; margin-bottom: 10px;">⚠️ 版本冲突</h4>
              <p style="font-size: 14px; color: #555; line-height: 1.8;">
                合同：软件销售合同 (XS-2024-001)<br>
                版本：v1.1 已审批通过<br>
                但 v1.0 已盖章，系统拦截重复盖章
              </p>
            </div>
            <div style="background: #ffebee; padding: 20px; border-radius: 10px;">
              <h4 style="color: #d32f2f; margin-bottom: 10px;">❌ 审批缺失</h4>
              <p style="font-size: 14px; color: #555; line-height: 1.8;">
                合同：设备采购合同 (CG-2024-001)<br>
                版本：v1.0 仅待审批<br>
                无法申请用印，系统拦截<br>
                <small style="color: #777;">补充协议 v1.0 已作废，也被拦截</small>
              </p>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>🔒 系统拦截规则</h2>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>拦截场景</th>
                <th>触发条件</th>
                <th>错误提示</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>未审批盖章</td>
                <td>版本未通过审批</td>
                <td>该版本未通过审批，无法申请用印</td>
              </tr>
              <tr>
                <td>作废版本用印</td>
                <td>版本状态为"已作废"</td>
                <td>该版本已作废，无法申请用印</td>
              </tr>
              <tr>
                <td>同一合同重复盖章</td>
                <td>合同已有其他版本已盖章</td>
                <td>该合同已有其他版本已盖章，同一合同不允许重复盖章</td>
              </tr>
              <tr>
                <td>寄送后修改收件信息</td>
                <td>寄送状态不为"待寄送"</td>
                <td>已寄出后不允许修改收件信息</td>
              </tr>
              <tr>
                <td>未归档就关闭</td>
                <td>存在未归档的盖章记录</td>
                <td>存在未归档的盖章记录，无法关闭合同</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
      document.getElementById('content').innerHTML = html;
    }

    async function loadContracts() {
      contracts = await fetchData(`${API}/contracts`);
      legalManagers = await fetchData(`${API}/legal-managers`);

      let html = `
        <div class="card">
          <div class="card-header">
            <h2>📚 合同列表</h2>
            <button class="btn btn-primary" onclick="showAddContractModal()">+ 新建合同</button>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>合同编号</th>
                <th>合同名称</th>
                <th>类型</th>
                <th>对方单位</th>
                <th>法务负责人</th>
                <th>版本数</th>
                <th>盖章状态</th>
                <th>关联合同</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
      `;

      contracts.forEach(c => {
        html += `
          <tr>
            <td><strong>${c.contractNo}</strong></td>
            <td>${c.name}</td>
            <td>${getStatusBadge(c.type)}</td>
            <td>${c.counterparty}</td>
            <td>${c.legalManager}</td>
            <td>${c.versionCount}</td>
            <td>${c.latestStamp ? getStatusBadge('已盖章') : '<span class="badge badge-pending">未盖章</span>'}</td>
            <td>${c.relatedContractNo || '-'}</td>
            <td>
              <div class="action-btns">
                <button class="btn btn-sm btn-primary" onclick="viewContractDetail('${c.id}')">查看</button>
                <button class="btn btn-sm btn-secondary" onclick="compareVersions('${c.id}')">版本对比</button>
                ${!c.isClosed ? `<button class="btn btn-sm btn-danger" onclick="closeContract('${c.id}')">关闭</button>` : '<span class="badge badge-obsolete">已关闭</span>'}
              </div>
            </td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      document.getElementById('content').innerHTML = html;
    }

    async function showAddContractModal() {
      const lmOptions = legalManagers.map(lm => `<option value="${lm.id}">${lm.name}</option>`).join('');
      const content = `
        <div class="form-group">
          <label>合同名称</label>
          <input id="new-contract-name" placeholder="如：软件销售合同">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>合同类型</label>
            <select id="new-contract-type">
              <option value="销售合同">销售合同</option>
              <option value="采购合同">采购合同</option>
              <option value="补充协议">补充协议</option>
            </select>
          </div>
          <div class="form-group">
            <label>法务负责人</label>
            <select id="new-contract-lm">
              ${lmOptions}
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>对方单位</label>
          <input id="new-contract-counterparty" placeholder="如：科技有限公司">
        </div>
        <div class="form-group">
          <label>关联合同（补充协议填写）</label>
          <input id="new-contract-related" placeholder="如：XS-2024-001">
        </div>
        <div style="text-align: right; margin-top: 20px;">
          <button class="btn btn-primary" onclick="addContract()">创建</button>
        </div>
      `;
      showModal('新建合同', content);
    }

    async function addContract() {
      try {
        await postData(`${API}/contracts`, {
          name: document.getElementById('new-contract-name').value,
          type: document.getElementById('new-contract-type').value,
          counterparty: document.getElementById('new-contract-counterparty').value,
          legalManagerId: document.getElementById('new-contract-lm').value,
          relatedContractNo: document.getElementById('new-contract-related').value
        });
        closeModal();
        showToast('合同创建成功');
        loadContracts();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function viewContractDetail(contractId) {
      const contract = await fetchData(`${API}/contracts/${contractId}`);
      const versions = await fetchData(`${API}/contracts/${contractId}/versions`);
      const stamps = await fetchData(`${API}/stamp-requests`).then(all => all.filter(s => s.contractId === contractId));

      let stampHtml = '';
      if (stamps.length > 0) {
        stampHtml = `
          <div class="card" style="margin-top: 20px;">
            <h4 style="margin-bottom: 15px;">📌 用印记录</h4>
            <table class="table">
              <thead>
                <tr>
                  <th>版本</th>
                  <th>申请人</th>
                  <th>申请时间</th>
                  <th>状态</th>
                  <th>盖章人</th>
                  <th>盖章时间</th>
                </tr>
              </thead>
              <tbody>
                ${stamps.map(s => `
                  <tr>
                    <td>${s.versionNo}</td>
                    <td>${s.applicant}</td>
                    <td>${formatDate(s.appliedAt)}</td>
                    <td>${getStatusBadge(s.status)}</td>
                    <td>${s.stampedBy || '-'}</td>
                    <td>${formatDate(s.stampedAt)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      const content = `
        <div class="detail-row"><span class="detail-label">合同编号</span><span class="detail-value">${contract.contractNo}</span></div>
        <div class="detail-row"><span class="detail-label">合同名称</span><span class="detail-value">${contract.name}</span></div>
        <div class="detail-row"><span class="detail-label">合同类型</span><span class="detail-value">${contract.type}</span></div>
        <div class="detail-row"><span class="detail-label">对方单位</span><span class="detail-value">${contract.counterparty}</span></div>
        <div class="detail-row"><span class="detail-label">法务负责人</span><span class="detail-value">${contract.legalManager}</span></div>
        <div class="detail-row"><span class="detail-label">创建时间</span><span class="detail-value">${formatDate(contract.createdAt)}</span></div>
        <div class="detail-row"><span class="detail-label">状态</span><span class="detail-value">${contract.isClosed ? '已关闭' : '正常'}</span></div>

        <div class="card" style="margin-top: 20px;">
          <div class="card-header">
            <h4>📝 合同版本</h4>
            <button class="btn btn-primary btn-sm" onclick="addVersion('${contractId}')">+ 新增版本</button>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>版本号</th>
                <th>状态</th>
                <th>创建人</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              ${versions.map(v => `
                <tr>
                  <td><strong>${v.versionNo}</strong></td>
                  <td>${getStatusBadge(v.status)}</td>
                  <td>${v.createdBy}</td>
                  <td>${formatDate(v.createdAt)}</td>
                  <td>
                    <div class="action-btns">

        version = vs.find(v => v.id === versionId);

      showModal('版本内容 - ' + version.versionNo, `

        loadGaps();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function exportGaps() {
      const gaps = await fetchData(`${API}/archive-gaps`);
      const gapsByManager = await fetchData(`${API}/archive-gaps/by-manager`);

      let csv = '合同编号,合同名称,对方单位,版本号,法务负责人,盖章时间,距今天数,寄送状态\n';
      gaps.forEach(g => {
        csv += `${g.contractNo},${g.contractName},${g.counterparty},${g.versionNo},${g.legalManager},${formatDate(g.stampedAt)},${g.daysSinceStamped},${g.delivery ? g.delivery.status : '未寄送'}\n`;
      });

      csv += '\n\n=== 按法务负责人汇总 ===\n';
      gapsByManager.forEach(mg => {
        csv += `\n【${mg.legalManager} - ${mg.gapCount}个缺口】\n`;
        csv += '合同编号,合同名称,版本号,盖章时间,寄送状态\n';
        mg.gaps.forEach(g => {
          csv += `${g.contractNo},${g.contractName},${g.versionNo},${formatDate(g.stampedAt)},${g.delivery ? g.delivery.status : '未寄送'}\n`;
        });
      });

      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `归档缺口报告_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.csv`;
      link.click();
      showToast('导出成功');
    }

    async function loadPage(page) {
      document.querySelectorAll('.nav button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === page);
      });
      currentPage = page;

      switch (page) {
        case 'dashboard': await loadDashboard(); break;
        case 'contracts': await loadContracts(); break;
        case 'pending': await loadPending(); break;
        case 'history': await loadHistory(); break;
        case 'deliveries': await loadDeliveries(); break;
        case 'gaps': await loadGaps(); break;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      document.querySelectorAll('.nav button').forEach(btn => {
        btn.addEventListener('click', () => loadPage(btn.dataset.page));
      });

      document.querySelector('.modal-close').addEventListener('click', closeModal);
      document.getElementById('modal').addEventListener('click', (e) => {
        if (e.target.id === 'modal') closeModal();
      });

      loadPage('dashboard');
    });
  </script>
</body>
</html>
