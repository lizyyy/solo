spring:
  application:
    name: service-token-exchange
  datasource:
    url: jdbc:h2:mem:tokendb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

token:
  exchange:
    jwt-secret: service-token-exchange-secret-key-2024
    default-short-token-expire-minutes: 15
    max-short-token-expire-minutes: 60
