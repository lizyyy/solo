[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-submodule-drift"
version = "0.1.0"
authors = [
  { name="Your Team", email="team@example.com" }
]
description = "Git Submodule Drift Detection CLI Tool"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0.0",
    "gitpython>=3.1.0",
    "rich>=12.0.0",
]

[project.scripts]
submodule-drift = "submodule_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
