[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ioselector"
version = "0.1.0"
authors = [
  { name="IO Selector Simulator Team" }
]
description = "一个用于演示 select/poll/epoll 差异的命令行工具"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "rich>=10.0.0",
]

[project.scripts]
ioselector = "ioselector.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["ioselector*"]
