[project]
name = "pump-calibration"
version = "0.1.0"
description = "加药泵周校准科学计算工具"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "pytest>=6.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=2.12.0",
    "black>=21.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
