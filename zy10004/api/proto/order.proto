syntax = "proto3";

package order;
option go_package = "github.com/chaos-simulator/chaos-simulator/api/proto;order";

message CreateOrderRequest {
  string trace_id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  string payment_method = 4;
  int64 total_amount = 5;
  map<string, string> metadata = 6;
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  int64 unit_price = 3;
}

message CreateOrderResponse {
  string order_id = 1;
  string status = 2;
  string message = 3;
  int64 created_at = 4;
}

message GetOrderRequest {
  string trace_id = 1;
  string order_id = 2;
}

message GetOrderResponse {
  string order_id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  string status = 4;
  int64 total_amount = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message UpdateOrderStatusRequest {
  string trace_id = 1;
  string order_id = 2;
  string new_status = 3;
  string reason = 4;
}

message UpdateOrderStatusResponse {
  bool success = 1;
  string message = 2;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
}
