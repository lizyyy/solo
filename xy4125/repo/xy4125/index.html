<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>口扫咬合预检台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
    }

    .app-container {
      display: flex;
      height: 100vh;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 12px 24px;
      border-bottom: 1px solid #2d2d4a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 1.4rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1::before {
      content: '🦷';
      font-size: 1.6rem;
    }

    .case-info {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .case-id {
      background: rgba(100, 150, 255, 0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #aaccff;
    }

    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 320px;
      background: #12121f;
      border-right: 1px solid #2d2d4a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid #2d2d4a;
    }

    .sidebar-section:last-child {
      border-bottom: none;
      flex: 1;
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4a6cf7 0%, #3558d6 100%);
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #5a7cff 0%, #4568e6 100%);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #2a2a42;
      color: #e0e0e0;
      border: 1px solid #3d3d5c;
    }

    .btn-secondary:hover {
      background: #353550;
    }

    .btn-success {
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
      color: white;
    }

    .btn-success:hover {
      background: linear-gradient(135deg, #3edd81 0%, #2dbd6f 100%);
    }

    .btn-danger {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
    }

    .btn-danger:hover {
      background: linear-gradient(135deg, #f75c4c 0%, #d0493b 100%);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-group .btn {
      flex: 1;
      min-width: 0;
    }

    .viewer-container {
      flex: 1;
      position: relative;
      background: #1a1a2e;
    }

    #scene-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .viewer-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    .view-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: rgba(40, 40, 60, 0.9);
      border: 1px solid #4a4a6a;
      color: #e0e0e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .view-btn:hover {
      background: rgba(60, 60, 80, 0.9);
    }

    .view-btn.active {
      background: rgba(74, 108, 247, 0.9);
      border-color: #4a6cf7;
    }

    .validation-panel {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(20, 20, 35, 0.95);
      border-radius: 12px;
      border: 1px solid #2d2d4a;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
    }

    .validation-header {
      padding: 12px 16px;
      border-bottom: 1px solid #2d2d4a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(25, 25, 40, 0.98);
    }

    .validation-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .validation-summary {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
    }

    .summary-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-item.error { color: #ff6b6b; }
    .summary-item.warning { color: #ffd93d; }
    .summary-item.info { color: #74b9ff; }

    .validation-list {
      padding: 8px 0;
    }

    .validation-item {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(45, 45, 74, 0.5);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .validation-item:last-child {
      border-bottom: none;
    }

    .validation-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .validation-content {
      flex: 1;
    }

    .validation-message {
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .validation-details {
      font-size: 0.8rem;
      color: #888;
    }

    .validation-item.error { background: rgba(255, 107, 107, 0.1); }
    .validation-item.warning { background: rgba(255, 217, 61, 0.05); }
    .validation-item.info { background: rgba(116, 185, 255, 0.05); }

    .tooth-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .tooth-item {
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tooth-item:hover {
      background: #25253d;
    }

    .tooth-item.selected {
      background: rgba(74, 108, 247, 0.2);
      border: 1px solid #4a6cf7;
    }

    .tooth-item.missing {
      opacity: 0.5;
    }

    .tooth-info {
      display: flex;
      flex-direction: column;
    }

    .tooth-number {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .tooth-name {
      font-size: 0.8rem;
      color: #888;
    }

    .tooth-badges {
      display: flex;
      gap: 4px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 500;
    }

    .badge.attachment {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
    }

    .badge.movement {
      background: rgba(116, 185, 255, 0.2);
      color: #74b9ff;
    }

    .badge.missing {
      background: rgba(170, 170, 170, 0.2);
      color: #aaa;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 8px 12px;
      background: #25253d;
      border: 1px solid #3d3d5c;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .form-input:focus {
      outline: none;
      border-color: #4a6cf7;
    }

    .form-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #4a6cf7;
    }

    .status-bar {
      background: #12121f;
      padding: 8px 16px;
      border-top: 1px solid #2d2d4a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #888;
    }

    .status-left, .status-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-indicator.ready { background: #2ecc71; }
    .status-indicator.busy { background: #f39c12; }
    .status-indicator.error { background: #e74c3c; }

    .hidden {
      display: none !important;
    }

    .snap-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .snap-controls .form-group {
      margin-bottom: 0;
      flex: 1;
      min-width: 80px;
    }

    .axis-buttons {
      display: flex;
      gap: 4px;
    }

    .axis-btn {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: #25253d;
      border: 1px solid #3d3d5c;
      color: #e0e0e0;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .axis-btn:hover {
      background: #353550;
    }

    .axis-btn.active {
      background: #4a6cf7;
      border-color: #4a6cf7;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 20, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #3d3d5c;
      border-top-color: #4a6cf7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 16px;
      color: #aaa;
    }

    .export-dropdown {
      position: relative;
    }

    .export-menu {
      position: absolute;
      bottom: 100%;
      right: 0;
      background: #1a1a2e;
      border: 1px solid #2d2d4a;
      border-radius: 8px;
      padding: 8px 0;
      min-width: 180px;
      z-index: 200;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .export-menu-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .export-menu-item:hover {
      background: #25253d;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a2e;
    }

    ::-webkit-scrollbar-thumb {
      background: #3d3d5c;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4a4a6a;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>口扫咬合预检台</h1>
      <div class="case-info">
        <div class="case-id" id="case-id-display">未加载病例</div>
        <div class="btn-group">
          <button class="btn btn-primary" id="load-example-btn">
            加载示例
          </button>
          <button class="btn btn-secondary" id="new-project-btn">
            新建项目
          </button>
        </div>
      </div>
    </header>

    <div class="main-content">
      <aside class="sidebar">
        <div class="sidebar-section">
          <div class="section-title">文件导入</div>
          <div class="btn-group" style="margin-bottom: 12px;">
            <button class="btn btn-secondary" id="import-annotation-btn">
              导入标注 JSON
            </button>
          </div>
          <div class="btn-group">
            <button class="btn btn-secondary" id="import-stl-btn">
              导入 STL/OBJ
            </button>
          </div>
          
          <input type="file" id="annotation-file-input" accept=".json" style="display: none;">
          <input type="file" id="model-file-input" accept=".stl,.obj" multiple style="display: none;">
        </div>

        <div class="sidebar-section">
          <div class="section-title">视图控制</div>
          <div class="btn-group" style="margin-bottom: 12px;">
            <button class="btn btn-secondary" id="view-both-btn" title="显示上下颌">
              双颌
            </button>
            <button class="btn btn-secondary" id="view-upper-btn" title="仅显示上颌">
              上颌
            </button>
            <button class="btn btn-secondary" id="view-lower-btn" title="仅显示下颌">
              下颌
            </button>
          </div>
          
          <div class="section-title" style="margin-top: 16px;">交互设置</div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="snap-enabled" checked>
              启用吸附 (0.5mm)
            </label>
          </div>
          
          <div class="snap-controls">
            <div class="form-group">
              <label class="form-label">吸附步长 (mm)</label>
              <input type="number" class="form-input" id="snap-step" value="0.5" min="0.1" step="0.1" style="width: 100%;">
            </div>
            <div class="form-group">
              <label class="form-label">轴锁定</label>
              <div class="axis-buttons">
                <button class="axis-btn" id="axis-x" title="锁定X轴">X</button>
                <button class="axis-btn" id="axis-y" title="锁定Y轴">Y</button>
                <button class="axis-btn" id="axis-z" title="锁定Z轴">Z</button>
              </div>
            </div>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="section-title">牙位列表</div>
          <div class="tooth-list" id="tooth-list">
            <div style="color: #888; text-align: center; padding: 20px;">
              请先加载标注文件
            </div>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="section-title">导出</div>
          <div class="btn-group">
            <button class="btn btn-success" id="save-project-btn">
              保存方案
            </button>
            <button class="btn btn-secondary" id="load-project-btn">
              加载方案
            </button>
          </div>
          <div class="btn-group" style="margin-top: 8px;">
            <button class="btn btn-secondary" id="export-report-btn">
              导出报告
            </button>
            <button class="btn btn-secondary" id="export-csv-btn">
              导出CSV
            </button>
          </div>
          <div class="btn-group" style="margin-top: 8px;">
            <button class="btn btn-primary" id="run-validation-btn">
              运行校验
            </button>
          </div>
        </div>
      </aside>

      <main class="viewer-container">
        <div id="scene-canvas"></div>
        
        <div class="viewer-controls">
          <button class="view-btn active" id="view-front" title="正面视图">正</button>
          <button class="view-btn" id="view-side" title="侧面视图">侧</button>
          <button class="view-btn" id="view-top" title="顶面视图">顶</button>
          <button class="view-btn" id="view-reset" title="重置视图">⟲</button>
        </div>

        <div class="validation-panel hidden" id="validation-panel">
          <div class="validation-header">
            <div class="validation-title">
              校验结果
              <div class="validation-summary">
                <span class="summary-item error" id="summary-errors">
                  <span>❌</span> 错误: <span id="error-count">0</span>
                </span>
                <span class="summary-item warning" id="summary-warnings">
                  <span>⚠️</span> 警告: <span id="warning-count">0</span>
                </span>
                <span class="summary-item info" id="summary-infos">
                  <span>ℹ️</span> 信息: <span id="info-count">0</span>
                </span>
              </div>
            </div>
            <button class="btn btn-secondary" id="close-validation-btn" style="padding: 6px 12px; font-size: 0.8rem;">
              关闭
            </button>
          </div>
          <div class="validation-list" id="validation-list"></div>
        </div>

        <div class="loading-overlay hidden" id="loading-overlay">
          <div class="loading-spinner"></div>
          <div class="loading-text" id="loading-text">加载中...</div>
        </div>
      </main>
    </div>

    <footer class="status-bar">
      <div class="status-left">
        <div class="status-item">
          <span class="status-indicator ready" id="status-indicator"></span>
          <span id="status-text">就绪</span>
        </div>
      </div>
      <div class="status-right">
        <div class="status-item">
          <span id="selected-info">未选择</span>
        </div>
        <div class="status-item">
          <span id="units-info">单位: mm</span>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
