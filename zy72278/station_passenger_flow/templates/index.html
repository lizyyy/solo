<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地铁站厅客流瓶颈</title>
<style>
:root {
    --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0;
    --muted: #94a3b8; --accent: #3b82f6; --danger: #ef4444; --success: #22c55e;
    --warn: #f59e0b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height:1.6; }
.container { max-width:1400px; margin:0 auto; padding:20px; }
header { background: var(--card); border-bottom:1px solid var(--border); padding:16px 24px; margin-bottom:24px; border-radius:8px; display:flex; align-items:center; justify-content:space-between; }
header h1 { font-size:20px; font-weight:600; }
.status-badge { padding:4px 12px; border-radius:20px; font-size:13px; font-weight:500; }
.status-badge.step-cad { background:#1e3a5f; color:#60a5fa; }
.status-badge.step-rf { background:#1e3f30; color:#4ade80; }
.status-badge.step-replay { background:#3f2e1e; color:#fbbf24; }
.status-badge.step-done { background:#1e3f30; color:#4ade80; }
.status-badge.step-empty { background:#3f1e1e; color:#f87171; }

nav.tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--card); padding:6px; border-radius:10px; border:1px solid var(--border); }
nav.tabs button { flex:1; padding:10px 16px; border:none; background:transparent; color:var(--muted); font-size:14px; font-weight:500; border-radius:8px; cursor:pointer; transition:all .2s; }
nav.tabs button.active { background:var(--accent); color:#fff; }
nav.tabs button:hover:not(.active) { background:var(--border); color:var(--text); }

.panel { display:none; }
.panel.active { display:block; }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:16px; }
.card h2 { font-size:16px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.card h2 .icon { width:20px; height:20px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; }
.card h3 { font-size:14px; margin:16px 0 8px 0; color:var(--muted); font-weight:500; }

label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; margin-top:12px; }
input, select, textarea { width:100%; padding:8px 12px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:14px; }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
textarea { resize:vertical; min-height:60px; }

.row { display:flex; gap:12px; }
.row > * { flex:1; }

.btn { padding:8px 20px; border:none; border-radius:6px; font-size:14px; font-weight:500; cursor:pointer; transition:all .2s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#2563eb; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-danger:hover { background:#dc2626; }
.btn-success { background:var(--success); color:#fff; }
.btn-success:hover { background:#16a34a; }
.btn-warn { background:var(--warn); color:#000; }
.btn-warn:hover { background:#d97706; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { background:var(--border); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-row { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.btn-small { padding:4px 10px; font-size:12px; }

table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--border); }
th { color:var(--muted); font-weight:500; background:rgba(0,0,0,.2); }

.conflict-card { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.3); border-radius:8px; padding:14px; margin-bottom:10px; }
.conflict-card .type { font-weight:600; color:var(--danger); margin-bottom:4px; }
.conflict-card .detail { font-size:13px; color:var(--muted); }
.conflict-card .values { display:flex; gap:16px; margin:8px 0; font-size:13px; flex-wrap:wrap; }
.conflict-card .values span { background:var(--bg); padding:4px 8px; border-radius:4px; }

.check-pass { color:var(--success); }
.check-fail { color:var(--danger); }
.check-item { padding:8px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:12px; }
.check-item .msg { flex:1; }

.toast { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:8px; font-size:14px; z-index:1000; display:none; }
.toast.show { display:block; animation: slideIn .3s ease; }
.toast.success { background:var(--success); color:#fff; }
.toast.error { background:var(--danger); color:#fff; }
.toast.warning { background:var(--warn); color:#000; }

@keyframes slideIn { from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1} }

.replay-version { display:inline-block; padding:6px 14px; margin:4px; background:var(--bg); border:1px solid var(--border); border-radius:6px; font-size:13px; cursor:pointer; transition:all .2s; }
.replay-version:hover { border-color:var(--accent); }
.replay-version.active { border-color:var(--accent); background:rgba(59,130,246,.15); color:var(--accent); }

.verify-ok { background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.3); border-radius:8px; padding:14px; }
.verify-ok .title { color:var(--success); font-weight:600; margin-bottom:8px; }
.verify-fail { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.3); border-radius:8px; padding:14px; }
.verify-fail .title { color:var(--danger); font-weight:600; margin-bottom:8px; }

.path-table td, .path-table th { font-size:12px; }

.loading { text-align:center; padding:40px; color:var(--muted); }
.empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-state .big-icon { font-size:48px; margin-bottom:16px; }

.evidence-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin-top:10px; }
.evidence-item { background:var(--bg); padding:10px; border-radius:6px; font-size:12px; }
.evidence-item .label { color:var(--muted); font-size:11px; margin-bottom:2px; }
.evidence-item .value { font-weight:500; word-break:break-all; }
.evidence-item .match-ok { color:var(--success); }
.evidence-item .match-fail { color:var(--danger); }

.diff-summary { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; margin-bottom:12px; }
.diff-stat { background:var(--bg); padding:12px; border-radius:8px; text-align:center; }
.diff-stat .num { font-size:24px; font-weight:700; }
.diff-stat .label { font-size:12px; color:var(--muted); margin-top:4px; }
.diff-stat.position { border-left:3px solid var(--warn); }
.diff-stat.passenger { border-left:3px solid var(--accent); }
.diff-stat.missing { border-left:3px solid var(--danger); }

.history-timeline { border-left:2px solid var(--border); margin-left:10px; padding-left:20px; }
.history-item { position:relative; padding:10px 0; }
.history-item::before { content:""; position:absolute; left:-27px; top:14px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--card); }
.history-item .time { font-size:11px; color:var(--muted); }
.history-item .desc { font-size:13px; margin-top:2px; }
.history-item .meta { font-size:11px; color:var(--muted); margin-top:2px; }

.preset-btn { font-size:12px; padding:6px 12px; margin-right:8px; margin-top:8px; }

code.inline { background:var(--bg); padding:2px 6px; border-radius:4px; font-size:12px; font-family:monospace; }
</style>
</head>
<body>
<div class="container">
<header>
    <h1>🚇 地铁站厅客流瓶颈</h1>
    <div>
        <span class="status-badge step-empty" id="globalStatus">尚未开始</span>
        <span id="currentHall" style="margin-left:12px;color:var(--muted);font-size:13px"></span>
    </div>
</header>

<nav class="tabs">
    <button class="active" onclick="switchTab('cad')">① CAD图层导入</button>
    <button onclick="switchTab('rangefinder')">② 补看测距仪</button>
    <button onclick="switchTab('replay')">③ 回放复盘</button>
    <button onclick="switchTab('conflict')">碰撞检查</button>
    <button onclick="switchTab('selfcheck')">自检</button>
    <button onclick="switchTab('export')">导出报告</button>
</nav>

<div id="panel-cad" class="panel active">
    <div class="card">
        <h2><span class="icon" style="background:var(--accent)">📂</span> 导入CAD图层</h2>
        <div>
            <button class="btn btn-outline preset-btn" onclick="loadPreset('normal')">📋 加载正常样例（Z轴向上）</button>
            <button class="btn btn-warn preset-btn" onclick="loadPreset('reversed')">⚠️ 加载错口径样例（Z轴写反）</button>
        </div>
        <div class="row">
            <div><label>图层名称</label><input id="cad_layer_name" placeholder="例：站厅A-1号出入口" value="站厅A-1号出入口"></div>
            <div><label>来源文件</label><input id="cad_source_file" placeholder="例：station_A.dwg" value="station_A.dwg"></div>
        </div>
        <div class="row">
            <div><label>Z轴方向值</label><input id="cad_z_direction" type="number" step="0.1" value="1.0"><small style="color:var(--muted);font-size:12px">正数=向上，负数=向下（旧习惯可能写反）</small></div>
            <div><label>操作人</label><input id="cad_operator" value="小陶"></div>
        </div>
        <label>坐标点（JSON数组）</label>
        <textarea id="cad_points" rows="3">[{"x":0,"y":0,"z":0},{"x":10.5,"y":0,"z":0}]</textarea>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="doCadImport()">导入CAD图层</button>
        </div>
    </div>
    <div class="card" id="cad-result" style="display:none">
        <h2>导入结果</h2>
        <div id="cad-result-content"></div>
    </div>
</div>

<div id="panel-rangefinder" class="panel">
    <div class="card">
        <h2><span class="icon" style="background:var(--success)">📏</span> 补看测距仪记录</h2>
        <div>
            <button class="btn btn-outline preset-btn" onclick="loadRfPreset('normal')">📋 加载正常测距样例</button>
            <button class="btn btn-warn preset-btn" onclick="loadRfPreset('conflict')">⚠️ 加载冲突测距样例</button>
            <button class="btn btn-success preset-btn" onclick="loadRfPreset('supplement')">➕ 加载补录样例</button>
        </div>
        <div class="row">
            <div><label>测量点</label><input id="rf_measure_point" placeholder="例：1号出入口通道" value="1号出入口通道"></div>
            <div><label>Z轴方向</label><input id="rf_z_direction" type="number" step="0.1" value="1.0"></div>
        </div>
        <div class="row">
            <div><label>实测距离</label><input id="rf_distance" type="number" step="0.1" value="10.5"></div>
            <div><label>操作人</label><input id="rf_operator" value="小陶"></div>
        </div>
        <div class="row">
            <div><label>是否补录</label><select id="rf_is_supplement"><option value="false">首次测量</option><option value="true">补录数据</option></select></div>
            <div><label>备注</label><input id="rf_notes" placeholder="可选"></div>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="doRfSupplement()">补充测距仪记录</button>
            <button class="btn btn-success" onclick="doCalculate()">计算客流瓶颈</button>
        </div>
    </div>
    <div class="card" id="rf-result" style="display:none">
        <h2>计算结果</h2>
        <div id="rf-result-content"></div>
    </div>
    <div class="card" id="rf-history" style="display:none">
        <h2>测距仪记录历史</h2>
        <div id="rf-history-content"></div>
    </div>
</div>

<div id="panel-replay" class="panel">
    <div class="card">
        <h2><span class="icon" style="background:var(--warn)">🔄</span> 当前处理状态</h2>
        <div id="replay-status">
            <div class="empty-state"><div class="big-icon">📋</div><p>请先完成CAD导入和测距仪补录</p></div>
        </div>
    </div>

    <div class="card">
        <h2><span class="icon" style="background:var(--warn)">🔄</span> 路径回放复盘</h2>
        <div>
            <button class="btn btn-outline preset-btn" onclick="loadReplayPreset('v1')">📋 加载回放版本1（低峰客流）</button>
            <button class="btn btn-warn preset-btn" onclick="loadReplayPreset('v2')">📊 加载回放版本2（高峰客流+Z写反）</button>
        </div>
        <label>路径点（JSON数组，含 x, y, z, passenger_count）</label>
        <textarea id="replay_points" rows="4">[{"x":0,"y":0,"z":0,"passenger_count":45,"timestamp":"2025-01-01T10:00:00"},{"x":5,"y":0,"z":0,"passenger_count":52,"timestamp":"2025-01-01T10:01:00"},{"x":10,"y":0,"z":0,"passenger_count":38,"timestamp":"2025-01-01T10:02:00"}]</textarea>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="doReplayUpdate()">更新路径回放</button>
            <button class="btn btn-outline" onclick="loadReplayVersions()">刷新回放版本列表</button>
            <button class="btn btn-outline" onclick="loadAllReplayData()">🔄 加载全部回放+结果数据</button>
        </div>
    </div>

    <div class="card" id="replay-versions-card" style="display:none">
        <h2>回放版本列表</h2>
        <div id="replay-versions-list"></div>
        <div style="margin-top:12px">
            <div class="row">
                <div><label>对比版本1</label><input id="replay_v1" type="number" value="1" min="1"></div>
                <div><label>对比版本2</label><input id="replay_v2" type="number" value="2" min="1"></div>
            </div>
            <div class="btn-row">
                <button class="btn btn-outline" onclick="doReplayCompare()">对比版本差异</button>
                <button class="btn btn-warn" onclick="doReplayVerify()">校验与最新结果一致性</button>
            </div>
        </div>
    </div>

    <div class="card" id="replay-compare-card" style="display:none">
        <h2>版本对比结果</h2>
        <div id="replay-compare-content"></div>
    </div>

    <div class="card" id="replay-verify-card" style="display:none">
        <h2>一致性校验结果（证据链）</h2>
        <div id="replay-verify-content"></div>
    </div>

    <div class="card" id="replay-detail-card" style="display:none">
        <h2>版本详情</h2>
        <div id="replay-detail-content"></div>
    </div>

    <div class="card" id="replay-history-card" style="display:none">
        <h2>操作历史记录</h2>
        <div id="replay-history-content"></div>
    </div>

    <div class="card" id="replay-data-card" style="display:none">
        <h2>原始数据核对</h2>
        <div id="replay-data-content"></div>
    </div>
</div>

<div id="panel-conflict" class="panel">
    <div class="card">
        <h2><span class="icon" style="background:var(--danger)">⚠️</span> 碰撞检查</h2>
        <div class="btn-row" style="margin-bottom:12px">
            <button class="btn btn-primary" onclick="loadConflicts()">刷新冲突列表</button>
        </div>
        <div id="conflict-list">
            <div class="empty-state"><div class="big-icon">✓</div><p>暂无冲突，或请先点击刷新</p></div>
        </div>
    </div>
</div>

<div id="panel-selfcheck" class="panel">
    <div class="card">
        <h2><span class="icon" style="background:var(--success)">🔍</span> 基本自检</h2>
        <div class="btn-row" style="margin-bottom:12px">
            <button class="btn btn-primary" onclick="runSelfCheck()">执行自检</button>
        </div>
        <div id="selfcheck-list">
            <div class="empty-state"><div class="big-icon">🔍</div><p>点击"执行自检"开始检查</p></div>
        </div>
    </div>
</div>

<div id="panel-export" class="panel">
    <div class="card">
        <h2><span class="icon" style="background:var(--accent)">📄</span> 导出报告</h2>
        <div id="export-summary" style="margin-bottom:16px"></div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="doExportPreview()">预览导出数据</button>
            <button class="btn btn-success" onclick="doExportDownload()">下载JSON报告</button>
        </div>
    </div>
    <div class="card" id="export-preview-card" style="display:none">
        <h2>导出数据预览</h2>
        <pre id="export-preview-content" style="max-height:500px;overflow:auto;background:var(--bg);padding:12px;border-radius:6px;font-size:12px;white-space:pre-wrap"></pre>
    </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
function $(id){ return document.getElementById(id); }
function showToast(msg, type='success'){
    const t=$('toast'); t.textContent=msg; t.className='toast show '+type;
    setTimeout(()=>{ t.className='toast'; }, 3000);
}
async function api(path, opts={}){
    try {
        const resp = await fetch(API+path, {headers:{'Content-Type':'application/json'}, ...opts});
        const data = await resp.json();
        if(!resp.ok) { showToast(data.error||'操作失败','error'); return null; }
        return data;
    } catch(e) { showToast('网络错误：'+e.message,'error'); return null; }
}

let currentResultId = null;
let operationHistory = [];

function addHistory(step, desc, meta){
    operationHistory.unshift({
        time: new Date().toLocaleString('zh-CN'),
        step,
        desc,
        meta: meta || {}
    });
    renderHistory();
}

function renderHistory(){
    const container = $('replay-history-content');
    if(!container) return;
    if(!operationHistory.length){
        container.innerHTML = '<p style="color:var(--muted)">暂无操作记录</p>';
        return;
    }
    $('replay-history-card').style.display = 'block';
    container.innerHTML = '<div class="history-timeline">' + operationHistory.map(h=>`
        <div class="history-item">
            <div class="time">${h.time}</div>
            <div class="desc">${h.desc}</div>
            <div class="meta">${Object.entries(h.meta).map(([k,v])=>`${k}: ${v}`).join(' | ')}</div>
        </div>
    `).join('') + '</div>';
}

function switchTab(name){
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    $('panel-'+name).classList.add('active');
    event.target.classList.add('active');
    refreshStatus();
    if(name==='replay'){ loadReplayStatus(); loadAllReplayData(); }
}

async function refreshStatus(){
    const s = await api('/api/status');
    if(!s) return;
    const badge=$('globalStatus');
    const stepMap={cad_import:'step-cad',rangefinder_supplement:'step-rf',path_replay_update:'step-replay',completed:'step-done'};
    badge.className='status-badge '+(stepMap[s.status]||'step-empty');
    badge.textContent=s.status_label||s.status||'尚未开始';
    if(s.hall_name){
        $('currentHall').textContent = '站厅：' + s.hall_name + ' | 版本：v' + s.version;
    } else {
        $('currentHall').textContent = '';
    }
}

function loadReplayStatus(){
    const s = window._lastStatus;
    if(!s){
        $('replay-status').innerHTML = '<div class="empty-state"><div class="big-icon">📋</div><p>请先完成CAD导入和测距仪补录</p></div>';
        return;
    }
    const zLabels = {normal:'<span class="check-pass">✓ 正常</span>', pending_review:'<span class="check-fail">⚠️ 待复核（Z轴可能写反）</span>', reversed_old_habit:'<span class="check-fail">✗ 已确认为旧习惯写反</span>'};
    $('replay-status').innerHTML = `
        <div class="evidence-grid">
            <div class="evidence-item"><div class="label">当前步骤</div><div class="value">${s.status_label||s.status}</div></div>
            <div class="evidence-item"><div class="label">结果版本</div><div class="value">v${s.version}</div></div>
            <div class="evidence-item"><div class="label">Z轴方向状态</div><div class="value">${zLabels[s.z_direction_status]||s.z_direction_status}</div></div>
            <div class="evidence-item"><div class="label">待处理冲突</div><div class="value ${s.conflict_count>0?'check-fail':'check-pass'}">${s.conflict_count}处</div></div>
            <div class="evidence-item"><div class="label">是否补录</div><div class="value">${s.is_supplemented?'是':'否'}</div></div>
        </div>
    `;
}

async function loadAllReplayData(){
    if(!currentResultId) return;
    const result = await api('/api/results/'+currentResultId);
    if(!result) return;
    const resultJsonPath = `data/results/${currentResultId}_v${result.version}.json`;
    const replayVersions = await api('/api/replay/versions');
    const replayList = (replayVersions && replayVersions.versions) ? replayVersions.versions : [];
    let replayJsonPaths = replayList.map(v=>{
        return `data/replays/${currentResultId}/replay_v${v}_result_v*.json`;
    });
    $('replay-data-card').style.display = 'block';
    $('replay-data-content').innerHTML = `
        <h3>最新结果 JSON</h3>
        <p><code class="inline">${resultJsonPath}</code></p>
        <div class="evidence-grid">
            <div class="evidence-item"><div class="label">result_id</div><div class="value">${result.result_id}</div></div>

async function doCadImport(){

async function doReplayCompare(){
    const v1=parseInt($('replay_v1').value);
    const v2=parseInt($('replay_v2').value);
    const r=await api('/api/replay/compare?v1='+v1+'&v2='+v2);
    if(!r) return;
    $('replay-compare-card').style.display='block';
    if(r.error || !r.can_continue){
        $('replay-compare-content').innerHTML='<div class="verify-fail"><div class="title">对比失败</div><p>'+(r.message||r.error)+'</p>'+
            (r.available_versions?'<p style="margin-top:8px;font-size:12px">可选版本：'+r.available_versions.join(', ')+'</p>':'')+
            '<p style="margin-top:8px;font-size:12px;color:var(--muted)">注意：版本不存在时不会生成差异为0的假结果</p></div>';
        return;
    }
    const positionDiffs = r.differences.filter(d=>d.type==='position_changed').length;
    const passengerDiffs = r.differences.filter(d=>d.type==='passenger_count_changed').length;
    const missingDiffs = r.differences.filter(d=>d.type==='point_missing').length;
    if(r.is_consistent){
        $('replay-compare-content').innerHTML=`<div class="verify-ok"><div class="title">✓ 版本${v1}与版本${v2}完全一致</div>
            <p>两个回放版本的路径点和客流数据完全相同，没有差异。</p></div>`;
    } else {
        $('replay-compare-content').innerHTML=`
            <div class="verify-fail"><div class="title">发现${r.differences.length}处差异</div></div>
            <div class="diff-summary">
                <div class="diff-stat position"><div class="num">${positionDiffs}</div><div class="label">位置差异</div></div>
                <div class="diff-stat passenger"><div class="num">${passengerDiffs}</div><div class="label">客流差异</div></div>
                <div class="diff-stat missing"><div class="num">${missingDiffs}</div><div class="label">点数差异</div></div>
            </div>
            <h3>差异明细</h3>
            <table><tr><th>点序号</th><th>差异类型</th><th>详细说明</th></tr>
            ${r.differences.map((d,i)=>`
                <tr>
                    <td>${d.index!==undefined?d.index:i}</td>
                    <td>${d.type==='position_changed'?'位置变化':d.type==='passenger_count_changed'?'客流变化':'点数缺失'}</td>
                    <td>${d.message || (d.old && d.new ? JSON.stringify({旧:d.old,新:d.new}) : d.type)}</td>
                </tr>
            `).join('')}
            </table>
        `;
    }
    addHistory('replay_compare', `对比版本${v1} vs 版本${v2}`, {差异数:r.differences.length, 位置差异:positionDiffs, 客流差异:passengerDiffs});
}

                <span>测距仪：${c.rangefinder_value}</span>
                <span>可信度：${(c.confidence*100).toFixed(0)}%</span>
            </div>
            <div class="detail">位置：${c.location||'未知'}</div>
            <div class="btn-row" style="margin-top:8px">
                <button class="btn btn-success btn-small" onclick="resolveConflict(${i},true)">[1] 确认CAD正确</button>
                <button class="btn btn-danger btn-small" onclick="resolveConflict(${i},false)">[2] 驳回，以测距仪为准</button>
            </div>
        </div>
    `).join('');
}

function conflictTypeName(t){
    return {z_axis_direction:'Z轴方向冲突',distance_mismatch:'距离数据冲突',layer_name_mismatch:'图层名称冲突'}[t]||t;
}

async function resolveConflict(idx, confirmed){
    const r=await api('/api/conflicts/'+idx+'/resolve',{method:'POST',body:JSON.stringify({confirmed,operator:'小陶'})});
    if(!r) return;
    window._lastStatus = r;
    addHistory('conflict_resolve', (confirmed?'确认CAD正确':'驳回，以测距仪为准'), {冲突索引:idx+1});
    showToast(confirmed?'已确认CAD正确':'已驳回，以测距仪为准');
    loadConflicts();
    refreshStatus();
    loadReplayStatus();
}

async function runSelfCheck(){
    const r=await api('/api/selfcheck');
    if(!r) return;
    $('selfcheck-list').innerHTML=r.map(c=>`
        <div class="check-item">
            <span class="msg">${c.check_name}：${c.message}</span>
            <span class="${c.passed?'check-pass':'check-fail'}">${c.passed?'✓ 通过':'✗ 未通过'}</span>
        </div>
    `).join('');
}

async function doExportPreview(){
    const r=await api('/api/export');
    if(!r) return;
    $('export-preview-card').style.display='block';
    $('export-preview-content').textContent=JSON.stringify(r,null,2);
    const zLabels = {normal:'正常', pending_review:'待复核(Z轴可能写反)', reversed_old_habit:'已修正(原写反)'};
    $('export-summary').innerHTML = `
        <div class="evidence-grid">
            <div class="evidence-item"><div class="label">站厅名称</div><div class="value">${r.hall_name||'无'}</div></div>
            <div class="evidence-item"><div class="label">result_id</div><div class="value">${r.result_id?r.result_id.substring(0,8)+'...':'-'}</div></div>
            <div class="evidence-item"><div class="label">结果版本</div><div class="value">v${r.version||1}</div></div>
            <div class="evidence-item"><div class="label">瓶颈位置</div><div class="value">${r.bottleneck_location||'-'}</div></div>
            <div class="evidence-item"><div class="label">瓶颈流量</div><div class="value">${r.bottleneck_flow||0}</div></div>
            <div class="evidence-item"><div class="label">Z轴方向状态</div><div class="value">${zLabels[r.z_direction_status]||r.z_direction_status}</div></div>
            <div class="evidence-item"><div class="label">CAD图层</div><div class="value">${r.cad_layer?r.cad_layer.layer_name:'无'}</div></div>
            <div class="evidence-item"><div class="label">测距仪记录</div><div class="value">${(r.rangefinder_records||[]).length} 条</div></div>
            <div class="evidence-item"><div class="label">回放版本</div><div class="value">${(r.path_history||[]).length>0?'已录入':'无'}</div></div>
            <div class="evidence-item"><div class="label">当前步骤</div><div class="value">${r.current_step||'-'}</div></div>
        </div>
    `;
    addHistory('export', '导出报告预览', {版本:`v${r.version||1}`, 瓶颈:r.bottleneck_location});
}

function doExportDownload(){
    window.open(API+'/api/export/download','_blank');
    addHistory('export_download', '下载JSON报告', {});
}

refreshStatus().then(()=>{ window._lastStatus = null; });
</script>
</body>
</html>
