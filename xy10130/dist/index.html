<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>室内传感器覆盖热区图</title>
  <script type="module" crossorigin src="/assets/index-CN1JMxIe.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/three-CWKM2J0I.js">
  <link rel="stylesheet" crossorigin href="/assets/index-qL22tiZc.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <h1>室内传感器覆盖热区图</h1>
      <div class="header-actions">
        <button id="btn-add-sensor">添加传感器</button>
        <button id="btn-clear">清空</button>
        <button id="btn-save">保存方案</button>
        <button id="btn-load">加载方案</button>
        <button id="btn-export">导出报告</button>
      </div>
    </div>
    
    <div id="main-container">
      <div id="sidebar">
        <div class="panel">
          <h3>控制面板</h3>
          
          <div class="section">
            <label>房间尺寸 (米)</label>
            <div class="input-group">
              <div class="input-item">
                <span>宽度 (X):</span>
                <input type="number" id="room-width" value="20" min="1" max="100">
              </div>
              <div class="input-item">
                <span>深度 (Z):</span>
                <input type="number" id="room-depth" value="15" min="1" max="100">
              </div>
              <div class="input-item">
                <span>高度 (Y):</span>
                <input type="number" id="room-height" value="3" min="1" max="10">
              </div>
            </div>
          </div>
          
          <div class="section">
            <label>传感器配置</label>
            <div class="input-group">
              <div class="input-item">
                <span>覆盖半径 (米):</span>
                <input type="number" id="sensor-radius" value="5" min="1" max="20" step="0.5">
              </div>
              <div class="input-item">
                <span>最小间距 (米):</span>
                <input type="number" id="min-distance" value="2" min="0.5" max="10" step="0.5">
              </div>
              <div class="input-item">
                <span>最大间距 (米):</span>
                <input type="number" id="max-distance" value="8" min="1" max="20" step="0.5">
              </div>
            </div>
          </div>
          
          <div class="section">
            <label>场景控制</label>
            <div class="button-group">
              <button id="btn-play" class="control-btn">▶ 播放动画</button>
              <button id="btn-pause" class="control-btn">⏸ 暂停</button>
              <button id="btn-reset" class="control-btn">⟲ 重置视角</button>
            </div>
          </div>
          
          <div class="section">
            <label>显示选项</label>
            <div class="checkbox-group">
              <label class="checkbox-item">
                <input type="checkbox" id="show-grid" checked>
                <span>显示网格</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" id="show-heatmap" checked>
                <span>显示热区图</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" id="show-walls" checked>
                <span>显示墙壁</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" id="show-anomalies" checked>
                <span>显示异常标记</span>
              </label>
            </div>
          </div>
        </div>
        
        <div class="panel">
          <h3>传感器列表</h3>
          <div id="sensor-list" class="sensor-list"></div>
        </div>
        
        <div class="panel">
          <h3>统计信息</h3>
          <div id="stats" class="stats">
            <div class="stat-item">
              <span class="label">传感器数量:</span>
              <span class="value" id="stat-count">0</span>
            </div>
            <div class="stat-item">
              <span class="label">覆盖区域:</span>
              <span class="value" id="stat-coverage">0%</span>
            </div>
            <div class="stat-item warning">
              <span class="label">过密区域:</span>
              <span class="value" id="stat-dense">0</span>
            </div>
            <div class="stat-item error">
              <span class="label">漏测区域:</span>
              <span class="value" id="stat-gaps">0</span>
            </div>
          </div>
        </div>
      </div>
      
      <div id="canvas-container">
        <canvas id="scene-canvas"></canvas>
        <div id="info-overlay" class="info-overlay"></div>
      </div>
    </div>
  </div>
  
  <input type="file" id="file-input" accept=".json" style="display: none;">
  
</body>
</html>
