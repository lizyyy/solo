[project]
name = "drum-beat-analyzer"
version = "0.1.0"
description = "鼓手节拍偏差分析 - 分析架子鼓练习录音的节拍稳定性"
requires-python = ">=3.9"
dependencies = [
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
]

[project.scripts]
drum-analyzer = "drum_analyzer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
