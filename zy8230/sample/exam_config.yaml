courses:
  - name: 数据结构与算法
    questions:
      - num: 1
        max_score: 10
        deduction_rules:
          - condition: 代码逻辑错误
            points: 2
          - condition: 语法错误
            points: 1
          - condition: 未完成
            points: 5
      - num: 2
        max_score: 10
        deduction_rules:
          - condition: 思路不清
            points: 3
          - condition: 结果错误
            points: 2
      - num: 3
        max_score: 8
        deduction_rules:
          - condition: 步骤缺失
            points: 2
          - condition: 边界条件未考虑
            points: 1
  - name: 操作系统
    questions:
      - num: 1
        max_score: 20
        deduction_rules:
          - condition: 概念错误
            points: 5
          - condition: 解释不完整
            points: 3
      - num: 2
        max_score: 15
        deduction_rules:
          - condition: 算法描述错误
            points: 4
          - condition: 示例不正确
            points: 2
  - name: 计算机网络
    questions:
      - num: 1
        max_score: 12
        deduction_rules:
          - condition: 协议理解错误
            points: 4
          - condition: 配置步骤错误
            points: 3
      - num: 2
        max_score: 10
        deduction_rules:
          - condition: 拓扑分析错误
            points: 3
          - condition: 计算错误
            points: 2

review_settings:
  conflict_threshold: 3
  conflict_threshold_percent: 0.3
  strictness_window: 0.5
