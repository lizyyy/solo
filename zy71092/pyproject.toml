[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-failure-cluster"
version = "0.1.0"
description = "CI 失败签名聚类 CLI - 智能分析 CI 失败并按根因聚类"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "CI Failure Cluster Team"}
]
dependencies = [
  "click>=8.0",
  "pyyaml>=6.0",
  "python-Levenshtein>=0.23",
  "fuzzywuzzy>=0.18",
  "tqdm>=4.65",
  "rich>=13.0",
  "python-dateutil>=2.8",
]

[project.scripts]
ci-failure-cluster = "ci_failure_cluster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
