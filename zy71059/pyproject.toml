[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pvc-orphan-finder"
version = "0.1.0"
description = "K8s PVC Orphan Finder CLI - Find unused PersistentVolumeClaims in Kubernetes manifests"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
pvc-orphan = "pvc_orphan_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
