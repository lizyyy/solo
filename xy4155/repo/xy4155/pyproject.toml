[project]
name = "lens-inspector"
version = "0.1.0"
description = "镜头瑕疵分拣台 - 二手相机检测AI工具"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Lens Inspector Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.21.0",
    "opencv-python>=4.5.0",
    "scikit-learn>=1.0.0",
    "scikit-image>=0.18.0",
    "pandas>=1.3.0",
    "Pillow>=8.0.0",
    "rich>=10.0.0",
    "click>=8.0.0",
    "joblib>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
]

[project.scripts]
lens-inspector = "lens_inspector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lens_inspector"]
