apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    name: frontend
---
apiVersion: v1
kind: Namespace
metadata:
  name: backend
  labels:
    name: backend
---
apiVersion: v1
kind: Namespace
metadata:
  name: db
  labels:
    name: db
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-app
  namespace: frontend
  labels:
    app: frontend
    tier: web
spec:
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - name: http
      containerPort: 80
    - name: https
      containerPort: 443
---
apiVersion: v1
kind: Pod
metadata:
  name: backend-api
  namespace: backend
  labels:
    app: backend
    tier: api
spec:
  containers:
  - name: api
    image: backend:latest
    ports:
    - name: api
      containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: db-server
  namespace: db
  labels:
    app: database
    tier: db
spec:
  containers:
  - name: mysql
    image: mysql:latest
    ports:
    - name: mysql
      containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: backend
spec:
  selector:
    app: backend
    tier: api
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: db
spec:
  selector:
    app: database
    tier: db
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
