[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-splitter-cli"
version = "1.0.0"
description = "多渠道订单拆票CLI工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "rich>=13.0",
    "tabulate>=0.9",
    "python-dateutil>=2.8",
]

[project.scripts]
invoice-splitter = "invoice_splitter.cli:main"
