# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to datetime.now() and datetime.strptime()
# timezone = UTC

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be loaded as Python modules.
# This is useful for pyinstaller bundles, where the
# .py files are compiled into .pyc or .pyo files
# and shipped without the .py files.
# pyc_only = true

# the output encoding used for the "offline"
# script generation.
# output_encoding = utf-8

sqlalchemy.url = sqlite:///./chemotherapy_tracker.db


[post_write_hooks]
# post_write_hooks defines scripts or Python functions
# that are run on newly generated revision scripts.
# See the documentation for detail

# hooks = console_script:tox_console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
