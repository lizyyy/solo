# 报销材料包体检工具配置文件
# 此文件用于自定义校验规则和参数

# 允许的费用类型列表
allowed_expense_types:
  - 差旅费
  - 办公费
  - 招待费
  - 交通费
  - 通讯费
  - 设备采购
  - 服务费
  - 咨询费
  - 会议费
  - 培训费
  - 广告费
  - 租赁费
  - 物业费
  - 水电费
  - 其他

# 单笔金额上限（元），超过此金额会触发警告
max_single_amount: 10000.0

# 报销截止天数（从发票日期到报销日期的最大允许天数）
reimbursement_days: 90

# 报销明细CSV文件名
csv_filename: "expenses.csv"

# 不同费用类型所需的附件类型
required_attachment_types:
  设备采购: ["发票", "合同"]
  服务费: ["发票", "合同", "验收单"]
  咨询费: ["发票", "合同", "验收单"]
  会议费: ["发票", "会议纪要"]
  培训费: ["发票", "培训通知"]
  差旅费: ["发票", "出差审批单"]
  招待费: ["发票", "招待清单"]

# 文件名匹配规则（正则表达式）
filename_patterns:
  invoice: "^(发票|invoice|fp)_?\d+"
  payment: "^(付款|payment|pay)_?\d+"
  contract: "^(合同|contract|ht)_?\d+"
  acceptance: "^(验收|acceptance|ys)_?\d+"

# 校验规则开关和严重程度
# severity: error（错误，必须修复）| warning（警告，建议检查）| info（提示）
rules:
  # 缺少附件
  missing_attachment:
    enabled: true
    severity: error
  
  # 重复发票号
  duplicate_invoice:
    enabled: true
    severity: error
  
  # 金额合计不一致
  amount_mismatch:
    enabled: true
    severity: error
  
  # 日期超期
  date_expired:
    enabled: true
    severity: warning
  
  # 缺少合同
  missing_contract:
    enabled: true
    severity: error
  
  # 缺少验收单
  missing_acceptance:
    enabled: true
    severity: error
  
  # 文件名不规范
  invalid_filename:
    enabled: true
    severity: warning
  
  # 无效的费用类型
  invalid_expense_type:
    enabled: true
    severity: error
  
  # 单笔金额超限
  amount_exceed_limit:
    enabled: true
    severity: warning
