[project]
name = "expense-checker"
version = "0.1.0"
description = "报销材料包体检工具 - 本地检查报销附件完整性和一致性"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
expense-checker = "expense_checker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["expense_checker*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
