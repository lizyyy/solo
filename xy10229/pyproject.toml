[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-germination-cli"
version = "0.1.0"
description = "种子发芽率实验记录 CLI - 用于多组种子发芽实验的记录、验证和分析"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Seed Germination Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
seedgerm = "seed_germination.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seed_germination*"]
