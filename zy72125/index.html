<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巡演舞台输入表核对 - 录音师老许专用</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎤 巡演舞台输入表核对</h1>
      <p class="subtitle">录音师老许 · 排练材料核对工具</p>
    </header>

    <div class="toolbar">
      <div class="toolbar-left">
        <button id="btnLoadSample" class="btn btn-secondary">📥 加载样例数据</button>
        <button id="btnAddRecord" class="btn btn-primary">➕ 新增记录</button>
        <button id="btnImport" class="btn btn-secondary">📂 导入JSON</button>
        <input type="file" id="fileImport" accept=".json" style="display:none;">
        <button id="btnExport" class="btn btn-success">📤 导出清单</button>
        <button id="btnCheckAll" class="btn btn-warning">🔍 执行核对</button>
      </div>
      <div class="toolbar-right">
        <button id="btnShowHistory" class="btn btn-secondary">📜 查看修改历史</button>
        <button id="btnClearAll" class="btn btn-danger">🗑️ 清空数据</button>
      </div>
    </div>

    <div class="filter-section">
      <h3>🔎 筛选条件</h3>
      <div class="filter-grid">
        <div class="filter-item">
          <label>演出日期</label>
          <input type="date" id="filterDate">
        </div>
        <div class="filter-item">
          <label>城市/场地</label>
          <input type="text" id="filterCity" placeholder="输入城市或场地">
        </div>
        <div class="filter-item">
          <label>曲目名称</label>
          <input type="text" id="filterSong" placeholder="输入曲目名">
        </div>
        <div class="filter-item">
          <label>核对状态</label>
          <select id="filterStatus">
            <option value="">全部</option>
            <option value="待核对">待核对</option>
            <option value="正常">正常</option>
            <option value="有疑问">有疑问</option>
            <option value="缺材料">缺材料</option>
            <option value="已确认">已确认</option>
          </select>
        </div>
        <div class="filter-item">
          <label>问题类型</label>
          <select id="filterIssue">
            <option value="">全部</option>
            <option value="空值">空值缺失</option>
            <option value="重复">重复记录</option>
            <option value="边界">边界异常</option>
            <option value="正常">无问题</option>
          </select>
        </div>
        <div class="filter-item">
          <label>&nbsp;</label>
          <button id="btnResetFilter" class="btn btn-secondary">重置筛选</button>
        </div>
      </div>
    </div>

    <div class="summary-section">
      <div class="summary-card summary-total">
        <div class="summary-label">总记录数</div>
        <div class="summary-value" id="statTotal">0</div>
      </div>
      <div class="summary-card summary-ok">
        <div class="summary-label">核对正常</div>
        <div class="summary-value" id="statOk">0</div>
      </div>
      <div class="summary-card summary-warning">
        <div class="summary-label">有疑问</div>
        <div class="summary-value" id="statWarn">0</div>
      </div>
      <div class="summary-card summary-error">
        <div class="summary-label">缺材料/空值</div>
        <div class="summary-value" id="statError">0</div>
      </div>
      <div class="summary-card summary-duplicate">
        <div class="summary-label">重复项</div>
        <div class="summary-value" id="statDup">0</div>
      </div>
    </div>

    <div class="table-container">
      <table id="mainTable" class="data-table">
        <thead>
          <tr>
            <th style="width:50px;">序号</th>
            <th style="width:80px;">状态</th>
            <th style="width:100px;">演出日期</th>
            <th style="width:120px;">城市</th>
            <th>曲目名称</th>
            <th style="width:100px;">输入类型</th>
            <th style="width:80px;">通道</th>
            <th style="width:150px;">文件名</th>
            <th style="width:80px;">时长</th>
            <th style="width:100px;">来源</th>
            <th style="width:200px;">备注</th>
            <th style="width:150px;">最后修改</th>
            <th style="width:180px;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty-row">
            <td colspan="13" class="empty-cell">
              <div class="empty-state">
                <div class="empty-icon">📋</div>
                <div class="empty-text">暂无数据</div>
                <div class="empty-hint">点击"加载样例数据"开始体验，或"新增记录"手动录入</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="diff-section" id="diffSection" style="display:none;">
      <h3>📊 补录差异对比</h3>
      <div class="diff-container" id="diffContainer"></div>
      <button id="btnCloseDiff" class="btn btn-secondary">关闭对比</button>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">编辑记录</h2>
        <span class="close" id="modalClose">&times;</span>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter">
        <button id="modalCancel" class="btn btn-secondary">取消</button>
        <button id="modalSave" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="historyModal" class="modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2>📜 修改历史记录</h2>
        <span class="close" id="historyClose">&times;</span>
      </div>
      <div class="modal-body" id="historyBody"></div>
    </div>
  </div>

  <div id="suggestionModal" class="modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2>💡 核对结果与处理建议</h2>
        <span class="close" id="suggestionClose">&times;</span>
      </div>
      <div class="modal-body" id="suggestionBody"></div>
      <div class="modal-footer">
        <button id="suggestionCloseBtn" class="btn btn-primary">我知道了</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/sampleData.js"></script>
  <script src="js/dataManager.js"></script>
  <script src="js/validator.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
