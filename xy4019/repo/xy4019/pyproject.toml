[project]
name = "subtitle-checker"
version = "0.1.0"
description = "一个给纪录片字幕统筹用的本地命令行工具，用于质检和修复字幕文件"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "pysrt>=1.1.2",
    "python-slugify>=6.0.0",
]

[project.scripts]
subtitle-checker = "subtitle_checker.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_checker"]
