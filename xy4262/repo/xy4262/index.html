<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无人机灯光秀航线排练台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background-color: #0a0a1a;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #canvas-container {
      flex: 1;
      position: relative;
    }
    #controls {
      background-color: rgba(20, 20, 40, 0.95);
      border-top: 1px solid #334;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    button {
      background-color: #4a5568;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #5a6578;
    }
    button.primary {
      background-color: #3182ce;
    }
    button.primary:hover {
      background-color: #2b6cb0;
    }
    button.danger {
      background-color: #c53030;
    }
    button.danger:hover {
      background-color: #9b2c2c;
    }
    button.success {
      background-color: #2f855a;
    }
    button.success:hover {
      background-color: #276749;
    }
    .timeline-container {
      flex: 1;
      min-width: 300px;
    }
    #timeline {
      width: 100%;
      height: 8px;
      background-color: #2d3748;
      border-radius: 4px;
      position: relative;
      cursor: pointer;
    }
    #timeline-progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(90deg, #3182ce, #667eea);
      border-radius: 4px;
      transition: width 0.05s linear;
    }
    #timeline-marker {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background-color: #ed8936;
      border-radius: 50%;
      cursor: grab;
      z-index: 10;
    }
    .time-display {
      font-family: monospace;
      font-size: 14px;
      min-width: 120px;
      text-align: center;
    }
    #stats-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(20, 20, 40, 0.9);
      border: 1px solid #334;
      border-radius: 8px;
      padding: 15px;
      min-width: 250px;
      max-height: 400px;
      overflow-y: auto;
      z-index: 100;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .stat-label {
      color: #a0aec0;
    }
    .stat-value {
      font-weight: bold;
    }
    .warning {
      color: #ed8936;
    }
    .danger {
      color: #fc8181;
    }
    .success {
      color: #68d391;
    }
    #import-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: rgba(20, 20, 40, 0.9);
      border: 1px solid #334;
      border-radius: 8px;
      padding: 15px;
      z-index: 100;
    }
    .import-section {
      margin-bottom: 12px;
    }
    .import-section label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #a0aec0;
    }
    .file-input-wrapper {
      position: relative;
      display: inline-block;
    }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .file-name {
      font-size: 11px;
      color: #68d391;
      margin-top: 4px;
    }
    #markers-panel {
      position: absolute;
      bottom: 120px;
      right: 20px;
      background-color: rgba(20, 20, 40, 0.9);
      border: 1px solid #334;
      border-radius: 8px;
      padding: 15px;
      max-width: 300px;
      max-height: 250px;
      overflow-y: auto;
      z-index: 100;
    }
    .marker-item {
      padding: 8px;
      margin-bottom: 8px;
      background-color: rgba(45, 55, 72, 0.5);
      border-radius: 4px;
      font-size: 12px;
    }
    .marker-time {
      color: #ed8936;
      font-weight: bold;
    }
    .marker-type {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      margin-left: 8px;
    }
    .marker-type.collision { background-color: #fc8181; color: #1a1a1a; }
    .marker-type.no-fly { background-color: #f6ad55; color: #1a1a1a; }
    .marker-type.battery { background-color: #faf089; color: #1a1a1a; }
    .marker-type.manual { background-color: #63b3ed; color: #1a1a1a; }
    h3 {
      margin-bottom: 10px;
      font-size: 14px;
      color: #e2e8f0;
      border-bottom: 1px solid #4a5568;
      padding-bottom: 5px;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(10, 10, 26, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #4a5568;
      border-top-color: #3182ce;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 20px;
      font-size: 16px;
      color: #a0aec0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container">
      <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">加载中...</div>
      </div>
      
      <div id="import-panel">
        <h3>数据导入</h3>
        <div class="import-section">
          <label>无人机编队数据 (.json)</label>
          <div class="file-input-wrapper">
            <button>选择文件</button>
            <input type="file" id="drones-file" accept=".json">
          </div>
          <div class="file-name" id="drones-file-name">未选择</div>
        </div>
        <div class="import-section">
          <label>禁飞区数据 (.geojson)</label>
          <div class="file-input-wrapper">
            <button>选择文件</button>
            <input type="file" id="no-fly-file" accept=".geojson,.json">
          </div>
          <div class="file-name" id="no-fly-file-name">未选择</div>
        </div>
        <div class="import-section">
          <label>音乐节拍表 (.csv)</label>
          <div class="file-input-wrapper">
            <button>选择文件</button>
            <input type="file" id="beats-file" accept=".csv">
          </div>
          <div class="file-name" id="beats-file-name">未选择</div>
        </div>
        <div class="import-section">
          <label>电池批次表 (.csv)</label>
          <div class="file-input-wrapper">
            <button>选择文件</button>
            <input type="file" id="batteries-file" accept=".csv">
          </div>
          <div class="file-name" id="batteries-file-name">未选择</div>
        </div>
        <div class="import-section">
          <button id="load-sample" class="primary">加载示例数据</button>
        </div>
      </div>
      
      <div id="stats-panel">
        <h3>实时状态</h3>
        <div class="stat-item">
          <span class="stat-label">当前时间:</span>
          <span class="stat-value" id="stat-current-time">00:00.000</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">总时长:</span>
          <span class="stat-value" id="stat-total-time">00:00.000</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">无人机数量:</span>
          <span class="stat-value" id="stat-drone-count">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">活动无人机:</span>
          <span class="stat-value" id="stat-active-drones">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">禁飞区数量:</span>
          <span class="stat-value" id="stat-no-fly-count">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">碰撞风险:</span>
          <span class="stat-value success" id="stat-collision-risk">无</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">禁飞区穿越:</span>
          <span class="stat-value success" id="stat-no-fly-violation">无</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">低电量警告:</span>
          <span class="stat-value success" id="stat-battery-warning">无</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">最小距离:</span>
          <span class="stat-value" id="stat-min-distance">-</span>
        </div>
      </div>
      
      <div id="markers-panel">
        <h3>事件标记</h3>
        <div id="markers-list">
          <p style="color: #a0aec0; font-size: 12px;">暂无标记</p>
        </div>
      </div>
    </div>
    
    <div id="controls">
      <div class="control-row">
        <button id="play-btn">播放</button>
        <button id="pause-btn">暂停</button>
        <button id="reset-btn">重置</button>
        <button id="add-marker-btn">标记当前位置</button>
        <div class="timeline-container">
          <div id="timeline">
            <div id="timeline-progress"></div>
            <div id="timeline-marker"></div>
          </div>
        </div>
        <div class="time-display">
          <span id="current-time">00:00.000</span> / <span id="total-time">00:00.000</span>
        </div>
      </div>
      <div class="control-row">
        <button id="save-session-btn">保存会话</button>
        <button id="load-session-btn">加载会话</button>
        <button id="export-markdown-btn">导出 Markdown</button>
        <button id="export-csv-btn">导出 CSV</button>
        <button id="export-json-btn">导出 JSON</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
