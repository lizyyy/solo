        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#2e7d32", "id": "date", "label": "date", "shape": "dot", "size": 25, "title": "\u6807\u51c6\u5b57\u6bb5: date\n\u9996\u6b21\u51fa\u73b0: v1\n\u6700\u540e\u51fa\u73b0: v4"}, {"color": "#78909c", "id": "order_date", "label": "order_date", "shape": "dot", "size": 15, "title": "\u522b\u540d: order_date\n\u7248\u672c: v2\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#78909c", "id": "transaction_date", "label": "transaction_date", "shape": "dot", "size": 15, "title": "\u522b\u540d: transaction_date\n\u7248\u672c: v3\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#1976d2", "id": "sale_date", "label": "sale_date", "shape": "dot", "size": 20, "title": "\u522b\u540d: sale_date\n\u7248\u672c: v4\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#2e7d32", "id": "user_id", "label": "user_id", "shape": "dot", "size": 25, "title": "\u6807\u51c6\u5b57\u6bb5: user_id\n\u9996\u6b21\u51fa\u73b0: v1\n\u6700\u540e\u51fa\u73b0: v4"}, {"color": "#78909c", "id": "customer_id", "label": "customer_id", "shape": "dot", "size": 15, "title": "\u522b\u540d: customer_id\n\u7248\u672c: v2\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#1976d2", "id": "buyer_id", "label": "buyer_id", "shape": "dot", "size": 20, "title": "\u522b\u540d: buyer_id\n\u7248\u672c: v3\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#2e7d32", "id": "user_name", "label": "user_name", "shape": "dot", "size": 25, "title": "\u6807\u51c6\u5b57\u6bb5: user_name\n\u9996\u6b21\u51fa\u73b0: v1\n\u6700\u540e\u51fa\u73b0: v4"}, {"color": "#78909c", "id": "customer_name", "label": "customer_name", "shape": "dot", "size": 15, "title": "\u522b\u540d: customer_name\n\u7248\u672c: v2\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#1976d2", "id": "buyer_name", "label": "buyer_name", "shape": "dot", "size": 20, "title": "\u522b\u540d: buyer_name\n\u7248\u672c: v3\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#2e7d32", "id": "order_id", "label": "order_id", "shape": "dot", "size": 25, "title": "\u6807\u51c6\u5b57\u6bb5: order_id\n\u9996\u6b21\u51fa\u73b0: v1\n\u6700\u540e\u51fa\u73b0: v4"}, {"color": "#78909c", "id": "order_no", "label": "order_no", "shape": "dot", "size": 15, "title": "\u522b\u540d: order_no\n\u7248\u672c: v2\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#78909c", "id": "transaction_id", "label": "transaction_id", "shape": "dot", "size": 15, "title": "\u522b\u540d: transaction_id\n\u7248\u672c: v3\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#1976d2", "id": "order_number", "label": "order_number", "shape": "dot", "size": 20, "title": "\u522b\u540d: order_number\n\u7248\u672c: v4\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#2e7d32", "id": "order_amount", "label": "order_amount", "shape": "dot", "size": 25, "title": "\u6807\u51c6\u5b57\u6bb5: order_amount\n\u9996\u6b21\u51fa\u73b0: v1\n\u6700\u540e\u51fa\u73b0: v4"}, {"color": "#78909c", "id": "total_amount", "label": "total_amount", "shape": "dot", "size": 15, "title": "\u522b\u540d: total_amount\n\u7248\u672c: v2\n\u7c7b\u578b: float64\n\u52a8\u4f5c: renamed_from"}, {"color": "#78909c", "id": "payment_amount", "label": "payment_amount", "shape": "dot", "size": 15, "title": "\u522b\u540d: payment_amount\n\u7248\u672c: v3\n\u7c7b\u578b: float64\n\u52a8\u4f5c: renamed_from"}, {"color": "#1976d2", "id": "amount", "label": "amount", "shape": "dot", "size": 20, "title": "\u522b\u540d: amount\n\u7248\u672c: v4\n\u7c7b\u578b: float64\n\u52a8\u4f5c: renamed_from"}, {"color": "#2e7d32", "id": "product_name", "label": "product_name", "shape": "dot", "size": 25, "title": "\u6807\u51c6\u5b57\u6bb5: product_name\n\u9996\u6b21\u51fa\u73b0: v1\n\u6700\u540e\u51fa\u73b0: v4"}, {"color": "#78909c", "id": "item_name", "label": "item_name", "shape": "dot", "size": 15, "title": "\u522b\u540d: item_name\n\u7248\u672c: v2\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#1976d2", "id": "product", "label": "product", "shape": "dot", "size": 20, "title": "\u522b\u540d: product\n\u7248\u672c: v3\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#2e7d32", "id": "quantity", "label": "quantity", "shape": "dot", "size": 25, "title": "\u6807\u51c6\u5b57\u6bb5: quantity\n\u9996\u6b21\u51fa\u73b0: v1\n\u6700\u540e\u51fa\u73b0: v4"}, {"color": "#78909c", "id": "qty", "label": "qty", "shape": "dot", "size": 15, "title": "\u522b\u540d: qty\n\u7248\u672c: v2\n\u7c7b\u578b: int64\n\u52a8\u4f5c: renamed_from"}, {"color": "#1976d2", "id": "qty_ordered", "label": "qty_ordered", "shape": "dot", "size": 20, "title": "\u522b\u540d: qty_ordered\n\u7248\u672c: v3\n\u7c7b\u578b: int64\n\u52a8\u4f5c: renamed_from"}, {"color": "#2e7d32", "id": "channel", "label": "channel", "shape": "dot", "size": 25, "title": "\u6807\u51c6\u5b57\u6bb5: channel\n\u9996\u6b21\u51fa\u73b0: v1\n\u6700\u540e\u51fa\u73b0: v4"}, {"color": "#78909c", "id": "purchase_channel", "label": "purchase_channel", "shape": "dot", "size": 15, "title": "\u522b\u540d: purchase_channel\n\u7248\u672c: v2\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#1976d2", "id": "sales_channel", "label": "sales_channel", "shape": "dot", "size": 20, "title": "\u522b\u540d: sales_channel\n\u7248\u672c: v3\n\u7c7b\u578b: object\n\u52a8\u4f5c: renamed_from"}, {"color": "#2e7d32", "id": "discount", "label": "discount", "shape": "dot", "size": 25, "title": "\u6807\u51c6\u5b57\u6bb5: discount\n\u9996\u6b21\u51fa\u73b0: v3\n\u6700\u540e\u51fa\u73b0: v3"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#ff9800", "from": "date", "title": "\u91cd\u547d\u540d: date -\u003e order_date", "to": "order_date"}, {"arrows": "to", "color": "#ff9800", "from": "order_date", "title": "\u91cd\u547d\u540d: order_date -\u003e transaction_date", "to": "transaction_date"}, {"arrows": "to", "color": "#ff9800", "from": "transaction_date", "title": "\u91cd\u547d\u540d: transaction_date -\u003e sale_date", "to": "sale_date"}, {"arrows": "to", "color": "#ff9800", "from": "user_id", "title": "\u91cd\u547d\u540d: user_id -\u003e customer_id", "to": "customer_id"}, {"arrows": "to", "color": "#ff9800", "from": "customer_id", "title": "\u91cd\u547d\u540d: customer_id -\u003e buyer_id", "to": "buyer_id"}, {"arrows": "to", "color": "#ff9800", "from": "user_name", "title": "\u91cd\u547d\u540d: user_name -\u003e customer_name", "to": "customer_name"}, {"arrows": "to", "color": "#ff9800", "from": "customer_name", "title": "\u91cd\u547d\u540d: customer_name -\u003e buyer_name", "to": "buyer_name"}, {"arrows": "to", "color": "#ff9800", "from": "order_id", "title": "\u91cd\u547d\u540d: order_id -\u003e order_no", "to": "order_no"}, {"arrows": "to", "color": "#ff9800", "from": "order_no", "title": "\u91cd\u547d\u540d: order_no -\u003e transaction_id", "to": "transaction_id"}, {"arrows": "to", "color": "#ff9800", "from": "transaction_id", "title": "\u91cd\u547d\u540d: transaction_id -\u003e order_number", "to": "order_number"}, {"arrows": "to", "color": "#ff9800", "from": "order_amount", "title": "\u91cd\u547d\u540d: order_amount -\u003e total_amount", "to": "total_amount"}, {"arrows": "to", "color": "#ff9800", "from": "total_amount", "title": "\u91cd\u547d\u540d: total_amount -\u003e payment_amount", "to": "payment_amount"}, {"arrows": "to", "color": "#ff9800", "from": "payment_amount", "title": "\u91cd\u547d\u540d: payment_amount -\u003e amount", "to": "amount"}, {"arrows": "to", "color": "#ff9800", "from": "product_name", "title": "\u91cd\u547d\u540d: product_name -\u003e item_name", "to": "item_name"}, {"arrows": "to", "color": "#ff9800", "from": "item_name", "title": "\u91cd\u547d\u540d: item_name -\u003e product", "to": "product"}, {"arrows": "to", "color": "#ff9800", "from": "quantity", "title": "\u91cd\u547d\u540d: quantity -\u003e qty", "to": "qty"}, {"arrows": "to", "color": "#ff9800", "from": "qty", "title": "\u91cd\u547d\u540d: qty -\u003e qty_ordered", "to": "qty_ordered"}, {"arrows": "to", "color": "#ff9800", "from": "channel", "title": "\u91cd\u547d\u540d: channel -\u003e purchase_channel", "to": "purchase_channel"}, {"arrows": "to", "color": "#ff9800", "from": "purchase_channel", "title": "\u91cd\u547d\u540d: purchase_channel -\u003e sales_channel", "to": "sales_channel"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "forceAtlas2Based": {
            "avoidOverlap": 0,
            "centralGravity": 0.01,
            "damping": 0.4,
            "gravitationalConstant": -50,
            "springConstant": 0.08,
            "springLength": 100
        },
        "solver": "forceAtlas2Based",
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
