[project]
name = "host-scanner"
version = "0.1.0"
description = "远程主机清单CLI - 并发探测主机连通性，生成巡检报告"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "aiohttp>=3.8",
]

[project.scripts]
host-scanner = "host_scanner.cli:main"

[tool.black]
line-length = 100
target-version = ['py38']
