[project]
name = "metaclass-analyzer"
version = "0.1.0"
description = "A Python CLI tool for analyzing and debugging metaclass-related issues"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
metaclass-analyzer = "metaclass_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metaclass_analyzer"]
