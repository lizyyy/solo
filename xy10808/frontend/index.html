<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回调签名自测台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #1a1a2e;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .header {
            background: #16213e;
            padding: 1rem 2rem;
            border-bottom: 2px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #e94560;
            font-size: 1.5rem;
        }
        .nav-tabs {
            display: flex;
            gap: 1rem;
        }
        .nav-tab {
            padding: 0.5rem 1rem;
            background: #0f3460;
            border: none;
            color: #e0e0e0;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .nav-tab.active {
            background: #e94560;
            color: white;
        }
        .nav-tab:hover {
            background: #e94560;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #0f3460;
        }
        .card h2 {
            color: #e94560;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #a0a0a0;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 4px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .btn-primary {
            background: #e94560;
            color: white;
        }
        .btn-primary:hover {
            background: #ff6b6b;
        }
        .btn-secondary {
            background: #0f3460;
            color: #e0e0e0;
        }
        .btn-secondary:hover {
            background: #1a4a7a;
        }
        .btn-success {
            background: #2ecc71;
            color: white;
        }
        .btn-success:hover {
            background: #27ae60;
        }
        .btn-warning {
            background: #f39c12;
            color: white;
        }
        .btn-warning:hover {
            background: #e67e22;
        }
        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .filter-item select {
            padding: 0.5rem;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 4px;
            color: #e0e0e0;
            font-family: inherit;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #0f3460;
        }
        th {
            background: #0f3460;
            color: #e94560;
            font-weight: bold;
        }
        tr:hover {
            background: #1a1a2e;
        }
        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-PENDING {
            background: #f39c12;
            color: white;
        }
        .status-SUCCESS {
            background: #2ecc71;
            color: white;
        }
        .status-FAILED {
            background: #e74c3c;
            color: white;
        }
        .payload-preview {
            background: #1a1a2e;
            padding: 1rem;
            border-radius: 4px;
            font-size: 0.85rem;
            overflow-x: auto;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-item {
            padding: 0.75rem;
            background: #1a1a2e;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            border-left: 3px solid #e94560;
        }
        .compare-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }
        .compare-item {
            background: #1a1a2e;
            padding: 1rem;
            border-radius: 4px;
        }
        .compare-item h4 {
            color: #e94560;
            margin-bottom: 0.5rem;
        }
        .error-text {
            color: #e74c3c;
            font-weight: bold;
        }
        .success-text {
            color: #2ecc71;
            font-weight: bold;
        }
        .link {
            color: #3498db;
            cursor: pointer;
            text-decoration: underline;
        }
        .link:hover {
            color: #5dade2;
        }
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 768px) {
            .two-col, .compare-box {
                grid-template-columns: 1fr;
            }
            .filters {
                flex-direction: column;
            }
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔐 回调签名自测台</h1>
        <div class="nav-tabs">
            <button class="nav-tab active" data-page="records">记录列表</button>
            <button class="nav-tab" data-page="create">创建记录</button>
            <button class="nav-tab" data-page="merchants">商家配置</button>
            <button class="nav-tab" data-page="samples">样例库</button>
        </div>
    </div>

    <div class="container">
        <div id="records-page" class="page active">
            <div class="card">
                <h2>📋 签名记录列表</h2>
                <div class="filters">
                    <div class="filter-item">
                        <label>状态:</label>
                        <select id="status-filter">
                            <option value="">全部</option>
                            <option value="PENDING">待验证</option>
                            <option value="SUCCESS">成功</option>
                            <option value="FAILED">失败</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>商家:</label>
                        <select id="merchant-filter">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <button class="btn btn-secondary" onclick="loadRecords()">🔄 刷新</button>
                    <button class="btn btn-secondary" onclick="exportRecords()">📥 导出CSV</button>
                </div>
                <table id="records-table">
                    <thead>
                        <tr>
                            <th>记录ID</th>
                            <th>商家ID</th>
                            <th>时间戳</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="detail-page" class="page">
            <div class="card">
                <h2>📝 记录详情</h2>
                <button class="btn btn-secondary" onclick="showPage('records')">← 返回列表</button>
                <div id="detail-content"></div>
            </div>
        </div>

        <div id="create-page" class="page">
            <div class="card">
                <h2>➕ 创建签名记录</h2>
                <div class="two-col">
                    <div>
                        <div class="form-group">
                            <label>商家ID</label>
                            <select id="create-merchant-id">
                                <option value="">选择商家</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>时间戳 (Unix秒)</label>
                            <input type="number" id="create-timestamp" placeholder="留空使用当前时间">
                        </div>
                        <div class="form-group">
                            <label>Nonce (防重放)</label>
                            <input type="text" id="create-nonce" placeholder="可选">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>请求载荷 (JSON)</label>
                            <textarea id="create-payload" placeholder='{"order_id": "123", "amount": 100}'></textarea>
                        </div>
                        <div class="form-group">
                            <label>签名</label>
                            <input type="text" id="create-signature" placeholder="HMAC-SHA256签名">
                        </div>
                        <button class="btn btn-primary" onclick="generateSignature()">🔑 生成正确签名</button>
                    </div>
                </div>
                <div class="form-group">
                    <button class="btn btn-primary" onclick="createRecord()">✅ 创建记录</button>
                    <button class="btn btn-secondary" onclick="clearCreateForm()">🗑️ 清空表单</button>
                </div>
            </div>
        </div>

        <div id="merchants-page" class="page">
            <div class="card">
                <h2>🏪 商家配置</h2>
                <div class="two-col">
                    <div>
                        <h3>添加商家</h3>
                        <div class="form-group">
                            <label>商家ID</label>
                            <input type="text" id="merchant-id" placeholder="例如: MCH001">
                        </div>
                        <div class="form-group">
                            <label>商家名称</label>
                            <input type="text" id="merchant-name" placeholder="例如: 测试商家">
                        </div>
                        <div class="form-group">
                            <label>密钥</label>
                            <input type="text" id="merchant-secret" placeholder="HMAC密钥">
                        </div>
                        <div class="form-group">
                            <label>算法</label>
                            <select id="merchant-algorithm">
                                <option value="HMAC-SHA256">HMAC-SHA256</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>时间窗口 (秒)</label>
                            <input type="number" id="merchant-window" value="300">
                        </div>
                        <button class="btn btn-primary" onclick="addMerchant()">➕ 添加商家</button>
                    </div>
                    <div>
                        <h3>商家列表</h3>
                        <table id="merchants-table">
                            <thead>
                                <tr>
                                    <th>商家ID</th>
                                    <th>名称</th>
                                    <th>算法</th>
                                    <th>窗口</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="samples-page" class="page">
            <div class="card">
                <h2>📚 样例库</h2>
                <div class="filters">
                    <div class="filter-item">
                        <label>结果:</label>
                        <select id="sample-filter" onchange="loadSamples()">
                            <option value="">全部</option>
                            <option value="1">成功</option>
                            <option value="0">失败</option>
                        </select>
                    </div>
                    <button class="btn btn-secondary" onclick="loadSamples()">🔄 刷新</button>
                    <button class="btn btn-secondary" onclick="exportSamples()">📥 导出CSV</button>
                </div>
                <table id="samples-table">
                    <thead>
                        <tr>
                            <th>样例ID</th>
                            <th>商家ID</th>
                            <th>结果</th>
                            <th>备注</th>
                            <th>创建时间</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
