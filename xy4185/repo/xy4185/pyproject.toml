[project]
name = "subtitles-inspector"
version = "1.0.0"
description = "演出字幕包巡检员 - 剧场字幕机管理员专用工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "chardet>=5.0.0",
    "rich>=12.0.0",
    "python-docx>=0.8.11",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
]

[project.scripts]
subtitle-inspector = "subtitle_inspector.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
