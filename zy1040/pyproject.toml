[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bake-calc"
version = "0.1.0"
description = "烘焙店配方成本和过敏原替换工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "click>=8.0.0",
]

[project.scripts]
bake-calc = "bake_calc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bake_calc"]
