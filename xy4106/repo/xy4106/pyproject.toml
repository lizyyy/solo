[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "braille-proofreader"
version = "0.1.0"
description = "盲文教材分页校对员 - 专为特教老师设计的盲文教材制作工具"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "盲文教材工具开发团队"}
]
keywords = ["braille", "盲文", "education", "特殊教育", "proofreader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
braille-proofreader = "braille_proofreader.cli:cli"
br = "braille_proofreader.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["braille_proofreader*"]

[tool.setuptools.package-data]
braille_proofreader = ["*.py"]
