server {
    listen 80;
    server_name example.com;

    location /api {
        proxy_pass http://backend-v1;
    }

    location /api/v2 {
        proxy_pass http://backend-v2;
    }

    location = /health {
        return 200 "ok";
    }

    location ^~ /static/ {
        root /var/www/static;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~* \.(jpg|jpeg|png|gif)$ {
        expires 30d;
    }

    location /admin {
        auth_basic "Admin Area";
    }

    location /admin/api {
        proxy_pass http://admin-api;
    }
}
