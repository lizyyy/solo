spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/paymentguard
    driver-class-name: org.postgresql.Driver
    username: paymentguard
    password: paymentguard123
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000

  rabbitmq:
    host: localhost
    port: 5672
    username: paymentguard
    password: paymentguard123
    virtual-host: /paymentguard
