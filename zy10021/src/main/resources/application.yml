server:
  port: 8080

spring:
  application:
    name: payment-guard

  datasource:
    url: jdbc:h2:mem:paymentguard;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 3000

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirms: true
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,beans,mappings
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.paymentguard: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] [%X{spanId:-}] %-5level %logger{36} - %msg%n"

paymentguard:
  tracing:
    enabled: true
    header-name: X-Trace-Id
    span-header-name: X-Span-Id

  idempotency:
    header-name: X-Idempotency-Key
    default-ttl: 86400
    cache-prefix: "idempotency:"

  simulator:
    default-concurrency: 10
    default-duration: 10
    failure-rate: 0.1
    timeout-rate: 0.05
