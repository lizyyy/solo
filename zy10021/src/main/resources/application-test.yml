server:
  port: 8080

spring:
  application:
    name: payment-guard-test

  datasource:
    url: jdbc:h2:mem:paymentguard_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672

logging:
  level:
    com.paymentguard: DEBUG
    org.hibernate.SQL: DEBUG
