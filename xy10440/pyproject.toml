[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-audit-cli"
version = "1.0.0"
description = "出差报销票据审核 CLI 工具"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
expense-audit = "expense_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
