<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG 引用缺失巡检 - 小看板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f7fa;
      color: #303133;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .header p { opacity: 0.9; font-size: 14px; }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 32px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-card .number {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 4px;
    }
    .stat-card .label {
      font-size: 13px;
      color: #909399;
    }
    .stat-card.warning .number { color: #e6a23c; }
    .stat-card.danger .number { color: #f56c6c; }
    .section {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-success { background: #67c23a; color: white; }
    .btn-warning { background: #e6a23c; color: white; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }
    .btn-group { display: flex; gap: 8px; }
    .tabs {
      display: flex;
      border-bottom: 1px solid #e4e7ed;
      margin-bottom: 20px;
    }
    .tab {
      padding: 12px 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #909399;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #ebeef5;
    }
    th {
      background: #fafafa;
      font-weight: 600;
      color: #606266;
    }
    tr:hover { background: #f5f7fa; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-pending { background: #fdf6ec; color: #e6a23c; }
    .badge-confirmed { background: #f0f9eb; color: #67c23a; }
    .badge-high { background: #fef0f0; color: #f56c6c; }
    .badge-medium { background: #fdf6ec; color: #e6a23c; }
    .badge-low { background: #ecf5ff; color: #409eff; }
    .issue-card {
      border: 1px solid #ebeef5;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .issue-card h4 {
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .issue-card .meta {
      font-size: 12px;
      color: #909399;
      margin-bottom: 8px;
    }
    .issue-card .desc {
      font-size: 13px;
      color: #606266;
      line-height: 1.6;
    }
    .issue-card .next-step {
      margin-top: 12px;
      padding: 8px 12px;
      background: #f5f7fa;
      border-radius: 6px;
      font-size: 13px;
    }
    .issue-card .next-step strong { color: #667eea; }
    .log-item {
      padding: 12px;
      border-left: 3px solid #667eea;
      background: #f5f7fa;
      margin-bottom: 8px;
      border-radius: 0 6px 6px 0;
    }
    .log-item .action { font-weight: 600; font-size: 14px; }
    .log-item .meta { font-size: 12px; color: #909399; margin-top: 4px; }
    .log-item .details { font-size: 13px; color: #606266; margin-top: 4px; }
    .empty {
      text-align: center;
      padding: 40px;
      color: #909399;
      font-size: 14px;
    }
    pre {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    .form-row {
      margin-bottom: 16px;
    }
    .form-row label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #606266;
    }
    .form-row input, .form-row textarea, .form-row select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .form-row input:focus, .form-row textarea:focus, .form-row select:focus {
      outline: none;
      border-color: #667eea;
    }
    .form-row textarea { min-height: 80px; resize: vertical; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .operator-badge {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 RAG 引用缺失巡检</h1>
    <p>把脱敏规则备注和灰度批次现场说法的证据整合到同一个结果里</p>
  </div>

  <div class="container">
    <div class="stats-grid" id="statsGrid">
    </div>

    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div class="section-title" style="margin-bottom: 0;">
          📊 快捷操作
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="runInspection()">▶️ 执行巡检</button>
          <button class="btn btn-success" onclick="loadDemoData()">📦 加载演示数据</button>
        </div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('overview')">📋 概览</div>
      <div class="tab" onclick="switchTab('rules')">📜 脱敏规则</div>
      <div class="tab" onclick="switchTab('batches')">📦 灰度批次</div>
      <div class="tab" onclick="switchTab('phone')">📱 手机号漏遮</div>
      <div class="tab" onclick="switchTab('reports')">📄 导出报告</div>
      <div class="tab" onclick="switchTab('audit')">📝 审计日志</div>
    </div>

    <div id="tab-overview" class="tab-content active">
      <div class="section">
        <div class="section-title">⚠️ 最新巡检发现的问题</div>
        <div id="latestIssues"></div>
      </div>
      <div class="section">
        <div class="section-title">📝 最近操作记录</div>
        <div id="recentLogs"></div>
      </div>
    </div>

    <div id="tab-rules" class="tab-content">
      <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <div class="section-title" style="margin-bottom: 0;">📜 脱敏规则列表</div>
          <button class="btn btn-primary btn-sm" onclick="showAddRuleModal()">+ 导入规则</button>
        </div>
        <div id="rulesTable"></div>
      </div>
    </div>

    <div id="tab-batches" class="tab-content">
      <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <div class="section-title" style="margin-bottom: 0;">📦 灰度批次列表</div>
          <button class="btn btn-primary btn-sm" onclick="showAddBatchModal()">+ 补录批次</button>
        </div>
        <div id="batchesTable"></div>
      </div>
    </div>

    <div id="tab-phone" class="tab-content">
      <div class="section">
        <div class="section-title">📱 手机号漏遮问题（留待算法同事复核）</div>
        <div id="phoneIssues"></div>
      </div>
    </div>

    <div id="tab-reports" class="tab-content">
      <div class="section">
        <div class="section-title">📄 导出报告</div>
        <div id="reportsList"></div>
      </div>
    </div>

    <div id="tab-audit" class="tab-content">
      <div class="section">
        <div class="section-title">📝 审计日志（谁改了什么、为什么改）</div>
        <div id="auditLogs"></div>
      </div>
    </div>
  </div>

  <div id="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 12px; padding: 24px; width: 500px; max-width: 90%; max-height: 80vh; overflow-y: auto;">
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    let currentOperator = '算法运营老唐';

    async function api(path, options = {}) {
      const safeOperator = encodeURIComponent(currentOperator);
      const res = await fetch('/api' + path, {
        headers: {
          'Content-Type': 'application/json',
          'x-operator': safeOperator,
          ...options.headers
        },
        ...options
      });
      return res.json();
    }

    async function loadDashboard() {
      const data = await api('/dashboard');
      renderStats(data.stats);
      renderLatestIssues(data.latestInspection);
      renderRecentLogs(data.recentAuditLogs);
    }

    function renderStats(stats) {
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card">
          <div class="number">${stats.ruleCount}</div>
          <div class="label">脱敏规则</div>
        </div>
        <div class="stat-card">
          <div class="number">${stats.batchCount}</div>
          <div class="label">灰度批次</div>
        </div>
        <div class="stat-card">
          <div class="number">${stats.inspectionCount}</div>
          <div class="label">巡检次数</div>
        </div>
        <div class="stat-card ${stats.pendingPhoneIssueCount > 0 ? 'warning' : ''}">
          <div class="number">${stats.pendingPhoneIssueCount}</div>
          <div class="label">待复核手机号</div>
        </div>
        <div class="stat-card">
          <div class="number">${stats.exportCount}</div>
          <div class="label">导出报告</div>
        </div>
        <div class="stat-card">
          <div class="number">${stats.auditLogCount}</div>
          <div class="label">审计日志</div>
        </div>
      `;
    }

    function renderLatestIssues(inspection) {
      const el = document.getElementById('latestIssues');
      if (!inspection || inspection.gaps.length === 0) {
        el.innerHTML = '<div class="empty">暂无巡检数据，点击「执行巡检」开始</div>';
        return;
      }
      el.innerHTML = inspection.gaps.map(gap => `
        <div class="issue-card">
          <h4>
            <span class="badge badge-${gap.severity}">${gap.severity === 'high' ? '高' : '中'}</span>
            ${gap.description}
          </h4>
          <div class="meta">
            关联规则: ${gap.ruleName || '未关联'}
            ${gap.batchNo ? ' | 批次: ' + gap.batchNo : ''}
          </div>
          <div class="desc">
            <strong>❓ 为什么留下:</strong> ${gap.description}<br>
            <strong>📦 还缺什么:</strong> ${gap.missing}
          </div>
          <div class="next-step">
            <strong>🎯 下一步找谁:</strong> ${gap.owner} | 
            <strong>📝 具体行动:</strong> ${gap.nextStep}
          </div>
        </div>
      `).join('');
    }

    function renderRecentLogs(logs) {
      const el = document.getElementById('recentLogs');
      if (!logs || logs.length === 0) {
        el.innerHTML = '<div class="empty">暂无操作记录</div>';
        return;
      }
      const actionMap = {
        'import_rule': '📥 导入脱敏规则',
        'add_gray_batch': '➕ 补录灰度批次',
        'run_inspection': '🔍 执行巡检',
        'update_phone_issue': '✏️  复核手机号问题',
        'rerun_inspection': '🔄 重跑巡检',
        'update_export': '📄 更新导出报告'
      };
      el.innerHTML = logs.map(log => `
        <div class="log-item">
          <div class="action">${actionMap[log.action] || log.action}</div>
          <div class="meta">
            <span class="operator-badge">${log.operator}</span>
             · ${new Date(log.timestamp).toLocaleString('zh-CN')}
          </div>
          <div class="details">${JSON.stringify(log.details)}</div>
        </div>
      `).join('');
    }

    async function loadRules() {
      const rules = await api('/rules');
      const el = document.getElementById('rulesTable');
      if (rules.length === 0) {
        el.innerHTML = '<div class="empty">暂无脱敏规则</div>';
        return;
      }
      el.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>规则名称</th>
              <th>备注/主流程</th>
              <th>导入人</th>
              <th>导入时间</th>
            </tr>
          </thead>
          <tbody>
            ${rules.map(r => `
              <tr>
                <td><strong>${r.name}</strong></td>
                <td>${r.remark || '<span style="color:#f56c6c">未填写</span>'}</td>
                <td>${r.importedBy}</td>
                <td>${new Date(r.importedAt).toLocaleString('zh-CN')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function loadBatches() {
      const batches = await api('/batches');
      const rules = await api('/rules');
      const ruleMap = {};
      rules.forEach(r => ruleMap[r.id] = r.name);
      const el = document.getElementById('batchesTable');
      if (batches.length === 0) {
        el.innerHTML = '<div class="empty">暂无灰度批次</div>';
        return;
      }
      el.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>批次号</th>
              <th>现场说法</th>
              <th>关联规则</th>
              <th>录入人</th>
              <th>录入时间</th>
            </tr>
          </thead>
          <tbody>
            ${batches.map(b => `
              <tr>
                <td><strong>${b.batchNo}</strong></td>
                <td>${b.sceneStatement || '<span style="color:#f56c6c">未填写</span>'}</td>
                <td>${ruleMap[b.relatedRuleId] || '未关联'}</td>
                <td>${b.addedBy}</td>
                <td>${new Date(b.addedAt).toLocaleString('zh-CN')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function loadPhoneIssues() {
      const issues = await api('/phone-issues');
      const el = document.getElementById('phoneIssues');
      if (issues.length === 0) {
        el.innerHTML = '<div class="empty">暂无手机号漏遮问题</div>';
        return;
      }
      el.innerHTML = issues.map(issue => `
        <div class="issue-card">
          <h4>
            📱 ${issue.phoneNumber}
            <span class="badge badge-${issue.status === 'pending_review' ? 'pending' : 'confirmed'}">
              ${issue.status === 'pending_review' ? '待算法同事复核' : '已确认'}
            </span>
          </h4>
          <div class="meta">
            来源: ${issue.sourceName} · 发现时间: ${new Date(issue.detectedAt).toLocaleString('zh-CN')}
          </div>
          <div class="desc">${issue.note}</div>
          ${issue.status === 'pending_review' ? `
            <div style="margin-top: 12px;">
              <button class="btn btn-success btn-sm" onclick="reviewPhoneIssue('${issue.id}')">✅ 算法同事复核确认</button>
            </div>
          ` : `
            <div class="next-step">
              <strong>复核人:</strong> ${issue.reviewedBy} · <strong>复核说明:</strong> ${issue.reviewNote || '无'}
            </div>
          `}
        </div>
      `).join('');
    }

    async function loadReports() {
      const reports = await api('/exports');
      const el = document.getElementById('reportsList');
      if (reports.length === 0) {
        el.innerHTML = '<div class="empty">暂无导出报告</div>';
        return;
      }
      el.innerHTML = reports.map(r => `
        <div class="issue-card">
          <h4>📄 巡检导出报告</h4>
          <div class="meta">
            导出时间: ${new Date(r.createdAt).toLocaleString('zh-CN')}
            · 状态: <span class="badge badge-${r.status === 'generated' ? 'confirmed' : 'pending'}">${r.status}</span>
          </div>
          <pre>${r.content}</pre>
        </div>
      `).join('');
    }

    async function loadAuditLogs() {
      const logs = await api('/audit-logs');
      const el = document.getElementById('auditLogs');
      if (logs.length === 0) {
        el.innerHTML = '<div class="empty">暂无审计日志</div>';
        return;
      }
      const actionMap = {
        'import_rule': '📥 导入脱敏规则',
        'add_gray_batch': '➕ 补录灰度批次',
        'run_inspection': '🔍 执行巡检',
        'update_phone_issue': '✏️  更新手机号问题',
        'rerun_inspection': '🔄 重跑巡检',
        'update_export': '📄 更新导出报告'
      };
      el.innerHTML = logs.slice().reverse().map(log => `
        <div class="log-item">
          <div class="action">${actionMap[log.action] || log.action}</div>
          <div class="meta">
            <span class="operator-badge">${log.operator}</span>
             · ${new Date(log.timestamp).toLocaleString('zh-CN')}
          </div>
          <div class="details">${JSON.stringify(log.details)}</div>
        </div>
      `).join('');
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
      
      if (tabName === 'rules') loadRules();
      if (tabName === 'batches') loadBatches();
      if (tabName === 'phone') loadPhoneIssues();
      if (tabName === 'reports') loadReports();
      if (tabName === 'audit') loadAuditLogs();
    }

    async function runInspection() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '巡检中...';
      const result = await api('/inspections/run', { method: 'POST' });
      btn.disabled = false;
      btn.textContent = '▶️ 执行巡检';
      alert('巡检完成！发现 ' + result.inspection.gaps.length + ' 个引用缺失问题，' + result.inspection.phoneIssues.length + ' 个手机号漏遮问题');
      loadDashboard();
    }

    async function loadDemoData() {
      if (!confirm('确定要加载演示数据吗？这将清空现有数据。')) return;
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '加载中...';
      await fetch('/api/health');
      alert('请在命令行运行: npm run demo\n\n完成后刷新页面查看演示数据');
      btn.disabled = false;
      btn.textContent = '📦 加载演示数据';
    }

    async function reviewPhoneIssue(id) {
      await api('/phone-issues/' + id, {
        method: 'PUT',
        body: JSON.stringify({
          status: 'confirmed',
          reviewedBy: currentOperator,
          reviewNote: '已复核，确认漏遮问题'
        })
      });
      loadPhoneIssues();
      loadDashboard();
    }

    function showAddRuleModal() {
      const rules = JSON.parse(localStorage.getItem('rules') || '[]');
      const options = rules.length > 0 ? rules.map(r => `<option value="${r.id}">${r.name}</option>`).join('') : '';
      document.getElementById('modalContent').innerHTML = `
        <h3 style="margin-bottom: 20px;">📥 导入脱敏规则</h3>
        <div class="form-row">
          <label>规则名称</label>
          <input type="text" id="ruleName" placeholder="例如：客户咨询记录脱敏规则">
        </div>
        <div class="form-row">
          <label>备注（主流程）</label>
          <textarea id="ruleRemark" placeholder="主流程：客户进线 → 坐席记录 → 敏感字段识别 → 脱敏处理 → 存储归档"></textarea>
        </div>
        <div class="form-row">
          <label>主流程详情</label>
          <textarea id="ruleMainProcess" placeholder="1. 客户进线...\n2. 坐席记录..."></textarea>
        </div>
        <div class="form-row">
          <label>规则内容</label>
          <textarea id="ruleContent" placeholder="详细的脱敏规则说明..."></textarea>
        </div>
        <div class="btn-group" style="justify-content: flex-end; margin-top: 20px;">
          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="submitRule()">导入</button>
        </div>
      `;
      document.getElementById('modal').style.display = 'flex';
    }

    async function submitRule() {
      const data = {
        name: document.getElementById('ruleName').value,
        remark: document.getElementById('ruleRemark').value,
        mainProcess: document.getElementById('ruleMainProcess').value,
        content: document.getElementById('ruleContent').value
      };
      await api('/rules', {
        method: 'POST',
        body: JSON.stringify(data)
      });
      closeModal();
      loadDashboard();
      loadRules();
    }

    async function showAddBatchModal() {
      const rules = await api('/rules');
      const options = rules.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
      document.getElementById('modalContent').innerHTML = `
        <h3 style="margin-bottom: 20px;">➕ 补录灰度批次</h3>
        <div class="form-row">
          <label>批次号</label>
          <input type="text" id="batchNo" placeholder="例如：GRAY-2024-001">
        </div>
        <div class="form-row">
          <label>关联脱敏规则</label>
          <select id="batchRuleId">
            ${options}
          </select>
        </div>
        <div class="form-row">
          <label>现场说法</label>
          <textarea id="batchScene" placeholder="现场说法：灰度批次测试中... RAG引用来源：..."></textarea>
        </div>
        <div class="form-row">
          <label>批次内容</label>
          <textarea id="batchContent" placeholder="本批次共测试..."></textarea>
        </div>
        <div class="btn-group" style="justify-content: flex-end; margin-top: 20px;">
          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="submitBatch()">补录</button>
        </div>
      `;
      document.getElementById('modal').style.display = 'flex';
    }

    async function submitBatch() {
      const data = {
        batchNo: document.getElementById('batchNo').value,
        relatedRuleId: document.getElementById('batchRuleId').value,
        sceneStatement: document.getElementById('batchScene').value,
        content: document.getElementById('batchContent').value
      };
      await api('/batches', {
        method: 'POST',
        body: JSON.stringify(data)
      });
      closeModal();
      loadDashboard();
      loadBatches();
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    loadDashboard();
  </script>
</body>
</html>
