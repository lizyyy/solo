server:
  port: 8080
  servlet:
    context-path: /diagnostic

spring:
  application:
    name: connection-pool-diagnostic
  datasource:
    url: jdbc:h2:file:./data/diagnostic;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

diagnostic:
  leak:
    threshold:
      active-connection: 80
      connection-usage-time: 300
      consecutive-samples: 3
    archive:
      retention-days: 30
      sample-interval-minutes: 5

logging:
  level:
    com.diagnostic: DEBUG
    org.hibernate.SQL: DEBUG