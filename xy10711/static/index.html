<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF表单抽取复核系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem 2rem; }
        .header h1 { font-size: 1.5rem; }
        .nav { display: flex; gap: 1rem; margin-top: 1rem; }
        .nav button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .nav button.active { background: white; color: #667eea; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .page { display: none; }
        .page.active { display: block; }
        
        /* Dashboard */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #666; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: #333; }
        .chart-container { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        
        /* Tables */
        .table-container { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 1rem; text-align: left; font-weight: 600; color: #333; border-bottom: 2px solid #e9ecef; }
        td { padding: 1rem; border-bottom: 1px solid #e9ecef; }
        tr:hover { background: #f8f9fa; }
        
        /* Status badges */
        .badge { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-extracted { background: #d1ecf1; color: #0c5460; }
        .badge-reviewed { background: #d4edda; color: #155724; }
        .badge-correction { background: #f8d7da; color: #721c24; }
        .badge-training { background: #cce5ff; color: #004085; }
        .badge-trained { background: #e2e3e5; color: #383d41; }
        .badge-completed { background: #c3e6cb; color: #155724; }
        
        /* Buttons */
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.8rem; }
        
        /* Form */
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #333; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; 
        }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 8px; padding: 2rem; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .modal-header h2 { font-size: 1.25rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #666; }
        
        /* Detail page */
        .detail-header { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .detail-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .detail-section { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .detail-section h3 { margin-bottom: 1rem; color: #333; }
        
        /* Timeline */
        .timeline { position: relative; padding-left: 2rem; }
        .timeline::before { content: ''; position: absolute; left: 0.5rem; top: 0; bottom: 0; width: 2px; background: #e9ecef; }
        .timeline-item { position: relative; padding-bottom: 1.5rem; }
        .timeline-item::before { content: ''; position: absolute; left: -1.75rem; top: 0.25rem; width: 12px; height: 12px; border-radius: 50%; background: #667eea; border: 3px solid white; box-shadow: 0 0 0 2px #667eea; }
        .timeline-time { font-size: 0.85rem; color: #666; margin-bottom: 0.25rem; }
        .timeline-actor { font-weight: 600; color: #333; margin-bottom: 0.25rem; }
        .timeline-action { color: #667eea; font-weight: 500; }
        .timeline-desc { color: #666; margin-top: 0.25rem; }
        
        /* Extraction fields */
        .extraction-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
        .extraction-card { border: 1px solid #e9ecef; border-radius: 8px; padding: 1rem; }
        .extraction-card.correct { border-color: #28a745; background: #f8fff9; }
        .extraction-card.incorrect { border-color: #dc3545; background: #fff8f8; }
        .extraction-field { font-weight: 600; margin-bottom: 0.5rem; }
        .extraction-value { color: #333; margin-bottom: 0.5rem; }
        .extraction-coords { font-size: 0.8rem; color: #999; font-family: monospace; }
        .confidence { font-size: 0.85rem; color: #666; }
        
        .hidden { display: none; }
        .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .field-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 0.5rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📄 PDF表单抽取复核系统</h1>
        <div class="nav">
            <button class="nav-btn active" data-page="dashboard">数据看板</button>
            <button class="nav-btn" data-page="templates">模板管理</button>
            <button class="nav-btn" data-page="forms">表单列表</button>
        </div>
    </div>
    
    <div class="container">
        <div id="dashboard" class="page active">
            <h2 style="margin-bottom: 1.5rem;">数据概览</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>总表单数</h3>
                    <div class="value" id="total-forms">0</div>
                </div>
                <div class="stat-card">
                    <h3>待处理</h3>
                    <div class="value" id="pending-forms">0</div>
                </div>
                <div class="stat-card">
                    <h3>已完成</h3>
                    <div class="value" id="completed-forms">0</div>
                </div>
                <div class="stat-card">
                    <h3>需修正</h3>
                    <div class="value" id="correction-forms">0</div>
                </div>
            </div>
            
            <div class="chart-container" style="height: 300px;">
                <canvas id="statusChart"></canvas>
            </div>
            
            <div class="table-container">
                <h3 style="padding: 1rem; border-bottom: 1px solid #e9ecef;">最近表单</h3>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>文件名</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="recent-forms-tbody"></tbody>
                </table>
            </div>
        </div>
        
        <div id="templates" class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>模板管理</h2>
                <button class="btn btn-primary" onclick="openTemplateModal()">+ 新建模板</button>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>模板名称</th>
                            <th>描述</th>
                            <th>创建人</th>
                            <th>字段数</th>
                            <th>关联表单</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="templates-tbody"></tbody>
                </table>
            </div>
        </div>
        
        <div id="forms" class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>表单列表</h2>
                <button class="btn btn-primary" onclick="openFormModal()">+ 新建表单</button>
            </div>
            
            <div style="margin-bottom: 1rem;">
                <select id="status-filter" onchange="loadForms()" class="btn" style="width: auto;">
                    <option value="">全部状态</option>
                    <option value="extracted">已抽取</option>
                    <option value="reviewed">已复核</option>
                    <option value="correction_needed">需修正</option>
                    <option value="training">训练中</option>
                    <option value="trained">已训练</option>
                    <option value="completed">已完成</option>
                </select>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>文件名</th>
                            <th>模板</th>
                            <th>状态</th>
                            <th>正确率</th>
                            <th>创建人</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="forms-tbody"></tbody>
                </table>
            </div>
        </div>
        
        <div id="form-detail" class="page">
            <button class="btn" onclick="showPage('forms')" style="margin-bottom: 1rem;">← 返回列表</button>
            
            <div class="detail-header">
                <h2 id="detail-filename">表单详情</h2>
                <div class="detail-info">
                    <div>
                        <label>ID</label>
                        <div id="detail-id"></div>
                    </div>
                    <div>
                        <label>模板</label>
                        <div id="detail-template"></div>
                    </div>
                    <div>
                        <label>状态</label>
                        <div id="detail-status"></div>
                    </div>
                    <div>
                        <label>创建人</label>
                        <div id="detail-creator"></div>
                    </div>
                    <div>
                        <label>创建时间</label>
                        <div id="detail-time"></div>
                    </div>
                </div>
                <div class="actions" style="margin-top: 1rem;">
                    <button class="btn btn-warning" onclick="openReviewModal('manual')">人工复核</button>
                    <button class="btn btn-primary" onclick="openReviewModal('training')">版本训练</button>
                    <button class="btn btn-success" onclick="exportForm()">导出PDF</button>
                    <button class="btn btn-danger" onclick="recalculateForm()">重新计算坐标</button>
                </div>
            </div>
            
            <div class="detail-section">
                <h3>抽取字段</h3>
                <div id="extractions-grid" class="extraction-grid"></div>
            </div>
            
            <div class="detail-section">
                <h3>复核记录</h3>
                <div class="table-container" style="box-shadow: none;">
                    <table>
                        <thead>
                            <tr>
                                <th>复核人</th>
                                <th>类型</th>
                                <th>结果</th>
                                <th>理由</th>
                                <th>时间</th>
                            </tr>
                        </thead>
                        <tbody id="reviews-tbody"></tbody>
                    </table>
                </div>
            </div>
            
            <div class="detail-section">
                <h3>处理时间线</h3>
                <div id="timeline" class="timeline"></div>
            </div>
        </div>
    </div>
    
    <div id="template-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>新建模板</h2>
                <button class="close-btn" onclick="closeModal('template-modal')">&times;</button>
            </div>
            <div class="form-group">
                <label>模板名称</label>
                <input type="text" id="template-name" placeholder="请输入模板名称">
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea id="template-desc" rows="2" placeholder="请输入描述"></textarea>
            </div>
            <div class="form-group">
                <label>创建人</label>
                <input type="text" id="template-creator" value="质量负责人">
            </div>
            <div class="form-group">
                <label>字段配置</label>
                <div id="fields-container">
                    <div class="field-row">
                        <input type="text" placeholder="字段名" class="field-name" value="姓名">
                        <input type="number" placeholder="X1" class="field-x1" step="0.1" value="100">
                        <input type="number" placeholder="Y1" class="field-y1" step="0.1" value="200">
                        <input type="number" placeholder="X2" class="field-x2" step="0.1" value="200">
                        <input type="number" placeholder="Y2" class="field-y2" step="0.1" value="220">
                    </div>
                    <div class="field-row">
                        <input type="text" placeholder="字段名" class="field-name" value="金额">
                        <input type="number" placeholder="X1" class="field-x1" step="0.1" value="100">
                        <input type="number" placeholder="Y1" class="field-y1" step="0.1" value="250">
                        <input type="number" placeholder="X2" class="field-x2" step="0.1" value="200">
                        <input type="number" placeholder="Y2" class="field-y2" step="0.1" value="270">
                    </div>
                    <div class="field-row">
                        <input type="text" placeholder="字段名" class="field-name" value="日期">
                        <input type="number" placeholder="X1" class="field-x1" step="0.1" value="300">
                        <input type="number" placeholder="Y1" class="field-y1" step="0.1" value="200">
                        <input type="number" placeholder="X2" class="field-x2" step="0.1" value="450">
                        <input type="number" placeholder="Y2" class="field-y2" step="0.1" value="220">
                    </div>
                </div>
                <button class="btn btn-sm" onclick="addFieldRow()" style="margin-top: 0.5rem;">+ 添加字段</button>
            </div>
            <button class="btn btn-primary" onclick="createTemplate()">创建模板</button>
        </div>
    </div>
    
    <div id="form-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>新建表单</h2>
                <button class="close-btn" onclick="closeModal('form-modal')">&times;</button>
            </div>
            <div class="form-group">
                <label>选择模板</label>
                <select id="form-template"></select>
            </div>
            <div class="form-group">
                <label>文件名</label>
                <input type="text" id="form-filename" placeholder="请输入文件名" value="报销单_001.pdf">
            </div>
            <div class="form-group">
                <label>创建人</label>
                <input type="text" id="form-creator" value="张三">
            </div>
            <button class="btn btn-primary" onclick="createForm()">创建表单</button>
        </div>
    </div>
    
    <div id="review-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="review-title">复核处理</h2>
                <button class="close-btn" onclick="closeModal('review-modal')">&times;</button>
            </div>
            <div class="form-group">
                <label>复核人</label>
                <input type="text" id="reviewer" value="李四">
            </div>
            <div class="form-group">
                <label>处理结果</label>
                <select id="review-status">
                    <option value="failed">处理失败</option>
                    <option value="retrain">需要重新训练</option>
                    <option value="success">复核通过</option>
                </select>
            </div>
            <div class="form-group">
                <label>处理理由</label>
                <textarea id="review-reason" rows="4" placeholder="请详细说明处理理由..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="submitReview()">提交</button>
        </div>
    </div>

    <script>
        let currentFormId = null;
        let currentReviewType = null;
        let statusChart = null;
        
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelector(`[data-page="${pageId}"]`).classList.add('active');
            
            if (pageId === 'dashboard') loadDashboard();
            if (pageId === 'templates') loadTemplates();
            if (pageId === 'forms') loadForms();
        }
        
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => showPage(btn.dataset.page));
        });
        
        async function loadDashboard() {
            const res = await fetch('/api/dashboard');
            const data = await res.json();
            
            document.getElementById('total-forms').textContent = data.total_forms;
            document.getElementById('pending-forms').textContent = data.status_stats.extracted || 0;
            document.getElementById('completed-forms').textContent = data.status_stats.completed || 0;
            document.getElementById('correction-forms').textContent = data.status_stats.correction_needed || 0;
            
            const labels = [];
            const values = [];
            const colors = [];
            const colorMap = {
                pending: '#ffc107',
                extracted: '#17a2b8',
                reviewed: '#28a745',
                correction_needed: '#dc3545',
                training: '#007bff',
                trained: '#6c757d',
                completed: '#28a745'
            };
            const labelMap = {
                pending: '待处理',
                extracted: '已抽取',
                reviewed: '已复核',
                correction_needed: '需修正',
                training: '训练中',
                trained: '已训练',
                completed: '已完成'
            };
            
            for (const [status, count] of Object.entries(data.status_stats)) {
                labels.push(labelMap[status] || status);
                values.push(count);
                colors.push(colorMap[status] || '#6c757d');
            }
            
            if (statusChart) statusChart.destroy();
            const ctx = document.getElementById('statusChart').getContext('2d');
            statusChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels, datasets: [{ data: values, backgroundColor: colors }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });
            
            const tbody = document.getElementById('recent-forms-tbody');
            tbody.innerHTML = data.recent_forms.map(f => `
                <tr>
                    <td>${f.id}</td>
                    <td>${f.filename}</td>
                    <td><span class="badge badge-${f.status}">${getStatusLabel(f.status)}</span></td>
                    <td>${formatTime(f.created_at)}</td>
                    <td><button class="btn btn-sm btn-primary" onclick="viewForm(${f.id})">查看</button></td>
                </tr>
            `).join('');
        }
        
        async function loadTemplates() {
            const res = await fetch('/api/templates');
            const data = await res.json();
            const tbody = document.getElementById('templates-tbody');
            tbody.innerHTML = data.map(t => `
                <tr>
                    <td>${t.id}</td>
                    <td>${t.name}</td>
                    <td>${t.description || '-'}</td>
                    <td>${t.created_by}</td>
                    <td>${t.fields_count}</td>
                    <td>${t.forms_count}</td>
                    <td>${formatTime(t.created_at)}</td>
                    <td><button class="btn btn-sm btn-primary" onclick="viewTemplate(${t.id})">详情</button></td>
                </tr>
            `).join('');
        }
        
        async function loadForms() {
            const status = document.getElementById('status-filter').value;
            const url = status ? `/api/forms?status=${status}` : '/api/forms';
            const res = await fetch(url);
            const data = await res.json();
            const tbody = document.getElementById('forms-tbody');
            tbody.innerHTML = data.map(f => `
                <tr>
                    <td>${f.id}</td>
                    <td>${f.filename}</td>
                    <td>${f.template_name || '-'}</td>
                    <td><span class="badge badge-${f.status}">${getStatusLabel(f.status)}</span></td>
                    <td>${(f.correct_rate * 100).toFixed(1)}%</td>
                    <td>${f.created_by}</td>
                    <td>${formatTime(f.created_at)}</td>
                    <td><button class="btn btn-sm btn-primary" onclick="viewForm(${f.id})">详情</button></td>
                </tr>
            `).join('');
        }
        
        async function viewForm(formId) {
            currentFormId = formId;
            const res = await fetch(`/api/forms/${formId}`);
            const data = await res.json();
            
            document.getElementById('detail-filename').textContent = data.filename;
            document.getElementById('detail-id').textContent = data.id;
            document.getElementById('detail-template').textContent = data.template_name;
            document.getElementById('detail-status').innerHTML = `<span class="badge badge-${data.status}">${getStatusLabel(data.status)}</span>`;
            document.getElementById('detail-creator').textContent = data.created_by;
            document.getElementById('detail-time').textContent = formatTime(data.created_at);
            
            const extractionsGrid = document.getElementById('extractions-grid');
            extractionsGrid.innerHTML = data.extractions.map(e => `
                <div class="extraction-card ${e.is_correct === true ? 'correct' : e.is_correct === false ? 'incorrect' : ''}">
                    <div class="extraction-field">${e.field_name}</div>
                    <div class="extraction-value">抽取值: ${e.extracted_value}</div>
                    <div class="confidence">置信度: ${(e.confidence * 100).toFixed(1)}%</div>
                    <div class="extraction-coords">坐标: (${e.x1}, ${e.y1}) - (${e.x2}, ${e.y2})</div>
                    ${e.corrected_value ? `<div>修正值: ${e.corrected_value}</div>` : ''}
                    <div class="actions" style="margin-top: 0.5rem;">
                        <button class="btn btn-sm btn-success" onclick="markCorrect(${e.id}, true)">✓ 正确</button>
                        <button class="btn btn-sm btn-danger" onclick="markCorrect(${e.id}, false)">✗ 错误</button>
                    </div>
                </div>
            `).join('');
            
            const reviewsTbody = document.getElementById('reviews-tbody');
            reviewsTbody.innerHTML = data.reviews.map(r => `
                <tr>
                    <td>${r.reviewer}</td>
                    <td>${r.review_type === 'manual' ? '人工复核' : r.review_type === 'training' ? '版本训练' : '导出复核'}</td>
                    <td>${r.status === 'failed' ? '处理失败' : r.status === 'retrain' ? '需重训' : '通过'}</td>
                    <td>${r.reason}</td>
                    <td>${formatTime(r.created_at)}</td>
                </tr>
            `).join('');
            
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = data.timeline.map(t => `
                <div class="timeline-item">
                    <div class="timeline-time">${formatTime(t.created_at)}</div>
                    <div class="timeline-actor">${t.actor}</div>
                    <div class="timeline-action">${t.action}</div>
                    <div class="timeline-desc">${t.description}</div>
                </div>
            `).join('');
            
            showPage('form-detail');
        }
        
        async function markCorrect(extractionId, isCorrect) {
            const correctedValue = isCorrect ? null : prompt('请输入修正值:');
            await fetch(`/api/extractions/${extractionId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_correct: isCorrect, corrected_value: correctedValue })
            });
            viewForm(currentFormId);
        }
        
        function openTemplateModal() {
            document.getElementById('template-modal').classList.add('active');
        }
        
        function openFormModal() {
            loadTemplateOptions();
            document.getElementById('form-modal').classList.add('active');
        }
        
        async function loadTemplateOptions() {
            const res = await fetch('/api/templates');
            const data = await res.json();
            const select = document.getElementById('form-template');
            select.innerHTML = data.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
        }
        
        function openReviewModal(type) {
            currentReviewType = type;
            document.getElementById('review-title').textContent = type === 'manual' ? '人工复核' : '版本训练';
            document.getElementById('review-reason').value = type === 'manual' ? 
                '字段"金额"抽取值"1000O"识别错误，应为"10000"，OCR将数字0误识别为字母O。' :
                '坐标偏差导致识别错误，需要重新训练模型。已收集3份相似样本用于训练。';
            document.getElementById('review-modal').classList.add('active');
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        function addFieldRow() {
            const container = document.getElementById('fields-container');
            const row = document.createElement('div');
            row.className = 'field-row';
            row.innerHTML = `
                <input type="text" placeholder="字段名" class="field-name">
                <input type="number" placeholder="X1" class="field-x1" step="0.1">
                <input type="number" placeholder="Y1" class="field-y1" step="0.1">
                <input type="number" placeholder="X2" class="field-x2" step="0.1">
                <input type="number" placeholder="Y2" class="field-y2" step="0.1">
                <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">-</button>
            `;
            container.appendChild(row);
        }
        
        async function createTemplate() {
            const fields = [];
            document.querySelectorAll('.field-row').forEach(row => {
                const name = row.querySelector('.field-name').value;
                if (name) {
                    fields.push({
                        field_name: name,
                        x1: parseFloat(row.querySelector('.field-x1').value) || 0,
                        y1: parseFloat(row.querySelector('.field-y1').value) || 0,
                        x2: parseFloat(row.querySelector('.field-x2').value) || 0,
                        y2: parseFloat(row.querySelector('.field-y2').value) || 0
                    });
                }
            });
            
            await fetch('/api/templates', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('template-name').value || '报销单模板',
                    description: document.getElementById('template-desc').value,
                    created_by: document.getElementById('template-creator').value,
                    fields
                })
            });
            
            closeModal('template-modal');
            loadTemplates();
        }
        
        async function createForm() {
            await fetch('/api/forms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    template_id: parseInt(document.getElementById('form-template').value),
                    filename: document.getElementById('form-filename').value,
                    created_by: document.getElementById('form-creator').value
                })
            });
            
            closeModal('form-modal');
            loadForms();
        }
        
        async function submitReview() {
            await fetch('/api/reviews', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    form_id: currentFormId,
                    reviewer: document.getElementById('reviewer').value,
                    review_type: currentReviewType,
                    status: document.getElementById('review-status').value,
                    reason: document.getElementById('review-reason').value
                })
            });
            
            closeModal('review-modal');
            viewForm(currentFormId);
        }
        
        async function exportForm() {
            window.open(`/api/export/${currentFormId}`, '_blank');
        }
        
        async function recalculateForm() {
            await fetch(`/api/recalculate/${currentFormId}`, { method: 'POST' });
            alert('坐标重新计算完成！');
            viewForm(currentFormId);
        }
        
        function viewTemplate(templateId) {
            alert(`查看模板 ${templateId} 详情`);
        }
        
        function formatTime(isoStr) {
            const dt = new Date(isoStr);
            return dt.toLocaleString('zh-CN');
        }
        
        function getStatusLabel(status) {
            const map = {
                pending: '待处理',
                extracted: '已抽取',
                reviewed: '已复核',
                correction_needed: '需修正',
                training: '训练中',
                trained: '已训练',
                completed: '已完成'
            };
            return map[status] || status;
        }
        
        loadDashboard();
    </script>
</body>
</html>
