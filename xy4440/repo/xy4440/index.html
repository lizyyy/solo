<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮划艇救援训练模拟器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>皮划艇救援训练模拟器</h1>
            <div class="header-controls">
                <button id="import-level-btn" class="btn">导入关卡</button>
                <button id="save-game-btn" class="btn">保存游戏</button>
                <button id="load-game-btn" class="btn">加载游戏</button>
                <button id="export-markdown-btn" class="btn">导出复盘报告</button>
                <button id="export-json-btn" class="btn">导出回放包</button>
            </div>
        </header>
        
        <main class="main-content">
            <div class="game-area">
                <canvas id="game-canvas" width="1200" height="700"></canvas>
                <div class="game-controls">
                    <button id="start-turn-btn" class="btn primary">开始回合</button>
                    <button id="end-turn-btn" class="btn" disabled>结束回合</button>
                    <button id="reset-turn-btn" class="btn">重置当前回合</button>
                    <div class="turn-info">
                        <span>回合: <strong id="current-turn">1</strong></span>
                        <span>时间: <strong id="game-time">00:00</strong></span>
                    </div>
                </div>
            </div>
            
            <div class="info-panel">
                <div class="panel-section">
                    <h3>游戏状态</h3>
                    <div class="status-info">
                        <div class="status-item">
                            <span class="status-label">得分:</span>
                            <span class="status-value" id="score">0</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">救援成功:</span>
                            <span class="status-value" id="rescued-count">0</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">待救援:</span>
                            <span class="status-value" id="pending-count">0</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">超时风险:</span>
                            <span class="status-value" id="timeout-risk">低</span>
                        </div>
                    </div>
                </div>
                
                <div class="panel-section">
                    <h3>选中对象</h3>
                    <div class="selected-object" id="selected-object-info">
                        <p>未选中任何对象</p>
                    </div>
                </div>
                
                <div class="panel-section">
                    <h3>行动日志</h3>
                    <div class="action-log" id="action-log">
                        <p>游戏开始...</p>
                    </div>
                </div>
            </div>
        </main>
        
        <div class="hidden-file-inputs">
            <input type="file" id="level-file-input" accept=".json">
            <input type="file" id="save-file-input" accept=".json">
        </div>
    </div>
    
    <script src="js/utils.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/objects.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/input.js"></script>
    <script src="js/level.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
