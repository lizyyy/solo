<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短链跳转风控台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-card .label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }

        .stat-card.banned .value {
            color: #e74c3c;
        }

        .stat-card.normal .value {
            color: #27ae60;
        }

        .search-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd6;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            border-radius: 6px 6px 0 0;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            background: #f0f3ff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f3f5;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            font-size: 13px;
            color: #555;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.banned {
            background: #ffebee;
            color: #c62828;
        }

        .status-badge.normal {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .risk-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: #fff3cd;
            color: #856404;
            margin-left: 8px;
        }

        .batch-import-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .batch-import-section textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 15px;
            resize: vertical;
        }

        .import-hint {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #1565c0;
            margin-bottom: 15px;
        }

        .chart-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .chart-actions {
            display: flex;
            gap: 10px;
        }

        .chart-container {
            height: 300px;
        }

        .source-breakdown {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .source-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .source-item .source-name {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .source-item .source-count {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .blacklist-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .blacklist-section h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .blacklist-item {
            background: #fff5f5;
            border-left: 4px solid #e74c3c;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 10px;
        }

        .blacklist-item .domain {
            font-weight: 600;
            color: #c0392b;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .blacklist-item .rule {
            font-size: 13px;
            color: #666;
            margin-bottom: 3px;
        }

        .blacklist-item .reason {
            font-size: 12px;
            color: #e74c3c;
            background: #ffebee;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .results-count {
            font-size: 14px;
            color: #666;
        }

        .results-count strong {
            color: #667eea;
            font-size: 18px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .import-results {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .import-results.success {
            background: #e8f5e9;
            display: block;
        }

        .import-results.error {
            background: #ffebee;
            display: block;
        }

        .import-results h4 {
            margin-bottom: 10px;
        }

        .import-results ul {
            margin-left: 20px;
        }

        .import-results li {
            margin-bottom: 5px;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 短链跳转风控台</h1>
            <p>实时监控短链接风险，保护用户访问安全</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">总短链数</div>
                <div class="value" id="total-slugs">0</div>
            </div>
            <div class="stat-card banned">
                <div class="label">已封禁</div>
                <div class="value" id="banned-slugs">0</div>
            </div>
            <div class="stat-card normal">
                <div class="label">正常状态</div>
                <div class="value" id="normal-slugs">0</div>
            </div>
            <div class="stat-card">
                <div class="label">黑名单规则</div>
                <div class="value" id="blacklist-count">0</div>
            </div>
        </div>

        <div class="search-section">
            <div class="tabs">
                <button class="tab active" data-tab="search">搜索查询</button>
                <button class="tab" data-tab="batch">批量导入</button>
                <button class="tab" data-tab="trends">点击趋势</button>
                <button class="tab" data-tab="blacklist">黑名单规则</button>
            </div>

            <div class="tab-content active" id="search-tab">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="输入短链 slug、域名或负责人进行搜索...">
                    <button class="btn btn-primary" onclick="searchSlug()">搜索</button>
                </div>
                <div id="search-results"></div>
            </div>

            <div class="tab-content" id="batch-tab">
                <div class="import-hint">
                    💡 请按以下格式输入，每行一条记录：slug,目标URL,负责人<br>
                    示例：test-link,https://example.com/page,张三
                </div>
                <textarea id="batch-input" placeholder="每行一条数据，格式：slug,目标URL,负责人"></textarea>
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="batchImport()">批量导入并检测</button>
                    <button class="btn btn-small" onclick="fillTestData()">填充测试数据</button>
                </div>
                <div class="import-results" id="import-results"></div>
            </div>

            <div class="tab-content" id="trends-tab">
                <div class="chart-section">
                    <div class="chart-header">
                        <h3>📊 点击趋势分析</h3>
                        <div class="chart-actions">
                            <select id="trend-days" class="btn" onchange="loadTrends()">
                                <option value="7">近7天</option>
                                <option value="14">近14天</option>
                                <option value="30">近30天</option>
                            </select>
                            <button class="btn btn-success" onclick="exportData()">导出CSV</button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="trend-chart"></canvas>
                    </div>
                    <div class="source-breakdown" id="source-breakdown"></div>
                </div>
            </div>

            <div class="tab-content" id="blacklist-tab">
                <div class="blacklist-section">
                    <h3>🚫 黑名单规则库</h3>
                    <div id="blacklist-rules"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
