<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线协作冲突回放器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>离线协作冲突回放器</h1>
      <div class="header-actions">
        <label class="file-upload-btn">
          <input type="file" id="fileInput" accept=".json" multiple>
          导入日志文件
        </label>
        <button id="loadSampleBtn">加载示例数据</button>
      </div>
    </header>

    <main class="main-content">
      <aside class="sidebar">
        <div class="sidebar-section">
          <h3>统计概览</h3>
          <div id="statsPanel" class="stats-panel">
            <p class="empty-state">加载日志后显示统计</p>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>用户视角</h3>
          <div id="userSelector" class="user-selector">
            <p class="empty-state">暂无用户数据</p>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>冲突列表</h3>
          <div id="conflictsPanel" class="conflicts-panel">
            <p class="empty-state">暂无冲突</p>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>隔离清单</h3>
          <div id="isolationPanel" class="isolation-panel">
            <p class="empty-state">无隔离项</p>
          </div>
        </div>
      </aside>

      <section class="content-area">
        <div class="document-container">
          <div class="document-header">
            <span class="document-label">文档内容</span>
            <span id="docLength" class="doc-length">长度: 0</span>
          </div>
          <div id="documentDisplay" class="document-display">
            <div class="empty-state">加载日志后显示文档内容</div>
          </div>
        </div>

        <div class="timeline-container">
          <div class="timeline-header">
            <span>时间轴</span>
            <span id="progressText">进度: 0/0</span>
          </div>
          <div id="timeline" class="timeline">
            <div class="timeline-track"></div>
          </div>
          <div class="timeline-controls">
            <div class="playback-controls">
              <button id="goBeginBtn" title="到开始">⏮</button>
              <button id="stepBackBtn" title="后退一步">◀</button>
              <button id="playBtn" title="播放/暂停">▶</button>
              <button id="stepForwardBtn" title="前进一步">▶</button>
              <button id="goEndBtn" title="到结束">⏭</button>
            </div>
            <div class="speed-control">
              <label>速度:</label>
              <select id="speedSelect">
                <option value="0.5">0.5x</option>
                <option value="1" selected>1x</option>
                <option value="2">2x</option>
                <option value="5">5x</option>
              </select>
            </div>
          </div>
        </div>

        <div class="operation-panel">
          <div class="panel-header">
            <span>当前操作详情</span>
          </div>
          <div id="operationDetails" class="operation-details">
            <p class="empty-state">播放时显示操作详情</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="export-controls">
        <button id="exportMarkdownBtn">导出 Markdown 复盘</button>
        <button id="exportJSONBtn">导出 JSON 结果</button>
      </div>
      <div class="status-bar">
        <span id="statusText">就绪</span>
      </div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
