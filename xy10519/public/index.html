<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程优惠叠加 API - 演示平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .panel-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }
        
        .form-select, .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        
        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .btn-group {
            margin-top: 20px;
        }
        
        .result-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .price-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .price-label {
            color: #666;
            font-size: 14px;
        }
        
        .price-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        
        .price-value.discount {
            color: #f5576c;
        }
        
        .price-value.final {
            color: #11998e;
            font-size: 28px;
        }
        
        .steps-container {
            margin-top: 20px;
        }
        
        .step-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
        }
        
        .step-number {
            width: 32px;
            height: 32px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .step-content {
            flex: 1;
        }
        
        .step-title {
            font-weight: 600;
            color: #333;
        }
        
        .step-desc {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }
        
        .step-price {
            font-weight: 600;
            color: #11998e;
        }
        
        .step-discount {
            color: #f5576c;
            font-size: 12px;
        }
        
        .customer-explanation {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #7c5414;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .orders-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .order-item {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .order-item:hover {
            background: #e9ecef;
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .order-no {
            font-weight: 600;
            color: #333;
        }
        
        .order-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-created { background: #e3f2fd; color: #1565c0; }
        .status-paid { background: #e8f5e9; color: #2e7d32; }
        .status-refunded { background: #ffebee; color: #c62828; }
        .status-partially_refunded { background: #fff3e0; color: #ef6c00; }
        .status-price_locked { background: #f3e5f5; color: #7b1fa2; }
        
        .order-info {
            font-size: 13px;
            color: #666;
        }
        
        .order-price {
            margin-top: 8px;
            font-weight: 600;
            color: #11998e;
        }
        
        .detail-section {
            margin-bottom: 20px;
        }
        
        .detail-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }
        
        .detail-label {
            color: #666;
        }
        
        .detail-value {
            font-weight: 500;
            color: #333;
        }
        
        .history-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
        }
        
        .history-status {
            font-weight: 600;
            color: #333;
        }
        
        .history-time {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        .history-reason {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        
        .operation-item {
            padding: 12px;
            background: #fff8e1;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .operation-type {
            font-weight: 600;
            color: #f57f17;
        }
        
        .warnings {
            background: #fff3e0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid #ff9800;
        }
        
        .warning-item {
            color: #ef6c00;
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            color: white;
            text-align: center;
        }
        
        .stat-card.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .stat-card.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 4px;
        }
        
        .demo-scenarios {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        
        .demo-card {
            padding: 16px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .demo-card:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .demo-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        
        .demo-desc {
            font-size: 12px;
            color: #666;
        }
        
        .json-viewer {
            background: #282c34;
            color: #abb2bf;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .section-divider {
            margin: 20px 0;
            border-top: 1px solid #eee;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .modal-actions {
            margin-top: 20px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 课程优惠叠加 API</h1>
            <p>优惠券 · 团购价 · 老学员折扣 · 退款 · 幂等控制</p>
        </div>
        
        <div class="main-content">
            <div class="panel">
                <h2 class="panel-title">📝 订单操作</h2>
                
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('create')">创建订单</button>
                    <button class="tab" onclick="switchTab('quick')">快捷演示</button>
                </div>
                
                <div id="tab-create" class="tab-content active">
                    <div class="form-group">
                        <label class="form-label">选择用户</label>
                        <select class="form-select" id="userSelect"></select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">选择课程</label>
                        <select class="form-select" id="courseSelect"></select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">优惠券（可选）</label>
                        <select class="form-select" id="couponSelect">
                            <option value="">不使用优惠券</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">团购活动（可选）</label>
                        <select class="form-select" id="groupBuySelect">
                            <option value="">不参加团购</option>
                        </select>
                    </div>
                    
                    <div class="btn-group">
                        <button class="btn btn-info" onclick="calculatePrice()">💰 试算价格</button>
                        <button class="btn btn-primary" onclick="createOrder()">📦 创建订单</button>
                        <button class="btn btn-success" onclick="createAndPay()">✅ 创建并支付</button>
                    </div>
                    
                    <div id="priceResult" class="result-box" style="display:none;"></div>
                </div>
                
                <div id="tab-quick" class="tab-content">
                    <p style="color: #666; margin-bottom: 16px;">选择一个预设场景快速体验业务流程：</p>
                    
                    <div class="demo-scenarios">
                        <div class="demo-card" onclick="runDemo('normal')">
                            <div class="demo-title">🎯 普通购买</div>
                            <div class="demo-desc">新学员购买课程，使用优惠券</div>
                        </div>
                        <div class="demo-card" onclick="runDemo('groupbuy')">
                            <div class="demo-title">👥 团购购买</div>
                            <div class="demo-desc">老学员参与团购，叠加折扣</div>
                        </div>
                        <div class="demo-card" onclick="runDemo('conflict')">
                            <div class="demo-title">⚠️ 优惠冲突</div>
                            <div class="demo-desc">团购与优惠券互斥，自动择优</div>
                        </div>
                        <div class="demo-card" onclick="runDemo('duplicate')">
                            <div class="demo-title">🔄 重复回调</div>
                            <div class="demo-desc">幂等性测试：多次支付回调</div>
                        </div>
                        <div class="demo-card" onclick="runDemo('partial')">
                            <div class="demo-title">💰 部分退款</div>
                            <div class="demo-desc">订单支付后申请部分退款</div>
                        </div>
                        <div class="demo-card" onclick="runDemo('error')">
                            <div class="demo-title">❌ 失败场景</div>
                            <div class="demo-desc">演示订单异常处理</div>
                        </div>
                    </div>
                </div>
                
                <div id="demoResult" class="result-box" style="display:none; margin-top: 20px;"></div>
            </div>
            
            <div class="panel">
                <h2 class="panel-title">📊 订单管理</h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="statTotal">0</div>
                        <div class="stat-label">总订单数</div>
                    </div>
                    <div class="stat-card success">
                        <div class="stat-value" id="statPaid">0</div>
                        <div class="stat-label">已支付</div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-value" id="statRefunded">0</div>
                        <div class="stat-label">已退款</div>
                    </div>
                </div>
                
                <div class="btn-group" style="margin-bottom: 16px;">
                    <button class="btn btn-info" onclick="refreshOrders()">🔄 刷新列表</button>
                </div>
                
                <div id="ordersList" class="orders-list">
                    <div class="empty-state">暂无订单，点击上方创建订单</div>
                </div>
            </div>
        </div>
        
        <div class="panel" id="orderDetailPanel" style="display:none;">
            <h2 class="panel-title">📋 订单详情</h2>
            <div id="orderDetailContent"></div>
        </div>
    </div>
    
    <div class="modal" id="actionModal">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">操作订单</h3>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" id="modalConfirm">确认</button>
            </div>
        </div>
    </div>

    <script>
        let cacheData = {
            users: [],
            courses: [],
            coupons: [],
            groupBuys: [],
            orders: []
        };
        
        let currentOrderId = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            loadAllData();
        });
        
        async function loadAllData() {
            try {
                const [users, courses, coupons, groupBuys, stats] = await Promise.all([
                    fetch('/api/data/users').then(r => r.json()),
                    fetch('/api/data/courses').then(r => r.json()),
                    fetch('/api/data/coupons').then(r => r.json()),
                    fetch('/api/data/group-buys').then(r => r.json()),
                    fetch('/api/data/statistics').then(r => r.json())
                ]);
                
                cacheData.users = users.data || [];
                cacheData.courses = courses.data || [];
                cacheData.coupons = coupons.data || [];
                cacheData.groupBuys = groupBuys.data || [];
                
                populateSelects();
                updateStats(stats.data);
                refreshOrders();
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }
        
        function populateSelects() {
            const userSelect = document.getElementById('userSelect');
            userSelect.innerHTML = cacheData.users.map(u => 
                `<option value="${u.id}">${u.name}${u.is_old_student ? ` (${u.old_student_discount_rate}%折扣)` : ''}</option>`
            ).join('');
            
            const courseSelect = document.getElementById('courseSelect');
            courseSelect.innerHTML = cacheData.courses.map(c => 
                `<option value="${c.id}">${c.name} - ¥${c.original_price}</option>`
            ).join('');
            
            const couponSelect = document.getElementById('couponSelect');
            couponSelect.innerHTML = '<option value="">不使用优惠券</option>' + 
                cacheData.coupons.map(c => {
                    const typeText = c.type === 'fixed' ? `减${c.value}元` : `${c.value}%折扣`;
                    return `<option value="${c.id}">${c.name} (${c.code}) - ${typeText}</option>`;
                }).join('');
            
            updateGroupBuySelect();
        }
        
        function updateGroupBuySelect() {
            const selectedCourseId = document.getElementById('courseSelect').value;
            const relevantGroupBuys = cacheData.groupBuys.filter(g => g.course_id === selectedCourseId);
            
            const groupBuySelect = document.getElementById('groupBuySelect');
            groupBuySelect.innerHTML = '<option value="">不参加团购</option>' + 
                relevantGroupBuys.map(g => 
                    `<option value="${g.id}">${g.name} - ¥${g.group_price} (省${cacheData.courses.find(c => c.id === g.course_id)?.original_price - g.group_price}元)</option>`
                ).join('');
        }
        
        document.getElementById('courseSelect').addEventListener('change', updateGroupBuySelect);
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }
        
        async function calculatePrice() {
            const userId = document.getElementById('userSelect').value;
            const courseId = document.getElementById('courseSelect').value;
            const couponId = document.getElementById('couponSelect').value || null;
            const groupBuyId = document.getElementById('groupBuySelect').value || null;
            
            try {
                const response = await fetch('/api/orders/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, courseId, couponId, groupBuyId })
                });
                
                const result = await response.json();
                displayPriceResult(result.data);
            } catch (error) {
                console.error('计算价格失败:', error);
            }
        }
        
        function displayPriceResult(data) {
            const container = document.getElementById('priceResult');
            container.style.display = 'block';
            
            let warningsHtml = '';
            if (data.warnings && data.warnings.length > 0) {
                warningsHtml = '<div class="warnings">' + 
                    data.warnings.map(w => `<div class="warning-item">⚠️ ${w.message}</div>`).join('') +
                    '</div>';
            }
            
            let stepsHtml = '';
            if (data.calculationSteps) {
                stepsHtml = '<div class="steps-container">' +
                    data.calculationSteps.map(step => `
                        <div class="step-item">
                            <div class="step-number">${step.step}</div>
                            <div class="step-content">
                                <div class="step-title">${step.title}</div>
                                <div class="step-desc">${step.description}</div>
                                ${step.discount ? `<div class="step-discount">-¥${step.discount}</div>` : ''}
                            </div>
                            <div class="step-price">¥${step.price}</div>
                        </div>
                    `).join('') +
                    '</div>';
            }
            
            container.innerHTML = `
                ${warningsHtml}
                <div class="price-display">
                    <span class="price-label">课程原价</span>
                    <span class="price-value">¥${data.originalPrice}</span>
                </div>
                <div class="price-display">
                    <span class="price-label">优惠金额</span>
                    <span class="price-value discount">-¥${data.totalDiscount}</span>
                </div>
                <div class="price-display">
                    <span class="price-label">最终应付</span>
                    <span class="price-value final">¥${data.finalPrice}</span>
                </div>
                ${stepsHtml}
                <div class="customer-explanation">
                    <strong>📢 客服解释口径：</strong>${data.customerExplanation}
                </div>
            `;
        }
        
        async function createOrder() {
            const userId = document.getElementById('userSelect').value;
            const courseId = document.getElementById('courseSelect').value;
            const couponId = document.getElementById('couponSelect').value || null;
            const groupBuyId = document.getElementById('groupBuySelect').value || null;
            
            try {
                const response = await fetch('/api/orders/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, courseId, couponId, groupBuyId })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('订单创建成功！订单号：' + result.data.order.order_no);
                    displayPriceResult(result.data.priceResult);
                    refreshOrders();
                } else {
                    alert('创建失败：' + result.error);
                }
            } catch (error) {
                console.error('创建订单失败:', error);
            }
        }
        
        async function createAndPay() {
            const userId = document.getElementById('userSelect').value;
            const courseId = document.getElementById('courseSelect').value;
            const couponId = document.getElementById('couponSelect').value || null;
            const groupBuyId = document.getElementById('groupBuySelect').value || null;
            
            try {
                const createResponse = await fetch('/api/orders/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, courseId, couponId, groupBuyId })
                });
                
                const createResult = await createResponse.json();
                if (!createResult.success) {
                    alert('创建订单失败：' + createResult.error);
                    return;
                }
                
                const orderId = createResult.data.order.id;
                const payResponse = await fetch(`/api/orders/${orderId}/payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentMethod: 'online' })
                });
                
                const payResult = await payResponse.json();
                if (payResult.success) {
                    alert('订单创建并支付成功！');
                    refreshOrders();
                } else {
                    alert('支付失败：' + payResult.error);
                }
            } catch (error) {
                console.error('操作失败:', error);
            }
        }
        
        async function refreshOrders() {
            try {
                const [orders, stats] = await Promise.all([
                    fetch('/api/orders').then(r => r.json()),
                    fetch('/api/data/statistics').then(r => r.json())
                ]);
                
                cacheData.orders = orders.data || [];
                updateStats(stats.data);
                renderOrdersList();
            } catch (error) {
                console.error('刷新订单失败:', error);
            }
        }
        
        function updateStats(stats) {
            document.getElementById('statTotal').textContent = stats.totalOrders;
            document.getElementById('statPaid').textContent = stats.paidOrders;
            document.getElementById('statRefunded').textContent = stats.refundedOrders;
        }

        async function payOrder(orderId) {
            if (!confirm('确认支付该订单？')) return;
            
            try {
                const response = await fetch(`/api/orders/${orderId}/payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentMethod: 'online' })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert(result.data.isIdempotent ? '订单已支付（幂等返回）' : '支付成功！');
                    viewOrderDetail(orderId);
                    refreshOrders();
                } else {
                    alert('支付失败：' + result.error);
                }
            } catch (error) {
                console.error('支付失败:', error);
            }
        }
        
        async function lockPrice(orderId) {
            try {
                const response = await fetch(`/api/orders/${orderId}/lock-price`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lockDurationMinutes: 30 })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('价格已锁定30分钟！');
                    viewOrderDetail(orderId);
                    refreshOrders();
                } else {
                    alert('锁定失败：' + result.error);
                }
            } catch (error) {
                console.error('锁价失败:', error);
            }
        }

                const refundAmount = refundType === 'partial' ? parseFloat(document.getElementById('refundAmount').value) : null;
                const refundReason = document.getElementById('refundReason').value;
                const returnCoupon = document.getElementById('returnCoupon').checked;
                
                try {
                    const response = await fetch(`/api/orders/${orderId}/refund`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },

            document.getElementById('refundType').addEventListener('change', function() {

            showModal('人工调整订单价格', `
                <div class="form-group">
                    <label class="form-label">新的价格</label>
                    <input type="number" class="form-input" id="newPrice" placeholder="请输入新的价格">

                const newPrice = parseFloat(document.getElementById('newPrice').value);
                const adjustReason = document.getElementById('adjustReason').value;
                const operatorName = document.getElementById('operatorName').value;
                
                if (!adjustReason) {
                    alert('请输入调整原因');

                    const response = await fetch(`/api/orders/${orderId}/adjust`, {

                            newFinalPrice: newPrice,

                            operatorId: 'demo-operator',

                    const result = await response.json();
                    if (result.success) {
                        alert(`调整成功！\n价格变化：¥${result.data.adjustment.oldPrice} → ¥${result.data.adjustment.newPrice}`);

                        viewOrderDetail(orderId);

                }

                <p><strong>用户：</strong>${user.name}</p>
                <p><strong>课程：</strong>${course.name}（¥${course.original_price}）</p>
                <p><strong>同时使用：</strong>团购活动 + 优惠券</p>
                <div class="section-divider"></div>
                <div class="warnings">${warningsHtml}</div>
                <div class="section-divider"></div>
                <p><strong>比较结果：</strong></p>
                <p>• 团购价：¥${groupBuy.group_price}</p>
                <p>• 用券后：¥${course.original_price - coupon.value}</p>
                <p><strong>系统自动选择：</strong>${groupBuy.group_price <= (course.original_price - coupon.value) ? '团购' : '优惠券'}</p>
                <div class="section-divider"></div>
                <div class="price-display">
                    <span class="price-label">最终价格</span>
                    <span class="price-value final">¥${result.data.finalPrice}</span>

        async function demoDuplicateCallback() {
            const user = cacheData.users[0];
            const course = cacheData.courses[1];
            const callbackId = 'demo-callback-' + Date.now();
            
            const createResult = await fetch('/api/orders/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: user.id, courseId: course.id })
            }).then(r => r.json());
            
            const orderId = createResult.data.order.id;
            
            const firstPay = await fetch(`/api/orders/${orderId}/payment/callback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ callbackId, amount: course.original_price })
            }).then(r => r.json());
            
            const secondPay = await fetch(`/api/orders/${orderId}/payment/callback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ callbackId, amount: course.original_price })
            }).then(r => r.json());
            
            document.getElementById('demoResult').innerHTML = `
                <h3 style="color:#667eea;margin-bottom:16px;">🔄 场景4：重复回调（幂等性测试）</h3>
                <p><strong>订单：</strong>${createResult.data.order.order_no}</p>
                <p><strong>回调ID：</strong>${callbackId}</p>
                <div class="section-divider"></div>
                <p><strong>第一次支付回调：</strong></p>
                <p>• 幂等标记：<span style="color:${firstPay.data.isIdempotent ? 'orange' : 'green'};">${firstPay.data.isIdempotent ? '是' : '否'}</span></p>
                <p>• 消息：${firstPay.data.message || '支付成功'}</p>
                <div class="section-divider"></div>
                <p><strong>第二次相同回调：</strong></p>
                <p>• 幂等标记：<span style="color:${secondPay.data.isIdempotent ? 'green' : 'orange'};">${secondPay.data.isIdempotent ? '是' : '否'}</span></p>
                <p>• 消息：${secondPay.data.message || '支付成功'}</p>
                <div class="section-divider"></div>
                <div class="customer-explanation">
                    <strong>幂等性验证：</strong>相同回调ID多次调用，只处理一次，返回相同结果。
                    避免重复扣款或重复入账。
                </div>
            `;
        }
        
        async function demoPartialRefund() {
            const user = cacheData.users[2];
            const course = cacheData.courses[1];
            const coupon = cacheData.coupons[1];
            
            const createResult = await fetch('/api/orders/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    userId: user.id, 
                    courseId: course.id,
                    couponId: coupon.id
                })
            }).then(r => r.json());
            
            const orderId = createResult.data.order.id;
            const finalPrice = createResult.data.priceResult.finalPrice;
            
            await fetch(`/api/orders/${orderId}/payment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: finalPrice })
            }).then(r => r.json());
            
            const partialAmount = (finalPrice * 0.5).toFixed(2);
            
            const refundResult = await fetch(`/api/orders/${orderId}/refund`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    refundType: 'partial',
                    refundAmount: parseFloat(partialAmount),
                    refundReason: '用户申请部分退款',
                    operatorId: 'demo',
                    operatorName: '演示客服'
                })
            }).then(r => r.json());
            
            let refundBreakdownHtml = '';
            if (refundResult.data && refundResult.data.refundBreakdown) {
                refundBreakdownHtml = refundResult.data.refundBreakdown.map(b => `
                    <div class="detail-row">
                        <span class="detail-label">${b.description}</span>
                        <span class="detail-value">${b.isTotal ? '<strong>' : ''}¥${b.amount}${b.isTotal ? '</strong>' : ''}</span>
                    </div>
                `).join('');
            }
            
            document.getElementById('demoResult').innerHTML = `
                <h3 style="color:#667eea;margin-bottom:16px;">💰 场景5：部分退款</h3>
                <p><strong>用户：</strong>${user.name}（老学员${user.old_student_discount_rate}%折扣）</p>
                <p><strong>课程：</strong>${course.name}（¥${course.original_price}）</p>
                <p><strong>实付：</strong>¥${finalPrice}</p>
                <p><strong>部分退款：</strong>¥${partialAmount}（50%）</p>
                <div class="section-divider"></div>
                <p><strong>退款明细：</strong></p>
                ${refundBreakdownHtml}
                <div class="section-divider"></div>
                <div class="customer-explanation">
                    ${refundResult.data ? refundResult.data.customerExplanation : ''}
                </div>
            `;
        }
        
        async function demoErrorScenario() {
            const user = cacheData.users[0];
            const course = cacheData.courses[0];
            const coupon = cacheData.coupons[0];
            
            const createResult = await fetch('/api/orders/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: user.id, courseId: course.id })
            }).then(r => r.json());
            
            const orderId = createResult.data.order.id;
            
            const lowPayResult = await fetch(`/api/orders/${orderId}/payment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: 10 })
            }).then(r => r.json());
            
            await fetch(`/api/orders/${orderId}/payment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: course.original_price })
            }).then(r => r.json());
            
            const afterPaidAdjust = await fetch(`/api/orders/${orderId}/adjust`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    newFinalPrice: 500, 
                    changeReason: '测试已支付订单调整',
                    operatorId: 'demo',
                    operatorName: '测试'
                })
            }).then(r => r.json());
            
            document.getElementById('demoResult').innerHTML = `
                <h3 style="color:#667eea;margin-bottom:16px;">❌ 场景6：异常处理</h3>
                <p><strong>订单：</strong>${createResult.data.order.order_no}</p>
                <div class="section-divider"></div>
                <p><strong>测试1：支付金额不足</strong></p>
                <p>• 尝试支付：¥10</p>
                <p>• 实际应付：¥${course.original_price}</p>
                <p>• 结果：<span style="color:#f5576c;">${lowPayResult.error}</span></p>
                <div class="section-divider"></div>
                <p><strong>测试2：已支付订单尝试人工调整</strong></p>
                <p>• 当前状态：已支付</p>
                <p>• 结果：<span style="color:#f5576c;">${afterPaidAdjust.error}</span></p>
                <div class="section-divider"></div>
                <div class="customer-explanation">
                    <strong>规则验证：</strong>系统严格校验订单状态和金额，防止错误操作。
                    已支付订单不允许直接修改价格，需走退款流程。
                </div>
            `;
        }
    </script>
