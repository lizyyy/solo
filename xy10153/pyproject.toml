[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voucher-fixer"
version = "0.1.0"
description = "账套凭证断号修复 CLI"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
voucher-fixer = "voucher_fixer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
