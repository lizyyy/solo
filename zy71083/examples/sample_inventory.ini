[production:children]
web_servers
db_servers
cache_servers

[production:vars]
env=production
region=cn-beijing
vendor=aliyun

[web_servers:vars]
role=web
server_role=nginx

[web_servers]
web01-prod ansible_host=10.0.1.10
web02-prod ansible_host=10.0.1.11
web03-prod ansible_host=10.0.1.12

[db_servers:vars]
role=database

[db_servers]
db01-prod ansible_host=10.0.2.10
db02-prod ansible_host=10.0.2.11

[cache_servers:vars]
role=cache

[cache_servers]
redis01-prod ansible_host=10.0.3.10

[staging]
app01-stg ansible_host=10.1.1.10 environment=staging role=app

[deprecated_hosts]
old-web01-deprecated ansible_host=172.16.0.99
