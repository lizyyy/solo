[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-trace"
version = "0.1.0"
description = "部署制品追溯 CLI 工具"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
]

[project.scripts]
deploy-trace = "deploy_trace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
