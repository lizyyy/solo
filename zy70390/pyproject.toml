[tool.poetry]
name = "shadow-account-cleaner"
version = "0.1.0"
description = "Shadow Account Cleaner CLI - 识别和清理影子账号"
authors = ["Security Team"]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.0"
pyyaml = "^6.0"
pydantic = "^2.0"
python-dateutil = "^2.8.0"
rich = "^13.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
