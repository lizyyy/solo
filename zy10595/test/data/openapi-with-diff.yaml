openapi: 3.0.0
info:
  title: 有差异的测试 API
  version: 1.0.0

components:
  schemas:
    OrderStatus:
      type: string
      enum:
        - PENDING
        - PAID
        - SHIPPED
        - DELIVERED
        - CANCELLED
        - REFUNDED
    
    PaymentMethod:
      type: string
      enum:
        - CREDIT_CARD
        - DEBIT_CARD
        - PAYPAL
    
    User:
      type: object
      properties:
        role:
          type: string
          enum:
            - ADMIN
            - USER
            - GUEST
            - MODERATOR
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
