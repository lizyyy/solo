<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}桥梁支座阈值预警系统{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6fa; color: #1f2937; }
  header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; padding: 18px 32px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
  header nav { margin-top: 10px; }
  header nav a { color: #dbeafe; text-decoration: none; margin-right: 18px; font-size: 14px; padding: 6px 10px; border-radius: 6px; }
  header nav a:hover { background: rgba(255,255,255,.15); color: #fff; }
  header nav a.active { background: rgba(255,255,255,.22); color: #fff; font-weight: 600; }
  main { max-width: 1400px; margin: 24px auto; padding: 0 24px; }
  .card { background: #fff; border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 20px; }
  .card h2 { margin-top: 0; font-size: 17px; color: #0f172a; border-left: 4px solid #2563eb; padding-left: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #e5e7eb; }
  th { background: #f8fafc; font-weight: 600; color: #334155; }
  tr:hover td { background: #f8fafc; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .b-severe { background: #fef2f2; color: #b91c1c; }
  .b-warn { background: #fffbeb; color: #b45309; }
  .b-normal { background: #f3f4f6; color: #374151; }
  .b-high { background: #fee2e2; color: #991b1b; }
  .b-mid { background: #fef3c7; color: #92400e; }
  .b-low { background: #dbeafe; color: #1e40af; }
  .b-pending { background: #f3f4f6; color: #4b5563; }
  .b-done { background: #d1fae5; color: #065f46; }
  .b-inc { background: #fde68a; color: #92400e; }
  .b-ok { background: #dcfce7; color: #166534; }
  .b-err { background: #fee2e2; color: #991b1b; }
  button, .btn { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: #1d4ed8; }
  .btn-ghost { background: #fff; color: #2563eb; border: 1px solid #2563eb; }
  .btn-ghost:hover { background: #eff6ff; }
  .btn-danger { background: #dc2626; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-success { background: #16a34a; }
  .btn-success:hover { background: #15803d; }
  .btn-warn { background: #f59e0b; }
  .btn-warn:hover { background: #d97706; }
  input, select, textarea { padding: 6px 9px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .col-6 { flex: 1 1 48%; min-width: 400px; }
  .col-4 { flex: 1 1 31%; min-width: 280px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; color: #475569; margin-bottom: 4px; font-weight: 500; }
  .hint { font-size: 12px; color: #6b7280; }
  .tag { display: inline-block; padding: 1px 8px; background: #e0e7ff; color: #3730a3; border-radius: 4px; font-size: 11px; margin-right: 4px; }
  .step-log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 14px 18px; max-height: 450px; overflow-y: auto; }
  .step-log .st { color: #38bdf8; }
  .step-log .tm { color: #94a3b8; }
  .step-log .dt { color: #fbbf24; }
  .muted { color: #64748b; font-size: 12px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; }
  .stat-box .label { font-size: 12px; color: #64748b; }
  .stat-box .value { font-size: 24px; font-weight: 700; color: #0f172a; margin-top: 4px; }
  .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
  .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .alert-warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .alert-err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .alert-ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  a { color: #2563eb; }
  details { margin: 6px 0; }
  details summary { cursor: pointer; padding: 6px 0; font-weight: 500; }
  details pre { background: #f8fafc; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  .inline-form { display: inline; }
  .small-btn { padding: 4px 9px; font-size: 12px; }
  .sep { height: 1px; background: #e5e7eb; margin: 16px 0; }
</style>
</head>
<body>
<header>
  <h1>🌉 桥梁支座阈值预警系统</h1>
  <nav>
    <a href="{{ url_for('index') }}" class="{% if request.path == '/' %}active{% endif %}">首页</a>
    <a href="{{ url_for('import_view') }}" class="{% if '/import' in request.path %}active{% endif %}">备件导入</a>
    <a href="{{ url_for('run_warning') }}" class="{% if '/run' in request.path %}active{% endif %}">阈值预警</a>
  </nav>
</header>
<main>
{% with messages = get_flashed_messages() %}{% if messages %}
{% for m in messages %}<div class="alert alert-info">{{ m }}</div>{% endfor %}
{% endif %}{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
