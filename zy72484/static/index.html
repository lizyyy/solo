<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沿街店铺油烟整治 - 小看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: 0.9; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-card .label {
            color: #666;
            font-size: 13px;
            margin-top: 5px;
        }
        .stat-card.warning .number { color: #f59e0b; }
        .stat-card.danger .number { color: #ef4444; }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .panel h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
            display: inline-block;
        }
        
        #scene3d {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            overflow: hidden;
            background: #f0f0f0;
            cursor: pointer;
        }
        
        .issues-list {
            max-height: 350px;
            overflow-y: auto;
        }
        .issue-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid #667eea;
            background: #f8f9ff;
        }
        .issue-item:hover {
            transform: translateX(3px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .issue-item.has-alias {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }
        .issue-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .issue-meta {
            font-size: 12px;
            color: #666;
        }
        .issue-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-right: 5px;
        }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-alias { background: #fee2e2; color: #991b1b; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #333; }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        
        .detail-section {
            margin-bottom: 15px;
            padding: 12px;
            background: #f8f9ff;
            border-radius: 8px;
        }
        .detail-section h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .detail-row {
            display: flex;
            padding: 4px 0;
            font-size: 14px;
        }
        .detail-row .key {
            width: 100px;
            color: #666;
            flex-shrink: 0;
        }
        .detail-row .value { color: #333; }
        
        .back-reference {
            margin-top: 10px;
            padding: 10px;
            background: #ecfdf5;
            border-radius: 6px;
            border-left: 3px solid #10b981;
        }
        .back-reference h5 {
            color: #065f46;
            margin-bottom: 6px;
            font-size: 13px;
        }
        
        .action-bar {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a67d8; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        
        .alias-panel {
            margin-bottom: 20px;
            background: #fffbeb;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
        }
        .alias-panel h4 { color: #92400e; margin-bottom: 10px; }
        .alias-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: white;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .alias-actions { display: flex; gap: 8px; }
        .alias-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .chart-container { position: relative; height: 280px; }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab {
            padding: 8px 16px;
            background: #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏘️ 沿街店铺油烟整治 - 小看板</h1>
            <p>点图表里的柱子就能回溯到原始记录，别只剩漂亮画面</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="stat-total">0</div>
                <div class="label">沿街店铺总数</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-issues">0</div>
                <div class="label">有问题需跟进</div>
            </div>
            <div class="stat-card warning">
                <div class="number" id="stat-pending">0</div>
                <div class="label">待复核</div>
            </div>
            <div class="stat-card danger">
                <div class="number" id="stat-alias">0</div>
                <div class="label">小区同名待确认</div>
            </div>
            <div class="stat-card warning">
                <div class="number" id="stat-missing-ramp">0</div>
                <div class="label">缺坡道记录</div>
            </div>
            <div class="stat-card warning">
                <div class="number" id="stat-missing-sample">0</div>
                <div class="label">缺夜间采样</div>
            </div>
        </div>

        <div class="alias-panel" id="alias-panel" style="display:none;">
            <h4>⚠️ 小区同名待复核（留给市政巡检员，别急着归正常）</h4>
            <div id="alias-list"></div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="tabs">
                    <div class="tab active" data-tab="chart">📊 图表展示</div>
                    <div class="tab" data-tab="3d">🏗️ 3D 展示</div>
                </div>
                <div id="tab-chart" class="tab-content">
                    <div class="chart-container">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>
                <div id="tab-3d" class="tab-content" style="display:none;">
                    <div id="scene3d"></div>
                    <p style="text-align:center;color:#666;font-size:12px;margin-top:8px;">
                        拖动可旋转，点击建筑可查看对应问题
                    </p>
                </div>
            </div>

            <div class="panel">
                <h3>📋 问题清单（点一下看详情）</h3>
                <div class="issues-list" id="issues-list"></div>
            </div>
        </div>

        <div class="panel">
            <h3>📝 街道会看摘要</h3>
            <div id="summary-content"></div>
        </div>
    </div>

    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">问题详情</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body"></div>
            <div class="action-bar">
                <button class="btn btn-primary" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        let chartData = null;
        let summaryData = null;
        let mainChart = null;
        let scene3d = null;

        async function loadData() {
            const [summaryRes, chartRes, aliasRes] = await Promise.all([
                fetch('/api/summary').then(r => r.json()),
                fetch('/api/chart-data').then(r => r.json()),
                fetch('/api/aliases').then(r => r.json())
            ]);
            summaryData = summaryRes;
            chartData = chartRes;
            renderStats();
            renderChart();
            renderIssues();
            renderAliases(aliasRes.aliases);
            renderSummary();
            init3D();
        }

        function renderStats() {
            document.getElementById('stat-total').textContent = summaryData.total_shops;
            document.getElementById('stat-issues').textContent = summaryData.shops_with_issues;
            document.getElementById('stat-pending').textContent = summaryData.pending_review;
            document.getElementById('stat-alias').textContent = summaryData.alias_issues;
            document.getElementById('stat-missing-ramp').textContent = summaryData.missing_ramp_records;
            document.getElementById('stat-missing-sample').textContent = summaryData.missing_sampling_points;
        }

        function renderChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (mainChart) mainChart.destroy();

            const communities = Object.keys(chartData.by_community);
            const datasets = [
                { label: '问题总数', data: communities.map(c => chartData.by_community[c].total), backgroundColor: 'rgba(102, 126, 234, 0.8)' },
                { label: '油烟超标', data: communities.map(c => chartData.by_community[c].超标), backgroundColor: 'rgba(239, 68, 68, 0.8)' },
                { label: '无障碍问题', data: communities.map(c => chartData.by_community[c].无障碍), backgroundColor: 'rgba(245, 158, 11, 0.8)' },
                { label: '同名小区问题', data: communities.map(c => chartData.by_community[c].同名问题), backgroundColor: 'rgba(139, 92, 246, 0.8)' }
            ];

            mainChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: communities, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            const idx = elements[0].index;
                            const commName = communities[idx];
                            const issues = summaryData.issues.filter(i => i.所属小区 === commName);
                            if (issues.length > 0) {
                                showIssueDetail(issues[0].id);
                            }
                        }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                afterBody: () => '点击柱子查看对应问题详情'
                            }
                        }
                    }
                }
            });
        }

        function renderIssues() {
            const container = document.getElementById('issues-list');
            container.innerHTML = '';
            summaryData.issues.forEach(issue => {
                const div = document.createElement('div');
                div.className = 'issue-item' + (issue.是否有同名小区问题 === '是' ? ' has-alias' : '');
                div.innerHTML = `
                    <div class="issue-title">${issue.店铺}</div>
                    <div class="issue-meta">
                        <span class="issue-badge badge-pending">${issue.当前状态}</span>
                        ${issue.是否有同名小区问题 === '是' ? '<span class="issue-badge badge-alias">同名待确认</span>' : ''}
                        ${issue.所属小区} | ${issue.问题说明.substring(0, 25)}...
                    </div>
                `;
                div.onclick = () => showIssueDetail(issue.id);
                container.appendChild(div);
            });
        }

        function renderAliases(aliases) {
            const panel = document.getElementById('alias-panel');
            const list = document.getElementById('alias-list');
            const unreviewed = aliases.filter(a => !a.reviewed);

            if (unreviewed.length === 0) {
                panel.style.display = 'none';
                return;
            }
            panel.style.display = 'block';
            list.innerHTML = '';

            unreviewed.forEach(a => {
                const div = document.createElement('div');
                div.className = 'alias-item';
                div.innerHTML = `
                    <span><strong>${a.old_name}</strong> ↔ <strong>${a.new_name}</strong></span>
                    <div class="alias-actions">
                        <button onclick="reviewAlias(${a.index}, true)" style="background:#10b981;color:white;">确认是同一小区</button>
                        <button onclick="reviewAlias(${a.index}, false)" style="background:#ef4444;color:white;">不是</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function reviewAlias(index, isValid) {
            const reviewer = '市政巡检员';
            const note = isValid ? '确认为同一小区' : '不是同一小区';
            await fetch('/api/review-alias', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ index, reviewer, is_valid: isValid, note })
            });
            loadData();
        }

        function renderSummary() {
            const container = document.getElementById('summary-content');
            let html = '';
            summaryData.issues.forEach((issue, idx) => {
                html += `
                    <div style="padding:12px;margin-bottom:10px;background:#f8f9ff;border-radius:8px;border-left:4px solid #667eea;">
                        <strong>${idx + 1}. ${issue.店铺}（${issue.所属小区}）</strong><br>
                        <span style="color:#666;font-size:14px;">
                            📌 为什么留下：${issue.问题说明}<br>
                            📋 还缺什么：${issue.待补材料.length ? issue.待补材料.join('、') : '不缺'}<br>
                            👉 下一步找：<strong style="color:#667eea;">${issue.下一步对接}</strong>
                            ${issue.是否有同名小区问题 === '是' ? '<br>⚠️ 注意：该小区有新旧名字待市政巡检员复核！' : ''}
                        </span>
                    </div>
                `;
            });
            container.innerHTML = html || '<p style="color:#666;">暂无问题</p>';
        }

        async function showIssueDetail(issueId) {
            const data = await fetch(`/api/issues/${issueId}`).then(r => r.json());
            const modal = document.getElementById('detail-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            title.textContent = `${data.shop_name} - 问题详情`;

            let html = `
                <div class="detail-section">
                    <h4>📝 基本信息</h4>
                    <div class="detail-row"><span class="key">当前状态</span><span class="value">${data.status}</span></div>
                    <div class="detail-row"><span class="key">所属小区</span><span class="value">${data.community_name}</span></div>
                    <div class="detail-row"><span class="key">问题说明</span><span class="value">${data.reason_kept}</span></div>
                    <div class="detail-row"><span class="key">待补材料</span><span class="value">${data.missing_materials.length ? data.missing_materials.join('、') : '无'}</span></div>
                    <div class="detail-row"><span class="key">下一步对接</span><span class="value"><strong>${data.next_role}</strong></span></div>
                    <div class="detail-row"><span class="key">同名问题</span><span class="value">${data.has_alias_issue ? '是（待市政巡检员复核）' : '否'}</span></div>
                </div>
            `;

            if (data.ramp_record) {
                html += `
                    <div class="detail-section back-reference">
                        <h5>🔗 关联的无障碍坡道记录（从这里回溯）</h5>
                        <div class="detail-row"><span class="key">记录ID</span><span class="value">${data.ramp_record.id}</span></div>
                        <div class="detail-row"><span class="key">小区名称</span><span class="value">${data.ramp_record.community_name}</span></div>
                        <div class="detail-row"><span class="key">有无坡道</span><span class="value">${data.ramp_record.has_ramp ? '有' : '无'}</span></div>
                        <div class="detail-row"><span class="key">坡道宽度</span><span class="value">${data.ramp_record.ramp_width ? data.ramp_record.ramp_width + 'm' : '未记录'}</span></div>
                        <div class="detail-row"><span class="key">检查人</span><span class="value">${data.ramp_record.inspector || '未记录'}</span></div>
                        <div class="detail-row"><span class="key">检查日期</span><span class="value">${data.ramp_record.inspection_date}</span></div>
                        ${data.ramp_record.notes ? `<div class="detail-row"><span class="key">备注</span><span class="value">${data.ramp_record.notes}</span></div>` : ''}
                    </div>
                `;
            }

            if (data.sampling_point) {
                html += `
                    <div class="detail-section back-reference">
                        <h5>🔗 关联的夜间采样点（从这里回溯）</h5>
                        <div class="detail-row"><span class="key">记录ID</span><span class="value">${data.sampling_point.id}</span></div>
                        <div class="detail-row"><span class="key">小区名称</span><span class="value">${data.sampling_point.community_name}</span></div>
                        <div class="detail-row"><span class="key">采样时间</span><span class="value">${data.sampling_point.sampling_date} ${data.sampling_point.sampling_time}</span></div>
                        <div class="detail-row"><span class="key">油烟浓度</span><span class="value">${data.sampling_point.fume_concentration} mg/m³</span></div>
                        <div class="detail-row"><span class="key">标准限值</span><span class="value">${data.sampling_point.standard_limit} mg/m³</span></div>
                        <div class="detail-row"><span class="key">是否达标</span><span class="value">${data.sampling_point.is_qualified ? '是' : '<strong style="color:#ef4444;">否（超标）</strong>'}</span></div>
                        <div class="detail-row"><span class="key">采样人</span><span class="value">${data.sampling_point.sampler || '未记录'}</span></div>
                        ${data.sampling_point.notes ? `<div class="detail-row"><span class="key">备注</span><span class="value">${data.sampling_point.notes}</span></div>` : ''}
                    </div>
                `;
            }

            body.innerHTML = html;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
                if (tab.dataset.tab === '3d') {
                    setTimeout(init3D, 100);
                }
            };
        });

        function init3D() {
            const container = document.getElementById('scene3d');
            if (scene3d) {
                container.innerHTML = '';
            }

            const width = container.clientWidth;
            const height = container.clientHeight;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            camera.position.set(15, 12, 15);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 30),
                new THREE.MeshLambertMaterial({ color: 0x8fbc8f })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            const buildings = [];
            const communities = Object.keys(chartData.by_community || {});
            communities.forEach((name, i) => {
                const data = chartData.by_community[name];
                const height = Math.max(1, data.total * 1.5);
                const issues = summaryData.issues.filter(x => x.所属小区 === name);

                const geometry = new THREE.BoxGeometry(3, height, 3);
                const color = data.同名问题 > 0 ? 0xf59e0b : (data.超标 > 0 ? 0xef4444 : 0x667eea);
                const material = new THREE.MeshLambertMaterial({ color });
                const building = new THREE.Mesh(geometry, material);
                building.position.x = (i - communities.length / 2) * 5;
                building.position.y = height / 2;
                building.userData = { name, issues };
                scene.add(building);
                buildings.push(building);

                const labelCanvas = document.createElement('canvas');
                labelCanvas.width = 200;
                labelCanvas.height = 50;
                const ctx = labelCanvas.getContext('2d');
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, 200, 50);
                ctx.fillStyle = '#333';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(name, 100, 30);
            });

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            renderer.domElement.addEventListener('click', (e) => {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / height) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(buildings);
                if (intersects.length > 0) {
                    const building = intersects[0].object;
                    if (building.userData.issues && building.userData.issues.length > 0) {
                        showIssueDetail(building.userData.issues[0].id);
                    }
                }
            });

            let angle = 0;
            function animate() {
                requestAnimationFrame(animate);
                angle += 0.003;
                camera.position.x = Math.cos(angle) * 18;
                camera.position.z = Math.sin(angle) * 18;
                camera.lookAt(0, 0, 0);
                renderer.render(scene, camera);
            }
            animate();
        }

        window.onclick = (e) => {
            const modal = document.getElementById('detail-modal');
            if (e.target === modal) closeModal();
        };

        loadData();
    </script>
</body>
</html>
