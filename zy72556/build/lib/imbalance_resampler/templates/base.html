<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}类别不平衡重采样系统{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            ayue: '#1e40af',
            leader: '#065f46',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .timeline-dot { @apply w-3 h-3 rounded-full bg-blue-500 ring-4 ring-blue-100; }
    .code-block { @apply bg-gray-900 text-green-300 text-xs mono p-4 rounded-lg overflow-x-auto; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <header class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white border-b border-slate-700 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{{ url_for('index') }}" class="flex items-center gap-3 group">
        <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center font-bold text-lg group-hover:scale-105 transition">RS</div>
        <div>
          <div class="font-semibold tracking-wide">类别不平衡重采样系统</div>
          <div class="text-[11px] text-slate-400">单一数据源 · 审计留痕 · 可解释</div>
        </div>
      </a>
      <div class="flex items-center gap-4 text-sm text-slate-300">
        <span class="px-2 py-1 bg-slate-700/60 rounded text-xs mono">v0.1.0</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-500 border-t border-slate-200 mt-8">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <span>导出明细 · 页面展示 · 接口返回 = 同一份会话数据 (sessions/*.json)</span>
      <span>边界规则写入代码 + README，不靠口头约定</span>
    </div>
  </footer>

</body>
</html>
