[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imbalance-resampler"
version = "0.1.0"
description = "类别不平衡重采样系统 - 带审计追踪和可解释性"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
]

[project.scripts]
resampler = "imbalance_resampler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
