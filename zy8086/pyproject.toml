[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nvr-audit"
version = "0.1.0"
description = "NVR 监控录像交付审计 CLI 工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
]
[project.scripts]
nvr-audit = "nvr_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
