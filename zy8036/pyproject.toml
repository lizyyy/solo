[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-validator"
version = "0.1.0"
description = "Markdown 示例验收器"
authors = [
  { name = "Developer", email = "dev@example.com" },
]
dependencies = [
  "python-dotenv>=1.0.0",
]
requires-python = ">=3.8"

[project.scripts]
md-validator = "md_validator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]