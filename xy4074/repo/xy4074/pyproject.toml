[project]
name = "classroom-question-cluster"
version = "0.1.0"
description = "企业内训课堂疑问聚类助手 - 自动聚类学员问题并关联课程章节"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "scikit-learn>=1.2",
    "jieba>=0.42",
    "pandas>=1.5",
    "numpy>=1.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
cqc = "classroom_cluster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["classroom_cluster"]
