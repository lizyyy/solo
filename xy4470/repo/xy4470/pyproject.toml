[project]
name = "roast-trace"
version = "0.1.0"
description = "咖啡烘焙工坊本地追溯与质检CLI工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "pandas>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
roast-trace = "roast_trace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roast_trace"]

[tool.ruff]
line-length = 100
target-version = "py39"
