[project]
name = "report-metric-cli"
version = "1.0.0"
description = "报表口径变更管理CLI - 管理数据报表指标口径变更、影响分析和回填跟踪"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "typer>=0.9",
    "python-dateutil>=2.8",
]

[project.scripts]
metric-cli = "metric_cli.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
