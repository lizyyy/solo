<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贴纸小样拼版工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部工具栏 -->
        <header class="toolbar">
            <div class="toolbar-left">
                <h1>🎨 贴纸小样拼版工具</h1>
            </div>
            <div class="toolbar-right">
                <button id="new-project" class="btn btn-secondary">新建</button>
                <button id="save-project" class="btn btn-secondary">保存草稿</button>
                <button id="load-project" class="btn btn-secondary">加载草稿</button>
                <button id="import-json" class="btn btn-secondary">导入工程</button>
                <button id="export-json" class="btn btn-secondary">导出工程</button>
                <button id="export-preview" class="btn btn-primary">导出预览</button>
                <button id="export-checklist" class="btn btn-primary">导出印前清单</button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 左侧面板：素材库 -->
            <aside class="left-panel">
                <div class="panel-header">
                    <h2>📦 素材库</h2>
                    <button id="import-materials" class="btn btn-small btn-primary">导入素材</button>
                    <input type="file" id="material-input" accept=".png,.svg" multiple style="display: none;">
                </div>
                <div class="panel-content">
                    <div class="materials-list" id="materials-list">
                        <!-- 素材列表 -->
                    </div>
                </div>
                
                <!-- 文字标签 -->
                <div class="panel-section">
                    <h3>📝 添加文字标签</h3>
                    <div class="form-group">
                        <input type="text" id="text-label-input" placeholder="输入文字内容" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>字体大小:</label>
                        <input type="number" id="text-size-input" value="24" min="8" max="200" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>字体颜色:</label>
                        <input type="color" id="text-color-input" value="#000000" class="form-control">
                    </div>
                    <button id="add-text-label" class="btn btn-small btn-primary">添加到画布</button>
                </div>
            </aside>

            <!-- 中间：画布区域 -->
            <section class="canvas-area">
                <div class="canvas-controls">
                    <div class="control-group">
                        <label>画布尺寸:</label>
                        <select id="canvas-size-select" class="form-control">
                            <option value="A4">A4 (210mm × 297mm)</option>
                            <option value="A5">A5 (148mm × 210mm)</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                    <div class="control-group" id="custom-size-group" style="display: none;">
                        <label>宽度 (mm):</label>
                        <input type="number" id="canvas-width" value="210" min="50" max="1000" class="form-control small">
                        <label>高度 (mm):</label>
                        <input type="number" id="canvas-height" value="297" min="50" max="1000" class="form-control small">
                    </div>
                    <div class="control-group">
                        <label>出血线 (mm):</label>
                        <input type="number" id="bleed-size" value="3" min="0" max="10" class="form-control small">
                    </div>
                    <div class="control-group">
                        <label>安全区 (mm):</label>
                        <input type="number" id="safe-margin" value="5" min="0" max="20" class="form-control small">
                    </div>
                    <div class="control-group">
                        <label>吸附对齐:</label>
                        <select id="snap-mode" class="form-control">
                            <option value="none">关闭</option>
                            <option value="grid">网格对齐</option>
                            <option value="object">对象对齐</option>
                            <option value="both">全部开启</option>
                        </select>
                    </div>
                    <button id="apply-canvas-settings" class="btn btn-small btn-primary">应用</button>
                </div>
                
                <div class="canvas-wrapper" id="canvas-wrapper">
                    <div class="canvas-container" id="canvas-container">
                        <!-- 画布内容 -->
                    </div>
                </div>
                
                <!-- 选中对象属性面板 -->
                <div class="properties-panel" id="properties-panel" style="display: none;">
                    <div class="panel-header">
                        <h3>🎯 对象属性</h3>
                        <button id="close-properties" class="btn btn-small btn-secondary">×</button>
                    </div>
                    <div class="panel-content">
                        <div class="form-group">
                            <label>素材名称:</label>
                            <input type="text" id="prop-name" class="form-control" placeholder="给素材命名">
                        </div>
                        <div class="form-group">
                            <label>颜色/工艺备注:</label>
                            <textarea id="prop-notes" class="form-control" rows="2" placeholder="如：UV烫金、白墨、专色等"></textarea>
                        </div>
                        <div class="form-group">
                            <label>X 坐标:</label>
                            <input type="number" id="prop-x" class="form-control small">
                        </div>
                        <div class="form-group">
                            <label>Y 坐标:</label>
                            <input type="number" id="prop-y" class="form-control small">
                        </div>
                        <div class="form-group">
                            <label>宽度:</label>
                            <input type="number" id="prop-width" class="form-control small">
                        </div>
                        <div class="form-group">
                            <label>高度:</label>
                            <input type="number" id="prop-height" class="form-control small">
                        </div>
                        <div class="form-group">
                            <label>旋转角度:</label>
                            <input type="number" id="prop-rotation" class="form-control small">
                        </div>
                        <div class="form-group">
                            <label>透明度:</label>
                            <input type="range" id="prop-opacity" min="0" max="100" value="100" class="form-control">
                        </div>
                        <div class="button-group">
                            <button id="prop-layer-up" class="btn btn-small btn-secondary">上移一层</button>
                            <button id="prop-layer-down" class="btn btn-small btn-secondary">下移一层</button>
                            <button id="prop-delete" class="btn btn-small btn-danger">删除</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 右侧面板：问题检查 -->
            <aside class="right-panel">
                <div class="panel-header">
                    <h2>⚠️ 问题检查</h2>
                    <button id="run-checks" class="btn btn-small btn-primary">重新检查</button>
                </div>
                <div class="panel-content">
                    <div class="check-summary" id="check-summary">
                        <div class="check-item">
                            <span class="check-icon">✅</span>
                            <span>检查状态: 未运行</span>
                        </div>
                    </div>
                    <div class="issues-list" id="issues-list">
                        <!-- 问题列表 -->
                    </div>
                </div>
                
                <!-- 操作历史 -->
                <div class="panel-section">
                    <h3>📋 操作历史</h3>
                    <div class="history-list" id="history-list">
                        <div class="history-item">新建工程</div>
                    </div>
                    <div class="button-group">
                        <button id="undo" class="btn btn-small btn-secondary">撤销</button>
                        <button id="redo" class="btn btn-small btn-secondary">重做</button>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/materials.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/export.js"></script>
</body>
</html>
