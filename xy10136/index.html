<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海关查验队列游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #f97316, #eab308, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    .game-board {
      display: grid;
      grid-template-columns: 300px 1fr 350px;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-label {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .status-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .state-indicator {
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
    }

    .state-idle { background: #334155; color: #fff; }
    .state-playing { background: #22c55e; color: #000; }
    .state-paused { background: #eab308; color: #000; }
    .state-game_over { background: #ef4444; color: #fff; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-warning {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: black;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }

    .btn-success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: black;
    }

    .main-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .queue-section {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 15px;
    }

    .queue-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 0;
      min-height: 120px;
      align-items: center;
    }

    .queue-item {
      flex-shrink: 0;
      width: 100px;
      height: 100px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      position: relative;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .queue-item .item-icon {
      font-size: 2rem;
      margin-bottom: 5px;
    }

    .queue-item .item-id {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
    }

    .windows-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .window {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 20px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
    }

    .window-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .window-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .window-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .window-empty {
      color: #64748b;
      text-align: center;
    }

    .window-item {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #84cc16);
      transition: width 0.1s linear;
      border-radius: 4px;
    }

    .action-btn {
      margin-top: 15px;
      width: 100%;
    }

    .info-panel {
      font-size: 0.9rem;
    }

    .rule-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .rule-label {
      color: #94a3b8;
    }

    .rule-value {
      font-weight: 600;
    }

    .score-history {
      max-height: 300px;
      overflow-y: auto;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .history-action {
      font-weight: 600;
    }

    .history-score {
      font-weight: 700;
    }

    .score-positive { color: #22c55e; }
    .score-negative { color: #ef4444; }

    .risk-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .game-over-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .game-over-modal {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
      animation: scaleIn 0.3s ease;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .game-over-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ef4444;
      margin-bottom: 15px;
    }

    .game-over-reason {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .final-score {
      font-size: 3rem;
      font-weight: 700;
      margin: 20px 0;
    }

    .pass-action {
      margin-top: 20px;
      text-align: center;
    }

    .btn-pass {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      padding: 15px 40px;
      font-size: 1.1rem;
    }

    @media (max-width: 1200px) {
      .game-board {
        grid-template-columns: 1fr;
      }
    }

    .legend {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      font-size: 0.85rem;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      margin-right: 5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛃 海关查验队列游戏</h1>
      <p class="subtitle">准确判断旅客和货物的风险等级，快速处理队列</p>
    </header>

    <div class="status-bar">
      <div class="status-item">
        <span class="status-label">分数</span>
        <span class="status-value" id="score">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">队列长度</span>
        <span class="status-value" id="queue-size">0/10</span>
      </div>
      <div class="status-item">
        <span class="status-label">违禁品放行</span>
        <span class="status-value" id="contraband-misses">0/3</span>
      </div>
      <div class="status-item">
        <span class="status-label">游戏时间</span>
        <span class="status-value" id="game-time">00:00</span>
      </div>
      <div class="state-indicator" id="state-indicator">空闲</div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="btn-start">开始游戏</button>
      <button class="btn-warning" id="btn-pause" disabled>暂停</button>
      <button class="btn-danger" id="btn-restart" disabled>重新开始</button>
    </div>

    <div class="game-board">
      <div class="panel">
        <div class="panel-title">📋 游戏规则</div>
        <div class="info-panel">
          <div class="legend">
            <div class="legend-item">
              <span class="legend-color" style="background: #22c55e;"></span>
              <span>低风险</span>
            </div>
            <div class="legend-item">
              <span class="legend-color" style="background: #eab308;"></span>
              <span>中风险</span>
            </div>
            <div class="legend-item">
              <span class="legend-color" style="background: #f97316;"></span>
              <span>高风险</span>
            </div>
            <div class="legend-item">
              <span class="legend-color" style="background: #8b5cf6;"></span>
              <span>违禁品</span>
            </div>
          </div>
          
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">3s</div>
              <div class="stat-label">低风险查验</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">5s</div>
              <div class="stat-label">中风险查验</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">8s</div>
              <div class="stat-label">高风险查验</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">10s</div>
              <div class="stat-label">违禁品查验</div>
            </div>
          </div>

          <div style="margin-top: 20px;">
            <div class="rule-item">
              <span class="rule-label">正确放行低风险</span>
              <span class="rule-value" style="color: #22c55e;">+20</span>
            </div>
            <div class="rule-item">
              <span class="rule-label">查验中风险</span>
              <span class="rule-value" style="color: #22c55e;">+30</span>
            </div>
            <div class="rule-item">
              <span class="rule-label">查验高风险</span>
              <span class="rule-value" style="color: #22c55e;">+50</span>
            </div>
            <div class="rule-item">
              <span class="rule-label">查获违禁品</span>
              <span class="rule-value" style="color: #22c55e;">+100</span>
            </div>
            <div class="rule-item">
              <span class="rule-label">错误查验低风险</span>
              <span class="rule-value" style="color: #ef4444;">-10</span>
            </div>
            <div class="rule-item">
              <span class="rule-label">放行者中风险</span>
              <span class="rule-value" style="color: #ef4444;">-50</span>
            </div>
            <div class="rule-item">
              <span class="rule-label">放行高风险</span>
              <span class="rule-value" style="color: #ef4444;">-100</span>
            </div>
            <div class="rule-item">
              <span class="rule-label">放行违禁品</span>
              <span class="rule-value" style="color: #ef4444;">-200</span>
            </div>
          </div>
        </div>
      </div>

      <div class="panel main-area">
        <div class="queue-section">
          <div class="panel-title">🚚 待处理队列</div>
          <div class="queue-container" id="queue-container">
            <div class="window-empty">队列为空</div>
          </div>
          
          <div class="pass-action">
            <button class="btn-pass" id="btn-pass">📤 放行队首物品</button>
          </div>
        </div>

        <div class="windows-section">
          <div class="window">
            <div class="window-header">
              <span class="window-title">🪟 查验窗口 1</span>
              <span id="window1-status">空闲</span>
            </div>
            <div class="window-content" id="window1-content">
              <div class="window-empty">等待物品</div>
            </div>
            <div class="progress-bar" id="window1-progress">
              <div class="progress-fill" style="width: 0%"></div>
            </div>
            <button class="btn-success action-btn" id="btn-inspect-1">开始查验</button>
          </div>

          <div class="window">
            <div class="window-header">
              <span class="window-title">🪟 查验窗口 2</span>
              <span id="window2-status">空闲</span>
            </div>
            <div class="window-content" id="window2-content">
              <div class="window-empty">等待物品</div>
            </div>
            <div class="progress-bar" id="window2-progress">
              <div class="progress-fill" style="width: 0%"></div>
            </div>
            <button class="btn-success action-btn" id="btn-inspect-2">开始查验</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">📊 计分明细</div>
        <div class="score-history" id="score-history">
          <div class="window-empty">暂无记录</div>
        </div>
      </div>
    </div>
  </div>

  <div id="game-over-overlay" class="game-over-overlay" style="display: none;">
    <div class="game-over-modal">
      <div class="game-over-title">游戏结束</div>
      <div class="game-over-reason" id="game-over-reason"></div>
      <div class="final-score" id="final-score">0</div>
      <div style="margin-bottom: 20px;">最终分数</div>
      <button class="btn-primary" id="btn-replay" style="padding: 15px 40px; font-size: 1.1rem;">
        🔄 再来一局
      </button>
    </div>
  </div>

  <script type="module">
    import { CustomsGame, GameState, RiskLevel, RiskConfig } from './src/game.js';

    const game = new CustomsGame();
    let animationFrameId = null;

    const riskIcons = {
      [RiskLevel.LOW]: '📦',
      [RiskLevel.MEDIUM]: '🧳',
      [RiskLevel.HIGH]: '⚠️',
      [RiskLevel.CONTRABAND]: '🚫'
    };

    function formatTime(ms) {
      const seconds = Math.floor(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function getRiskName(riskLevel) {
      return RiskConfig[riskLevel].name;
    }

    function getRiskColor(riskLevel) {
      return RiskConfig[riskLevel].color;
    }

    function createItemElement(item, isQueue = true) {
      const div = document.createElement('div');
      div.className = isQueue ? 'queue-item' : 'window-item';
      div.style.background = `linear-gradient(135deg, ${getRiskColor(item.riskLevel)}20, ${getRiskColor(item.riskLevel)}40)`;
      div.style.border = `2px solid ${getRiskColor(item.riskLevel)}`;
      div.innerHTML = `
        <span class="item-id">#${item.id}</span>
        <span class="item-icon">${riskIcons[item.riskLevel]}</span>
        <span>${item.type}</span>
        <span style="font-size: 0.7rem; color: ${getRiskColor(item.riskLevel)}">${getRiskName(item.riskLevel)}</span>
      `;
      return div;
    }

    function updateUI() {
      const status = game.getStatus();
      
      document.getElementById('score').textContent = status.score;
      document.getElementById('queue-size').textContent = `${status.queue.length}/${status.maxQueueSize}`;
      document.getElementById('contraband-misses').textContent = `${status.contrabandMisses}/${status.maxContrabandMisses}`;
      document.getElementById('game-time').textContent = formatTime(status.gameTime);

      const stateIndicator = document.getElementById('state-indicator');
      stateIndicator.className = 'state-indicator';
      stateIndicator.classList.add(`state-${status.state}`);
      
      const stateNames = {
        [GameState.IDLE]: '空闲',
        [GameState.PLAYING]: '游戏中',
        [GameState.PAUSED]: '已暂停',
        [GameState.GAME_OVER]: '游戏结束'
      };
      stateIndicator.textContent = stateNames[status.state];

      const btnStart = document.getElementById('btn-start');
      const btnPause = document.getElementById('btn-pause');
      const btnRestart = document.getElementById('btn-restart');
      const btnPass = document.getElementById('btn-pass');
      const btnInspect1 = document.getElementById('btn-inspect-1');
      const btnInspect2 = document.getElementById('btn-inspect-2');

      btnStart.disabled = status.state === GameState.PLAYING;
      btnPause.disabled = status.state !== GameState.PLAYING && status.state !== GameState.PAUSED;
      btnRestart.disabled = status.state === GameState.IDLE;
      btnPass.disabled = status.state !== GameState.PLAYING || status.queue.length === 0;
      btnInspect1.disabled = status.state !== GameState.PLAYING || status.windows[0] !== null || status.queue.length === 0;
      btnInspect2.disabled = status.state !== GameState.PLAYING || status.windows[1] !== null || status.queue.length === 0;

      if (status.state === GameState.PAUSED) {
        btnPause.textContent = '继续';
      } else {
        btnPause.textContent = '暂停';
      }

      updateQueue(status.queue);
      updateWindow(0, status.windows[0]);
      updateWindow(1, status.windows[1]);
      updateScoreHistory(status.scoreHistory);

      if (status.state === GameState.PLAYING) {
        updateProgressBars();
      }
    }

    function updateQueue(queue) {
      const container = document.getElementById('queue-container');
      container.innerHTML = '';
      
      if (queue.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'window-empty';
        empty.textContent = '队列为空';
        container.appendChild(empty);
      } else {
        queue.forEach(item => {
          container.appendChild(createItemElement(item, true));
        });
      }
    }

    function updateWindow(index, item) {
      const contentId = `window${index + 1}-content`;
      const statusId = `window${index + 1}-status`;
      const progressId = `window${index + 1}-progress`;
      
      const content = document.getElementById(contentId);
      const status = document.getElementById(statusId);
      const progress = document.getElementById(progressId);
      
      content.innerHTML = '';
      
      if (item) {
        content.appendChild(createItemElement(item, false));
        status.textContent = '查验中...';
        status.style.color = getRiskColor(item.riskLevel);
      } else {
        const empty = document.createElement('div');
        empty.className = 'window-empty';
        empty.innerHTML = '<div style="font-size: 2rem; margin-bottom: 10px;">🪟</div><div>等待物品</div>';
        content.appendChild(empty);
        status.textContent = '空闲';
        status.style.color = '#64748b';
      }
    }

    function updateProgressBars() {
      for (let i = 0; i < 2; i++) {
        const progress = game.getInspectionProgress(i);
        const progressBar = document.getElementById(`window${i + 1}-progress`).querySelector('.progress-fill');
        progressBar.style.width = `${progress * 100}%`;
      }
    }

    function updateScoreHistory(history) {
      const container = document.getElementById('score-history');
      container.innerHTML = '';
      
      if (history.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'window-empty';
        empty.textContent = '暂无记录';
        container.appendChild(empty);
        return;
      }

      const recentHistory = history.slice(-10).reverse();
      
      recentHistory.forEach(record => {
        const div = document.createElement('div');
        div.className = 'history-item';
        
        const scoreClass = record.scoreChange >= 0 ? 'score-positive' : 'score-negative';
        const actionText = record.action === 'inspect' ? '查验' : '放行';
        const correctText = record.isCorrect ? '✓ 正确' : '✗ 错误';
        
        div.innerHTML = `
          <div class="history-header">
            <span class="history-action">
              <span class="risk-dot" style="background: ${getRiskColor(record.riskLevel)}"></span>
              ${actionText} ${getRiskName(record.riskLevel)}
            </span>
            <span class="history-score ${scoreClass}">
              ${record.scoreChange >= 0 ? '+' : ''}${record.scoreChange}
            </span>
          </div>
          <div style="color: #64748b;">
            物品 #${record.itemId} · ${correctText}
            ${record.isContrabandMiss ? ' · <span style="color: #ef4444;">违禁品放行!</span>' : ''}
          </div>
        `;
        
        container.appendChild(div);
      });
    }

    function showGameOver(reason, score) {
      document.getElementById('game-over-overlay').style.display = 'flex';
      document.getElementById('game-over-reason').textContent = reason;
      document.getElementById('final-score').textContent = score;
    }

    function hideGameOver() {
      document.getElementById('game-over-overlay').style.display = 'none';
    }

    function animate() {
      const status = game.getStatus();
      if (status.state === GameState.PLAYING) {
        updateUI();
      }
      animationFrameId = requestAnimationFrame(animate);
    }

    game.setEventHandlers({
      onItemSpawn: (item) => {
        console.log('新物品进入队列:', item);
      },
      onInspectionComplete: (windowIndex, item, scoreChange, isCorrect) => {
        console.log(`窗口${windowIndex + 1}查验完成:`, item, '分数变化:', scoreChange);
        updateUI();
      },
      onGameOver: (reason, score) => {
        console.log('游戏结束:', reason, '最终分数:', score);
        updateUI();
        showGameOver(reason, score);
      }
    });

    document.getElementById('btn-start').addEventListener('click', () => {
      game.start();
      updateUI();
    });

    document.getElementById('btn-pause').addEventListener('click', () => {
      const status = game.getStatus();
      if (status.state === GameState.PLAYING) {
        game.pause();
      } else if (status.state === GameState.PAUSED) {
        game.resume();
      }
      updateUI();
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      hideGameOver();
      game.restart();
      updateUI();
    });

    document.getElementById('btn-pass').addEventListener('click', () => {
      const result = game.pass();
      if (result.success) {
        updateUI();
      }
    });

    document.getElementById('btn-inspect-1').addEventListener('click', () => {
      const result = game.inspect(0);
      if (result.success) {
        updateUI();
      }
    });

    document.getElementById('btn-inspect-2').addEventListener('click', () => {
      const result = game.inspect(1);
      if (result.success) {
        updateUI();
      }
    });

    document.getElementById('btn-replay').addEventListener('click', () => {
      hideGameOver();
      game.restart();
      updateUI();
    });

    animate();
    updateUI();
  </script>
</body>
</html>
