<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>听辨题库错题本</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-content">
        <h1>🎵 听辨题库错题本</h1>
        <div class="stats-bar" id="statsBar">
          <div class="stat-item">
            <span class="stat-label">错题总数</span>
            <span class="stat-value" id="totalErrors">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">未解决</span>
            <span class="stat-value unresolved" id="unresolvedErrors">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">待处理异常</span>
            <span class="stat-value anomaly" id="pendingAnomalies">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">本月修正</span>
            <span class="stat-value" id="monthlyCorrections">0</span>
          </div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-tab="errors">📝 错题明细</button>
        <button class="nav-btn" data-tab="anomalies">⚠️ 异常清单</button>
        <button class="nav-btn" data-tab="history">📊 练习历史</button>
        <button class="nav-btn" data-tab="corrections">📋 修正记录</button>
        <button class="nav-btn" data-tab="answers">✏️ 答题记录</button>
        <button class="nav-btn" data-tab="questions">📚 题目管理</button>
      </nav>
    </header>

    <main class="main">
      <section class="tab-content active" id="tab-errors">
        <div class="toolbar">
          <div class="filters">
            <select id="errorTypeFilter">
              <option value="">全部题型</option>
              <option value="interval">音程</option>
              <option value="chord">和弦</option>
              <option value="rhythm">节奏</option>
            </select>
            <select id="errorResolvedFilter">
              <option value="">全部状态</option>
              <option value="false">未解决</option>
              <option value="true">已解决</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="openAnswerModal()">+ 新增答题记录</button>
        </div>
        <div class="table-container">
          <table class="data-table" id="errorsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>题型</th>
                <th>题目</th>
                <th>错误分类</th>
                <th>学生答案</th>
                <th>标准答案</th>
                <th>练习次数</th>
                <th>最近练习</th>
                <th>状态</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="errorsTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="tab-content" id="tab-anomalies">
        <div class="toolbar">
          <div class="filters">
            <select id="anomalyTypeFilter">
              <option value="">全部类型</option>
              <option value="enharmonic_judge">等音误判</option>
              <option value="type_misclassify">题型错归</option>
              <option value="duplicate_unmerged">重复练习未合并</option>
              <option value="other">其他</option>
            </select>
            <select id="anomalyStatusFilter">
              <option value="">全部状态</option>
              <option value="pending">待确认</option>
              <option value="confirmed">已确认</option>
              <option value="rejected">已驳回</option>
              <option value="resolved">已解决</option>
            </select>
          </div>
        </div>
        <div class="table-container">
          <table class="data-table" id="anomaliesTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>类型</th>
                <th>状态</th>
                <th>题目</th>
                <th>描述</th>
                <th>详细说明</th>
                <th>创建时间</th>
                <th>处理人</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="anomaliesTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="tab-content" id="tab-history">
        <div class="toolbar">
          <div class="filters">
            <select id="historyOpFilter">
              <option value="">全部操作</option>
              <option value="submit">正常提交</option>
              <option value="makeup">补录</option>
              <option value="withdraw">撤回</option>
              <option value="update">修改</option>
              <option value="retry">重复练习</option>
            </select>
            <input type="text" id="historySearch" placeholder="搜索题目或答案...">
          </div>
          <button class="btn btn-secondary" onclick="loadHistoryStats()">📈 查看统计</button>
        </div>
        <div id="historyStats" class="stats-panel hidden"></div>
        <div class="table-container">
          <table class="data-table" id="historyTable">
            <thead>
              <tr>
                <th>时间</th>
                <th>操作类型</th>
                <th>题目</th>
                <th>学生答案</th>
                <th>结果</th>
                <th>变更前</th>
                <th>变更后</th>
                <th>备注</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="tab-content" id="tab-corrections">
        <div class="toolbar">
          <div class="filters">
            <select id="correctionTableFilter">
              <option value="">全部表</option>
              <option value="answer_records">答题记录</option>
              <option value="error_records">错题记录</option>
              <option value="anomalies">异常记录</option>
              <option value="questions">题目</option>
            </select>
            <button class="btn btn-secondary" onclick="loadMonthlyReview()">📅 本月复盘</button>
          </div>
        </div>
        <div id="monthlyReview" class="review-panel hidden"></div>
        <div class="table-container">
          <table class="data-table" id="correctionsTable">
            <thead>
              <tr>
                <th>时间</th>
                <th>表</th>
                <th>记录ID</th>
                <th>字段</th>
                <th>旧值</th>
                <th>新值</th>
                <th>理由</th>
                <th>操作人</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="correctionsTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="tab-content" id="tab-answers">
        <div class="toolbar">
          <div class="filters">
            <select id="answerSourceFilter">
              <option value="">全部来源</option>
              <option value="normal">正常</option>
              <option value="makeup">补录</option>
              <option value="withdrawn">撤回</option>
              <option value="duplicate">重复</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="openAnswerModal()">+ 新增答题记录</button>
        </div>
        <div class="table-container">
          <table class="data-table" id="answersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>题型</th>
                <th>题目</th>
                <th>学生答案</th>
                <th>标准答案</th>
                <th>结果</th>
                <th>来源</th>
                <th>提交时间</th>
                <th>缺字段</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="answersTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="tab-content" id="tab-questions">
        <div class="toolbar">
          <div class="filters">
            <select id="questionTypeFilter">
              <option value="">全部题型</option>
              <option value="interval">音程</option>
              <option value="chord">和弦</option>
              <option value="rhythm">节奏</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="openQuestionModal()">+ 新增题目</button>
        </div>
        <div class="table-container">
          <table class="data-table" id="questionsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>题型</th>
                <th>标题</th>
                <th>音频</th>
                <th>标准答案</th>
                <th>难度</th>
                <th>标签</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="questionsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="answerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="answerModalTitle">新增答题记录</h3>
        <button class="modal-close" onclick="closeModal('answerModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="answerForm">
          <input type="hidden" id="answerId">
          <div class="form-group">
            <label>选择题目 *</label>
            <select id="answerQuestionId" required></select>
          </div>
          <div class="form-group">
            <label>学生答案</label>
            <input type="text" id="answerStudentAnswer" placeholder="学生填写的答案">
          </div>
          <div class="form-group">
            <label>答案来源</label>
            <select id="answerSource">
              <option value="normal">正常提交</option>
              <option value="makeup">补录</option>
              <option value="duplicate">重复提交</option>
            </select>
          </div>
          <div class="form-group">
            <label>备注</label>
            <textarea id="answerRemark" rows="2" placeholder="备注信息"></textarea>
          </div>
          <div class="form-group">
            <label>修正理由 (修改时必填)</label>
            <input type="text" id="answerCorrectionReason" placeholder="请说明修改原因">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('answerModal')">取消</button>
        <button class="btn btn-primary" onclick="saveAnswer()">保存</button>
      </div>
    </div>
  </div>

  <div class="modal" id="questionModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="questionModalTitle">新增题目</h3>
        <button class="modal-close" onclick="closeModal('questionModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="questionForm">
          <input type="hidden" id="questionId">
          <div class="form-group">
            <label>题型 *</label>
            <select id="questionType" required>
              <option value="interval">音程</option>
              <option value="chord">和弦</option>
              <option value="rhythm">节奏</option>
            </select>
          </div>
          <div class="form-group">
            <label>标题 *</label>
            <input type="text" id="questionTitle" required placeholder="题目标题">
          </div>
          <div class="form-group">
            <label>音频文件</label>
            <input type="text" id="questionAudioFile" placeholder="如: interval_major3.mp3">
          </div>
          <div class="form-group">
            <label>标准答案 *</label>
            <input type="text" id="questionStandardAnswer" required placeholder="如: major_third">
          </div>
          <div class="form-group">
            <label>描述</label>
            <textarea id="questionDescription" rows="2" placeholder="题目描述"></textarea>
          </div>
          <div class="form-group">
            <label>难度</label>
            <select id="questionDifficulty">
              <option value="easy">简单</option>
              <option value="medium">中等</option>
              <option value="hard">困难</option>
            </select>
          </div>
          <div class="form-group">
            <label>标签</label>
            <input type="text" id="questionTags" placeholder="用逗号分隔，如: 音程,大三度">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('questionModal')">取消</button>
        <button class="btn btn-primary" onclick="saveQuestion()">保存</button>
      </div>
    </div>
  </div>

  <div class="modal" id="correctionModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>修改记录</h3>
        <button class="modal-close" onclick="closeModal('correctionModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="correctionDetails"></div>
        <div class="form-group">
          <label>新值</label>
          <input type="text" id="correctionNewValue">
        </div>
        <div class="form-group">
          <label>修改理由 *</label>
          <input type="text" id="correctionReason" required placeholder="请说明修改原因">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('correctionModal')">取消</button>
        <button class="btn btn-primary" onclick="confirmCorrection()">确认修改</button>
      </div>
    </div>
  </div>

  <div class="modal" id="anomalyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>处理异常</h3>
        <button class="modal-close" onclick="closeModal('anomalyModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="anomalyDetails"></div>
        <div class="form-group">
          <label>处理结果</label>
          <select id="anomalyAction">
            <option value="confirm">确认有效（保留错误）</option>
            <option value="reject">驳回（不视为错误）</option>
            <option value="resolve">标记为已解决</option>
          </select>
        </div>
        <div class="form-group" id="mergeOptions" style="display:none;">
          <label>选择要合并的错题ID（逗号分隔）</label>
          <input type="text" id="mergeErrorIds" placeholder="如: 1,3,5">
        </div>
        <div class="form-group">
          <label>处理说明</label>
          <input type="text" id="anomalyHandleNote" placeholder="处理说明">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('anomalyModal')">取消</button>
        <button class="btn btn-primary" onclick="confirmAnomalyAction()">确认处理</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
