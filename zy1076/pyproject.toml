[project]
name = "resume-matcher"
version = "0.1.0"
description = "本地简历岗位匹配小助手 - AI/ML应用"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "jieba>=0.42.1",
    "python-Levenshtein>=0.21.0",
    "click>=8.0.0",
    "jinja2>=3.1.0",
]
dynamic = ["readme"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
resume-matcher = "resume_matcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resume_matcher"]
