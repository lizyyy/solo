<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>民宿保洁返工追踪台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>🏠 民宿保洁返工追踪台</h1>
      <div class="header-actions">
        <button id="initDataBtn" class="btn-outline">初始化样例数据</button>
        <button id="exportBtn" class="btn-primary">📥 导出报表</button>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="tasks">📋 任务管理</button>
    <button class="tab-btn" data-tab="properties">🏡 房源管理</button>
    <button class="tab-btn" data-tab="cleaners">👥 保洁员管理</button>
    <button class="tab-btn" data-tab="stats">📊 统计分析</button>
  </nav>

  <main>
    <section id="tasks-tab" class="tab-content active">
      <div class="filters">
        <div class="filter-group">
          <label>状态筛选</label>
          <select id="filterStatus">
            <option value="">全部状态</option>
            <option value="assigned">已指派</option>
            <option value="in_progress">进行中</option>
            <option value="completed">已完成</option>
            <option value="inspected">已检查</option>
            <option value="redo_needed">需返工</option>
            <option value="redo_in_progress">返工中</option>
            <option value="redo_completed">返工完成</option>
            <option value="closed">已关闭</option>
          </select>
        </div>
        <div class="filter-group">
          <label>房源</label>
          <select id="filterProperty">
            <option value="">全部房源</option>
          </select>
        </div>
        <div class="filter-group">
          <label>保洁员</label>
          <select id="filterCleaner">
            <option value="">全部保洁员</option>
          </select>
        </div>
        <div class="filter-group">
          <label>入住单号</label>
          <input type="text" id="filterBookingId" placeholder="搜索入住单号">
        </div>
        <div class="filter-group">
          <label>开始日期</label>
          <input type="date" id="filterStartDate">
        </div>
        <div class="filter-group">
          <label>结束日期</label>
          <input type="date" id="filterEndDate">
        </div>
        <div class="filter-group">
          <label>&nbsp;</label>
          <button class="btn-outline" id="searchBtn">🔍 搜索</button>
          <button class="btn-outline" id="resetBtn">重置</button>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn-primary" id="newTaskBtn">➕ 新建任务</button>
        <span class="task-count" id="taskCount">共 0 条任务</span>
      </div>

      <div class="table-container">
        <table id="tasksTable">
          <thead>
            <tr>
              <th>任务ID</th>
              <th>入住单号</th>
              <th>房源</th>
              <th>保洁员</th>
              <th>住客</th>
              <th>状态</th>
              <th>优先级</th>
              <th>返工次数</th>
              <th>处罚/赔付</th>
              <th>派单时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tasksTableBody">
            <tr>
              <td colspan="11" class="loading">加载中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="properties-tab" class="tab-content">
      <div class="action-bar">
        <button class="btn-primary" id="newPropertyBtn">➕ 新建房源</button>
      </div>
      <div class="table-container">
        <table id="propertiesTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>名称</th>
              <th>地址</th>
              <th>房间数</th>
              <th>面积</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="propertiesTableBody"></tbody>
        </table>
      </div>
    </section>

    <section id="cleaners-tab" class="tab-content">
      <div class="action-bar">
        <button class="btn-primary" id="newCleanerBtn">➕ 新建保洁员</button>
      </div>
      <div class="table-container">
        <table id="cleanersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>姓名</th>
              <th>电话</th>
              <th>评分</th>
              <th>总任务</th>
              <th>返工任务</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="cleanersTableBody"></tbody>
        </table>
      </div>
    </section>

    <section id="stats-tab" class="tab-content">
      <div class="stats-filters">
        <div class="filter-group">
          <label>开始日期</label>
          <input type="date" id="statsStartDate">
        </div>
        <div class="filter-group">
          <label>结束日期</label>
          <input type="date" id="statsEndDate">
        </div>
        <div class="filter-group">
          <label>&nbsp;</label>
          <button class="btn-outline" id="refreshStatsBtn">🔄 刷新</button>
        </div>
      </div>
      
      <div class="stats-cards" id="statsCards">
      </div>
      
      <div class="stats-grid">
        <div class="stats-panel">
          <h3>房源统计</h3>
          <div class="table-container">
            <table id="propertyStatsTable">
              <thead>
                <tr>
                  <th>房源</th>
                  <th>任务数</th>
                  <th>返工数</th>
                  <th>总处罚</th>
                  <th>总赔付</th>
                </tr>
              </thead>
              <tbody id="propertyStatsBody"></tbody>
            </table>
          </div>
        </div>
        
        <div class="stats-panel">
          <h3>保洁员绩效</h3>
          <div class="table-container">
            <table id="cleanerStatsTable">
              <thead>
                <tr>
                  <th>保洁员</th>
                  <th>评分</th>
                  <th>总任务</th>
                  <th>返工数</th>
                  <th>总处罚</th>
                  <th>总赔付</th>
                </tr>
              </thead>
              <tbody id="cleanerStatsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content" id="modalContent">
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
