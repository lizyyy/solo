[project]
name = "cold-chain-claim-cli"
version = "0.1.0"
description = "冷链小仓冷链赔付材料处理工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
cold-chain-claim = "cold_chain_claim.cli:main"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
