server {
    listen 80;
    server_name edge.example.com;

    location / {
        root /var/www;
    }

    location ~ ^/a {
        return 200 "regex a";
    }

    location ~ ^/ab {
        return 200 "regex ab";
    }

    location ~ ^/abc {
        return 200 "regex abc";
    }

    location ^~ /admin/ {
        deny all;
    }

    location ~ /admin/.*\.php$ {
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /test {
        return 200 "exact match";
    }

    location ~ ^/test$ {
        return 200 "regex exact";
    }

    location /test/ {
        return 200 "prefix test/";
    }
}

server {
    listen 443 ssl;
    server_name ssl.example.com;

    location ~* \.(jpg|jpeg|png)$ {
        expires 30d;
    }

    location ~* \.(gif|GIF)$ {
        expires 7d;
    }
}
