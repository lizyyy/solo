server {
    listen 80;
    server_name conflict-example.com;

    location /api/ {
        alias /var/www/api/;
    }

    location /api/v2/ {
        alias /var/www/api-v2/;
    }

    location ^~ /api/v1/ {
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~* \.php$ {
        fastcgi_pass 127.0.0.1:9001;
    }

    location /static/ {
        expires 7d;
    }

    location /static/images/ {
        expires 30d;
    }

    location = /login {
        return 302 /auth/login;
    }

    location /login/ {
        auth_basic "Login Required";
    }
}
