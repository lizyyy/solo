<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型推理API评测系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 40px; }
        .header h1 { font-size: 28px; font-weight: 600; }
        .header p { opacity: 0.9; margin-top: 5px; }
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #e0e0e0; }
        .tab { padding: 12px 24px; background: none; border: none; cursor: pointer; font-size: 15px; color: #666; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #667eea; border-bottom-color: #667eea; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-value { font-size: 36px; font-weight: 700; color: #667eea; }
        .stat-label { color: #666; margin-top: 8px; font-size: 14px; }
        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-card, .model-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .chart-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #333; }
        .bar-chart { display: flex; align-items: flex-end; gap: 20px; height: 200px; padding: 10px 0; }
        .bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .bar { width: 100%; background: linear-gradient(180deg, #667eea, #764ba2); border-radius: 6px 6px 0 0; transition: height 0.3s; min-width: 40px; }
        .bar-label { margin-top: 8px; font-size: 12px; color: #666; text-align: center; }
        .model-item { padding: 16px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .model-item:last-child { border-bottom: none; }
        .model-name { font-weight: 600; }
        .model-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .timeline { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; }
        .timeline-item { padding: 16px 0 16px 40px; border-left: 3px solid #e0e0e0; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -8px; top: 22px; width: 13px; height: 13px; background: #667eea; border-radius: 50%; }
        .timeline-time { font-size: 12px; color: #999; margin-bottom: 4px; }
        .timeline-msg { font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
        .btn { padding: 12px 24px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: #6c757d; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .eval-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid; }
        .eval-correct { border-left-color: #28a745; }
        .eval-review { border-left-color: #ffc107; }
        .eval-labeled { border-left-color: #17a2b8; }
        .eval-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .eval-badge { padding: 3px 10px; border-radius: 15px; font-size: 12px; font-weight: 500; }
        .badge-correct { background: #d4edda; color: #155724; }
        .badge-review { background: #fff3cd; color: #856404; }
        .badge-labeled { background: #d1ecf1; color: #0c5460; }
        .latency { font-size: 14px; color: #666; }
        .correction-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #e74c3c; }
        .error-alert { background: #f8d7da; color: #721c24; padding: 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .success-alert { background: #d4edda; color: #155724; padding: 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 模型推理API评测系统</h1>
        <p>质量负责人评测工作台 - 本地部署版</p>
    </div>
    <div class="container">
        <div class="nav-tabs">
            <button class="tab active" data-tab="dashboard">📊 看板</button>
            <button class="tab" data-tab="models">🧠 模型管理</button>
            <button class="tab" data-tab="evaluate">🔍 评测执行</button>
            <button class="tab" data-tab="timeline">⏱️ 时间线</button>
            <button class="tab" data-tab="corrections">🔧 修正复盘</button>
        </div>

        <div id="error-alert" class="error-alert"></div>
        <div id="success-alert" class="success-alert"></div>

        <div id="dashboard" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-evaluations">0</div>
                    <div class="stat-label">总评测数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-models">0</div>
                    <div class="stat-label">模型数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-samples">0</div>
                    <div class="stat-label">测试样本</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-accuracy">-</div>
                    <div class="stat-label">平均准确率</div>
                </div>
            </div>
            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-title">各模型准确率对比</div>
                    <div class="bar-chart" id="accuracy-chart"></div>
                </div>
                <div class="model-card">
                    <div class="chart-title">模型状态</div>
                    <div id="models-list"></div>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">最近评测结果</div>
                <div id="recent-evals"></div>
            </div>
        </div>

        <div id="models" class="tab-content">
            <div class="two-col">
                <div class="chart-card">
                    <div class="chart-title">添加新模型</div>
                    <form id="model-form">
                        <div class="form-group">
                            <label>模型名称</label>
                            <input type="text" id="model-name" placeholder="例如: GPT-3.5" required>
                        </div>
                        <div class="form-group">
                            <label>版本号</label>
                            <input type="text" id="model-version" placeholder="例如: turbo-0613" required>
                        </div>
                        <div class="form-group">
                            <label>描述</label>
                            <textarea id="model-desc" rows="3" placeholder="模型描述信息"></textarea>
                        </div>
                        <button type="submit" class="btn">添加模型</button>
                    </form>
                </div>
                <div class="chart-card">
                    <div class="chart-title">添加测试样本</div>
                    <form id="sample-form">
                        <div class="form-group">
                            <label>输入文本</label>
                            <textarea id="sample-input" rows="2" placeholder="测试输入" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>期望输出</label>
                            <textarea id="sample-output" rows="2" placeholder="期望的正确输出" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>分类</label>
                            <select id="sample-category">
                                <option value="general">通用</option>
                                <option value="technical">技术</option>
                                <option value="recommendation">推荐</option>
                                <option value="math">数学</option>
                                <option value="weather">天气</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">添加样本</button>
                    </form>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <button class="btn btn-secondary" onclick="initData()">初始化示例数据</button>
            </div>
        </div>

        <div id="evaluate" class="tab-content">
            <div class="chart-card">
                <div class="chart-title">执行评测</div>
                <div class="two-col">
                    <div class="form-group">
                        <label>选择模型</label>
                        <select id="eval-model"></select>
                    </div>
                    <div class="form-group">
                        <label>选择测试样本</label>
                        <select id="eval-sample"></select>
                    </div>
                </div>
                <button class="btn" onclick="runEvaluation()">开始评测</button>
            </div>
            <div class="chart-card" style="margin-top: 20px;">
                <div class="chart-title">待人工审核列表</div>
                <div id="review-list"></div>
            </div>
        </div>

        <div id="timeline" class="tab-content">
            <div class="timeline">
                <div class="chart-title">操作时间线</div>
                <div id="timeline-list"></div>
            </div>
        </div>

        <div id="corrections" class="tab-content">
            <div class="chart-card">
                <div class="chart-title">错误分类修正记录</div>
                <div id="corrections-list"></div>
            </div>
            <div class="chart-card" style="margin-top: 20px;">
                <div class="chart-title">⚠️ 规则阻挡测试</div>
                <p style="margin-bottom: 15px; color: #666;">点击下方按钮，系统会拒绝执行此操作（演示被规则挡住的场景）</p>
                <button class="btn btn-secondary" onclick="testBlocked()">尝试标记已通过的评测</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function api(url, options = {}) {
            try {
                const res = await fetch(API_BASE + url, {
                    headers: { 'Content-Type': 'application/json' },
                    ...options
                });
                const data = await res.json();
                if (!res.ok) throw data;
                return data;
            } catch (e) {
                showError(e.error || e.message || '请求失败');
                throw e;
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-alert');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-alert');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
                loadData();
            });
        });

        async function loadData() {
            await Promise.all([
                loadDashboard(),
                loadModelsSelect(),
                loadSamplesSelect(),
                loadTimeline(),
                loadReviewList(),
                loadCorrections()
            ]);
        }

        async function loadDashboard() {
            const data = await api('/dashboard');
            document.getElementById('stat-evaluations').textContent = data.total_evaluations;
            document.getElementById('stat-models').textContent = data.total_models;
            document.getElementById('stat-samples').textContent = data.total_samples;
            
            const models = Object.entries(data.by_model);
            const chart = document.getElementById('accuracy-chart');
            chart.innerHTML = models.map(([id, m]) => `
                <div class="bar-item">
                    <div class="bar" style="height: ${m.accuracy || 0}%"></div>
                    <div class="bar-label">${(models.find(x => x[0] === id)?.[1]?.model_name) || 'Model'}<br>${m.accuracy || 0}%</div>
                </div>
            `).join('');

            const modelsList = document.getElementById('models-list');
            const allModels = await api('/models');
            modelsList.innerHTML = allModels.map(m => `
                <div class="model-item">
                    <span class="model-name">${m.name} v${m.version}</span>
                    <span class="model-status status-${m.status}">${
                        m.status === 'approved' ? '通过' : m.status === 'rejected' ? '拒绝' : '待审核'
                    }</span>
                </div>
            `).join('');

            const evals = await api('/evaluations');
            const recent = evals.slice(-5).reverse();
            document.getElementById('recent-evals').innerHTML = recent.map(e => renderEvalCard(e)).join('');
        }

        async function loadModelsSelect() {
            const models = await api('/models');
            const html = models.map(m => `<option value="${m.id}">${m.name} v${m.version}</option>`).join('');
            document.getElementById('eval-model').innerHTML = html;
        }

        async function loadSamplesSelect() {
            const samples = await api('/test-samples');
            const html = samples.map(s => `<option value="${s.id}">${s.input.substring(0, 30)}...</option>`).join('');
            document.getElementById('eval-sample').innerHTML = html;
        }

        async function loadTimeline() {
            const items = await api('/timeline');
            document.getElementById('timeline-list').innerHTML = items.map(item => `
                <div class="timeline-item">
                    <div class="timeline-time">${new Date(item.timestamp).toLocaleString('zh-CN')}</div>
                    <div class="timeline-msg">${item.message}</div>
                </div>
            `).join('');
        }

        async function loadReviewList() {
            const evals = await api('/evaluations');
            const reviews = evals.filter(e => e.status === 'needs_review');
            const html = reviews.length ? reviews.map(e => `
                <div class="eval-card eval-review">
                    <div class="eval-header">
                        <span class="eval-badge badge-review">待人工审核</span>
                        <span class="latency">延迟: ${e.latency_ms}ms</span>
                    </div>
                    <div style="margin-bottom: 10px;"><strong>输入:</strong> ${e.input}</div>
                    <div style="margin-bottom: 10px;"><strong>实际输出:</strong> ${e.actual_output}</div>
                    <div style="margin-bottom: 15px;"><strong>错误类型:</strong> ${e.error_type}</div>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" placeholder="标注结果 (correct/incorrect)" id="label-${e.id}" class="form-control" style="flex: 1; padding: 8px;">
                        <input type="text" placeholder="处理理由" id="reason-${e.id}" class="form-control" style="flex: 2; padding: 8px;">
                        <button class="btn" onclick="submitLabel('${e.id}')">提交标注</button>
                    </div>
                </div>
            `).join('') : '<p style="color: #666; padding: 20px;">暂无待审核项</p>';
            document.getElementById('review-list').innerHTML = html;
        }

        async function loadCorrections() {
            const corrections = await api('/corrections');
            const html = corrections.length ? corrections.map(c => `
                <div class="correction-card">
                    <div style="margin-bottom: 8px;"><strong>原始错误:</strong> ${c.original_error}</div>
                    <div style="margin-bottom: 8px;"><strong>修正标注:</strong> ${c.correction_label}</div>
                    <div style="margin-bottom: 8px;"><strong>处理理由:</strong> ${c.reason}</div>
                    <div style="font-size: 12px; color: #999;">${new Date(c.created_at).toLocaleString('zh-CN')}</div>
                </div>
            `).join('') : '<p style="color: #666; padding: 20px;">暂无修正记录</p>';
            document.getElementById('corrections-list').innerHTML = html;
        }

        function renderEvalCard(e) {
            let cls = 'eval-correct', badge = 'badge-correct', text = '正确';
            if (e.status === 'needs_review') { cls = 'eval-review'; badge = 'badge-review'; text = '待审核'; }
            else if (e.status === 'human_labeled') { cls = 'eval-labeled'; badge = 'badge-labeled'; text = '已标注'; }
            return `
                <div class="eval-card ${cls}">
                    <div class="eval-header">
                        <span class="eval-badge ${badge}">${text}</span>
                        <span class="latency">${e.latency_ms}ms</span>
                    </div>
                    <div><strong>输入:</strong> ${e.input.substring(0, 50)}...</div>
                </div>
            `;
        }

        async function submitLabel(evalId) {
            const label = document.getElementById(`label-${evalId}`).value;
            const reason = document.getElementById(`reason-${evalId}`).value;
            if (!label || !reason) { alert('请填写完整'); return; }
            await api(`/evaluations/${evalId}/label`, {
                method: 'POST',
                body: JSON.stringify({ label, reason })
            });
            showSuccess('人工标注提交成功');
            loadData();
        }

        async function runEvaluation() {
            const modelId = document.getElementById('eval-model').value;
            const sampleId = document.getElementById('eval-sample').value;
            await api('/evaluate', {
                method: 'POST',
                body: JSON.stringify({ model_id: modelId, sample_id: sampleId })
            });
            showSuccess('评测完成');
            loadData();
        }

        async function testBlocked() {
            const evals = await api('/evaluations');
            const completed = evals.find(e => e.status === 'completed');
            if (!completed) {
                showError('请先执行一些评测（需要有已完成的评测）');
                return;
            }
            try {
                await api(`/evaluations/${completed.id}/label`, {
                    method: 'POST',
                    body: JSON.stringify({ label: 'test', reason: 'test', blocked: true })
                });
            } catch (e) {
            }
        }

        async function initData() {
            await api('/init', { method: 'POST' });
            showSuccess('数据初始化完成');
            loadData();
        }

        document.getElementById('model-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await api('/models', {
                method: 'POST',
                body: JSON.stringify({
                    name: document.getElementById('model-name').value,
                    version: document.getElementById('model-version').value,
                    description: document.getElementById('model-desc').value
                })
            });
            showSuccess('模型添加成功');
            e.target.reset();
            loadData();
        });

        document.getElementById('sample-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await api('/test-samples', {
                method: 'POST',
                body: JSON.stringify({
                    input: document.getElementById('sample-input').value,
                    expected_output: document.getElementById('sample-output').value,
                    category: document.getElementById('sample-category').value
                })
            });
            showSuccess('样本添加成功');
            e.target.reset();
            loadData();
        });

        loadData();
    </script>
</body>
</html>
