[tool.poetry]
name = "cold-chain-inspector"
version = "1.0.0"
description = "冷链中转多源导入巡检 CLI 工具"
authors = ["Cold Chain Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.7"
sqlalchemy = "^2.0.23"
pandas = "^2.1.4"
python-dotenv = "^1.0.0"
rich = "^13.7.0"
questionary = "^2.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
cci = "cold_chain_inspector.cli:main"
