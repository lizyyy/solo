[project]
name = "interview-archiver"
version = "0.1.0"
description = "企业访谈纪要归档 CLI 工具"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
interview-archiver = "interview_archiver.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["interview_archiver"]
