<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>矿山巷道避险演练工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        .panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        .status-safe { color: #10b981; }
        .status-warning { color: #f59e0b; }
        .status-danger { color: #ef4444; }
        .node-blocked {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
        }
        .node-safe {
            background: #d1fae5;
            border-left: 4px solid #10b981;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="app" class="h-screen flex flex-col">
        <!-- 顶部导航栏 -->
        <header class="bg-gray-800 text-white p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">矿山巷道避险演练工具</h1>
            <div class="flex space-x-4">
                <button id="btn-import" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">
                    导入数据
                </button>
                <button id="btn-save" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded">
                    保存状态
                </button>
                <button id="btn-export-md" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded">
                    导出演练单
                </button>
                <button id="btn-export-json" class="bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded">
                    导出JSON明细
                </button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="flex-1 flex">
            <!-- 左侧信息面板 -->
            <aside class="w-1/4 p-4 overflow-y-auto">
                <div class="panel p-4">
                    <h2 class="text-lg font-bold mb-4 border-b pb-2">数据概览</h2>
                    <div id="data-stats" class="space-y-2">
                        <p>巷道节点: <span id="stat-nodes">0</span> 个</p>
                        <p>传感器: <span id="stat-sensors">0</span> 个</p>
                        <p>当班人员: <span id="stat-people">0</span> 人</p>
                        <p>封锁节点: <span id="stat-blocked">0</span> 个</p>
                    </div>
                </div>

                <div class="panel p-4 mt-4">
                    <h2 class="text-lg font-bold mb-4 border-b pb-2">人员状态</h2>
                    <div id="people-list" class="space-y-2">
                        <p class="text-gray-500">暂无人员数据</p>
                    </div>
                </div>

                <div class="panel p-4 mt-4">
                    <h2 class="text-lg font-bold mb-4 border-b pb-2">传感器状态</h2>
                    <div id="sensor-list" class="space-y-2">
                        <p class="text-gray-500">暂无传感器数据</p>
                    </div>
                </div>
            </aside>

            <!-- 中间3D视图 -->
            <section class="flex-1 relative">
                <div id="canvas-container" class="w-full h-full"></div>
                <div class="absolute top-4 right-4 bg-white p-3 rounded shadow-md">
                    <h3 class="font-bold mb-2">图例</h3>
                    <div class="space-y-1 text-sm">
                        <div class="flex items-center">
                            <span class="inline-block w-4 h-4 bg-blue-500 mr-2"></span>
                            <span>正常节点</span>
                        </div>
                        <div class="flex items-center">
                            <span class="inline-block w-4 h-4 bg-red-500 mr-2"></span>
                            <span>封锁节点</span>
                        </div>
                        <div class="flex items-center">
                            <span class="inline-block w-4 h-4 bg-green-500 mr-2"></span>
                            <span>避难硐室</span>
                        </div>
                        <div class="flex items-center">
                            <span class="inline-block w-4 h-4 bg-yellow-500 mr-2"></span>
                            <span>人员位置</span>
                        </div>
                        <div class="flex items-center">
                            <span class="inline-block w-0.5 h-4 bg-blue-300 mr-3.5"></span>
                            <span>巷道连接</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 右侧详情面板 -->
            <aside class="w-1/4 p-4 overflow-y-auto">
                <div class="panel p-4">
                    <h2 class="text-lg font-bold mb-4 border-b pb-2">节点详情</h2>
                    <div id="node-details">
                        <p class="text-gray-500">点击3D视图中的节点查看详情</p>
                    </div>
                </div>

                <div class="panel p-4 mt-4">
                    <h2 class="text-lg font-bold mb-4 border-b pb-2">撤离路线</h2>
                    <div id="evacuation-routes">
                        <p class="text-gray-500">暂无撤离路线数据</p>
                    </div>
                </div>

                <div class="panel p-4 mt-4">
                    <h2 class="text-lg font-bold mb-4 border-b pb-2">人工改判</h2>
                    <div id="override-panel">
                        <p class="text-gray-500">选择节点或人员进行改判</p>
                    </div>
                </div>

                <div class="panel p-4 mt-4">
                    <h2 class="text-lg font-bold mb-4 border-b pb-2">备注</h2>
                    <div class="space-y-2">
                        <textarea id="notes-textarea" class="w-full p-2 border rounded" rows="4" placeholder="输入备注信息..."></textarea>
                        <button id="btn-save-notes" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded">
                            保存备注
                        </button>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- 导入数据模态框 -->
    <div id="import-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 w-2/3 max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold mb-4">导入数据</h2>
            
            <div class="space-y-6">
                <!-- 巷道节点 -->
                <div>
                    <h3 class="font-bold mb-2">1. 巷道节点数据 (JSON)</h3>
                    <textarea id="import-nodes" class="w-full p-2 border rounded" rows="4" placeholder='[{"id": "N1", "name": "入口", "x": 0, "y": 0, "z": 0, "type": "normal"}, {"id": "N2", "name": "避难硐室", "x": 100, "y": 0, "z": 0, "type": "shelter"}]'></textarea>
                    <button id="btn-load-nodes" class="mt-2 bg-blue-500 hover:bg-blue-600 text-white px-4 py-1 rounded">
                        加载示例数据
                    </button>
                </div>

                <!-- 巷道连接 -->
                <div>
                    <h3 class="font-bold mb-2">2. 巷道连接数据 (JSON)</h3>
                    <textarea id="import-connections" class="w-full p-2 border rounded" rows="3" placeholder='[{"from": "N1", "to": "N2", "length": 100}]'></textarea>
                    <button id="btn-load-connections" class="mt-2 bg-blue-500 hover:bg-blue-600 text-white px-4 py-1 rounded">
                        加载示例数据
                    </button>
                </div>

                <!-- 传感器数据 -->
                <div>
                    <h3 class="font-bold mb-2">3. 传感器数据 (JSON)</h3>
                    <textarea id="import-sensors" class="w-full p-2 border rounded" rows="4" placeholder='[{"id": "S1", "nodeId": "N1", "type": "gas", "value": 0.01, "unit": "%CH4", "status": "safe"}, {"id": "S2", "nodeId": "N2", "type": "co", "value": 15, "unit": "ppm", "status": "safe"}]'></textarea>
                    <button id="btn-load-sensors" class="mt-2 bg-blue-500 hover:bg-blue-600 text-white px-4 py-1 rounded">
                        加载示例数据
                    </button>
                </div>

                <!-- 人员定位 -->
                <div>
                    <h3 class="font-bold mb-2">4. 当班人员定位 (JSON)</h3>
                    <textarea id="import-people" class="w-full p-2 border rounded" rows="4" placeholder='[{"id": "P1", "name": "张三", "nodeId": "N1", "role": "矿工"}, {"id": "P2", "name": "李四", "nodeId": "N2", "role": "安全员"}]'></textarea>
                    <button id="btn-load-people" class="mt-2 bg-blue-500 hover:bg-blue-600 text-white px-4 py-1 rounded">
                        加载示例数据
                    </button>
                </div>

                <!-- 爆破检修计划 -->
                <div>
                    <h3 class="font-bold mb-2">5. 爆破检修计划 (JSON)</h3>
                    <textarea id="import-blasting" class="w-full p-2 border rounded" rows="4" placeholder='[{"id": "B1", "name": "东翼工作面爆破", "nodeIds": ["N1"], "startTime": "2026-05-05T14:00:00", "endTime": "2026-05-05T16:00:00", "status": "active"}]'></textarea>
                    <button id="btn-load-blasting" class="mt-2 bg-blue-500 hover:bg-blue-600 text-white px-4 py-1 rounded">
                        加载示例数据
                    </button>
                </div>
            </div>

            <div class="flex justify-end space-x-4 mt-6">
                <button id="btn-cancel-import" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded">
                    取消
                </button>
                <button id="btn-confirm-import" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded">
                    确认导入
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
