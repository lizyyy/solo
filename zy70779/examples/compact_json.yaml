interactions:
  - request:
      method: POST
      uri: https://api.example.com/login
      headers:
        Content-Type:
          - application/json
      body:
        string: '{"password":"mysecret12345"}'
    response:
      status:
        code: 200
        message: OK
      headers:
        Content-Type:
          - application/json
      body:
        string: '{"secret":"thisisalongsecretvalue","token":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"}'

  - request:
      method: GET
      uri: https://api.example.com/profile
      headers: {}
      body:
        string: ''
    response:
      status:
        code: 200
        message: OK
      headers:
        Content-Type:
          - application/json
      body:
        string: '{"password":"password1234","secret":"secret9876"}'
