{% extends "base.html" %}
{% block title %}银行网点尾箱调拨 - 导入数据{% endblock %}
{% block content %}
<h1>导入数据</h1>

<div class="card">
  <form method="post" action="/import" enctype="multipart/form-data">
    <div class="form-group">
      <label>选择CSV文件</label>
      <input type="file" name="file" accept=".csv" required>
      <p class="muted">CSV 需包含列头：transfer_date, from_branch, to_branch, amount, currency, operator, transfer_type, voucher_no, approval_email_ref</p>
    </div>

    <div class="form-group">
      <label>来源类型</label>
      <select name="source_type">
        <option value="bank_receipt">银行回单</option>
        <option value="ledger">业务台账</option>
        <option value="screenshot">截图说明</option>
        <option value="supplement">补充材料</option>
        <option value="other">其他</option>
      </select>
    </div>

    <div class="form-group">
      <label>批次名称（可选，留空自动生成）</label>
      <input type="text" name="batch_name">
    </div>

    <div class="form-group">
      <label>重复数据处理策略</label>
      <select name="dedup_strategy">
        <option value="skip">跳过（保留原值，不覆盖）</option>
        <option value="update">更新（用新值覆盖旧值）</option>
        <option value="conflict">标记冲突（摆出两边证据，等人工判断）</option>
      </select>
    </div>

    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" name="is_supplement"> 这是补充材料（补交的凭证、说明等）
      </label>
    </div>

    <div class="form-group">
      <label>补充到批次（仅补充材料时选择）</label>
      <select name="supplement_batch_id">
        <option value="">不指定</option>
        {% for b in batches %}
        <option value="{{ b.id }}">{{ b.id }} - {{ b.name }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary">开始导入</button>
  </form>
</div>
{% endblock %}
