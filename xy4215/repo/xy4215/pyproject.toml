[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inspection-package-fixer"
version = "0.1.0"
description = "巡检包断点补账员 - 地下管廊机器人巡检数据处理工具"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Underground Utility Inspection Team"}
]
keywords = ["robotics", "inspection", "data-processing", "utility-tunnels"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Engineers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "pyyaml>=6.0",
  "pandas>=1.3.0",
  "click>=8.0",
  "rich>=12.0",
]

[project.scripts]
inspection-fixer = "inspection_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inspection_cli*"]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=3.0",
  "ruff>=0.1.0",
]
