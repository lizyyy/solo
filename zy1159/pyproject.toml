[project]
name = "index-analyzer"
version = "0.1.0"
description = "MySQL/PostgreSQL Index Analysis CLI - Analyze, suggest, and simulate index optimizations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sqlparse>=0.4.0",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
index-analyzer = "index_analyzer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["index_analyzer", "index_analyzer.*"]
