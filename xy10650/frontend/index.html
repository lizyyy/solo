<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工地安全整改罚款管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
        .risk-high { background: #fee2e2; color: #dc2626; }
        .risk-medium { background: #fef3c7; color: #d97706; }
        .risk-low { background: #dbeafe; color: #2563eb; }
        .risk-extreme { background: #fecaca; color: #991b1b; font-weight: bold; }
        .log-success { border-left: 4px solid #10b981; }
        .log-blocked { border-left: 4px solid #ef4444; }
        .log-manual { border-left: 4px solid #f59e0b; }
        .log-repeat { border-left: 4px solid #6366f1; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900">工地安全整改罚款管理系统</h1>
                        <p class="text-sm text-gray-500">Construction Safety Management System</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-500">API状态:</span>
                    <span id="apiStatus" class="text-sm text-green-600">检查中...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white border-b">
        <div class="max-w-7xl mx-auto px-4">
            <nav class="flex space-x-8">
                <button onclick="switchTab('hazards')" class="tab-btn py-4 px-1 text-sm font-medium tab-active" data-tab="hazards">隐患管理</button>
                <button onclick="switchTab('fines')" class="tab-btn py-4 px-1 text-sm font-medium text-gray-500" data-tab="fines">罚款管理</button>
                <button onclick="switchTab('highRisk')" class="tab-btn py-4 px-1 text-sm font-medium text-gray-500" data-tab="highRisk">高危清单</button>
                <button onclick="switchTab('logs')" class="tab-btn py-4 px-1 text-sm font-medium text-gray-500" data-tab="logs">操作日志</button>
                <button onclick="switchTab('demo')" class="tab-btn py-4 px-1 text-sm font-medium text-gray-500" data-tab="demo">演示路径</button>
            </nav>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <div id="tab-hazards" class="tab-content">
            <div class="bg-white rounded-lg shadow p-4 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                        <select id="filterStatus" class="w-full border rounded-lg px-3 py-2">
                            <option value="">全部</option>
                            <option value="待整改">待整改</option>
                            <option value="整改中">整改中</option>
                            <option value="待复查">待复查</option>
                            <option value="已通过">已通过</option>
                            <option value="已罚款">已罚款</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">风险等级</label>
                        <select id="filterRisk" class="w-full border rounded-lg px-3 py-2">
                            <option value="">全部</option>
                            <option value="低">低</option>
                            <option value="中">中</option>
                            <option value="高">高</option>
                            <option value="极高">极高</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">责任班组</label>
                        <select id="filterTeam" class="w-full border rounded-lg px-3 py-2">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">搜索</label>
                        <input type="text" id="filterKeyword" class="w-full border rounded-lg px-3 py-2" placeholder="描述或位置...">
                    </div>
                    <div class="flex items-end space-x-2">
                        <button onclick="loadHazards()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">查询</button>
                        <button onclick="openImportModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">导入</button>
                        <button onclick="exportHazards()" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700">导出</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">隐患描述</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">位置</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">风险等级</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">责任班组</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">整改期限</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                        </tr>
                    </thead>
                    <tbody id="hazardsTable" class="divide-y divide-gray-200"></tbody>
                </table>
                <div id="hazardsPagination" class="px-4 py-3 bg-gray-50 border-t"></div>
            </div>
        </div>

        <div id="tab-fines" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">隐患描述</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">责任班组</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">罚款金额</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">罚款原因</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">复核人</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                        </tr>
                    </thead>
                    <tbody id="finesTable" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-highRisk" class="tab-content hidden">
            <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                <div class="flex items-center">
                    <svg class="w-6 h-6 text-red-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <span class="text-red-800 font-medium">高/极高风险隐患清单 - 需要立即处理</span>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-red-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-red-700 uppercase">隐患描述</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-red-700 uppercase">位置</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-red-700 uppercase">风险等级</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-red-700 uppercase">责任班组</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-red-700 uppercase">整改期限</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-red-700 uppercase">状态</th>
                        </tr>
                    </thead>
                    <tbody id="highRiskTable" class="divide-y divide-red-100"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-logs" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div id="logsList" class="divide-y"></div>
            </div>
        </div>

        <div id="tab-demo" class="tab-content hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center mb-4">
                        <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center mr-3">
                            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900">路径1: 成功流程</h3>
                            <p class="text-sm text-gray-500">正常创建隐患并提交复查</p>
                        </div>
                    </div>
                    <button onclick="runDemo('success')" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">运行演示</button>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center mb-4">
                        <div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center mr-3">
                            <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900">路径2: 拦截流程</h3>
                            <p class="text-sm text-gray-500">提交不符合规则的操作</p>
                        </div>
                    </div>
                    <button onclick="runDemo('blocked')" class="w-full bg-red-600 text-white py-2 rounded-lg hover:bg-red-700">运行演示</button>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center mb-4">
                        <div class="w-10 h-10 bg-yellow-100 rounded-full flex items-center justify-center mr-3">
                            <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900">路径3: 人工修正</h3>
                            <p class="text-sm text-gray-500">强制通过被拦截的操作</p>
                        </div>
                    </div>
                    <button onclick="runDemo('manual')" class="w-full bg-yellow-600 text-white py-2 rounded-lg hover:bg-yellow-700">运行演示</button>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center mb-4">
                        <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center mr-3">
                            <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900">路径4: 重复提交</h3>
                            <p class="text-sm text-gray-500">幂等性校验演示</p>
                        </div>
                    </div>
                    <button onclick="runDemo('repeat')" class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700">运行演示</button>
                </div>
            </div>

            <div id="demoResult" class="mt-6 bg-white rounded-lg shadow p-6 hidden">
                <h3 class="font-bold text-gray-900 mb-4">执行结果</h3>
                <div id="demoOutput" class="bg-gray-900 text-green-400 p-4 rounded-lg font-mono text-sm whitespace-pre-wrap"></div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white rounded-lg max-w-3xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold text-gray-900">隐患详情</h3>
                    <button onclick="closeModal('detailModal')" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="detailContent" class="p-6"></div>
        </div>
    </div>

    <div id="importModal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white rounded-lg max-w-md w-full mx-4">
            <div class="p-6 border-b">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold text-gray-900">导入隐患数据</h3>
                    <button onclick="closeModal('importModal')" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="p-6">
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center">
                    <input type="file" id="importFile" accept=".xlsx,.xls,.csv" class="hidden" onchange="handleImport()">
                    <label for="importFile" class="cursor-pointer">
                        <svg class="w-12 h-12 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <p class="text-gray-600">点击上传 Excel 或 CSV 文件</p>
                        <p class="text-sm text-gray-400 mt-2">支持列名：隐患描述、位置、风险等级、责任班组、整改期限</p>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
