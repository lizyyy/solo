[tool.poetry]
name = "port-reconciliation-service"
version = "0.1.0"
description = "港口调度对账服务 - 船期、泊位、潮汐自动比对与人工复核系统"
authors = ["Port Operations Team"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
pandas = "^2.1.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-multipart = "^0.0.6"
openpyxl = "^3.1.2"
python-dotenv = "^1.0.0"
pytz = "^2023.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.10.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
