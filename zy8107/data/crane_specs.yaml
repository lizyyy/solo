  - crane_id: crane_002
    name: 徐工集团 QY100K
    type: truck_mounted
    manufacturer: XCMG
    model: QY100K
    max_capacity: 100
    capacity_unit: tons
    
    dimensions:
      total_width: 3.0
      total_length: 15.0
      total_height: 4.0
      units: meters
    
    boom:
      type: telescopic
      min_length: 12
      max_length: 50
      units: meters
      
      load_chart:
        - boom_length: 12
          radius_data:
            - radius: 3
              capacity: 100
            - radius: 5
              capacity: 80
            - radius: 8
              capacity: 55
            - radius: 10
              capacity: 42
    
    outrigger:
      type: hydraulic
      positions:
        - name: 前左
          offset: { x: -2.5, z: 2.5 }
        - name: 前右
          offset: { x: 2.5, z: 2.5 }
        - name: 后左
          offset: { x: -2.5, z: -2.5 }
        - name: 后右
          offset: { x: 2.5, z: -2.5 }
      max_spread: 8.0
      min_ground_pressure: 150
      pressure_unit: kPa
    
    swing_radius:
      min: 0
      max: 360
      units: degrees
    
    operating_limits:
      max_wind_speed: 12
      wind_speed_unit: m/s
      max_operating_slope: 1.5
      slope_unit: degrees
    
    visualization:
      color: "#0d6efd"
      boom_color: "#444444"
      hook_color: "#ffc107"

missing_params:
  - crane_id: crane_001
    params:
      - name: 实际作业时吊臂组合方式
        severity: high
        description: 需要根据实际作业工况确定主臂+副臂组合方案
      - name: 配重配置
        severity: high
        description: 需要根据吊装重量确定配重块数量和配置

notes:
  - "本规格文件中的载荷表为示例数据，实际作业时必须使用设备出厂的官方载荷表"
  - "风速限制为参考值，实际作业时应遵循设备操作手册和现场安全规定"
  - "吊机支腿区地面承载力必须由专业工程师确认"
