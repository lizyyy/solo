<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D吊装路径碰撞预演工具</title>
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>3D吊装路径碰撞预演工具</h1>
      <div class="header-actions">
        <button id="loadSampleBtn" class="btn btn-primary">加载示例数据</button>
        <button id="exportReportBtn" class="btn btn-secondary">导出风险报告</button>
      </div>
    </header>
    
    <main class="main-container">
      <div class="scene-container" id="sceneContainer">
        <canvas id="threeCanvas"></canvas>
        <div class="scene-overlay" id="sceneOverlay"></div>
      </div>
      
      <aside class="sidebar">
        <div class="panel">
          <h3>风险列表</h3>
          <div class="risk-list" id="riskList">
            <p class="empty-message">加载数据后将显示风险信息</p>
          </div>
        </div>
        
        <div class="panel">
          <h3>数据信息</h3>
          <div class="data-info" id="dataInfo">
            <p class="empty-message">未加载数据</p>
          </div>
        </div>
        
        <div class="panel">
          <h3>操作说明</h3>
          <div class="instructions">
            <ul>
              <li>鼠标左键：旋转视角</li>
              <li>鼠标右键：平移</li>
              <li>滚轮：缩放</li>
              <li>拖动时间轴：查看吊装过程</li>
            </ul>
          </div>
        </div>
      </aside>
    </main>
    
    <footer class="timeline-container">
      <div class="timeline-header">
        <div class="timeline-info">
          <span id="currentTime">时间: 00:00</span>
          <span id="totalTime">总时长: 00:00</span>
        </div>
        <div class="timeline-controls">
          <button id="playBtn" class="btn btn-small">播放</button>
          <button id="pauseBtn" class="btn btn-small">暂停</button>
          <button id="resetBtn" class="btn btn-small">重置</button>
        </div>
      </div>
      <div class="timeline-track" id="timelineTrack">
        <input type="range" id="timelineSlider" min="0" max="100" value="0" step="0.1">
        <div class="timeline-markers" id="timelineMarkers"></div>
      </div>
    </footer>
  </div>
  
  <script type="module" src="./src/main.js"></script>
</body>
</html>
