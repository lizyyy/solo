[project]
name = "subtitle-timeline-checker"
version = "0.1.0"
description = "字幕时间轴检查和整理工具 - 用于课程剪辑师"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
subcheck = "subtitle_checker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subtitle_checker"]
