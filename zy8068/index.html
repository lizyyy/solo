<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU 着色器兼容性实验台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .status-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.9rem;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }
        .status-dot.success { background: #4ade80; }
        .status-dot.warning { background: #fbbf24; }
        .status-dot.error { background: #f87171; }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: #16213e;
            border-radius: 12px;
            padding: 16px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a3a5a;
        }
        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
        }
        select, textarea, button {
            font-family: inherit;
        }
        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #3a4a6a;
            background: #0f1629;
            color: #eee;
            cursor: pointer;
        }
        select:focus {
            outline: 2px solid #667eea;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3a4a6a;
            background: #0f1629;
            color: #a0e0ff;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
        }
        textarea:focus {
            outline: 2px solid #667eea;
        }
        button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-secondary {
            background: #3a4a6a;
            color: #eee;
        }
        .btn-success {
            background: #4ade80;
            color: #1a1a2e;
        }
        .btn-warning {
            background: #fbbf24;
            color: #1a1a2e;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        canvas {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            background: #000;
        }
        .error-box {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid #f87171;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-family: monospace;
            font-size: 13px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }
        .error-box.visible {
            display: block;
        }
        .error-line {
            color: #f87171;
            margin: 4px 0;
        }
        .capability-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .capability-item {
            background: #0f1629;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3a5a;
        }
        .capability-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 4px;
        }
        .capability-value {
            font-size: 1rem;
            font-weight: 500;
            word-break: break-all;
        }
        .timing-chart {
            height: 100px;
            background: #0f1629;
            border-radius: 8px;
            margin-top: 12px;
            position: relative;
            overflow: hidden;
        }
        .timing-canvas {
            width: 100%;
            height: 100%;
        }
        .export-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #2a3a5a;
        }
        .fallback-notice {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            display: none;
        }
        .fallback-notice.visible {
            display: block;
        }
        .fallback-notice h3 {
            color: #fbbf24;
            margin-bottom: 8px;
        }
        .trace-item {
            background: #0f1629;
            padding: 8px 12px;
            border-radius: 4px;
            margin: 4px 0;
            font-family: monospace;
            font-size: 12px;
            border-left: 3px solid #667eea;
        }
        .trace-timestamp {
            color: #888;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 WebGPU 着色器兼容性实验台</h1>
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot" id="webgpuStatus"></span>
                    <span>WebGPU</span>
                </div>
                <div class="status-item">
                    <span class="status-dot" id="webglStatus"></span>
                    <span>WebGL</span>
                </div>
                <div class="status-item">
                    <span class="status-dot" id="adapterStatus"></span>
                    <span id="adapterName">GPU 适配器</span>
                </div>
            </div>
        </header>

        <div class="fallback-notice" id="fallbackNotice">
            <h3>⚠️ 降级模式运行</h3>
            <p id="fallbackReason"></p>
        </div>

        <div class="main-grid">
            <div class="left-column">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">Shader 选择</span>
                        <select id="shaderSelect">
                            <option value="gradient">渐变着色器</option>
                            <option value="wave">波浪效果</option>
                            <option value="fractal">分形图案</option>
                            <option value="pixelate">像素化效果</option>
                            <option value="custom">自定义 Shader</option>
                        </select>
                    </div>
                    <textarea id="shaderEditor" spellcheck="false"></textarea>
                    <div class="btn-group" style="margin-top: 12px;">
                        <button class="btn-primary" id="runBtn">▶ 运行</button>
                        <button class="btn-secondary" id="resetBtn">↺ 重置</button>
                        <button class="btn-warning" id="compileCheckBtn">🔍 编译检查</button>
                    </div>
                    <div class="error-box" id="errorBox"></div>
                </div>

                <div class="panel" style="margin-top: 20px;">
                    <div class="panel-header">
                        <span class="panel-title">设备能力探针</span>
                    </div>
                    <div class="capability-grid" id="capabilityGrid"></div>
                </div>
            </div>

            <div class="right-column">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">渲染预览</span>
                        <div class="btn-group">
                            <button class="btn-success" id="exportReportBtn">📄 导出报告</button>
                            <button class="btn-secondary" id="exportTracesBtn">📋 导出追踪</button>
                        </div>
                    </div>
                    <canvas id="renderCanvas"></canvas>
                    <div class="timing-chart">
                        <canvas class="timing-canvas" id="timingCanvas"></canvas>
                    </div>
                </div>

                <div class="panel" style="margin-top: 20px;">
                    <div class="panel-header">
                        <span class="panel-title">调试追踪</span>
                        <button class="btn-secondary" id="clearTracesBtn">清空</button>
                    </div>
                    <div id="traceLog"></div>
                </div>
            </div>
        </div>

        <div class="export-section">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">导出内容预览</span>
                </div>
                <div id="exportPreview" style="font-family: monospace; font-size: 12px; white-space: pre-wrap; background: #0f1629; padding: 12px; border-radius: 8px; max-height: 200px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
