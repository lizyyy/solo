spring:
  application:
    name: oxygen-booking-api
  datasource:
    url: jdbc:h2:mem:hospital;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080

logging:
  level:
    com.hospital.oxygen: DEBUG
    org.hibernate.SQL: DEBUG
