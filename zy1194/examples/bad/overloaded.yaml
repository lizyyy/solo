# 过载配置示例（坏样例）
# 问题：任务数量远超过系统处理能力，队列容量不足
# 预期：大量任务被丢弃，背压机制触发

threadpool:
  worker_count: 2           # 过少的 Worker
  local_queue_capacity: 2   # 非常小的本地队列
  global_queue_capacity: 5  # 非常小的全局队列

queue:
  use_work_stealing: false  # 禁用工作窃取，无法平衡负载
  steal_from: random

backpressure:
  strategy: drop            # 丢弃策略 - 队列满时直接丢弃
  max_wait_time: 5.0       # 短超时

starvation:
  threshold: 10.0

simulation:
  duration: 30.0
  seed: 1

# 任务配置：30 个任务，执行时间较长
# 这样会迅速填满队列并触发背压
