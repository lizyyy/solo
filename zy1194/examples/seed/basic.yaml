# 基础线程池配置示例
# 这是一个良好配置的示例：4 个 Worker，合理的队列容量

threadpool:
  worker_count: 4
  local_queue_capacity: 10
  global_queue_capacity: 100

queue:
  use_work_stealing: true
  steal_from: random

backpressure:
  strategy: block
  max_wait_time: 60.0

starvation:
  threshold: 30.0

simulation:
  duration: 50.0
  seed: 42

# 任务配置：20 个任务，执行时间 1-5 个时间单位
tasks:
