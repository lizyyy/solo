[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-archive-validator"
version = "1.0.0"
description = "无人机航拍素材归档校验工具 - 解决外拍素材的编号一致性、GPS时间同步、航线编号匹配及云台角度对应等问题"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pillow>=9.0.0",
    "piexif>=1.1.3",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "geopy>=2.3.0",
    "rich>=12.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
aerial-validator = "aerial_archive_validator.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aerial_archive_validator*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
