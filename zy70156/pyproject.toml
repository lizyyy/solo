[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-lineage-change-api"
version = "0.1.0"
description = "Data Lineage Change API - 处理离线表字段调整后的影响分析与告警"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
    "ruff>=0.1",
]

[project.scripts]
lineage-api = "app.main:main"
