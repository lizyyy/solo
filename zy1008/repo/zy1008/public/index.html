<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动报名系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
    }

    .card-header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .card-header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .card-body {
      padding: 24px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #9ca3af;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 16px;
    }

    .event-item {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .event-item:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
    }

    .event-item.selected {
      border-color: #667eea;
      background: #f5f3ff;
    }

    .event-title {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .event-info {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 14px;
      color: #6b7280;
    }

    .event-info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .event-info-item svg {
      width: 16px;
      height: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      transition: border-color 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-select {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    .form-select:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
      margin-top: 12px;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .alert {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .alert svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .alert-error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    .alert-warning {
      background: #fffbeb;
      color: #d97706;
      border: 1px solid #fde68a;
    }

    .loading {
      text-align: center;
      padding: 48px;
      color: #9ca3af;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .success-card {
      text-align: center;
      padding: 24px;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background: #f0fdf4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .success-icon svg {
      width: 32px;
      height: 32px;
      color: #16a34a;
    }

    .waitlist-icon {
      background: #fffbeb;
    }

    .waitlist-icon svg {
      color: #d97706;
    }

    .success-title {
      font-size: 20px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .success-message {
      color: #6b7280;
      margin-bottom: 24px;
    }

    .session-badge {
      display: inline-block;
      padding: 4px 12px;
      background: #e5e7eb;
      border-radius: 20px;
      font-size: 12px;
      color: #374151;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h1>活动报名</h1>
        <p>选择活动并填写信息报名</p>
      </div>
      <div class="card-body">
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>

        <div id="empty-state" class="empty-state hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <p>暂无活动可报名</p>
        </div>

        <div id="event-list" class="hidden"></div>

        <div id="registration-form" class="hidden">
          <div id="selected-event-info"></div>
          
          <div id="alert-container"></div>

          <div class="form-group">
            <label class="form-label" for="name">姓名 *</label>
            <input type="text" id="name" class="form-input" placeholder="请输入您的姓名" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">手机号后四位 *</label>
            <input type="text" id="phone" class="form-input" placeholder="请输入手机号后四位" maxlength="4" required>
          </div>

          <div class="form-group" id="session-group">
            <label class="form-label">选择场次</label>
            <div id="session-options"></div>
          </div>

          <button id="submit-btn" class="btn btn-primary">提交报名</button>
          <button id="back-btn" class="btn btn-secondary">返回选择活动</button>
        </div>

        <div id="success-page" class="hidden"></div>
      </div>
    </div>
  </div>

  <script>
    let events = [];
    let selectedEvent = null;
    let selectedSession = null;

    const API_BASE = '';

    async function fetchEvents() {
      try {
        const response = await fetch(`${API_BASE}/api/events`);
        events = await response.json();
        renderEventList();
      } catch (error) {
        showAlert('加载活动失败，请刷新页面重试', 'error');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function renderEventList() {
      const eventList = document.getElementById('event-list');
      const emptyState = document.getElementById('empty-state');

      if (events.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      let html = '';
      events.forEach(event => {
        const sessions = event.sessions ? JSON.parse(event.sessions) : null;
        html += `
          <div class="event-item" data-id="${event.id}">
            <div class="event-title">${escapeHtml(event.title)}</div>
            <div class="event-info">
              <div class="event-info-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                ${formatDateTime(event.date_time)}
              </div>
              <div class="event-info-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                ${event.total_slots} 个名额
              </div>
            </div>
            ${sessions ? `<div class="session-badge">可选 ${sessions.length} 场</div>` : ''}
          </div>
        `;
      });

      eventList.innerHTML = html;
      eventList.classList.remove('hidden');

      document.querySelectorAll('.event-item').forEach(item => {
        item.addEventListener('click', () => selectEvent(parseInt(item.dataset.id)));
      });
    }

    function selectEvent(eventId) {
      selectedEvent = events.find(e => e.id === eventId);
      selectedSession = null;
      renderRegistrationForm();
    }

    function renderRegistrationForm() {
      document.getElementById('event-list').classList.add('hidden');
      document.getElementById('registration-form').classList.remove('hidden');
      document.getElementById('success-page').classList.add('hidden');
      clearAlerts();

      const sessions = selectedEvent.sessions ? JSON.parse(selectedEvent.sessions) : null;
      
      let eventInfoHtml = `
        <div class="event-item selected">
          <div class="event-title">${escapeHtml(selectedEvent.title)}</div>
          <div class="event-info">
            <div class="event-info-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              ${formatDateTime(selectedEvent.date_time)}
            </div>
            <div class="event-info-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              ${selectedEvent.total_slots} 个名额
            </div>
          </div>
        </div>
      `;
      document.getElementById('selected-event-info').innerHTML = eventInfoHtml;

      const sessionGroup = document.getElementById('session-group');
      const sessionOptions = document.getElementById('session-options');

      if (sessions && sessions.length > 0) {
        sessionGroup.classList.remove('hidden');
        let sessionHtml = '';
        sessions.forEach((session, index) => {
          sessionHtml += `
            <label class="event-item" style="margin-bottom: 8px; display: block;">
              <input type="radio" name="session" value="${escapeHtml(session)}" ${index === 0 ? 'checked' : ''} style="margin-right: 8px;">
              ${escapeHtml(session)}
            </label>
          `;
        });
        sessionOptions.innerHTML = sessionHtml;
        selectedSession = sessions[0];

        document.querySelectorAll('input[name="session"]').forEach(radio => {
          radio.addEventListener('change', (e) => {
            selectedSession = e.target.value;
            document.querySelectorAll('input[name="session"]').forEach(r => {
              r.closest('.event-item').classList.remove('selected');
            });
            e.target.closest('.event-item').classList.add('selected');
          });
        });

        document.querySelector('input[name="session"]:checked').closest('.event-item').classList.add('selected');
      } else {
        sessionGroup.classList.add('hidden');
      }

      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
    }

    async function submitRegistration() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!name) {
        showAlert('请输入姓名', 'error');
        return;
      }

      if (!phone || phone.length !== 4 || !/^\d{4}$/.test(phone)) {
        showAlert('请输入正确的手机号后四位（4位数字）', 'error');
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';
      clearAlerts();

      try {
        const response = await fetch(`${API_BASE}/api/events/${selectedEvent.id}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            phone_last4: phone,
            session: selectedSession
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || '报名失败');
        }

        renderSuccessPage(result);
      } catch (error) {
        showAlert(error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交报名';
      }
    }

    function renderSuccessPage(result) {
      document.getElementById('registration-form').classList.add('hidden');
      const successPage = document.getElementById('success-page');
      successPage.classList.remove('hidden');

      const isWaitlist = result.status === 'waitlist';
      const iconClass = isWaitlist ? 'waitlist-icon' : '';
      const title = isWaitlist ? '候补成功' : '报名成功';
      let message = isWaitlist 
        ? `您已进入候补队列，当前排在第 ${result.position} 位。如有名额空出，将按顺序递补。`
        : '您已成功报名活动，请准时参加！';

      successPage.innerHTML = `
        <div class="success-card">
          <div class="success-icon ${iconClass}">
            ${isWaitlist ? `
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            ` : `
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            `}
          </div>
          <h2 class="success-title">${title}</h2>
          <p class="success-message">${escapeHtml(message)}</p>
          <button id="continue-btn" class="btn btn-primary">继续报名其他活动</button>
        </div>
      `;

      document.getElementById('continue-btn').addEventListener('click', () => {
        successPage.classList.add('hidden');
        document.getElementById('event-list').classList.remove('hidden');
      });
    }

    function showAlert(message, type) {
      const container = document.getElementById('alert-container');
      const alertClass = type === 'error' ? 'alert-error' : 
                          type === 'success' ? 'alert-success' : 'alert-warning';
      
      const icon = type === 'error' ? `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      ` : type === 'success' ? `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      ` : `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      `;

      container.innerHTML = `
        <div class="alert ${alertClass}">
          ${icon}
          <span>${escapeHtml(message)}</span>
        </div>
      `;
    }

    function clearAlerts() {
      document.getElementById('alert-container').innerHTML = '';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDateTime(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      document.getElementById('registration-form').classList.add('hidden');
      document.getElementById('event-list').classList.remove('hidden');
      selectedEvent = null;
      selectedSession = null;
      clearAlerts();
    });

    document.getElementById('submit-btn').addEventListener('click', submitRegistration);

    document.getElementById('phone').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
    });

    fetchEvents();
  </script>
</body>
</html>
