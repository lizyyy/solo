[project]
name = "raw-material-substitution-api"
version = "1.0.0"
description = "原料替代审批 API - 处理原料缺货临时替代的完整业务流程"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
substitution-cli = "cli.main:main"

[tool.setuptools]
packages = ["app", "cli"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
