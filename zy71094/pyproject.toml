[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exif-compliance-cli"
version = "1.0.0"
description = "图片 EXIF 合规清理工具 - 批量移除敏感元数据，保留归档信息"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0.0",
    "piexif>=1.1.3",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
exifclean = "exif_clean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
