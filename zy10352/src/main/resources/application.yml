server:
  port: 8080

spring:
  application:
    name: api-field-lineage-service

  datasource:
    url: jdbc:h2:file:./data/lineage-db
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.lineage: DEBUG
    org.springframework.web: INFO
