<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>铁路调车信号联锁解谜</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>铁路调车信号联锁解谜</h1>
            <div class="level-selector">
                <select id="levelSelect">
                    <option value="">选择关卡</option>
                </select>
                <button id="restartBtn">重新开始</button>
                <button id="undoBtn">撤销</button>
            </div>
        </header>

        <div class="game-container">
            <div class="info-panel">
                <div class="level-info">
                    <h3 id="levelName">关卡信息</h3>
                    <p id="levelDesc"></p>
                </div>
                <div class="stats">
                    <div class="stat">
                        <span>步数:</span>
                        <span id="moveCount">0</span>
                    </div>
                    <div class="stat">
                        <span>最佳记录:</span>
                        <span id="bestMoves">-</span>
                    </div>
                </div>
                <div class="failure-message" id="failureMessage"></div>
                <div class="success-message" id="successMessage"></div>
            </div>

            <div class="canvas-container">
                <canvas id="gameCanvas"></canvas>
            </div>

            <div class="control-panel">
                <button id="autoMoveBtn" class="primary">自动推进</button>
                <div class="train-list" id="trainList"></div>
            </div>
        </div>
    </div>

    <script src="js/levels.js"></script>
    <script src="js/state.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
