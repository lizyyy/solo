[tool.poetry]
name = "push-token-lifecycle-cli"
version = "1.0.0"
description = "推送Token生命周期排查工具"
authors = ["运营技术团队"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.7"
pandas = "^2.1.0"
openpyxl = "^3.1.2"
rich = "^13.6.0"
python-dateutil = "^2.8.2"
pydantic = "^2.5.0"
jinja2 = "^3.1.2"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
push-token-check = "push_token_cli.main:cli"
