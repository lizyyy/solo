[project]
name = "label-drift-inspector"
version = "0.1.0"
description = "标注漂移体检员 - 客服意图分类离线标注质量审计工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pandas>=1.3.0",
    "pyyaml>=5.4.0",
    "numpy>=1.20.0",
    "scikit-learn>=0.24.0",
    "tabulate>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "black>=21.0.0",
]

[project.scripts]
ldi = "label_drift_inspector.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["label_drift_inspector"]
