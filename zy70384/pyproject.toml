[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-evidence-cli"
version = "1.0.0"
description = "本地合规证据包 CLI - 管理、验证和冻结合规审计证据"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Compliance Team"}
]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
    "rich>=13.5.0",
]

[project.scripts]
cecli = "compliance_evidence.cli:main"

[tool.setuptools.packages.find]
include = ["compliance_evidence*"]
