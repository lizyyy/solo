server:
  port: 8080

spring:
  application:
    name: degrade-drill-service
  datasource:
    url: jdbc:h2:file:./data/degrade_drill;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: degrade123
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.degrade.drill: DEBUG