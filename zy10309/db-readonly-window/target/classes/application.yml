server:
  port: 8080

spring:
  application:
    name: db-readonly-window
  datasource:
    url: jdbc:h2:mem:readonlydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.example.readonlywindow: DEBUG
    org.hibernate.SQL: DEBUG
