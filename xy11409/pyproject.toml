[tool.poetry]
name = "pharmacy-expiry-tracker"
version = "0.1.0"
description = "乡镇药房近效期权限追责台账系统"
authors = ["Pharmacy Admin Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0.23"
pydantic = "^2.5.2"
pandas = "^2.1.3"
openpyxl = "^3.1.2"
click = "^8.1.7"
python-multipart = "^0.0.6"
python-jose = "^3.3.0"
passlib = "^1.7.4"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
