[project]
name = "seismic-review"
version = "0.1.0"
description = "Local Python CLI for seismic waveform review by earthquake network operators"
authors = [{name = "Seismic Review Team"}]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scipy>=1.9.0",
    "obspy>=1.3.0",
    "click>=8.1.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
seismic-review = "seismic_review.cli:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
