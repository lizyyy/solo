apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app-secret
type: Opaque
data:
  DB_PASSWORD: {{ .Values.database.password | b64enc }}
  API_KEY: {{ .Values.aws.secret_access_key | b64enc }}
stringData:
  INTERNAL_URL: "https://192.168.1.50/api"
  CONNECTION_STRING: "postgresql://admin:secretpass@10.0.1.10:5432/appdb"
