[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ropeway-maint-api"
version = "0.1.0"
description = "景区索道维保后端API服务"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pandas>=1.5.0",
    "python-dateutil>=2.8.0",
    "aiofiles>=23.0.0",
]

[project.scripts]
ropeway-api = "ropeway_maint.main:main"

[tool.setuptools.packages.find]
where = ["src"]
