[project]
name = "litigation-precheck"
version = "0.1.0"
description = "诉讼材料递交包预检器 - 法务助理本地自动化工具"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
pdf = [
    "PyPDF2>=3.0.0",
]

[project.scripts]
litcheck = "litigation_precheck.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litigation_precheck"]
