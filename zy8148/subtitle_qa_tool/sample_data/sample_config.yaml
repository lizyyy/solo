# 字幕质检配置文件
# 用于定义说话人列表、敏感词列表和质检参数

# 有效说话人列表
# 用于检查说话人缺失和无效说话人
speakers:
  - 张三
  - 李四
  - 王五
  - 赵六
  - 主持人
  - 嘉宾A
  - 嘉宾B

# 敏感词列表
# 用于检查字幕中是否包含敏感内容
sensitive_words:
  - 敏感词
  - 测试敏感词
  - 禁用词
  - 违规内容
  - 禁止词汇

# 质检参数
# 可根据实际需求调整

# 每秒最大字符数（中文通常建议 3-5 字符/秒）
# 超过此值将标记为"每秒字数过高"
max_chars_per_second: 5.0

# 最小字幕时长（秒）
# 短于此时长的字幕将标记为"字幕时长过短"
min_subtitle_duration: 0.3

# 其他可选参数（预留）
# min_gap_between_subtitles: 0.1  # 字幕间最小间隔
# max_duration_per_subtitle: 7.0   # 单字幕最大时长
