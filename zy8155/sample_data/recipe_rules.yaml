        rate_limit: null
      - name: 降温阶段
        type: cooling
        duration_min: 240
        start_temp: 1250
        end_temp: 200
        rate_limit: null
  
  fast_firing:
    max_heating_rate: 200.0
    min_holding_time: 45.0
