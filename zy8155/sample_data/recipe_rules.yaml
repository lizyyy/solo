      - name: 快速升温
        type: heating
        duration_min: 120
        start_temp: 25
        end_temp: 1280
        rate_limit: 200
      - name: 高温保温
        type: holding
        duration_min: 45
        start_temp: 1280
        end_temp: 1280
        rate_limit: null
