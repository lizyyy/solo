    phases:
      - name: 升温阶段1
        type: heating
        duration_min: 180
        start_temp: 25
        end_temp: 600
        rate_limit: 120
      - name: 升温阶段2
        type: heating
        duration_min: 120
        start_temp: 600
        end_temp: 1250
        rate_limit: 150
      - name: 保温阶段
        type: holding
        duration_min: 60
