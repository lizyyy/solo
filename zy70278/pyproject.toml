[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sanitation-fuel-analyzer"
version = "0.1.0"
description = "环卫车辆油耗异常分析CLI工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openpyxl>=3.1.0"
]

[project.scripts]
fuel-analyzer = "fuel_analyzer.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["fuel_analyzer*"]