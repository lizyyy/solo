[project]
name = "agri-credit-api"
version = "1.0.0"
description = "农资赊销回款API服务"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "pydantic==2.5.0",
    "python-multipart==0.0.6",
    "pandas==2.1.3",
    "openpyxl==3.1.2",
    "python-dateutil==2.8.2",
    "httpx==0.25.2",
]

[project.scripts]
agri-credit-api = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
