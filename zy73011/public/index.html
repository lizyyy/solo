<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐾 宠物寄养异常提醒</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#303133;line-height:1.5}
.header{background:linear-gradient(135deg,#42b883,#35495e);color:#fff;padding:16px 28px;box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.header h1{font-size:20px;display:flex;align-items:center;gap:10px}
.header .sub{font-size:12px;opacity:.85;margin-top:4px}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 64px)}
.sidebar{background:#fff;border-right:1px solid #ebeef5;padding:18px;overflow-y:auto;max-height:calc(100vh - 64px);position:sticky;top:64px}
.main{padding:20px 24px;overflow-y:auto}
.summary-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-left:4px solid #dcdfe6}
.card.urgent{border-color:#f56c6c}
.card.warning{border-color:#e6a23c}
.card.general{border-color:#909399}
.card.total{border-color:#409eff}
.card.resolved{border-color:#67c23a}
.card .num{font-size:28px;font-weight:700;margin:4px 0}
.card .label{font-size:12px;color:#909399}
.filter-bar{background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.filter-bar select,.filter-bar input{padding:7px 12px;border:1px solid #dcdfe6;border-radius:4px;font-size:13px;outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:#42b883}
.filter-bar label{font-size:13px;color:#606266;margin-right:-6px}
.btn{padding:7px 16px;border:none;border-radius:4px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.btn-primary{background:#42b883;color:#fff}
.btn-primary:hover{background:#39a573}
.btn-secondary{background:#ecf5ff;color:#409eff;border:1px solid #d9ecff}
.btn-secondary:hover{background:#d9ecff}
.btn-warn{background:#fdf6ec;color:#e6a23c;border:1px solid #faecd8}
.btn-danger{background:#fef0f0;color:#f56c6c;border:1px solid #fde2e2}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tag-urgent{background:#fef0f0;color:#f56c6c}
.tag-warning{background:#fdf6ec;color:#e6a23c}
.tag-general{background:#f4f4f5;color:#909399}
.tag-resolved{background:#f0f9eb;color:#67c23a}
.tag-pending{background:#ecf5ff;color:#409eff}
.tag-monthend{background:#fef0f0;color:#c45656;border:1px dashed #f56c6c}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
th{background:#fafafa;padding:11px 12px;text-align:left;font-size:13px;color:#606266;font-weight:600;border-bottom:1px solid #ebeef5;white-space:nowrap}
td{padding:11px 12px;font-size:13px;border-bottom:1px solid #f2f6fc;vertical-align:middle}
tr:hover{background:#fafcff}
.alert-row{cursor:pointer}
.alert-row.active{background:#ecf5ff}
.empty{text-align:center;padding:60px 20px;color:#909399;font-size:14px}
.detail-panel{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden}
.detail-header{padding:18px 22px;border-bottom:1px solid #ebeef5;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(to right,#fafcff,#fff)}
.detail-header h2{font-size:18px;color:#303133;display:flex;align-items:center;gap:10px}
.detail-header .meta{font-size:12px;color:#909399;margin-top:6px}
.detail-body{padding:20px 22px}
.section{margin-bottom:24px}
.section h3{font-size:14px;color:#303133;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #f2f6fc;display:flex;align-items:center;gap:8px}
.section h3::before{content:"";width:4px;height:14px;background:#42b883;border-radius:2px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.info-item{display:flex;font-size:13px;padding:6px 0}
.info-item .k{color:#909399;width:100px;flex-shrink:0}
.info-item .v{color:#303133;flex:1;font-weight:500}
.remark-card{background:#fafcff;border:1px solid #ebeef5;border-radius:6px;padding:12px;margin-bottom:10px;position:relative}
.remark-card.monthend{background:#fef0f0;border-color:#f56c6c;border-style:dashed}
.remark-card .head{display:flex;justify-content:space-between;font-size:11px;color:#909399;margin-bottom:6px}
.remark-card .content{font-size:13px;color:#303133;margin-bottom:6px}
.remark-card .impact{background:#fdf6ec;border-left:3px solid #e6a23c;padding:6px 10px;font-size:12px;color:#8a6513;margin-top:8px;border-radius:0 4px 4px 0}
.remark-card .link{font-size:12px;color:#409eff;margin-top:6px;padding-top:6px;border-top:1px dashed #ebeef5}
.conclusion-item{background:#f0f9eb;border-left:4px solid #67c23a;padding:8px 12px;margin-top:6px;font-size:12px;border-radius:0 4px 4px 0}
.med-table{width:100%;font-size:12px;border-collapse:collapse;margin:8px 0}
.med-table th{font-size:11px;padding:7px;background:#f4f4f5}
.med-table td{padding:7px;border-bottom:1px solid #f2f6fc}
.med-chg{background:#ecf5ff;border-radius:6px;padding:8px 12px;margin-top:6px;font-size:12px;color:#3a6fd6;display:flex;align-items:center;gap:6px}
.med-chg .arrow{font-size:16px;font-weight:700}
.history-timeline{padding-left:18px;position:relative}
.history-timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#ebeef5}
.hist-item{position:relative;padding-bottom:14px}
.hist-item::before{content:"";position:absolute;left:-15px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #42b883;z-index:1}
.hist-item .act{font-size:13px;font-weight:600;color:#303133}
.hist-item .t{font-size:11px;color:#909399;margin-left:6px}
.hist-item .chg{display:grid;grid-template-columns:1fr 20px 1fr;gap:8px;margin-top:4px;font-size:12px}
.hist-item .bf{background:#fef0f0;padding:4px 8px;border-radius:4px;color:#c45656}
.hist-item .af{background:#f0f9eb;padding:4px 8px;border-radius:4px;color:#5a9e31}
.hist-item .arr{text-align:center;color:#909399;font-weight:700}
.drivers{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.driver-item{background:#f4f4f5;border-radius:6px;padding:10px 14px;flex:1;min-width:160px;font-size:12px;position:relative}
.driver-item .name{color:#606266;font-weight:600;margin-bottom:4px}
.driver-item .bar{height:8px;background:#ebeef5;border-radius:4px;overflow:hidden;margin:4px 0}
.driver-item .fill{height:100%;background:linear-gradient(90deg,#42b883,#409eff);border-radius:4px}
.driver-item .impact{color:#42b883;font-weight:700;font-size:14px}
.driver-item .desc{color:#909399;font-size:11px;margin-top:2px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:8px;max-width:520px;width:100%;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{padding:16px 20px;border-bottom:1px solid #ebeef5;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 20px;border-top:1px solid #ebeef5;display:flex;justify-content:flex-end;gap:10px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;color:#606266;margin-bottom:6px;font-weight:500}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 12px;border:1px solid #dcdfe6;border-radius:4px;font-size:13px;outline:none;font-family:inherit}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#42b883}
.form-row textarea{resize:vertical;min-height:72px}
.form-row .hint{font-size:11px;color:#909399;margin-top:4px}
.form-row .check{display:flex;align-items:center;gap:8px;font-size:12px;color:#e6a23c;margin-top:4px}
.guide-box{background:linear-gradient(135deg,#ecf5ff,#f0f9eb);border-radius:8px;padding:16px;margin-bottom:16px;font-size:13px;color:#606266;border:1px dashed #42b883}
.guide-box h4{color:#35495e;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.guide-paths{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.guide-p{background:#fff;padding:10px 12px;border-radius:6px;border-left:3px solid #409eff}
.guide-p.exit{border-left-color:#f56c6c}
.guide-p h5{font-size:12px;color:#35495e;margin-bottom:4px}
.guide-p ol{padding-left:18px;font-size:11px;color:#606266}
.guide-p ol li{margin-bottom:2px}
.by-type-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.by-type-item{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 10px;background:#f4f4f5;border-radius:4px}
.by-type-item .bar{flex:1;max-width:100px;height:6px;background:#ebeef5;border-radius:3px;margin:0 10px;overflow:hidden}
.by-type-item .f{height:100%;background:#42b883;border-radius:3px}
.breadcrumb{font-size:12px;color:#909399;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.breadcrumb a{color:#409eff;cursor:pointer;text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.close-x{cursor:pointer;font-size:20px;color:#909399;line-height:1;padding:0 4px}
.close-x:hover{color:#f56c6c}
.flex-spacer{flex:1}
.col-actions{display:flex;gap:6px}
.muted{color:#909399;font-size:11px}
.tab-bar{display:flex;gap:0;border-bottom:2px solid #ebeef5;margin-bottom:16px}
.tab{padding:10px 18px;cursor:pointer;font-size:13px;color:#606266;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:#42b883;border-bottom-color:#42b883;font-weight:600}
.operator-info{font-size:12px;color:#fff;opacity:.9;display:flex;align-items:center;gap:6px}
.operator-info input{padding:3px 8px;border-radius:4px;border:none;font-size:12px;outline:none;width:90px;color:#35495e;background:rgba(255,255,255,.95)}
.hdr-row{display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div class="header">
  <div class="hdr-row">
    <div>
      <h1>🐾 宠物寄养异常提醒</h1>
      <div class="sub">微信备注 ↔ 回访结论 · 用药变更全留痕 · 月底封账可追溯</div>
    </div>
    <div class="operator-info">
      <span>👩‍⚕️ 操作人：</span>
      <input id="opInput" value="阿宁" oninput="state.operator=this.value">
    </div>
  </div>
</div>
<div class="layout">
  <aside class="sidebar">
    <div style="margin-bottom:16px">
      <div class="card" style="border-color:#42b883">
        <div class="label">筛选后未解决</div>
        <div class="num" id="sbUnresolved" style="color:#42b883">-</div>
      </div>
    </div>
    <div class="section" style="margin-bottom:14px">
      <h3 style="border:none;padding:0;margin-bottom:10px;font-size:14px;color:#606266">按异常类型分布</h3>
      <div class="by-type-list" id="byTypeList"><div class="muted">加载中...</div></div>
    </div>
    <div class="section">
      <h3 style="border:none;padding:0;margin-bottom:10px;font-size:14px;color:#606266">按房间分布（未解决）</h3>
      <div class="by-type-list" id="byRoomList"><div class="muted">加载中...</div></div>
    </div>
    <div style="margin-top:18px">
      <div class="guide-box">
        <h4>🧭 新人快速上手</h4>
        <div class="guide-paths">
          <div class="guide-p">
            <h5>🟢 材料入口</h5>
            <ol>
              <li>寄养登记录主人微信</li>
              <li>日常巡检触发规则</li>
              <li>微信聊天→记备注</li>
              <li>兽医处方→录用药</li>
            </ol>
          </div>
          <div class="guide-p exit">
            <h5>🔴 异常出口</h5>
            <ol>
              <li>点异常行看详情</li>
              <li>补微信备注+判断影响</li>
              <li>处理/解决+写回访结论</li>
              <li>剂量改→新增用药记录</li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main" id="mainArea"></main>
</div>

<div id="modalRoot"></div>

<script>
const state = {
  tab: 'list',
  alerts: [],
  filtered: [],
  summary: null,
  types: { levels: [], statuses: [], types: [] },
  filter: { level: '全部', resolved: '全部', type: '全部' },
  detail: null,
  detailId: null,
  operator: '阿宁'
};

const $ = s => document.querySelector(s);

async function loadAll() {
  state.types = await (await fetch('/api/types')).json();
  state.summary = await (await fetch('/api/alerts/summary')).json();
  await loadAlerts();
  renderSidebar();
  renderMain();
}

async function loadAlerts() {
  const q = new URLSearchParams(state.filter).toString();
  state.alerts = await (await fetch(`/api/alerts?${q}`)).json();
  state.filtered = [...state.alerts];
}

function renderSidebar() {
  const s = state.summary;
  const unr = state.filtered.filter(a => !a.is_resolved).length;
  $('#sbUnresolved').textContent = unr;

  const typeMap = {};
  state.filtered.forEach(a => {
    if (!typeMap[a.alert_type]) typeMap[a.alert_type] = { total: 0, unr: 0 };
    typeMap[a.alert_type].total++;
    if (!a.is_resolved) typeMap[a.alert_type].unr++;
  });
  const maxT = Math.max(1, ...Object.values(typeMap).map(x => x.total));
  const tl = Object.keys(typeMap).length ? Object.keys(typeMap).map(k => {
    const r = typeMap[k];
    return `<div class="by-type-item"><span>${k}</span>
      <div class="bar"><div class="f" style="width:${r.total / maxT * 100}%"></div></div>
      <span class="muted">${r.unr}/${r.total}</span></div>`;
  }).join('') : '<div class="muted">暂无</div>';
  $('#byTypeList').innerHTML = tl;

  const roomMap = {};
  state.filtered.filter(a => !a.is_resolved).forEach(a => {
    if (!roomMap[a.room_no]) roomMap[a.room_no] = 0;
    roomMap[a.room_no]++;
  });
  const maxR = Math.max(1, ...Object.values(roomMap));
  const rl = Object.keys(roomMap).length ? Object.keys(roomMap).sort((a, b) => roomMap[b] - roomMap[a]).slice(0, 6).map(k =>
    `<div class="by-type-item"><span>房间 ${k}</span>
      <div class="bar"><div class="f" style="width:${roomMap[k] / maxR * 100}%;background:#f56c6c"></div></div>
      <span style="color:#f56c6c;font-weight:600">${roomMap[k]}</span></div>`
  ).join('') : '<div class="muted">暂无未解决</div>';
  $('#byRoomList').innerHTML = rl;
}

function levelTag(l) {
  const m = { '紧急': 'tag-urgent', '警告': 'tag-warning', '一般': 'tag-general' };
  return `<span class="tag ${m[l] || ''}">${l}</span>`;
}
function statusTag(r) {
  return r ? `<span class="tag tag-resolved">已解决</span>` : `<span class="tag tag-pending">未解决</span>`;
}

function renderMain() {
  const s = state.summary;
  const filt = state.filtered;
  const unresolved = filt.filter(a => !a.is_resolved).length;
  const urgent = filt.filter(a => a.alert_level === '紧急').length;
  const warning = filt.filter(a => a.alert_level === '警告').length;
  const general = filt.filter(a => a.alert_level === '一般').length;
  const resolved = filt.filter(a => a.is_resolved).length;

  if (state.tab === 'list') {
    $('#mainArea').innerHTML = `
      <div class="summary-cards">
        <div class="card total"><div class="label">筛选总数</div><div class="num" style="color:#409eff">${filt.length}</div><div class="muted">与导出文件一致</div></div>
        <div class="card urgent"><div class="label">紧急</div><div class="num" style="color:#f56c6c">${urgent}</div><div class="muted">未解决</div></div>
        <div class="card warning"><div class="label">警告</div><div class="num" style="color:#e6a23c">${warning}</div><div class="muted">未解决</div></div>
        <div class="card general"><div class="label">一般</div><div class="num" style="color:#909399">${general}</div><div class="muted">未解决</div></div>
        <div class="card resolved"><div class="label">已解决</div><div class="num" style="color:#67c23a">${resolved}</div><div class="muted">共 ${filt.length - unresolved} 条</div></div>
      </div>

      <div class="filter-bar">
        <label>等级</label>
        <select onchange="state.filter.level=this.value;loadAlerts().then(renderAll)">
          ${state.types.levels.map(l => `<option ${l === state.filter.level ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        <label>状态</label>
        <select onchange="state.filter.resolved=this.value;loadAlerts().then(renderAll)">
          ${state.types.statuses.map(l => `<option ${l === state.filter.resolved ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        <label>类型</label>
        <select onchange="state.filter.type=this.value;loadAlerts().then(renderAll)">
          ${state.types.types.map(l => `<option ${l === state.filter.type ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        <div class="flex-spacer"></div>
        <span class="muted">📌 数字与导出报告完全同步</span>
        <button class="btn btn-primary" onclick="exportMarkdown()">⬇️ 导出Markdown报告</button>
      </div>

      ${filt.length === 0 ? `<div class="empty" style="background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)">🗂️ 暂无符合筛选条件的异常记录</div>` : `
      <table>
        <thead><tr>
          <th>#</th><th>宠物</th><th>主人/微信</th><th>房间</th>
          <th>异常类型</th><th>等级</th><th>触发值/阈值</th>
          <th>关联备注</th><th>用药变更</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody>
          ${filt.map((a, i) => `
            <tr class="alert-row ${state.detailId === a.id ? 'active' : ''}" onclick="openDetail(${a.id})">
              <td>${i + 1}</td>
              <td><b>${a.pet_name}</b> <span class="muted">${a.foster_status}</span></td>
              <td>${a.owner_name}<br><span class="muted">${a.owner_wechat || '-'}</span></td>
              <td>${a.room_no}</td>
              <td>${a.alert_type}<br><span class="muted">${a.trigger_rule || ''}</span></td>
              <td>${levelTag(a.alert_level)}</td>
              <td><b style="color:#f56c6c">${a.trigger_value || '-'}</b> / ${a.threshold || '-'}</td>
              <td>
                ${a.remarks.length ? `<b>${a.remarks.length}</b> 条${a.monthendExtra ? ' <span class="tag tag-monthend">月底补录</span>' : ''}` : '<span class="muted">—</span>'}
              </td>
              <td>${a.hasMedChange ? '<span class="tag tag-warning">有调整</span>' : '<span class="muted">无</span>'}</td>
              <td>${statusTag(a.is_resolved)}</td>
              <td class="col-actions" onclick="event.stopPropagation()">
                <button class="btn btn-secondary" style="padding:4px 10px;font-size:12px" onclick="openDetail(${a.id})">详情</button>
                ${!a.is_resolved ? `<button class="btn btn-primary" style="padding:4px 10px;font-size:12px" onclick="resolveAlert(${a.id})">解决</button>` : ''}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="muted" style="margin-top:10px;text-align:right">共 ${filt.length} 条 · 筛选口径：${Object.entries(state.filter).filter(([, v]) => v !== '全部').map(([k, v]) => ({level:'等级',resolved:'状态',type:'类型'}[k]) + '=' + v).join('、') || '无'} · 导出时会原样写入报告</div>
      `}
    `;
  } else if (state.tab === 'detail' && state.detail) {
    renderDetail();
  }
}

function renderDetail() {
  const d = state.detail;
  const totalImpact = d.drivers.reduce((s, x) => s + Math.max(0, x.impact), 0);
  $('#mainArea').innerHTML = `
    <div class="breadcrumb">
      <a onclick="backToList()">← 返回异常列表</a> / <span>异常 #${d.id} 详情</span>
    </div>
    <div class="detail-panel">
      <div class="detail-header">
        <div>
          <h2>${levelTag(d.alert_level)} ${d.pet_name} <span class="muted" style="font-size:14px;font-weight:400">（${d.pet_type || '未标品种'}）</span> · ${d.alert_type}</h2>
          <div class="meta">房间 ${d.room_no} · 入住 ${d.checkin_date} · 主人 ${d.owner_name}  <b style="color:#42b883">微信 ${d.owner_wechat || '未登记'}</b> · 创建于 ${d.created_at}</div>
          <div class="meta" style="margin-top:4px">规则：<code style="background:#f4f4f5;padding:1px 6px;border-radius:3px">${d.trigger_rule || '无规则记录'}</code>  当前 <b style="color:#f56c6c">${d.trigger_value || '-'}</b> / 阈值 ${d.threshold || '-'}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:360px">
          ${d.is_resolved ? `<span class="tag tag-resolved">已解决 · ${d.resolved_by} · ${d.resolved_at}</span>` : `<span class="tag tag-pending">未解决</span>`}
          <button class="btn btn-secondary" onclick="addRemarkModal()">💬 +微信备注</button>
          <button class="btn btn-warn" onclick="addMedModal()">💊 +用药记录</button>
          ${!d.is_resolved ? `<button class="btn btn-primary" onclick="resolveAlert(${d.id})">✓ 标记解决</button>` : ''}
          <button class="btn btn-secondary" onclick="exportMarkdown()">⬇️ 导出报告</button>
        </div>
      </div>
      <div class="detail-body">

        <div class="section">
          <h3>📊 汇总拉动因素（点击明细即可看到 — 哪里拉动了结果）</h3>
          <div style="background:#fafcff;border:1px solid #ebeef5;border-radius:6px;padding:12px 16px">
            <div class="muted" style="margin-bottom:8px">此异常对汇总指标的贡献拆解（运营主管下钻查看）：</div>
            <div class="drivers">
              ${d.drivers.map(dr => `
                <div class="driver-item">
                  <div class="name">${dr.factor}</div>
                  <div class="bar"><div class="fill" style="width:${dr.impactPct}%;${dr.impact < 0 ? 'background:linear-gradient(90deg,#f56c6c,#e6a23c)' : ''}"></div></div>
                  <div><span class="impact" style="${dr.impact < 0 ? 'color:#f56c6c' : ''}">${dr.impact > 0 ? '+' : ''}${dr.impact} 分</span> <span class="muted">（${dr.impactPct}%）</span></div>
                  <div class="desc">${dr.desc}</div>
                </div>
              `).join('')}
            </div>
            <div class="muted" style="margin-top:10px">📌 总影响分：<b>${d.drivers.reduce((s, x) => s + x.impact, 0)}</b> 分 · 拉动因素会原样写入导出报告</div>
          </div>
        </div>

        <div class="section">
          <h3>💬 主人微信备注 ↔ 回访结论（关联留痕，不怕没人接着查）</h3>
          ${d.remarks.length === 0 ? `<div class="muted" style="background:#fafafa;padding:14px;border-radius:6px">⚠️ 暂无微信备注。请阿宁及时将主人微信中的关键信息记录下来，并关联回访结论。</div>` : ''}
          ${d.remarks.map(r => `
            <div class="remark-card ${r.is_monthend_extra ? 'monthend' : ''}">
              <div class="head">
                <span><b style="color:#42b883">${r.operator}</b> · ${r.remark_type}${r.is_monthend_extra ? ' <span class="tag tag-monthend">月底临时补录</span>' : ''}</span>
                <span>${r.created_at}</span>
              </div>
              <div class="content">💬 <b>${r.content}</b></div>
              ${r.impact_judgments ? `<div class="impact">📌 <b>月底临时备注 — 判断影响说明：</b>${r.impact_judgments}</div>` : ''}
              <div class="link">
                🔗 关联回访结论：
                ${d.conclusions.filter(c => c.wechat_remark_id === r.id).map(c => `
                  <div class="conclusion-item">
                    <b>【${c.conclusion_type}】</b> ${c.conclusion}
                    <span class="muted"> · 操作人：${c.operator} · ${c.created_at}</span>
                    ${c.next_action ? `<br>🔜 下一步：${c.next_action}` : ''}
                  </div>
                `).join('') || '<span class="muted"> 尚未关联回访结论 — <button class="btn btn-secondary" style="padding:2px 8px;font-size:11px" onclick="addConclusionModal(' + r.id + ')">+ 关联回访结论</button></span>'}
              </div>
            </div>
          `).join('')}
          <button class="btn btn-secondary" style="margin-top:6px" onclick="addRemarkModal()">+ 新增主人微信备注</button>
          ${d.remarks.length ? `<button class="btn btn-warn" style="margin-top:6px;margin-left:6px" onclick="addConclusionModal()">+ 新增回访结论（关联到某条备注）</button>` : ''}
        </div>

        <div class="section">
          <h3>💊 用药记录（剂量改动不光在页面闪一下，详情和文件里都看得到）</h3>
          ${(() => {
            const drugs = {};
            d.medications.forEach(m => { if (!drugs[m.drug_name]) drugs[m.drug_name] = []; drugs[m.drug_name].push(m); });
            if (Object.keys(drugs).length === 0) return `<div class="muted" style="background:#fafafa;padding:14px;border-radius:6px">暂无用药记录</div>`;
            return Object.keys(drugs).map(dn => {
              const vs = drugs[dn].sort((x, y) => x.version - y.version);
              let html = `<div style="margin-bottom:14px"><b style="font-size:13px">${dn}</b> <span class="muted">共 ${vs.length} 个版本</span>`;
              html += `<table class="med-table"><thead><tr><th>版本</th><th>剂量</th><th>频次</th><th>操作人</th><th>时间</th><th>变更原因</th></tr></thead><tbody>`;
              vs.forEach(m => {
                html += `<tr><td><b>v${m.version}</b>${m.is_latest ? ' <span class="tag tag-resolved">最新</span>' : ''}</td><td style="${m.version > 1 ? 'color:#f56c6c;font-weight:600' : ''}">${m.dosage}</td><td>${m.frequency || '-'}</td><td>${m.operator}</td><td>${m.created_at}</td><td>${m.change_reason || (m.version === 1 ? '<span class="muted">初始处方</span>' : '<span style="color:#e6a23c">未说明！</span>')}</td></tr>`;
              });
              html += `</tbody></table>`;
              if (vs.length > 1) {
                for (let i = 1; i < vs.length; i++) {
                  html += `<div class="med-chg">
                    <span>🔄 v${vs[i - 1].version}→v${vs[i].version}</span>
                    <span style="color:#c45656;text-decoration:line-through">${vs[i - 1].dosage}${vs[i - 1].frequency ? ' ' + vs[i - 1].frequency : ''}</span>
                    <span class="arrow">➜</span>
                    <span style="color:#5a9e31;font-weight:600">${vs[i].dosage}${vs[i].frequency ? ' ' + vs[i].frequency : ''}</span>
                    <span class="muted" style="margin-left:auto">原因：${vs[i].change_reason || '未说明'}</span>
                  </div>`;
                }
              }
              html += `</div>`;
              return html;
            }).join('');
          })()}
          <button class="btn btn-secondary" onclick="addMedModal()">+ 新增/调整用药记录</button>
          <div class="muted" style="margin-top:6px">💡 用药剂量每次改动都需在此新增一条，系统自动记录版本、前后对比、操作人、时间 — 这些也会写入 Markdown 报告</div>
        </div>

        <div class="section">
          <h3>📜 人工确认前后变化（月底封账讲给运营主管听的依据）</h3>
          ${d.history.length === 0 ? `<div class="muted" style="background:#fafafa;padding:14px;border-radius:6px">暂无人工确认历史</div>` : `
          <div class="history-timeline">
            ${d.history.map(h => `
              <div class="hist-item">
                <div><span class="act">${h.action_type}</span><span class="t">${h.created_at} · ${h.operator}</span></div>
                ${(h.before_state && h.after_state) ? `
                <div class="chg">
                  <div class="bf">📌 前：${h.before_state}</div>
                  <div class="arr">→</div>
                  <div class="af">📌 后：${h.after_state}</div>
                </div>` : ''}
                ${h.remark ? `<div class="muted" style="margin-top:4px;font-size:12px">备注：${h.remark}</div>` : ''}
              </div>
            `).join('')}
          </div>`}
        </div>

      </div>
    </div>
  `;
}

function renderAll() {
  renderSidebar();
  renderMain();
}

async function openDetail(id) {
  state.tab = 'detail';
  state.detailId = id;
  state.detail = await (await fetch(`/api/alerts/${id}`)).json();
  renderMain();
}

function backToList() {
  state.tab = 'list';
  state.detailId = null;
  state.detail = null;
  renderMain();
}

async function resolveAlert(id) {
  const note = prompt('请输入解决说明：', '');
  if (note === null) return;
  await fetch(`/api/alerts/${id}/resolve`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ note, operator: state.operator }) });
  if (state.tab === 'detail') state.detail = await (await fetch(`/api/alerts/${id}`)).json();
  await loadAlerts();
  state.summary = await (await fetch('/api/alerts/summary')).json();
  renderAll();
}

function showModal(title, bodyHtml, footerBtns) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-mask" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><h3>${title}</h3><span class="close-x" onclick="closeModal()">×</span></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-footer">${footerBtns}</div>
    </div></div>`;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }

function addRemarkModal() {
  const d = state.detail;
  const conclOpts = d ? `<div class="form-row">
    <label>是否为月底封账临时补录？</label>
    <div class="check"><input type="checkbox" id="fld_monthend" onchange="document.getElementById('fld_impact').style.display=this.checked?'block':'none'"> <b>☑ 月底封账补录（必须写清影响了哪些判断）</b></div>
  </div>
  <div class="form-row" id="fld_impact" style="display:none">
    <label>📌 此临时备注改变了哪些判断？（必填，月底汇报用）</label>
    <textarea id="fld_impact_txt" placeholder="例：1) 异常等级下调；2) 回访结论由复诊改为居家观察"></textarea>
    <div class="hint">月底封账前补录的微信备注必须填写此字段，方便讲给运营主管听</div>
  </div>` : '';
  showModal('💬 新增主人微信备注', `
    <div class="form-row"><label>备注内容（直接粘贴主人微信原话或核心要点）</label>
      <textarea id="fld_content" placeholder="例：李女士说豆豆之前得过胰腺炎，体温高要警惕"></textarea></div>
    ${conclOpts}
  `, `<button class="btn btn-secondary" onclick="closeModal()">取消</button>
     <button class="btn btn-primary" onclick="submitRemark()">保存并关联</button>`);
}

async function submitRemark() {
  const d = state.detail;
  const content = $('#fld_content').value.trim();
  if (!content) return alert('请填写备注内容');
  const monthend = $('#fld_monthend')?.checked;
  const impact = monthend ? $('#fld_impact_txt').value.trim() : null;
  if (monthend && !impact) return alert('月底临时补录必须填写"判断影响说明"');
  await fetch('/api/remarks', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ foster_id: d.foster_id, alert_id: d.id, content, operator: state.operator, is_monthend_extra: monthend ? 1 : 0, impact_judgments: impact }) });
  closeModal();
  state.detail = await (await fetch(`/api/alerts/${d.id}`)).json();
  await loadAlerts();
  renderAll();
}

function addConclusionModal(remarkId) {
  const d = state.detail;
  const remarks = d.remarks;
  showModal('📝 新增回访结论', `
    <div class="form-row"><label>关联哪条主人微信备注？</label>
      <select id="fld_rid">
        <option value="">-- 请选择（必须关联，否则月底查不到关系）--</option>
        ${remarks.map(r => `<option value="${r.id}" ${remarkId === r.id ? 'selected' : ''}>${r.remark_type} - ${r.content.slice(0, 25)}${r.content.length > 25 ? '...' : ''}（${r.operator}）</option>`).join('')}
      </select>
      <div class="hint">📌 回访结论必须关联到某条微信备注，这是兽医助理阿宁"留下关系"的关键一步</div>
    </div>
    <div class="form-row"><label>结论类型</label>
      <select id="fld_type"><option>常规</option><option>转诊</option><option>居家观察</option><option>执行新处方</option><option>复诊</option><option>其他</option></select>
    </div>
    <div class="form-row"><label>回访结论内容</label>
      <textarea id="fld_concl" placeholder="例：胰腺炎复发征兆，已联系急诊转诊"></textarea></div>
    <div class="form-row"><label>下一步行动</label>
      <input id="fld_next" placeholder="例：24h后跟进复查结果"></div>
  `, `<button class="btn btn-secondary" onclick="closeModal()">取消</button>
     <button class="btn btn-primary" onclick="submitConclusion()">保存</button>`);
}

async function submitConclusion() {
  const d = state.detail;
  const wechat_remark_id = $('#fld_rid').value;
  if (!wechat_remark_id) return alert('请先关联一条微信备注！这是月底追溯关系的关键');
  const conclusion = $('#fld_concl').value.trim();
  if (!conclusion) return alert('请填写结论内容');
  await fetch('/api/conclusions', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ foster_id: d.foster_id, alert_id: d.id, wechat_remark_id, conclusion, conclusion_type: $('#fld_type').value, operator: state.operator, next_action: $('#fld_next').value }) });
  closeModal();
  state.detail = await (await fetch(`/api/alerts/${d.id}`)).json();
  renderAll();
}

function addMedModal() {
  const d = state.detail;
  showModal('💊 新增 / 调整用药记录', `
    <div class="form-row"><label>药品名称</label>
      <input id="fld_drug" placeholder="例：速诺片"></div>
    <div class="form-row"><label>剂量（改剂量请直接填写新剂量，系统自动记录前后版本）</label>
      <input id="fld_dosage" placeholder="例：1片/次，每日2次"></div>
    <div class="form-row"><label>频次（选填）</label>
      <input id="fld_freq" placeholder="例：BID / 每日2次"></div>
    <div class="form-row"><label>变更原因（如为改剂量<b style="color:#f56c6c">必填</b>）</label>
      <textarea id="fld_reason" placeholder="例：体重核实9kg，原剂量按7kg计算偏低"></textarea>
      <div class="hint">💡 如为同一药品调整剂量：填写相同药品名 + 新剂量 + 变更原因，系统自动生成新版本并留痕</div>
    </div>
  `, `<button class="btn btn-secondary" onclick="closeModal()">取消</button>
     <button class="btn btn-primary" onclick="submitMed()">保存记录</button>`);
}

async function submitMed() {
  const d = state.detail;
  const drug = $('#fld_drug').value.trim();
  const dosage = $('#fld_dosage').value.trim();
  if (!drug || !dosage) return alert('请填写药品名和剂量');
  await fetch('/api/medications', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ foster_id: d.foster_id, alert_id: d.id, drug_name: drug, dosage, frequency: $('#fld_freq').value.trim(), operator: state.operator, change_reason: $('#fld_reason').value.trim() }) });
  closeModal();
  state.detail = await (await fetch(`/api/alerts/${d.id}`)).json();
  await loadAlerts();
  renderAll();
}

async function exportMarkdown() {
  const btn = event.target;
  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = '正在生成...';
  const params = { ...state.filter, operator: state.operator };
  const q = new URLSearchParams(params).toString();
  const res = await (await fetch(`/api/export/markdown?${q}`)).json();
  btn.disabled = false;
  btn.textContent = oldText;
  window.open(res.url, '_blank');
  alert(`✅ 报告已生成！\n\n文件名：${res.filename}\n筛选口径：${JSON.stringify(state.filter)}\n数字与当前页面列表完全同步，包含所有明细、备注关联、用药变更、历史轨迹、拉动因素拆解`);
}

loadAll();
</script>
</body>
</html>
