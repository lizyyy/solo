[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-balance-calculator"
version = "0.1.0"
authors = [
  { name="Heating Maintenance Team" }
]
description = "Hydraulic Balance Calculator for District Heating Systems"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pandas>=2.0.0",
  "pyyaml>=6.0",
  "plotly>=5.14.0",
  "numpy>=1.24.0",
  "rich>=13.0.0",
]

[project.scripts]
heat-balance = "heat_balance.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["heat_balance*"]
