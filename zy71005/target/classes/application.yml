server:
  port: 8080

spring:
  application:
    name: rework-api
  datasource:
    url: jdbc:h2:mem:reworkdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

rework:
  confirmation:
    window-hours: 48
  max-rework-count: 3
