server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: baggage-compensation-api
  datasource:
    url: jdbc:h2:./data/baggage_compensation;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

compensation:
  rules:
    max-amount: 1500
    min-amount: 100
    duplicate-check-days: 30
