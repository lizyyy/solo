[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parquet-schema-evolution"
version = "0.1.0"
description = "Parquet Schema Evolution CLI - 检测和分析 Parquet 文件 schema 变更"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Data Platform Team" }
]
dependencies = [
    "pyarrow>=12.0.0",
    "pandas>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
parquet-schema = "parquet_schema_evolution.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
