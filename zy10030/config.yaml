server:
  name: grayscale-simulator
  port: 8080
  mode: release
  read_timeout: 60s
  write_timeout: 60s

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: grayscale_simulator
  sslmode: disable
  max_connections: 50
  max_idle_connections: 10
  connection_max_lifetime: 1h

kafka:
  brokers:
    - localhost:9092
  consumer_group: grayscale-simulator-group
  topic: grayscale-events
  partition: 0
  replication_factor: 1

log:
  level: info
  format: json
  output: stdout

trace:
  enabled: true
  jaeger_endpoint: http://localhost:14268/api/traces
  service_name: grayscale-simulator

gray_release:
  default_strategy: percentage
  default_percentage: 10
  enable_real_time_monitoring: true

rollback:
  max_retry_times: 3
  retry_interval: 1s
  timeout: 5m
  enable_saga_pattern: true

fault_injection:
  enabled: true
  high_concurrency:
    max_concurrent: 1000
    queue_size: 5000
  timeout:
    min_timeout: 100ms
    max_timeout: 5s
    probability: 0.1
  network:
    failure_probability: 0.05
    retry_times: 3
    backoff_strategy: exponential

message_queue:
  consumer:
    max_processing_time: 30s
    enable_manual_commit: true
    enable_idempotency: true
    dedup_window: 5m

