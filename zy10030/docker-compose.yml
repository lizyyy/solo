version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: grayscale-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grayscale_simulator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grayscale-net

  zookeeper:
    image: wurstmeister/zookeeper:3.4.6
    container_name: grayscale-zookeeper
    ports:
      - "2181:2181"
    networks:
      - grayscale-net

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: grayscale-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "grayscale-events:1:1"
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/kafka
    networks:
      - grayscale-net

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: grayscale-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
    networks:
      - grayscale-net

  app:
    build: .
    container_name: grayscale-simulator
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DBNAME: grayscale_simulator
      KAFKA_BROKERS: kafka:9092
      TRACE_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      jaeger:
        condition: service_started
    volumes:
      - ./reports:/app/reports
    networks:
      - grayscale-net

volumes:
  postgres_data:
  kafka_data:

networks:
  grayscale-net:
    driver: bridge

