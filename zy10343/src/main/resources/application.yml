spring:
  application:
    name: file-virus-scan-orchestration
  datasource:
    url: jdbc:h2:file:./data/virus_scan_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.virusscan: DEBUG
    org.hibernate.SQL: DEBUG