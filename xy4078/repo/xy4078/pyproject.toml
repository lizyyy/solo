[project]
name = "offline-ticket-merger"
version = "0.1.0"
description = "离线工单合并器 - 用于合并外勤维修工程师的离线工单记录"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "tabulate>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
otm = "offline_ticket_merger.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offline_ticket_merger"]
