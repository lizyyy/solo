<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>摄像头盲区巡检沙盘</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    #toolbar {
      height: 50px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #0f3460;
      color: #e94560;
      font-size: 14px;
    }
    #toolbar h1 { font-size: 18px; margin-right: 30px; color: #fff; }
    #toolbar .btn {
      background: #0f3460;
      color: #fff;
      border: none;
      padding: 8px 16px;
      margin: 0 5px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.3s;
    }
    #toolbar .btn:hover { background: #e94560; transform: translateY(-1px); }
    #toolbar .btn-group { display: flex; margin-left: 20px; }
    #main-content { display: flex; flex: 1; overflow: hidden; }
    #sidebar-left {
      width: 280px;
      background: #1a1a2e;
      border-right: 1px solid #0f3460;
      overflow-y: auto;
      padding: 15px;
      color: #aaa;
    }
    #sidebar-left h3 {
      color: #e94560;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid #0f3460;
      font-size: 14px;
    }
    #sidebar-left .section { margin-bottom: 20px; }
    #sidebar-left .item {
      display: flex;
      align-items: center;
      padding: 10px;
      margin: 5px 0;
      background: #0f3460;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }
    #sidebar-left .item:hover { background: #16213e; }
    #sidebar-left .item.active { background: #e94560; color: #fff; }
    #sidebar-left .item .icon {
      width: 24px;
      height: 24px;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    #canvas-container { flex: 1; position: relative; background: #0a0a1a; }
    #three-canvas { width: 100%; height: 100%; display: block; }
    #sidebar-right {
      width: 320px;
      background: #1a1a2e;
      border-left: 1px solid #0f3460;
      overflow-y: auto;
      padding: 15px;
      color: #aaa;
    }
    #sidebar-right h3 {
      color: #e94560;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid #0f3460;
      font-size: 14px;
    }
    #sidebar-right .property-group { margin-bottom: 20px; }
    #sidebar-right .property {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }
    #sidebar-right .property label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    #sidebar-right .property input[type="number"],
    #sidebar-right .property input[type="text"],
    #sidebar-right .property select {
      background: #0f3460;
      border: 1px solid #16213e;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    #sidebar-right .property input[type="range"] {
      width: 100%;
      height: 4px;
      background: #0f3460;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    #sidebar-right .risk-alert {
      background: linear-gradient(90deg, #ff4444 0%, #cc0000 100%);
      color: #fff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 4px;
      font-size: 12px;
    }
    #sidebar-right .risk-warning {
      background: linear-gradient(90deg, #ffaa00 0%, #ff8800 100%);
      color: #fff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 4px;
      font-size: 12px;
    }
    #sidebar-right .risk-info {
      background: linear-gradient(90deg, #00aaff 0%, #0088cc 100%);
      color: #fff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 4px;
      font-size: 12px;
    }
    #stats {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }
    .hidden { display: none !important; }
    .file-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <h1>📹 摄像头盲区巡检沙盘</h1>
      <button class="btn" id="btn-new">📄 新建</button>
      <button class="btn" id="btn-save">💾 保存</button>
      <button class="btn" id="btn-export-json">📤 导出JSON</button>
      <button class="btn" id="btn-export-report">📋 导出报告</button>
      <button class="btn" id="btn-import">📥 导入</button>
      <input type="file" class="file-input" id="file-import" accept=".json">
      <div class="btn-group">
        <button class="btn" id="btn-add-wall">🧱 添加墙体</button>
        <button class="btn" id="btn-add-pillar">🏛️ 添加立柱</button>
        <button class="btn" id="btn-add-camera">📹 添加摄像头</button>
        <button class="btn" id="btn-add-parking">🅿️ 添加车位</button>
        <button class="btn" id="btn-add-passage">🚗 添加通道</button>
      </div>
      <div class="btn-group" style="margin-left: auto;">
        <button class="btn" id="btn-sample">🎯 加载示例</button>
        <button class="btn" id="btn-calc-risk">⚠️ 计算风险</button>
      </div>
    </div>
    <div id="main-content">
      <div id="sidebar-left">
        <div class="section">
          <h3>📹 摄像头列表</h3>
          <div id="camera-list"></div>
        </div>
        <div class="section">
          <h3>🅿️ 车位列表</h3>
          <div id="parking-list"></div>
        </div>
        <div class="section">
          <h3>🚗 通道列表</h3>
          <div id="passage-list"></div>
        </div>
      </div>
      <div id="canvas-container">
        <canvas id="three-canvas"></canvas>
        <div id="stats">
          <div>摄像头: <span id="stat-cameras">0</span></div>
          <div>墙体: <span id="stat-walls">0</span></div>
          <div>立柱: <span id="stat-pillars">0</span></div>
          <div>车位: <span id="stat-parkings">0</span></div>
          <div>通道: <span id="stat-passages">0</span></div>
          <div>盲区风险: <span id="stat-blind-spots">0</span></div>
          <div>重叠浪费: <span id="stat-overlaps">0</span></div>
        </div>
      </div>
      <div id="sidebar-right">
        <div id="property-panel" class="hidden">
          <h3 id="property-title">属性编辑</h3>
          <div id="property-content"></div>
        </div>
        <div id="no-selection">
          <h3>提示</h3>
          <p style="font-size: 13px; line-height: 1.8;">
            请选择场景中的物体进行编辑<br><br>
            <strong>操作说明：</strong><br>
            • 鼠标左键：选择/拖拽物体<br>
            • 鼠标滚轮：缩放视图<br>
            • 鼠标右键拖动：旋转视角<br>
            • 中键拖动：平移视图
          </p>
        </div>
        <div id="risk-panel" class="property-group">
          <h3>⚠️ 风险分析</h3>
          <div id="risk-content"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
