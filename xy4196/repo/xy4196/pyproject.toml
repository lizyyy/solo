[project]
name = "freezevalidator"
version = "0.1.0"
description = "冻存盒交接核对员 - 生物样本库本地自动化工具"
requires-python = ">=3.8"
authors = [
    { name = "Sample Lab" }
]
dependencies = [
    "click>=8.0.0",
    "pandas>=1.3.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
freezevalidator = "freezevalidator.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["freezevalidator*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
