[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeowners-coverage"
version = "0.1.0"
description = "GitHub CODEOWNERS coverage analysis CLI tool"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "CodeOwners Team", email = "team@example.com" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pathspec>=0.11.0",
  "PyYAML>=6.0",
  "tabulate>=0.9.0",
  "colorama>=0.4.6",
]

[project.scripts]
codeowners-coverage = "codeowners_coverage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
