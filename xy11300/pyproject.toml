[tool.poetry]
name = "homestay-admin"
version = "0.1.0"
description = "民宿运营数据处理CLI工具"
authors = ["Your Name <your@email.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.0"
sqlalchemy = "^2.0.0"
pandas = "^2.0.0"
rich = "^13.0.0"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
homestay = "homestay_admin.cli:main"
