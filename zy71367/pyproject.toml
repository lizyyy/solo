[project]
name = "fabric-sample-cli"
version = "0.1.0"
description = "服装秀面料样卡管理工具 - 面料样卡、供应商、成衣编号对应关系管理"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "tabulate>=0.9.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
fabric-sample = "fabric_sample_cli.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
