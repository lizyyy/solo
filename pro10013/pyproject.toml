[project]
name = "margin-collateral-review"
version = "0.1.0"
description = "券商两融担保品复核工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
mcr = "mcr.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
