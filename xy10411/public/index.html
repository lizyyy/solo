<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短视频素材授权台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .modal { display: none; }
    .modal.show { display: flex; }
    .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          </div>
          <div>
            <h1 class="text-xl font-bold text-gray-900">短视频素材授权台</h1>
            <p class="text-sm text-gray-500">统一管理素材授权与使用申请</p>
          </div>
        </div>
        <div class="flex gap-3">
          <button onclick="exportPending()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            导出本周待处理
          </button>
          <button onclick="openAddMaterialModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            登记新素材
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex gap-4 mb-6 border-b">
      <button onclick="switchTab('materials')" id="tab-materials" class="px-4 py-3 font-medium text-gray-700 tab-active">素材库</button>
      <button onclick="switchTab('applications')" id="tab-applications" class="px-4 py-3 font-medium text-gray-500 hover:text-gray-700">申请记录</button>
    </div>

    <div id="materials-view">
      <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
        <div class="flex flex-wrap gap-4">
          <div class="flex-1 min-w-[200px]">
            <div class="relative">
              <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input type="text" id="search-input" placeholder="搜索素材名称或描述..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>
          </div>
          <select id="filter-type" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            <option value="">全部类型</option>
            <option value="INFLUENCER">达人授权</option>
            <option value="BRAND_OWNED">品牌自有</option>
            <option value="OTHER">其他</option>
          </select>
          <select id="filter-risk" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            <option value="ALL">全部风险</option>
            <option value="NONE">无风险</option>
            <option value="LOW">低风险</option>
            <option value="MEDIUM">中风险</option>
            <option value="HIGH">高风险</option>
          </select>
          <select id="filter-status" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            <option value="">全部状态</option>
            <option value="active">在用</option>
            <option value="inactive">已下架</option>
          </select>
        </div>
      </div>

      <div id="materials-list" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
      <div id="materials-empty" class="hidden text-center py-16 text-gray-500">
        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
        </svg>
        <p>暂无素材，点击上方按钮登记新素材</p>
      </div>
    </div>

    <div id="applications-view" class="hidden">
      <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">申请时间</th>
              <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">素材名称</th>
              <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">版本</th>
              <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">渠道</th>
              <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">申请人</th>
              <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">状态</th>
              <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">风险</th>
            </tr>
          </thead>
          <tbody id="applications-list" class="divide-y"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="add-material-modal" class="modal fixed inset-0 bg-black/50 items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
        <h2 class="text-xl font-bold">登记新素材</h2>
        <button onclick="closeAddMaterialModal()" class="p-2 hover:bg-gray-100 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form id="add-material-form" class="p-6 space-y-6">
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">素材名称 *</label>
            <input type="text" name="name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">素材类型 *</label>
            <select name="type" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
              <option value="INFLUENCER">达人授权</option>
              <option value="BRAND_OWNED">品牌自有</option>
              <option value="OTHER">其他</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">素材描述</label>
          <textarea name="description" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"></textarea>
        </div>
        
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-sm font-medium text-gray-700">剪辑版本 *</label>
            <button type="button" onclick="addVersionRow()" class="text-sm text-blue-600 hover:text-blue-800">+ 添加版本</button>
          </div>
          <div id="versions-container" class="space-y-2"></div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-sm font-medium text-gray-700">授权渠道 *</label>
            <button type="button" onclick="addChannelRow()" class="text-sm text-blue-600 hover:text-blue-800">+ 添加渠道</button>
          </div>
          <div id="channels-container" class="space-y-2"></div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-sm font-medium text-gray-700">授权合同</label>
            <button type="button" onclick="addContractRow()" class="text-sm text-blue-600 hover:text-blue-800">+ 添加合同</button>
          </div>
          <div id="contracts-container" class="space-y-2"></div>
        </div>

        <div class="flex gap-3 justify-end pt-4">
          <button type="button" onclick="closeAddMaterialModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-50">取消</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="material-detail-modal" class="modal fixed inset-0 bg-black/50 items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
        <div>
          <h2 id="detail-name" class="text-xl font-bold"></h2>
          <p id="detail-type" class="text-sm text-gray-500 mt-1"></p>
        </div>
        <button onclick="closeDetailModal()" class="p-2 hover:bg-gray-100 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="p-6 space-y-6">
        <div class="grid gap-6 md:grid-cols-3">
          <div class="md:col-span-2 space-y-4">
            <div>
              <h3 class="text-sm font-medium text-gray-500 mb-2">描述</h3>
              <p id="detail-description" class="text-gray-700"></p>
            </div>
            <div>
              <h3 class="text-sm font-medium text-gray-500 mb-2">授权渠道</h3>
              <div id="detail-channels" class="flex flex-wrap gap-2"></div>
            </div>
            <div>
              <h3 class="text-sm font-medium text-gray-500 mb-2">剪辑版本</h3>
              <div id="detail-versions" class="space-y-2"></div>
            </div>
            <div>
              <h3 class="text-sm font-medium text-gray-500 mb-2">授权合同</h3>
              <div id="detail-contracts" class="space-y-2"></div>
            </div>
          </div>
          <div class="space-y-4">
            <div class="bg-gray-50 rounded-lg p-4">
              <h3 class="text-sm font-medium text-gray-500 mb-3">状态</h3>
              <div id="detail-status" class="mb-3"></div>
              <button id="toggle-status-btn" class="w-full px-3 py-2 text-sm border rounded-lg hover:bg-white transition"></button>
            </div>
            <button onclick="openApplyModal()" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              提交使用申请
            </button>
          </div>
        </div>

        <div>
          <h3 class="text-lg font-semibold mb-4">时间线</h3>
          <div id="detail-timeline" class="space-y-4"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="apply-modal" class="modal fixed inset-0 bg-black/50 items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md">
      <div class="border-b px-6 py-4 flex items-center justify-between">
        <h2 class="text-xl font-bold">提交使用申请</h2>
        <button onclick="closeApplyModal()" class="p-2 hover:bg-gray-100 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form id="apply-form" class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">剪辑版本 *</label>
          <select name="clipVersionId" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" id="apply-version-select"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">投放渠道 *</label>
          <select name="channel" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" id="apply-channel-select"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">申请人 *</label>
          <input type="text" name="applicant" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">部门 *</label>
          <input type="text" name="department" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">使用用途</label>
          <textarea name="purpose" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"></textarea>
        </div>
        <div class="flex gap-3 justify-end pt-4">
          <button type="button" onclick="closeApplyModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-50">取消</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">提交</button>
        </div>
      </form>
    </div>
  </div>

  <div id="result-modal" class="modal fixed inset-0 bg-black/50 items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md text-center p-8">
      <div id="result-icon" class="w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4"></div>
      <h3 id="result-title" class="text-xl font-bold mb-2"></h3>
      <p id="result-message" class="text-gray-600 mb-6"></p>
      <button onclick="closeResultModal()" class="px-6 py-2 bg-gray-100 rounded-lg hover:bg-gray-200">确定</button>
    </div>
  </div>

  <script>
    let materials = [];
    let currentMaterial = null;
    let versionCount = 1;
    let channelCount = 1;
    let contractCount = 0;

    async function loadMaterials() {
      const search = document.getElementById('search-input').value;
      const type = document.getElementById('filter-type').value;
      const risk = document.getElementById('filter-risk').value;
      const status = document.getElementById('filter-status').value;
      
      const params = new URLSearchParams();
      if (search) params.append('search', search);
      if (type) params.append('type', type);
      if (risk) params.append('risk', risk);
      if (status) params.append('status', status);
      
      const res = await fetch('/api/materials?' + params.toString());
      materials = await res.json();
      renderMaterials();
    }

    function renderMaterials() {
      const list = document.getElementById('materials-list');
      const empty = document.getElementById('materials-empty');
      
      if (materials.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      
      empty.classList.add('hidden');
      list.innerHTML = materials.map(m => `
        <div class="bg-white rounded-xl shadow-sm p-5 cursor-pointer hover:shadow-md transition" onclick="openDetailModal('${m.id}')">
          <div class="flex items-start justify-between mb-3">
            <div>
              <h3 class="font-semibold text-gray-900">${m.name}</h3>
              <p class="text-sm text-gray-500 mt-1 line-clamp-2">${m.description || '暂无描述'}</p>
            </div>
            ${getRiskBadge(m.riskLevel)}
          </div>
          <div class="flex items-center gap-3 text-sm text-gray-500 mb-3">
            ${getTypeBadge(m.type)}
            <span class="flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
              </svg>
              ${m.clipVersions.length}个版本
            </span>
            <span class="flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
              ${m.channels.length}个渠道
            </span>
          </div>
          ${m.reasons ? `<p class="text-xs text-orange-600 bg-orange-50 px-2 py-1 rounded">${m.reasons}</p>` : ''}
        </div>
      `).join('');
    }

    function getTypeBadge(type) {
      const map = {
        INFLUENCER: { text: '达人授权', class: 'bg-purple-100 text-purple-700' },
        BRAND_OWNED: { text: '品牌自有', class: 'bg-blue-100 text-blue-700' },
        OTHER: { text: '其他', class: 'bg-gray-100 text-gray-700' },
      };
      const badge = map[type] || map.OTHER;
      return `<span class="px-2 py-1 rounded text-xs font-medium ${badge.class}">${badge.text}</span>`;
    }

    function getRiskBadge(risk) {
      const map = {
        NONE: { text: '无风险', class: 'bg-green-100 text-green-700' },
        LOW: { text: '低风险', class: 'bg-yellow-100 text-yellow-700' },
        MEDIUM: { text: '中风险', class: 'bg-orange-100 text-orange-700' },
        HIGH: { text: '高风险', class: 'bg-red-100 text-red-700' },
      };
      const badge = map[risk] || map.NONE;
      return `<span class="px-2 py-1 rounded text-xs font-medium ${badge.class}">${badge.text}</span>`;
    }

    function getStatusBadge(status) {
      const map = {
        APPROVED: { text: '可用', class: 'bg-green-100 text-green-700' },
        NEEDS_REVIEW: { text: '需复核', class: 'bg-yellow-100 text-yellow-700' },
        REJECTED: { text: '禁止使用', class: 'bg-red-100 text-red-700' },
      };
      const badge = map[status] || map.APPROVED;
      return `<span class="px-2 py-1 rounded text-xs font-medium ${badge.class}">${badge.text}</span>`;
    }

    async function openDetailModal(id) {
      const res = await fetch('/api/materials/' + id);
      currentMaterial = await res.json();
      
      document.getElementById('detail-name').textContent = currentMaterial.name;
      document.getElementById('detail-type').textContent = 
        currentMaterial.type === 'INFLUENCER' ? '达人授权' :
        currentMaterial.type === 'BRAND_OWNED' ? '品牌自有' : '其他';
      document.getElementById('detail-description').textContent = currentMaterial.description || '暂无描述';
      
      document.getElementById('detail-channels').innerHTML = currentMaterial.channels.map(c => 
        `<span class="px-3 py-1 bg-gray-100 rounded-full text-sm">${c.channelName}</span>`
      ).join('');
      
      document.getElementById('detail-versions').innerHTML = currentMaterial.clipVersions.map(v => `
        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
          <div>
            <span class="font-medium">${v.version}</span>
            <span class="text-gray-500 text-sm ml-2">${v.fileName}</span>
          </div>
          <span class="text-sm text-gray-500">${v.duration ? v.duration + 's' : ''}</span>
        </div>
      `).join('');
      
      document.getElementById('detail-contracts').innerHTML = currentMaterial.contracts.length ? 
        currentMaterial.contracts.map(c => `
          <div class="p-3 bg-gray-50 rounded-lg">
            <div class="flex items-center justify-between">
              <span class="font-medium">${c.contractNumber}</span>
              <span class="text-sm ${c.endDate < new Date().toISOString() ? 'text-red-600' : 'text-green-600'}">
                ${formatDate(c.startDate)} ~ ${formatDate(c.endDate)}
              </span>
            </div>
            ${c.notes ? `<p class="text-sm text-gray-500 mt-1">${c.notes}</p>` : ''}
          </div>
        `).join('') : '<p class="text-gray-500 text-sm">暂无合同</p>';
      
      const statusBadge = currentMaterial.isInactive ? 
        '<span class="px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm">已下架</span>' :
        currentMaterial.isExpired ? 
        '<span class="px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-sm">授权过期</span>' :
        '<span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm">正常</span>';
      document.getElementById('detail-status').innerHTML = statusBadge;
      
      const toggleBtn = document.getElementById('toggle-status-btn');
      if (currentMaterial.status === 'inactive') {
        toggleBtn.textContent = '恢复使用';
        toggleBtn.onclick = () => toggleMaterialStatus('active');
      } else {
        toggleBtn.textContent = '下架素材';
        toggleBtn.onclick = () => toggleMaterialStatus('inactive');
      }
      
      renderTimeline();
      
      document.getElementById('material-detail-modal').classList.add('show');
    }

    function renderTimeline() {
      const timeline = document.getElementById('detail-timeline');
      const items = currentMaterial.timeline;
      
      if (items.length === 0) {
        timeline.innerHTML = '<p class="text-gray-500">暂无时间记录</p>';
        return;
      }
      
      timeline.innerHTML = items.map((item, idx) => {
        const isLast = idx === items.length - 1;
        const icons = {
          contract: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>',
          application: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>',
          version: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" /></svg>',
        };
        const colors = {
          contract: 'bg-blue-500',
          application: 'bg-green-500',
          version: 'bg-purple-500',
        };
        
        return `
          <div class="flex gap-4">
            <div class="flex flex-col items-center">
              <div class="w-8 h-8 ${colors[item.type] || 'bg-gray-500'} rounded-full flex items-center justify-center text-white">
                ${icons[item.type] || icons.version}
              </div>
              ${!isLast ? '<div class="flex-1 w-px bg-gray-200 my-2"></div>' : ''}
            </div>
            <div class="flex-1 pb-4">
              <div class="flex items-center gap-2 mb-1">
                <h4 class="font-medium">${item.title}</h4>
                <span class="text-sm text-gray-500">${formatDate(item.date)}</span>
              </div>
              <p class="text-sm text-gray-600">${item.description}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
    }

    async function toggleMaterialStatus(status) {
      await fetch('/api/materials/' + currentMaterial.id + '/status', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      closeDetailModal();
      loadMaterials();
    }

    function openApplyModal() {
      const versionSelect = document.getElementById('apply-version-select');
      versionSelect.innerHTML = currentMaterial.clipVersions.map(v => 
        `<option value="${v.id}">${v.version} - ${v.fileName}</option>`
      ).join('');
      
      const channelSelect = document.getElementById('apply-channel-select');
      channelSelect.innerHTML = currentMaterial.channels.map(c => 
        `<option value="${c.channelName}">${c.channelName}</option>`
      ).join('');
      
      document.getElementById('apply-modal').classList.add('show');
    }

    function closeApplyModal() {
      document.getElementById('apply-modal').classList.remove('show');
    }

    async function submitApplication(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        materialId: currentMaterial.id,
        clipVersionId: form.clipVersionId.value,
        channel: form.channel.value,
        applicant: form.applicant.value,
        department: form.department.value,
        purpose: form.purpose.value,
      };
      
      const res = await fetch('/api/applications', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await res.json();
      
      closeApplyModal();
      showResult(result.status, result.reasons);
      form.reset();
    }

    function showResult(status, reasons) {
      const icon = document.getElementById('result-icon');
      const title = document.getElementById('result-title');
      const message = document.getElementById('result-message');
      
      if (status === 'APPROVED') {
        icon.className = 'w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 bg-green-100';
        icon.innerHTML = '<svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>';
        title.textContent = '可用';
        message.textContent = '该素材可以正常使用';
      } else if (status === 'NEEDS_REVIEW') {
        icon.className = 'w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 bg-yellow-100';
        icon.innerHTML = '<svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>';
        title.textContent = '需复核';
        message.textContent = reasons || '请联系管理员确认';
      } else {
        icon.className = 'w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 bg-red-100';
        icon.innerHTML = '<svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>';
        title.textContent = '禁止使用';
        message.textContent = reasons || '该素材无法使用';
      }
      
      document.getElementById('result-modal').classList.add('show');
    }

    function closeResultModal() {
      document.getElementById('result-modal').classList.remove('show');
    }

    function closeDetailModal() {
      document.getElementById('material-detail-modal').classList.remove('show');
      currentMaterial = null;
    }

    function openAddMaterialModal() {
      versionCount = 1;
      channelCount = 1;
      contractCount = 0;
      
      document.getElementById('versions-container').innerHTML = createVersionRow(0);
      document.getElementById('channels-container').innerHTML = createChannelRow(0);
      document.getElementById('contracts-container').innerHTML = '';
      document.getElementById('add-material-form').reset();
      document.getElementById('add-material-modal').classList.add('show');
    }

    function closeAddMaterialModal() {
      document.getElementById('add-material-modal').classList.remove('show');
    }

    function createVersionRow(idx) {
      return `
        <div class="flex gap-2 items-start" data-version="${idx}">
          <input type="text" name="version_${idx}" placeholder="版本号 (如 v1.0)" required class="flex-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          <input type="text" name="fileName_${idx}" placeholder="文件名" required class="flex-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          <input type="number" name="duration_${idx}" placeholder="时长(秒)" class="w-24 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          ${idx > 0 ? `<button type="button" onclick="removeVersionRow(${idx})" class="p-2 text-red-600 hover:bg-red-50 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>` : ''}
        </div>
      `;
    }

    function createChannelRow(idx) {
      return `
        <div class="flex gap-2 items-start" data-channel="${idx}">
          <input type="text" name="channelName_${idx}" placeholder="渠道名称 (如 抖音、小红书)" required class="flex-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          ${idx > 0 ? `<button type="button" onclick="removeChannelRow(${idx})" class="p-2 text-red-600 hover:bg-red-50 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>` : ''}
        </div>
      `;
    }

    function createContractRow(idx) {
      return `
        <div class="p-3 bg-gray-50 rounded-lg space-y-2" data-contract="${idx}">
          <div class="flex gap-2">
            <input type="text" name="contractNumber_${idx}" placeholder="合同编号" required class="flex-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            <input type="text" name="contractChannel_${idx}" placeholder="对应渠道" required class="flex-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            <button type="button" onclick="removeContractRow(${idx})" class="p-2 text-red-600 hover:bg-red-50 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
          </div>
          <div class="flex gap-2">
            <input type="date" name="contractStart_${idx}" required class="flex-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            <input type="date" name="contractEnd_${idx}" required class="flex-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          </div>
          <textarea name="contractNotes_${idx}" rows="1" placeholder="备注" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"></textarea>
        </div>
      `;
    }

    function addVersionRow() {
      const container = document.getElementById('versions-container');
      container.innerHTML += createVersionRow(versionCount++);
    }

    function removeVersionRow(idx) {
      const row = document.querySelector(`[data-version="${idx}"]`);
      if (row) row.remove();
    }

    function addChannelRow() {
      const container = document.getElementById('channels-container');
      container.innerHTML += createChannelRow(channelCount++);
    }

    function removeChannelRow(idx) {
      const row = document.querySelector(`[data-channel="${idx}"]`);
      if (row) row.remove();
    }

    function addContractRow() {
      const container = document.getElementById('contracts-container');
      container.innerHTML += createContractRow(contractCount++);
    }

    function removeContractRow(idx) {
      const row = document.querySelector(`[data-contract="${idx}"]`);
      if (row) row.remove();
    }

    async function submitMaterial(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      
      const clipVersions = [];
      for (let i = 0; i < versionCount; i++) {
        if (data.get(`version_${i}`)) {
          clipVersions.push({
            version: data.get(`version_${i}`),
            fileName: data.get(`fileName_${i}`),
            duration: parseInt(data.get(`duration_${i}`)) || null,
          });
        }
      }
      
      const channels = [];
      for (let i = 0; i < channelCount; i++) {
        if (data.get(`channelName_${i}`)) {
          channels.push({ channelName: data.get(`channelName_${i}`) });
        }
      }
      
      const contracts = [];
      for (let i = 0; i < contractCount; i++) {
        if (data.get(`contractNumber_${i}`)) {
          contracts.push({
            contractNumber: data.get(`contractNumber_${i}`),
            channelName: data.get(`contractChannel_${i}`),
            startDate: data.get(`contractStart_${i}`),
            endDate: data.get(`contractEnd_${i}`),
            notes: data.get(`contractNotes_${i}`) || '',
          });
        }
      }
      
      await fetch('/api/materials', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: data.get('name'),
          type: data.get('type'),
          description: data.get('description'),
          clipVersions,
          channels,
          contracts,
        }),
      });
      
      closeAddMaterialModal();
      loadMaterials();
    }

    async function loadApplications() {
      const res = await fetch('/api/applications');
      const apps = await res.json();
      
      const tbody = document.getElementById('applications-list');
      if (apps.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-12 text-center text-gray-500">暂无申请记录</td></tr>';
        return;
      }
      
      tbody.innerHTML = apps.map(app => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3 text-sm">${formatDateTime(app.createdAt)}</td>
          <td class="px-4 py-3 text-sm font-medium">${app.material.name}</td>
          <td class="px-4 py-3 text-sm">${app.clipVersion.version}</td>
          <td class="px-4 py-3 text-sm">${app.channel}</td>
          <td class="px-4 py-3 text-sm">${app.applicant}</td>
          <td class="px-4 py-3">${getStatusBadge(app.status)}</td>
          <td class="px-4 py-3">${getRiskBadge(app.riskLevel)}</td>
        </tr>
      `).join('');
    }

    function formatDateTime(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleString('zh-CN', { 
        year: 'numeric', 
        month: '2-digit', 
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function switchTab(tab) {
      document.getElementById('tab-materials').classList.remove('tab-active');
      document.getElementById('tab-applications').classList.remove('tab-active');
      document.getElementById('tab-' + tab).classList.add('tab-active');
      
      document.getElementById('materials-view').classList.add('hidden');
      document.getElementById('applications-view').classList.add('hidden');
      document.getElementById(tab + '-view').classList.remove('hidden');
      
      if (tab === 'applications') {
        loadApplications();
      }
    }

    function exportPending() {
      window.location.href = '/api/export/pending';
    }

    document.getElementById('search-input').addEventListener('input', loadMaterials);
    document.getElementById('filter-type').addEventListener('change', loadMaterials);
    document.getElementById('filter-risk').addEventListener('change', loadMaterials);
    document.getElementById('filter-status').addEventListener('change', loadMaterials);
    document.getElementById('add-material-form').addEventListener('submit', submitMaterial);
    document.getElementById('apply-form').addEventListener('submit', submitApplication);

    loadMaterials();
  </script>
</body>
</html>
