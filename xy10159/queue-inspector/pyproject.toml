[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "queue-inspector"
version = "1.0.0"
description = "消息补偿队列巡检CLI工具 - 解决补偿任务越积越多、重复消费和永久失败混在一起的问题"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Queue Inspector Team" }
]
license = { text = "MIT" }
keywords = ["queue", "compensation", "inspector", "retry", "dead-letter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
qi = "queue_inspector.cli:cli"
queue-inspector = "queue_inspector.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["queue_inspector*"]
