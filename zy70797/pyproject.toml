[project]
name = "orphan-checker"
version = "0.1.0"
description = "服务目录孤儿条目存活证据排查CLI"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "gitpython>=3.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
orphan-checker = "orphan_checker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
