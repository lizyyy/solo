<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影院会员部积分补录管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .stat-card.normal { border-left: 4px solid #3b82f6; }
        .stat-card.rejected { border-left: 4px solid #ef4444; }
        .stat-card.supplemented { border-left: 4px solid #f59e0b; }
        .stat-card.completed { border-left: 4px solid #10b981; }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .stat-card.normal .stat-number { color: #3b82f6; }
        .stat-card.rejected .stat-number { color: #ef4444; }
        .stat-card.supplemented .stat-number { color: #f59e0b; }
        .stat-card.completed .stat-number { color: #10b981; }
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        .records-panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .panel-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .record-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid #ccc;
        }
        .record-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .record-card.normal { border-left-color: #3b82f6; }
        .record-card.rejected { border-left-color: #ef4444; }
        .record-card.supplemented { border-left-color: #f59e0b; }
        .record-card.completed { border-left-color: #10b981; }
        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .movie-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.normal { background: #dbeafe; color: #1d4ed8; }
        .status-badge.rejected { background: #fee2e2; color: #b91c1c; }
        .status-badge.supplemented { background: #fef3c7; color: #92400e; }
        .status-badge.completed { background: #d1fae5; color: #065f46; }
        .record-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 13px;
            color: #666;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        .detail-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 2px;
        }
        .detail-value {
            font-weight: 500;
        }
        .detail-panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            height: fit-content;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .detail-section {
            margin-bottom: 20px;
        }
        .detail-section h4 {
            color: #333;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .info-label {
            color: #666;
        }
        .info-value {
            color: #333;
            font-weight: 500;
            text-align: right;
            max-width: 180px;
        }
        .timeline {
            position: relative;
            padding-left: 20px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e5e7eb;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #667eea;
        }
        .timeline-time {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }
        .timeline-content {
            font-size: 13px;
            color: #333;
        }
        .timeline-operator {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .action-btn.reject {
            background: #fee2e2;
            color: #dc2626;
        }
        .action-btn.complete {
            background: #d1fae5;
            color: #059669;
        }
        .action-btn.supplement {
            background: #fef3c7;
            color: #d97706;
        }
        .flow-item {
            background: #f0fdf4;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .flow-points {
            color: #16a34a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 影院会员部积分补录管理系统</h1>
            <p>实时管理会员积分补录申请，追踪票根状态，确保积分流水一致性</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card normal">
                <div class="stat-number" id="stat-normal">0</div>
                <div class="stat-label">正常待审核</div>
            </div>
            <div class="stat-card rejected">
                <div class="stat-number" id="stat-rejected">0</div>
                <div class="stat-label">已驳回</div>
            </div>
            <div class="stat-card supplemented">
                <div class="stat-number" id="stat-supplemented">0</div>
                <div class="stat-label">已补录</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-number" id="stat-completed">0</div>
                <div class="stat-label">已完成</div>
            </div>
        </div>

        <div class="main-content">
            <div class="records-panel">
                <h2 class="panel-title">积分补录记录</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="normal">待审核</button>
                    <button class="filter-btn" data-filter="rejected">已驳回</button>
                    <button class="filter-btn" data-filter="supplemented">已补录</button>
                    <button class="filter-btn" data-filter="completed">已完成</button>
                </div>
                <div id="records-list"></div>
            </div>

            <div class="detail-panel">
                <h2 class="panel-title">记录详情</h2>
                <div id="detail-content">
                    <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    <p>点击左侧记录查看详情</p>
                </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allRecords = [];
        let selectedRecord = null;

        const statusLabels = {
            normal: '正常待审核',
            rejected: '已驳回',
            supplemented: '已补录',
            completed: '已完成'
        };

        async function loadRecords(filter = 'all') {
            try {
                const response = await fetch('/api/records');
                const result = await response.json();
                allRecords = result.data;

                updateStats();

                const filteredRecords = filter === 'all' 
                    ? allRecords 
                    : allRecords.filter(r => r.status === filter);

                renderRecords(filteredRecords);
            } catch (error) {
                console.error('加载记录失败:', error);
            }
        }

        function updateStats() {
            document.getElementById('stat-normal').textContent = 
                allRecords.filter(r => r.status === 'normal').length;
            document.getElementById('stat-rejected').textContent = 
                allRecords.filter(r => r.status === 'rejected').length;
            document.getElementById('stat-supplemented').textContent = 
                allRecords.filter(r => r.status === 'supplemented').length;
            document.getElementById('stat-completed').textContent = 
                allRecords.filter(r => r.status === 'completed').length;
        }

        function renderRecords(records) {
            const container = document.getElementById('records-list');
            
            if (records.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>暂无记录</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = records.map(record => `
                <div class="record-card ${record.status}" data-id="${record.record_id">
                    <div class="record-header">
                        <span class="movie-name">${record.movie_name}</span>
                        <span class="status-badge ${record.status}">${statusLabels[record.status]}</span>
                    </div>
                    <div class="record-details">
                        <div class="detail-item">
                            <span class="detail-label">会员</span>
                            <span class="detail-value">${record.member_name} (${record.member_level})</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">影院</span>
                            <span class="detail-value">${record.cinema_name}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">影票信息</span>
                            <span class="detail-value">${record.ticket_no}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">场次</span>
                            <span class="detail-value">${record.show_time.replace(' ', '<br>')}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">座位</span>
                            <span class="detail-value">${record.seat_no}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">积分/金额</span>
                            <span class="detail-value">${record.points_earned}分 / ¥${record.ticket_amount}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.record-card').forEach(card => {
                card.addEventListener('click', () => {
                    const recordId = card.dataset.id;
                    showRecordDetail(recordId);
                });
            });
        }

        async function showRecordDetail(recordId) {
            selectedRecord = allRecords.find(r => r.record_id === recordId);
            if (!selectedRecord) return;

            const logsResponse = await fetch(`/api/records/${recordId}/logs`);
            const logsResult = await logsResponse.json();

            const flowsResponse = await fetch(`/api/records/${recordId}/flows`);
            const flowsResult = await flowsResponse.json();

            renderDetail(selectedRecord, logsResult.data, flowsResult.data);
        }

        function renderDetail(record, logs, flows) {
            const container = document.getElementById('detail-content');
            
            let actionButtons = '';
            if (record.status === 'normal' || record.status === 'supplemented') {
                actionButtons = `
                    <div class="action-buttons">
                        <button class="action-btn reject" onclick="updateStatus('${record.record_id}', 'rejected')">驳回</button>
                        <button class="action-btn complete" onclick="updateStatus('${record.record_id}', 'completed')">审核通过</button>
                    </div>
                `;
            } else if (record.status === 'rejected') {
                actionButtons = `
                    <div class="action-buttons">
                        <button class="action-btn supplement" onclick="updateStatus('${record.record_id}', 'supplemented')">标记已补录</button>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="detail-section">
                    <h4>📋 基本信息</h4>
                    <div class="info-row">
                        <span class="info-label">影片名称</span>
                        <span class="info-value">${record.movie_name}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">票根编号</span>
                        <span class="info-value">${record.ticket_no}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">会员姓名</span>
                        <span class="info-value">${record.member_name}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">会员等级</span>
                        <span class="info-value">${record.member_level}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">观影影院</span>
                        <span class="info-value">${record.cinema_name}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">观影时间</span>
                        <span class="info-value">${record.show_time}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-value">座位号</span>
                        <span class="info-value">${record.seat_no}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">票价</span>
                        <span class="info-value">¥${record.ticket_amount}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">应得积分</span>
                        <span class="info-value">${record.points_earned} 分</span>
                    </div>
                </div>

                <div class="detail-section">
                    <h4>📝 提交信息</h4>
                    <div class="info-row">
                        <span class="info-label">提交来源</span>
                        <span class="info-value">${record.submit_source}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">提交时间</span>
                        <span class="info-value">${record.submit_time}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">提交人</span>
                        <span class="info-value">${record.operator}</span>
                    </div>
                </div>

                ${record.reject_reason ? `
                <div class="detail-section">
                    <h4>❌ 驳回原因</h4>
                    <div style="background: #fee2e2; padding: 10px; border-radius: 8px; font-size: 13px; color: #991b1b;">
                        ${record.reject_reason}
                    </div>
                </div>
                ` : ''}

                ${record.supplement_note ? `
                <div class="detail-section">
                    <h4>📎 补录说明</h4>
                    <div style="background: #fef3c7; padding: 10px; border-radius: 8px; font-size: 13px; color: #92400e;">
                        ${record.supplement_note}
                    </div>
                </div>
                ` : ''}

                ${flows.length > 0 ? `
                <div class="detail-section">
                    <h4>💰 积分流水</h4>
                    ${flows.map(flow => `
                        <div class="flow-item">
                            <div><span class="flow-points">+${flow.points_change}</span> 积分</div>
                            <div style="font-size: 12px; color: #666; margin-top: 4px;">${flow.remark}</div>
                            <div style="font-size: 11px; color: #999; margin-top: 2px;">${flow.flow_time} · ${flow.operator}</div>
                        </div>
                    `).join('')}
                </div>
                ` : ''}

                <div class="detail-section">
                    <h4>📊 操作轨迹</h4>
                    <div class="timeline">
                        ${logs.map(log => `
                            <div class="timeline-item">
                                <div class="timeline-time">${log.operation_time}</div>
                                <div class="timeline-content">${log.remark}</div>
                                <div class="timeline-operator">操作人: ${log.operator}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${actionButtons}
            `;
        }

        async function updateStatus(recordId, newStatus) {
            const note = prompt('请输入备注:');
            if (note === null) return;

            try {
                const response = await fetch(`/api/records/${recordId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        new_status: newStatus,
                        operator: '当前用户',
                        note: note || '状态变更'
                    })
                });

                if (response.ok) {
                    alert('状态更新成功!');
                    loadRecords(document.querySelector('.filter-btn.active').dataset.filter);
                    if (selectedRecord && selectedRecord.record_id === recordId) {
                        showRecordDetail(recordId);
                    }
                }
            } catch (error) {
                console.error('更新状态失败:', error);
                alert('状态更新失败!');
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadRecords(btn.dataset.filter);
            });
        });

        loadRecords();
    </script>
</body>
</html>
