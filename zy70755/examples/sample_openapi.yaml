openapi: 3.0.3
info:
  title: 用户管理 API
  version: 1.0.0
  description: 用户管理系统的API文档
paths:
  /users:
    get:
      summary: 获取用户列表
      responses:
        '200':
          description: 成功获取用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 用户创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{id}:
    get:
      summary: 获取单个用户
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功获取用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
        - status
      properties:
        id:
          type: integer
          description: 用户ID
          example: 1
        name:
          type: string
          description: 用户名
          maxLength: 50
          example: "张三"
        email:
          type: string
          format: email
          description: 邮箱地址
          example: "zhangsan@example.com"
        age:
          type: integer
          minimum: 0
          maximum: 150
          description: 年龄
          example: 25
        status:
          type: string
          enum: [active, inactive, pending]
          description: 用户状态
          example: "active"
        tags:
          type: array
          items:
            type: string
          description: 用户标签
          example: ["admin", "developer"]
        createdAt:
          type: string
          format: date-time
          description: 创建时间
          example: "2024-01-01T12:00:00Z"
    CreateUserRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          description: 用户名
          maxLength: 50
          example: "李四"
        email:
          type: string
          format: email
          description: 邮箱地址
          example: "lisi@example.com"
        age:
          type: integer
          minimum: 0
          maximum: 150
          description: 年龄
          example: 30
        password:
          type: string
          minLength: 8
          description: 密码
          example: "password123"
        tags:
          type: array
          items:
            type: string
          description: 用户标签
          example: ["user"]
