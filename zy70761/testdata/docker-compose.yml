version: '3.8'

services:
  web:
    image: nginx:alpine
    environment:
      APP_NAME: "Docker Compose App"
      APP_ENV: compose
      NGINX_HOST: localhost
      NGINX_PORT: 80
    ports:
      - "8080:80"

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: compose-pass
      MYSQL_DATABASE: compose_db
      MYSQL_USER: compose_user
      DB_HOST: compose-db
      DB_PORT: 3306
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
