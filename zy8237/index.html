<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>立体停车库调度三维复核工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      overflow: hidden;
      background: #1a1a2e;
      color: #eee;
    }
    
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    #header {
      height: 60px;
      background: #16213e;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #0f3460;
      justify-content: space-between;
    }
    
    #header h1 {
      font-size: 20px;
      color: #e94560;
      font-weight: 600;
    }
    
    #header .tools {
      display: flex;
      gap: 10px;
    }
    
    #header button {
      background: #0f3460;
      border: 1px solid #533483;
      color: #eee;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    #header button:hover {
      background: #e94560;
      border-color: #e94560;
    }
    
    #header button:active {
      transform: scale(0.98);
    }
    
    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    #scene-container {
      flex: 1;
      position: relative;
      background: #0a0a1a;
    }
    
    #scene-container canvas {
      width: 100% !important;
      height: 100% !important;
    }
    
    #right-panel {
      width: 400px;
      background: #16213e;
      border-left: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .panel-section {
      padding: 15px;
      border-bottom: 1px solid #0f3460;
    }
    
    .panel-section h3 {
      font-size: 14px;
      color: #e94560;
      margin-bottom: 12px;
      font-weight: 600;
    }
    
    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    
    .control-row label {
      font-size: 12px;
      color: #aaa;
      min-width: 60px;
    }
    
    .control-row input[type="range"] {
      flex: 1;
      accent-color: #e94560;
    }
    
    .control-row span {
      font-size: 12px;
      min-width: 50px;
      text-align: right;
    }
    
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .btn-group button {
      background: #0f3460;
      border: 1px solid #533483;
      color: #eee;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
      flex: 1;
      min-width: 60px;
    }
    
    .btn-group button:hover {
      background: #e94560;
      border-color: #e94560;
    }
    
    .btn-group button.active {
      background: #e94560;
      border-color: #e94560;
    }
    
    #risk-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    
    .risk-item {
      background: #1a1a2e;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      border-left: 4px solid #e94560;
    }
    
    .risk-item.warning {
      border-left-color: #ffb86c;
    }
    
    .risk-item.error {
      border-left-color: #ff5555;
    }
    
    .risk-item.critical {
      border-left-color: #ff0040;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .risk-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    
    .risk-type {
      font-size: 12px;
      font-weight: 600;
      color: #e94560;
    }
    
    .risk-time {
      font-size: 11px;
      color: #888;
    }
    
    .risk-description {
      font-size: 12px;
      color: #ccc;
      line-height: 1.5;
    }
    
    .risk-details {
      margin-top: 8px;
      font-size: 11px;
      color: #999;
      background: #0f3460;
      padding: 8px;
      border-radius: 4px;
    }
    
    #footer {
      height: 80px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
    }
    
    .time-info {
      min-width: 200px;
    }
    
    .time-info .label {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    
    .time-info .value {
      font-size: 18px;
      color: #e94560;
      font-weight: 600;
    }
    
    #timeline-container {
      flex: 1;
      position: relative;
      height: 40px;
      background: #1a1a2e;
      border-radius: 4px;
      overflow: hidden;
    }
    
    #timeline-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      width: 0%;
      transition: width 0.1s linear;
    }
    
    #timeline-marker {
      position: absolute;
      top: 5px;
      bottom: 5px;
      width: 2px;
      background: #fff;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 10;
    }
    
    #timeline-ticks {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: flex-end;
      padding: 2px 8px;
      pointer-events: none;
    }
    
    .timeline-tick {
      position: absolute;
      bottom: 4px;
      width: 1px;
      height: 6px;
      background: #555;
    }
    
    .timeline-tick-label {
      position: absolute;
      bottom: 12px;
      font-size: 9px;
      color: #888;
      transform: translateX(-50%);
    }
    
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 26, 46, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    #loading-overlay.hidden {
      display: none;
    }
    
    .loader {
      width: 60px;
      height: 60px;
      border: 4px solid #0f3460;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #loading-overlay p {
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }
    
    .scene-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(22, 33, 62, 0.9);
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 12px;
      color: #aaa;
      border: 1px solid #0f3460;
    }
    
    .scene-overlay .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 4px;
    }
    
    .scene-overlay .stat-label {
      color: #888;
    }
    
    .scene-overlay .stat-value {
      color: #eee;
      font-weight: 600;
    }
    
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #666;
      font-size: 13px;
    }
    
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    
    #stats {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(22, 33, 62, 0.9);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 11px;
      color: #aaa;
      border: 1px solid #0f3460;
    }
    
    #stats div {
      margin-bottom: 2px;
    }
    
    #stats div:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="loader"></div>
    <p>正在加载三维场景...</p>
  </div>
  
  <div id="app">
    <div id="header">
      <h1>🚗 立体停车库调度三维复核工具</h1>
      <div class="tools">
        <button id="btn-load-sample">📁 加载示例数据</button>
        <button id="btn-export-json">📤 导出异常帧</button>
        <button id="btn-export-report">📋 导出复核报告</button>
      </div>
    </div>
    
    <div id="main">
      <div id="scene-container">
        <div class="scene-overlay" id="scene-info">
          <div class="stat-row">
            <span class="stat-label">总层数:</span>
            <span class="stat-value" id="stat-floors">-</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">总车位数:</span>
            <span class="stat-value" id="stat-slots">-</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">升降机:</span>
            <span class="stat-value" id="stat-elevators">-</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">当前车辆:</span>
            <span class="stat-value" id="stat-cars">0</span>
          </div>
        </div>
        <div id="stats">
          <div>FPS: <span id="stat-fps">60</span></div>
          <div>帧号: <span id="stat-frame">0</span></div>
        </div>
      </div>
      
      <div id="right-panel">
        <div class="panel-section">
          <h3>⏱️ 播放控制</h3>
          <div class="btn-group">
            <button id="btn-play">▶ 播放</button>
            <button id="btn-pause">⏸ 暂停</button>
            <button id="btn-reset">⏮ 重置</button>
          </div>
          <div class="control-row" style="margin-top: 12px;">
            <label>速度:</label>
            <input type="range" id="speed-slider" min="0.5" max="10" step="0.5" value="1">
            <span id="speed-value">1.0x</span>
          </div>
        </div>
        
        <div class="panel-section">
          <h3>📊 视图控制</h3>
          <div class="btn-group">
            <button id="view-top">俯视</button>
            <button id="view-front">正视</button>
            <button id="view-side">侧视</button>
            <button id="view-free" class="active">自由</button>
          </div>
          <div class="btn-group" style="margin-top: 8px;">
            <button id="btn-toggle-floors">显示/隐藏楼层</button>
            <button id="btn-toggle-labels">显示/隐藏标签</button>
          </div>
        </div>
        
        <div class="panel-section">
          <h3>⚠️ 风险检测列表</h3>
          <div id="risk-list">
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
              <p>暂无检测到风险</p>
              <p style="font-size: 11px; margin-top: 4px; color: #555;">加载数据后将自动开始检测</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div id="footer">
      <div class="time-info">
        <div class="label">当前时间</div>
        <div class="value" id="current-time">00:00:00</div>
      </div>
      <div class="time-info">
        <div class="label">总时长</div>
        <div class="value" id="total-time">00:00:00</div>
      </div>
      <div id="timeline-container">
        <div id="timeline-progress"></div>
        <div id="timeline-marker"></div>
        <div id="timeline-ticks"></div>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
