server:
  port: 8080

spring:
  application:
    name: notebook-execution-artifact
  datasource:
    url: jdbc:h2:file:./data/notebookdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.notebook.artifact: DEBUG
