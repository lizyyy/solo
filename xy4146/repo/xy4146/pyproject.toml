[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-merger"
version = "0.1.0"
authors = [
  { name="Offsite Survey Team", email="survey@example.com" }
]
description = "离线采集包合并器 - 专为外勤测绘小组设计的多来源数据合并工具"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0.0",
    "pandas>=1.3.0",
    "gpxpy>=1.5.0",
    "pillow>=8.0.0",
    "pyproj>=3.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
offline-merger = "offline_merger.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["offline_merger*"]
