<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 300 200" 
     width="300mm" 
     height="200mm">
  
  <g id="registration-marks">
    <circle id="reg-tl" cx="10" cy="10" r="5" fill="none" stroke="#000000" stroke-width="0.5"/>
    <circle id="reg-tr" cx="290" cy="10" r="5" fill="none" stroke="#000000" stroke-width="0.5"/>
    <circle id="reg-br" cx="290" cy="190" r="5" fill="none" stroke="#000000" stroke-width="0.5"/>
    <circle id="reg-bl" cx="10" cy="190" r="5" fill="none" stroke="#000000" stroke-width="0.5"/>
  </g>
  
  <g id="dieline">
    <path id="outer-cut" 
          d="M 20 20 L 280 20 L 280 180 L 20 180 Z" 
          fill="none" 
          stroke="#FF0000" 
          stroke-width="0.5"/>
    
    <path id="inner-fold-1" 
          d="M 60 20 L 60 180" 
          fill="none" 
          stroke="#00FF00" 
          stroke-width="0.25"
          stroke-dasharray="2 1"/>
    
    <path id="inner-fold-2" 
          d="M 240 20 L 240 180" 
          fill="none" 
          stroke="#00FF00" 
          stroke-width="0.25"
          stroke-dasharray="2 1"/>
  </g>
  
  <g id="content-area">
    <rect id="safe-area" x="23" y="23" width="254" height="154" 
          fill="none" stroke="#CCCCCC" stroke-width="0.25" stroke-dasharray="1 1"/>
    
    <rect id="product-image" x="80" y="40" width="140" height="80" 
          fill="PANTONE 185 C" fill-opacity="0.1" stroke="PANTONE 185 C" stroke-width="0.5"/>
    
    <rect id="info-box" x="80" y="130" width="140" height="35" 
          fill="none" stroke="#333333" stroke-width="0.5"/>
  </g>
</svg>
