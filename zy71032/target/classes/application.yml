spring:
  application:
    name: gauge-calibration-api
  datasource:
    url: jdbc:h2:file:./data/gauge_calibration;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8081

logging:
  level:
    com.factory.gauge: DEBUG
    org.hibernate.SQL: DEBUG
