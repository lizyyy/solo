{% extends "base.html" %}

{% block title %}导入数据 - 历史街区招牌整治{% endblock %}

{% block content %}
<div class="card">
    <h2>导入路口照片数据</h2>
    <p class="muted" style="margin-bottom: 15px;">
        系统会自动根据"源文件名 + 行内容"生成唯一ID，重复数据自动跳过，数量不翻倍。
        导入结果会明确区分<strong>新增记录</strong>和<strong>复用记录</strong>。
    </p>
    
    <div class="form-group">
        <label>源文件名称</label>
        <input type="text" id="sourceFile" value="路口照片批次_202401.csv">
    </div>
    <div class="form-group">
        <label>操作人</label>
        <input type="text" id="operator" value="市政巡检员-小付">
    </div>
    <div class="form-group">
        <label>数据（JSON格式数组）</label>
        <textarea id="dataInput" style="min-height: 200px; font-family: monospace; font-size: 12px;">[
  {
    "路口名称": "中山路与人民路交叉口",
    "拍摄时间": "2024-01-15",
    "招牌状态": "待整治"
  },
  {
    "路口名称": "历史街区南口",
    "拍摄时间": "2024-01-15",
    "招牌状态": "已整治"
  },
  {
    "路口名称": "历史街区北口",
    "拍摄时间": "2024-01-15",
    "招牌状态": "待整治"
  }
]</textarea>
    </div>
    <button class="btn btn-primary" onclick="doImport()">开始导入</button>
    
    <div id="importResult" style="margin-top: 20px; display: none;"></div>
</div>

<div class="card">
    <h2>测试去重功能</h2>
    <p class="muted" style="margin-bottom: 10px;">
        点击下面按钮，使用相同数据再次导入，验证不会重复计数，且能看到哪些是复用记录。
    </p>
    <button class="btn btn-warning" onclick="doImport()">再次导入相同数据（验证去重）</button>
</div>

<script>
function doImport() {
    const sourceFile = document.getElementById('sourceFile').value;
    const operator = document.getElementById('operator').value;
    let rows;
    
    try {
        rows = JSON.parse(document.getElementById('dataInput').value);
    } catch(e) {
        alert('JSON格式错误: ' + e.message);
        return;
    }
    
    fetch('/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rows: rows, source_file: sourceFile, operator: operator })
    }).then(r => r.json()).then(data => {
        const resultDiv = document.getElementById('importResult');
        resultDiv.style.display = 'block';
        
        let newRowsHtml = '';
        if (data.new_records && data.new_records.length > 0) {
            newRowsHtml = '<h4 style="margin: 10px 0 5px; color: #2e7d32;">新增记录 (' + data.new_count + ' 条)</h4>';
            newRowsHtml += '<table style="font-size: 13px;"><thead><tr><th>路口名称</th><th>行号</th><th>类型</th></tr></thead><tbody>';
            data.new_records.forEach(r => {
                newRowsHtml += '<tr><td>' + r.intersection_name + '</td><td>第 ' + r.row_number + ' 行</td>';
                newRowsHtml += '<td><span style="color: #2e7d32; font-weight: 500;">' + r.type + '</span></td></tr>';
            });
            newRowsHtml += '</tbody></table>';
        }
        
        let reusedRowsHtml = '';
        if (data.reused_records && data.reused_records.length > 0) {
            reusedRowsHtml = '<h4 style="margin: 15px 0 5px; color: #f57c00;">复用记录 (' + data.reused_count + ' 条)</h4>';
            reusedRowsHtml += '<p class="muted" style="font-size: 12px; margin-bottom: 8px;">以下记录已存在，保留原状态和历史，不重复计数（RULE_003）</p>';
            reusedRowsHtml += '<table style="font-size: 13px;"><thead><tr><th>路口名称</th><th>行号</th><th>原始导入时间</th><th>当前状态</th></tr></thead><tbody>';
            data.reused_records.forEach(r => {
                reusedRowsHtml += '<tr><td>' + r.intersection_name + '</td><td>第 ' + r.row_number + ' 行</td>';
                reusedRowsHtml += '<td class="muted">' + r.original_import_time + '</td>';
                reusedRowsHtml += '<td><span class="status status-' + r.current_status + '">' + r.current_status + '</span></td></tr>';
            });
            reusedRowsHtml += '</tbody></table>';
        }
        
        resultDiv.innerHTML = `
            <div class="alert alert-info">
                <strong>导入完成！</strong><br>
                输入总数: ${data.total_input} 条<br>
                <span style="color: #2e7d32;">新增: ${data.new_count} 条</span> &nbsp;|&nbsp; 
                <span style="color: #f57c00;">复用: ${data.reused_count} 条</span><br>
                <span class="muted" style="font-size: 12px;">${data.note}</span>
            </div>
            ${newRowsHtml}
            ${reusedRowsHtml}
            <div style="margin-top: 15px;">
                <a href="{{ url_for('index') }}" class="btn btn-small btn-primary">返回首页查看</a>
            </div>
        `;
    });
}
</script>
{% endblock %}
