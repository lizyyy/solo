# YAML Configuration Example
# This is a properly structured YAML config file

app:
  name: My YAML Application
  version: 2.0.0
  environment: production
  debug: false

server:
  host: 0.0.0.0
  port: 8080
  ssl: true
  cors:
    enabled: true
    origins:
      - https://example.com
      - https://app.example.com

database:
  primary:
    host: db.example.com
    port: 5432
    name: production_db
    user: app_user
    ssl_mode: verify-full
  replica:
    host: replica.example.com
    port: 5432
    read_only: true

logging:
  level: INFO
  format: json
  outputs:
    - type: stdout
    - type: file
      path: /var/log/app.log

cache:
  redis:
    host: cache.example.com
    port: 6379
    db: 0
    ttl: 300

features:
  new_ui: true
  beta_features: false
  analytics_enabled: true
