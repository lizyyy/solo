[project]
name = "signup-handler"
version = "0.1.0"
description = "微信群接龙报名自动化处理工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pandas>=1.5.0",
    "jinja2>=3.0.0",
    "python-dateutil>=2.8.0",
    "phonenumbers>=8.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
signup = "signup_handler.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
