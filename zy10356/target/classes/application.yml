server:
  port: 8080

spring:
  application:
    name: feature-flag-audit
  datasource:
    url: jdbc:h2:mem:featureflagdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.featureflag.audit: DEBUG
    org.springframework.web: INFO
