server:
  port: 8080

spring:
  application:
    name: battery-dispatch-api

  datasource:
    url: jdbc:h2:file:./data/battery_dispatch;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

app:
  battery:
    low-battery-threshold: 20
  dispatch:
    photo-required: true
