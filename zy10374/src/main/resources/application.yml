server:
  port: 8080
  servlet:
    context-path: /api-slimming

spring:
  application:
    name: api-response-slimming-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:api_slimming;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.api.slimming: debug
    org.springframework.web: info
