replicaCount: 1

image:
  repository: myapp
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

database:
  host: localhost
  port: 5432
  name: myapp
  username: admin
  password: changeme

ingress:
  enabled: false
  hosts:
    - host: myapp.local
      paths: [/]

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5

logging:
  level: info
  format: json
