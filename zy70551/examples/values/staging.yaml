replicaCount: 2

image:
  tag: staging
  pullPolicy: Always

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

database:
  host: staging-db.example.com
  password: staging-password

ingress:
  enabled: true
  hosts:
    - host: staging.myapp.example.com
      paths: [/]

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

logging:
  level: debug
