[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "complaint-order-upgrade-cli"
version = "0.1.0"
authors = [
  { name="Your Name", email="your.email@example.com" }
]
description = "投诉工单包投诉升级整理 CLI 工具"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "click>=8.0",
  "pandas>=1.3",
  "openpyxl>=3.0",
]

[project.scripts]
complaint-upgrade-cli = "complaint_order_cli.main:cli"
