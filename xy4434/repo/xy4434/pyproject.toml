[project]
name = "glass-inspector"
version = "0.1.0"
description = "玻璃吹制试样质检助手"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "pandas>=2.1.0",
    "sqlalchemy>=2.0.0",
    "jieba>=0.42.1",
    "click>=8.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
glass-inspector = "glass_inspector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glass_inspector"]
