<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队邀请权限 API - 管理控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 12px; margin-bottom: 30px; }
        h1 { font-size: 28px; margin-bottom: 8px; }
        .subtitle { opacity: 0.9; font-size: 14px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-value { font-size: 32px; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 14px; color: #666; margin-top: 5px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 12px 24px; background: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .tab.active { background: #667eea; color: white; }
        .tab:hover { background: #e8eaf6; }
        .tab.active:hover { background: #5a6fd6; }
        .panel { display: none; background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .panel.active { display: block; }
        .toolbar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .search-box { flex: 1; min-width: 200px; padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .select-box { padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; min-width: 150px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-danger { background: #f56565; color: white; }
        .btn-danger:hover { background: #e53e3e; }
        .btn-success { background: #48bb78; color: white; }
        .btn-success:hover { background: #38a169; }
        .btn-outline { background: white; border: 1px solid #ddd; color: #333; }
        .btn-outline:hover { background: #f5f5f5; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; font-size: 13px; color: #666; }
        tr:hover { background: #f8f9fa; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-active { background: #c6f6d5; color: #22543d; }
        .badge-pending { background: #feebc8; color: #744210; }
        .badge-used { background: #bee3f8; color: #2a4365; }
        .badge-revoked { background: #fed7d7; color: #742a2a; }
        .badge-expired { background: #e2e8f0; color: #4a5568; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        .form-input { width: 100%; padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-textarea { width: 100%; padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; min-height: 80px; resize: vertical; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .detail-row { display: flex; padding: 10px 0; border-bottom: 1px solid #eee; }
        .detail-label { width: 150px; font-weight: 500; color: #666; }
        .detail-value { flex: 1; }
        .action-btn { padding: 6px 12px; font-size: 12px; margin-right: 5px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; color: white; font-size: 14px; z-index: 2000; animation: slideIn 0.3s ease; }
        .toast-success { background: #48bb78; }
        .toast-error { background: #f56565; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 团队邀请权限 API</h1>
            <div class="subtitle">管理邀请链接、审批流程、域名白名单及审计日志</div>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value">-</div>
                <div class="stat-label">总邀请数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">-</div>
                <div class="stat-label">有效邀请</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">-</div>
                <div class="stat-label">待审批</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">-</div>
                <div class="stat-label">已使用</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">-</div>
                <div class="stat-label">已撤销</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="invitations">邀请管理</button>
            <button class="tab" data-tab="approvals">审批中心</button>
            <button class="tab" data-tab="domains">域名白名单</button>
            <button class="tab" data-tab="audit">审计日志</button>
        </div>

        <div class="panel active" id="panel-invitations">
            <div class="toolbar">
                <input type="text" class="search-box" id="invite-search" placeholder="搜索邮箱...">
                <select class="select-box" id="invite-status">
                    <option value="">全部状态</option>
                    <option value="active">有效</option>
                    <option value="pending">待审批</option>
                    <option value="used">已使用</option>
                    <option value="revoked">已撤销</option>
                    <option value="expired">已过期</option>
                </select>
                <button class="btn btn-primary" onclick="showCreateModal()">+ 创建邀请</button>
                <button class="btn btn-outline" onclick="exportData()">导出数据</button>
            </div>
            <div class="table-wrapper">
                <table id="invite-table">
                    <thead>
                        <tr>
                            <th>受邀人</th>
                            <th>邀请人</th>
                            <th>角色</th>
                            <th>项目ID</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="panel" id="panel-approvals">
            <div class="toolbar">
                <select class="select-box" id="approval-status">
                    <option value="">全部状态</option>
                    <option value="pending">待审批</option>
                    <option value="approved">已通过</option>
                    <option value="rejected">已拒绝</option>
                </select>
                <button class="btn btn-outline" onclick="loadApprovals()">刷新</button>
            </div>
            <div class="table-wrapper">
                <table id="approval-table">
                    <thead>
                        <tr>
                            <th>受邀人</th>
                            <th>申请人</th>
                            <th>原因</th>
                            <th>状态</th>
                            <th>申请时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="panel" id="panel-domains">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="showAddDomainModal()">+ 添加域名</button>
                <button class="btn btn-outline" onclick="loadDomains()">刷新</button>
            </div>
            <div class="table-wrapper">
                <table id="domain-table">
                    <thead>
                        <tr>
                            <th>域名</th>
                            <th>状态</th>
                            <th>添加时间</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="panel" id="panel-audit">
            <div class="toolbar">
                <select class="select-box" id="audit-action">
                    <option value="">全部操作</option>
                    <option value="create_invitation">创建邀请</option>
                    <option value="use_invitation">使用邀请</option>
                    <option value="revoke_invitation">撤销邀请</option>
                    <option value="process_approval">处理审批</option>
                    <option value="add_domain">添加域名</option>
                </select>
                <select class="select-box" id="audit-status">
                    <option value="">全部结果</option>
                    <option value="success">成功</option>
                    <option value="error">失败</option>
                </select>
                <button class="btn btn-outline" onclick="loadAudit()">刷新</button>
            </div>
            <div class="table-wrapper">
                <table id="audit-table">
                    <thead>
                        <tr>
                            <th>操作</th>
                            <th>结果</th>
                            <th>操作者</th>
                            <th>时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="createModal">
        <div class="modal-content">
            <div class="modal-title">创建邀请链接</div>
            <div class="form-group">
                <label class="form-label">邀请人邮箱</label>
                <input type="email" class="form-input" id="create-inviter" value="admin@company.com">
            </div>
            <div class="form-group">
                <label class="form-label">受邀人邮箱</label>
                <input type="email" class="form-input" id="create-invitee" placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label class="form-label">角色</label>
                <select class="form-input" id="create-role"></select>
            </div>
            <div class="form-group">
                <label class="form-label">项目ID</label>
                <input type="text" class="form-input" id="create-project" value="PROJECT-001">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('createModal')">取消</button>
                <button class="btn btn-primary" onclick="createInvitation()">创建</button>
            </div>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-title">邀请详情</div>
            <div id="detail-content"></div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('detailModal')">关闭</button>
            </div>
        </div>
    </div>

    <div class="modal" id="revokeModal">
        <div class="modal-content">
            <div class="modal-title">撤销邀请</div>
            <input type="hidden" id="revoke-id">
            <div class="form-group">
                <label class="form-label">撤销原因</label>
                <textarea class="form-textarea" id="revoke-reason" placeholder="请输入撤销原因..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('revokeModal')">取消</button>
                <button class="btn btn-danger" onclick="confirmRevoke()">确认撤销</button>
            </div>
        </div>
    </div>

    <div class="modal" id="useModal">
        <div class="modal-content">
            <div class="modal-title">使用邀请链接</div>
            <input type="hidden" id="use-token">
            <div class="form-group">
                <label class="form-label">使用者邮箱</label>
                <input type="email" class="form-input" id="use-email" placeholder="user@example.com">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('useModal')">取消</button>
                <button class="btn btn-success" onclick="confirmUse()">确认使用</button>
            </div>
        </div>
    </div>

    <div class="modal" id="approvalModal">
        <div class="modal-content">
            <div class="modal-title" id="approval-title">审批</div>
            <input type="hidden" id="approval-id">
            <input type="hidden" id="approval-action">
            <div class="form-group">
                <label class="form-label">审批人</label>
                <input type="text" class="form-input" id="approval-approver" value="admin">
            </div>
            <div class="form-group">
                <label class="form-label">审批意见</label>
                <textarea class="form-textarea" id="approval-reason" placeholder="请输入审批意见..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('approvalModal')">取消</button>
                <button class="btn" id="approval-btn" onclick="confirmApproval()">确认</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addDomainModal">
        <div class="modal-content">
            <div class="modal-title">添加域名白名单</div>
            <div class="form-group">
                <label class="form-label">域名</label>
                <input type="text" class="form-input" id="domain-name" placeholder="company.com">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('addDomainModal')">取消</button>
                <button class="btn btn-primary" onclick="addDomain()">添加</button>
            </div>
        </div>
    </div>

    <div class="modal" id="auditDetailModal">
        <div class="modal-content">
            <div class="modal-title">审计日志详情</div>
            <div id="audit-detail-content"></div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('auditDetailModal')">关闭</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
