[tool.poetry]
name = "terraform-drift-summary"
version = "0.1.0"
description = "Terraform漂移摘要CLI - 从plan输出生成简洁、可操作的漂移报告"
authors = ["Your Name <your@email.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.7"
jinja2 = "^3.1.3"
python-dotenv = "^1.0.0"
rich = "^13.7.0"
pydantic = "^2.5.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
black = "^23.10.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tf-drift-summary = "terraform_drift_summary.cli:main"
