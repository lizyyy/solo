[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "water_quality_simulator"
version = "0.1.0"
description = "育苗池水质换水推演器 - 水产育苗场水质科学计算工具"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pydantic>=2.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
wqs = "water_quality_simulator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
