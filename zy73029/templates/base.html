<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}异宠温控回访追踪{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .timeline-dot { width: 12px; height: 12px; border-radius: 9999px; flex-shrink: 0; margin-top: 5px; }
    .code-block { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
    details summary { cursor: pointer; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <a href="{{ url_for('index') }}" class="flex items-center gap-2 group">
        <span class="text-2xl">🌡</span>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-900 group-hover:text-indigo-600 transition">
            异宠温控回访追踪
          </h1>
          <p class="text-xs text-slate-500 hidden sm:block">Exotic Pet Temp-Control Follow-up Tracker</p>
        </div>
      </a>
      <nav class="flex items-center gap-2 sm:gap-3">
        <a href="{{ url_for('index') }}" class="text-sm px-3 py-1.5 rounded-md hover:bg-slate-100 text-slate-700">汇总</a>
        <a href="{{ url_for('record_new') }}" class="text-sm px-3 py-1.5 rounded-md bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm font-medium">
          + 新材料
        </a>
      </nav>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-7xl mx-auto px-4 sm:px-6 py-6 text-xs text-slate-400 border-t border-slate-200 mt-8">
    数据持久化存储于 <code class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">data/records.json</code>，服务重启后历史数据、时间线、疑点记录、人工改判均可追溯。
  </footer>
</body>
</html>
