<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL慢查询归因板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #2c3e50; margin-bottom: 20px; text-align: center; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .stat-card h3 { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #2c3e50; }
        .stat-card.warning .value { color: #e74c3c; }
        .stat-card.success .value { color: #27ae60; }
        
        .actions { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.3s; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #229954; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #e67e22; }
        
        .import-section { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px; display: none; }
        .import-section.show { display: block; }
        .file-upload { border: 2px dashed #bdc3c7; padding: 30px; text-align: center; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .file-upload:hover { border-color: #3498db; background: #f8f9fa; }
        .file-upload input { display: none; }
        .import-result { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; }
        .import-result.success { background: #d4edda; color: #155724; display: block; }
        .import-result.error { background: #f8d7da; color: #721c24; display: block; }
        
        .filters { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; color: #7f8c8d; }
        .filter-group input, .filter-group select { padding: 8px 12px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 14px; }
        
        .query-list { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .query-item { padding: 20px; border-bottom: 1px solid #ecf0f1; transition: background 0.3s; }
        .query-item:hover { background: #f8f9fa; }
        .query-item.invalid { background: #fff5f5; border-left: 4px solid #e74c3c; }
        .query-item.optimized { background: #f0fff4; border-left: 4px solid #27ae60; }
        .query-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .query-meta { display: flex; gap: 20px; flex-wrap: wrap; }
        .meta-item { display: flex; flex-direction: column; gap: 3px; }
        .meta-label { font-size: 12px; color: #7f8c8d; }
        .meta-value { font-size: 14px; font-weight: 500; color: #2c3e50; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-pending { background: #f39c12; color: white; }
        .status-optimized { background: #27ae60; color: white; }
        .status-invalid { background: #e74c3c; color: white; }
        
        .query-sql { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 13px; overflow-x: auto; margin-bottom: 15px; white-space: pre-wrap; }
        
        .query-details { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .detail-section { background: #f8f9fa; padding: 15px; border-radius: 6px; }
        .detail-section h4 { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; text-transform: uppercase; }
        .detail-section p { font-size: 13px; color: #2c3e50; line-height: 1.6; white-space: pre-wrap; }
        
        .query-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-small { padding: 8px 16px; font-size: 13px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 500px; max-width: 90%; }
        .modal-content h3 { margin-bottom: 20px; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #7f8c8d; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 14px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px; }
        
        .errors-section { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-top: 25px; display: none; }
        .errors-section.show { display: block; }
        .error-item { padding: 15px; background: #fff5f5; border-left: 4px solid #e74c3c; margin-bottom: 10px; border-radius: 4px; }
        .error-item h4 { color: #c0392b; margin-bottom: 5px; }
        .error-item p { font-size: 13px; color: #7f8c8d; }
        .error-time { font-size: 11px; color: #95a5a6; margin-top: 5px; }

        .permission-notice { background: #fff3cd; padding: 15px; border-radius: 6px; margin-bottom: 20px; border-left: 4px solid #ffc107; }
        .permission-notice h4 { color: #856404; margin-bottom: 8px; }
        .permission-notice p { color: #856404; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SQL慢查询归因板</h1>
        
        <div class="permission-notice">
            <h4>权限提示</h4>
            <p>只有对应负责人可以修改查询状态。导入数据时请确保SQL格式正确，危险操作会被拦截。</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>总查询数</h3>
                <div class="value" id="total-count">0</div>
            </div>
            <div class="stat-card">
                <h3>待处理</h3>
                <div class="value" id="pending-count">0</div>
            </div>
            <div class="stat-card success">
                <h3>已优化</h3>
                <div class="value" id="optimized-count">0</div>
            </div>
            <div class="stat-card warning">
                <h3>无效查询</h3>
                <div class="value" id="invalid-count">0</div>
            </div>
            <div class="stat-card">
                <h3>平均执行时间</h3>
                <div class="value" id="avg-time">0s</div>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="toggleImport()">批量导入</button>
            <button class="btn btn-success" onclick="exportData()">导出报表</button>
            <button class="btn btn-warning" onclick="toggleErrors()">查看错误日志</button>
            <button class="btn btn-primary" onclick="loadQueries()">刷新数据</button>
        </div>
        
        <div class="import-section" id="import-section">
            <h3>批量导入数据</h3>
            <p style="margin-bottom: 15px; color: #7f8c8d;">支持JSON和CSV格式，样例数据包含脏数据用于测试验证流程。</p>
            <div class="file-upload" onclick="document.getElementById('file-input').click()">
                <p>点击选择文件或拖拽文件到此处</p>
                <p style="font-size: 12px; color: #95a5a6; margin-top: 10px;">支持 .json, .csv 格式</p>
            </div>
            <input type="file" id="file-input" accept=".json,.csv" onchange="handleFileUpload(event)">
            <div class="import-result" id="import-result"></div>
            <div style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="loadSampleData()">加载样例数据（含脏数据）</button>
            </div>
        </div>
        
        <div class="filters">
            <div class="filter-group">
                <label>状态</label>
                <select id="filter-status" onchange="loadQueries()">
                    <option value="">全部</option>
                    <option value="pending">待处理</option>
                    <option value="optimized">已优化</option>
                    <option value="processing">处理中</option>
                </select>
            </div>
            <div class="filter-group">
                <label>负责人</label>
                <input type="text" id="filter-owner" placeholder="输入负责人">
            </div>
            <div class="filter-group">
                <label>仅显示无效</label>
                <input type="checkbox" id="filter-invalid" onchange="loadQueries()">
            </div>
        </div>
        
        <div class="query-list" id="query-list"></div>
        
        <div class="errors-section" id="errors-section">
            <h3>错误日志</h3>
            <div id="errors-list"></div>
        </div>
    </div>
    
    <div class="modal" id="status-modal">
        <div class="modal-content">
            <h3>更新查询状态</h3>
            <div class="form-group">
                <label>状态</label>
                <select id="status-select">
                    <option value="pending">待处理</option>
                    <option value="processing">处理中</option>
                    <option value="optimized">已优化</option>
                </select>
            </div>
            <div class="form-group">
                <label>操作人</label>
                <input type="text" id="changed-by" placeholder="输入您的姓名">
            </div>
            <div class="form-group">
                <label>备注</label>
                <textarea id="status-notes" rows="3" placeholder="输入优化备注..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveStatus()">保存</button>
            </div>
        </div>
    </div>

    <script>
        let currentQueryId = null;
        
        async function loadStats() {
            const res = await fetch('/api/stats/');
            const data = await res.json();
            document.getElementById('total-count').textContent = data.total_queries;
            document.getElementById('pending-count').textContent = data.pending_queries;
            document.getElementById('optimized-count').textContent = data.optimized_queries;
            document.getElementById('invalid-count').textContent = data.invalid_queries;
            document.getElementById('avg-time').textContent = data.avg_execution_time + 's';
        }
        
        async function loadQueries() {
            const res = await fetch('/api/queries/?limit=100');
            const queries = await res.json();
            
            const statusFilter = document.getElementById('filter-status').value;
            const invalidFilter = document.getElementById('filter-invalid').checked;
            
            const filtered = queries.filter(q => {
                if (statusFilter && q.status !== statusFilter) return false;
                if (invalidFilter && !q.is_valid) return false;
                return true;
            });
            
            const listEl = document.getElementById('query-list');
            listEl.innerHTML = filtered.map(q => `
                <div class="query-item ${!q.is_valid ? 'invalid' : ''} ${q.status === 'optimized' ? 'optimized' : ''}">
                    <div class="query-header">
                        <div class="query-meta">
                            <div class="meta-item">
                                <span class="meta-label">ID</span>
                                <span class="meta-value">${q.id}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">数据库</span>
                                <span class="meta-value">${q.database}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">执行时间</span>
                                <span class="meta-value">${q.execution_time}s</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">扫描行数</span>
                                <span class="meta-value">${q.rows_examined}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">负责人</span>
                                <span class="meta-value">${q.owner || '未分配'}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">优先级</span>
                                <span class="meta-value">${q.priority}</span>
                            </div>
                        </div>
                        <span class="status-badge status-${q.status} ${!q.is_valid ? 'status-invalid' : ''}">
                            ${!q.is_valid ? '无效' : (q.status === 'pending' ? '待处理' : q.status === 'optimized' ? '已优化' : '处理中')}
                        </span>
                    </div>
                    
                    ${!q.is_valid ? `<div style="background: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 15px; color: #721c24; font-size: 13px;">
                        <strong>校验失败：</strong>${q.validation_error}
                    </div>` : ''}
                    
                    <div class="query-sql">${escapeHtml(q.sql_content)}</div>
                    
                    <div class="query-details">
                        <div class="detail-section">
                            <h4>影响接口</h4>
                            <p>${q.affected_endpoints || '无'}</p>
                        </div>
                        <div class="detail-section">
                            <h4>执行计划分析</h4>
                            <p>${formatExecutionPlan(q.execution_plan)}</p>
                        </div>
                        <div class="detail-section">
                            <h4>索引建议</h4>
                            <p>${q.index_suggestion || '无'}</p>
                        </div>
                    </div>
                    
                    ${q.optimization_notes ? `
                    <div style="background: #e8f4f8; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                        <h4 style="font-size: 13px; color: #2980b9; margin-bottom: 8px;">优化备注</h4>
                        <p style="font-size: 13px;">${q.optimization_notes}</p>
                        ${q.optimized_at ? `<p style="font-size: 11px; color: #7f8c8d; margin-top: 8px;">优化时间: ${new Date(q.optimized_at).toLocaleString()}</p>` : ''}
                    </div>
                    ` : ''}
                    
                    <div class="query-actions">
                        <button class="btn btn-small btn-primary" onclick="openStatusModal(${q.id})">更新状态</button>
                    </div>
                </div>
            `).join('');
            
            loadStats();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatExecutionPlan(planJson) {
            try {
                const plan = JSON.parse(planJson);
                return `扫描表: ${plan.table_scans.join(', ')}\n预估成本: ${plan.estimated_cost}\n${plan.warnings.length > 0 ? '警告: ' + plan.warnings.join('; ') : '无警告'}`;
            } catch {
                return planJson || '无';
            }
        }
        
        function toggleImport() {
            document.getElementById('import-section').classList.toggle('show');
        }
        
        function toggleErrors() {
            const section = document.getElementById('errors-section');
            section.classList.toggle('show');
            if (section.classList.contains('show')) {
                loadErrors();
            }
        }
        
        async function loadErrors() {
            const res = await fetch('/api/errors/');
            const errors = await res.json();
            const listEl = document.getElementById('errors-list');
            listEl.innerHTML = errors.map(e => `
                <div class="error-item">
                    <h4>${e.type}</h4>
                    <p>${e.message}</p>
                    ${e.context ? `<p style="margin-top: 5px;">上下文: ${e.context.substring(0, 100)}...</p>` : ''}
                    <div class="error-time">${new Date(e.created_at).toLocaleString()}</div>
                </div>
            `).join('');
        }
        
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const res = await fetch('/api/queries/batch', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                
                const resultEl = document.getElementById('import-result');
                resultEl.className = 'import-result ' + (result.failed > 0 ? 'error' : 'success');
                resultEl.innerHTML = `
                    <strong>导入完成</strong><br>
                    成功: ${result.success} 条<br>
                    失败: ${result.failed} 条<br>
                    ${result.errors.length > 0 ? '错误详情: ' + result.errors.join('; ') : ''}
                `;
                resultEl.classList.add(result.failed > 0 ? 'error' : 'success');
                resultEl.style.display = 'block';
                
                loadQueries();
            } catch (err) {
                alert('导入失败: ' + err.message);
            }
            
            event.target.value = '';
        }
        
        async function loadSampleData() {
            const sampleData = [
                {
                    fingerprint: "select_users_by_id",
                    sql_content: "SELECT * FROM users WHERE id = 123 AND status = 'active'",
                    execution_time: 2.5,
                    rows_examined: 100000,
                    rows_sent: 1,
                    database: "user_db",
                    affected_endpoints: "/api/users, /api/profile",
                    owner: "张三",
                    priority: "high"
                },
                {
                    fingerprint: "join_orders_with_details",
                    sql_content: "SELECT o.*, od.* FROM orders o JOIN order_details od ON o.id = od.order_id WHERE o.user_id = 456 GROUP BY o.id ORDER BY o.created_at DESC",
                    execution_time: 5.8,
                    rows_examined: 500000,
                    rows_sent: 100,
                    database: "order_db",
                    affected_endpoints: "/api/orders, /api/order/details, /api/dashboard",
                    owner: "李四",
                    priority: "high"
                },
                {
                    fingerprint: "like_search_username",
                    sql_content: "SELECT id, username FROM users WHERE username LIKE '%john%' LIMIT 10",
                    execution_time: 3.2,
                    rows_examined: 200000,
                    rows_sent: 10,
                    database: "user_db",
                    affected_endpoints: "/api/search/users",
                    owner: "张三",
                    priority: "medium"
                },
                {
                    fingerprint: "invalid_sql_empty",
                    sql_content: "SELECT 1",
                    execution_time: 0.1,
                    rows_examined: 1,
                    rows_sent: 1,
                    database: "test_db",
                    affected_endpoints: "",
                    owner: "测试",
                    priority: "low"
                },
                {
                    fingerprint: "dangerous_drop_table",
                    sql_content: "DROP TABLE users",
                    execution_time: 0.01,
                    rows_examined: 0,
                    rows_sent: 0,
                    database: "user_db",
                    affected_endpoints: "",
                    owner: "恶意用户",
                    priority: "high"
                },
                {
                    fingerprint: "malformed_sql_syntax",
                    sql_content: "this is not a valid sql query",
                    execution_time: 0.0,
                    rows_examined: 0,
                    rows_sent: 0,
                    database: "unknown",
                    affected_endpoints: "api1,api2,api3,api4,api5,api6,api7,api8,api9,api10,api11,api12",
                    owner: "王五",
                    priority: "low"
                }
            ];
            
            const blob = new Blob([JSON.stringify(sampleData)], { type: 'application/json' });
            const file = new File([blob], 'sample_data.json', { type: 'application/json' });
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const res = await fetch('/api/queries/batch', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                
                const resultEl = document.getElementById('import-result');
                resultEl.className = 'import-result ' + (result.failed > 0 ? 'error' : 'success');
                resultEl.innerHTML = `
                    <strong>样例数据导入完成</strong><br>
                    成功: ${result.success} 条<br>
                    失败: ${result.failed} 条<br>
                    ${result.errors.length > 0 ? '错误详情: ' + result.errors.join('<br>') : ''}
                    <br><br>
                    <em>注意：无效SQL和危险操作已被系统标记拦截，可以在列表中查看红框标记的记录。</em>
                `;
                resultEl.style.display = 'block';
                
                loadQueries();
            } catch (err) {
                alert('导入失败: ' + err.message);
            }
        }
        
        function openStatusModal(queryId) {
            currentQueryId = queryId;
            document.getElementById('status-modal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('status-modal').classList.remove('show');
            currentQueryId = null;
        }
        
        async function saveStatus() {
            const status = document.getElementById('status-select').value;
            const changedBy = document.getElementById('changed-by').value;
            const notes = document.getElementById('status-notes').value;
            
            if (!changedBy) {
                alert('请输入操作人姓名');
                return;
            }
            
            try {
                const res = await fetch(`/api/queries/${currentQueryId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status, changed_by: changedBy, notes })
                });
                
                if (res.ok) {
                    closeModal();
                    loadQueries();
                    document.getElementById('status-notes').value = '';
                    document.getElementById('changed-by').value = '';
                } else {
                    alert('更新失败');
                }
            } catch (err) {
                alert('更新失败: ' + err.message);
            }
        }
        
        async function exportData() {
            try {
                const res = await fetch('/api/export/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                
                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = res.headers.get('Content-Disposition')?.split('filename=')[1] || 'slow_queries_export.xlsx';
                    a.click();
                    window.URL.revokeObjectURL(url);
                } else {
                    alert('导出失败');
                }
            } catch (err) {
                alert('导出失败: ' + err.message);
            }
        }
        
        document.getElementById('status-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        loadQueries();
    </script>
</body>
</html>
