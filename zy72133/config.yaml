project:
  name: "DJ曲库能量排序"
  version: "1.0.0"

audio:
  supported_formats:
    - ".mp3"
    - ".wav"
    - ".flac"
    - ".aac"
    - ".m4a"
  
  energy_analysis:
    sample_rate: 22050
    hop_length: 512

matching:
  fuzzy_match_threshold: 0.60
  version_patterns:
    - "v\\d+"
    - "version"
    - "master"
    - "final"
    - "old"
    - "new"
    - "原版"
    - "新版"
    - "母带"
    - "remix"
    - "edit"
    - "demo"
    - "preview"

exceptions:
  duplicate_threshold_days: 30
  license_keywords:
    - "授权"
    - "license"
    - "copyright"
    - "©"

output:
  report_format: "html"
  include_audit_trail: true
  include_conflict_evidence: true
